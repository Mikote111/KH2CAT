- id: 4995
  text: >-
    No hi ha res més bonic que veure

    les estrelles després d'una tempesta...
- id: 4996
  text: '{:unk0e 0A}El que donaria, per viure on ets tu.{:unk0e 00}'
- id: 4997
  text: '{:unk0e 0A}Què he de pagar, per venir al teu costat?{:unk0e 00}'
- id: 4998
  text: '{:unk0e 0A}El que faria per veure com em somrius.{:unk0e 00}'
- id: 4999
  text: >-
    {:unk0e 0A}Allà on córrer, allà on saltar,

    i sota el sol, l'estona passar.{:unk0e 00}
- id: 5000
  text: >-
    {:unk0e 0A}Tu i jo només, i així poder ser...

    part del teu món.{:unk0e 00}
- id: 5001
  text: La noia que em va rescatar... La seva veu...
- id: 5002
  text: Carai! Un altre cop sota el mar!
- id: 5003
  text: Ajà!
- id: 5004
  text: Sora! Donald! Goofy!
- id: 5005
  text: Eh... Com va?
- id: 5006
  text: Ja has oblidat com nedar?
- id: 5007
  text: Una mica... suposo.
- id: 5008
  text: >-
    Doncs a practicar s'ha dit!{:delay 6C 00}{:clear }Seguiu el Flounder.

    Ell us ensenyarà tot el que necessiteu.
- id: 5009
  text: Som-hi, Sora, tu pots!
- id: 5010
  text: '{:unk13 72 01 50 00}{:unk08 01 00 05}Així està molt millor!'
- id: 5011
  text: >-
    {:unk13 18 01 4A 01}{:unk08 01 01 01}I bé...{:clear }Què us porta

    per aquests mars?{:clear }Passa res?
- id: 5012
  text: '{:unk13 5E 01 50 00}{:unk08 01 00 05}Més o menys.'
- id: 5013
  text: >-
    {:unk13 A0 00 96 00}{:unk08 01 01 04}Però tot sembla

    estar en calma aquí.
- id: 5014
  text: >-
    {:unk13 5E 01 2C 01}{:unk08 01 01 00}Tot està bé... mentre el

    papa estigui de bon humor.
- id: 5015
  text: >-
    {:unk13 04 01 2C 01}{:unk08 01 01 01}Ei, celebrarem un

    concert molt aviat.{:clear }Per què no canteu en el

    meu espectacle musical?
- id: 5016
  text: >-
    {:unk13 2C 01 64 00}{:unk08 01 01 05}Si us plau, digueu que sí!

    L'Ariel està molt rara últimament.{:clear }Però potser es tranquilitza i

    practica si vosaltres hi participeu.
- id: 5017
  text: >-
    {:unk13 64 00 18 01}{:unk08 01 01 00}Pot ser

    divertit!
- id: 5018
  text: '{:unk13 AA 00 46 00}{:unk08 01 01 06}Pots comptar-hi!'
- id: 5019
  text: >-
    {:unk13 72 01 18 01}{:unk08 01 01 01}Excel・lent!{:clear }Ara, us mostraré el

    que necessiteu saber.
- id: 5020
  text: '{:unk13 AA 00 46 00}{:unk08 01 01 06}Què hem de fer?'
- id: 5021
  text: '{:unk13 72 01 04 01}{:unk08 01 01 01}És fàcil!'
- id: 5022
  text: >-
    {:unk13 96 00 64 00}{:unk08 01 00 05}Això és tot

    el que s'ha de fer.
- id: 5023
  text: '{:unk13 72 01 2C 01}{:unk08 01 00 00}Òndia, no ho sé...'
- id: 5024
  text: >-
    {:unk13 40 01 2C 01}{:unk08 01 01 00}Quan vulgueu cantar en una

    obra mestra de la música...{:clear }només heu de venir a veure'm.
- id: 5027
  text: "{:unk13 AA 00 46 00}{:unk08 01 01 06}Trenca't una aleta!"
- id: 5028
  text: '{:unk13 47 01 2D 00}{:unk08 01 00 04}Som-hi doncs!'
- id: 5029
  text: Sora, has estat impressionant!
- id: 5030
  text: Ei! Jo vull cantar més frases!
- id: 5031
  text: Sa Majestat! Tenim visita!
- id: 5032
  text: Rei Tritó!
- id: 5033
  text: >-
    Espero que no hagis tingut cap

    necessitat d'utilitzar la teva clau espasa.
- id: 5034
  text: >-
    No. Tot està tranquil.

    Ni un sol sensecor.
- id: 5035
  text: >-
    Sa Majestat, els nostres convidats

    volen cantar en el musical.
- id: 5036
  text: >-
    Perfecte!

    Em sembla una idea estupenda.
- id: 5037
  text: >-
    Potser sí necessitem la vostra ajuda.

    Vegeu.{:delay C6 00}{:clear }Em temo que l'Ariel segueix

    entossudida amb el món dels humans.{:delay 04 01}{:clear }Si els ensajos la mantinguessin ocupada,{:delay 9C 00}{:clear }deixaria de pensar en la

    vida de la superfície.
- id: 5038
  text: Aquella és la veu que vaig sentir! N'estic segur!
- id: 5039
  text: Hola? On t'amagues?
- id: 5040
  text: Sé que vas ser tu qui em va rescatar.
- id: 5041
  text: >-
    Si us plau, surt per a que

    pugui agrair-t'ho
- id: 5042
  text: Ariel?
- id: 5043
  text: >-
    Aquesta noia està rara un altre cop.{:delay 90 00}{:clear }Haurà estat flirtant

    per la superfície...{:delay 90 00}{:clear }Uuuhh, el Rei dels Mars

    m'arrencarà les pinces per això!
- id: 5044
  text: Va! Hem de seguir ensajant!
- id: 5045
  text: Ho sento, però no em ve de gust.
- id: 5046
  text: Noooo! Ariel!
- id: 5047
  text: Tinc una idea, Sebastià.
- id: 5048
  text: Ah, sí?
- id: 5049
  text: Sé com animar l'Ariel!{:delay 60 00}{:clear }Va! Seguiu-me!
- id: 5050
  text: '{:unk13 5A 00 C8 00}{:unk08 01 01 05}Per aquí!'
- id: 5051
  text: '{:unk13 F0 00 78 00}{:unk08 01 01 05}Mireu...'
- id: 5052
  text: >-
    {:unk13 5E 01 8C 00}{:unk08 01 01 05}Oh, no! Deu ser

    del món humà!
- id: 5053
  text: >-
    {:unk13 B4 00 E9 00}{:unk08 01 01 00}La vaig trobar després de la tempesta.

    Segur que és d'un naufragi.{:clear }No creieu que a l'Ariel

    la hi encantaria?
- id: 5054
  text: >-
    {:unk13 2C 01 2C 01}{:unk08 01 01 01}Però si el Rei del Mar

    ho descobreix...
- id: 5055
  text: '{:unk13 B0 00 54 01}{:unk08 01 01 00}És millor que anar a la superfície!'
- id: 5056
  text: "{:unk13 C8 00 18 01}{:unk08 01 01 01}Va, ajudeu-me a moure-la."
- id: 5057
  text: '{:unk13 F0 00 6E 00}{:unk08 01 01 05}És impossible.'
- id: 5058
  text: Ariel!
- id: 5059
  text: Volem que vinguis amb nosaltres.
- id: 5060
  text: Tenim una cosa per ensenyar-te!
- id: 5061
  text: Oohh!
- id: 5062
  text: És una estàtua molt súper, eh?
- id: 5063
  text: Sembla una espècie de príncep.
- id: 5064
  text: Un príncep?
- id: 5065
  text: Ariel...{:delay 44 00}{:clear }pots comptar amb nosaltres.
- id: 5066
  text: >-
    Oh, no!

    Vosaltres tres quedeu-vos al marge!
- id: 5067
  text: Mira qui parla!
- id: 5068
  text: >-
    Sí! Anaves a xerrar de

    tot això al seu pare!
- id: 5069
  text: Ai! Què faré ara...
- id: 5070
  text: >-
    {:unk13 72 01 5A 00}{:unk08 01 00 05}Arribes tard, Sebastià.

    Passa res?
- id: 5071
  text: '{:unk13 0E 01 96 00}{:unk08 01 01 06}No res, sa Majestat.'
- id: 5072
  text: "{:unk13 64 00 64 00}{:unk08 01 00 05}Me n'alegro."
- id: 5073
  text: >-
    {:unk13 B4 00 40 01}{:unk08 01 01 01}Bé, explica'm, com va

    la cançó per al musical?
- id: 5074
  text: >-
    {:unk13 7C 01 50 00}{:unk08 01 00 05}Està acabada,

    sa Majestat!
- id: 5075
  text: >-
    {:unk13 37 01 E5 00}I exalça totes les meravelles

    que tenim aquí a l'oceà.{:clear }Serà la meva millor obra.
- id: 5076
  text: >-
    {:unk13 AF 00 46 01}{:unk08 01 00 02}Aconseguirà que l'Ariel

    s'oblidi del món dels humans?
- id: 5077
  text: >-
    {:unk13 7C 01 0E 01}{:unk08 01 00 01}Eh, sí... bé...

    És probable...

    És possible...
- id: 5078
  text: '{:unk13 40 01 2C 01}{:unk08 01 01 01}Vu... vull dir... segur!'
- id: 5079
  text: >-
    {:unk13 2C 01 2C 01}{:unk08 01 01 01}Disculpi'm, sa Majestat, però

    haig d'ensajar... Ja m'entén.
- id: 5080
  text: >-
    {:unk13 8C 00 04 01}{:unk08 01 01 01}És terrible!

    Hem de fer alguna cosa.
- id: 5081
  text: >-
    {:unk13 72 01 2C 01}{:unk08 01 01 01}Ella no pot participar

    al musical així.
- id: 5082
  text: '{:unk13 B4 00 04 01}{:unk08 01 01 01}Jo cantaré la seva part!'
- id: 5083
  text: >-
    {:unk13 78 00 C8 00}{:unk08 01 01 01}De cap manera!

    Ni parlar-ne!
- id: 5084
  text: '{:unk13 5E 01 3C 00}{:unk08 01 00 05}Què? Per què no!?'
- id: 5085
  text: '{:unk13 2C 01 2C 01}{:unk08 01 01 01}Ei, és el Sebastià.'
- id: 5086
  text: '{:unk13 C1 00 DA 00}{:unk08 01 00 01}Això no funcionarà...'
- id: 5087
  text: '{:unk13 68 01 46 00}{:unk08 01 00 05}Què passa?'
- id: 5088
  text: >-
    {:unk13 40 01 50 00}{:unk08 01 00 06}He composat una cançó

    perfecta per al musical.{:clear }Però em sembla que serà massa

    complicat per a vosaltres.
- id: 5089
  text: '{:unk13 4C 01 29 00}{:unk08 01 01 04}Au va! No serà tan difícil.'
- id: 5090
  text: '{:unk13 72 01 2C 01}{:unk08 01 01 01}Eh...'
- id: 5091
  text: Capítol Tres
- id: 5092
  text: I bé? Què n'opines, Ariel?
- id: 5093
  text: >-
    Oh, em sembla que és una cançó genial,

    Sebastià. Però...{:delay CC 00}{:clear }no em ve de gust cantar-la.
- id: 5094
  text: >-
    Vull cantar alguna cosa...{:delay 5A 00}{:clear }que parli que els dos mons

    poden viure en harmonia.{:delay 96 00}{:clear }Terra i mar junts!
- id: 5095
  text: >-
    El Rei dels Mars em faria miques

    si cantéssis una cançó així!
- id: 5096
  text: >-
    Si no em penses fer cas...

    no penso cantar!
- id: 5097
  text: A... Ariel!
- id: 5098
  text: Per què em ficaré jo en aquests embolics?
- id: 5099
  text: >-
    La senyoreta s'ha hagut

    d'enamorar en el pitjor moment!{:delay 3E 01}{:clear }I per acabar-ho d'adobar d'un humà!
- id: 5100
  text: L'Ariel està enamorada d'un humà?
- id: 5101
  text: Mira que soc bocamoll!
- id: 5102
  text: '{:unk13 C8 00 2C 01}{:unk08 01 01 01}Oh!'
- id: 5103
  text: '{:unk13 72 01 64 00}És ell?'
- id: 5104
  text: '{:unk13 78 00 2C 01}Sí.'
- id: 5105
  text: '{:unk13 0E 01 5F 00}{:unk08 01 00 05}Anem a cridar-lo!'
- id: 5106
  text: '{:unk13 78 00 64 00}{:unk08 01 01 05}No! Si us plau!'
- id: 5107
  text: >-
    {:unk13 00 01 5C 00}{:unk08 01 00 05}És un humà i jo soc una sirena.

    No... no sé com reaccionaria...
- id: 5108
  text: '{:unk13 37 01 21 01}{:unk08 01 00 01}Li ha caigut alguna cosa!'
- id: 5109
  text: '{:unk13 74 01 78 00}{:unk08 01 00 06}Ah! Deu ser seu!'
- id: 5110
  text: '{:unk13 B4 00 78 00}{:unk08 01 01 04}Però no hi arribem...'
- id: 5111
  text: '{:unk13 20 01 AA 00}{:unk08 01 00 05}Jo!'
- id: 5112
  text: >-
    Què bé, Sora. Segur que

    ell s'alegra de recuperar-lo.
- id: 5113
  text: I digues-me, qui és ell?
- id: 5114
  text: Papa!
- id: 5115
  text: >-
    Ariel, saps quant

    perillosos són els humans!
- id: 5116
  text: >-
    Si ni tan sols el coneixes!{:delay 96 00}{:clear }Ohh... Papa, tu dius que

    no confies en els humans,{:delay D8 00}{:clear }però tots no poden ser

    tan dolents com dius.{:delay A8 00}{:clear }I jo...{:delay 48 00}{:clear }t'ho desmostaré.
- id: 5119
  text: I si aquesta és l'única forma...
- id: 5120
  text: Que així sigui!
- id: 5121
  text: ''
- id: 5122
  text: '{:unk13 40 01 54 01}{:unk08 01 01 03}Pobreta Ariel!'
- id: 5123
  text: >-
    {:unk13 C7 00 3C 00}{:unk08 01 00 05}Tu ets l'Úrsula, la Bruixa del Mar!

    No et va desterrar el meu pare?
- id: 5124
  text: >-
    {:unk13 2C 01 54 01}{:unk08 01 01 01}Exacte, angelet.

    Però anava a mantenir-me lluny...{:clear }sabent que erets tan desgraciada?

    El que tu necessites és consell femení.
- id: 5125
  text: >-
    {:unk13 AA 00 04 01}{:unk08 01 00 02}Què et semblaria si pogués

    fer els teus somnis realitat?
- id: 5126
  text: >-
    {:unk13 DC 00 2C 01}{:unk08 01 01 01}Mon pare mai

    m'ho permetria...
- id: 5127
  text: >-
    {:unk13 0E 01 54 01}{:unk08 01 00 02}Ah, bé. No deu ser amor si

    pots renunciar-hi tan fàcilment.
- id: 5128
  text: >-
    {:unk13 72 01 18 01}{:unk08 01 00 02}De debò... podries

    ajudar-me? Com?
- id: 5129
  text: >-
    {:unk13 AA 00 40 01}{:unk08 01 00 02}Bé... l'única manera

    d'aconseguir el que desitges...{:clear }és convertint-te tu

    mateixa en un ésser humà.
- id: 5130
  text: >-
    {:unk13 FA 00 50 00}{:unk08 01 01 05}En un humà?

    Pots fer-ho?
- id: 5131
  text: >-
    {:unk13 B4 00 40 01}{:unk08 01 00 02}Estimada, dolça criatura...

    és la meva especialitat.
- id: 5132
  text: >-
    {:unk13 72 01 8C 00}{:unk08 01 00 05}Això és terrible!

    Flounder!

    Has d'avisar el Rei!
- id: 5133
  text: "{:unk13 DC 00 40 01}{:unk08 01 00 01}D'acord!"
- id: 5134
  text: >-
    {:unk13 AF 00 11 01}{:unk08 01 01 01}Tracte fet?{:clear }Et convertiré en

    humana ara mateix.{:clear }L'únic que has de fer és

    firmar un petit contracte.
- id: 5135
  text: '{:unk13 9B 01 51 00}{:unk08 01 00 05}Un contracte?'
- id: 5136
  text: >-
    {:unk13 AA 00 2C 01}{:unk08 01 01 01}Correcte, estimada.{:clear }I el preu és simbòlic.

    Una bagatel・la. El que vull

    de tu és... la teva veu.
- id: 5137
  text: '{:unk13 9E 01 45 00}{:unk08 01 00 05}La... la meva veu?'
- id: 5138
  text: >-
    {:unk13 B4 00 40 01}{:unk08 01 01 01}Ah, gairebé me n'oblido.

    L'encanteri només dura tres dies.{:clear }Has d'aconseguir que el

    princepet aquell et besi abans...{:clear }que el sol es pongui,

    el tercer dia.{:clear }Si no, tornaràs a ser una

    sirena, i seràs meva!
- id: 5139
  text: >-
    {:unk13 DF 00 41 00}{:unk08 01 01 05}Pot ser que trobis les meves

    condicions una mica estrictes.{:clear }Després de tot, ets la

    filla del Rei Tritó.{:clear }Lloada per tota Atlàntica!{:clear }Carai, tens una vida

    feliç gairebé garantitzada.{:clear }Segur que no vols

    obeir ton paretó?{:clear }Només et costaria perdre

    el teu vertader amor.{:clear }Au va, estimada.

    És la teva última oportunitat.{:clear }Però tranquil・la, no et

    convenceré si no vols.
- id: 5140
  text: >-
    {:unk13 72 01 50 00}{:unk08 01 00 05}No la escoltis,

    Ariel!
- id: 5141
  text: >-
    Bé, no et molesto més.{:delay D2 00}{:clear }Ja me'n vaig.{:delay 78 00}{:clear }És evident que no 

    vols la meva ajuda.
- id: 5142
  text: >-
    És una pena això del teu príncepet.

    És tot un partit...
- id: 5143
  text: Espera!
- id: 5144
  text: Només haig de firmar?
- id: 5145
  text: Tracte fet!
- id: 5146
  text: Perfecte!
- id: 5147
  text: Ariel! No!
- id: 5148
  text: >-
    Sora, si us plau!

    Has d'impedir-li-ho!
- id: 5149
  text: Espera!
- id: 5150
  text: >-
    Oh, no!

    No pot respirar!
- id: 5151
  text: Ets tu aquella noia? Desperta!
- id: 5152
  text: Eh! Ves amb compte!
- id: 5153
  text: >-
    Què et passa?

    No pots parlar?
- id: 5154
  text: Ah, bé... I d'on vens?
- id: 5156
  text: "{:delay 54 00}Aquell és el meu penjoll!{:delay AE 00}{:clear }És increïble que l'hagis trobat."
- id: 5157
  text: Gràcies.
- id: 5158
  text: >-
    Si us plau, vine amb mi.

    Vull ajudar-te.
- id: 5159
  text: >-
    {:unk13 78 00 F0 00}{:unk08 01 00 03}Sembla que tot

    està anant molt bé!
- id: 5160
  text: >-
    {:unk13 7E 01 50 00}{:unk08 01 00 06}Òndia, no hauríem d'explicar

    tot això al Rei Tritó?
- id: 5161
  text: '{:unk13 54 01 2C 01}{:unk08 01 01 01}Ni parlar-ne!'
- id: 5165
  text: '{:unk13 A7 00 04 01}{:unk08 01 01 01}I ens limitem a observar?'
- id: 5166
  text: '{:unk13 72 01 C8 00}{:unk08 01 01 05}Tens una idea millor?'
- id: 5167
  text: >-
    {:unk13 AA 00 2C 01}{:unk08 01 01 01}Podríem fer que l'Úrsula

    arreglés tot això.
- id: 5168
  text: >-
    {:unk13 5E 01 3C 00}{:unk08 01 01 05}Ja! No es prendrà

    la molèstia.
- id: 5169
  text: >-
    {:unk13 0E 01 2C 01}{:unk08 01 00 01}Ei, mai se sap fins

    que ho intentes!
- id: 5170
  text: >-
    {:unk13 72 01 46 00}{:unk08 01 01 05}Mmm...

    Potser tinguis raó.{:clear }I allò és millor

    que res.{:clear }Puc confiar en que

    t'encarregarás de l'Úrsula?
- id: 5171
  text: '{:unk13 0E 01 64 00}{:unk08 01 01 05}És clar!'
- id: 5172
  text: >-
    Ei!

    On és el Sebastià?
- id: 5173
  text: Uhhh...{:delay 28 00}{:clear }{:delay 20 00}{:clear }El Rei Tritó volia veure'l en palau.
- id: 5174
  text: Em pregunto si serà per l'Ariel.
- id: 5175
  text: >-
    Si el Rei Tritó se n'adona,

    l'haurem feta bona,{:delay BE 00}{:clear }per haver-ho mantingut en secret.
- id: 5176
  text: I l'Úrsula?
- id: 5177
  text: S'ha esfumat.
- id: 5178
  text: >-
    Com li va a Ariel?

    Només té fins demà al capvespre.
- id: 5179
  text: Ei, mireu!
- id: 5180
  text: ''
- id: 5181
  text: No veig res!
- id: 5182
  text: Uuff, menys mal.
- id: 5183
  text: Vaja! Han estat molt a prop.
- id: 5184
  text: >-
    Em sembla que hauríem de seguir

    buscant l'Úrsula, no creieu?
- id: 5185
  text: Sí, bona idea.
- id: 5186
  text: No hi ha ni rastre de l'Úrsula...
- id: 5187
  text: >-
    On s'haurà ficat

    aquella bruixa dels mars?
- id: 5188
  text: Ahhh...
- id: 5189
  text: L'Ariel no ha parat de plorar.
- id: 5190
  text: "{:unk13 FA 00 72 01}{:unk0e 0A}El que donaria, per viure on ets tu.{:delay DE 00}{:clear } {:delay 32 00}{:clear }{:unk0e 0A}Què he de pagar, per venir al teu costat?{:delay 04 01}{:clear } {:delay 0A 00}{:clear }{:unk0e 0A}El que faria per veure com em somrius.{:delay 7C 01}{:clear }{:unk0e 0A}Allà on córrer, allà on saltar,{:delay C8 00}{:clear }{:unk0e 0A}i sota el sol, l'estona passar.{:delay 0E 01}{:clear } {:delay 14 00}{:clear }{:unk0e 0A}Tu i jo només, i així poder ser...{:delay 0E 01}{:clear } {:delay 14 00}{:clear }{:unk0e 0A}part del teu món.{:unk0e 00}"
- id: 5191
  text: '{:unk13 FA 00 54 01}Eh! Què li passa al príncep?'
- id: 5192
  text: '{:unk13 FA 00 54 01}Mireu allà!'
- id: 5193
  text: >-
    {:unk13 FA 00 54 01}És l'Úrsula! Es deu haver

    transformat en aquella noia!
- id: 5194
  text: '{:unk13 FA 00 54 01}No aguanto més!'
- id: 5195
  text: Què... què ha passat?
- id: 5196
  text: Eric!
- id: 5197
  text: Pots...{:delay 7B 00}{:clear }pots parlar...{:delay AD 00}{:clear }Erets tu...{:delay 66 00}{:clear }Aquella veu era teva...
- id: 5198
  text: Oh, Eric... Volia dir-t'ho...
- id: 5199
  text: >-
    És clar!{:delay 6C 00}{:clear }Vas ser tu!{:delay 72 00}{:clear }Tu em vas salvar

    aquella nit de tempesta!
- id: 5200
  text: Ah, Ariel...{:delay A2 00}{:clear }Sento no haver-me'n adonat abans.{:delay 96 00}{:clear }Tu ets qui estimo.
- id: 5201
  text: Eric...
- id: 5202
  text: No tan de pressa!
- id: 5203
  text: Veus el mateix que jo?
- id: 5204
  text: "{:delay 96 00}{:clear }S'ha acabat el temps!"
- id: 5205
  text: Ariel!
- id: 5206
  text: Alto!
- id: 5207
  text: ''
- id: 5208
  text: No us hi fiqueu, estúpids!
- id: 5209
  text: >-
    L'estimada filla del Tritó

    va firmar un contracte!
- id: 5210
  text: >-
    I ara, petita... ja veurem com

    de bella que ets quan acabi amb tu!
- id: 5211
  text: Aquell contracte no val!
- id: 5212
  text: Deixa-la anar!
- id: 5213
  text: Com!?
- id: 5214
  text: >-
    Vaja, vaja...{:delay 78 00}{:clear }ni tan sols el Rei Tritó

    pot permetre's el luxe{:delay BA 00}{:clear }d'inval・lidar un contracte.{:delay 7E 00}{:clear }No pot, no senyor.
- id: 5215
  text: >-
    I ara, si em disculpeu,

    tinc asumptes a atendre.
- id: 5216
  text: >-
    Espera, Úrsula! Tu guanyes.{:delay CD 00}{:clear }Però promet-me que

    deixaràs anar la meva filla.
- id: 5217
  text: >-
    Un contracte és un contracte...{:delay 78 00}{:clear }Tret que, és clar, que

    t'ofereixis per ocupar el seu lloc.
- id: 5218
  text: >-
    Em temo...

    que no hi tinc alternativa.
- id: 5219
  text: Sa Majestat!
- id: 5220
  text: Per fi!
- id: 5221
  text: Papa!
- id: 5222
  text: >-
    Ja! On és ara el «totpoderós»

    Senyor dels Mars?
- id: 5223
  text: Aparta't! Deixa el meu pare!
- id: 5224
  text: Eric!
- id: 5225
  text: Com t'atreveixes?
- id: 5226
  text: Patètic i insignificant humà!
- id: 5227
  text: Ei! Ja n'hi ha prou!
- id: 5228
  text: >-
    Ja, ja!

    Ara us postrareu davant meu!
- id: 5229
  text: Això ho veurem!
- id: 5230
  text: Que t'ho has cregut!
- id: 5231
  text: S'ha acabat, Úrsula!
- id: 5232
  text: Torna'm allò!
- id: 5233
  text: Com vulguis... aquí el tens!
- id: 5235
  text: Ariel...
- id: 5237
  text: No pot ser...
- id: 5239
  text: Vaja...
- id: 5241
  text: >-
    Si ho arribo a saber, hagués posat

    més obstinació en aprendre a nedar.
- id: 5242
  text: >-
    Bé, suposo que mai

    és tard per aprendre, no?
- id: 5243
  text: Vols ensenyar-m'hi?
- id: 5245
  text: >-
    {:unk13 4A 01 5A 00}{:unk08 01 01 06}El príncep Eric és un bon nano.

    I també és molt valent.
- id: 5246
  text: '{:unk13 C8 00 54 01}{:unk08 01 01 03}Sí. Però és un humà.'
- id: 5247
  text: '{:unk13 18 01 50 00}{:unk08 01 00 04}Uuff... Un altre cop no...'
- id: 5248
  text: >-
    {:unk13 8C 00 2C 01}{:unk08 01 00 02}Com va amb el

    teu pare, Ariel?
- id: 5249
  text: >-
    {:unk13 48 01 CA 00}{:unk08 01 00 01}Genial! Gràcies per la teva ajuda.

    Haig d'anar-me'n. Us veuré després!
- id: 5250
  text: '{:unk13 90 01 50 00}{:unk08 01 01 05}Eh, espera...'
- id: 5251
  text: >-
    {:unk13 C8 00 50 00}{:unk08 01 01 04}Gairebé me n'oblido, Sebastià!{:clear }El Rei Tritó va dir que el festival

    d'aquest any és tan important...{:clear }que més val que el musical

    sigui el millor de la teva vida!
- id: 5252
  text: >-
    {:unk13 72 01 B4 00}{:unk08 01 01 05}El millor de la meva vida?

    Mmm...
- id: 5253
  text: '{:unk13 7C 01 50 00}{:unk08 01 01 05}A veure, què passa?'
- id: 5254
  text: '{:unk13 5E 01 72 01}{:unk08 01 01 01}Heu de fer-me un favor.'
- id: 5255
  text: '{:unk13 78 00 40 01}{:unk08 01 01 01}Què!?'
- id: 5256
  text: '{:unk13 D4 00 4E 00}{:unk08 01 00 05}Eh?'
- id: 5257
  text: '{:unk13 B1 01 3F 00}{:unk08 01 00 05}Impossible!'
- id: 5258
  text: >-
    {:unk13 EC 00 36 00}{:unk08 01 01 07}Anava a fer que la

    cançó fos perfecta...
- id: 5259
  text: '{:unk13 0E 01 C8 00}'
- id: 5260
  text: '{:unk13 96 00 96 00}{:unk08 01 01 05}No us oblideu de la meva cançó!'
- id: 5261
  text: Capítol Cinc
- id: 5262
  text: Sora, què ha sigut allò?
- id: 5263
  text: S'ha obert una nova porta.
- id: 5264
  text: Com!? Us en aneu?{:delay 9C 00}{:clear }És un adeu?
- id: 5265
  text: D'això res! Mai direm adeu!
- id: 5266
  text: >-
    Exacte!

    I una, dues, tres, quatre...
- id: 5268
  text: >-
    Encara que ens en anem

    els nostres món segueixen connectats.
- id: 5269
  text: Que vol dir...
- id: 5270
  text: Hi som lliures de tornar.
- id: 5271
  text: I cantar!
- id: 5272
  text: >-
    Així que no estiguis trist,

    aviat ens veurem un altre cop.
- id: 5273
  text: Instruccions del musical
- id: 5274
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}Neda cap aquí, que ballarem i jugarem.{:unk0e 00}'
- id: 5275
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}Mira tot això, oi que és genial.{:unk0e 00}'
- id: 5276
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}Tu penses que en altres llacs,{:unk0e 00}'
- id: 5277
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}I somies amb anar a dalt,{:unk0e 00}'
- id: 5278
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}Només mira el món del teu voltant,{:unk0e 00}'
- id: 5279
  text: "{:unk13 FA 00 90 01}{:unk0e 0A}just aquí al terra de l'oceà.{:unk0e 00}"
- id: 5280
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}Què pot haver-hi allà a fora,{:unk0e 00}'
- id: 5281
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}que causi tanta emoció?{:unk0e 00}'
- id: 5282
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}Sota del mar.{:unk0e 00}'
- id: 5283
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}Vius serena sent una sirena,{:unk0e 00}'
- id: 5284
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}Ells treballen sense parar,{:unk0e 00}'
- id: 5285
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}I sota el sol per a variar,{:unk0e 00}'
- id: 5286
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}mentre nosaltres sempre flotem...{:unk0e 00}'
- id: 5287
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}Sota del mar.{:unk0e 00}'
- id: 5288
  text: ''
- id: 5289
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}Hi ha sempre ritme i el sentim{:unk0e 00}'
- id: 5290
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}al natural.{:unk0e 00}'
- id: 5291
  text: ''
- id: 5292
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}El peix manta es disposa a tocar.{:unk0e 00}'
- id: 5293
  text: "{:unk13 FA 00 90 01}{:unk0e 0A}L'esturió a acompanyar.{:unk0e 00}"
- id: 5294
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}Tu només escolta, aquí és la marxa...{:unk0e 00}'
- id: 5295
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}Les ballarines són les sardines...{:unk0e 00}'
- id: 5296
  text: ''
- id: 5297
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}Quin mon vols explorar{:unk0e 00}'
- id: 5298
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}si la nostra banda comença a tocar?{:unk0e 00}'
- id: 5299
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}I les cloïsses{:unk0e 00}'
- id: 5300
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}són castanyoles.{:unk0e 00}'
- id: 5301
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}Sota del mar.{:unk0e 00}'
- id: 5302
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}I els llimacs{:unk0e 00}'
- id: 5303
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}són tan agraciats.{:unk0e 00}'
- id: 5304
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}I el cargol és un gran artista.{:unk0e 00}'
- id: 5305
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}I les bombolles{:unk0e 00}'
- id: 5306
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}per a que ballin{:unk0e 00}'
- id: 5307
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}Sota del mar!{:unk0e 00}'
- id: 5308
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}Avui he tornar per rebelar-me{:unk0e 00}'
- id: 5309
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}Sigueu benvinguts al començament{:unk0e 00}'
- id: 5310
  text: ' '
- id: 5311
  text: Diversió submarina
- id: 5312
  text: Part del teu món
- id: 5313
  text: Sota el mar
- id: 5314
  text: La venjança de l'Úrsula
- id: 5315
  text: L'albada d'un nou dia
- id: 5316
  text: 'Cançó 1: Guia #0'
- id: 5317
  text: >-
    Per cada EXCEL・LENT

    que obtinguis

    apareixerà una nota!
- id: 5318
  text: 'Cançó 1: Guia #2'
- id: 5319
  text: 'Cançó 2: Guia #0'
- id: 5320
  text: >-
    Intenta obtenir 5 o més

    EXCEL・LENTS seguits!
- id: 5321
  text: 'Cançó 2: Guia #2'
- id: 5322
  text: 'Cançó 3: Guia #0'
- id: 5323
  text: >-
    Anima l'Ariel i obtén

    la major puntuació.
- id: 5324
  text: 'Cançó 3: Guia #2'
- id: 5325
  text: 'Cançó 4: Guia #0'
- id: 5326
  text: Venç l'Úrsula!
- id: 5327
  text: 'Cançó 4: Guia #2'
- id: 5328
  text: 'Cançó 5: Guia #0'
- id: 5329
  text: >-
    Obtén 30.000

    punts o més!
- id: 5330
  text: 'Cançó 5: Guia #2'
- id: 5331
  text: Sí
- id: 5332
  text: No
- id: 5333
  text: Tria una cançó.
- id: 5334
  text: Interpretes aquesta cançó?
- id: 6432
  text: >-
    {:unk13 A0 00 64 00}{:unk08 01 01 05}Se li trencaria el

    cor si se n'adones!
- id: 6433
  text: '{:unk13 8C 00 A0 00}{:unk08 01 01 01}Llavors què fem?'
- id: 6434
  text: >-
    {:unk13 04 01 54 01}{:unk08 01 01 01}Ens quedarem aquí

    i cuidarem l'Ariel.

    Això farem.
- id: 6435
  text: >-
    {:unk13 78 00 A0 00}{:unk08 01 01 01}Em sembla que és

    l'únic que podem fer.
- id: 7935
  text: >-
    {:unk13 1E 01 61 00}{:unk08 01 01 05}Tot el que has de

    fer és sentir el ritme!{:clear }Escolta el compàs i posa-li

    una mica de moviment!{:clear }Preparat? Som-hi!
- id: 7936
  text: '{:unk13 04 01 6E 00}{:unk08 01 01 05}Exacte!'
- id: 7937
  text: >-
    {:unk13 04 01 68 00}{:unk08 01 01 05}Una mica a destemps.

    Però ja gairebé ho tens!
- id: 7938
  text: >-
    {:unk13 04 01 68 00}{:unk08 01 01 05}Bé, Donald. El teu torn.

    Fes el mateix que el Sora.

    Deixa que vegi com ho fas.
- id: 7939
  text: >-
    {:unk13 04 01 68 00}{:unk08 01 01 05}Goofy, ara vas tu.

    Creus que pots millorar-ho?
- id: 7940
  text: >-
    {:unk13 04 01 6E 00}{:unk08 01 01 05}Ara ballaràs amb l'Ariel!

    Recorda, no perdis el ritme!
- id: 7941
  text: >-
    {:unk13 04 01 6E 00}{:unk08 01 01 05}Ara improvitzem

    amb les bombolles!{:clear }La norma és la mateixa:

    has de seguir-ne el ritme.
- id: 7942
  text: >-
    {:unk13 E1 00 5A 00}{:unk08 01 01 05}Molt bé!

    Ja ho tens!
- id: 8044
  text: >-
    Au, Ariel...

    ja pots sortir. Ja és segur ara.
- id: 8045
  text: >-
    Ho sento, Eric...

    Aquest és el motiu pel qual vaig acudir a l'Úrsula.
- id: 8046
  text: Volia dir-t'ho, però...
- id: 8047
  text: Eric... Adeu.
- id: 8048
  text: M'encantaria!
- id: 8049
  text: Visca!
- id: 8799
  text: >-
    {:unk13 FA 00 90 01}{:unk0e 0A}És molt fàcil si ho intentes.

    Entra i toca aquesta aleta!{:unk0e 00}
- id: 8800
  text: '{:unk13 FA 00 90 01}Gaudeix de la música! Tu pots!'
- id: 8801
  text: "{:unk13 FA 00 90 01}{:unk0e 0A}Deixa't endur pel ritme.{:unk0e 00}"
- id: 8802
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}I a ballar!{:unk0e 00}'
- id: 8803
  text: '{:unk13 FA 00 90 01}Veus com pots!'
- id: 8804
  text: "{:unk13 FA 00 90 01}Tranquil... belluga't!"
- id: 8805
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}Tu vine nadant, gaudeix ballant.{:unk0e 00}'
- id: 8806
  text: >-
    {:unk13 FA 00 90 01}{:unk0e 0A}És molt fàcil si ho intentes.

    Entra i toca aquesta aleta!{:unk0e 00}
- id: 8807
  text: "{:unk13 FA 00 90 01}Compte amb l'escenari. Quina emoció!"
- id: 8808
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}Arriba al senyal just a temps.{:unk0e 00}'
- id: 8809
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}Toc, toc, toc!{:unk0e 00}'
- id: 8810
  text: '{:unk13 FA 00 90 01}Bé, així es fa!'
- id: 8811
  text: '{:unk13 FA 00 90 01}No importa. Ja ho aconseguiràs.'
- id: 8812
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}Tu vine nedant, gaudeix ballant.{:unk0e 00}'
- id: 8813
  text: >-
    {:unk13 FA 00 90 01}{:unk0e 0A}És molt fàcil si ho intentes.

    Entra i toca aquesta aleta!{:unk0e 00}
- id: 8814
  text: '{:unk13 FA 00 90 01}Arribes fins al blanc, utilitza la màgia.'
- id: 8815
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}Apunta bé i atent tan sols.{:unk0e 00}'
- id: 8816
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}Zap, zap, zap!{:unk0e 00}'
- id: 8817
  text: '{:unk13 FA 00 90 01}Exacte! Ja has pescat el ritme!'
- id: 8818
  text: '{:unk13 FA 00 90 01}Ui! Pels pèls!'
- id: 8819
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}Tu vine nedant, gaudeix ballant.{:unk0e 00}'
- id: 8820
  text: >-
    {:unk13 FA 00 90 01}{:unk0e 0A}És molt fácil si ho intentes.

    Entra i toca aquesta aleta!{:unk0e 00}
- id: 8821
  text: >-
    {:unk13 FA 00 90 01}Encara no s'ha acabat.

    Tu pots, segueix lluitant.
- id: 8822
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}Tu vine nedant, gaudeix ballant.{:unk0e 00}'
- id: 8823
  text: >-
    {:unk13 FA 00 90 01}{:unk0e 0A}És molt fàcil si ho intentes.

    Entra i toca aquesta aleta!{:unk0e 00}
- id: 8824
  text: '{:unk13 FA 00 90 01}I què passa amb les bombolles?'
- id: 8825
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}Amb poquet i molt aviat sortirà{:unk0e 00}'
- id: 8826
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}un pop, pop, pop.{:unk0e 00}'
- id: 8827
  text: '{:unk13 FA 00 90 01}Ha, ha! Anem amb la següent!'
- id: 8828
  text: '{:unk13 FA 00 90 01}Mmm... Potser és una mica difícil.'
- id: 8829
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}Tu vine nedant, gaudeix ballant.{:unk0e 00}'
- id: 8830
  text: >-
    {:unk13 FA 00 90 01}{:unk0e 0A}És molt fàcil si ho intentes.

    Entra i toca aquesta aleta!{:unk0e 00}
- id: 8831
  text: >-
    {:unk13 FA 00 90 01}Dona'ls la sortida

    amb un solo de tambor!
- id: 8832
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}Compta perquè comenci el ritme{:unk0e 00}'
- id: 8833
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}a sonar!{:unk0e 00}'
- id: 8834
  text: '{:unk13 FA 00 90 01}La sortida la dones tu.'
- id: 8835
  text: '{:unk13 FA 00 90 01}Els errors no importen. Un altre cop!'
- id: 8836
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}Tu vine nedant, gaudeix ballant.{:unk0e 00}'
- id: 8837
  text: >-
    {:unk13 FA 00 90 01}{:unk0e 0A}És molt fàcil si ho intentes.

    Entra i toca aquesta aleta!{:unk0e 00}
- id: 8838
  text: "{:unk13 FA 00 90 01}Arriba el teu moment! T'aplaudeixen!"
- id: 8839
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}És el final, així que a triomfar o{:unk0e 00}'
- id: 8840
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}Sha-la-la!{:unk0e 00}'
- id: 8841
  text: >-
    {:unk13 FA 00 90 01}Has causat sensació!

    Ha sigut fantàstic!
- id: 8842
  text: >-
    {:unk13 FA 00 90 01}Encara no està. Però gairebé ho tens!

    I és molt divertit!
- id: 8843
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}Tu vine nedant, gaudeix ballant.{:unk0e 00}'
- id: 8844
  text: >-
    {:unk13 FA 00 90 01}{:unk0e 0A}És molt fàcil si ho intentes.

    Entra i toca aquesta aleta!{:unk0e 00}
- id: 8845
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}Vine nedant, i canta al meu costat.{:unk0e 00}'
- id: 8846
  text: >-
    {:unk13 FA 00 90 01}{:unk0e 0A}Gaudim tots junts

    d'aquest joc musical.{:unk0e 00}
- id: 8867
  text: >-
    T'asseguro, Ariel,

    que et faré entrar en raó.
- id: 8892
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}Quants tresors que jo vaig descobrir.{:unk0e 00}'
- id: 8893
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}Quant ens queda per veure,{:unk0e 00}'
- id: 8894
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}i somiar i sentir.{:unk0e 00}'
- id: 8895
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}Mira aquesta fortuna, tresors de tots colors{:unk0e 00}'
- id: 8896
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}quants encants pot un barm tenir inclòs.{:unk0e 00}'
- id: 8897
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}Mirant els voltants deus pensar: «Sí{:unk0e 00}'
- id: 8898
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}ho té tot».{:unk0e 00}'
- id: 8899
  text: "{:unk13 FA 00 90 01}{:unk0e 0A}Un piló d'estris i d'aparells{:unk0e 00}"
- id: 8900
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}i més objectes a dolls.{:unk0e 00}'
- id: 8901
  text: '{:unk13 FA 00 90 01}Vols no-sé-què-bobs?'
- id: 8902
  text: '{:unk13 FA 00 90 01}En tinc vint!'
- id: 8903
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}Pero què hi fa? No em sé{:unk0e 00}'
- id: 8904
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}conformar.{:unk0e 00}'
- id: 8905
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}Vull ser on és la gent.{:unk0e 00}'
- id: 8906
  text: "{:unk13 FA 00 90 01}{:unk0e 0A}Vull veure'ls.. vull veure'ls ballar.{:unk0e 00}"
- id: 8907
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}I caminar amb aquells... Com els hi diuen?{:unk0e 00}'
- id: 8909
  text: '{:unk13 FA 00 90 01}Ah... peus!'
- id: 8910
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}Allà on corren, allà on salten,{:unk0e 00}'
- id: 8911
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}allà on sota el sol el dia passen.{:unk0e 00}'
- id: 8912
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}Lliure passejant, em trobo desitjant...{:unk0e 00}'
- id: 8913
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}Pertànyer al seu món.{:unk0e 00}'
- id: 8914
