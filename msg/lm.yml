- id: 8922
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}Fidels estimats, forts com el corrent.{:unk0e 00}'
- id: 8923
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}Estimats petitons, veniu al meu costat.{:unk0e 00}'
- id: 8924
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}Ara mateix! La mama us necessita.{:unk0e 00}{:delay DB 00}{:clear }{:unk0e 0A}Esclafeu aquests necis estúpids,{:unk0e 00}'
- id: 8925
  text: '{:unk13 FA 00 90 01}Em sembla que no!'
- id: 8926
  text: '{:unk13 FA 00 90 01}Molt bé!'
- id: 8927
  text: >-
    {:unk13 FA 00 90 01}{:unk0e 0A}Quin humà més dèbil.

    No, no m'ho puc creure.{:unk0e 00}
- id: 8928
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}Lluita pel seu premi, què tossuts poden ser!{:unk0e 00}'
- id: 8929
  text: >-
    {:unk13 FA 00 90 01}{:unk0e 0A}I sense la teva sireneta

    ets boig de venjança,{:unk0e 00}
- id: 8930
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}i allò jo ho conec bé.{:unk0e 00}'
- id: 8931
  text: '{:unk13 FA 00 90 01}No penso perdre-la!'
- id: 8932
