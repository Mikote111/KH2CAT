  text: '{:unk13 FA 00 90 01}{:unk0e 0A}De bo que els desitjos poden complir-se{:unk0e 00}'
- id: 8967
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}si és el que tu vols.{:unk0e 00}'
- id: 8968
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}I la meva felicitat{:unk0e 00}'
- id: 8969
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}us ho dec a tots i cadascun.{:unk0e 00}'
- id: 8970
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}Us roguem, presenteu-nos{:unk0e 00}'
- id: 8971
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}la cort i el rei.{:unk0e 00}'
- id: 8972
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}Saludeu si us plau: pare{:unk0e 00}'
- id: 8973
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}Sebastià, Flounder.{:unk0e 00}'
- id: 8974
  text: "{:unk13 FA 00 90 01}Ariel, me n'alegro tant per tu."
- id: 8975
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}Sí, finals feliços no se solen veure.{:unk0e 00}'
- id: 8976
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}Alegres de poder ajuda, i{:unk0e 00}'
- id: 8977
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}orgullosos és clar.{:unk0e 00}'
- id: 8978
  text: >-
    {:unk13 FA 00 90 01}{:unk0e 0A}Veient com et fem somriure,

    ens fa xipollejar sense fi.{:unk0e 00}
- id: 8979
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}Queda cap altre amic{:unk0e 00}'
- id: 8980
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}que esperi per allà?{:unk0e 00}'
- id: 8981
  text: >-
    {:unk13 FA 00 90 01}{:unk0e 0A}Veniu i saludeu:

    Tots els meus amics{:unk0e 00}
- id: 8982
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}de tots els racons{:unk0e 00}'
- id: 8983
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}del món.{:unk0e 00}'
- id: 8984
  text: "{:unk13 FA 00 90 01}{:unk0e 0A}Sigueu benvinguts a l'inici{:unk0e 00}"
- id: 8985
  text: "{:unk13 FA 00 90 01}{:unk0e 0A}d'una nova era.{:unk0e 00}"
- id: 8986
  text: "{:unk13 FA 00 90 01}{:unk0e 0A}Terra i mar s'ajunten per{:unk0e 00}"
- id: 8987
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}unir-se en armonia i pau..{:unk0e 00}'
- id: 8988
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}Contes de fades i miracles{:unk0e 00}'
- id: 8989
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}són el que avui cantem.{:unk0e 00}'
- id: 8990
  text: "{:unk13 FA 00 90 01}{:unk0e 0A}I així l'amor de l'Ariel i l'Eric celebrar.{:unk0e 00}"
- id: 10327
  text: >-
    {:unk13 FA 00 90 01}{:unk0e 0A}Aquí no s'acaba, estimats

    us juro que només he començat.{:unk0e 00}
- id: 10336
  text: "{:unk13 FA 00 90 01}{:unk0e 0A}No s'acaba fins que l'Úrsuka venci!{:unk0e 00}"
- id: 10413
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}Un final de sort i goig...{:unk0e 00}'
- id: 10417
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}res més.{:unk0e 00}'
- id: 10418
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}entre terra i mar.{:unk0e 00}'
- id: 10420
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}les algues més verdes són.{:unk0e 00}'
- id: 10421
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}Sota del mar.{:unk0e 00}'
- id: 10422
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}ets feliç.{:unk0e 00}'
- id: 10423
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}omplen la pista{:unk0e 00}'
- id: 10424
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}a la nostra festa.{:unk0e 00}'
- id: 10425
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}quina gran equivocació.{:unk0e 00}'
- id: 10426
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}Vine a ballar!{:unk0e 00}'
- id: 14601
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}feu-los tremolar!{:unk0e 00}'
- id: 14602
  text: '{:unk13 FA 00 90 01}els teus petitons estan fregits.'
- id: 15712
  text: >-
    {:unk0e 0A}Neda cap aquí, i canta amb mi.{:unk0e 00}{:delay 89 00}{:clear }{:unk0e 0A}Gaudim tots junts

    d'aquest joc musical.{:unk0e 00}
- id: 17820
  text: >-
    Per moure't horitzontalment, utilitza {:icon dynamic-left-analog}.

    Per moure't verticalment, utilitza {:icon dynamic-right-analog-up}{:icon dynamic-right-analog-down}.{:clear }Si prems {:icon dynamic-cross}, nedaràs més ràpidament.

    Per fixar un blanc, utilitza {:icon dynamic-r1}, i

    apropa-t'hi amb {:icon dynamic-circle} utilitzant Puntada Dofí.

    {:color #00F0F080}Parla amb el Flounder.{:reset}
- id: 17821
  text: >-
    Utilitza {:icon dynamic-left-analog} i {:icon dynamic-right-analog} per moure't. 

    Per fixar un objectiu, prem {:icon dynamic-r1}, i apropa-t'hi

    amb {:icon dynamic-circle} utilitzant Puntada Dofí.

    {:color #00F0F080}Parla amb el Flounder.{:reset}
- id: 17822
  text: >-
    Si no aconsegueixes fixar objectius,

    apropa-t'hi més amb {:icon dynamic-cross}.
- id: 18123
  text: >-
    Aquesta Ariel... està obsessionada

    amb la vida a la superfície!
- id: 18124
  text: >-
    Us heu oblidat de com nedar?

    Què heu fet tot aquest temps?{:clear }Com? Estàveu dormits?

    Quina migdiada!
- id: 18125
  text: >-
    La clau dels musicals és

    moure's al ritme de la música.{:clear }Que la música envaeixi el teu cos...

    Ho veieu? Podeu sentir el ritme?
- id: 18126
  text: >-
    La vida sota del mar és lenta.{:clear }Si us aburriu, potser vulgueu

    tornar al vostre món...
- id: 18127
  text: >-
    La millor manera de recordar

    com nedar és nedant!{:clear }Aneu i parleu amb el {:theme 0A}Flounder{:reset}.
- id: 18128
  text: >-
    No us n'oblideu: heu de

    sentir el ritme al cos.
- id: 18129
  text: >-
    {:unk13 00 01 40 01}{:unk08 02 00 06}Participes al musical?

    {:chardelay 33 00}No hi estic preparat.

    {:chardelay 09 00}Ho intentaré!
- id: 18130
  text: >-
    Estem perdent temps d'assaig!

    Però no podem deixar les coses així.{:clear }Què podríem fer? Què?
- id: 18131
  text: >-
    Sí, així és!

    Què ràpid aprens, Sora!
- id: 18132
  text: >-
    Tot i que no ho sembli, el Sebastià

    és un músic de la cort del mar.
- id: 18133
  text: >-
    Els nostres problemes s'arreglaran si

    duem aquella estàtua a la gruta de l'Ariel.{:clear }De pressa! Anem a moure-la!
- id: 18134
  text: >-
    Al mar també podem moure'ns en

    vertical! Hauràs d'acostumar-t'hi!
- id: 18135
  text: >-
    Què podem fer per a que l'Ariel

    deixi de pensar en la superfície?{:clear }No és fàcil aconseguir que a algú

    li deixi d'agradar alguna cosa.
- id: 18136
  text: >-
    Sembla que l'Ariel segueix pensant

    en la vida de la superfície.{:clear }Sé que li agraden les aventures, però

    tant de bo no es fiqui en embolics.
- id: 18137
  text: >-
    Si vols parlar amb algú, tria

    una criatura i neda-hi.
- id: 18138
  text: >-
    No hi ha ni rastre dels sensecor.

    És genial que tot estigui en calma.{:clear }Mai hagués imaginat que participaria

    en un musical submarí. És estrany!
- id: 18139
  text: >-
    Entenc com se sent Ariel, però

    també entenc el Rei Tritó.{:clear }Com a pare, deu estar molt

    preocupat per la seva filla.
- id: 18140
  text: >-
    Només el rei del mar

    pot dur aquest trident.{:clear }Mentre el tingui, podré

    derrotar qualsevol enemic.
- id: 18141
  text: >-
    Com van els assajos

    del musical?{:clear }Feu el que faci falta per a que

    l'Ariel oblidi la vida en la superfície.
- id: 18142
  text: >-
    Vaja... Eh, Sora?

    Bah... és igual. Deixa-ho estar.
- id: 18143
  text: >-
    Gràcies per portar-me aquella estàtua!

    Sempre l'apreciaré!{:clear }No li ho diguis a ningú, però és igual a

    l'home que vaig veure en la superfície!
- id: 18144
  text: >-
    Què és això?

    Ara pots moure l'estàtua?{:clear }Això només em causarà

    més problemes...
- id: 18145
  text: >-
    Sembla que encara no estàs a punt.

    Afanya't, vull començar l'assaig.
- id: 18146
  text: >-
    Estàs a punt per moure

    l'estàtua?
- id: 18147
  text: >-
    {:unk13 00 01 40 01}{:unk08 02 00 06}Moure l'estàtua?

    {:chardelay 33 00}Espera.

    {:chardelay 09 00}Som-hi.
- id: 18148
  text: >-
    L'Ariel porta hores contemplant

    aquella estàtua. Està encantada.
- id: 18149
  text: >-
    Ja que som aquí, per què no

    li regalem l'estàtua a l'Ariel?{:clear }Li encanten les coses de la superfície.

    Estic segur que li encantarà.
- id: 18150
  text: >-
    En lloc d'utilitzar màgia, faré

    ressonar la meva veu al mar!{:clear }Algun dia m'agradaria cantar

    per a la Daisy.
- id: 18151
  text: >-
    Amb els musicals, el Sebastià

    està sota molta pressió.{:clear }Algun cop hauríem de dur-lo a la

    superfície perquè es diverteixi.
- id: 18152
  text: >-
    Potser és l'estàtua d'un

    príncep de qualsevol lloc.{:clear }Fa bona parella amb l'Ariel...

    Ella també és filla d'un rei!
- id: 18153
  text: >-
    L'Ariel està una mica

    trista últimament.{:clear }Sovint mira cap a la superfície,

    com si estigués... No, no pot ser...
- id: 18154
  text: >-
    No sé què es pitjor, el que va passar l'any

    passat, o el que passa amb l'Ariel ara.
- id: 18155
  text: >-
    La superfície és tan a prop,

    i a la vegada tan lluny...{:clear }Ah, si pogués convèncer el meu pare de

    quant meravellosos són els humans...
- id: 18156
  text: >-
    La cosa que li va caure a aquell home

    està encallada entre les roques.{:clear }Sora, si us plau, ajuda'm.

    Vull tornar-la-hi!
- id: 18157
  text: >-
    Excel・lent! Ara podrem

    muntar el musical en pau!
- id: 18158
  text: >-
    {:unk13 00 01 40 01}{:unk08 02 00 06}Començar l'assaig?

    {:chardelay 33 00}Espera.

    {:chardelay 09 00}D'acord, comencem!
- id: 18159
  text: >-
    L'Ariel vol tornar una cosa que li va

    caure a un humà? En què estarà pensant?
- id: 18160
  text: >-
    Últimament, l'Ariel no fa més que

    contemplar l'estàtua i sospirar.{:clear }M'encantaria trobar una

    manera de fer-la somriure.
- id: 18161
  text: >-
    Qui hagués pensat que aquella era

    l'estàtua d'algú que l'Ariel coneix?
- id: 18162
  text: >-
    El mínim que podem fer és

    animar l'Ariel durant el musical.{:clear }Potser això l'alegra una mica.
- id: 18163
  text: >-
    L'Ariel hauria de dir-li tan aviat com

    puguis que va ser ella qui el va salvar.{:clear }Què és el que tem?
- id: 18164
  text: >-
    Ja m'he acostumat al meu aspecte.{:clear }Però no sé si el Donald... És com si

    les cames se li anessin a enredar.
- id: 18165
  text: >-
    Com més es preocupa per

    ell, més temerosa es torna.{:clear }Què curiós és el cor de vegades.
- id: 18166
  text: >-
    Em pregunto si serà cert

    allò que va dir el Sebastià.{:clear }Com faré per arribar

    a ella...?
- id: 18167
  text: >-
    Això és pel seu propi bé. Ara

    deixeu-me sol. No estic d'humor.
- id: 18168
  text: >-
    Quan vaig assabentar-me de l'encanteri de

    l'Úrsula, vaig pensar que estava perduda.{:clear }Però aquell humà va fer front a la bruixa

    del mar. És tan valent com vosaltres.
- id: 18169
  text: >-
    Sora, sembla que has guanyat

    una quanta experiència.{:clear }Creus que podries

    ajudar-me amb el penjoll?
- id: 18170
  text: >-
    {:unk13 00 01 40 01}{:unk08 02 00 06}Recollir l'objecte?

    {:chardelay 33 00}Encara no.

    {:chardelay 09 00}D'acord, va.
- id: 18171
  text: >-
    Això és terrible. Terrible...

    Què faré ara...?
- id: 18174
  text: >-
    He acabat la lletra i la partitura.{:clear }Si milloréssiu una mica

    les vostres habilitats...
- id: 18175
  text: >-
    L'Ariel té la veu més formosa

    del regne.{:clear }Suposo que com més t'agrada cantar,

    més bonica es torna la teva veu.
- id: 18176
  text: >-
    Creus que l'Ariel estarà bé?

    Què podem fer per ajudar-la?
- id: 18177
  text: >-
    Fa molt de temps, el Tritó

    va expulsar l'Úrsula del regne.{:clear }Ella té molt de poder. Tant de bo

    l'utilitzés per ajudar als altres!
- id: 18178
  text: >-
    La música del Sebastià és genial,

    i l'Ariel té una veu formosa.{:clear }Quan canti amb nosaltres,

    la cançó millorarà molt.
- id: 18179
  text: >-
    Em sap greu per l'Ariel.{:clear }El Rei Tritó estava furiós

    quan va destruir l'estàtua.
- id: 18180
  text: >-
    La màgia de l'Úrsula era impressionant,

    però la meva és la millor!
- id: 18181
  text: >-
    Què bonic és cantar! Em pregunto

    quina serà la pròxima cançó.
- id: 18182
  text: >-
    Espero que l'Ariel i aquell nano

    es besin abans que caigui el sol.{:clear }No sé què podríem fer per ajudar.

    Per ara, observarem.
- id: 18183
  text: >-
    No hem vist els sensecor, però

    hem tingut bastants problemes.{:clear }És trist que hi hagi vilans

    en tots els mons.
- id: 18184
  text: >-
    L'Ariel va jurar que em demostraria

    quant meravellosos són els humans.{:clear }Però mai hagués imaginat que

    arribaria tan lluny per fer-ho!
- id: 18185
  text: >-
    Tot pare desitja que els

    seus fills siguin feliços.{:clear }La trobaré a faltar, però

    m'encanta veure-la feliç.
- id: 18186
  text: >-
    Fem que el musical d'avui sigui

    el millor de tots els temps, Sora.{:clear }Pensaré en vosaltres quan canti!
- id: 18187
  text: >-
    No ho sembla, però el nostre món està

    connectat amb el de la superfície.{:clear }I m'he adonat que...

    amb les persones passa el mateix.
- id: 18188
  text: >-
    Sembla que ara podeu fer-ho!

    El nostre musical serà estupend!
- id: 18189
  text: >-
    {:unk13 00 01 40 01}{:unk08 02 00 06}Bé. A punt per començar?

    {:chardelay 33 00}Espera, estic una mica nerviós.

    {:chardelay 09 00}Sí, estic a punt! Som-hi!
- id: 18190
  text: >-
    Com sempre dic: els fills han de fer

    el que vulguin amb les seves vides.
- id: 18191
  text: >-
    Últimament l'Ariel no fa

    més que parlar de l'Eric.{:clear }Però ara somriu quan ho fa!

    Veure-la així em fa feliç!
- id: 18192
  text: >-
    Gràcies a vosaltres,

    l'Ariel ha tornar a ser feliç!{:clear }Per què no cantem tots

    junts de nou? Serà divertit!
- id: 18193
  text: >-
    Ha arribat l'hora d'actuar.

    Sé que estaré genial!{:clear }Seguiré l'Ariel

    nota per nota, d'acord?
- id: 18194
  text: >-
    És genial que tot hagi anat bé

    entre el príncep Eric i l'Ariel.{:clear }Em fa pensar en la Daisy...
- id: 18195
  text: >-
    Aquest no serà un

    simple musical.{:clear }Tots els nostres sentiments

    s'hi uniran en una formosa cançó.
- id: 18196
  text: >-
    M'alegra que les coses entre l'Ariel

    i el Rei Tritó s'hagin arreglat.{:clear }És trist veure una família desunida.
- id: 18197
  text: >-
    Hauria d'anar a veure

    com està l'Ariel.
- id: 18198
  text: >-
    {:unk13 00 01 40 01}{:unk08 02 00 06}Anar a veure l'Ariel?

    {:chardelay 33 00}Descansem primer.

    {:chardelay 09 00}Sí, som-hi.
- id: 18473
  text: >-
    {:unk13 D0 00 68 00}{:unk08 01 00 05}Va, què faràs ara?{:clear }No sé res dels altres

    mons, però...{:clear }... aquell ball no

    és del mar.
- id: 18474
  text: >-
    {:unk13 CF 00 3C 01}{:unk08 01 01 01}Això no expresa els

    sentiments del compositor!{:clear }I allò és important!{:clear }S'ha de ballar amb el cor per

    expresar la bellesa del mon.
- id: 18475
  text: >-
    {:unk13 D6 00 35 01}{:unk08 01 00 01}Encara es pot millorar!{:clear }D'aquesta manera l'Ariel mai

    oblidarà la seva bogeria per la terra!
- id: 18476
  text: >-
    {:unk13 DE 00 38 01}{:unk08 01 01 01}Això és el millor que pots fer? Ja!

    Mai em superaràs, ni en cent anys!
- id: 18477
  text: >-
    {:unk13 C8 00 46 00}{:unk08 01 01 05}Ha estat una cosa meravellosa:

    terra i mar junts...{:clear }No t'ho perdis!
- id: 18581
  text: >-
    {:unk13 66 01 64 00}{:unk08 01 00 05}No tots poden

    ser brillants

    el primer cop.{:clear }Però tens un

    gran potencial.

    No et desanimis!
- id: 18725
  text: Puntada Dofí
- id: 18726
  text: Nedar
- id: 19192
  text: >-
    Ningú ho fa bé a la primera.

    Intenteu-ho varies vegades!
- id: 19193
  text: >-
    {:unk13 00 01 40 01}{:unk08 02 00 06}Intentar-ho de nou?

    {:chardelay 33 00}Necessito un descans.

    {:chardelay 09 00}Som-hi va!
- id: 19756
  text: Atlàntica
- id: 19870
  text: Quina tela!
- id: 21529
  text: "{:delayandfade 08 78} \nDesprés de la breu lecció de\nnatació submarina, el Sebastià\ninvita el Sora, el Donald i el\nGoofy a participar al musical.\n \nNo tots els dies l'un rep\nuna invitació de l'estil, així\nque tots comencen a assajar\namb entusiasme.\n \n"
- id: 21530
  text: "{:delayandfade 0A 78} \nEl Rei Tritó, coneixent l'Ariel\ncom la coneix, sap que la seva\nfilla tramava alguna cosa...\n \n \n \n \n \n"
- id: 21531
  text: "{:delayandfade 08 78} \nSens dubte, molts són els\nproblemes que assetgen el regne,\nperò el Sora s'arma de valor\ni segueix amb els assajos.\n \nDesprés de tot, les penes\namb música, menys tristes són.\n \n \n \n"
- id: 21532
  text: "{:delayandfade 07 78} \nLa jove i enamorada Ariel observa\nel seu príncep en la llunyania. Entre les\nroques veu allò que el jove busca,\nperò li és impossible arribar-hi.\n \nPer sort, el Sora és per allà i,\nutilitzant els seus poders, aconsegueix\napartar la gran roca per arribar al\npenjoll.\n \n"
- id: 21533
  text: "{:delayandfade 07 78} \nUna ombra amenaçadora s'apropa\na l'Ariel. Es tracta de l'Úrsula, la bruixa\ndesterrada un any enrere, que s'aprofita\nde la jove per oferir-li\nun tracte: la seva bella veu a canvi de\ntransformar-la en humana.\n \nPerò hi ha una cosa més: l'Ariel ha de\nrebre un petó del príncepe abans de tres\ndies o es convertirà en un monstre.\n \n"
- id: 21534
  text: "{:delayandfade 0A 78} \nEl Sora i els seus amics han d'arribar\nfins a la malvada Úrsula mentre\nprotegeixen la pobra Ariel.\n \n \n \n \n \n"
- id: 21535
  text: "{:delayandfade 0A 78} \nEl pas del Sora i els seus amics\nper Atlàntica deixa, un cop més,\nun regne en què hi impera la pau.\n \nI per celebrar-ho, què millor\nque un bon musical marí com\na colofó final de la aventura!?\n \n \n \n"
