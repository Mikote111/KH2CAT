- id: 8946
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}La nostra estimada princesa Ariel{:unk0e 00}'
- id: 8947
  text: "{:unk13 FA 00 90 01}{:unk0e 0A}s'ha enamorat de debò,{:unk0e 00}"
- id: 8948
  text: "{:unk13 FA 00 90 01}{:unk0e 0A}d'un príncep, un príncep humà{:unk0e 00}"
- id: 8949
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}que vivia tan amunt.{:unk0e 00}'
- id: 8950
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}De bo que els desitjos poden complir-se{:unk0e 00}'
- id: 8951
