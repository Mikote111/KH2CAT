- id: 8954
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}Què et sembla si ara ens presentes{:unk0e 00}'
- id: 8955
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}els teus encantadors amics?{:unk0e 00}'
- id: 8956
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}Saludeu, Donald{:unk0e 00}'
- id: 8957
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}Goofy i Sora.{:unk0e 00}'
- id: 8958
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}Enhorabona, us desitjo{:unk0e 00}'
- id: 8959
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}a vos.{:unk0e 00}'
- id: 8960
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}Heu trobat{:unk0e 00}'
- id: 8961
  text: "{:unk13 FA 00 90 01}{:unk0e 0A}ambdós l'amor!{:unk0e 00}"
- id: 8962
  text: '{:unk13 FA 00 90 01}{:unk0e 0A}Ens alegra ajudar-te{:unk0e 00}'
- id: 8963
