- id: 13465
  text: Bona tarda, colgafocs.{:delay 6E 00}{:clear } {:delay 20 00}{:clear }Què esteu fent aquí?
- id: 13466
  text: Què tant te fa?
- id: 13467
  text: M'és igual. Digueu-m'ho igualment.
- id: 13468
  text: Estem esperant el tren fantasma.
- id: 13469
  text: Esperant el tren fantasma...
- id: 13470
  text: >-
    Per què sempre que us 

