- id: 13495
  text: >-
    Però, què passa amb l'última,

    la Setena Meravella?
- id: 13496
  text: A qui li importa?
- id: 13497
  text: A mi. Som-hi, Pence.
- id: 13498
  text: Tu mateix.
- id: 13499
  text: Roxas...
- id: 13500
  text: '{:delay 3C 00}{:clear }És a la mansió encantada.'
- id: 13501
  text: Saps una cosa...?
- id: 13502
  text: Uagh!
- id: 13503
  text: Demà anàvem a explorar la mansió.
- id: 13504
  text: Sí...
- id: 13505
  text: Fins i tot la tropa del Seifer ens anava a ajudar.
- id: 13506
  text: El Seifer?
- id: 13507
  text: Sí. Li ho va demanar el Hayner.
- id: 13508
  text: I què estàvem buscant?
- id: 13509
  text: >-
    Aviam, diuen que hi ha una nena que 

    apareix a la finestra del segon pis.{:delay 10 01}{:clear }Tot i que fa anys que no hi viu ningú.
- id: 13510
  text: Roxas...
- id: 13511
  text: Naminé?
- id: 13512
  text: Aquest soc...{:delay 3C 00}{:clear }{:delay 33 00}{:clear }jo?...{:delay 45 00}{:clear }{:delay 5D 00}{:clear }I també hi és l'Àxel.
- id: 13513
  text: Sou millors amics.
- id: 13514
  text: Molt graciosa.
- id: 13515
  text: >-
    No vols saber la veritat...

    sobre qui ets realment?
- id: 13516
  text: Ningú em coneix millor que jo mateix.
- id: 13517
  text: És clar...
- id: 13518
  text: >-
    Però...{:delay 3C 00}{:clear }{:delay 1E 00}no entenc què està

    passant últimament.
- id: 13519
  text: Coneixes aquests tres, oi?
- id: 13520
  text: Sí...{:delay 44 00}{:clear }{:delay 35 00}El Sora, en Donald i en Goofy.{:delay A1 00}{:clear }Eren als meus somnis.
- id: 13521
  text: >-
    Fa gairebé un any...{:delay 5A 00}{:clear }{:delay 33 00}{:clear }van passar algunes coses...{:delay 8E 00}{:clear }i vaig haver de separar els records

    enllaçats del cor del Sora.{:delay E6 00}{:clear }{:delay 23 00}{:clear }Però ara...{:delay 5A 00}{:clear }tornaré a col・locar-los

    just on eren.
- id: 13522
  text: Et refereixes als... somnis?
- id: 13523
  text: Sí.{:delay 3C 00}{:clear }{:delay 24 00}{:clear }El Sora i tu esteu connectats.
- id: 13524
  text: >-
    I per tornar a estar complet,

    diguem que el Sora...
- id: 13525
  text: A mi?{:delay 7C 00}{:clear }Per què?
- id: 13526
  text: Tu preserves la meitat del seu ésser.{:delay 9B 00}{:clear }{:delay 82 00}{:clear }Et necessita, Roxas.
- id: 13527
  text: Naminé?
- id: 13528
  text: Naminé...{:delay 42 00}{:clear }{:delay 6D 00}qui ets?
- id: 13529
  text: >-
    Una bruixa... amb un poder sobre els

    records del Sora i els que el rodegen.
- id: 13530
  text: Una bruixa?
- id: 13531
  text: Així és com em diu en DiZ.
- id: 13532
  text: Mmm... No puc ajudar-t'hi.
- id: 13533
  text: És curiós...{:delay 49 00}{:clear }{:delay 85 00}{:clear }De cop i volta és com si...{:delay 88 00}{:clear }no em conegués a mi mateix.
- id: 13534
  text: Tu...{:delay 3C 00}{:clear }{:delay 50 00}{:clear }Tu no hauries d'haver existit, Roxas.
- id: 13535
  text: Què?{:delay 5A 00}{:clear }{:delay 29 00}{:clear }Com pots dir una cosa així...{:delay 93 00}{:clear }{:delay 2B 00}{:clear }encara que fos veritat?
- id: 13536
  text: Em sap greu.{:delay 3C 00}{:clear }{:delay 23 00}{:clear }Suposo que hi ha coses que...{:delay 50 00}{:clear }realment és millor no dir.
- id: 13537
  text: Roxas! Roxas!
- id: 13538
  text: Eh?
- id: 13539
  text: L'has vista?
- id: 13540
  text: Sí. Mira la finestra... Fixa-t'hi.
- id: 13541
  text: Bah, quin desengany!
- id: 13542
  text: '... Sí.'
- id: 13543
  text: En fi, tornem al lloc de sempre.{:delay B8 00}{:clear }El Hayner i l'Olette ens esperen.
- id: 13544
  text: Ei, nois. Com ha anat?
- id: 13545
  text: >-
    La nena de la finestra ha resultat ser

    una cortina que es movia amb el vent.
- id: 13546
  text: M'ho imaginava. Ja tenim la redacció.
- id: 13547
  text: Perfecte!
- id: 13548
  text: Bé, anem pel Hayner?{:delay 78 00}{:clear }Segur que ja és a la estació.
- id: 13549
  text: >-
    Només ens queden dos dies

    per estar junts.
- id: 13550
  text: Eh?
- id: 13551
  text: Les vacances, te'n recordes?
- id: 13552
  text: Oh...{:delay 64 00}{:clear }És clar.
- id: 13553
  text: Demà registrarem la ciutat.
- id: 13554
  text: I passat és la fira.
- id: 13555
  text: L'últim dia de l'estiu.
- id: 13556
  text: >-
    No diguis això!

    Vols que em surti una úlcera?
- id: 13557
  text: >-
    Això si no explotes abans 

    de tant menjar gelat.
- id: 13558
  text: Per què li has ensenyat el tren?
- id: 13559
  text: Perquè es va perdre l'excursió a la platja.
- id: 13560
  text: "{:delay 48 00}T'estàs tornant un bleda."
- id: 13561
  text: >-
    A veure...{:delay 50 00}{:clear }{:delay 1E 00}{:clear }i tu què?{:delay 4B 00}{:clear }{:delay 39 00}{:clear }Comencen a omplir-se les 

    llacunes de la teva memòria?
- id: 13562
  text: Sí, la boira s'esbargeix.
- id: 13563
  text: >-
    El mateix els està passant a tots els que

    estaven relacionats amb el Sora.{:delay 0E 01}{:clear }{:delay 6E 00}{:clear }Ben aviat, per a ells serà com un

    bon amic que s'ha anat un any de viatge.
- id: 13564
  text: >-
    He esperat,

    però ara vull saber-ho.{:delay 7D 00}{:clear } {:delay 32 00}{:clear }Què és el que trames?
- id: 13565
  text: Venjança.
- id: 13566
  text: Venjança...
- id: 13567
  text: >-
    Ara, els últims retocs.{:delay BA 00}{:clear }{:delay 0A 00}{:clear }Primer, hem de desfer-nos de la Naminé.{:delay B4 00}{:clear }{:delay 0A 00}{:clear }Ha fet una feina esplèndida amb el Sora,

    però ara ha de desaparèixer.
- id: 13568
  text: Restauració al 97%.
- id: 13569
  text: Nano... no he pogut dormir aquesta nit.
- id: 13570
  text: Nois?
- id: 13571
  text: >-
    Mira fins on hem arribat.{:delay 78 00}{:clear }M'han donat la barroera 

    ordre d'eliminar-te...{:delay A1 00}{:clear }{:delay 1E 00}{:clear }si et negues a tornar amb mi.
- id: 13572
  text: Som...{:delay 56 00}{:clear }millors amics, oi?
- id: 13573
  text: >-
    I tant... però no deixaré que em

    converteixin en un foscant per...{:delay EC 00}{:clear }Un moment! Ja te'n recordes?
- id: 13574
  text: '... Sí.'
- id: 13575
  text: >-
    Genial!{:delay 38 00}{:clear }Però... ja saps,

    ho haig de... comprovar.{:delay A4 00}{:clear }Així que... mmm...{:delay 78 00}{:clear }{:delay 73 00}{:clear }Com es diu el nostre cap?
- id: 13576
  text: No m'ho puc creure...
- id: 13577
  text: Roxas, vine a la mansió!{:delay C2 00}{:clear }Ha arribat l'hora!
- id: 13578
  text: Hayner!{:delay 58 00}{:clear }Pence!{:delay 63 00}{:clear }Olette!
- id: 13579
  text: >-
    El Roxas que coneixia

    ha marxat per sempre.
- id: 13580
  text: No em facis venir per deixar-me fora!
- id: 13581
  text: Aquesta Organització {XIII}...{:delay 6F 00}{:clear }no és res bo.
- id: 13582
  text: >-
    Bons o dolents. No ho sé.{:delay E5 00}{:clear }Són un grup d'éssers incomplerts

    que busquen esdevenir-ne complets.{:delay C8 00}{:clear }{:delay 30 00}{:clear }Amb aquest objectiu, cerquen

    quelcom desesperadament.
- id: 13583
  text: El què?
- id: 13584
  text: Kingdom Hearts.
- id: 13585
  text: Et diverteix?
- id: 13587
  text: Tu ets...
- id: 13588
  text: Naminé?
- id: 13589
  text: >-
    Res que esbrinis tindrà el poder

    de canviar el teu destí.
- id: 13590
  text: >-
    Encara que res canviï,

    vull saber-ho.{:delay B0 00}{:clear }Hi tinc dret!
- id: 13591
  text: >-
    Un incorpori no té dret

    a saber.{:delay D1 00}{:clear }Ni tan sols té dret a ser.
- id: 13592
  text: Però què és un incorpori?
- id: 13593
  text: >-
    DiZ, se'ns acaba el temps.

    Massa incorporis!
- id: 13594
  text: >-
    Roxas, els incorporis com nosaltres

    només som éssers a mitges.{:delay 29 01}{:clear }No desapareixeràs.{:delay 85 00}{:clear }Només estaràs complet!
- id: 13595
  text: Jo... despareixeré?
- id: 13596
  text: Prou blasfèmies per avui!
- id: 13597
  text: No, no desapareixeràs!...
- id: 13598
  text: Espera!
- id: 13600
  text: Deixa-la anar!
- id: 13601
  text: Naminé!
- id: 13602
  text: Funcionarà?
- id: 13603
  text: >-
    Si podem mantenir

    la ciutat virtual{:delay C0 00}{:clear }fins que la Naminé acabi

    d'enllaçar els records del Sora.
- id: 13604
  text: Què li passarà al Roxas?
- id: 13605
  text: >-
    Conserva la meitat del poder

    del Sora en el seu interior.{:delay BF 00}{:clear }{:delay 3C 00}{:clear }Al final, haurà de retornar-l'hi.{:delay 8D 00}{:clear }{:delay 53 00}{:clear }Fins llavors,{:delay 50 00}{:clear }necessitarà una altra personalitat 

    per despistar els seus perseguidors.
- id: 13606
  text: Pobre titella.
- id: 13607
  text: És el destí d'un incorpori.
- id: 13608
  text: Totalment esbalaïdor, Roxas.
- id: 13609
  text: Àxel.
- id: 13610
  text: >-
    De veritat et recordes

    de mi aquest cop?{:delay D3 00}{:clear }Quina encensada!
- id: 13611
  text: Però ja és massa tard!
- id: 13612
  text: Dues?
- id: 13613
  text: Àxel...
- id: 13614
  text: Ens veurem en una altra vida.
- id: 13615
  text: Sí. T'esperaré.
- id: 13616
  text: Bajanades.{:delay 8E 00}{:clear }Només perquè tu en tinguis una...
- id: 13617
  text: Donald?
- id: 13618
  text: Goofy?
- id: 13619
  text: Per fi, l'escollit de la clau espasa.
- id: 13620
  text: A qui li parles?{:delay 54 00}{:clear }{:delay 25 00}{:clear }A mi?{:delay 3C 00}{:clear }O al Sora?
- id: 13621
  text: >-
    A la meitat del Sora, és clar.{:delay 96 00}{:clear }{:delay 42 00}{:clear }Tú resideixes a la foscor.{:delay A8 00}{:clear }{:delay 31 00}{:clear }El que necessito és algú que pugui

    moure's pel Regne de la Llum{:delay 05 01}{:clear }i erradicar l'Organització {XIII}.
- id: 13622
  text: Per què? Qui ets?
- id: 13623
  text: Un simple vassall del món.
- id: 13625
  text: >-
    I si jo soc un vassall,{:delay 77 00}{:clear }tu hauries de considerar-te 

    una eina com a molt.
- id: 13626
  text: Se suposa...{:delay 63 00}{:clear }se suposa que és una broma?
- id: 13627
  text: Perquè jo no ric!
- id: 13628
  text: >-
    Les meves disculpes.{:delay 3F 00}{:clear }{:delay 45 00}{:clear }Això no és més que una

    projecció virtual.
- id: 13629
  text: Va, apropa't.
- id: 13630
  text: No saps quant t'odio!
- id: 13631
  text: >-
    Comparteix una mica 

    d'aquest odi amb el Sora.{:delay B4 00}{:clear }{:delay 2B 00}{:clear }És molt més bo del que li convé.
- id: 13632
  text: No!{:delay 56 00}{:clear }El meu cor em pertany!
- id: 13633
  text: Sora...
- id: 13634
  text: Ets un afortunat.
- id: 13635
  text: >-
    Em sembla que les meves vacances

    d'estiu...{:delay 96 00}{:clear }{:delay 2B 00}{:clear }s'han acabat.
- id: 13636
  text: Eh? Què és aquest lloc?
- id: 13637
  text: ''
- id: 13638
  text: Estàs bé?
- id: 13639
  text: Què...?
- id: 13640
  text: >-
    Aquell gos i tu heu sortit volant

    d'un forat a la paret!{:delay B4 00}{:clear } {:delay 1E 00}{:clear }Gairebé ens dona un infart a tots.
- id: 13641
  text: >-
    Socors! Al solar esportiu!

    És el Seifer!
- id: 13642
  text: Per favor! Que algú ens ajudi!
- id: 13643
  text: Em sembla que tenim problemes...
- id: 13644
  text: Nosaltres ens n'encarreguem!
- id: 13645
  text: Impressionant.
- id: 13646
  text: >-
    Per cert,

    heu vist un tipus anomenat Àxel?{:delay 02 01}{:clear }Suposo que és per aquí.
- id: 13647
  text: Me la bufa.
- id: 13648
  text: >-
    Us explico; l'Àxel ha decidit

    actuar al nostre marge.
- id: 13649
  text: També és de l'Organització?
- id: 13650
  text: Sí.
- id: 13651
  text: I què esteu, de morros?
- id: 13652
  text: No està molt organitzada aquesta organització...
- id: 13653
  text: >-
    No baixeu la guàrdia.{:delay 96 00}{:clear }L'Àxel no s'aturarà davant de ningú

    per tal de convertir-vos en sensecors.
- id: 13654
  text: >-
    Carai, gràcies per preocupar-te

    per nosaltres, patró.{:delay 96 00}{:clear }Però, afortunadament,

    sabem cuidar-nos molt bé.
- id: 13655
  text: >-
    Me n'alegro.{:delay 8A 00}{:clear }Deixant l'Àxel a part, ens partiria el

    cor saber que us ha passat alguna cosa.
- id: 13656
  text: Cor? No teniu cap cor!
- id: 13657
  text: >-
    És cert, no en tenim.{:delay 8C 00}{:clear } {:delay 28 00}{:clear }Però... recordem què se sentia.

    Això és el que ens fa especials.
- id: 13658
  text: Què vols dir?
- id: 13659
  text: Sabem molt bé...{:delay 7A 00}{:clear }com damnificar un cor.
- id: 13660
  text: >-
    Sora, tu segueix lluitant

    contra els sensecor.
- id: 13661
  text: Seguim-lo!
- id: 13662
  text: Per què?
- id: 13663
  text: >-
    No n'estic segur, però potser ens

    du fins al món de l'Organització.
- id: 13664
  text: >-
    No siguis insensat.

    És que vols acabar com el Riku?
- id: 13665
  text: Què!?
- id: 13666
  text: Ei, espera!
- id: 13667
  text: >-
    A què es refereix amb

    «acabar com el Riku»?
- id: 13668
  text: >-
    Ei, què us sembla si toqueu el dos de la meva ciutat?

    Ja heu causat prou problemes.
- id: 13669
  text: Riku...
- id: 13670
  text: Com vulguis! Som-hi, nois!
- id: 13671
  text: Alto!
- id: 13672
  text: Decideix-te d'una vegada!
- id: 13673
  text: >-
    Aquest és per a l'individu 

    més fort de Vila Crepuscle.
- id: 13674
  text: Gràcies, però... no el necessitem.
- id: 13675
  text: Ah! Sora!
- id: 13676
  text: D'això... Pence, oi?
- id: 13677
  text: Coneixes una noia que es diu Kairi?
- id: 13678
  text: Ka... Kairi!? És clar que sí!
- id: 13679
  text: Serà millor que vinguis a l'estació!
- id: 13680
  text: Ei!
- id: 13681
  text: Ei, com és que coneixeu la Kairi?
- id: 13682
  text: De debò la Kairi ha estat aquí?
- id: 13683
  text: >-
