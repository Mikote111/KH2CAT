- id: 18385
  text: '{:unk13 FC 00 4C 01}{:unk08 01 01 02}Oh, però si ets tu, Roxas!{:clear }Has llençat tu una pilota?'
- id: 18386
  text: >-
    {:unk13 4F 01 39 00}{:unk08 01 00 06}La pilota ha aparegut del

