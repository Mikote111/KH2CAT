- id: 2870
  text: El doppelgänger
- id: 2871
  text: El tren fantasma
- id: 2872
  text: La mansió buida
- id: 2873
  text: >-
    Sabies que a mesura que baixes, augmenten 

    els esglaons de l'Estació del Capvespre?
- id: 2874
  text: >-
    El Rai es fa un embolic 

    contant els esglaons.

    Ell és així!
- id: 2875
  text: >-
    Saps allò de la bossa del Turó del Capvespre?

    És horrible. Es mou com si estigués viva.
- id: 2876
  text: >-
    Bah, només era un gos atrapat.

    Ja no li passarà res.
- id: 2877
  text: >-
    Sabies que surt una pilota de

    la paret al final de l'atzucac?

    De vegades n'hi ha més d'una.
- id: 2878
  text: >-
    És només una pilota.

    Sembla que algú va 

    estar-hi jugant.
- id: 2879
  text: >-
    Se senten uns gemecs horribles en el 

    túnel de les Terraces del Capvespre.

    Creus que podria ser un fantasma?
- id: 2880
  text: >-
    El Vivi estava practicant pel torneig

    d'Struggle. L'eco del túnel convertia

    la seva veu en un gemec espantós.
- id: 2881
  text: >-
    Sabies que moltes persones

    han vist els seus dobles al cantó 

    de les Terraces del Capvespre?
- id: 2882
  text: >-
    Era només un reflex a l'aigua.

    És neta com un mirall!
- id: 2883
  text: >-
    Has sentit allò del tren fantasma invisible

    que passa per l'Estació del Capvespre?

    Qui podria descobrir un tren invisible...?
- id: 2884
  text: (Tentative) The ghost train was actually a ⬛⬛!
- id: 2885
  text: 'La mansió buida: Guia #0'
- id: 2886
  text: (Tentative) The mansion´s secret was actually a ⬛⬛!
- id: 2887
  text: '{:icon dynamic-triangle}Diari'
- id: 2888
  text: Carter
- id: 2889
  text: Costa amunt
- id: 2890
  text: Fanfarroneria
- id: 2891
  text: Penja cartells
- id: 2892
  text: '{:width 95}Liquidabrunzits'
- id: 2893
  text: Fora brossa!
- id: 2894
  text: Es busca cuiner
- id: 2895
  text: Una mà amiga.
- id: 2896
  text: >-
    Necessito algú que 

    reparteixi unes cartes

    per mi.
- id: 2898
  text: Es busca persona forta.
- id: 2899
  text: >-
    Es necessita algú

    per transportar coses.

    Qualsevol pot fer-ho.
- id: 2901
  text: Vols ser famós?
- id: 2902
  text: >-
    Es busca una persona

    per muntar un gran

    espectacle al carrer.
- id: 2904
  text: Atenció! Atenció!
- id: 2905
  text: >-
    Necessito algú 

    que corri ràpid i 

    pengi cartells en 

    els llocs pertinents!
- id: 2907
  text: Compte!
- id: 2908
  text: >-
    Hi ha abelles 

    per tot arreu!

    Necessito que algú

    se n'encarregui!
- id: 2910
  text: Una feina bruta.
- id: 2911
  text: >-
    Algú podria donar

    una cop de mà per

    desfer-nos de la brossa?
- id: 2913
  text: Es necessiten cuiners!
- id: 2914
  text: >-
    Es busca una persona

    que cuini molt bé.
- id: 2916
  text: Sí
- id: 2917
  text: No
- id: 2918
  text: Tria una feina.
- id: 2919
  text: Vols aquesta feina?
- id: 12137
  text: Una clau... espasa?
- id: 12138
  text: Una clau espasa...
- id: 12139
  text: Què serà tot allò?
- id: 12140
  text: Oh!
- id: 12141
  text: Ho sento molt...
- id: 12142
  text: >-
    Ei, nois, creieu que estarem 

    sempre junts com ara?
- id: 12143
  text: Espero que sí.
- id: 12144
  text: Eh? A què ve això ara?
- id: 12145
  text: Ah, a veure, ja saps,{:delay 64 00}{:clear }estava pensant en veu alta.
- id: 12146
  text: >-
    Doncs jo dubto que puguem

    estar sempre junts.{:delay 96 00}{:clear }{:delay 37 00}{:clear } Però no és això el que vol dir madurar?{:delay AC 00}{:clear }El que importa no és quantes

    vegades ens veiem,{:delay B4 00}{:clear }sinó quantes vegades pensem

    els uns amb els altres. No?
- id: 12147
  text: >-
    {:delay 32 00}{:clear }D'on has tret això? 

    D'una galeta de la fortuna?
- id: 12148
  text: >-
    S'ha acabat!

    T'has quedat sense gelat!{:delay 78 00}{:clear }{:delay 3C 00}{:clear }Nano, quin fàstic de dia.
- id: 12149
  text: Potser és pel lladre de records d'ahir.
- id: 12150
  text: >-
    Naa... Saps què és?{:delay A2 00}{:clear }Que se'ns acaben les vacances.

    Res més.
- id: 12151
  text: Bé, doncs que us sembla això.
- id: 12152
  text: >-
    Ens en anem tots a la platja!{:delay 78 00}{:clear }{:delay 25 00}{:clear } I per què a la platja?{:delay 78 00}{:clear } Perquè... no hi hem anat ni una
     vegada en totes les vacances!
- id: 12153
  text: No?
- id: 12154
  text: Au va...!
- id: 12155
  text: Potser te n'has oblidat, però no tenim pasta.
- id: 12156
  text: Potser t'has oblidat que soc un màquina!
- id: 12157
  text: "{:unk13 82 00 46 00}{:unk06 00}{:unk08 01 01 05}Afanya't, Roxas!"
- id: 12158
  text: '{:unk13 4A 01 63 00}{:unk06 00}{:unk08 01 01 05}Anem al Carrer del Mercat!'
- id: 12159
  text: Queden només dos dies.
- id: 12160
  text: >-
    Ens hi apuntem els dos

    i arribem a la final! {:delay 94 00}{:clear }Així, guanyi qui guanyi,

    ens repartirem el premi!
- id: 12161
  text: Va! Fet.
- id: 12162
  text: Junts ho petareu!
- id: 12163
  text: A totes!
- id: 12164
  text: Promès!
- id: 12165
  text: >-
    {:unk13 F0 00 46 00}{:unk06 00}{:unk08 01 01 06}Aviam,

    anem per feina!
- id: 12166
  text: >-
    {:unk13 E6 00 46 00}{:unk06 00}{:unk08 01 01 06}Un bitllet a la platja costa

    900 calés. Quatre bitllets...
- id: 12167
  text: '{:unk13 78 00 64 00}{:unk06 00}{:unk08 01 01 06}3.600!'
- id: 12168
  text: >-
    {:unk13 E6 00 46 00}{:unk06 00}{:unk08 01 01 06}I 300 per cap per gastar-hi.

    Quant seria?
- id: 12169
  text: >-
    {:unk13 B4 00 50 00}{:unk06 00}{:unk08 01 01 05}1.200 calés.

    4.800, en total.
- id: 12170
  text: '{:unk13 54 01 64 00}{:unk06 00}{:unk08 01 01 06}Per gastar en què?'
- id: 12171
  text: >-
    {:unk13 D2 00 3C 00}{:unk06 00}{:unk08 01 01 06}En galetes salades!

    En què si no?
- id: 12172
  text: >-
    {:unk13 7E 01 51 00}{:unk06 00}{:unk08 01 01 06}Doncs podria ser en

    cindries, per exemple.
- id: 12173
  text: >-
    {:unk13 D2 00 46 00}{:unk06 00}{:unk08 01 01 06}Són molt cares. Cadascuna

    costa uns 2.000 calés.
- id: 12174
  text: '{:unk13 54 01 64 00}{:unk06 00}{:unk08 01 01 06}Doncs galetes llavors.'
- id: 12175
  text: '{:unk13 0E 01 46 00}{:unk06 00}{:unk08 01 00 05}Per on anàvem?'
- id: 12176
  text: >-
    {:unk13 C5 00 50 00}{:unk06 00}{:unk08 01 00 05}Necessitem 4.800 calés.

    Però només en tenim...
- id: 12177
  text: '{:unk13 72 01 50 00}{:unk06 00}{:unk08 01 00 07}Jo en tinc 800.'
- id: 12178
  text: '{:unk13 82 00 5A 00}{:unk06 00}{:unk08 01 00 05}Jo, 650.'
- id: 12179
  text: '{:unk13 F6 00 61 00}{:unk06 00}{:unk08 01 01 06}Jo 150. Em sap greu.'
- id: 12180
  text: >-
    {:unk13 18 01 46 00}{:unk06 00}{:unk08 01 00 05}Tenim 1.600 calés!

    En necessitem 3.200 més.
- id: 12181
  text: >-
    {:unk13 18 01 46 00}{:unk06 00}{:unk08 01 00 05}Haurem de treballar una mica

    per aconseguir la pasta!{:clear }Cadascú ha d'aconseguir 800

    calés abans que surti el tren!
- id: 12182
  text: >-
    {:unk13 54 01 64 00}{:unk06 00}{:unk08 01 01 07}Ens veiem a l'estació amb 

    la pasta entre les mans!
- id: 12183
  text: >-
    {:unk13 78 00 82 00}{:unk06 00}{:unk08 01 00 05}No deia que se

    n'encarregava ell?
- id: 12184
  text: >-
    {:unk13 D8 00 7B 00}{:unk06 00}{:unk08 01 00 05}Ves a saber. Però jo no

    em quedo sense galetes.
- id: 12185
  text: >-
    {:unk13 96 01 40 00}{:unk06 00}{:unk08 01 01 05}Estem 

    tots a punt?
- id: 12186
  text: '{:unk13 C2 00 69 00}{:unk06 00}{:unk08 01 01 07}I bé? Quant en tenim?'
- id: 12187
  text: '{:unk13 D3 00 4D 00}{:unk06 00}{:unk08 01 00 05}A veure...'
- id: 12188
  text: '{:unk13 D3 00 4D 00}{:unk06 00}{:unk08 01 00 05}Només.'
- id: 12189
  text: '{:unk13 37 01 4C 00}{:unk06 00}{:unk08 01 01 06}Ben fet.'
- id: 12190
  text: >-
    {:unk13 96 01 40 00}{:unk06 00}{:unk08 01 01 05}Estem

    tots a punt?
- id: 12191
  text: '{:unk13 C2 00 69 00}{:unk06 00}{:unk08 01 01 07}I bé? Quant en tenim?'
- id: 12192
  text: '{:unk13 D3 00 4D 00}{:unk06 00}{:unk08 01 00 05}A veure...'
- id: 12193
  text: '{:unk13 D3 00 4D 00}{:unk06 00}{:unk08 01 00 05}Només això.'
- id: 12194
  text: >-
    {:unk13 5C 01 39 00}{:unk06 00}{:unk08 01 01 06}Genial,

    Roxas!
- id: 12195
  text: '{:unk13 97 00 7F 00}{:unk06 00}{:unk08 01 01 05}Sabia que ho aconseguiries!'
- id: 12196
  text: >-
    {:unk13 96 01 40 00}{:unk06 00}{:unk08 01 01 05}Estem

    tots a punt?
- id: 12197
  text: '{:unk13 C2 00 69 00}{:unk06 00}{:unk08 01 01 07}I bé? Quant en tenim?'
- id: 12198
  text: '{:unk13 D3 00 4D 00}{:unk06 00}{:unk08 01 00 05}A veure...'
- id: 12199
  text: '{:unk13 D3 00 4D 00}{:unk06 00}{:unk08 01 00 05}Només això.'
- id: 12200
  text: >-
    {:unk13 6E 01 3D 00}{:unk06 02}{:unk08 03 01 06}Wow, Roxas!

    És increïble!
- id: 12201
  text: >-
    {:unk13 4C 01 66 00}{:unk06 00}{:unk08 01 00 06}Podem comprar fins 

    i tot una cindria!
- id: 12202
  text: '{:unk13 79 00 8C 00}{:unk06 00}{:unk08 01 01 07}Perfecte!'
- id: 12203
  text: >-
    Ben fet, nois. Sumant-hi el que 

    teniem, això arriba a un total de...
- id: 12204
  text: Tatxam! 5.000 calés!
- id: 12205
  text: Mola!
- id: 12206
  text: Anem pels bitllets!
- id: 12207
  text: >-
    No podrem estar sempre junts...{:delay 5D 00}{:clear }així que aprofitem el temps

    i fem alguna cosa inolvidable.
- id: 12208
  text: Què?
- id: 12209
  text: T'he enxampat!
- id: 12210
  text: Ei!
- id: 12211
  text: ''
- id: 12212
  text: ''
- id: 12213
  text: Què?
- id: 12214
  text: Roxas! Tres minuts!
- id: 12215
  text: Vaig!
- id: 12216
  text: Quatre d'estudiants!
- id: 12217
  text: Roxas, els diners.
- id: 12218
  text: Espera...
- id: 12219
  text: No!
- id: 12220
  text: ''
- id: 12221
  text: On vas?
- id: 12222
  text: Quan he caigut fa un moment
- id: 12223
  text: Xaval?
- id: 12224
  text: No ha pogut anar molt... lluny...
- id: 12225
  text: De què parles?
- id: 12226
  text: No hi havia cap xaval.
- id: 12227
  text: ''
- id: 12228
  text: Però si...
- id: 12229
  text: De veritat? No l'heu vist?
- id: 12230
  text: Oh, vaja...
- id: 12231
  text: No hi havia ningú... allà?
- id: 12232
  text: Se t'està desfent.
- id: 12233
  text: Em sap greu.
- id: 12234
  text: Anima't, home!
- id: 12235
  text: És que ha estat una cosa molt rara.
- id: 12236
  text: Què estrany...
- id: 12237
  text: Ja et dic.
- id: 12238
  text: Pots sentir el Sora?
- id: 12239
  text: Pots sentir el Sora?
- id: 12240
  text: Restauració al 28%.
- id: 12241
  text: Naminé, afanya't.
- id: 12242
  text: Tan difícil és fer una platja?
- id: 12243
  text: >-
    Seria donar a l'enemic

    un altre punt d'entrada.
- id: 12244
  text: I això?
- id: 12245
  text: >-
    Sempre podem gastar-nos-ho

    en gelats de sal marina.
- id: 12246
  text: >-
    Tot allò que pertany a aquella ciutat

    ha de mantenir-se fora del món real.{:delay 09 01}{:clear }Esborra-ho.
- id: 12247
  text: Qui ets?
- id: 12248
  text: Eh?
- id: 12249
  text: >-
    {:unk13 18 01 50 00}{:unk06 00}{:unk08 02 00 05}«Ens veiem a l'estació. Avui

    ens en anem a la platja! La pasta

    no és problema.
                      Hayner»
- id: 12250
  text: Ei.
- id: 12251
  text: Bon dia.
- id: 12253
  text: Hola, Roxas.
- id: 12254
  text: Hola...
- id: 12255
  text: I tu ets...?
- id: 12256
  text: Volia veure't almenys una vegada.
- id: 12257
  text: A mi?
- id: 12258
  text: Sí, a tu.
- id: 12259
  text: >-
    L'Olette m'ha embolicat

    per anar-hi de compres.
- id: 12260
  text: Ei! Vols venir?
- id: 12261
  text: >-
    Eh? Mmm... Espera...

    Heu vist allò?
- id: 12262
  text: S'està escapolint...
- id: 12263
  text: >-
    Doncs tu mateix. Ens veiem 

    després, Roxas. D'acord?
- id: 12264
  text: Entesos...
- id: 12265
  text: Haurà anat a aquella mansió encantada?
- id: 12266
  text: Eh?
- id: 12267
  text: Deixa'm anar!
- id: 12268
  text: Ei, gallina.
- id: 12269
  text: Què és allò?
- id: 12270
  text: >-
    No ho sé, però s'han

    passat de la ratlla!
- id: 12271
  text: Busca una arma!
- id: 12272
  text: Què fotut...
- id: 12273
  text: Roxas! Utilitza la clau espasa!
- id: 12274
  text: Em dic Naminé.
- id: 12275
  text: Roxas...{:delay 34 00}{:clear }{:delay 60 00}{:clear }et recordes del teu veritable nom?
- id: 12276
  text: Controla la llengua, Naminé.
- id: 12277
  text: Pero si ningú li ho diu, el Roxas...
- id: 12278
  text: És millor que no sàpiga la veritat.
- id: 12279
  text: Ei! Tu ets aquell pispa!
- id: 12281
  text: Seifer, monstre, fes una postura guapa.
- id: 12282
  text: Què et sembla així?
- id: 12283
  text: T'ha quedat brutal, nano!
- id: 12284
  text: Espera que te'n fem una altra.
- id: 12285
  text: Per què és allò?
- id: 12286
  text: Un record.
- id: 12287
  text: >-
    Per celebrar que aquells pocatraces

    carablancs han fumut el camp.
- id: 12288
  text: Llis i pla.
- id: 12289
  text: Què eren aquelles coses?
- id: 12290
  text: Forasters, allò eren.
- id: 12291
  text: >-
    I si no segueixen les normes

    de per aquí,{:delay AA 00}{:clear }hauré de donar-los unes

    leccions de disciplina.
- id: 12292
  text: >-
    I tant que sí! El Seifer sempre

    es preocupa per la ciutat
- id: 12293
  text: ''
- id: 12294
  text: Espereu!
- id: 12295
  text: >-
    Ei! No us podeu fer enrere 

    pel torneig de demà!
- id: 12296
  text: Us estarem esperant!
- id: 12297
  text: >-
    O sigui que... has estat 

    amb la colla del Seifer?
- id: 12298
  text: No... No és això...
- id: 12299
  text: >-
    I a veure, què us sembla la platja?

    No hi anàveu avui?
- id: 12300
  text: >-
    No hi hem anat.

    No seria el mateix sense tu, no?
- id: 12301
  text: '... Ho sento.'
- id: 12302
  text: >-
    Ei... què us sembla si hi anem demà?{:delay D2 00}{:clear }Podríem comprar unes

    galetes salades i...
- id: 12303
  text: Ja tinc altres plans.
- id: 12304
  text: Oohh...
- id: 12305
  text: Ah!
- id: 12306
  text: >-
    Ens hi apuntem els dos

    i arribem a la final! {:delay 95 00}{:clear }Així, guanyi qui guanyi,

    ens repartirem el premi!
- id: 12307
  text: Va! Fet.
- id: 12308
  text: Junts ho petareu!
- id: 12309
  text: A totes!
- id: 12310
  text: Promès!
- id: 12311
  text: Jo piro.
- id: 12312
  text: Restauració al 48%.
- id: 12313
  text: Era una Naminé feta de dades?
- id: 12314
  text: >-
    No... La Naminé ha piratejat

    aquelles dades ella soleta.{:delay 04 01}{:clear }{:delay 3C 00}{:clear }Mira el que acaba de fer!{:delay 64 00}{:clear } {:delay 3F 00}{:clear }Està totalment fora del meu control.
- id: 12315
  text: Calma't.
- id: 12316
  text: >-
    Tant és.{:delay 64 00}{:clear } {:delay 69 00}{:clear }Mentre la Naminé compleixi

    amb el seu objectiu...{:delay CF 00}{:clear }{:delay 30 00}{:clear }no haurem de preocupar-nos

    pel que li passi al Roxas.
- id: 12999
  text: >-
    Encara tenia els diners. Segur

    que me l'ha tret aquell xaval!
- id: 13173
  text: He tornat a somiar amb ell...
- id: 13174
  text: Nano, no et toca els nassos?
- id: 13175
  text: Sí. Em sembla terrible.
- id: 13176
  text: El Seifer s'ha passat aquest cop.
- id: 13177
  text: >-
    Ja sé que hi ha hagut 

    robatoris a la ciutat.{:delay E1 00}{:clear }I que tenim asumptes 

    pendents amb el Seifer.{:delay A6 00}{:clear }Si vol pensar que hem estat

    nosaltres, puc entendre-ho.{:delay FA 00}{:clear }Però... no és això el 

    que més em molesta.
- id: 13178
  text: >-
    El que de veritat m'emprenya...{:delay 58 00}{:clear }és que va per allà dient a tot

    el món que som els lladres.{:delay C3 00}{:clear }{:delay 14 00}{:clear }I ara tots ens tracten com 

    si fóssim uns pispes.
- id: 13179
  text: >-
    Heu estat tan cabrejats

    alguna vegada en la vida?{:delay B4 00}{:clear }{:delay 0A 00}{:clear }Perque jo no.{:delay 32 00}{:clear }Mai. Mai de la vida.
- id: 13180
  text: A veure, què fem?
- id: 13181
  text: Ehhh... doncs...
- id: 13182
  text: >-
    I si busquem els lladres de

    veritat? Això aclararia les coses.
- id: 13183
  text: Ei, em sona bé!
- id: 13184
  text: I què passa amb el Seifer?
- id: 13185
  text: >-
    Primer... hem de 

    netejar el nostre nom.{:delay B4 00}{:clear }Quan trobem el

    culpable de veritat,{:delay 6F 00}{:clear }tothom ens deixarà en pau.
- id: 13186
  text: ''
- id: 13187
  text: Oh, no!
- id: 13188
  text: Han desaparegut!{:delay 3A 00}{:clear }Les nostres ----- no hi són!
- id: 13189
  text: Les ----- no hi són?
- id: 13190
  text: >-
    No podeu dir -----...

    Però què?
- id: 13191
  text: Pero sí enteneu el que us dic, no?{:delay 98 00}{:clear }Les nostres ----- no hi són!
- id: 13192
  text: Robades?
- id: 13193
  text: >-
    No només les -----.{:delay 78 00}{:clear }La paraula -----!

    També l'han robada!
- id: 13194
  text: Quina classe de lladre és aquest?{:delay 80 00}{:clear }El Seifer no ha pogut fer una cosa així.
- id: 13195
  text: Exacte.
- id: 13196
  text: Au va! És l'hora d'investigar!
- id: 13197
  text: Eh!?
- id: 13198
  text: El seu cor està tornant.
- id: 13199
  text: Sens dubte. Aviat es despertarà.
- id: 13200
  text: Roxas, som-hi.
- id: 13201
  text: '{:unk13 59 01 91 00}{:unk08 01 00 05}Per aquí!'
- id: 13202
  text: >-
    {:unk13 12 01 38 00}{:unk08 01 01 06}Anem a investigar

    el que ha passat.
- id: 13204
  text: >-
    {:unk13 F3 00 42 00}{:unk08 01 00 05}No hem robat

    res, entesos?
- id: 13205
  text: >-
    {:unk13 6F 01 4C 00}{:unk08 01 00 05}M'agradaria creure't,

    però...{:clear }Qui més voldria

    robar coses així?
- id: 13206
  text: '{:unk13 F3 00 4C 00}{:unk08 01 00 05}Quines coses?'
- id: 13207
  text: >-
    {:unk13 54 01 3C 00}{:unk08 01 00 06}Com si no ho sapiguessis.

    No t'ho penso dir.{:clear }Ves i pregunta-hi a la

    botiga d'accessoris.
- id: 13208
  text: >-
    {:unk13 1B 01 60 00}{:unk08 01 01 06}Au va, Roxas,

    pregunta-li-ho.
- id: 13209
  text: >-
    {:unk13 BA 00 4B 00}{:unk08 01 01 06}Oh, ets tu, Roxas...

    No em decepcionis.{:clear }Solies ser un dels

    meus clients preferits.
- id: 13210
  text: '{:unk13 93 00 8A 00}{:unk08 01 01 06}Jo no soc un lladre!'
- id: 13211
  text: "{:unk13 13 01 4B 00}{:unk08 01 01 06}D'acord..."
- id: 13212
  text: >-
    {:unk13 B2 00 7A 00}{:unk08 01 01 05}No em fa cap gràcia

    que tots sospitin de mi..
- id: 13213
  text: >-
    {:unk13 CE 00 4B 00}{:unk08 01 01 06}Doncs has de trobar la

    manera de netejar el teu nom.{:clear }La dona de la botiga de llaminadures

    està molt disgustada també.
- id: 13214
  text: >-
    {:unk13 FA 00 48 00}{:unk08 01 00 05}Roxas?{:clear }Has vist el meu

    gat per allà?
- id: 13215
  text: '{:unk13 C6 00 31 00}{:unk08 01 01 06}Mmm...'
- id: 13216
  text: '{:unk13 F4 00 54 00}{:unk08 01 00 05}Gràcies, Roxas.'
- id: 13217
  text: >-
    {:unk13 A2 00 3B 00}{:unk08 01 01 06}Li han robat alguna

    cosa, a vostè?
- id: 13218
  text: >-
    {:unk13 EF 00 45 00}{:unk08 01 00 05}Sí, fillets, sí.

    Una cosa important.
- id: 13219
  text: >-
    {:unk13 A4 00 3B 00}{:unk08 01 01 06}Doncs nosaltres

    no hem estat.
- id: 13220
  text: '{:unk13 EC 00 54 00}{:unk08 01 00 05}Et crec.'
- id: 13221
  text: >-
    {:unk13 AB 00 3B 00}{:unk08 01 01 06}Gràcies,

    senyora.{:clear }I què li

    han robat?
- id: 13222
  text: >-
    {:unk13 EB 00 45 00}{:unk08 01 00 05}Les meves ----.{:clear }Les meves 

    precioses ----.
- id: 13223
  text: >-
    {:unk13 25 01 ED 00}{:unk08 01 01 02}Sembla que el 

    culpable va per 

    allà robant ----.
- id: 13224
  text: >-
    {:unk13 26 01 3C 00}{:unk08 01 01 06}I no només ----,{:clear }sinó la pròpia 

    paraula ----, també.
- id: 13225
  text: >-
    {:unk13 87 01 FE 00}{:unk08 01 01 02}No és un lladre

    normal...
- id: 13226
  text: >-
    {:unk13 24 01 60 00}{:unk08 01 00 05}Em pregunto si el

    Seifer en sabrà res.
- id: 13227
  text: >-
    {:unk13 21 01 3B 00}{:unk08 01 00 05}Hauríem de parlar amb ell.

    Som-hi, cap al solar!
- id: 13228
  text: Els pispes!
- id: 13229
  text: >-
    Aquest cop heu caigut molt 

    baix, us queda clar?
- id: 13230
  text: Ah, sí?
- id: 13231
  text: Ets tot un orador, rosset.
- id: 13232
  text: De què vas?
- id: 13233
  text: Ja podeu començar a tornar-nos la ----- ara.
- id: 13234
  text: >-
    Només penya com vosaltres seríeu

    capaços de robar-la.
- id: 13236
  text: Un cop més!
- id: 13237
  text: '{:delay 6E 00}Així es parla!'
- id: 13238
  text: >-
    Si us poseu de genolls i supliqueu,

    potser us ho passo per alt.
- id: 13240
  text: Roxas!
- id: 13241
  text: Roxas, concentra't!
- id: 13242
  text: Au va!{:delay 48 00}{:clear }{:delay 22 00}{:clear }Deixa de fer el burro i lluita!
- id: 13243
  text: Mmm.
- id: 13244
  text: Es que el Seifer no es troba gaire bé, saps?
- id: 13245
  text: El torneig decidirà.
- id: 13247
  text: Què era allò?
- id: 13248
  text: El lladre?
- id: 13249
  text: ''
- id: 13250
  text: Els bons sempre guanyen! Sí senyor!
- id: 13251
  text: Oh!
- id: 13252
  text: Què carai fas?
- id: 13253
  text: És el lladre?
- id: 13254
  text: A per ell!
- id: 13255
  text: '{:unk13 01 01 CE 00}Hem vingut per vos, nostre senyor.'
- id: 13256
  text: Eh?
- id: 13257
  text: És inútil...
- id: 13258
  text: Què?
- id: 13259
  text: Què... què és això?
- id: 13260
  text: Què és això?
- id: 13261
  text: >-
    Jo vaig ser el seu primer client 

    quan es va fer càrrec de la botiga,{:delay D6 00}{:clear }així que ens vam fer una foto.
- id: 13262
  text: És una foto preciosa.
- id: 13263
  text: Apa!
- id: 13264
  text: Ei! Acabes de dir «foto»!
- id: 13265
  text: >-
    Aviam, Roxas,

    parla'ns del lladre de fotos.
- id: 13266
  text: >-
    No n'hi ha molt a dir.

    Les fotos eren allà a terra.
- id: 13267
  text: >-
    I com demostrarem que

    no hem estat nosaltres?
- id: 13268
  text: És una noia...
- id: 13269
  text: Sembles content, Roxas.
- id: 13270
  text: Au va...
- id: 13271
  text: O sigui que ningú més s'ha fixat que{:delay 8C 00}{:clear }totes les fotos robades són del Roxas?
- id: 13272
  text: >-
    Aahh...{:delay 63 00}{:clear }Per això tots creien

    que érem nosaltres.
- id: 13273
  text: >-
    Llavors el Seifer no ha 

    anat per allà acusant-nos?
- id: 13274
  text: De veritat són totes meves?
- id: 13275
  text: Sí.
- id: 13276
  text: Veus?
- id: 13277
  text: Mira.
- id: 13278
  text: Sí. Fins l'última.
- id: 13279
  text: >-
    I si el lladre volgués robar el

    Roxas de veritat o una cosa així?
- id: 13280
  text: >-
    No flipis, nano.{:delay 73 00}{:clear }Per què algú hauria de voler  

    un gamarús com el Roxas?
- id: 13281
  text: Oh, gràcies!
- id: 13282
  text: ''
- id: 13283
  text: On... soc?
- id: 13284
  text: Qui hi ha?
- id: 13285
  text: Qui ets tu?
- id: 13286
  text: Restauració al 12%.
- id: 13287
  text: >-
    Els indesitjables de l'Organització...

    ens han trobat.
- id: 13288
  text: >-
    Per què... aquells incorporis haurien

    de robar les fotografies?
- id: 13289
  text: >-
    Perquè ho veuen tot 

    com simples dades.{:delay 9E 00}{:clear }{:delay 2C 00}{:clear }Són tan aturats que no

    en noten la diferència.{:delay AB 00}{:clear }{:delay 7C 00}{:clear }No tenim molt de temps.{:delay 73 00}{:clear }{:delay 5C 00}{:clear }La Naminé s'ha d'afanyar.
- id: 13290
  text: Vaig fer una... promesa?...
- id: 13291
  text: Quin embolic!
- id: 13292
  text: >-
    {:unk13 22 01 50 00}{:unk08 01 00 05}Corre, cap al solar!

    Arribaràs tard!
- id: 13293
  text: A qui animaràs?
- id: 13294
  text: Als dos, burro.
- id: 13295
  text: >-
    Senyores i senyors de

    Vila Crepuscle!{:delay 92 00}{:clear }Ja és aquí l'enfrontament

    més frenètic de l'estiu!
- id: 13296
  text: >-
    Efectivament!{:delay 72 00}{:clear }Avui se celebra el combat

    pel títol d'Struggle!
- id: 13297
  text: Qui serà capaç de donar la campanada{:delay 7F 00}{:clear }i destronar el vigent campió, Setzer?
- id: 13298
  text: El Seifer!
- id: 13299
  text: >-
    Qui serà coronat avui com

    el nou campió d'Struggle!?
- id: 13300
  text: El Hayner! El Roxas!
- id: 13301
  text: Setzeerrrrrr!
- id: 13302
  text: >-
    Sí, el públic està ardent 

    i ja sabeu què ve ara.
- id: 13303
  text: Que comenci l'...
- id: 13304
  text: Struggle!
- id: 13305
  text: >-
    Us presentaré els

    aspirants d'avui!{:delay EE 00}{:clear }Quatre tipus durs que han

    superat les rondes preliminars!
- id: 13306
  text: >-
    El finalista habitual i president del

    Comité de Disciplina de Vila Crepuscle:{:delay D7 00}{:clear }Seifer!
- id: 13307
  text: >-
    Sortit completament del no-res.{:delay 75 00}{:clear }Qui hagués ni tan sols pensat que

    arribaria tan lluny aquest any? Vivi!
- id: 13308
  text: >-
    El preferit dels suburbis i

    el més murri del poble: Hayner! {:delay 08 01}{:clear }És la seva primera vegada a la final!
- id: 13309
  text: >-
    I el quart en discòrdia,

    que resulta ser el meu client preferit:{:delay 04 01}{:clear }Roxas!
- id: 13310
  text: >-
    Així doncs... qui guanyarà la

    final d'aquest xafogós estiu?
- id: 13311
  text: >-
    I...{:delay 1E 00}{:clear }l'oportunitat d'enfrontar-se

    al vigent campió, Setzer!
- id: 13312
  text: >-
    Ja no queda gaire, gent.{:delay 60 00}{:clear }Recomano als aspirants que consultin

    les Normes Oficials de l'Struggle{:delay B6 00}{:clear }abans de començar.
- id: 13313
  text: >-
    {:unk13 44 01 58 00}{:unk08 01 00 05}Ja coneixeu les normes, però tot 

    i així, mai va malament recordar-les.
- id: 13314
  text: Ei...{:delay 28 00}{:clear }perdona'm pel que va passar ahir.
- id: 13315
  text: Què? Segueixes preocupat per allò? {:delay 9B 00}{:clear }No cal que et capfiquis per coses així.
- id: 13316
  text: Són massa coses.
- id: 13317
  text: Ho sento, nano.
- id: 13318
  text: Espera, per què ho haig de sentir?
- id: 13319
  text: >-
    El nostre primer combat del torneig

    d'avui serà entre{:delay D8 00}{:clear }el Roxas i el seu millor amic, Hayner!
- id: 13320
  text: I el guanyador és... el Roxas!
- id: 13321
  text: >-
    Ni tan sols l'amistat

    pot frenar aquest noi...{:delay 9B 00}{:clear }i mira que el Hayner ha

    fet un gran combat.
- id: 13322
  text: He perdut.{:delay 7F 00}{:clear }No m'ho puc creure.
- id: 13323
  text: Veig que t'he ensenyat bé.
- id: 13324
  text: >-
    M'ho he passat molt

    bé lluitant amb tu.
- id: 13325
  text: Ja. Doncs jo no, crac.
- id: 13326
  text: Au va, home, anima't una mica.
- id: 13327
  text: Bah... estic bé.
- id: 13328
  text: Aparta't.
- id: 13329
  text: Tens pressa per perdre?
- id: 13330
  text: Respecta els teus superiors.
- id: 13331
  text: >-
    {:delay 31 00}Guau, mireu com salten espurnes! {:delay 91 00}{:clear }Suposo que el Seifer no esperava

    lluitar contra un dels seus!
- id: 13332
  text: Des de quan el Vivi és un os tan dur de rosegar?
- id: 13333
  text: Ja ets meu!
- id: 13334
  text: >-
    No... No sé molt 

    bé què ha pasat...
- id: 13335
  text: '... però... el guanyador és el Vivi! {:delay EB 00}{:clear }Ha estat una remontada tremenda!'
- id: 13336
  text: Aquell no és el Vivi.
- id: 13337
  text: Eh?
- id: 13338
  text: Estova'l.
- id: 13339
  text: >-
    Em sembla que el Seifer s'ha 

    retirat del combat pel tercer lloc.
- id: 13340
  text: Llavors soc el tercer? {:delay 64 00}{:clear } {:delay 14 00}{:clear }Sí senyor!
- id: 13341
  text: Jugueu net, nois.
- id: 13342
  text: >-
    I ara, el combat que estàveu

    esperant:{:delay BB 00}{:clear }El Roxas contra el Vivi!
- id: 13343
  text: Un altre cop?
- id: 13344
  text: Un altre cop...?
- id: 13345
  text: >-
    Molt bé, Roxas.

    Lluita rere lluita.
- id: 13346
  text: És que no em recordes? {:delay 60 00}{:clear } {:delay 25 00}{:clear }Soc jo. {:delay 33 00}{:clear } {:delay 1D 00}{:clear }Ja saps,{:delay 59 00}{:clear }l'Àxel.
- id: 13347
  text: Àxel?
- id: 13348
  text: >-
    La teva ment està 

    completament en blanc.{:delay 86 00}{:clear } {:delay 20 00}{:clear }Quina passada!{:delay 6A 00}{:clear }Ni els foscants podran amb aquesta!
- id: 13349
  text: Espera! Digue'm què està passant.
- id: 13350
  text: >-
    Aquesta ciutat, és 

    la seva creació, oi? {:delay 97 00}{:clear } {:delay 38 00}{:clear }I això vol dir que no hi ha 

    temps per a preguntes.{:delay 8A 00}{:clear } {:delay 34 00}{:clear }Tu vens amb mi,

    conscient o no.{:delay 9F 00}{:clear }I després ja en parlarem.
- id: 13351
  text: Oh, oh!
- id: 13352
  text: Què està passant!
- id: 13353
  text: El número tretze. Roxas.{:delay B4 00}{:clear } {:delay 43 00}{:clear }L'escollit de la clau espasa.
- id: 13354
  text: Molt bé!{:delay 41 00}{:clear }Tu t'ho has buscat!
- id: 13355
  text: ''
- id: 13356
  text: Així que eres tu!
- id: 13357
  text: Roxas, aquest home només diu insensateses!
- id: 13358
  text: Roxas, no et deixis enganyar!
- id: 13359
  text: Roxas!
- id: 13360
  text: Roxas!
- id: 13361
  text: Hayner...{:delay 5A 00}{:clear }Pence...{:delay 55 00}{:clear }Olette...
- id: 13362
  text: Hayner! Pence! Olette!
- id: 13363
  text: >-
    Què?

    Què ha passat?
- id: 13364
  text: '{:delay 0A 00}{:clear }Eh? {:delay 1E 00}{:clear } {:delay 6E 00}{:clear }Com he acabat aquí?'
- id: 13365
  text: Roxas!
- id: 13366
  text: Dames i cavallers!{:delay 62 00}{:clear }Roxas! El nostre nou gran campió!
- id: 13367
  text: Roxas?
- id: 13368
  text: Setzeerrrr!
- id: 13369
  text: Roxas! Que comença!
- id: 13370
  text: >-
    Vosaltres dos, jugueu net.

    Tots dos heu arribat al cim.
- id: 13371
  text: Allà només hi ha lloc per a un.
- id: 13372
  text: En fi... que guanyi el millor!
- id: 13373
  text: >-
    Ei, rucàs.{:delay 7E 00}{:clear } {:delay 14 00}{:clear }Què et sembla si ho deixes estar

    i t'estalvies la humiliació?
- id: 13374
  text: Roxas! Concentra't!
- id: 13375
  text: Deixa't guanyar i t'ho compensaré.
- id: 13376
  text: Uf... madura.
- id: 13377
  text: >-
    Roxas, la nova revelació,

    contra Setzer, l'actual campió!{:delay 0E 01}{:clear } {:delay 1B 00}{:clear }El guanyador d'aquest combat 

    serà l'autèntic campió! {:delay B4 00}{:clear } {:delay 16 00}{:clear }I podrà vacil・lar durant

    tot un any, amics meus!
- id: 13378
  text: >-
    Gràcies per la victòria, soci.

    Te la dedico.
- id: 13379
  text: Roxas! Roxas!
- id: 13380
  text: Roxas!
- id: 13381
  text: Ho has aconseguit!
- id: 13382
  text: Ha sigut una passada, Roxas!
- id: 13383
  text: Roxas! Roxas!
- id: 13384
  text: Els tractes són tractes.
- id: 13385
  text: Moltes gràcies, Roxas!
- id: 13386
  text: Un altre tresor més per compartir.
- id: 13387
  text: >-
    Jo també tinc un regal...

    per a tots.
- id: 13388
  text: Oohh!
- id: 13389
  text: Naminé...{:delay 75 00}{:clear }Què m'està passant?
- id: 13390
  text: >-
    Qui ets?

    I aquell no és el meu nom.{:delay 9A 00}{:clear }Soc la Kairi.
- id: 13391
  text: Kairi... Jo et conec.{:delay 78 00}{:clear }{:delay 28 00}{:clear }Ets la noia que li agrada.
- id: 13392
  text: A qui?
- id: 13393
  text: Si us plau, digues el nom!
- id: 13394
  text: Soc en Roxas.
- id: 13395
  text: >-
    D'acord, Roxas,

    però com es diu ell?
- id: 13396
  text: No et recordes del meu nom? {:delay 7C 00}{:clear }Moltes gràcies, Kairi!
- id: 13397
  text: ''
- id: 13398
  text: >-
    Està bé,

    suposo que puc donar-te una pista.
- id: 13399
  text: Comença amb la «S»!
- id: 13400
  text: El seu progrés és esbalaïdor.
- id: 13401
  text: Què ha passat?
- id: 13402
  text: >-
    La trobada de la Naminé amb en Roxas va posar{:delay 78 00}{:clear }el seu cor en contacte

    amb el de la Kairi.{:delay AA 00}{:clear } {:delay 4F 00}{:clear }I això, de passada, ha afectat el Sora.{:delay BF 00}{:clear } {:delay 14 00}{:clear }Ho entens?
- id: 13403
  text: La Naminé...{:delay 5A 00}{:clear } {:delay 1E 00}{:clear }és tot un prodigi.
- id: 13404
  text: >-
    No va nèixer com els altres incorporis.{:delay 96 00}{:clear } {:delay 3F 00}{:clear }Pot interferir en els cors

    i els records del Sora{:delay B1 00}{:clear }i dels qui són amb ell.
- id: 13405
  text: De qui és l'incorpori ella?
- id: 13406
  text: >-
    Podria dir-t'ho...{:delay 8B 00}{:clear } {:delay 33 00}{:clear }però potser primer hauries 

    d'il・luminar-me amb el teu veritable nom.
- id: 13407
  text: És Ànsem.
- id: 13408
  text: '{:delay D7 00}{:clear } {:delay 76 00}{:clear }És un honor, Ànsem!'
- id: 13409
  text: Estava somiant...
- id: 13410
  text: Però era tot... un somni?
- id: 13411
  text: >-
    Només queden tres dies de

    vacances d'estiu,{:delay 97 00}{:clear }així que ni mencionis els deures.
- id: 13412
  text: >-
    Vam quedar que 

    els acabaríem avui.
- id: 13413
  text: Ahir...{:delay 38 00}{:clear }vaig caure de la torre de l'estació, no?
- id: 13414
  text: Llavors no series aquí!
- id: 13415
  text: Però nano, et va anar d'un pèl...
- id: 13416
  text: Pareu de canviar de tema!
- id: 13417
  text: Molt bé, molt bé!
- id: 13418
  text: >-
    Tu guanyes. Farem els deures.{:delay 91 00}{:clear }Estúpida redacció lliure...{:delay 6F 00}{:clear }{:delay 0A 00}{:clear }Aviam, algú té alguna idea

    brillant per al tema?
- id: 13419
  text: >-
    Podríem estudiar les coses

    que m'estan passant.{:delay EB 00}{:clear }{:delay 0A 00}{:clear }Ja sabeu... els somnis...

    i aquells tipus de blanc...
- id: 13420
  text: Ni parlar-ne.
- id: 13421
  text: Per què?
- id: 13422
  text: >-
    Mira, alguna cosa estranya 

    us passa a la ciutat i a tu{:delay 96 00}{:clear }des que van robar les fotos.
- id: 13423
  text: >-
    Doncs demà registrarem el poble

    i esbrinarem què està passant.
- id: 13424
  text: Tothom ens donarà un cop de mà.
- id: 13425
  text: Tot això per mi?
- id: 13426
  text: Vaig per uns gelats!
- id: 13427
  text: >-
    {:unk13 EA 00 87 00}{:unk08 01 00 05}Hi ha un estrany rumor

    circulant per allà.{:clear }Voleu escoltar-lo?
- id: 13428
  text: >-
    {:unk13 AE 00 4E 00}{:unk08 01 01 06}Coneixeu les escales de 

    l'Estació del Capvespre, no?
- id: 13429
  text: >-
    {:unk13 B5 00 51 00}{:unk06 01}{:unk08 01 01 06}Hi pugem i en baixem 

    sense fixar-nos-hi gaire.{:clear }Però... i aquí es troba la part més desconcertant;{:clear }el nombre d'esglaons en varia

    segons hi puges o en baixes.
- id: 13430
  text: '{:unk13 0B 01 50 00}{:unk06 02}{:unk08 03 00 05}De debò!?'
- id: 13431
  text: >-
    {:unk13 49 01 79 00}{:unk08 01 01 05}Hi ha unes altres sis històries

    estranyes com aquella.{:clear }Serien com...{:clear }... les Set Meravelles

    de Vila Crepuscle.
- id: 13432
  text: >-
    {:unk13 40 01 50 00}{:unk08 01 00 05}Podríem investigar-les per al

    nostre treball de l'escola!{:clear }Pence, ets un geni!
- id: 13433
  text: >-
    {:unk13 E6 00 50 00}{:unk08 01 00 05}Hi deu haver més

