- id: 13488
  text: Som-hi.
- id: 13489
  text: Ha vingut un tren de la platja que...{:delay 84 00}{:clear }anava sense maquinista, oi?
- id: 13490
  text: Marxem...
- id: 13491
  text: Oi?
- id: 13492
  text: Anem a casa a fer la redacció.
- id: 13493
  text: '«Els rumors eren falsos. Fi.»'
- id: 13494
  text: >-
