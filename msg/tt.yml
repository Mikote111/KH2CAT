- id: 13471
  text: No ho sé.{:delay 46 00}{:clear }{:delay 24 00}{:clear }Potser és el destí.
- id: 13472
  text: El destí...{:delay 4A 00}{:clear }En aquest cas, siguem amics.
- id: 13473
  text: Passo de deixar-me guiar pel destí.
- id: 13474
  text: I quan t'has deixat tu guiar per res?
- id: 13475
  text: Seifer?
- id: 13476
  text: Ho sé.{:delay 3C 00}{:clear }{:delay 14 00}{:clear }Demà.
- id: 13477
  text: Mireu!
- id: 13478
  text: Sí que existeix!
- id: 13479
  text: I no en va ningú a bord!
- id: 13480
  text: >-
    Quina és la treta?

    Hi ha d'haver una treta, no?
- id: 13481
  text: Llavors és real?
- id: 13482
  text: Anem a l'estació!
- id: 13483
  text: Pugem-hi!
- id: 13484
  text: Què?
- id: 13485
