- id: 18388
  text: '{:unk13 C3 00 3C 00}{:unk08 01 00 05}Vivi?'
- id: 18392
  text: '{:unk13 39 01 6D 00}{:unk08 01 01 06}Què passa, Roxas?'
- id: 18393
  text: >-
    {:unk13 4D 01 CE 00}{:unk08 01 00 07}Necessitaves això, Roxas?{:clear }Segur que pensaves

    a practicar una mica.
- id: 18396
  text: '{:unk13 5D 01 5E 00}{:unk06 02}{:unk08 03 00 05}Roxas!'
- id: 18397
  text: '{:unk13 8A 01 59 00}{:unk08 01 00 05}Estàs bé?'
- id: 18422
  text: >-
    Saps què és l'Struggle?

    Ho veuràs al quadrilàter.{:clear }Anima't i participa-hi. Creus que

    pots guanyar-me? Soc el campió.
- id: 18423
  text: >-
    {:unk13 00 01 40 01}{:unk08 02 00 06}Guanyes o perds! Sense rencor.

