- id: 21374
  text: "{:delayandfade 07 78} \nEl pla d'anar a la platja és perfecte,\nperò es requereix d'alguns calés.\nRes que el Hayner no tingui ja\npensat, així doncs, proposa al grup\nbuscar alguna feineta d'estiu\nper estalviar el que calgui.\n \nNo resulta fàcil, però tots posen\nde la seva part animats davant la idea\nde passar un gran dia de platja...\n"
- id: 21379
  text: >-
    {:unk13 2C 01 3C 00}{:unk08 01 01 06}Ui?

    Sora, t'ha caigut una cosa.
- id: 21380
  text: '{:unk13 4A 01 64 00}{:unk08 01 00 05}Eh?'
- id: 21381
  text: >-
    {:unk13 72 01 BE 00}{:unk08 01 00 00}T'haurà caigut

    de la butxaca.
- id: 21382
  text: >-
    {:unk13 9B 00 3C 00}{:unk08 01 00 04}Què és això?

    Sembla una part d'un dibuix.
- id: 21383
  text: '{:unk13 AA 00 96 00}{:unk08 01 00 05}Serà un regal també?'
- id: 21384
  text: >-
    {:unk13 04 01 E6 00}{:unk08 01 00 01}Oh?

    A nosaltres no ens mireu.
- id: 21385
  text: >-
    {:unk13 40 01 E6 00}{:unk08 01 00 02}Si era a la roba que t'han

    regalat, alguna cosa tindrà a

    veure amb la teva aventura, Sora.
- id: 21386
  text: >-
    {:unk13 59 01 18 01}{:unk08 01 01 02}No la perdis, estimat.{:clear }Si és una peça d'alguna cosa,

    potser reunir-ne la resta

    et porta una alegria.
- id: 21387
  text: >-
    {:unk13 C8 00 46 00}{:unk08 01 00 05}Sent així, m'ho apuntaré

    tot al meu diari.
- id: 21473
  text: "{:delayandfade 0A 78} \nDos individus es troben a vores\ndel Marge Fosc. Un d'ells\npregunta a l'altre amb un to enigmàtic\nsi recorda el seu nom vertader.\n \nPerò abans que pugui respondre,\nel somni cessa abruptament i dona\npas a un altre nou.\n \n \n"
- id: 21474
  text: "{:delayandfade 0A 78} \nEl mar porta aromes familiars i\nn'evoca les imatges d'una platja on\nun jove anomenat Sora solia jugar\namb els seus amics fins el capvespre.\n \nLlavors, s'obre una porta a un altre\nmón i la seva llar, les illes... tot\nés engolit per la foscor.\n \nTot. La seva millor amiga inclosa..."
- id: 21475
  text: "{:delayandfade 0A 78} \nArriba a una ciutat que no coneix\ni allà es troba amb en Donald i\nen Goofy. Com ell, busquen a un amic\nperdut, així que decideixen unir-se\na la seva cerca pels mons.\n \nAlgú va dir una vegada que aquella\nformidable arma, la clau espasa que\nbrandeix el jove, és la clau de tot.\n \n"
- id: 21476
  text: "{:delayandfade 0A 78} \nEls viatges pels mons es succeeixen,\nportant sempre aventures i nous\namics. I amb cada món visitar\nel cor del jove creix i creix.\n \nNo obstant això, cap d'aquells viatges\nl'han dut encara al costat de la seva\namiga perduda...\n \n \n"
- id: 21477
  text: "{:delayandfade 08 78} \nEn arribar al lloc de sempre,\nEl Roxas troba una nota\ndel Hayner que diu:\n\"«Ens veiem a l'estació.\nAvui ens en anem a la platja!\nLa pasta no és un problema\"».\n \nDesprés de llegir-la, el Roxas\nse'n va camí a l'estació.\n \n"
- id: 21478
  text: "{:delayandfade 0A 78} \nNomés l'escollit de la clau espasa pot\nobrir la porta secreta i canviar món.\n \nPotser el seu destí és lluitar.\nSigui com sigui, haurà de fer front\na nous enemics... L'encaputxat\nde negre i també l'Ànsem, el buscador\nde la foscor."
- id: 21479
  text: "{:delayandfade 07 78} \nLa idea del Pence dels rumors\nels sembla bona i tots decideixen\ninvestigar sobre les Set Meravelles\nper a les seves redaccions d'estiu.\n \nEl Hayner i l'Olette marxen a la\nciutat per buscar més rumors,\nmentre que el Roxas i el Pence es\ndisposen a comprovar què hi ha\nde veritat en ells.\n"
- id: 21480
  text: "{:delayandfade 0A 78} \nEls Roxas i els seus amics comproven\nles Set Meravelles una a una,\nperò ni una d'elles sembla tenir\nrealment res de meravellós.\n \n \n \n \n"
- id: 21481
  text: "{:delayandfade 0A 78} \nSegons l'Ànsem, la foscor és\nla veritable essència del cor.\n \nPerò fins i tot en el més profund\nde les tenebres, sempre hi ha una\nllum que mai s'apaga.\n\nEl Kingdom Hearts és llum i alberga\nel poder de contrarrestar tota foscor.\n \n"
- id: 21482
  text: "{:delayandfade 07 78} \nSegons el rei, l'ordinador de la vella\nmansió podria estar connectat amb\nl'altra Vila Crepuscle. Des d'allà,\npotser es podria arribar fins el Regne\nde la Foscor.\n \nIl・lusionat per la idea de reunir-se\namb el seu amic, el Sora registra cada\npam de la mansió. I llavors...\n \n"
- id: 21629
  text: "{:delayandfade 0A 78} \nDesprés de rescatar el cor de la Kairi, en Sora\ns'encamina a la batalla definitiva.\n \n\"Siguem on siguem,  els nostres\ncors tornaran a reunir-nos.\"\n \n\"No ho oblidis. Sempre estic amb tu.\"\n \nAquelles promeses ressonen ara\nmés fort que mai als seus cors."
- id: 21630
  text: "{:delayandfade 0A 78} \nEn Sora deixa el seu amic amb l'esperança\nque tornaran a reunir-se per molt\nlluny que acabi l'un de l'altre.\n \nEl viatge serà llarg i dur, però no\narribarà a la seva fi fins que tots\nsiguin a la seva llar.\n \nI així, comença l'aventura...\n \n"
- id: 21696
  text: Gràcies.
