  text: Es diu que el tren va buit:{:delay AD 00}{:clear }{:delay 26 00}{:clear }sense maquinista,{:delay 67 00}{:clear }sense revisor,{:delay 59 00}{:clear }sense passatgers...{:delay 51 00}{:clear }sense tornada.
- id: 13463
  text: L'any que ve hem d'anar a la platja.
