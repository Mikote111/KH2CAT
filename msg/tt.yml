- id: 14416
  text: >-
    En altres paraules, vull veure

    més dels teus «supermoviments».
- id: 14417
  text: >-
    Has dut el torneig amb molt d'estil{:delay 9B 00}{:clear }{:delay 14 00}{:clear }i vas dominar completament

    el combat pel títol.
- id: 14418
  text: Però no em canso de veure't.{:delay 8D 00}{:clear }Te n'adones?{:delay 48 00}{:clear }Els combats són massa curts!
- id: 14419
  text: I com et dius tu?
- id: 14420
  text: Sora.
- id: 14421
  text: >-
    Sora, si vols participar en un

    combat, només ho has de dir.
- id: 14433
  text: >-
    Era una prova innegable que

    us vam clavar una allisada, mocosos.
- id: 14434
  text: Què n'heu fet?{:delay 6C 00}{:clear }Cremar-la?
- id: 14435
  text: >-
    Ha! No necessitem una ----- per

    demostrar que sou una colla de matats.
- id: 14441
  text: Me l'ha tret!
- id: 14443
  text: '{:delay 4E 00}{:clear }A veure com tornem...'
- id: 14444
  text: Què estàs fent?
- id: 14445
  text: >-
    {:delay 54 00}{:clear }He enviat els meus lacais dins{:delay A3 00}{:clear }a veure si l'amo d'aquesta torre

    es tan gran i{:delay A7 00}{:clear } tan dur com diuen.
- id: 14446
  text: >-
    Diuen que és un bruixot

    molt poderós,{:delay AB 00}{:clear }així que seria el guardaespatlles

    perfecte per a mi.
- id: 14447
  text: >-
    Bah, és igual com de dur que sigui.{:delay 78 00}{:clear }Quan sigui un sensecor,

    farà el que jo digui.
- id: 14448
  text: Un sensecor?
- id: 14449
  text: >-
    Exacte.{:delay 54 00}{:clear }Són aquells éssers que surten

    del més fosc del cor de la gent.{:delay D2 00}{:clear }I, ei, amb tots aquells sensecor

    de la seva part, estimat amic meu,{:delay E1 00}{:clear }La Malèfica ho conquerirà tot!
- id: 14450
  text: >-
    Estic amb deute amb aquella bruixa,{:delay 96 00}{:clear }així que em dedico a recórrer

    els mons per aconseguir-li{:delay CF 00} {:clear }un gran exèrcit de sensecor,

    tot per a ella.
- id: 14451
  text: >-
    Què faig parlant amb vosaltres,

    mocosos?{:delay 9C 00}{:clear } Fora! Ja vaig amb prou retràs.
- id: 14452
  text: >-
    Hauries de buscar-te

    una cosa millor a fer.
- id: 14453
  text: Qui ho diu?
- id: 14454
  text: Eh!? Ahhh! Vosaltres!
- id: 14455
  text: Pete?
- id: 14456
  text: >-
    Què esteu fent per aquí,

    mamarratxos?
- id: 14457
  text: Què fas tu aquí?
- id: 14458
  text: El coneixeu?
- id: 14459
  text: >-
    És clar que sí! El Pete porta 

    tota la vida causant problemes!
- id: 14460
  text: >-
    Sa majestat el va desterrar

    a una altra dimensió fa molt.{:delay E6 00}{:clear }{:delay 2F 00}{:clear }Com deu haver escapat?
- id: 14461
  text: '{:delay A5 00}{:clear }Voleu saber com?{:delay 6A 00}{:clear }La Malèfica em va alliberar! Així vaig escapar!{:delay D4 00}{:clear }I ara el vostre món... què dic?{:delay BB 00}{:clear }Tots els mons perteneixeran a un servidor!'
- id: 14462
  text: >-
    Perquè la Malèfica

    m'ajudarà a conquerir-los.
- id: 14463
  text: La Malèfica, i tant...
- id: 14464
  text: >-
    Ohh! De què rieu?{:delay 5A 00}{:clear }{:delay 15 00}{:clear }El poder de la Malèfica

    és incommensurable!
- id: 14465
  text: Està cuita.
- id: 14467
  text: Què vols dir?
- id: 14468
  text: Vosaltres!{:delay 3C 00}{:clear }{:delay 17 00}{:clear }Vosaltres sou els culpables!
- id: 14469
  text: >-
    Aviam...{:delay 30 00}{:clear }Potser sí que hi vam tenir

    alguna cosa a veure.
- id: 14470
  text: ''
- id: 14471
  text: >-
    A mi els sensecor!

    A formar!
- id: 14472
  text: >-
    Ja veureu!{:delay 60 00}{:clear }Ningú, i vull dir ningú,

    es burla del totpoderós Pete!
- id: 14473
  text: Molt bé, «totpoderós» Pete,{:delay 5A 00}{:clear }{:delay 30 00}{:clear }qui viu en aquesta torre?
- id: 14474
  text: >-
    Ah, no ho sabíeu?{:delay 8A 00}{:clear }És el vell Yen Sid.{:delay 8A 00}{:clear }És clar que ja deu

    ser un sensecor.
- id: 14475
  text: El mestre Yen Sid viu aquí?
- id: 14476
  text: Yen Sid és el mentor del rei!
- id: 14477
  text: Vaja! Deu ser molt poderós!
- id: 14478
  text: Sensecor per aquí i per allà!{:delay B4 00}{:clear } {:delay 1E 00}{:clear }Les coses no han canviat gens!
- id: 14479
  text: Doncs encara sort que som aquí.
- id: 14480
  text: >-
    Llavors,

    els mons no estan en pau?
- id: 14481
  text: Mestre Yen Sid! És un honor.
- id: 14482
  text: Ei, com va?
- id: 14483
  text: Sora! Una mica de respecte!
- id: 14484
  text: O sigui que tu ets el Sora...{:delay B4 00}{:clear }{:delay 21 00}{:clear }Molt bé, heu vist ja el rei?
- id: 14485
  text: >-
    Sí que l'hem vist, Mestre.

    Però no hem tingut ocasió de parlar-hi.
- id: 14486
  text: >-
    Sí... el rei està molt

    ocupat últimament.
- id: 14487
  text: >-
    Per tant,{:delay 57 00}{:clear }sembla ser que la tasca d'ensinistrar-vos

    a vosaltres tres serà el meu deure.
- id: 14488
  text: >-
    Teniu un perillós viatge a fer.

    Heu d'anar-hi ben preparats.
- id: 14489
  text: >-
    Llavors... hem d'embarcar-nos 

    en una altra missió?
- id: 14490
  text: >-
    Jo volia buscar el meu amic Riku,

    perquè puguem tornar a les illes.
- id: 14491
  text: >-
    Sí, ho sé.{:delay 7E 00}{:clear }Tanmateix, tot el que hi ha en el

    teu viatge, Sora, està connectat.
- id: 14492
  text: >-
    Que trobis el camí

    de retorn a les illes...
- id: 14493
  text: Que tornis tu sol o amb el teu amic...
- id: 14494
  text: >-
    Fins i tot que les illes

    encara siguin on eren.
- id: 14495
  text: >-
    I la clau que connecta

    tot allò ets tu, Sora.
- id: 14496
  text: Jo... soc la clau?
- id: 14497
  text: L'escollit de la clau espasa!
- id: 14498
  text: >-
    Tu ets la clau que obrirà

    la porta a la llum.
- id: 14499
  text: >-
    Aquest llibre conté coneixements molt

    valiosos que necesitaràs en el teu viatge.{:delay F5 00}{:clear }{:delay 35 00}{:clear }Estudia'l amb atenció.
- id: 14500
  text: >-
    Quan hagis acabat, parlarem dels

    enemics que sens dubte trobaràs.
- id: 14501
  text: >-
    Un moment, com és que els

    sensecor segueixen per allà?
- id: 14502
  text: >-
    Les teves accions passades van impedir

    una immensa expansió dels sensecor{:delay 34 01}{:clear }des de la gran Foscor, {:delay 78 00}{:clear }d'això en pots estar segur.
- id: 14503
  text: >-
    Malgrat això, els sensecor són

    foscor feta realitat{:delay F6 00}{:clear }{:delay 15 00}{:clear }i sempre queden vestigis 

    de foscor a tots els cors.
- id: 14504
  text: >-
    És cert, hi ha menys sensecor,{:delay 78 00}{:clear }però mentre quedi foscor en un

    sol cor, serà difícil erradicar-los.
- id: 14505
  text: >-
    Òndia! Això vol dir{:delay 7F 00}{:clear }que si tots els cors

    estiguessin plens de llum,{:delay 96 00}{:clear }els sensecor desapareixerien.
- id: 14506
  text: >-
    Ara hem de parlar dels

    enemics que us trobareu.
- id: 14508
  text: >-
    Si algú com tu, Donald,

    cedeix a la foscor del seu cor,{:delay 43 01}{:clear }també es convertirà

    en un sensecor.
- id: 14509
  text: Això ja ho sabeu.
- id: 14510
  text: ''
- id: 14511
  text: >-
    Els sensecor sempre estan a l'aguait,

    intentant capturar nous cors.{:delay 32 01}{:clear }Mai baixeu la guàrdia!{:delay 82 00}{:clear }{:delay 26 00}{:clear }Ara bé...
- id: 14512
  text: >-
    En ocasions, quan algú de

    cor i voluntat fortes,{:delay F0 00}{:clear }sigui bo o dolent,

    es converteix en un sensecor,{:delay F6 00}{:clear }{:delay 24 00}{:clear }la closca buida que deixa rere

    seu actua amb voluntat pròpia.
- id: 14513
  text: >-
    Un recipient buit el cor

    del qual ha estat robat...{:delay DE 00}{:clear }{:delay 1B 00}{:clear } Un esperit que segueix vivint,{:delay 7B 00}{:clear }tot i quan el seu cos abandona

    l'existència... perquè... {:delay F4 00}{:clear }els incorporis «són»,

    però no existeixen.
- id: 14514
  text: >-
    Pot semblar que els 

    incorporis tenen sentiments, {:delay D0 00}{:clear }però és un engany...{:delay 57 00}{:clear }Fingeixen que tenen cor.
- id: 14515
  text: No us deixeu ensibornar!
- id: 14516
  text: Incorporis...{:delay 48 00}{:clear }{:delay 37 00}I no existeixen...
- id: 14517
  text: >-
    Molt bé... L'ésser que veieu davant

    vostre és un «foscant».{:delay 80 01}{:clear }{:delay 36 00}{:clear }És la forma més

    comuna dels incorporis.
- id: 14518
  text: >-
    Però n'hi ha d'altres...{:delay 69 00}{:clear }Alguns més grans, d'altres amb

    poders esfereïdors i singulars...{:delay 09 01}{:clear }{:delay 2D 00}{:clear }Estigueu a l'aguait!
- id: 14519
  text: >-
    En el vostre viatge veureu un

    nombre alarmant de foscants.{:delay 2C 01}{:clear }Intentaran fer-vos mal.
- id: 14520
  text: >-
    Tot i així, no són més que closques buides

    destinades a tornar a la foscor.{:delay 2C 01}{:clear }{:delay 12 00}{:clear }Però...
- id: 14521
  text: >-
    Els éssers que teniu ara

    al davant són una altra cosa.
- id: 14522
  text: >-
    Els incorporis més poderosos han format

    un grup anomenat Organització {XIII}, {:delay 26 01}{:clear }que dirigeix els més dèbils.
- id: 14523
  text: Organització {XIII}...
- id: 14524
  text: >-
    Els sensecor actuen per instint,{:delay 77 00}{:clear }però els incorporis ho fan

    de manera sofisticada.{:delay BB 00}{:clear }Poden pensar i planificar.

    Semblen tenir un objectiu...
- id: 14525
  text: >-
    Tot i que ignorem

    completament quin és.
- id: 14526
  text: >-
    El rei va notar el perill i

    ha marxat per combatre'l.
- id: 14527
  text: >-
    Va trobar la clau espasa del Regne de

    la Foscor i amb ella tancà la porta.
- id: 14528
  text: >-
    Ara viatja de món en món

    combatent els sensecor,{:delay FC 00}{:clear }mentre busca la resposta

    a l'endevinalla dels incorporis{:delay E5 00}{:clear }i l'Organització {XIII}.
- id: 14529
  text: Llavors serà millor trobar primer el rei!
- id: 14530
  text: Però... on pot ser?
- id: 14531
  text: No ho sabrem fins que el busquem.
- id: 14533
  text: >-
    Bé, doncs, abans d'anar-te'n, necessitaràs

    robes de viatge més adients.
- id: 14534
  text: Aquestes et queden una mica petites.
- id: 14535
  text: >-
    Per aquí trobaràs les tres fades.{:delay BA 00}{:clear }Si els ho demanes, et 

    proporcionaran peces més a mida.
- id: 14536
  text: >-
    Òndia!

    Sí que creixes de pressa, Sora!
- id: 14538
  text: >-
    El Riku, el rei, vosaltres i jo.{:delay 9C 00}{:clear }{:delay 24 00}{:clear }M'és igual el que sigui aquella

    Organització o el que estigui planejant.{:delay B4 00}{:clear }{:delay 28 00}{:clear }Sent nosaltres cinc, vull dir, sis;

    no tenim per què preocupar-nos. Oi?
- id: 14539
  text: I tant!
- id: 14540
  text: >-
    Mireu qui és aquí, estimades!

    En Sora, en Donald i en Goofy...
- id: 14541
  text: >-
    Oohh! Si estàs buscant roba,

    has vingut al lloc adequat!
- id: 14542
  text: Jo m'ocuparé del diseny.
- id: 14543
  text: Oh, això no li queda bé!
- id: 14544
  text: Ah, au va, estimades...
- id: 14545
  text: No us agrada més això?
- id: 14546
  text: Espera!
- id: 14547
  text: N'estàs segura?
- id: 14548
  text: Blau!
- id: 14549
  text: "{:delay 5D 00}Volen decidir-se d'una vegada!?"
- id: 14550
  text: >-
    Està bé. Totes juntes, estimades.

    I prou de rondinades!
- id: 14551
  text: Ai, mare!
- id: 14552
  text: Ohhh... És encantador.
- id: 14553
  text: Oh, sí! Es veu molt ben plantat.
- id: 14554
  text: Ara bé, aquestes no són peces normals.
- id: 14555
  text: Tenen poders molt especials.
- id: 14556
  text: Agafa aquest orbe...
- id: 14557
  text: I mira què passa!
- id: 14558
  text: ''
- id: 14559
  text: Guau!
- id: 14560
  text: Dues claus espasa!
- id: 14561
  text: >-
    Aquest viatge serà el

    doble de difícil que l'últim.
- id: 14562
  text: >-
    La teva vestimenta té, a

    més a més, altres poderes...
- id: 14563
  text: >-
    ... però hauràs de descobrir-los a
     mesura que avanceu en el vostre viatge.
- id: 14564
  text: >-
    Entesos, faré el que pugui.

    I moltes gràcies!
- id: 14565
  text: >-
    Ah! I hi ha una cosa més per a

    vosaltres, del mestre Yen Sid.
- id: 14566
  text: Oh, bufa!
- id: 14567
  text: Ei! La nau gumi!
- id: 14568
  text: A punt per marxar?
- id: 14569
  text: A veure, a veure... Un moment.
- id: 14570
  text: >-
    A causa de les vostres anteriors missions,{:delay C4 00}{:clear }els mons han tornat

    al seu estat original.
- id: 14571
  text: >-
    Això vol dir que les rutes

    entre ells han desaparegut.
- id: 14572
  text: I com viatjarem?
- id: 14573
  text: >-
    No temeu.{:delay 48 00}{:clear }Si el que el rei sospita

    resulta ser cert,{:delay 90 00}{:clear }{:delay 1D 00}{:clear }els mons han preparat noves

    rutes per les que podreu viatjar.
- id: 14574
  text: >-
    Aquelles rutes es poden utilitzar

    obrint portes especials.
- id: 14575
  text: Com s'obren aquelles portes? {:delay 96 00}{:clear }{:delay 0F 00}{:clear }Em temo que no ho sé.
- id: 14576
  text: >-
    No obstant,

    la clau espasa us servirà de guia.
- id: 14577
  text: >-
    Quan de la clau espasa en sorgeixi

    un feix de llum, torneu a la nau gumi.
- id: 14578
  text: >-
    Si bé els mons poden semblar-vos molt

    allunyats i fora del vostre abast,{:delay 2D 01}{:clear }segueixen connectats per llaços invisibles;{:delay BE 00}{:clear }igual que els nostres cors.
- id: 14579
  text: Tots estan connectats.
- id: 14580
  text: Exactament.
- id: 14581
  text: Entesos!
- id: 14582
  text: Però estigueu alerta.{:delay 8C 00}{:clear }{:delay 2D 00}{:clear }A mesura que avanceu...
- id: 14583
  text: >-
    ... els sensecor i els incorporis

    utilitzaran les seves pròpies rutes.{:delay 0C 01}{:clear }Passadissos de la foscor

    per viatjar de món en món.
- id: 14584
  text: >-
    Pot ser que intentin unir

    aquells passatges foscos{:delay A7 00}{:clear }amb les portes que

    hi ha entre els mons.
- id: 14585
  text: Ei! Això no val!
- id: 14586
  text: >-
    Molt bé.{:delay 3C 00}{:clear }{:delay 1E 00}{:clear }Aquesta és tota la

    informació que us puc donar.
- id: 14587
  text: Partiu, Sora, Donald i Goofy.{:delay F0 00}{:clear }{:delay 30 00}{:clear }Tots us aguarden.
- id: 14588
  text: Bé, som-hi!
- id: 14589
  text: Mestre Yen Sid!
- id: 14590
  text: Apreciem molt la seva ajuda.
- id: 14591
  text: Valga'm Déu! Què és allò?
- id: 14592
  text: >-
    No ho hem vist

    abans en algun lloc?
- id: 14593
  text: Sí, estimada. Em pregunto on va ser...
- id: 14594
  text: Ah! Malèfi...!
- id: 14595
  text: >-
    No! No hem de recordar el seu nom!

    Ai, mare...
- id: 14596
  text: Era una vella bruixa menyspreable...
- id: 14597
  text: Oh, no! Em tornen els records!{:delay B4 00}{:clear }Què farem? Oooh... què farem?
- id: 14598
  text: >-
    Hauríem de dir-ho

    al mestre Yen Sid.
- id: 14599
  text: >-
    Sí. Això és el que hem de fer.

    Ràpid!
- id: 14600
  text: Malèfica!
- id: 14647
  text: >-
    Allò que consideres que

    és correcte, no ho és.{:delay C4 00}{:clear } {:delay 1E 00}{:clear }I això és un gran error.
- id: 14665
  text: És un lloc d'allò més misteriós.
- id: 14839
  text: >-
    Em sap greu, però la Malèfica

    ja no pot ajudar-te.
- id: 14854
  text: >-
    Sí. I el rei deu saber on és el Riku, {:delay B6 00}{:clear }perquè eren junts al Regne de la Foscor

    quan vam tancar-ne la porta.{:delay CE 00}{:clear }{:delay 10 00}{:clear }Us en recordeu?

    Quan vam derrotar l'Ànsem.
- id: 14855
  text: Aahh, suposo...
- id: 14856
  text: >-
    He trigat molt de temps,{:delay 78 00}{:clear }{:delay 28 00}però aviat el Sora tornarà a ser el de sempre.{:delay C9 00}{:clear }{:delay 21 00}{:clear }El procés també t'està

    afectant a tu, Roxas.
- id: 14857
  text: '... et necessita.'
- id: 14858
  text: Potser m'agradaria saber...{:delay 82 00}{:clear }{:delay 64 00}{:clear }què saps tu de mi...
- id: 14859
  text: '... que jo no sàpiga?'
- id: 14860
  text: Són les cortines que es mouen.{:delay 64 00}{:clear }Hi haurà corrent d'aire per algun lloc.
- id: 14861
  text: >-
    Em sorprèn que un lloc

    tan antic tingui cortines.
- id: 14862
  text: >-
    Però... no sé per què tinc aquest poder.{:delay 1C 01}{:clear }Simplement el tinc.{:delay 57 00}{:clear }{:delay 25 00}Ni tan sols sé si hi ha una

    manera adequada d'utilitzar-lo.
- id: 15200
  text: >-
    El Roxas no és l'únic que no

    hauria d'haver existit mai.{:delay D2 00}{:clear }{:delay 66 00}{:clear }Encarrega-te'n, Ànsem.
- id: 15221
  text: Qui s'endurà a casa el gran premi?
- id: 15222
  text: >-
    El no va més de la lluita,

    el Trofeu dels Quatre Cristalls!
- id: 15274
  text: >-
    Roxas! Tornarem a veure'ns.{:delay BF 00}{:clear }Llavors podrem parlar de tot.{:delay A2 00}{:clear }Potser jo no sàpiga que ets tu

    i tu no sàpigues que soc jo,{:delay 03 01}{:clear }però tornarem a veure'ns.
- id: 15275
  text: Algun dia. Aviat.{:delay 6B 00}{:clear }T'ho prometo!
- id: 15276
  text: >-
    És que...{:delay 75 00}{:clear }em sembla que...{:delay 64 00}{:clear }he estat esquivant la pregunta

    que de veritat vull fer.
- id: 15277
  text: Què em passarà ara?{:delay 78 00}{:clear }{:delay 47 00}{:clear }Digue'm almenys això.{:delay 50 00}{:clear }{:delay 2E 00}{:clear }Tota la resta ja no m'importa.
- id: 15382
  text: '{:unk13 FC 00 52 00}{:unk08 01 00 05}Ben fet.'
- id: 15383
  text: '{:unk13 00 01 52 00}{:unk08 01 00 05}No està malament.'
- id: 15384
  text: >-
    {:unk13 08 01 46 00}{:unk08 01 00 05}Podries esforçar-te

    una mica més?
- id: 15385
  text: >-
    {:unk13 0C 01 5E 00}{:unk08 01 00 05}Gràcies! Ets

    de gran ajuda.
- id: 15386
  text: '{:unk13 09 01 6A 00}{:unk08 01 00 05}No està malament.'
- id: 15387
  text: >-
    {:unk13 16 01 5E 00}{:unk08 01 00 05}Penso que podries

    fer-ho millor.
- id: 15388
  text: >-
    {:unk13 6A 01 42 00}{:unk08 01 00 05}Vaja! Ets

    el millor!
- id: 15389
  text: '{:unk13 71 01 4E 00}{:unk08 01 00 05}Mmm, gens malament.'
- id: 15390
  text: >-
    {:unk13 74 01 42 00}{:unk08 01 00 05}Segur que jo podria

    fer-ho encara millor!
- id: 15391
  text: '{:unk13 1C 01 82 00}{:unk08 01 00 05}Bona feina.'
- id: 15392
  text: '{:unk13 1A 01 82 00}{:unk08 01 00 05}Acceptable, diria jo.'
- id: 15393
  text: '{:unk13 27 01 82 00}{:unk08 01 00 05}Au va, pots fer-ho millor.'
- id: 15394
  text: '{:unk13 12 01 6C 00}{:unk08 01 00 05}Gran feina!'
- id: 15395
  text: '{:unk13 22 01 6C 00}{:unk08 01 00 05}Mmm... està bé.'
- id: 15396
  text: "{:unk13 18 01 6C 00}{:unk08 01 00 05}Esforça't una mica més, d'acord?"
- id: 15397
  text: >-
    {:unk13 5E 01 A0 00}{:unk08 01 00 05}Fantàstic!

    Te'n dec una.
- id: 15398
  text: >-
    {:unk13 64 01 A0 00}{:unk08 01 00 05}Bé... Això

    serà suficient.
- id: 15399
  text: >-
    {:unk13 68 01 A0 00}{:unk08 01 00 05}Això és el millor

    que pots fer?
- id: 15400
  text: >-
    {:unk13 09 01 7F 00}{:unk08 01 00 05}Amb això n'hi deu haver prou.

    Anem a l'estació.
- id: 15401
  text: >-
    {:unk13 6A 01 74 00}{:unk08 01 00 05}Amb això n'hi deu haver prou.

    Anem a l'estació.
- id: 15740
  text: >-
    Prem {:icon dynamic-left-analog} per moure el Roxas.

    Per saltar, prem {:icon dynamic-circle}.{:clear }{:color #00F0F080}Visita la botiga d'armadures.{:reset}{:clear }Si no et recordes del que has de fer, 

    prem {:icon dynamic-start} per confirmar el teu objectiu.
- id: 15741
  text: >-
    Si saltes prop dels edificis, pots 

    agafar-te dels cantons i enfilar-t'hi.

    Intenta-ho i accediràs a molts llocs.
- id: 15907
  text: >-
    En fi, estic divagant.

    Ves a buscar la Kairi.{:delay 4A 01}{:clear }Ah, se m'oblidava...{:delay B4 00}{:clear }Perdona'm pel que li vaig fer.
- id: 15908
  text: >-
    Quan la trobem, podràs

    dir-li-ho tu mateix.
- id: 15909
  text: Em sembla que passo.{:delay 3C 00}{:clear }{:delay 34 00}{:clear }No em sortiria del cor, saps? {:delay 80 00} {:clear }{:delay 43 00}{:clear }No en tinc. {:delay 40 00}{:clear }
- id: 15910
  text: Àxel, què és el que pretenies?
- id: 15911
  text: >-
    Ell... era l'únic que em queia bé.{:delay E6 00}{:clear }Em feia sentir...

    com si tingués cor.{:delay 18 01}{:clear }És una mica...{:delay 46 00}{:clear }irònic.
- id: 15912
  text: Tu fas que em senti...{:delay 5A 00}{:clear }{:delay 24 00}{:clear }igual.
- id: 15913
  text: La Kairi és a la masmorra del castell.{:delay 82 00}{:clear }Afanyeu-vos.
- id: 15914
  text: Àxel...
- id: 16038
  text: >-
    {:color #00F00080}Les ordres de reacció{:reset} s'utilitzen per

    realitzar accions en determinades situacions.{:clear }{:unk0f 01 3C 00 13 01}{:unk12 27 00}Visita la botiga d'accessoris i

    apareixerà {:color #00F00080}l'ordre de reacció {:reset}«Parla-hi».

    Prem {:icon dynamic-triangle} per parlar amb la propietària.{:clear }{:unk0f 00 00 00 00 00}{:unk12 28 00}{:color #00F0F080}Parla amb la propietària de la botiga d'accessoris.{:reset}
- id: 16040
  text: >-
    {:color #00F00080}Les ordres de reacció{:reset} apareixen

    en diverses situacions i són molt útils.

    {:color #00F0F080}Utilitza-les sempre que puguis.{:reset}
- id: 16041
  text: És un membre de l'Organització {XIII}.{:delay 77 00}{:clear } {:delay 28 00}{:clear }Saïx! Et queda clar? {:delay 6F 00}{:clear }{:delay 1E 00}{:clear }I ara, ves a salvar-la!
- id: 16078
  text: >-
    Mou la càmera amb {:icon dynamic-right-analog}.

    Prem {:icon dynamic-r3} per tornar

    a la posició inicial.{:clear }Prem {:icon dynamic-r1} per fixar un blanc.

    Si la fixes en alguna cosa, la càmera

    seguirà l'objectiu automàticament.{:clear }{:color #00F0F080}Fixa-la en el gat.{:reset}
- id: 16079
  text: >-
    Fixar un blanc t'ajudarà a seguir un objectiu.

    Quan la càmera està fixa, pots controlar-la.

    Per cancel・lar, prem {:icon dynamic-r1} un altre cop.
- id: 16115
  text: >-
    Si t'hi apropes, podràs recollir les esferes que

    deixen anar els enemics quan els vences.{:clear }Les esferes grogues sumen calés,

    i les verdes retornen VT.
- id: 16119
  text: >-
    {:unk0f 01 1C 02 36 01}A la part inferior dreta, veuràs l'indicador de VT.

    Quan pateixes mal, perds VT.

    La batalla acaba si l'indicador arriba a zero.{:clear }{:unk0f 00 00 00 00 00}{:unk0f 01 D1 01 7C 01}L'indicador blau a la part inferior dreta

    indica els PM. Poseeix un misteriós

    poder que encara no està disponible.{:clear }Si t'apropes a un objectiu, apareixerà

    una marca groga.

    Per atacar, prem {:icon dynamic-cross}.{:clear }{:color #00F0F080}Apropa't al Seifer i ataca'l.{:reset}
- id: 16121
  text: >-
    Quan colpeges un enemic, continua

    atacant i llençaràs poderosos atacs.

    {:color #00F0F080}Prem {:icon dynamic-cross} repetidament.{:reset}{:clear }Els contraatacs són una bona forma

    {:color #00F0F080}d'eludir i anul・lar els atacs enemics.{:reset}

    Et serviran per defensar-te.
- id: 16125
  text: >-
    Si t'apropes a la llum, apareixerà l'{:color #00F00080}ordre

    de reacció{:reset} «Desa». Prem {:icon dynamic-triangle} i obriràs un

    menú que permet desar la partida.{:clear }{:color #00F0F080}Per desar, obre el menú.{:reset}
- id: 16126
  text: >-
    Hi ha molts cercles de llum a més d'aquest.

    Amb ells podràs recuperar la VT i els PM

    del Roxas. Aprofita'ls!
- id: 16127
  text: >-
    Has obtingut un mapa del lloc. Aquest

    apareix a la part superior dreta.{:clear }En alguns mons existeixen diferents

    mapes. Per inspeccionar certes

    zones, hauràs d'aconseguir un mapa.
- id: 16130
  text: >-
    {:unk0f 03 0F 00 6D 01}{:color #00F0F080}S'ha afegit l'ordre Objecte.{:reset}

    Utilitza {:icon dynamic-dpad-up-down} per seleccionar Objecte, i prem {:icon dynamic-cross}.

    Tria l'objecte que vulguis utilitzar i prem {:icon dynamic-cross}.{:clear }{:unk0f 00 00 00 00 00}Per a la drecera, prem {:icon dynamic-l1} i {:icon dynamic-cross}.

    Pots canviar-la en el menú principal.
- id: 16132
  text: >-
    {:color #00F0F080}El Roxas ja pot utilitzar habilitats.{:reset}

    Les habilitats s'activen des del menú principal.{:clear }En guanyar batalles importants,

    pujaràs de nivell, augmentaràs diversos

    paràmetres i aprendràs nous atacs.{:clear }També puges de nivell quan vences

    enemics i guanyes experiència.{:clear }Si et resulta difícil vèncer l'enemic,

    puja el nivell del Roxas abans d'avançar.
- id: 16473
  text: '{:unk13 96 01 67 00}{:unk08 01 01 06}Hola, Roxas.'
- id: 16474
  text: >-
    {:unk13 6F 01 4C 00}{:unk08 01 00 05}Mai hagués pensat que fossis

    capaç de fer una cosa així...
- id: 16856
  text: >-
    Mira, Kairi,{:delay 3C 00}{:clear }tens molt de valor per saltar a

    la foscor així de qualsevol manera.
- id: 16857
  text: "{:delay 64 00}{:clear }Deixa'm anar! {:delay 28 00}{:clear } {:delay 50 00}{:clear }Deixa'm!"
- id: 17093
  text: Molt bé... ja veig com serà la cosa.
- id: 17158
  text: >-
    Utilitza {:icon dynamic-left-analog} per moure el Roxas.

    Per saltar, prem {:icon dynamic-circle}.

    {:color #00F0F080}Visita la botiga d'armadures.{:reset}{:clear }
- id: 17159
  text: >-
    Si t'apropes a la botiga d'accessoris,

    apareixerà {:color #00F00080}l'ordre de reacció{:reset} «Parla-hi».

    Prem {:icon dynamic-triangle} per parlar amb la propietària.

    {:color #00F0F080}Parla amb la propietària de la botiga d'accessoris.{:reset}
- id: 17160
  text: >-
    Mou la càmera amb {:icon dynamic-right-analog}.

    Prem {:icon dynamic-r3} per tornar a la posició inicial.

    Prem {:icon dynamic-r1} per fixar un blanc.

    {:color #00F0F080}Prem {:icon dynamic-r1} i fixa-la al gat.{:reset}
- id: 17161
  text: >-
    Quan pateixes mal, perds VT. Si l'indicador arriba

    a zero, la batalla s'acaba. Si t'apropes a un objectiu,

    apareixerà una marca groga. Per atacar, prem {:icon dynamic-cross}.

    {:color #00F0F080}Apropa't al Seifer i ataca'l.{:reset}
- id: 17162
  text: >-
    Si t'apropes a la llum, apareixerà l'{:color #00F00080}ordre

    de reacció{:reset} «Desa». Prem {:icon dynamic-triangle} i obriràs un

    menú que permet desar la partida.

    {:color #00F0F080}Per desar, obre el menú.{:reset}
- id: 17163
  text: Elimina tots els incorporis!
- id: 17294
  text: Als dards, es llegeix «Hayner» amb lletra petita.
- id: 17295
  text: >-
    El sofà on parlaven

    el Pence i l'Olette.
- id: 17296
  text: Benvinguts a Vila Crepuscle!
- id: 17297
  text: ⇽ Camí a l'estació  ⇾ Solar esportiu
- id: 17298
  text: "\"Que comenci l'Struggle!\""
- id: 17301
  text: >-
    Normes d'Struggle:


    El combat acaba si un dels participants

    perd totes les seves esferes.
- id: 17303
  text: >-
    En aquest garatge hi

    cabrien objectes grans.
- id: 17304
  text: ⇽ Solar esportiu ⇾ Camí a l'Estació
- id: 17305
  text: Horaris de l'Estació del Capvespre.
- id: 17306
  text: La Fira de la Costa ja és aquí!
- id: 17307
  text: 'Cap a: Estació del Capvespre'
- id: 17308
  text: 'Cap a: ???'
- id: 17311
  text: Sortien boles de la paret.
- id: 17312
  text: Només era el teu reflex a l'aigua.
- id: 17313
  text: 'Destinació: Estació Central'
- id: 17314
  text: Les Set Meravelles han estat descobertes!
- id: 17315
  text: >-
    Una maqueta de

    l'Estació Central.
- id: 17316
  text: Està molt ben tancada.
- id: 17317
  text: La maqueta del castell està destrossada.
- id: 17318
  text: Està bloquejada i no es pot obrir.
- id: 17319
  text: >-
    Només una gran explosió podria

    haver trencat això.
- id: 17320
  text: (Tentative) Les Set Meravelles han estat descobertes!
- id: 17344
  text: >-
    {:unk08 00 00 00}Només mirant-la, aquesta

    espasa sembla donar-te força.
- id: 17345
  text: >-
    {:unk13 00 01 40 01}{:unk08 02 00 06}La força és important?

    {:chardelay 33 00}No tant.

    {:chardelay 09 00}I tant que sí!
- id: 17346
  text: >-
    {:unk08 00 00 00}Aquest bastó sembla màgic, com si 

    només sostenint-lo t'atorgués saviesa.
- id: 17347
  text: >-
    {:unk13 00 01 40 01}{:unk08 02 00 06}La saviesa és important?

    {:chardelay 33 00}No tant.

    {:chardelay 0B 00}I tant que sí!
- id: 17348
  text: >-
    {:unk08 00 00 00}Aquest escut és molt resistent. Un

    escut així podria suportar el que fos.
- id: 17349
  text: >-
    {:unk13 00 01 40 01}{:unk08 02 00 06}La protecció és important?

    {:chardelay 33 00}No tant.

    {:chardelay 0A 00}I tant que sí!
- id: 17355
  text: >-
    «Llença la brossa al dipòsit

    de la Placeta del Tramvia.»
- id: 17356
  text: >-
    En aquest traster,

    hi ha equipament per al torneig.
- id: 17357
  text: >-
    Normes d'Struggle:


    Porta objectes.

    Si et quedes sense VT, perds.
- id: 17358
  text: ⇽ Plaça de l'Estació ⇾ Placeta del Tramvia
- id: 17359
  text: ⇽ Placeta del Tramvia ⇾ Solar esportiu
- id: 17360
  text: >-
    Llenci la brossa al dipòsit

    de la Placeta del Tramvia.
- id: 17361
  text: La porta és molt feixuga. No es mourà.
- id: 17362
  text: A on anirà aquesta via?
- id: 17363
  text: L'entrada és a l'altre costat.
- id: 17364
  text: És ple de palets de gelat.
- id: 17365
  text: És ple de palets de gelat.
- id: 17366
  text: ⇽ Estació del Capvespre ⇾ Turó del Capvespre
- id: 17367
  text: ⇽ Túnel ⇾ Estació del Capvespre
- id: 17368
  text: Sembla un taulell d'anuncis.
- id: 17369
  text: '«Tren local. Gratuït!»'
- id: 17370
  text: '«Tren local. Gratuït!»'
- id: 17371
  text: L'estàtua està mirant a terra.
- id: 17372
  text: Està completament bloquejada pels tubs.
- id: 17374
  text: Això projecta la imatge del monitor.
- id: 17375
  text: Semblen les dades d'algú.
- id: 17376
  text: No saps què és aquest aparell.
- id: 17379
  text: >-
    Hi ha evidències que això

    ja ha estat utilitzat.
- id: 17380
  text: Fa temps que no s'utilitza.
- id: 17381
  text: Sembla que encara es podria utilitzar.
- id: 17382
  text: Sembla que només està encesa.
- id: 17383
  text: >-
    Qui haurà fet això?

    I amb quin propòsit?
- id: 17384
  text: Aquesta és la càpsula on el Sora dormia.
- id: 17385
  text: Quin llegiràs?
- id: 17386
  text: >-
    Aquí estan registrades totes les

    entremaliadures que el rei va fer fa anys.
- id: 17387
  text: Aquest llibre descriu encanteris poderosos.
- id: 17388
  text: >-
    Contemples una vista espectral, com si

    miressis una mar de núvols des de dalt.
- id: 17390
  text: >-
    Normes d'Struggle:


    Guanya la persona que recull més

    esferes en el temps assignat.
- id: 17403
  text: Aquest taulell s'utilitza per als tornejos.
- id: 17404
  text: >-
    Normes d'Struggle:


    Ataca els teus adversaris i

    recull més esferes que ells!
- id: 17405
  text: En aquest garatge, hi ha equipament per al torneig.
- id: 17406
  text: >-
    Normes d'Struggle:


    Cadascú té cent esferes!

    El millor estratega guanya!
- id: 17407
  text: >-
    Participants:

    Setzer, Seifer, Vivi,

    Hayner i Roxas.
- id: 17408
  text: Propera obertura. Taller de fabricació d'objectes.
- id: 17411
  text: >-
    Necessites calés per comprar objectes.{:clear }Per guanyar-ne alguns, busca

    feina al taulell d'anuncis.
- id: 17412
  text: >-
    Compte, allà hi ha abelles!

    D'on hauran sortit?{:clear }He posat un anunci demanant ajuda

    per fer-les fora, però ningú ha respost.
- id: 17413
  text: >-
    M'han demanat que presenti el

    següent combat d'Struggle!{:clear }No tinc temps per atendre la botiga.
- id: 17414
  text: >-
    Ara estic aprovisionant la meva botiga.{:clear }Molta gent ve a veure l'Struggle,

    i vull estar preparada.
- id: 17416
  text: >-
    He tancat la meva botiga

    perquè ja soc molt gran.{:clear }Ara gaudeixo de la vida

    amb el Chiro, el meu gat.
- id: 17417
  text: >-
    Parlem amb la senyora de la botiga de

    accessoris i comencem a investigar!
- id: 17418
  text: >-
    La millor manera d'aconseguir informació

    és preguntar. Parla amb tothom.
- id: 17419
  text: >-
    Si trobes llocs

    interesants, investiga'ls!{:clear }Podries obtenir informació valuosa!
- id: 17420
  text: >-
    Mira el teu voltant amb atenció.

    Potser trobes alguna cosa!{:clear }Quan busquis, no deixis passar res!
- id: 17421
  text: >-
    On serà aquell gat?

    No pot ser gaire lluny.
- id: 17422
  text: >-
    No crec que hagi anat gaire lluny.

    Has buscat bé per aquí?
- id: 17423
  text: >-
    Llavors et sents preparat?{:clear }Pren-te el teu temps per

    a escollir la teva arma.
- id: 17424
  text: >-
    El Seifer no perdrà el temps

    barallant-se amb vosaltres.{:clear }Utilitzarà el seu atac més poderós

    només si està en problemes.
- id: 17425
  text: Bufar i fer ampolles.
- id: 17429
  text: >-
    Aquest lloc és un caos! Qui

    netejarà tota aquesta brossa?
- id: 17430
  text: >-
    {:unk08 00 00 00}Té una protecció per a la mà.

    És una bona defensa.
- id: 17431
  text: >-
    {:unk13 00 01 40 01}{:unk08 02 00 06}Dones prioritat a la defensa?

    {:chardelay 33 00}No, utilitzaré una altra cosa.

    {:chardelay 0A 00}Me la quedo!
- id: 17432
  text: >-
    {:unk08 00 00 00}Això sembla gairebé un bastó. És

    bo per llençar atacs especials.
- id: 17433
  text: >-
    {:unk13 00 01 40 01}{:unk08 02 00 06}Dones prioritat als atacs especials?

    {:chardelay 33 00}No, utilitzaré una altra cosa.

    {:chardelay 0B 00}Me'l quedo!
- id: 17434
  text: >-
    {:unk08 00 00 00}Una porra per lluitar a l'Struggle.

    El seu pes lleuger la fa fàcil de brandir.
- id: 17435
  text: >-
    {:unk13 00 01 40 01}{:unk08 02 00 06}Dones prioritat a l'atac?

    {:chardelay 33 00}No, utilitzaré una altra cosa.

    {:chardelay 09 00}Me la quedo!
- id: 17439
  text: >-
    M'ho temia. M'he quedat sense

    accessoris durant l'Struggle!{:clear }Hauràs d'esperar una mica.
- id: 17440
  text: >-
    Chiro!

    On s'haurà ficat aquell gat?{:clear }No pot haver anat gaire lluny...
- id: 17441
  text: Ah, hola, Roxas.
- id: 17442
  text: >-
    Si jo fos tu, aniria armat.

    En Seifer ho pagarà!
- id: 17443
  text: >-
    Vigila bé el teu adversari.

    Quan baixi la guàrdia, colpeja'l!{:clear }Si ho fas, segur que guanyes!
- id: 17444
  text: >-
    L'arma de la dreta no està malament.{:clear }També pots utilitzar-la a l'Struggle.

    Hauria de resultar-te fàcil de brandir.
- id: 17446
  text: >-
    L'organitzador de l'Struggle

    sí que et fa treballar dur.{:clear }Penjar cartells no és una labor fàcil.

    La Placeta del Tramvia és enorme!
- id: 17447
  text: Vols ajudar-me a montar un espectacle?{:clear }Necessito un col・laborador a temps parcial!
- id: 17451
  text: >-
    Temps enrere solia practicar

    lluitant amb amics.{:clear }Entrenar és l'única forma de tornar-te

    fort. El Seifer pot ser un bon adversari.
- id: 17453
  text: >-
    He trobat el meu gat.

    Ara ens mudarem.{:clear }El Chiro i jo vivirem la resta

    dels nostres dies al camp.
- id: 17454
  text: >-
    El Hayner va dir que ell se n'encarregaria, però

    jo sabia que anava a passar alguna cosa així.{:clear }Tria una feina d'{:theme 0A}aquest taulell{:reset} o

    del que hi ha a la {:theme 0A}Placeta del Tramvia{:reset}.
- id: 17455
  text: >-
    El Hayner ha pujat per aquest turó. Deu

    estar esperant a la Plaça de l'Estació.{:clear }Sembla que té coses a fer, així

    que jo també hi faré un esforç.
- id: 17459
  text: >-
    Se't veu molt ocupat.

    Estàs treballant?{:clear }Jo practicaré per

    al proper Struggle!
- id: 17461
  text: >-
    Ei, Roxas! Ja has aconseguit la teva part?

    Cadascú ha d'aconseguir 800 calés!{:clear }El mar ens espera!

    Confio en tu!
- id: 17462
  text: >-
    Com va la feina?{:clear }Quan hagis reunit suficients

    diners, torna aquí.
- id: 17463
  text: Mmm... Això hauria de cobrir les despeses...
- id: 17464
  text: >-
    {:unk13 00 01 40 01}{:unk08 02 00 06}Segueixes treballant?

    {:chardelay 33 00}Sí, els calés mai estan de més!

    {:chardelay 09 00}No, ja n'he guanyat suficients.
- id: 17465
  text: Ben fet, Roxas!
- id: 17466
  text: >-
    {:unk13 00 01 40 01}{:unk08 02 00 06}Segueixes treballant?

    {:chardelay 33 00}Sí, els calés mai estan de més!

    {:chardelay 09 00}No, ja n'he guanyat suficients.
- id: 17467
  text: >-
    Vaja, Roxas! Ets un crac!

    Fins i tot podem comprar un meló!
- id: 17468
  text: >-
    {:unk13 00 01 40 01}{:unk08 02 00 06}Tenes molts calés. Segueixes treballant?

    {:chardelay 33 00}Sí, els calés mai estan de més!

    {:chardelay 09 00}No, ja n'he guanyat suficients.
- id: 17469
  text: >-
    Aquesta és la primera vegada

    que estic a càrrec de la botiga.{:clear }Encara estic aprenent l'ofici, així que

    tingues una mica de paciència, d'acord?
- id: 17479
  text: >-
    Repartir cartes per aquesta

    pujada no és gens fàcil.{:clear }M'agradaria trobar

    algú que m'ajudés.
- id: 17489
  text: >-
    Has anat fins a dalt? La posta de sol

    des del Turó del Capvespre és bellíssima!
- id: 17490
  text: >-
    He estat tan ocupat amb el combat

    d'Struggle que m'he oblidat de la botiga!{:clear }Em sap greu. Torni més tard, si us plau.
- id: 17498
  text: >-
    Corren rumors sobre set meravelles

    que hi ha a les Terraces del Capvespre.{:clear }No acostumo a creure'm els rumors,

    però aquest m'esgarrifa una mica.
- id: 17499
  text: >-
    Has anat al Turó del Capvespre?

    La posta de sol et deixa sense alè!{:clear }Fa molt, la meva dona i jo

    haguéssim... Bah, és igual.
- id: 17509
  text: >-
    He estat tan ocupat amb les armes de

    l'Struggle que m'he oblidat de la feina!{:clear }Em sap greu, però la meva botiga

    encara no està preparada.
- id: 17515
  text: >-
    Haig de portar aquells

    objectes a aquest garatge.{:clear }He posat un anunci demanant

    ajuda, però no ha vingut ningú.
- id: 17516
  text: >-
    Estic preparant l'equip

    per a l'Struggle!{:clear }Em sap greu, però no tinc temps

    per atendre la botiga.
- id: 17517
  text: >-
    Encara no has anat al Turó del Capvespre?

    La vista des d'allà és esfereïdora.{:clear }Hi acostumava a anar pel

    túnel, però ara agafo el tren.
- id: 17521
  text: '...{:clear }Ves i escolta les normes.'
- id: 17522
  text: "...{:clear }No t'aturis."
- id: 17523
  text: >-
    M'has vençut, Roxas. Saps

    el que vol dir això, oi?{:clear }Espero que guanyis!
- id: 17524
  text: >-
    Ara lluitaràs amb

    el Setzer, el campió!{:clear }A vegades baixa la guàrdia. Aprofita

    aquells moments per colpejar-lo!
- id: 17525
  text: >-
    Esteu preparats?{:clear }La botiga d'objectes és oberta.

    Comprem coses per a més endavant!
- id: 17526
  text: >-
    Quan perd la calma, el Hayner

    es torna més vulnerable.{:clear }Espera la teva oportunitat i el

    venceràs. Però jo no t'he dit res!
- id: 17527
  text: >-
    Una cosa estranya li passa al Vivi.{:clear }Si intentes evitar els seus

    atacs, podràs colpejar-lo.
- id: 17528
  text: >-
    Fixa't i veuràs que el

    Setzer té un patró d'atac!{:clear }Si el descobreixes, barallar-t'hi

    serà molt més fàcil!
- id: 17529
  text: >-
    El Seifer i la seva tropa han anat al carreró.

    Segur que no els agraden les multituds.
- id: 17530
  text: >-
    Espero que hagis comprat pocions. Les

    necessitaràs per lluitar amb el Hayner.{:clear }Si no tens suficients diners,

    pots treballar una mica més!
- id: 17531
  text: >-
    Sembla que el Seifer s'ha pres molt

    a pit la seva derrota contra el Vivi.{:clear }Ha tornat al carreró.
- id: 17532
  text: >-
    Diuen que el Setzer ha entrenat

    molt per a aquest torneig.{:clear }Tu també hauries d'estar preparat

    quan t'hi enfrontis, Roxas!
- id: 17533
  text: >-
    Els combats d'Struggle estan bé, però

    no hi ha res com una baralla del carrer!
- id: 17534
  text: >-
    Ahà!{:clear }Anaves a dir res?

    Pots venir quan vulguis, xaval.
- id: 17535
  text: >-
    Creus que ets fort només

    perquè has guanyat?{:clear }La propera vegada lluitaré de debó!
- id: 17536
  text: >-
    El Seifer et clavarà

    una allisada, col・lega!
- id: 17537
  text: >-
    Però si el Vivi no és tan fort!

    Hi ha d'haver un error!
- id: 17538
  text: >-
    El Seifer no anava de debò!

    A la propera sabràs el que és bo!
- id: 17539
  text: Victòria.
- id: 17540
  text: Trampós.
- id: 17541
  text: Afortunat.
- id: 17542
  text: >-
    Vols un autògraf?

    Em sap greu, estic ocupat.{:clear }Per què no vas cap aquell taulell?

    L'àrbitre hi explica les normes.
- id: 17543
  text: >-
    Has vingut perquè el campió

    et doni alguns consells?{:clear }Has de reunir les esferes més ràpid

    que el teu adversari. La resta és sort.
- id: 17544
  text: >-
    El combat ha estat bé, però no baixis

    la guàrdia mentre reculls esferes.{:clear }Una estratègia és allunyar-te perquè no

    t'ataquin. Tot i que res et servirà contra mi.
- id: 17545
  text: >-
    Els combats són com

    llençar una moneda, atzar.{:clear }Que et sembla si ho provem?

    Però no ens passem, eh?
- id: 17546
  text: >-
    He, he, he...{:clear }RR...Ro...

    xaa...ssss...
- id: 17547
  text: >-
    Per què he participat en aquest torneig?{:clear }Per què ara tothom

    em gira l'esquena?
- id: 17552
  text: >-
    Tots els participants han

    de conèixer les normes!
- id: 17553
  text: >-
    {:unk13 00 01 40 01}{:unk08 02 00 06}Escoltes les normes?

    {:chardelay 33 00}Ara no.

    {:chardelay 09 00}Bona idea.
- id: 17554
  text: >-
    Quan estiguis preparat, puja al

    quadrilàter i parla amb l'organitzador!
- id: 17557
  text: >-
    Primer deixa que l'àrbitre

    expliqui les normes!{:clear }Després començarà el tornig. Quan

    et toqui, vine a parlar amb mi.
- id: 17558
  text: >-
    Molt bé, és l'hora de començar!

    Espero que hagis practicat amb algú!
- id: 17559
  text: >-
    {:unk13 00 01 40 01}{:unk08 02 00 06}Preparat per lluitar amb el Hayner?

    {:chardelay 33 00}Encara no.

    {:chardelay 09 00}Estic preparat! Comencem!
- id: 17560
  text: >-
    Ha arribat el moment del combat final!

    Estàs a punt?
- id: 17561
  text: >-
    {:unk13 00 01 40 01}{:unk08 02 00 06}Preparat per lluitar amb el Vivi?

    {:chardelay 33 00}Encara no.

    {:chardelay 09 00}Estic preparat! Comencem!
- id: 17562
  text: >-
    I ara el combat pel títol!

    Esteu preparats?
- id: 17563
  text: "{:unk13 00 01 40 01}{:unk08 02 00 06}Preparat per lluitar contra el Setzer?\n{:chardelay 33 00}Encara no.\n{:chardelay 09 00}Estic preparat! Comencem! "
- id: 17587
  text: >-
    {:color #00F0F080}Prem {:icon dynamic-start} per accedir al menú principal.{:clear }{:reset}Hi pots consultar la condició i els calés i canviar la

    configuració. Durant les batalles no podràs obrir-lo.{:clear }El Diari del Roxas conté {:color #00F0F080}pistes{:reset} per avançar

    i esdeveniments passats.
- id: 17588
  text: >-
    El meu gos sempre

    va ençà i enllà.{:clear }On s'haurà ficat ara?
- id: 17589
  text: >-
    Aquesta ciutat està connectada

    per diversos túnels.{:clear }Quan era petit em feien por,

    però hi jugava tota l'estona.
- id: 17590
  text: >-
    Avui haig d'enganxar cartells

    per al proper combat d'Struggle!
- id: 17593
  text: >-
    Has estat genial!

    Gràcies!{:clear }Vull més! Estic desitjant veure

    el proper combat d'Struggle!
- id: 17594
  text: >-
    Vens de l'Estació Central?{:clear }Jo hi vaig a agafar un tren

    per anar a veure el meu net.
- id: 17595
  text: >-
    No he sentit res més

    de les Set Meravelles...{:clear }Vosaltres aneu a la estació a agafar

    el tren, no? Jo no sé què fer...
- id: 17596
  text: >-
    Hi ha un munt de llocs on

    buscar, com carrerons i túnels!
- id: 17597
  text: >-
    Gent que deixa boles abandonades,

    l'eco de la veu del Vivi...{:clear }Les «Set Meravelles» són més

    ben dit «Set Malentesos»!
- id: 17598
  text: >-
    Oblidem-ho. Les Set Meravelles

    no eren gens meravelloses.{:clear }Si no n'estàs convençut, ves

    tu mateix a aquella mansió.
- id: 17604
  text: >-
    El Hayner ha dit que esbrinarà

    més i s'encarregarà de tot.{:clear }Ja ha marxat corrent cap

    a la Plaça de l'Estació.
- id: 17605
  text: >-
    Com va tot?{:clear }Aquest lloc m'ha semblat sospitós,

    així que l'estic inspeccionant.
- id: 17606
  text: >-
    I pensar que era un gos amagat

    en un sac. Pobret!{:clear }Tot i només ser el meu reflex a l'aigua,

    no he pogut evitar sobresaltar-me!
- id: 17607
  text: >-
    Una mansió passat el trenc

    d'una paret i l'arbreda...{:clear }Això encaixa amb la descripció d'una casa

    embruixada, però només és un rumor, entesos?
- id: 17609
  text: >-
    Els combats d'Struggle estan bé, però

    no hi ha res com una baralla del carrer!
- id: 17610
  text: >-
    Al Seifer li importen

    un rave els deures.
- id: 17611
  text: Neci.
- id: 17612
  text: >-
    L'única forma d'enfortir-se

    és practicar.{:clear }Seguiré entrenant.
- id: 17613
  text: >-
    Per ser fort com el

    Seifer, haig de practicar.{:clear }El trobaràs al solar, però

    no esperis guanyar-lo.
- id: 17615
  text: >-
    Ara pots veure la condició dels

    membres del grup al menú principal.{:clear }Totes les habilitats i calés del

    Roxas s'han traspassat al Sora.{:clear }Al Diari del Grill, hi ha {:color #00F0F080}pistes de com

    avançar{:reset} i esdeveniments passats.
- id: 17631
  text: >-
    Has vingut a buscar feina?{:clear }Jo no aconsegueixo trobar-ne

    cap que pugui fer.
- id: 17632
  text: >-
    Al meu gos li agrada vagar,

    però sempre torna a casa.
- id: 17634
  text: >-
    Com més n'espanto,

    més n'apareixen!{:clear }Què hi faré?
- id: 17635
  text: >-
    Espero trobar actors aviat.

    No puc esperar!
- id: 17637
  text: >-
    He vingut a veure el tren

    que marxa sense conductor.{:clear }He estat aquí el dia sencer,

    però no ha passat ni un tren!
- id: 17638
  text: >-
    Com m'ho faré per portar allò

    cap a aquest garatge?{:clear }I vol que m'hi afanyi? No

    hauria d'haver triat aquesta feina.
- id: 17639
  text: >-
    Caminar pels túnels és més

    saludable que viatjar en tren!
- id: 17641
  text: >-
    Els combats d'Struggle sempre

    atreuen multituds, i tot gràcies a mi!{:clear }Ningú se n'assabentaria sense aquests

    cartells! Això sí, estic esgotat!
- id: 17643
  text: >-
    Aquesta pujada tan empinada fa

    més difícil repartir les cartes!{:clear }Però el carter és molt ràpid!

    En què anirà muntat?
- id: 17645
  text: >-
    Corren rumors sobre set meravelles que

    hi ha aquí a les Terraces del Capvespre.{:clear }Tindran la seva explicació, però les

    coses no sempre són el que semblen.
- id: 17647
  text: >-
    No t'he vist abans. Ja has vist

    la posta del sol des del turó?{:clear }És tan bonica... I més si

    s'hi va amb algú que estimes.
- id: 17648
  text: >-
    A vegades s'atura aquí

    un tren molt estrany.{:clear }Em pregunto on anirà.

    Tu en saps res?
- id: 17649
  text: >-
    Tens ganes de lluitar!? Esplèndid!

    Abans voldria provar la teva habilitat...{:clear }Però no tinc adversaris per a tu,

    hauràs d'esperar. Ves practicant!
- id: 17651
  text: >-
    La gent jove camina pels

    túnels enlloc d'agafar el tren.{:clear }Però jo soc ja molt vella per a això.
- id: 17653
  text: >-
    Jo ja estic vell. M'aniria bé

    que em donessin un cop de mà.
- id: 17654
  text: >-
    L'estació és pujant la costa.

    Anem en tren a l'Estació Central.{:clear }Em sembla que el tren local segueix

    sent gratuït, aprofitem-ho!
- id: 17656
  text: >-
    Anem a resoldre el misteri del tren

    fantasma del Turó del Capvespre!{:clear }Això ha de ser cert! Ho pressento!

    Aviam, almenys això crec...
- id: 17657
  text: >-
    El forat de la paret de la Placeta del

    Tramvia et du a la mansió encantada.{:clear }Però només és un rumor. No

    et facis moltes il・lusions.
- id: 17659
  text: >-
    Has dormit tant de temps que pot ser que

    encara estiguis una mica atordit, Sora.{:clear }No et preocupis. Si oblides el que

    has de fer, mira el Diari del Grill.
- id: 17660
  text: >-
    Serà un llarg viatge, així que ens

    haurem de preparar de valent!
- id: 17661
  text: >-
    {:unk13 00 01 40 01}{:unk08 02 00 06}Pugem al tren?

    {:chardelay 33 00}Encara no.

    {:chardelay 09 00}D'acord.
- id: 17662
  text: >-
    No tornis a la mansió, podries

    agafar el son un altre cop!{:clear }A més, hem d'esbrinar quina classe

    de lloc és aquest. Quins nervis!
- id: 17663
  text: >-
    Hora de començar la nostra aventura!{:clear }Si encara hi ha res que vulguis fer aquí,

    aquesta és la teva última oportunitat.
- id: 17664
  text: >-
    Si vols saber coses d'aquesta ciutat,

    ves al solar. Nosaltres estem ocupats.{:clear }Però segur que la tropa

    del Seifer t'ajudarà.
- id: 17665
  text: >-
    El nano que et buscava és a la estació.{:clear }Hauries d'anar a veure què vol.

    L'estació és a dalt del Carrer del Mercat.
- id: 17666
  text: >-
    Hem de fer els deures. Si tens temps,

    per què no aconsegueixes una feina?{:clear }Un moment. No crec que

    ningú et contracti ara.
- id: 17667
  text: >-
    No perdré un combat contra tu

    ni al carrer ni a l'Struggle!{:clear }Per què no tornes

    d'aquí deu anys?
- id: 17668
  text: >-
    No sé qui ets,{:clear }però no podràs derrotar

    el Seifer a l'Struggle!
- id: 17669
  text: Anihilació instantània.
- id: 17670
  text: >-
    He vingut perquè he sentit que hi

    haurà un altre combat d'Struggle.{:clear }L'organitzador és al solar.

    Ell te'n donarà més detalls.
- id: 17671
  text: >-
    El Seifer és una màquina, nano!{:clear }Ha sonat dur, eh? 

    Dur com el Rai, nano!
- id: 17672
  text: >-
    Sento haver estat tan fred abans, és que

    hi ha una cosa que em crispa els nervis...{:clear }Potser no ens veiem en un temps.

    Cuida't, entesos?
- id: 17673
  text: >-
    Què estrany! Sento que per alguna

    raó me n'haig de acomiadar...{:clear }Com si hagués de dir adeu a algú que

    he esperat llargament per veure...
- id: 17674
  text: >-
    Ah, Sora, aquell moneder...

    Bah, tant és.{:clear }Torna a visitar-nos, d'acord?

    Serem on sempre.
- id: 17675
  text: >-
    Aviam, hem vingut fins aquí en

    tren tal i com el rei ens ha dit.{:clear }On debem ser?

    Aquest lloc és bastant estrany.
- id: 17676
  text: El Pete arriba tard.{:clear }No sap que hem vençut la Maléfica.
- id: 17677
  text: >-
    Hem de llegir aquell llibre

    com ens ha dit el Yen Sid!{:clear }Hem dormit una bona estona.

    Esbrinem què ha estat ocorrent!
- id: 17678
  text: >-
    Hi ha algú a l'entrada de l'edifici.{:clear }Norma de l'aventurer número 17:

    recull informació!
- id: 17679
  text: >-
    Mai hagués imaginat que

    trobaríem el Pete aquí!{:clear }Es veu que no només causa

    problemes al nostre món!
- id: 17680
  text: >-
    Quina torre més estranya!

    Perquè l'hauran construida?{:clear }Norma de l'aventurer número 8:

    revisa cada racó d'un nou lloc!
- id: 17681
  text: >-
    Aquell llibre conté informació

    important. Asegura't de llegir-lo.
- id: 17682
  text: >-
    {:unk13 00 01 40 01}{:unk08 02 00 06}Vols preguntar res?

    {:chardelay 33 00}No, llegiré una mica més.

    {:chardelay 09 00}Sí, de fet...
- id: 17860
  text: >-
    A partir d'ara, si la VT arriba a zero, {:color #00F0F080}el joc s'acaba{:reset}.

    Asegura't de recuperar VT quan l'indicador baixi.
- id: 17861
  text: >-
    {:unk0f 03 1E 00 84 01}{:color #00F0F080}S'ha afegit l'ordre Fusió.{:reset}

    L'indicador a la part inferior dreta

    s'exhaureix amb les transformacions.{:clear }{:unk0f 00 00 00 00 00}És molt poderós, ja que absorbeix la força dels teus aliats.

    Mentre et transformes, el teus amics desapareixen.
- id: 17906
  text: >+
    {:delayandfade 05 3C}Ves amb compte.










- id: 17907
  text: >+
    {:delayandfade 05 3C}Rere aquella porta, aguarda

    un món totalment diferent.









- id: 17908
  text: >+
    {:delayandfade 05 3C}Però no temis.










- id: 17909
  text: >+
    {:delayandfade 05 3C}No t'aturis...










- id: 17910
  text: La teva moral ha augmentat (Força +1).
- id: 17911
  text: T'has tornat més serè (Defensa +1).
- id: 17912
  text: T'has tornat més astut (Màgia +1).
- id: 17913
  text: ''
- id: 17914
  text: T'has tornat una mica més hàbil (PH +1).
- id: 17915
  text: T'has tornat bastant hàbil (PH +2).
- id: 17916
  text: Reps el poder del guerrer.
- id: 17917
  text: Reps el poder del guardià.
- id: 17918
  text: Reps el poder del místic.
- id: 17945
  text: >-
    Ei! Com va el teu viatge?

    Per aquí no hi ha moltes novetats.{:clear }L'organitzador de l'Struggle està

    preparant alguna cosa. Fes-li un cop d'ull.
- id: 17946
  text: >-
    Sora! Donald! Goofy!

    M'alegra veure-us de nou!{:clear }El taller d'objectes és obert.

    Us servirà per al vostre viatge. Aneu allà!
- id: 17947
  text: >-
    Has tornat! M'alegra

    molt veure't!{:clear }Ara hi ha ofertes de feina. Potser

    vols treballar mentre ets aquí.
- id: 17948
  text: >-
    Com va el vostre viatge fins ara?

    Si us fiqueu en problemes, torneu a l'inici.{:clear }Us deixaré aquell llibre a mà perquè

    pogueu llegir-lo en qualsevol moment.
- id: 17949
  text: Podràs partir quan et canviïs de roba!
- id: 17950
  text: >-
    {:unk13 00 01 40 01}{:unk08 02 00 06}Canvies de roba?

    {:chardelay 33 00}Encara no.

    {:chardelay 09 00}Si us plau!
- id: 17951
  text: >-
    No estàs preparat per a l'últim vestit.

    No funcionarà, Sora.{:clear }Només pot utilitzar-lo aquell que

    hagi superat totes les proves.
- id: 17952
  text: >-
    Ens han parlat de tu. Afanya't

    i emprova't les teves noves peces!{:clear }Això sí, abans has d'estar

    preparat per al viatge.
- id: 17953
  text: >-
    Mmm...

    Veient la teva cara, Sora...{:clear }Diria que ets capaç de

    portar les peces màgiques!
- id: 17954
  text: >-
    Aquestes peces et serviran

    a mesura que creixis!{:clear }Encara no coneixes el seu veritable potencial.

    Hauràs d'aprendre a fer-lo servir!
- id: 17955
  text: >-
    Què, la teva roba màgica?

    Cadascuna poseeix quatre habilitats.{:clear }Específicament... Mmm... Oh,

    quines eren? La Flora ho ha de saber!
- id: 17958
  text: >-
    Afanya't! Cap a la {:theme 0A}Plaça de l'Estació!{:reset}

    Allà pots esbrinar més sobre la Kairi!
- id: 17960
  text: >-
    Això no m'agrada.{:clear }Queda't amb el trofeu per

    ara, ja me'l tornaràs!
- id: 17962
  text: >-
    Has sorprès el Seifer amb

    la guàrdia baixa, col・lega!
- id: 17964
  text: Molesta.
- id: 17970
  text: >-
    Aposto que pots arribar a l'altra Vila

    Crepuscle a través d'aquesta mansió.
- id: 17971
  text: >-
    No et preocupis, estarem de guàrdia

    aquí. Fes-li un cop d'ull a aquella mansió!
- id: 17972
  text: >-
    No puc creure que en aquesta mansió

    hi hagi un ordinador tan meravellós.{:clear }Mira totes aquestes màquines.

    No entenc res d'això.
- id: 17973
  text: >-
    Jo m'encarrego d'aquest món!

    Si us trobeu en problemes, torneu-ne.{:clear }Aquell aparell hauria de

    poder tornar-vos-en.
- id: 17974
  text: >-
    Aquesta mansió és aterridora. Segur

    que allà hi ha monstres a l'aguait...
- id: 17975
  text: >-
    Aquest lloc cau a trossos.{:clear }Hi haurà un ordinador en

    aquesta mansió abandonada?
- id: 17976
  text: >-
    La contrasenya és el nom d'aquell gelat!{:clear }Asegureu-vos que estigui bé. No

    funcionarà amb una d'incorrecta!
- id: 17977
  text: >-
    {:unk13 00 01 31 01}{:unk08 02 00 06}El nom del gelat era...

    {:chardelay 33 00}Gelat de sucre celestial.

    {:chardelay 09 00}Gelat de sal marina.

    {:chardelay 33 00}Gelat de fetge empebrat.
- id: 17978
  text: >-
    A l'altre món també hi deu

    haver un aparell com aquest.{:clear }Amb ell s'hi hauria

    de poder tornar!
- id: 17979
  text: >-
    Endavant!{:clear }Aquest lloc deu

    amagar algun secret!
- id: 17980
  text: >-
    No crec que aquestes coses blanques

    ens ataquin més durant una estona.{:clear }Aprofiteu per registrar la mansió!
- id: 17981
  text: >-
    Un sabor de gelat? Serà el d'aquell

    que acostumàvem a prendre sempre?{:clear }Dolç i salat... Deliciós!

    Ha de ser aquell!
- id: 17982
  text: >-
    Em fa la sensació que tornarem a

    veure't. Porta-t'hi la Kairi, entesos?{:clear }T'estarem esperant!
- id: 17983
  text: >-
    El Riku s'enfadarà molt amb mi.{:clear }Ara hem d'afanyar-nos

    i registrar la mansió!
- id: 17984
  text: >-
    En aquesta mansió, hi ha d'haver un

    ordinador que ens dugui a l'altre món!{:clear }Estic segur que el

    trobarem si busquem bé!
- id: 17985
  text: >-
    Bingo! El nom del gelat

    és gelat de sa...{:clear }No, millor encarrega-te'n tu. 

    Afanya't i digues al Pence el sabor!
- id: 17986
  text: >-
    Preparat?{:clear }Per ser transportat a l'altre

    món, {:theme 0A}toca aquesta llum{:reset}!
- id: 17987
  text: >-
    Et pot semblar igual, però

    aquest lloc és diferent al d'abans.{:clear }L'enemic pot atacar en qualsevol

    moment, aneu amb compte!
- id: 17989
  text: >-
    Res sembla canviat, però

    tinc un mal pressentiment.{:clear }Preparem-nos per al que sigui,

    però sempre podem tornar...{:clear }a l'altre món utilitzant la llum.
- id: 17991
  text: >-
    Llavors sí que hi havia

    una altra Vila Crepuscle.{:clear }Som-hi, hem de trobar

    l'entrada a la foscor.
- id: 18070
  text: Derrota tots els incorporis!
