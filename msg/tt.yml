  text: >-
    {:unk08 02 00 06}{:chardelay 33 00}Cap.

    {:chardelay 0A 00}Inici.

    {:chardelay 0B 00}Interludi.

    {:chardelay 0C 00}El que vindrà.
- id: 19129
  text: >-
    {:unk13 00 01 D0 00}«Inici»{:clear }A cada viatge ocorren

    trobades casuals, i

    cada trobada suposa

    un acomiadament.


    Quan un acomiadament dona

    pas a un viatge, els mons

    obren els seus cors.{:clear }Aquells escollits per la llum

    o atrapats per la foscor...


    Amics que comparteixen els

    mateixos llaços, encara que

    els seus camins se separin.{:clear }Quan dubtis del camí que

    has recorregut, quan perdis

    la mà que sostenies, mira de

    nou el cor que una vegada fou...


    doncs allí trobaràs les respostes.
- id: 19130
  text: >-
    {:unk13 00 01 D0 00}«Interludi»{:clear }Un llarg somni.


    Un trist adeu penja a l'aire

    d'aquest «món intersticial».{:clear }Què és la realitat? Què és

    la il・lusió? El camí escollit pel

    nen condueix als seus records.{:clear }Quan t'atrapi el corrent

    de dies i nits succeint-se,

    contempla de nou els teus passos...


    doncs allí la confusió cessarà.
- id: 19131
  text: >-
    {:unk13 00 01 D0 00}«El que vindrà»{:clear }Veurem el dia en què aquesta batalla,

    sorgida de la confusió, cessi?


    Cada persona ho viu d'una manera diferent.{:clear }Podria ser la realitat quelcom que s'oculta?


    La raò és mera existència.

    Tot i així, pots creure en els records.{:clear }No temis. Confia el teu cos a les

    suaus onades de la teva memòria.

    Aviat, el teu descans haurà conclòs...


    i tot començarà.
