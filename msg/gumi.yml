  text: '{:icon dynamic-dpad}: Passa la pàgina {:icon dynamic-circle}: Enrere'
- id: 18694
  text: No.
- id: 18695
  text: >-
    Com donar als gumis el color de la paleta.


    {:color #8080F080}{:icon dynamic-dpad}{:reset}/{:icon dynamic-l1}{:icon dynamic-l2}: Moure cursor

    {:icon dynamic-right-analog}: Rotar càmera

    {:icon dynamic-triangle}: Expandir àrea

    {:icon dynamic-triangle} dos cops: Confirmar àrea

    {:icon dynamic-cross}: Confirmar  {:icon dynamic-circle}: Enrere


    {:color #00F0F080}- Posem-hi més colors!{:reset}

    Selecciona el color que vulguis utilitzar

    a la paleta de color i prem {:icon dynamic-cross}. Després,

    posa el cursor sobre el gumi que desitges

    acolorir i prem {:icon dynamic-cross}. També pots

    escollir colors quan col・loques gumis,

    o acolorir àrees seleccionades.
- id: 18696
  text: 2. Paletes de color
- id: 18697
  text: Les paletes de color
- id: 18698
  text: >-
    Pots utilitzar {:color #F0F00080}fins a 16 colors{:reset} en una

    nau gumi. Els trobaràs

    en la paleta de color.


    {:color #00F0F080}- Com utilitzar la paleta de color{:reset}

    Si la nau gumi ja està acolorida,

    simplement escull de la paleta un color

    que t'agradi per canviar el color actual.


    El color de la paleta seleccionat es

    pot canviar en qualsevol moment.
- id: 18700
  text: 5. Kits de disseny
- id: 18701
  text: Els kits de disseny
- id: 18702
  text: >-
    Els kits de disseny són colors

    realitzats sobre patrons.

    {:color #F0F00080}Aconsegueix kits de disseny{:reset}

    per agregar estampats als gumis.


    {:color #00F0F080}- Com utilitzar kits de disseny{:reset}

    Per obrir els mostraris de kits de

    disseny que hagis aconseguit, obre el

    mostrari de colors i prem {:icon dynamic-triangle}.

    Posa'ls a la paleta de color per

    utilitzar-los als gumis.


    Per tornar al mostrari de color,

    prem {:icon dynamic-triangle}.
