- id: 16634
  text: >-
    Les naus gumi són vehicles especials,

    construïts amb {:color #8080F080}blocs gumi{:reset}.


    Amb aquest Editor gumi, pots

    construir la teva pròpia nau o

    remodelar naus basades en

    els plànols que hagis adquirit.


    {:color #00F0F080}- Prem {:icon dynamic-select} i obtindràs ajuda!{:reset}

    Només prement {:icon dynamic-select},

    pots accedir a aquesta {:color #F0F00080}guia gumi{:reset} en 

    qualsevol moment. Si en fabricar tens

    dubtes, prem {:icon dynamic-select} per rebre asistència.
- id: 16635
  text: >-
    Els materials gumi són {:color #F0F00080}blocs que

    pots adaptar{:reset} d'acord amb les teves

    necessitats a l'hora de construir.


    {:color #00F0F080}- Crea una estructura amb materials gumi!{:reset}

    Per treballar amb materials gumi,

    s'utilitzen tres eines bàsiques:

    {:color #8080F080}Col・locar gumis{:reset}, {:color #8080F080}Còpiar i col・locar{:reset}, i

    {:color #8080F080}Donar-hi forma{:reset}.


    {:color #00F0F080}- Com es canvia de mode?{:reset}

    Mentre treballes amb materials gumi,

    pots prèmer {:icon dynamic-triangle} o escollir que

    l'ordre {:color #8080F080}Canvi de mode{:reset} canviï

    a {:color #F0F00080}mode d'edició per a deco-gumis{:reset}.
- id: 16636
  text: >-
    Els accessoris gumi, o deco-gumis, són

    blocs que posseixen funcions especials

    i no es poden reformar.


    {:color #00F0F080}- Col・loca alguns deco-gumis!{:reset}

    Per col・locar deco-gumis, s'utilitza una

    d'aquestes tres ordres, segons el tipus de gumi:

    {:color #8080F080}Armes gumi{:reset}, {:color #8080F080}Gumis de moviment{:reset}, o

    {:color #8080F080}Gumis auxiliars{:reset}.


    {:color #00F0F080}- Com es canvia de mode?{:reset}

    Mentre treballes amb deco-gumis, pots

    prèmer {:icon dynamic-triangle} o escollir que l'ordre

    {:color #8080F080}Canvi de mode{:reset} canviï a {:color #F0F00080}mode de edició

    per a materials gumi{:reset}.
- id: 16637
  text: >-
    En editar, pots veure la nau gumi

    prement {:color #8080F080}{:icon dynamic-start}{:reset} en el menú superior.


    {:color #8080F080}{:icon dynamic-left-analog}{:reset}: Apropar/Allunyar

    {:color #8080F080}{:icon dynamic-right-analog}{:reset}: Rotar càmera

    {:color #8080F080}{:icon dynamic-r3}{:reset}: Posició de càmera inicial

    {:icon dynamic-circle}: Sortir del mode visor


    {:color #00F0F080}- {:icon dynamic-start} durant l'edició{:reset}

    Si vols tornar al menú superior

    mentre edites, prem {:color #8080F080}{:icon dynamic-start}{:reset}.
- id: 16638
  text: >-
    Existeixen molts tipus de blocs gumi.

    La funcionalitat de la teva nau gumi depèn

    de {:color #F0F00080}la combinació de blocs que utilitzis

    per construir-la{:reset}. Aquesta guia gumi

    t'ensenyarà a utilitzar el sistema

    i a construir naus.


    {:color #00F0F080}- Descobreix la guia gumi!{:reset}

    Com utilitzar aquesta guia:


    {:icon dynamic-cross}: Obrir l'ajuda seleccionada

    {:icon dynamic-circle}: Tornar a la secció anterior

    {:color #8080F080}{:icon dynamic-select}{:reset}: Tancar la guia gumi


    Per seguir llegint, prem {:icon dynamic-cross}!
- id: 16640
  text: >-
    Veure els {:color #8080F080}objectes i funcions especials{:reset}

    que has aconseguit fins al moment

    per a la teva nau gumi.
- id: 16641
  text: >-
    Els materials gumi s'utilitzen principalment

    per crear l'estructura de la nau. Poden

    ser reformats abans de col・locar-se.

    {:color #00F0F080}- Els paràmetres també són importants!{:reset}

    Els paràmetres de la teva nau gumi

    canviaran segons la forma dels

    materials gumi.

    {:color #8080F080}Gumis bisellats{:reset}/{:color #8080F080}Gumis corbs{:reset} -

    {:color #F0F00080}Augmenten la VT{:reset}

    {:color #8080F080}Gumis Aero{:reset} - {:color #F0F00080}Augmenten la movilitat{:reset}

    {:color #8080F080}Multigumis{:reset}

    Per fer-ne més fàcil el procès, els gumis

    bisellats, tubulars i corbs s'agrupen.

    Els paràmetres segueixen iguals als

    dels gumis originals per separat.
- id: 16642
  text: >-
    Copia la forma de un material gumi

    existent per reformar un material gumi

    nou i col・locar-lo a la teva nau.

    {:color #00F0F080}- Mètodes de copiatge{:reset}

    {:color #8080F080}Còpia normal{:reset}
      Copia el disseny del gumi tal i com és
      i el col・loca.
    {:color #8080F080}Còpia en mirall{:reset}
      Fa la volta i copia el disseny del gumi i
      el col・loca.
    {:color #00F0F080}- Si no en tens suficients...{:reset}

    Per copiar i col・locar gumis, has de

    tenir {:color #F0F00080}la mateixa quantitat de materials

    gumi{:reset}. No pots col・locar gumis si no

    en tens la quantitat necessària.
- id: 16643
  text: >-
    Pots reformar materials gumi

    ja col・locats.

    En fer-ho, els paràmetres

    també cambiaran.


    {:color #00F0F080}- Tres tipus de reformes{:reset}

    {:color #8080F080}Bisells{:reset}
      El material gumi seleccionat es
      convertirà en un gumi bisellat.
    {:color #8080F080}Corbes{:reset}
      El material gumi seleccionat es
      convertirà en un gumi corb.
    {:color #8080F080}Puntes{:reset}
      El material gumi seleccionat tindrà
      una punta en una direcció específica.
- id: 16644
  text: >-
    Pots acolorir els blocs gumi.

    Hi ha varies maneres de fer-ho.


    Tria un color quan col・loques el gumi.

    Agrega el color al gumi després

    de haver-lo col・locat.

    Canvia el color d'un gumi.


    {:color #00F0F080}- Aconsegueix kits de disseny!{:reset}

    Al principi, només pots acolorir

    els gumis. Però si {:color #F0F00080}aconsegueixes

    kits de disseny{:reset}, també podràs

    utilitzar diferents dissenys.
- id: 16645
  text: >-
    Les unitats d'habilitat són parts que

    {:color #F0F00080}agreguen certes funcions{:reset} a la nau.

    A diferència dels blocs gumi,

    no tenen forma.

    {:color #8080F080}{:icon dynamic-dpad-up-down}{:reset}: Mou cursor

    {:icon dynamic-cross}/{:icon dynamic-triangle}: Col・loca/Treu


    {:color #00F0F080}- Assignar habilitats{:reset}

    Cada habilitat té {:color #F0F00080}PH{:reset}. Pots

    assignar habilitats al teu gust

    fins que l'indicador de {:color #F0F00080}PH de

    la nau gumi{:reset} es completi.
- id: 16646
  text: >-
    Canvia la configuració de l'Editor

    d'acord a les teves preferències.


    {:color #8080F080}{:icon dynamic-dpad-up-down}{:reset}: Selecciona la configuració

    {:color #8080F080}{:icon dynamic-dpad-left-right}{:reset}: Canvia la configuració{:reset}

    {:icon dynamic-circle}: Confirma la selecció i torna


    {:color #00F0F080}- Intentem-ho!{:reset}

    Pots canviar la configuració

    quan vulguis, així que fes-li

    un cop d'ull quan puguis.
- id: 16647
  text: >-
    Quan completes una nau gumi, has de

    guardar-la com {:color #8080F080}plànol original{:reset} utilitzant

    {:color #8080F080}Guarda el plànol{:reset} en el menú de l'Editor,

    o {:color #F0F00080}no podràs utilitzar-la{:reset}.

    Si guardes els plànols, pots volar i

    reeditar aquelles naus gumi.

    Tot i així, {:color #F0F00080}les naus gumi que hagin

    excedit els costos no es podran guardar{:reset}.


    {:color #00F0F080}- Guardar a cercles de llum{:reset}

    Pots guardar els blocs gumi i els plànols

    que aconsegueixis en els {:color #F0F00080}cercles de llum{:reset}.

    Aquella informació no es guarda

    quan selecciones {:color #8080F080}Guarda el plànol{:reset}.
- id: 16648
  text: >-
    Les armes gumi són gumis d'atac.

    {:color #F0F00080}Com major sigui l'energia, major{:reset}

    {:color #F0F00080}serà el mal{:reset} que causi la nau gumi.


    {:color #00F0F080}- Aprèn a utilitzar aquests gumis{:reset}

    {:color #8080F080}Gumi-projectils{:reset} - Per disparar
      un enemic, prem {:icon dynamic-cross}.
    {:color #8080F080}Gumi-blancs{:reset} - Per fixar
      l'enemic i disparar-lo, mantèn
      premut {:icon dynamic-cross}.
    {:color #8080F080}Gumi-rajos{:reset} - Prem {:icon dynamic-triangle} per
      atacar utilitzant l'indicador de Raig.
    {:color #8080F080}Gumi-impactes{:reset} - Pots atacar amb els
      gumi-impactes col・locats a la teva nau.
- id: 16649
  text: >-
    Els gumis de moviments tenen la capacitat

    de millorar els moviments de la teva nau.


    Els {:color #8080F080}gumi-motors{:reset} {:color #F0F00080}consumeixen energia{:reset},

    però augmenten la velocitat de la nau.

    Els {:color #8080F080}gumi-ales{:reset} augmenten la

    {:color #F0F00080}movilitat{:reset} de la nau.


    {:color #00F0F080}- Major movilitat{:reset}

    La nau gumi pot fer una {:color #F0F00080}

    tombarella{:reset} amb {:icon dynamic-circle}.

    Això et donarà velocitat i et permetrà

    esquivar millor els atacs enemics.
- id: 16650
  text: >-
    Els gumis auxiliars són blocs especials.

    Existeixen {:color #8080F080}gumi-cabines{:reset},

    {:color #8080F080}gumi-proteccions{:reset} i {:color #8080F080}gumis opcionals{:reset}.

    Cadascun té varies funcions.


    {:color #00F0F080}- Gumi-cabines{:reset}

    De tots els gumis auxiliars, el

    {:color #8080F080}gumi-cabina{:reset} n'és el més important.

    Si en col・loques un, la velocitat de la

    nau es reduirà bastant, però

    l'{:color #F0F00080}energia{:reset} augmentarà molt.


    Has de col・locar un per a que la nau

    {:color #F0F00080}pugui alliberar tota la seva força{:reset}.
- id: 16651
  text: >-
    A l'inici, no pots construir grans

    naus. Els blocs gumi tenen certs {:color #8080F080}costos{:reset}.

    Pots col・locar gumis fins que es completi el

    {:color #F0F00080}cost de la nau gumi{:reset} que apareix en la part

    superior dreta.


    {:color #00F0F080}- Els dos gumis a la vegada!{:reset}

    Els {:color #8080F080}materials gumi{:reset} i els {:color #8080F080}deco-gumis{:reset}

    poden col・locar-se a sobre de l'altre.


    {:color #00F0F080}- Cap a on apunta la nau gumi?{:reset}

    La nau gumi apunta en la direcció

    que marca la fletxa de l'espiera.

    La icona que apareix a la part inferior

    dreta també mostra la direcció.
- id: 16652
  text: >-
    {:color #00F0F080}- Canvi de mode{:reset}

    {:color #8080F080}Canvia de mode{:reset} amb {:icon dynamic-triangle}.


    {:color #00F0F080}- Desfer/Refer{:reset}

    Utilitza {:icon dynamic-r1} per {:color #8080F080}desfer{:reset}, i {:icon dynamic-r2} per {:color #8080F080}refer{:reset}.


    {:color #00F0F080}- Tornar al menú superior{:reset}

    Si prems {:color #8080F080}{:icon dynamic-start}{:reset} mentre edites, tornaràs

    immediatament al menú superior.


    {:color #00F0F080}- Reiniciar càmera{:reset}

    Prement {:color #8080F080}{:icon dynamic-r3}{:reset}, pots fer que la

    càmera torni a la seva posició inicial.
- id: 16654
  text: >-
    Copia l'àrea seleccionada i col・loca un altre gumi.


    {:color #8080F080}{:icon dynamic-dpad}{:reset}/{:icon dynamic-l1}{:icon dynamic-l2}: Moure cursor

    {:color #8080F080}{:icon dynamic-right-analog}{:reset}: Rotar càmera

    {:color #8080F080}{:icon dynamic-left-analog}{:reset}: Rotar gumi seleccionat

    {:icon dynamic-cross}: Seleccionar el gumi que vulguis copiar

    {:icon dynamic-cross} dos cops: Copiar {:icon dynamic-circle}: Enrere


    {:color #00F0F080}- Anem a copiar!{:reset}

    Mou el cursor a la forma que vulguis

    copiar i prem {:icon dynamic-cross}. Ara mou el cursor

    a on vulguis col・locar-la. 

    Utilitza {:color #8080F080}{:icon dynamic-left-analog}{:reset} per rotar i col・locar el gumi. 

    Confirma la direcció en la que vols que miri

    i prem {:icon dynamic-cross} de nou per copiar-lo.
- id: 16656
  text: >-
    Primer, tria el gumi que vulguis col・locar.


    {:icon dynamic-cross}: Confirma {:icon dynamic-circle}: Enrere


    {:color #00F0F080}- Mira des de diferents angles!{:reset}

    Pots rotar la càmera amb {:icon dynamic-right-analog}. 

    {:color #8080F080}Quan ho facis, pots revisar la teva nau i els

    blocs gumi des de molts angles diferents.


    {:color #00F0F080}- Posem-li color!{:reset}

    En seleccionar un gumi, pots canviar la

    paleta de colors amb {:icon dynamic-l1} i {:icon dynamic-r1}. 

    És recomanable decidir per endavant quins

    colors utilitzar. Per fer-ho, selecciona

    {:color #8080F080}Pinta{:reset} en el menú superior.
- id: 16657
  text: >-
    Pots dirigir més d'un

    gumi a la vegada.


    {:icon dynamic-triangle}: Expandeix àrea

    {:icon dynamic-triangle} dos vegades: Confirma'n l'àrea


    {:color #00F0F080}- Seleccionar una àrea{:reset}

    Prem {:icon dynamic-triangle} al costat de l'àrea

    que vols expandir, i mou el cursor

    per expandir-la. Prem un altre cop {:icon dynamic-triangle}

    per confirmar-ne l'àrea.
- id: 16658
  text: >-
    Per {:color #8080F080}agregar bisells{:reset} i {:color #8080F080}corbes{:reset}, has

    de seleccionar un material gumi.


    {:color #8080F080}{:icon dynamic-dpad}{:reset}/{:icon dynamic-l1}{:icon dynamic-l2}: Mou el cursor

    {:color #8080F080}{:icon dynamic-right-analog}{:reset}: Rota la càmera

    {:icon dynamic-cross}: Confirma  {:icon dynamic-circle}: Enrere

    {:icon dynamic-r1}: Desfés {:icon dynamic-r2}: Refés


    {:color #00F0F080}- Donem-li forma!{:reset}

    Posa el cursor sobre el gumi que vulguis

    reformar i prem {:icon dynamic-cross}. També pots {:color #F0F00080}

    reformar una àrea{:reset}.


    Si comets un error, utilitza aquests botons:

    {:icon dynamic-r1}: {:color #8080F080}Desfés{:reset} {:icon dynamic-r2}: {:color #8080F080}Refés{:reset}.
- id: 16659
  text: >-
    Tria el color que vols utilitzar en

    la {:color #F0F00080}paleta de color{:reset}.


    {:color #8080F080}{:icon dynamic-dpad}{:reset}: Mou el cursor

    {:color #8080F080}{:icon dynamic-right-analog}{:reset}: Rota la càmera

    {:icon dynamic-square}/{:icon dynamic-dpad-down}: Obre el mostrari{:reset}

    {:icon dynamic-cross}: Confirma  {:icon dynamic-circle}: Enrere

    {:icon dynamic-triangle} en el mostrari de color: Canvia'n el color


    {:color #00F0F080}- Posa un color a la paleta!{:reset}

    Selecciona una paleta de color amb {:color #8080F080}{:icon dynamic-dpad-left-right}{:reset}, i

    obre el mostrari de color amb {:icon dynamic-square} o {:color #8080F080}{:icon dynamic-dpad-down}{:reset}.

    En el mostrari, selecciona un color i

    prem {:icon dynamic-cross} per agregar-lo a la paleta.
