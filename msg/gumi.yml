- id: 18798
  text: >-
    Has completat totes les {:color #8080F080}missions

    gumi{:reset}! i has aconseguit tots els

    {:color #8080F080}blocs gumi{:reset} i els {:color #8080F080}objectes especials{:reset}!
- id: 18799
  text: >-
    El {:color #8080F080}cost{:reset} límit de la nau gumi {:color #F0F00080}ha

    augmentat en 100{:reset}!


    Ara el cost màxim d'una nau gumi

    ha augmentat a {:color #8080F080}700{:reset}.
- id: 18800
  text: >-
    El {:color #8080F080}coste{:reset} límit de la nau gumi {:color #F0F00080}ha

    tornat a augmentar en 100{:reset}!


    Ara el cost màxim d'una nau gumi

    ha augmentat a {:color #8080F080}800{:reset}.
- id: 18801
  text: >-
    Obtens una {:color #F0F00080}unitat d'habilitat{:reset}!

    Les unitats d'habilitat són parts que

    {:color #F0F00080}agreguen certes funcions{:reset} a la nau gumi.

    A diferència dels blocs gumi, les

    unitats d'habilitat no tenen forma.

    Per {:color #8080F080}assignar habilitats{:reset},

    selecciona aquella ordre en el menú de l'Editor.


    {:color #00F0F080}- Com assignar habilitats{:reset}

    Cada habilitat té {:color #F0F00080}PH{:reset}. Pots

    assignar habilitats al teu gust

    fins que l'indicador de {:color #F0F00080}PH de

    la nau gumi{:reset} es completi.


    Intenta adquirir moltes habilitats!
- id: 18802
  text: >-
    Els {:color #8080F080}PH{:reset} límit de la nau gumi {:color #F0F00080}han

    augmentat 4 punts{:reset}!


    Pots assignar fins a {:color #8080F080}12 PH{:reset}

    a la nau gumi.
- id: 18803
  text: >-
    Els {:color #8080F080}PH{:reset} límit de la nau gumi {:color #F0F00080}han

    tornat a augmentar 4 punts{:reset}!


    Pots assignar fins a {:color #8080F080}16 PH{:reset}

    a la nau gumi.
- id: 18804
  text: >-
    Els {:color #8080F080}PH{:reset} límit de la nau gumi {:color #F0F00080}han

    tornat a augmentar 4 punts{:reset}!


    Pots assignar fins a {:color #8080F080}20 PH{:reset}

    a la nau gumi.
- id: 18805
  text: >-
    Obtens un {:color #F0F00080}kit de disseny{:reset}!

    Selecciona {:color #8080F080}Pinta{:reset} en el menú de l'Editor

    per agregar dissenys als blocs gumi.


    Intenta adquirir molts kits de disseny!
- id: 18806
  text: >-
    Obtens una {:color #F0F00080}naueta{:reset}!

    Una {:color #8080F080}naueta{:reset} és una nau petita

    que segueix la nau gumi, lluita al costat

    d'ella i bloqueja certs atacs enemics.


    {:color #00F0F080}- Modificar la naueta{:reset}

    Selecciona {:color #F0F00080}Naueta{:reset} en el menú gumi

    per construir-ne una. La naueta té

    el seu {:color #F0F00080}propi cost{:reset}, el seu {:color #F0F00080}propi plànol{:reset} i

    es construeix apart de la nau gumi.

    No obstant això, ambdues naus no poden volar

    simultàniament si comparteixen un gumi.

    El paràmetre de la naueta que t'acompanya

    s'incorpora a l'estructura de la nau gumi.
- id: 18807
  text: >-
    El {:color #8080F080}cost{:reset} límit de la naueta {:color #F0F00080}ha

    augmentat en 100{:reset}!


    Ara la naueta pot tenir un

    {:color #8080F080}cost de 200{:reset}.
- id: 18923
  text: >-
    {:icon question-mark}{:color #F0F00080} NOTA{:reset}
    	Vols guardar el plànol de la
    	nau que acabes de construir?
- id: 18924
  text: >-
    {:icon exclamation-mark}{:color #F0F00080} NOTA{:reset}
    	Per guardar aquest plànol,
    	has de baixar-ne el cost i treure'n blocs.
