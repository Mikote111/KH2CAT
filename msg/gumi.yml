  text: 4. Guarda el plànol
- id: 17121
  text: Els tipus de gumi
- id: 17131
  text: >-
    Els blocs que formen la nau gumi

    són {:color #8080F080}materials gumi{:reset} i {:color #8080F080}deco-gumis{:reset}.

    Els {:color #8080F080}materials gumi{:reset} s'utilitzen per donar

    forma a la nau gumi i augmentar la seva VT,

    mentre els {:color #8080F080}deco-gumis{:reset} s'utilitzen per

    agregar varies funcions. {:color #F0F00080}Quan coloquis

    aquests gumis{:reset}, la teva nau estarà completa.


    {:color #00F0F080}- Pilotar la nau gumi{:reset}

    Es necessita un sol bloc perquè la teva

    nau gumi s'enlairi! I una nau gumi pot volar

    amb qualsevol forma, o sigui que a crear!

    Però asegura't de tenir suficient

    {:color #8080F080}VT{:reset} o la teva nau durara poc.
- id: 17321
  text: Gumi-impactes
- id: 17322
  text: >-
    Col・loca blocs gumi que danyen

    els objectius contra els que xoquen.
- id: 17579
  text: >-
    Quan col・loquis blocs a l'Editor,

    els gumis ja col・locats es veuran

    transparents.
- id: 17580
  text: >-
    Quan col・loquis blocs a l'Editor,

    els gumis ja col・locats es veuran

    translúcids.
- id: 17581
  text: >-
    Quan col・loquis blocs a l'Editor,

    els gumis ja col・locats es veuran

    opacs.
- id: 17582
  text: >-
    Els plànols de l'àrea de muntatge de l'Editor

    per veure la profunditat són quasi translúcids.
- id: 17583
  text: >-
    Els plànols de l'àrea de muntatge de l'Editor

    per veure la profunditat són mig translúcids.
- id: 17584
  text: >-
    Els plànols de l'àrea de muntatge de l'Editor

    per veure la profunditat són opacs.
- id: 17744
  text: Presa Raig
- id: 17746
  text: Precarrega Raig
- id: 17747
  text: >-
    Augmenta la velocitat amb què

    es completa l'indicador de Raig.
- id: 17749
  text: >-
    Carrega l'indicador de Raig perquè

    puguis utilitzar-lo a l'inici del viatge.
- id: 17750
  text: Multigumi
- id: 17751
  text: >-
    Els multigumi serveixen per col・locar

    molts materials gumi a la vegada.
- id: 18045
  text: '{:icon gumi-block}'
- id: 18046
  text: '{:icon gumi-blueprint}'
- id: 18047
  text: '{:icon gumi-brush}'
- id: 18048
  text: '{:icon gumi-ship}'
- id: 18049
  text: '{:icon gumi-gear}'
- id: 18319
  text: Rendiment
- id: 18321
  text: Nau
- id: 18322
  text: '{:width 90}Àrea de muntatge'
- id: 18482
  text: Nivells de missió 1 i 2 disponibles!
- id: 18483
  text: Nivell de missió 3 disponible!
- id: 18485
  text: Has obtingut una Corona Gumi!
- id: 18486
  text: 'Obtingut: {:unk0d }!'
- id: 18490
  text: >-
    {:width 98}El nivell de missió 1 són {:color #F0F00080}recerques de medalles{:reset}.

    Reuneix el número de medalles necessari!
- id: 18491
  text: >-
    {:width 98}El nivell de missió 2 són {:color #F0F00080}atacs enemics{:reset}.

    Destrueix el número de naus indicat!
- id: 18492
  text: >-
    {:width 98}El nivell de missió 3 són {:color #F0F00080}proves de puntuació{:reset}.

    Per dirigir la càmera, utilitza {:icon dynamic-l1} i {:icon dynamic-r1}!
- id: 18493
  text: 'Eines{:color #8080F080} ▸{:reset}'
- id: 18494
  text: Les eines d'edició
- id: 18495
  text: >-
    Existeixen altres eines a més de les

    utilitzades per col・locar blocs gumi.


    {:color #00F0F080}- Eines d'edició{:reset}

    Hi ha tres eines addicionals que

    s'utilitzen per fabricar naus: {:color #8080F080}Pinta{:reset},

    {:color #8080F080}Edita{:reset} i {:color #8080F080}Assigna habilitats{:reset}.


    {:color #00F0F080}- Dreceres{:reset}

    Unes altres dues ordres que et poden

    ajudar són {:color #8080F080}Defés{:reset} i {:color #8080F080}Refés{:reset}. Pots

    seleccionar-los en el menú, o prèmer {:icon dynamic-r1}

    per {:color #8080F080}Desfés{:reset} i {:icon dynamic-r2} per {:color #8080F080}Refés{:reset}.
