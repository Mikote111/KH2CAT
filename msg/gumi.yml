- id: 18578
  text: 4. Copia en mirall
- id: 18579
  text: Com fer una còpia en mirall
- id: 18580
  text: >-
    Copia el gumi seleccionat. Després, fes-li la

    volta i coloca'l de nou.


    {:color #8080F080}{:icon dynamic-dpad}{:reset}/{:icon dynamic-l1}{:icon dynamic-l2}: Moure cursor

    {:color #8080F080}{:icon dynamic-right-analog}{:reset}: Rotar càmera

    {:color #8080F080}{:icon dynamic-left-analog}{:reset}: {:width 95}Direcció gir{:width 100}

    {:icon dynamic-triangle}: Expandir àrea

    {:icon dynamic-triangle} dos cops: Confirmar àrea

    {:icon dynamic-cross}: Copia en mirall

    {:icon dynamic-circle}: Enrere


    {:color #00F0F080}- Fem una còpia en mirall!{:reset}

    La {:color #8080F080}còpia en mirall{:reset} es fa en una àrea seleccionada.

    Després de seleccionar-la, utilitza {:color #8080F080}{:icon dynamic-left-analog}{:reset}

    per {:color #F0F00080}seleccionar la direcció en què girarà{:reset}.

    Després, prem {:icon dynamic-cross} per copiar en mirall.
- id: 18582
  text: >-
    {:icon dynamic-cross}: Executa   {:icon dynamic-triangle}: Selecciona àrea

    {:icon dynamic-r1}: Desfés   {:icon dynamic-r2}: Refés

    {:color #8080F080}{:icon dynamic-right-analog}{:reset}: Càmera
- id: 18584
  text: >-
    Selecciona diversos materials gumi i

    reforma'ls perquè tinguin punta.


    {:color #8080F080}{:icon dynamic-dpad}{:reset}/{:icon dynamic-l1}{:icon dynamic-l2}: Moure cursor

    {:color #8080F080}{:icon dynamic-right-analog}{:reset}: Rotar càmera

    {:color #8080F080}{:icon dynamic-left-analog}{:reset}: {:width 90}Direcció punta{:width 100}

    {:icon dynamic-triangle}: Expandir àrea

    {:icon dynamic-triangle} dos cops: Confirmar àrea

    {:icon dynamic-cross}: Confirmar {:icon dynamic-circle}: Enrere

    {:icon dynamic-r1}: Desfer  {:icon dynamic-r2}: Refer


    {:color #00F0F080}- Agreguem una punta!{:reset}

    Pots {:color #8080F080}agregar una punta{:reset} en una àrea seleccionada.

    Després de confirmar l'àrea, amb 

    {:color #8080F080}{:icon dynamic-left-analog}{:reset} {:color #F0F00080}selecciona la direcció de la punta{:reset}. 

    Després prem {:icon dynamic-cross} per reformar-la.
- id: 18593
  text: 4. Col・loca ales
- id: 18594
  text: Col・loca gumis-ales
- id: 18633
  text: >-
    Pots canviar la posició dels gumis

    ja col・locats, o bé treure'ls.

    Hi ha varies coses que pots fer

    amb {:color #8080F080}Edita{:reset}.

    Canviar la posició d'un bloc gumi.

    Canviar la direcció d'un bloc gumi.

    Treure varis blocs gumi junts.


    {:color #00F0F080}- Si t'equivoques...{:reset}

    Si per error fas alguna cosa que no

    volies, com treure un grup de blocs

    gumi, prem {:icon dynamic-r1} o selecciona {:color #8080F080}Desfés{:reset}

    per {:color #F0F00080}cancel・la i refés{:reset}.
- id: 18684
  text: Quadern de consells
- id: 18685
  text: Vibració
- id: 18686
  text: Sí
- id: 18687
  text: No
