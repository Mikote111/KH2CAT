  text: >-
    {:icon dynamic-cross}: Confirma  {:icon dynamic-l1}{:icon dynamic-r1}: Canvia'n el color

    {:color #8080F080}{:icon dynamic-right-analog}{:reset}: Càmera  {:icon dynamic-circle}: Enrere
- id: 18760
  text: 'Altres ordres {:color #8080F080}▸{:reset}'
- id: 18761
  text: Altres ordres del menú
- id: 18762
  text: >-
    Hi ha quatre ordres que poden servir-te

    per editar la teva nau gumi:

    {:color #8080F080}Configuració{:reset}, {:color #8080F080}Canvi de mode{:reset}, {:color #8080F080}Guarda el plànol{:reset}

    i {:color #8080F080}Surt{:reset}.


    {:color #00F0F080}- Guarda el plànol i Surt{:reset}

    {:color #8080F080}Guarda plànol{:reset} i {:color #8080F080}Surt{:reset} són les dues

    ordres més importants per sortir

    del menú de l'Editor de naus gumi. Has

    d'aprendre a dirigir-los molt bé!


    {:color #00F0F080}- Ordres i dreceres{:reset}

    Pots canviar els modes d'edició

    per {:color #8080F080}materials gumi{:reset} i {:color #8080F080}deco-gumis{:reset}

    utilitzant {:icon dynamic-triangle} per {:color #8080F080}canvi de mode{:reset}.
- id: 18763
  text: >
    Pots desfer una edició i tornar al

    pas anterior. També pots tornar

    a l'últim pas.


    {:icon dynamic-r1}/{:color #8080F080}Desfés{:reset}: Torna al pas anterior

    {:icon dynamic-r2}/{:color #8080F080}Refés{:reset}: Torna a l'últim pas


    {:color #00F0F080}- Aprofita aquestes ordres!{:reset}

    És divertit editar amb {:icon dynamic-r1} i {:icon dynamic-r2},

    ja que pots corregir errades fàcilment

    o refer el que havies fet.

    Tot i així, la quantitat de cops que

    pots desfer els teus passos és limitada.

    És recomanable {:color #F0F00080}guardar els plànols

    originals{:reset} abans d'editar-los.
- id: 18765
  text: >-
    Pots alternar entre editar

    {:color #8080F080}materials gumi{:reset} i {:color #8080F080}deco-gumis{:reset}.

    I pots fer el mateix amb {:icon dynamic-triangle}.


    {:color #00F0F080}- Dos modes d'edició{:reset}

    En Mode d'edició, hi ha un mode

    per editar {:color #F0F00080}materials gumi{:reset}

    i l'altre per {:color #F0F00080}deco-gumis{:reset}.


    En {:color #8080F080}canviar modes{:reset}, podràs alternar

    les tres ordres que veus a dalt en el

    menú de l'Editor, i així podràs canviar

    els gumis editables.
- id: 18766
  text: >-
    Acabar una nau gumi i sortir

    de l'Editor.

    Selecciona {:color #8080F080}Guarda el plànol{:reset} per

    mantenir la forma de la nau.


    {:color #00F0F080}- Guarda sempre els plànols!{:reset}

    En sortir de l'Editor, l'ordre

    {:color #8080F080}Desfés{:reset} no tindrà efecte.

    Ves en compte en seleccionar {:color #8080F080}Surt{:reset}.
