    {:icon dynamic-cross}: Confirma   {:icon dynamic-square}: Treu

    {:color #8080F080}{:icon dynamic-l3}{:reset}: Rota gumi

    {:color #8080F080}{:icon dynamic-dpad}{:reset}: Fixa'n la posició
- id: 18541
  text: Paràmetres
- id: 18542
  text: Paràmetres de blocs gumi
- id: 18543
  text: >-
    Els blocs gumi tenen varis

    paràmetres que determinen la

    funcionalitat de la teva nau gumi.


    {:color #8080F080}VT{:reset} - Com més alta sigui la VT, la
      nau podrà resistir mals més alts.
    {:color #8080F080}Atac{:reset} - Representa el poder
      ofensiu de cada gumi.
    {:color #8080F080}Energia{:reset} - Com més alta sigui l'energia,
      major serà el poder ofensiu de la nau.
    {:color #8080F080}Velocitat{:reset} - Representa la velocitat
      de moviment de la nau gumi.
    {:color #8080F080}Movilitat{:reset} - Augmenta l'efectivitat
      de les tombarelles.
