- id: 18719
  text: 1. Moure gumis
- id: 18720
  text: Moure blocs gumi
- id: 18721
  text: >-
    Els gumis es poden moure i treure.


    {:color #8080F080}{:icon dynamic-dpad}{:reset}/{:icon dynamic-l1}{:icon dynamic-l2}: Moure cursor

    {:color #8080F080}{:icon dynamic-right-analog}{:reset}: Rotar càmera

    {:color #8080F080}{:icon dynamic-left-analog}{:reset}: Rotar gumi

    {:icon dynamic-triangle}: Expandir àrea  {:icon dynamic-triangle} dos cops: {:width 95}Confirmar{:width 100}

    {:icon dynamic-cross}: Subjectar/Col・locar gumi

    {:icon dynamic-square}: Treure {:icon dynamic-circle}: Enrere


    {:color #00F0F080}- Mou els blocs gumi!{:reset}

    Posa el cursor sobre el gumi que vols

    moure i prem {:icon dynamic-cross}. Després arrossega el

    cursor a la posició en què t'agradaria

    col・locar-lo. Rota i fixa el gumi amb {:color #8080F080}{:icon dynamic-left-analog}{:reset}.

    Selecciona la direcció en la que vols

    que apunti i prem {:icon dynamic-cross} per confirmar.
- id: 18752
  text: >-
    {:icon dynamic-cross}: Confirma  {:icon dynamic-square}: Obre paleta

    {:color #8080F080}{:icon dynamic-right-analog}{:reset}: Càmera  {:icon dynamic-circle}: Enrere
