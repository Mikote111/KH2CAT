- id: 18536
  text: Col・loquem els gumis!
- id: 18537
  text: Col・loca gumis Aero
- id: 18538
  text: >-
    A continuació, col・loca el gumi seleccionat.


    {:color #8080F080}{:icon dynamic-dpad}{:reset}/{:icon dynamic-l1}{:icon dynamic-l2}: Moure cursor

    {:color #8080F080}{:icon dynamic-right-analog}{:reset}: Rotar càmera

    {:color #8080F080}{:icon dynamic-left-analog}{:reset}: Rotar bloc

    {:icon dynamic-cross}: Confirmar  {:icon dynamic-square}: Treure  {:icon dynamic-circle}: Enrere


    {:color #00F0F080}- Coloquem els gumis!{:reset}

    Utilitza el cursor per seleccionar l'àrea

    on vols col・locar-hi el gumi.

    Utilitza {:color #8080F080}{:icon dynamic-left-analog}{:reset} per rotar

    el gumi en la direcció que desitgis.

    Prem {:icon dynamic-cross} per col・locar el gumi.


    Si comets un error, ubica el cursor sobre

    el gumi que vulguis treure i prem {:icon dynamic-square}.
- id: 18539
  text: >-
    Els gumis Aero i gumi-ales tenen un mode 

    de col・locació lleugerament diferent.


    {:color #00F0F080}- Fes voltes als gumis!{:reset}

    Els gumis Aero es poden fer voltar {:color #8080F080}prement {:icon dynamic-l3}{:reset}.


    {:color #00F0F080}- Canvia i col・loca els gumis!{:reset}

    Després de confirmar amb {:icon dynamic-cross},

    pots  utilitzar {:color #8080F080}{:icon dynamic-dpad}{:reset} per canviar

    la posició dels gumis.
