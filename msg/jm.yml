- id: 19156
  text: Donald/Fantasía
- id: 19157
  text: >-
    Desarrollo
     Cometa
       ⤷Lluvia de cometas

    Notas:

    Lluvia de cometas es un movimiento

    final que se ejecuta alrededor de Sora.

    Acércate al enemigo para asestar el

    máximo de golpes posibles.


    Sora puede moverse libremente durante

    este límite, así que mantente cerca de

    los enemigos y ¡al ataque!
- id: 19158
  text: Donald/Fulgor cegador
- id: 19159
  text: >-
    Desarrollo
     Fulgor
       ⤷Fulgor+
          ⤷Fulgor++

    Notas:

    con Fulgor atacas a los enemigos que

    tienes delante, pero no puedes fijar

    blanco al ser un ataque mágico.


    Con Fulgor+ lanzas cohetes al enemigo.

    Usa este ataque después de acumular

    varios cohetes.


    Puedes lanzar Fulgor++ contra un grupo

    de enemigos. Además de dañar al

    principal, harás que caigan los que

    le rodean. ¡Sora puede moverse

    libremente durante este límite, así que

    no te cortes y sigue atacando!
- id: 19162
  text: Goofy/Unidad
- id: 19163
  text: >-
    Desarrollo
     Golpe destructor
       ⤷Dúo mortífero
          ⤷Impulso cósmico

    Notas:

    el Golpe destructor dura poco,

    así que asesta tantos como puedas.


    El Dúo mortífero causa daños continuos

    y te acerca al enemigo.


    ¡Ejecuta los ataques rápidamente

    o el efecto del límite cesará!
- id: 19164
  text: Bestia/Luna aullante
- id: 19165
  text: >-
    Desarrollo
     Aullido doble
       ⤷Colmillo fiel/Alarido
          ⤷Aullido final

    Notas:

    con Alarido golpeas repetidamente, pero

    tiene alcance reducido.


    Colmillo fiel causa daño a enemigos

    cercanos con una onda sónica.


    Usa ambos ataques según

    convenga a la situación.
- id: 19166
  text: Auron/A tope
- id: 19167
  text: >-
    Desarrollo
     Bushido
       ⤷Estrella fugaz/Castigo místico
          ⤷Espiral

    Notas:

    alterna ataques entre Auron y Sora. Tras

    atacar Auron, el comando de Sora

    cambia. ¡Úsalo de inmediato!


    Este límite no permite moverse a Sora,

    ¡así que concéntrate en usar los comandos!
- id: 19168
  text: Mulán/Dragón de fuego
- id: 19169
  text: >-
    Desarrollo
     Cohete rojo
       ⤷Lanza ardiente/Lengua ígnea
          ⤷Meteoro carmesí

    Notas:

    si usas Lanza ardiente y continúas con

    Lengua ígnea, obtendrás un fantástico combo.


    Sora puede volar durante este límite.

    Para moverte hacia arriba y abajo, usa {:icon dynamic-right-analog-up}{:icon dynamic-right-analog-down}.
- id: 19170
  text: Aladdín/Truco fantástico
- id: 19171
  text: >-
    Desarrollo
     Raudo
       ⤷Jugada veloz
          ⤷Embaucador

    Notas:

    cuando uses Raudo y Jugada veloz,

    acércate al mayor número de enemigos

    posible, y los golpearás a todos.


    Tanto Aladdín como Sora pueden usar

    Jugada veloz, así que trata de alternar

    este ataque, y la batalla terminará rápido.
- id: 19172
  text: Jack/Ovación
- id: 19173
  text: >-
    Desarrollo
     ¡A bailar!
       ⤷Al compás/Sincronización
          ⤷Apoteosis

    Notas:

    Al compás y Sincronización atacan a

    enemigos que tengas delante, así que

    acércate a ellos para usar estos límites.


    Puedes conseguir muchos puntos por

    combos, ya que Sora puede moverse.
- id: 19174
  text: Jack Sparrow/Isla del tesoro
- id: 19175
  text: >-
    Desarrollo
     Farol
       ⤷Navaja/Sanguinario
          ⤷Trampa final

    Notas:

    Farol atrae a los enemigos hacia un lugar,

    y es muy útil en batallas contra grupos.


    Tras usar Navaja, Sora puede lanzar

    Sanguinario para ataques veloces.

    La clave para salir victorioso es

    alternar los ataques de Jack y de Sora.


    Este límite no permite moverse a Sora,

    ¡así que concéntrate en usar los comandos!
- id: 19176
  text: Simba/Orgullo del Rey
- id: 19177
  text: >-
    Desarrollo
     Furia felina
       ⤷Colmillo feroz/Garra voraz
          ⤷Rugido noble

    Notas:

    Colmillo feroz y Garra voraz son ataques

    rápidos que deben ejecutarse repetidamente

    en cuanto el límite comience.


    No dejes de lanzar estos ataques hasta

    que llegue el momento de ejecutar el

    movimiento final, Rugido noble.
- id: 19178
  text: Tron/Compilación completa
- id: 19179
  text: >-
    Desarrollo
     Configurar
       ⤷Código clúster/Pulso explosivo
          ⤷Reprogramar

    Notas:

    usa Pulso explosivo a corta distancia

    y Código clúster para enemigos lejanos.

    Utiliza Código clúster durante Pulso

    explosivo para más potencia.


    Reprogramar continúa la caza de

    enemigos tras acabar el límite.

    Con Parar se cancela el ataque.

    Sora puede moverse, ¡así que

    úsalo para repartir una buena

    cantidad de golpes!
- id: 19180
  text: Riku/Sesión eterna
- id: 19181
  text: >-
    Desarrollo
     Sesión
       ⤷Cañón oscuro/Sable extremo
          ⤷Maestro de Corazones/XIII aceros
             ⤷Armagedón

    Notas:

    Cañón oscuro y Sable extremo atacan

    a un solo objetivo y son útiles para

    derrotar a enemigos poderosos.


    Durante Maestro de Corazones y

    XIII aceros puedes moverte, ¡así que

    aprovecha para conseguir puntos!
- id: 19182
  text: Sora/Trío
- id: 19183
  text: >-
    Desarrollo
     Trío
       ⤷Súmmum/Artema/Fusión extrema
          ⤷Iniciar combo

    Notas:

    Tras seleccionar un ataque, Iniciar

    combo reemplazará al ataque elegido.

    Iniciar combo lanza el número total

    de golpes que dan los otros tres ataques.

    ¡Reserva Iniciar combo hasta haber

    asestado muchos golpes con los

    otros ataques!


    Puedes usarlo cuando Sora está solo,

    pero sus dos amigos no acudirán a ayudarle.
- id: 19184
  text: '{:width 85}Peter Pan/País de Nunca Jamás'
- id: 19185
  text: >-
    Desarrollo
     Pequeña hada/Chico volador

    Notas:

    ¡agarra al enemigo y lo lleva en volandas!


    Pequeña hada causa gran daño

    y arroja a los enemigos por los aires.


    Chico volador causa menos daño, pero

    lo hace de forma constante mientras

    arrastra a los enemigos. Usa el ataque

    apropiado de acuerdo con la situación.


    Sora puede volar durante este límite.

    Para moverte hacia arriba y abajo, usa {:icon dynamic-right-analog-up}{:icon dynamic-right-analog-down}.

    Selecciona Parar para terminar el límite.
- id: 19186
  text: Chicken Little/Primera persona
- id: 19187
  text: >-
    Desarrollo
     Bolas/Petardos

    Notas:

    puedes disparar en primera persona

    con Sora y Chicken Little en equipo. El

    movimiento de la cámara es la clave.


    Fija el blanco para lanzar las bolas.

    Si necesitas detener a un enemigo,

    puedes usar Petardos.


    Sora puede moverse durante este

    límite. Selecciona Parar para ponerle fin.
- id: 19188
  text: Stitch/¡Ohana!
- id: 19189
  text: >-
    Desarrollo
     Disparar/Ukelele
       ⤷Final

    Notas:

    el movimiento de la cámara es la clave

    de este ataque. Usa Disparar para atacar

    a un enemigo a la vista, y Ukelele para

    para atacar a todos.

    Sora no puede moverse durante el

    límite, ¡así que concéntrate en los

    comandos y en la cámara!
- id: 19190
  text: Genio valiente/Estocada sónica
- id: 19191
  text: >-
    Desarrollo
     Estocada
       ⤷Repetir

    Notas:

    con Estocada atacas continuamente a los

    enemigos que haya frente a ti. Para causar

    mayor daño, continúa usando Repetir.


    ¡Debes lanzar los ataques rápidamente

    o el efecto del límite cesará!
- id: 19194
  text: Goofy/Tornado fusión
- id: 19195
  text: >-
    Desarrollo
     Giro Goofy
       ⤷Giro Goofy+
          ⤷Giro Goofy++

    Notas:

    Giro Goofy y Giro Goofy+ lanzan muchos

    golpes, pero tienen alcance reducido.

    Tienes que acercarte al enemigo antes

    de atacar.


    Puedes moverte mientras ejecutas el

    Giro Goofy++, así que intenta

    atacar también a enemigos cercanos.


    ¡Ejecuta los ataques rápidamente

    o el efecto del límite cesará!
