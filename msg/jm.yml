    sensecor i ataca les Terres del Regne.
- id: 13021
  text: Encara no hi ha res!
- id: 13140
  text: >+
    El Coliseu està en ruïnes i Hèrcules

    ja no veu cap sentit a continuar lluitant. 

    Millor deixa que la Meg se n'encarregui.

- id: 13141
  text: –––
- id: 13142
  text: >+
    L'Hèrcules pensava que havia derrotat l'Hidra,

    però aparentment havia ressuscitat...

    i ara el Coliseu estava fet miques.

    Tot i que ens vam desfer de la criatura,

    l'Hèrcules va perdre les ganes de seguir

    lluitant. Ens tenia molt preocupats, però

    l'únic que podíem fer era confiar

    que la Meg se n'encarregaria.

- id: 13143
  text: >+
    L'Auron recupera la seva voluntat; i 

    els sentiments de l'Hèrcules per la Meg fan el fan

    recuperar les seves forces. Ha nascut una estrella!

- id: 13144
  text: –––
- id: 13145
  text: >+
    La porta connectava amb el passat.

    En Sora i els seus amics van impedir que en Pete

    canviés el passat i van salvar el castell.

- id: 13146
  text: –––
- id: 13147
  text: >+
    L'experiment del Doctor va resultar ser el

    lladre, que només volia un cor. Arreglat

    l'embolic, la Sally obre el seu cor al Jack.

- id: 13148
  text: –––
- id: 13149
  text: >+
    Vam recuperar el cor de l'Auron, i

    els sentiments de l'Hèrcules per la Meg

    el van fer recuperar les seves forces. Tots vam

    col・laborar per acabar amb l'Hades d'

    una vegada per totes, i la nostra valentia

    va ser recompensada amb una constel・lació

    que brillarà al cel nocturn

    per sempre.

- id: 13150
  text: >+
    La porta estava connectada amb el passat.

    La Malèfica i en Pete tenien la intenció de canviar el

    passat i apoderar-se del castell, però

    vam frustrar el seu pla malvat.

    La pau va tornar a regnar al Castell de

    Disney.

- id: 13151
  text: >+
    El pla va ser tot un èxit! Vam enxampar el

    lladre in fraganti...

    Resulta que era l'experiment del

    Doctor! Volia un cor per a ell, i

    per això en cercava entre els

    regals. Amb els primers flocs de neu,

    en Jack va rebre un regal valuós

    de la Sally, que li va obrir el cor.

- id: 13155
  text: >+
    Vam arribar a la fortalesa de l'enemic...

    el seu castell. La Kairi ha de ser

    dins.

- id: 13156
  text: >+
    Busca la Kairi!

- id: 13157
  text: >+
    En Sora, finalment, va trobar la Kairi. Vam derrotar el membre de

    l'Organització {XIII} que ens va atacar,

    però els sensecor van envoltar la Kairi.

- id: 13158
  text: >+
    Rescata la Kairi!

- id: 13159
  text: >+
    Al final, ens vam trobar amb la Kairi i en Riku.

    No obstant això, la batalla no havia acabat.

    El rei encara ens esperava.

- id: 13160
  text: >+
    Dirigeix-te al cim del castell!

- id: 13161
  text: >+
    La màquina de l'Ansem ha explotat, però no ha fet

    esvair per complet el Kingdom Hearts.

    Ara, en Xemnas ha de pagar per les seves maldats.

- id: 13162
  text: >+
    Derrota el poderós Xemnas!

- id: 13163
  text: >
    La porta al Kingdom Hearts ha aparegut

    i en Xemnas hi ha entrat. Vencerem...

    o serem aniquilats? La sort ja és feta.
- id: 13164
  text: Darrere la porta es troba la lluita final!
- id: 13165
  text: >+
    Ens dirigíem al castell quan un

    home vestit de negre es va interposar

    en el nostre camí. Brandava una clau

    espasa i es jactava d'haver

    derrotat en Riku... però només en Sora podia veure'l!

    ‛Digues-m'ho... «Digues-me per què t'hi ha triat, a tu»,

    va dir, i va desaparèixer tremendament

    contrariat després de ser derrotat per en

    Sora.

- id: 13166
  text: >+
    En Saïx, de l'Organització {XIII}, ens

    esperava al castell tenebrós. 

    Apuntant cap al que semblava una lluna, ens vam

    adonar que era el Regne

    dels Cors, el Kingdom Hearts! Devia haver absorbit

    molts cors per

    arribar a tals dimensions. «No ets d'utilitat per a l'

    Organització {XIII}»,

    se'n reia en Saïx, i va convocar a un gran nombre de

    sensecor.


    Va ser llavors quan vam sentir una veu que

    coneixíem: la Kairi! Però no hi havia temps

    per a celebracions, ja que els enemics seguien

    arribant. La Kairi no s'ho va pensar i

    va rescatar en Sora. Va rebre l'ajuda del

    fals Ansem: en Xehanort, aprenent de

    l'Ansem el Savi. En Sora

    no entenia res i, per rematar, en Xigbar, un altre membre

    de l'Organització {XIII}, l'havia anomenat

    Roxas. Ni tan sols la derrota d'en Xigbar

    va esclarir gens ni mica l'afligit Sora.

- id: 13167
  text: >+
    Finalment, en Sora va aconseguir

    travessar les hordes de sensecor fins a

    la Kairi. El sensecor d'en Xehanort va quedar-se

    observant el retrobament... era en Riku!

    En DiZ, que havia estat seguint la

    baralla, va revelar al rei la seva veritable

    identitat. Era el veritable Ansem

    el Savi; i l'incorpori d'en Xehanort, el

    seu aprenent, era en Xemnas, el líder de

    l'Organització {XIII}. Ja havíem derrotat

    el sensecor d'en Xehanort,

    que se'n feia dir «Ansem, el

    cercador de la foscor». Malgrat tot,

    després de la seva derrota, se sentia intrigat per la

    naturalesa del cor de Riku i va

    intentar atreure'l a la foscor. Tot i que en Riku

    no va sucumbir, va veure necessari l'ús del

    poder de la foscor. «En Riku va triar

    aquesta forma per poder utilitzar el poder

    de la foscor» Tothom estava

    d'acord amb les paraules d'en Sora:

    «Encara ets en Riku, passi el que passi!»

    Si era la lluita la que mantenia latent el poder

    de la foscor, havia arribat el

    moment de posar-hi fi d'una vegada per totes.

- id: 13168
  text: >+
    Després de desfer-nos d'en Luxord i en Saïx,

    vam descobrir la veritat sobre en Roxas

    : no era sinó l'incorpori d'en Sora!

    En Xemnas el va enganyar i el va fer

    membre de l'Organització {XIII}, però

    el seu afany de conèixer en Sora el

    va allunyar del grup. Quan

    en Sora va dir amb pesar que li hagués

    agradat conèixer-lo, en Riku li va

    dir que era dins el seu

    propi cor. Mentrestant, el rei i

    l'Ansem el Savi van intentar utilitzar un

    artefacte per aturar el Kingdom Hearts,

    però va començar a fallar. Semblava no haver-hi

    res capaç de contenir-hi el

    poder dels cors acumulats...

     Finalment, l'Ansem va entendre la

    veritable naturalesa del cor

    humà i va decidir escoltar el seu.

    Va acceptar el seu destí i va agafar

    l'artefacte, que s'havia descontrolat i

    estava a punt d'esclatar. L'explosió va

    escampar els cors acumulats al

    Kingdom Hearts i va precipitar-los tots

    sobre nostre. Quan la «pluja de

    cors» va cessar, va resultar que en Riku havia

    recuperat la seva aparença original.

- id: 13169
  text: >+
    La Malèfica i en Pete van obrir el

    camí cap a la batalla definitiva. 

    Ells també havien decidit escoltar els seus

    cors i res no els podia fer

    canviar d'opinió. Ens vam posar

    en marxa tots plegats per lluitar contra en Xemnas.

    Acorralat, va extreure el poder del Kingdom

    Hearts i va desaparèixer. No podíem

    deixar-lo escapar pel bé de tots els

    mons! Enmig d'una resplendor brillant, una porta

    va aparèixer davant nostre.

    ‛Els mons ens han donat aquesta porta.

    «Volen que siguem els guardians del

    seu destí», exclamava el rei. Amb

    el cor ple de coratge,

    ens enfrontem a la batalla definitiva juntament amb

    tots els nostres estimats amics.

- id: 13897
  text: El rei Mickey
- id: 13898
  text: >-
    És el rei Mickey, però de quan

    treballava al vapor d'en Pete.


    Hi ha una cosa que no ha canviat: Sa

    Majestat era tan valent al

    passat com n'és ara, al present.
- id: 13903
  text: Xaldin
- id: 13904
  text: >-
    El núm. {III} de l'Organització {XIII}.

    Volia apoderar-se del sensecor

    i l'incorpori de la Bèstia per

    aconseguir el Kingdom Hearts.


    Malgrat tot, al final, en Sora

    i els seus amics el van vèncer.
- id: 13931
  text: Malèfica
- id: 13932
  text: >-
    Aquesta bruixa de poders terrorífics

    està controlant els sensecor

    com a part del seu pla per

    dominar tots els mons.


    En Nyek, la Poll i en Puça són precisament

    el que necessita per molestar en

    Sora i els seus amics

    mentre són a Vila Halloween.
- id: 13943
  text: Tron
- id: 13944
  text: >-
    Un programa de seguretat

    millorat i actualitzat per l'Ansem

    el Savi, que també va reprogramar

    el PCM. En Tron es dedica a garantir

    que el sistema funcioni correctament

    mentre el PCM vol arrabassar el

    control als usuaris.


    Només l'Ansem sap per què aquests dos

    programes es comporten de manera

    tan diferent.
