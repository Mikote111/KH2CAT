- id: 19372
  text: Sora
- id: 19373
  text: >-
    El héroe elegido por la llave espada,

    no hace mucho tiempo

    salvador de todos los mundos.


    Ha estado sumido en un profundo

    sueño, en una misteriosa mansión,

    con sus amigos Donald y Goofy.


    Parece que ha crecido un poco

    mientras estaba durmiendo.
- id: 19377
  text: Prueba una vez.
- id: 19378
  text: Vuelve a intentarlo.
