- id: 10449
  text: Primer dia
- id: 10450
  text: >-
    Gairebé s'han acabat les vacances d'estiu.

    Per no deprimir-nos, el Hayner ha

    suggerit fer un viatget a la platja.
- id: 10451
  text: Segueix el Pence a fora!
- id: 10452
  text: >-
    Quan vaig tornar al lloc de sempre, vaig

    trobar una nota del Hayner. Volia veure'ns a

    l'estació. Al final anàvem a anar a la platja?
- id: 10453
  text: Dirigeix-te a l'estació!
- id: 10454
  text: >-
    El torneig d'Struggle es celebra avui

    en el solar esportiu.
- id: 10455
  text: Ves al solar com abans millor!
- id: 10456
  text: >-
    Les vacances eren a punt de cloure. Vam

    deciri investigar les Set Meravelles de Vila

    Crepuscle per a la redacció de l'escola.
- id: 10457
  text: Ves a l'estació i puja al tren!
- id: 10458
  text: >-
    M'he passat pel lloc de sempre, però

    ha sigut com si els meus amics no em viessin.

    Ni tan sols podia tocar-los!
- id: 10459
  text: Segueix el Hayner!
- id: 10460
  text: >-
    El Sora i els seus amics han despertat en una

    estranya i vella mansió. Han dormit molt de

    temps... i a sobre han perdut els seus records!
- id: 10461
  text: Fes un cop d'ull fora!
- id: 10462
  text: >-
    Ens dirigim a la ciutat. Tot i que era el

    primer cop que el Sora era allà, el lloc

    li resultava estranyament familiar.
- id: 10463
  text: Entra per la reixa!
- id: 10464
  text: >-
    Uns xavals que ens hem trobat

    a la ciutat ens han dit que el rei

    ens estava buscant.
- id: 10465
  text: Ves a l'estació per veure el rei!
- id: 10466
  text: >-
    Per fi hem aconseguit reunir-nos amb el rei!

    Ha dit al Sora que pugés al tren i li ha donat

    alguns calés per als bitllets.
- id: 10467
  text: Compra els bitllets!
- id: 10468
  text: >-
    Si el rei ha escapat de la foscor, el Riku

    segur que també! Amb els cors plens

    d'esperança, partim de nou a l'aventura.
- id: 10469
  text: Puja al tren!
- id: 10470
  text: >-
    Pugem al tren i arribem a una

    torre fantàstica.
- id: 10471
  text: Cap a la torre!
- id: 10472
  text: >-
    Segons el Pete, que se suposava que havia

    d'estar desterrat a una altra dimensió, la

    torre era la llar del mentor del rei.
- id: 10473
  text: Puja al capdamunt de la torre!
- id: 10474
  text: >-
    El mestre Yen Sid, mentor del rei, ens ha dit

    que el Sora es la clau que connecta el Riku

    amb el viatge que ens aguardaba.
- id: 10475
  text: Llegeix el llibre i parla amb el Yen Sid!
- id: 10476
  text: >-
    El mestre ens ha parlat dels nostres nous

    enemics, els incorporis. Necessitem canviar

    la nostra roba per una de nova i preparar-nos

    per la batalla.
- id: 10477
  text: Ves al vestidor!
- id: 10478
  text: >-
    Les tres fades, expertes cosidores,

    ens esperaven en el vestidor.
- id: 10479
  text: Parla amb les fades!
- id: 10480
  text: >-
    Amb la nova roba del Sora, ja estem

    a punt per partir. Però sembla que el mestre

    Yen Sid té una petita cosa per a nosaltres.
- id: 10481
  text: Troba el mestre Yen Sid!
- id: 10482
  text: >-
    Els mons han preparat noves rutes per a

    nosaltres, i obrirem les portes a mesura

    que avancem. Comença la nostra aventura...
- id: 10483
  text: Enlaira't cap al següent món!
- id: 10488
  text: >-
    Quan vam arribar a Vila Crepuscle, ens

    vam trobar amb el Vivi, que anava buscant

    ajuda. Alguna cosa passava al solar esportiu.
- id: 10489
  text: Afanya't, ves al quadrilàter!
- id: 10490
  text: >-
    L'Organització {XIII} es va retirar i el Seifer

    va ser rescatat, però ara sembla que

    és la Kairi qui té problemes.
- id: 10491
  text: Ves a l'estació!
- id: 10492
  text: >-
    La caixa que vam trobar en el Regne de la

    Foscor contenia una foto de la vella

    mansió de Vila Crepuscle. Que rar...
- id: 10493
  text: Ves a la vella mansió
- id: 10494
  text: >-
    Si hi ha dos objectes únics en aquest

    món, vol dir que hi ha dues Vila

    Crepuscle. Serà la Kairi a l'altra?
- id: 10495
  text: Entra a la vella mansió!
- id: 10496
  text: >-
    Segons el rei, l'ordinador de la vella

    mansió podria estar connectat amb

    l'altra Vila Crepuscle.
- id: 10497
  text: Busca l'ordinador!
- id: 10498
  text: >-
    Vam trobar l'ordinador, però

    no funciona sense la contrasenya.

    Alguna idea de quina podria ser?
- id: 10499
  text: Intenta recordar el sabor del gelat!
- id: 10500
  text: >-
    En introduir la contrasenya, el dispositiu

    es va activar, llançant un raig de llum.

    Serà el camí cap a l'altra Vila Crepuscle?
- id: 10501
  text: Toca el raig!
- id: 10502
  text: >-
    Vam arribar a l'altra Vila Crepuscle, aquella

    on hi vivia el Roxas. Deu haver una porta

    al Regne de la Foscor en algun lloc.
- id: 10503
  text: Busca una entrada a la foscor!
- id: 10504
  text: >
    Un cop més, tornem a Baluard Balmat.

    Les coses han canviat, però els sensecor

    segueixen es passegen com de costum.
- id: 10505
  text: >+
    Fes un volt per la ciutat!

- id: 10506
  text: >+
    El Sora i els seus amics s'alegren de

    veure la Yuffie. Tots els altres els

    esperen a casa del Merlí.

- id: 10507
  text: >+
    Ves a casa del Merlí!

- id: 10508
  text: >+
    Léon i la colla intenten reconstruir

    la ciutat. El Sora i els seus amics prometen

    ajudar. El Léon els ha d'ensenyar una cosa.

- id: 10509
  text: >+
    Ves al pati interior!

- id: 10510
  text: >+
    De sobte, apareix l'Organització {XIII}, que

    ens desconcerta amb estranyes paraules.

    La clau espasa ens obre el camí a altres mons.

- id: 10511
  text: >+
    Enlaira't cap al següent món!

- id: 10512
  text: >+
    Guiats pel Merlí, el grup torna

    a Baluard Balmat, on els mostra

    el llibre del Pooh.

- id: 10513
  text: >+
    Entra al llibre!

- id: 10514
  text: >+
    Els sensecor han arrencat algunes

    pàgines del llibre, i el Pooh ha perdut la

    memòria. Troba les pàgines perdudes!

- id: 10515
  text: >+
    Reuneix les pàgines arrencades!

- id: 10516
  text: >+
    Han aparegut espines al Castell Disney.

    Potser el Merlí té alguna idea sobre

    què està passant.

- id: 10517
  text: >+
    Ves a veure el Merlí!

- id: 10518
  text: >+
    El Merlí ens explica com salvar el Castell

    Disney. Ha arribat el moment que el Sora

    i els seus amics actuïn!

- id: 10519
  text: –––
- id: 10520
  text: >+
    El Sora i els seus amics han aconseguit

    salvar el Castell Disney del perill.

- id: 10521
  text: >+
    Enlaira't cap al següent món!

- id: 10522
  text: >+
    La tornada a Baluard Balmat no és grata.

    Els sensecor i els incorporis són a tot

    arreu. S'haurà de parlar amb el Léon.

- id: 10523
  text: >+
    Ves a casa del Merlí!

- id: 10524
  text: >+
    El Sora i els seus amics descobreixen que hi ha un

    ordinador que l'Ansem solia utilitzar. La sala dels

    ordinadors és en algun lloc del porticó.

- id: 10525
  text: >+
    Ves al porticó!

- id: 10526
  text: >+
    Segons l'Aerith, el rei és amb el Léon!

    S'ha de trobar aquell ordinador sense

    perdre ni un segon més!

- id: 10527
  text: >+
    Ves pels passadissos subterranis!

- id: 10528
  text: >+
    Arribem a l'estudi de l'Ansem, però

    no hi és ni el rei, ni cap ordinador.

    Aleshores, el Léon apareix.

- id: 10529
  text: >+
    Pregunta al Léon què passa!

- id: 10530
  text: >+
    El Léon toqueja la paret de l'estudi i

    descobreix un interruptor que obre la

    porta a la sala d'ordinadors.

- id: 10531
  text: >+
    Entra a la sala d'ordinadors!

- id: 10532
  text: >+
    Un dispositiu s'activa quan el Sora i el

    Donald es posen a remenar l'ordinador,

    enviant-los a un món desconegut.

- id: 10533
  text: –––
- id: 10538
  text: >+
    Tornem del món de l'ordinador. Per

    accedir a les dades de les investigacions,

    necessitem la contrasenya de l'Ansem.

- id: 10539
  text: >+
    Esbrina la contrasenya de l'Ansem!

- id: 10540
  text: >+
    Per fi ens reunim amb el rei!

    Gràcies als escrits a la paret de

    l'estudi, el Sora esbrina la contrasenya.

- id: 10541
  text: >+
    Ves a donar la contrasenya al Tron!

- id: 10542
  text: >+
    El grup torna al món de l'ordinador

    per complir la promesa que han fet

    al Tron.

- id: 10543
  text: >+
    Ves amb el Tron a l'entorn de dades!

- id: 10546
  text: >+
    El Sora i els seus amics tornen sans i

    estalvis a Baluard Balmat. Gràcies al Tron,

    ja es pot accedir a les dades del DTD.

- id: 10547
  text: >+
    Utilitza l'ordinador!

- id: 10548
  text: >+
    Les sorpreses i decepcions que troben

    a la informació del DTD aclaparen a tots.

    Una sobtada tremolor sacseja la cambra.

- id: 10549
  text: >+
    Comprova què passa a fora!

- id: 10550
  text: >+
    A fora, els sensecor i els incorporis

    envaïen la ciutat. El Léon i els seus

    amics podrien estar en perill.

- id: 10551
  text: >+
    Ves de pressa a la zona residencial!

- id: 10552
  text: >+
    El Léon i els altres lluiten contra els

    sensecor i els incorporis. El Sora i

    els seus amics van a pel rei.

- id: 10553
  text: >+
    Ves al pati interior!

- id: 10554
  text: >+
    El Gran Congost de la vall ha estat

    presa per les hordes enemigues.

    Uniu forces i derroteu-los!

- id: 10555
  text: >+
    Obre't pas cap al Gran Congost!

- id: 10556
  text: >+
    L'Organització {XIII} busca vèncer els

    sensecor amb la clau espasa. Sembla que 

    la batalla s'ha acabat... per ara.

- id: 10557
  text: –––
- id: 10558
  text: >+
    La batalla a Baluard Balmat ha acabat,

    per ara, però, com deu estar la ciutat?

- id: 10559
  text: >+
    Dirigeix-te al Baluard Balmat!

- id: 10560
  text: >+
    Es suposava que la ciutat hauria d'estar

    en pau, però alguna cosas rara li passa.

    Serà millor anar a veure el Léon.

- id: 10561
  text: >+
    Ves a casa el Merlí!

- id: 10562
  text: >+
    El PCM va piratejar el sistema informàtic i va

    enviar infinitat de sensecor a la ciutat. El Sora

    i els seus amics decideixen anar a veure el Tron.

- id: 10563
  text: >+
    Ves a l'estudi de l'Ansem!

- id: 10564
  text: >+
    El programa d'Erradicació del PCM

    gairebé està enllestit. El Léon demana al Sora

    que vagi a la Torre I/O amb el Tron i esperi.

- id: 10565
  text: >+
    Accedeix a l'ordinador!

- id: 10566
  text: >+
    El Tron obsequia tots amb una visió de com

    era la ciutat en el passat. En aquell instant,

    tots recorden com es solia dir.

- id: 10567
  text: –––
- id: 10572
  text: >+
    La Bèstia es comporta d'una manera

    estranya quan el Sora i els altres

    arriben al castell. Què li deu passar?

- id: 10573
  text: >+
    Fes un cop d'ull pel castell!

- id: 10574
  text: >+
    Hi ha algú al capdamunt de les escales.

    Serà la Bella? S'ha de parlar amb ella

    i esbrinar què està passant.

- id: 10575
  text: >+
    La Bella hauria de ser aquí. Troba-la!

- id: 10576
  text: >+
    La Bèstia ha tancat els seus servents

    a la masmorra. Dirigeix-te a l'ala oest

    per trobar-ne l'entrada.

- id: 10577
  text: >+
    Ves a l'ala oest!

- id: 10578
  text: >+
    Hi ha d'haver una entrada a la

    masmorra en algun lloc de l'ala

    oest...

- id: 10579
  text: >+
    Busca l'entrada al soterrani!

- id: 10580
  text: >+
    L'armari davant la porta del soterrani

    no s'aparta. Hi ha d'haver alguna

    manera de entrar-hi.

- id: 10581
  text: >+
    Aparta l'armari de la porta!

- id: 10582
  text: >+
    L'armari és una persona encisada!

    I la Bèstia també! Rescata els altres

    abans de sentir la resta de la història.

- id: 10583
  text: >+
    Ves a la masmorra!

- id: 10584
  text: >+
    Després de derrotar la porta,

    el grup troba els servents encisats

    que eren atrapats a la masmorra.

- id: 10585
  text: >+
    Segueix els servents!

- id: 10586
  text: >+
    El comportament de la Bèstia sembla

    causat pels sensecor. Un passadís

    secret duu a la seva cambra.

- id: 10587
  text: >+
    Utilitza el passadís per buscar la Bèstia!

- id: 10588
  text: >+
    El passadís té truc!

    Encèn tots els fanals del passadís

    per obrir la porta secreta.

- id: 10589
  text: Treballa en equip i encèn els fanals!
- id: 10590
  text: >+
    Gràcies a l'ajuda de tots,

    la porta secreta és oberta.

- id: 10591
  text: >+
    Ves a l'habitació de la Bèstia!

- id: 10592
  text: >+
    És el Xaldin, de l'Organització {XIII}!

    La Bèstia està preocupada per la

    manera en què ha tractat la Bella.

- id: 10593
  text: >+
    Ves amb la Bèstia a veure la Bella!

- id: 10594
  text: >+
    La Bèstia va a l'habitació de la Bella,

    però no la troba allà. Se n'ha anat

    rere un misteriós individu.

- id: 10595
  text: >+
    Busca la Bella!

- id: 10596
  text: >+
    En explorar el castell, el Sora i els

    altres senten la veu de la Bella que

    demana ajuda des del saló de ball.

- id: 10597
  text: >+
    Corre al saló de ball i ajuda la Bella!

- id: 10598
  text: >+
    La Bèstia rescata la Bella i es disculpa.

    S'apropen l'un a l'altre, però

    l'encanteri segueix sense trencar-se.

- id: 10599
  text: –––
- id: 10600
  text: >+
    El Sora i els seus amics tornen al castell.

    Tot sembla en ordre, però la Bèstia

    està molt inquieta.

- id: 10601
  text: >+
    Parla amb la Bèstia!

- id: 10602
  text: >+
    El Xaldin interromp el ball per dir

    que ha robat una cosa "molt preada". 

    La Bèstia corre a la seva cambra.

- id: 10603
  text: >+
    A l'habitació de la Bèstia!

- id: 10604
  text: >+
    S'ha endut la rosa! I amb això,

    la Bèstia ha perdut tota esperança i

    les ganes de lluitar. Què s'hi pot fer?

- id: 10605
  text: >+
    Anima la Bèstia!

- id: 10606
  text: >+
    El Sora i els seus animen la Bèstia

    i tots surten en cerca de la rosa.

- id: 10607
  text: >+
    Busca la rosa amb la Bèstia!

- id: 10608
  text: >+
    El Xaldin anava rere la Bèstia per aconseguir

    el Kingdom Hearts, el Regne dels

    Cors. Que no escapi!

- id: 10609
  text: >+
    Surt fora i persegueix el Xaldin!

- id: 10610
  text: >+
    La rosa ha estat recuperada i la Bèstia ha

    descobert què és el que més apreua.

    Es trencarà ara l'encanteri?

- id: 10611
  text: –––
- id: 10612
  text: >+
    El Sora i els seus amics arriben a les

    afores del Coliseu. Allà veuen com uns

    sensecor assetgen una dona.

- id: 10613
  text: >+
    Ajuda la dona!

- id: 10614
  text: >+
    La Megara anava a veure l'Hades per demanar-li

    que donés un respir a l'Hèrcules. El Sora i els

    altres s'ofereixen per anar-hi en el seu lloc.

- id: 10615
  text: >+
    Ves a l'Inframon i parla amb l'Hades!

- id: 10616
  text: >+
    Auron rebutja l'oferta de l'Hades. El Sora,

    debilitat per la maledicció de l'Inframon,

    coopera amb l'Auron per escapar.

- id: 10617
  text: >+
    Escapa de l'Inframon!

- id: 10618
  text: >+
    El Sora i els altres eviten el Cèrber

    i escapen de l'Inframon, però, on

    és l'Auron? S'ha de buscar la Meg.

- id: 10619
  text: >+
    Reuneix-te amb la Meg en el Coliseu!

- id: 10620
  text: >+
    Mentre l'Hèrcules busca la Pedra de

    l'Olimp per neutralitzar la maledicció

    de l'Inframon, el grup s'ha d'entrenar.

- id: 10621
  text: >+
    Ves a veure el Fil!

- id: 10622
  text: >+
    El Fil segueix tan vivaç com sempre.

    Sembla que el Sora i els altres poden

    començar a entrenar quan vulguin.

- id: 10623
  text: >+
    Completa el teu entrenament!

- id: 10624
  text: >+
    El Sora i els seus amics completen el seu

    entrenament. En aquell moment, hi arriba

    l'Hèrcules, abstret en els seus pensaments.

- id: 10625
  text: >+
    Parla amb l'Hèrcules!

- id: 10626
  text: >+
    La Pedra de l'Olimp ha estat robada...

    i l'Hades ha raptat la Meg! El grup

    s'encamina cap a l'Inframon.

- id: 10627
  text: >+
    Rescata la Meg a l'Inframon!

- id: 10628
  text: >
    El Fil era a l'entrada de l'Inframon

    quan un individu de negre el va atacar.

    S'enduria ell la Pedra de l'Olimp?
- id: 10629
  text: >+
    Segueix l'individu de la túnica negra!

- id: 10630
  text: >+
    El Sora i els seus amics no poden fer

    res contra la maledicció. Necessiten la

    Pedra de l'Olimp com abans millor.

- id: 10631
  text: >+
    Ves a per l'home de negre!

- id: 10632
  text: >+
    Derroten el membre de l'Organització {XIII}

    i recuperen la pedra. Alliberats de la

    maledicció, van a ajudar la Meg.

- id: 10633
  text: >+
    Endinsa't en l'Inframon!

- id: 10634
  text: >+
    El Sora i els seus amics obren el pany

    per rescatar la Meg, però se topen amb

    una porta cap a... algun lloc.

- id: 10635
  text: >+
    Rescata la Meg!

- id: 10636
  text: >+
    L'Hèrcules arriba a temps per rescatar

    la Meg. Deu estar esgotat! No podem

    deixar-lo sol en aquell estat.

- id: 10637
  text: >+
    Torna i ajuda l'Hèrcules!

- id: 10638
  text: >+
    El Sora i l'Hèrcules derroten el Pete, però l'Hades

    deixa caure amb el seu peculiar estil que potser la

    Hidra va "jugant" pel Coliseu.

- id: 10639
  text: >+
    Torna al Coliseu!

- id: 10640
  text: >+
    Alguna cosa ingent i misteriosa ha

    aparegut a l'entrada a l'Inframon.

- id: 10641
  text: >+
    Què està passant a l'Inframon?

- id: 10642
  text: >+
    L'Infernòdrom ha aparegut del

    no-res i s'hi estan celebrant

    tot tipus de combats.

- id: 10643
  text: >+
    Participa en el torneig!

- id: 10644
  text: >+
    L'Hades anuncia que la Copa Hades

    es celebrarà a l'Infernòdrom. El Sora

    i l'Hèrcules hi decideixen participar.

- id: 10645
  text: >+
    Participa a la Copa Hades!

- id: 10646
  text: >+
    L'Hades anuncia que la Copa Hades

    es celebrarà a l'Infernòdrom. El Sora

    i l'Hércules hi decideixen participar.

- id: 10647
  text: >+
    Participa a la Copa Hades!

- id: 10648
  text: >+
    Pot ser que hagin d'enfrontar-se a

    l'Auron si arriben a les finals, però

    l'Hèrcules no es veu capaç de conseguir-lo.

- id: 10649
  text: >+
    Participa a la primera ronda!

- id: 10650
  text: >+
    A pesar de sortir-ne victoriós, l'Hèrcules

    segueix deprimit. Ara venen les

    semifinals.

- id: 10651
  text: >+
    Participa a les semifinals!

- id: 10652
  text: >+
    Després de classificar-se per a la final, el grup

    veu l'Auron, però sembla estar una mica

    estrany, i s'endinsa en l'Inframon.

- id: 10653
  text: >+
    Segueix l'Auron!

- id: 10654
  text: >+
    L'Hades estava controlant l'Auron.

    El Sora i els seus amics el segueixen fora

    de l'Inframon, atès que volen ajudar-lo.

- id: 10655
  text: >+
    Parla amb l'Auron!

- id: 10656
  text: >+
    Mentre l'Hèrcules combat a la ronda

    final, el Sora i els seus busquen el

    ninot que controla l'Auron.

- id: 10657
  text: >+
    Ves a l'Inframon i recupera el ninot!

- id: 10658
  text: >+
    El ninot contenia la voluntat de l'Auron.

    En veure el seu passat, vam comprendre el

    per què de la seva força. Se l'hi ha de tornar!

- id: 10659
  text: >+
    Dirigeix-te a l'Infernòdrom!

- id: 10660
  text: >+
    El grup es troba amb el Iago, antic

    lacai del malvat Jafar. Jura que ha

    canviat, així que se l'enduen a palau.

- id: 10661
  text: >+
    Ves al palau!

- id: 10662
  text: >+
    Al palau, la Jasmín es sorprèn i preocupa

    per la presència del Iago. El Sora i els altres

    van a la ciutat per parlar amb l'Aladdín.

- id: 10663
  text: >+
    Torna a la ciutat per veure l'Aladdín!

- id: 10664
  text: >+
    Per la ciutat, senten un mercader

    que crida: "Atura't, lladre!", mentre

    persegueix l'Abú i l'Aladdín. Què passa?

- id: 10665
  text: >+
    Segueix l'Aladdín!

- id: 10666
  text: >+
    L'Abú ha robat una de les llànties del

    mercader. L'Aladdín se la torna, però

    resulta que és la que contè el Jafar!

- id: 10667
  text: >+
    Recupera la llàntia a la botiga!

- id: 10668
  text: >+
    El Sora i els seus amics intenten comprar

    la llàntia al mercader, però aquest en

    demana a canvi un tresor digne d'un sultà.

- id: 10669
  text: >+
    Parla amb l'Aladdín fora de la botiga!

- id: 10670
  text: >+
    No poden disposar del tresor real per

    comprar una miserable llàntia. El Iago sugereix

    cercar alguna cosa a la Cova de les Meravelles.

- id: 10671
  text: >+
    Ves a la Cova de las Meravelles!

- id: 10672
  text: >+
    El Sora i companyia arriben a la cova,

    antic sojorn de la llàntia màgica,

    per buscar un tresor.

- id: 10673
  text: >+
    Endinsa't a la Cova de les Meravelles!

- id: 10674
  text: >+
    Consegueixen desactivar la trampa de

    la Cova de les Meravelles i continuen.

- id: 10675
  text: >+
    Endinsa't a la cova!

- id: 10676
  text: >+
    Un cop superada la prova,

    apareix una escala davant d'ells.

- id: 10677
  text: >+
    Llegeix la inscripció!

- id: 10678
  text: >+
    La porta s'ha obert!

- id: 10679
  text: >+
    A què esperes? Endavant!

- id: 10680
  text: >+
    El Sora i els seus amics porten un tresor

    de la Cova de les Meravelles, però la

    botiga és buida. Què passa?

- id: 10681
  text: >+
    Esbrina què està passant fora!

- id: 10682
  text: >+
    Pete persegueix el mercader i intenta

    arrabassar-li la llàntia màgica. Ambdós

    corren cap al palau.

- id: 10683
  text: >+
    Segueix-los fins al palau!

- id: 10684
  text: >+
    El Sora i companyia recuperen la llàntia

    màgica i la clouen a l'interior del palau.

    Al final, el Iago no va resultar ser tan dolent...

- id: 10685
  text: –––
- id: 10686
  text: >+
    Amb la llàntia closa, Agrabah torna

    a estar fora de perill. Què estaran

    fent ara tots?

- id: 10687
  text: >+
    Cap a Agrabah!

- id: 10688
  text: >+
    El Jafar ha tornat! El mercader el va

    alliberar de la llàntia. El Iago diu que

    és a les Ruïnes Enterrades.

- id: 10689
  text: >+
    Segueix el Iago!

- id: 10690
  text: >+
    La màgia del Geni permet al Sora i els seus

    amics atravessar una tempesta de sorra

    quan es dirigeixen cap a les ruïnes.

- id: 10691
  text: >+
    ¡Atraviesa el desierto y llega a las ruinas!

- id: 10692
  text: >+
    Las ruinas están desiertas. ¡Es una trampa!

    Sora y compañía escapan y vuelven deprisa

    al palacio, el verdadero objetivo de Yafar.

- id: 10693
  text: >+
    ¡Aprisa, al palacio! ¡Y a por Yafar!

- id: 10694
  text: >+
    Nuestros héroes han derrotado al gigante

    Yafar, y Genio ha devuelto la maltrecha

    ciudad a su estado habitual.

- id: 10695
  text: –––
- id: 10696
  text: >2+


- id: 10697
  text: >2+


- id: 10698
  text: >+
    La sombra resulta ser Mushu. Sora conoce

    a Mulán, que pretende hacerse pasar por un

    hombre para alistarse en el ejército.

- id: 10699
  text: >+
    ¡Ve al campamento y alístate!

- id: 10700
  text: >+
    Ping no es aceptado en el ejército.

    Tiene que realizar las misiones del

    Capitán para probar su valía.

- id: 10701
  text: >+
    ¡Completa las misiones del Capitán!

- id: 10702
  text: >+
    Ping se emplea a fondo en las misiones

    y se hace mucho más fuerte. Recibe

    un nuevo encargo del Capitán.

- id: 10703
  text: >+
    ¡Dirígete al sendero de montaña!

- id: 10704
  text: >
    Aceptan a Ping en el ejército, pero tiene que

    ganarse el respeto de los demás. Va tras un

    individuo sospechoso hasta una cueva.
- id: 10705
  text: >+
    ¡Dirígete a la cueva cercana a la aldea!

- id: 10706
  text: >+
    En el interior de la cueva aguardaban

    infinidad de sincorazón, pero Ping y

    el grupo los derrotaron sin problemas.

- id: 10707
  text: >+
    ¡Cuenta al Capitán lo sucedido!

- id: 10708
  text: >+
    El ejército de Shan Yu ha destruido la aldea y

    sus tropas. El grupo se dirige hacia la cumbre

    para enfrentarse a los hunos.

- id: 10709
  text: >+
    ¡Sigue a Shan Yu hasta la cumbre!

- id: 10710
  text: >+
    Ping consigue derrotar a Shan Yu y los suyos,

    pero su farsa se descubre y la expulsan.

    Sora decide acompañarla de vuelta a casa.

- id: 10711
  text: >+
    ¡Desciende de la montaña!

- id: 10712
  text: >+
    Shan Yu se dirige hacia la

    Ciudad Imperial. ¡Hay que alertar

    al Emperador cuanto antes!

- id: 10713
  text: >+
    ¡Ve a la Ciudad Imperial!

- id: 10714
  text: >+
    Shan Yu ha entrado en el palacio. Los

    sincorazón del patio caen derrotados,

    pero ¡el Emperador corre peligro!

- id: 10715
  text: >+
    ¡Corre hacia el palacio!

- id: 10716
  text: >+
    Mulán derrota a Shan Yu y salva China. El

    Emperador y el Capitán la alaban como la

    mujer más valiente de China.

- id: 10717
  text: –––
- id: 10718
  text: >+
    ¿Qué hará Mulán ahora que ha

    salvado China?

- id: 10719
  text: >+
    ¡Hacia la Tierra de Dragones!

- id: 10720
  text: >+
    Sora y sus amigos pasan por la aldea y,

    junto a Mulán, se encaminan a la montaña

    tras un individuo vestido de negro.

- id: 10721
  text: >+
    ¡Sigue al individuo de la túnica negra!

- id: 10722
  text: >+
    El hombre vestido de negro parece

    estar buscando algo a medida que se

    acerca a la cumbre de la montaña.

- id: 10723
  text: >+
    ¡Sube a la cumbre de la montaña!

- id: 10724
  text: >+
    Sora y sus compañeros pierden la pista al

    individuo antes de descubrir su identidad.

    Deciden descender de la montaña.

- id: 10725
  text: >+
    ¡Desciende de la montaña!

- id: 10726
  text: >+
    A mitad de camino, ven a un

    sincorazón gigante... ¡que se dirige

    hacia la Ciudad Imperial!

- id: 10727
  text: >+
    ¡Apresúrate a la Ciudad Imperial!

- id: 10728
  text: >2+


- id: 10729
  text: >2+


- id: 10730
  text: >+
    El grupo acaba con todos los sincorazón

    que encuentran y corren hacia el

    palacio y tras el hombre de negro.

- id: 10731
  text: >+
    ¡Apresúrate al palacio!

- id: 10732
  text: >+
    Las puertas están bloqueadas, pero

    consiguen entrar gracias a la astucia

    de Mulán. Allí hallan al encapuchado...

- id: 10733
  text: >+
    ¡Descubre quién es el hombre de negro!

- id: 10734
  text: >+
    Consiguen derrotar a los esbirros de

    Xigbar. Su preocupación por el Capitán

    y el Emperador les lleva a verles.

- id: 10735
  text: >+
    ¡Averigua qué ocurre en el palacio!

- id: 10736
  text: >+
    El Emperador y el Capitán están a salvo.

    Habían visto antes a otro encapuchado. De

    repente, un gran estruendo sacude el palacio.

- id: 10737
  text: >+
    ¡Averigua qué ocurre fuera!

- id: 10738
  text: >+
    El relato del Emperador hace pensar a Sora

    que Riku está bien. Mulán consigue un cargo

    en el ejército, y Sora acaba emocionado.

- id: 10739
  text: –––
- id: 10740
  text: >+
    Sora visita el Bosque de los Cien Acres

    de nuevo y va a la casa de Pooh.

- id: 10741
  text: >+
    ¡Ve a ver a Pooh!

- id: 10742
  text: >+
    Sora ve a Pooh frente a su casa,

    ensimismado en sus pensamientos.

- id: 10743
  text: >+
    ¡Habla con Pooh!

- id: 10744
  text: >+
    Una extraña fuerza expulsa a Sora del

    libro. Cuando vuelve, se da cuenta de que

    solo queda la casa de Pooh.

- id: 10745
  text: >+
    ¡Averigua cómo está Pooh!

- id: 10746
  text: >+
    ¿Qué ha podido ocurrir? Al menos,

    Pooh se encuentra bien. Sora se alegra

    de ver de nuevo al osito.

- id: 10747
  text: >+
    ¡Habla con Pooh!

- id: 10748
  text: >+
    A causa de las páginas arrancadas por los

    sincorazón, Pooh ha perdido la memoria.

    Sora tiene que recuperar esas páginas.

- id: 10749
  text: >+
    ¡Recupera las páginas!

- id: 10750
  text: >+
    La culpa de todo este lío es de las

    páginas arrancadas por los sincorazón.

- id: 10751
  text: >+
    ¡Recupera las páginas y ayuda a Pooh!

- id: 10752
  text: >+
    Cuando Sora volvió con una de las

    páginas arrancadas, apareció un árbol

    con una pequeña puerta.

- id: 10753
  text: >+
    ¡Ve al árbol con la puerta!

- id: 10754
  text: >+
    Sora ve a Piglet, que está siendo

    arrastrado por el viento.

- id: 10755
  text: >+
    ¡Salva a Piglet!

- id: 10756
  text: >+
    Piglet fue rescatado, pero quedó tan triste por

    el hecho de que Pooh le hubiese olvidado,

    que el viento se lo volvió a llevar.

- id: 10757
  text: >+
    ¡Habla con Pooh y salva a Piglet!

- id: 10758
  text: >+
    El valiente acto de Piglet ayudó a Pooh

    a recordar a su amigo. La página del

    libro fue restaurada.

- id: 10759
  text: >+
    ¡Encuentra las otras páginas!

- id: 10760
  text: >+
    Cuando Sora llegó con la página

    arrancada, apareció un árbol rodeado

    por un jardín.

- id: 10761
  text: >+
    ¡Ve al árbol con el jardín!

- id: 10762
  text: >+
    Pooh tampoco se acordaba de Igor.

    Él cree que Pooh necesita llenar su

    tripita, así que le guía hasta algo de miel.

- id: 10763
  text: >+
    ¡Sigue a Igor!

- id: 10764
  text: >+
    Pero la miel no hace recordar a Pooh.

    Conejo asegura que sabe dónde hay

    más miel.

- id: 10765
  text: >+
    ¡Habla con Conejo y consigue más miel!

- id: 10766
  text: >+
    Cuando Pooh ve a Conejo pensando,

    le recuerda, ¡y también a Igor! Todo el

    mundo está rebosante de alegría.

- id: 10767
  text: >+
    ¡Encuentra las otras páginas!

- id: 10768
  text: >+
    Cuando Sora llegó con la página

    arrancada, apareció un árbol lleno

    de paquetes.

- id: 10769
  text: >+
    ¡Ve al árbol cargado de cosas!

- id: 10770
  text: >+
    Preocupados por Pooh, Cangu y Rito

    trajeron una medicina para él, pero

    Tigger se la llevó dando brincos.

- id: 10771
  text: >+
    ¡Sigue a Tigger!

- id: 10772
  text: >+
    Tigger cree que si todos botan a la vez,

    Pooh podría recuperar la memoria.

- id: 10773
  text: >+
    ¡Habla con Tigger y bota con él!

- id: 10774
  text: >+
    Ver a Tigger deprimido hace que Pooh

    recuerde al resto de sus amigos.

    El libro está casi completo.

- id: 10775
  text: >+
    ¡Encuentra las otras páginas!

- id: 10776
  text: >+
    Cuando Sora llegó con la página

    arrancada, apareció una tenebrosa

    cueva.

- id: 10777
  text: >+
    ¡Entra en la cueva tenebrosa!

- id: 10778
  text: >+
    Pooh se ha adentrado solo en la

    cueva.

- id: 10779
  text: >+
    ¡Habla con Cangu y busca a Pooh!

- id: 10780
  text: >+
    Pooh iba buscando a alguien a quien

    había hecho una promesa especial...

    y acabó recordando a Sora.

- id: 10781
  text: >+
    ¡Encuentra la página restante!

- id: 10782
  text: >+
    Cuando Sora llegó con la página

    arrancada, apareció una colina estrellada.

- id: 10783
  text: >+
    ¡Ve a la colina estrellada!

- id: 10784
  text: >+
    ¡Pooh ha metido la cabeza en un tarro

    de miel y no puede sacarla! ¡Oso torpón!

- id: 10785
  text: >+
    ¡Ayuda a Pooh!

- id: 10786
  text: >+
    Pooh trataba de hallar la forma de que

    Sora no se marchara. Sora le dice que

    él siempre estará en su corazón.

- id: 10787
  text: –––
- id: 10788
  text: >-
    Tras llegar a una garganta, Sora está

    desconcertado con su nuevo cuerpo.

    ¡Será mejor moverse un poco!
- id: 10789
  text: ¡Da una vuelta para acostumbrarte!
- id: 10790
  text: >-
    El grupo salva a Nala, una leona, de unos

    sincorazón, y deciden ayudarla a

    recuperar su tierra natal.
- id: 10791
  text: ¡Ve a la Roca del Clan!
- id: 10792
  text: >-
    Rafiki, el profeta, dijo que quien salvara

    las Tierras del Reino se convertiría en

    rey... ¡Así que Sora no puede hacerlo!
- id: 10793
  text: ¡Abandona la Roca del Clan!
- id: 10794
  text: >-
    Sora y sus amigos escapan de Scar.

    Deciden ir a un sitio más tranquilo para

    poder hablar sobre Simba.
- id: 10795
  text: ¡Atraviesa el Valle del Ñu!
- id: 10796
  text: >-
    Nuestros amigos atraviesan un gran

    cañón en busca de Simba, el

    siguiente en la línea sucesoria al trono.
- id: 10797
  text: ¡Adéntrate en el Valle del Ñu!
- id: 10798
  text: >-
    Scar le dijo a Nala que Simba había

    muerto junto con Mufasa en el Valle

    del Ñu. Rafiki señala el oasis.
- id: 10799
  text: ¡Sigue hacia las tierras baldías!
- id: 10800
  text: >-
    Sora y compañía se reúnen al fin con

    Simba. De repente, los amigos del león

    gritan pidiendo socorro.
- id: 10801
  text: ¡Ayuda a los amigos de Simba en la jungla!
- id: 10802
  text: >-
    Nala pide a Simba que regrese a la Roca

    del Clan, pero él prefiere olvidar el

    pasado y disfrutar del presente.
- id: 10803
  text: ¡Averigua qué opina Simba!
- id: 10804
  text: >-
    Simba se sentía culpable de la muerte

    de su padre, pero una visión de Mufasa 

    le convence para que regrese a casa.
- id: 10805
  text: ¡Vuelve al reino y pon orden!
- id: 10806
  text: >-
    Fue Scar quien asesinó a Mufasa.

    Simba y su malvado tío luchan

    ferozmente mientras ascienden al risco.
- id: 10807
  text: ¡Sigue a Simba y a Scar al risco!
- id: 10808
  text: >-
    Simba ruge victorioso desde lo alto de

    la Roca del Clan. Las leonas saludan

    a su nuevo monarca.
- id: 10809
  text: –––
- id: 10810
  text: >+
    Simba se ha convertido en el rey de las

    Tierras del Reino. ¿Qué tal le irá al reino

    con su nuevo monarca?

- id: 10811
  text: >+
    ¡Hacia las Tierras del Reino!

- id: 10812
  text: >+
    Nuestros amigos llegan a la sabana.

    Las hienas toman a Simba por el

    pito de un sereno... ¿Qué ocurre?

- id: 10813
  text: >+
    ¡Habla con Simba!

- id: 10814
  text: >+
    Al grupo se le aparece el fantasma de

    Scar cuando se dirigen a ver a Simba.

    ¡Hay que informar al rey de esto!

- id: 10815
  text: >+
    ¡Habla a Simba sobre el fantasma!

- id: 10816
  text: >+
    Todos están intranquilos, ya que

    ven en el fantasma de Scar una

    prueba del declive del reino.

- id: 10817
  text: >+
    ¡Averigua qué piensa Simba!

- id: 10818
  text: >+
    A Simba le preocupaba cómo habría

    actuado su padre, pero se da cuenta

    de que lo importante es su criterio.

- id: 10819
  text: >+
    ¡Averigua qué piensa Rafiki!

- id: 10820
  text: >+
    El fantasma de Scar representaba las

    debilidades de Simba. Todos van al

    Cementerio de Elefantes para investigar.

- id: 10821
  text: >+
    ¡Ve al Cementerio de Elefantes!

- id: 10822
  text: >+
    En el Cementerio de Elefantes, las

    hienas parecen saber qué está pasando.

- id: 10823
  text: >+
    ¡Atrapa a las hienas y que hablen!

- id: 10824
  text: >+
    Simba huye del fantasma de Scar.

    Seguro que está en el oasis.

- id: 10825
  text: >+
    ¡Ve al oasis!

- id: 10826
  text: >+
    Simba aprecia el apoyo de sus amigos,

    y derrota al fantasma. Pero ¿de dónde

    han salido todos los otros fantasmas?

- id: 10827
  text: >+
    ¡El reino está en crisis! ¡Haz algo!

- id: 10828
  text: >+
    Simba expulsó a los fantasmas y salvó

    a Nala. La paz vuelve de nuevo a las

    Tierras del Reino.

- id: 10829
  text: –––
- id: 10830
  text: >+
    Sora llega a Atlántica justo a tiempo para

    participar en un musical. ¡A practicar!

- id: 10831
  text: >+
    ¡Habla con Sebastián cuando estés listo!

- id: 10832
  text: >+
    Sora y sus amigos se apuntaron al

    musical para que Ariel se distrajese.

    Ha llegado la hora de cantar.

- id: 10833
  text: >+
    ¡Habla con Sebastián cuando estés listo!

- id: 10834
  text: >+
    Flounder pretende llevar una estatua a

    la gruta de Ariel como regalo, pero

    no consiguen moverla.

- id: 10835
  text: >+
    ¡Habla con Flounder cuando tengas Magneto!

- id: 10836
  text: >+
    El amor secreto de Ariel es ahora más fuerte.

    La pieza del musical ya está lista, pero Sora

    y los demás no pueden cantar todavía.

- id: 10837
  text: >+
    {:width 95}¡Vuelve cuando tu ind. de Fusión llegue a 5!

- id: 10838
  text: >+
    Ariel se ha enamorado de un príncipe

    humano. Ha encontrado algo que le

    pertenece, pero no consigue alcanzarlo.

- id: 10839
  text: >+
    ¡Habla con Ariel cuando tengas Magneto+!

- id: 10840
  text: >+
    Ariel firmó un contrato con Úrsula,

    renunciando a su voz para convertirse en

    humana y encontrarse con Eric.

- id: 10841
  text: >+
    ¡Pregunta a Sebastián por Ariel!

- id: 10842
  text: >+
    Eric y Ariel forman una pareja perfecta.

    Sebastián pide a Sora y sus amigos

    ayuda con el musical.

- id: 10843
  text: >+
    ¡Habla con Sebastián cuando tengas Electro++!

- id: 10844
  text: >+
    ¡El musical ha sido todo un éxito!

    La superficie y el mar se han unido

    en un solo canto de armonía.

- id: 10845
  text: –––
- id: 10846
  text: >+
    Algo ocurre en el Castillo Disney.

    Será mejor hablar con la reina Minnie

    cuanto antes.

- id: 10847
  text: >+
    ¡Habla con la reina Minnie en la biblioteca!

- id: 10848
  text: >+
    El pacífico castillo ha sido invadido por

    los sincorazón. La reina Minnie y Sora

    se encaminan a la sala de audiencias.

- id: 10849
  text: >+
    ¡Ve a la sala de audiencias!

- id: 10850
  text: >+
    La reina Minnie rompió el sello de la

    sala de audiencias. ¿Qué habrá en su

    interior?

- id: 10851
  text: >+
    ¡Entra en la sala de audiencias!

- id: 10852
  text: >+
    La Piedra Angular de Luz está cubierta

    de zarzas espinosas. Será mejor ir a

    Bastión Hueco y hablar con Merlín.

- id: 10853
  text: >+
    ¡Ve a ver a Merlín!

- id: 10854
  text: >+
    Merlín crea una misteriosa puerta. Hay otra

    puerta más allá de la que ha creado, y

    habrá que cerrarla para salvar el castillo.

- id: 10855
  text: >+
    ¡Atraviesa la misteriosa puerta!

- id: 10856
  text: >+
    Tras la puerta de Merlín hay un mundo

    en blanco y negro. Todos se sienten

    algo nostálgicos en aquel lugar.

- id: 10857
  text: >+
    ¡Salva el castillo!

- id: 10858
  text: >+
    El grupo atravesó la puerta y llegó a

    un mundo monocromático. Ven a un

    extraño Pete, pero sale huyendo.

- id: 10859
  text: >+
    ¿Ese es... Pete? ¡A por él!

- id: 10860
  text: >+
    Buscando la puerta de Merlín, se asoman

    por una extraña ventana y ven a los

    sincorazón en cuatro lugares distintos.

- id: 10861
  text: >+
    ¡Derrota a los sincorazón de las ventanas!

- id: 10862
  text: >+
    Al mirar por la ventana, vieron cómo

    Maléfica reprendía enfadada a alguien.

- id: 10863
  text: >+
    ¡Quedan otros tres grupos de sincorazón!

- id: 10864
  text: >+
    Esta ventana mostraba una puerta como

    la que creó Merlín. Debería de llevar

    también a este mundo en blanco y negro.

- id: 10865
  text: >+
    ¡Solo quedan dos grupos de sincorazón!

- id: 10866
  text: >+
    Las misteriosas puertas conectaban con

    el pasado. Sora y los demás descubrieron

    al fin que allí es donde se encontraban.

- id: 10867
  text: >+
    ¡Solo queda un grupo de sincorazón!

- id: 10868
  text: >+
    Pete ha robado la Piedra Angular de Luz.

    Pronto el castillo quedará sumido en

    la oscuridad. ¡Tras él!

- id: 10869
  text: >+
    ¡Pete va hacia el canal! ¡Síguele!

- id: 10870
  text: >+
    Nuestros héroes consiguieron salvar

    la Piedra Angular de Luz, pero Pete

    saltó del barco y huyó.

- id: 10871
  text: >+
    ¡Sigue a Pete!

- id: 10872
  text: >+
    Sora y los suyos sellaron la puerta que

    Pete utilizaba y devolvieron la Piedra

    Angular de Luz. El castillo está a salvo.

- id: 10873
  text: –––
- id: 10874
  text: >+
    Sora y sus amigos llegan a Ciudad de

    Halloween. Al principio están extrañados,

    hasta que ven a Zero, el amigo de Jack.

- id: 10875
  text: >+
    ¡Sigue a Zero!

- id: 10876
  text: >+
    Jack está en la plaza, obsesionado con

    la Navidad. Quiere enseñarles algo, así

    que los lleva a ver a Sally.

- id: 10877
  text: >+
    ¡Reúnete con Sally en el laboratorio!

- id: 10878
  text: >+
    Jack parte para ver a Santa Claus a

    pesar de los temores de Sally. Entonces,

    aparecen los sincorazón en la plaza.

- id: 10879
  text: >+
    ¡Acaba con todos los sincorazón!

- id: 10880
  text: >+
    Jack pide a Sora que proteja a Santa Claus.

    La puerta de Ciudad de la Navidad está

    en el bosque, pasado el cementerio.

- id: 10881
  text: >+
    ¡Ve al bosque y busca la puerta!

- id: 10882
  text: >+
    Un mundo nevado aguarda tras la puerta:

    Ciudad de la Navidad; luminosa, festiva

    y libre de terrores y miedos.

- id: 10883
  text: >+
    ¡Ve a la ciudad y habla con Santa Claus!

- id: 10884
  text: >+
    ¡También hay sincorazón en Ciudad de

    la Navidad! Todos luchan para que la

    Navidad no sufra ningún percance.

- id: 10885
  text: >+
    ¡Entra en casa de Santa Claus!

- id: 10886
  text: >+
    Todos están ansiosos por conocer a

    Santa Claus. Durante su visita, oyen un

    estruendo que viene de otra habitación.

- id: 10887
  text: >+
    ¡Echa un vistazo a la habitación trasera!

- id: 10888
  text: >+
    Lock, Shock y Barrel han salido

    huyendo del taller.

    ¡Será mejor que no escapen!

- id: 10889
  text: >+
    ¡Sigue esas huellas!

- id: 10890
  text: >+
    Lock, Shock y Barrel han salido

    huyendo del taller.

    ¡Será mejor que no escapen!

- id: 10891
  text: >+
    ¡Atrapa a esos tres incordios!

- id: 10892
  text: >+
    Encuentran a Lock, Shock y Barrel,

    ¡y confiesan que Oogie ha vuelto! Tras

    eso, los pequeños vuelven a huir.

- id: 10893
  text: >+
    ¡Averigua qué ocurre en la ciudad!

- id: 10894
  text: >+
    ¡Oogie ha secuestrado a Santa Claus

    y se ha marchado hacia Ciudad de la

    Navidad!

- id: 10895
  text: >+
    ¡A Ciudad de la Navidad! ¡Rápido!

- id: 10896
  text: >+
    Persiguen a Oogie hasta Ciudad de la

    Navidad, donde ven humo saliendo de

    la chimenea de la casa de Santa Claus.

- id: 10897
  text: >+
    ¡Ve deprisa a casa de Santa Claus!

- id: 10898
  text: >+
    Jack quiere hacer el trabajo de Santa Claus

    esta Navidad, pero el anciano le recuerda lo

    importante de su trabajo como Rey Calabaza.

- id: 10899
  text: –––
- id: 10902
  text: >+
    Jack vuelve a ser el Rey Calabaza.

    ¿Qué tal le irá?

- id: 10903
  text: >+
    ¡A Ciudad de Halloween!

- id: 10904
  text: >+
    Sora y los demás encuentran regalos tirados

    por Ciudad de Halloween. Ayudan a Jack a

    devolvérselos a Santa Claus.

- id: 10905
  text: >+
    ¡Devuelve los regalos a Santa Claus!

- id: 10906
  text: >+
    Alguien había robado los regalos. Justo

    cuando iban a salir en busca del culpable,

    oyen algo en el taller.

- id: 10907
  text: >+
    ¡Ve al taller de juguetes!

- id: 10908
  text: >+
    Al entrar en el taller de juguetes

    descubren a qué se debía el ruido.

- id: 10909
  text: >+
    ¡Explora el taller de juguetes!

- id: 10910
  text: >+
    Los tres pilluelos no eran los ladrones.

    Sally aparece para avisar que los

    sincorazón estaban en la plaza.

- id: 10911
  text: >+
    ¡Vuelve a Ciudad de Halloween!

- id: 10912
  text: >+
    ¡También han robado el experimento del

    Doctor! El grupo se dirige a la casa de

    Santa Claus para preparar regalos trampa.

- id: 10913
  text: >+
    ¡Busca ayuda en la casa de Santa Claus!

- id: 10914
  text: >+
    Sora y los demás se dirigen al segundo

    piso del taller de juguetes para preparar

    los regalos trampa.

- id: 10915
  text: >+
    ¡Sube al segundo piso!

- id: 10916
  text: >+
    Los regalos trampa están listos. Santa

    Claus dice que sabe un buen lugar para

    colocar la trampa para el ladrón.

- id: 10917
  text: >+
    ¡Habla con Santa Claus!

- id: 10918
  text: >+
    Nuestros amigos llegaron a Port Royal.

    Tras echar un vistazo, oyeron jaleo

    en el puerto.

- id: 10919
  text: >+
    ¡Baja las escaleras hasta el puerto!

- id: 10920
  text: >+
    ¡Eran Pete y unos piratas zombis!

    ¿Qué pretenden? Se fueron hacia

    la ciudad en busca de un medallón.

- id: 10921
  text: >+
    ¡Ve tras los piratas hacia la ciudad!

- id: 10922
  text: >+
    ¡Elizabeth, la hija del Gobernador, ha sido

    raptada! Sora y Will corren hacia el

    puerto tras los piratas.

- id: 10923
  text: >+
    ¡Corre hacia el puerto tras los piratas!

- id: 10924
  text: >+
    El barco pirata ya había zarpado. Con la

    ayuda de un pirata llamado Jack Sparrow,

    Sora y los demás deciden ir tras ellos.

- id: 10925
  text: >+
    ¡Habla con Will y sube a bordo!

- id: 10926
  text: >+
    Unas piezas de oro maldijeron a los piratas,

    pero si las devuelven y reparan el agravio por

    la sangre, la maldición se romperá.

- id: 10927
  text: >+
    ¡Alcanza al barco pirata: la "Perla Negra"!

- id: 10928
  text: >+
    Barbossa, jefe de los piratas malditos,

    era antes parte de la tripulación de Jack.

    Ahora Jack quiere recuperar la "Perla".

- id: 10929
  text: >+
    ¡Pon rumbo a la Isla de Muerta!

- id: 10930
  text: >+
    En la Isla de Muerta, Sora y sus amigos se

    quedan vigilando el barco, pero Jack y Will

    tardan demasiado, así que se preocupan.

- id: 10931
  text: >+
    ¡Entra en la gruta!

- id: 10932
  text: >+
    Los piratas han recuperado todo el oro.

    Ahora debe repararse el agravio por la

    sangre. La ceremonia va a comenzar.

- id: 10933
  text: >+
    ¡Avanza hasta el fondo de la gruta!

- id: 10934
  text: >+
    El agravio fue reparado, pero no ha roto

    la maldición. Will rescató a Elizabeth y

    todos consiguieron escapar.

- id: 10935
  text: >+
    ¡Vuelve a Port Royal!

- id: 10936
  text: >+
    De regreso a Port Royal, la verdad salió

    a la luz. Es la sangre de Will la que se

    necesita para reparar el agravio.

- id: 10937
  text: >+
    ¡Vuelve a Port Royal!

- id: 10938
  text: >+
    Barbossa alcanzó al "Interceptor", se llevó

    a Will y ha llenado el barco de explosivos.

    ¡Va a volar por los aires!

- id: 10939
  text: >+
    ¡Haz algo con los barriles de pólvora!

- id: 10940
  text: >+
    Sora y sus amigos consiguieron salvar el

    pescuezo. Ahora tienen que ir tras

    Barbossa y ayudar a Will.

- id: 10941
  text: >+
    ¡Ve al corazón de la Isla de Muerta!

- id: 10942
  text: >+
    Barbossa fue derrotado, y Will y Elizabeth

    volvían a estar juntos. Jack, por su parte,

    navegaba de nuevo en su "Perla Negra".

- id: 10943
  text: –––
- id: 10944
  text: >+
    ¿Cómo estará Port Royal ahora que los

    piratas malditos han desaparecido?

- id: 10945
  text: >+
    ¡A Port Royal!

- id: 10946
  text: >+
    Sora y sus amigos han vuelto a Port Royal,

    pero parece que hay problemas en el

    puerto.

- id: 10947
  text: >+
    ¡Averigua qué ocurre en el puerto!

- id: 10948
  text: >+
    Los piratas malditos estaban tras el jaleo.

    Con la ayuda de Jack, los derrotaron.

    ¡Pero Will se ha ido a la Isla de Muerta solo!

- id: 10949
  text: >+
    ¡Navega hasta la Isla de Muerta!

- id: 10950
  text: >+
    Encuentran a Will, que les cuenta que la

    Organización {XIII} ha liberado a un

    monstruo. Jack se niega a ir tras él.

- id: 10951
  text: >+
    ¡Pon el barco en movimiento!

- id: 10952
  text: >+
    En la refriega, el "Interceptor" resulta hundido

    y el grupo de Sora vencido. Todos acaban

    varados en un cementerio de barcos.

- id: 10953
  text: >+
    ¡Busca en la isla un barco que flote!

- id: 10954
  text: >+
    De nuevo, Jack es víctima de la maldición a

    causa del monstruo de la Organización. Solo

    recuperando el oro robado se romperá.

- id: 10955
  text: >+
    ¡Recupera las piezas de oro!

- id: 10956
  text: >+
    Sora y sus amigos recuperaron todo el

    oro. La Organización debe de haber ido

    a algún sitio con mucha gente.

- id: 10957
  text: >+
    ¡Dirígete a Port Royal!

- id: 10958
  text: >+
    Se arrojó el arca con el oro

    maldito al fondo del océano, y

    Port Royal volvió a estar a salvo.

- id: 10959
  text: –––
- id: 10960
  text: >+
    Sora y sus amigos han sido arrastrados

    al interior de un sistema informático.

    Deciden fugarse con la ayuda de Tron.

- id: 10961
  text: >+
    ¡Abre la puerta de la celda!

- id: 10962
  text: >+
    Escapan con la ayuda de Tron. Para

    volver al mundo exterior, necesitan el

    núcleo de energía situado en el cañón.

- id: 10963
  text: >+
    ¡Busca el núcleo de energía en el cañón!

- id: 10964
  text: >+
    Una vez en marcha, el núcleo de energía

    devolverá la corriente al terminal necesario

    para volver al mundo exterior.

- id: 10965
  text: >+
    ¡Busca el núcleo de energía en el cañón!

- id: 10966
  text: >+
    Gracias a Tron, hay vía libre a casa.

    Para encender el terminal, el grupo

    tiene que volver a la celda.

- id: 10967
  text: >+
    ¡Vuelve a la celda!

- id: 10968
  text: >+
    Tron necesitaba la contraseña de un

    entorno de datos llamado DTD. Ansem,

    su usuario, debía tenerla.

- id: 10969
  text: >+
    ¡Busca la contraseña de Ansem!

- id: 10970
  text: >+
    Sora ha conseguido la contraseña.

    Ahora, deben encaminarse al entorno

    de datos DTD junto a Tron.

- id: 10971
  text: >+
    ¡Ve al entorno de datos!

- id: 10972
  text: >+
    Tron usa la contraseña para desbloquear el

    entorno de datos, pero el PCM contraataca

    con un programa que amenaza la ciudad.

- id: 10973
  text: >+
    ¡Ve deprisa hacia la Torre I/O!

- id: 10974
  text: >+
    El programa hostil sigue siendo

    transmitido a la ciudad desde la

    Torre I/O.

- id: 10975
  text: >+
    {:width 95}¡Ábrete camino por el corredor de la torre!

- id: 10976
  text: >+
    Sora y sus amigos han salvado la ciudad.

    Ahora tienen que volver al exterior, pues

    quedan muchas preguntas sobre Ansem.

- id: 10977
  text: >+
    ¡Vuelve a Bastión Hueco!

- id: 10978
  text: >+
    El grupo vuelve al mundo exterior,

    aunque ahora les une un lazo muy

    fuerte con Tron.

- id: 10979
  text: –––
- id: 10980
  text: >+
    Tron debe de estar combatiendo al PCM.

    ¿Qué tal le irá?

- id: 10981
  text: >+
    ¡Rumbo a Espacio Paranoico!

- id: 10982
  text: >+
    El grupo vuelve a estar en el mundo

    informático. Están preocupados por Tron,

    que está atrapado en la rejilla de juego.

- id: 10983
  text: >+
    ¡Transpórtate a la rejilla de juego!

- id: 10984
  text: >+
    El PCM pretende comenzar una guerra contra

    los usuarios. Junto a Tron, el grupo se dirige

    a recoger un programa para borrar el PCM.

- id: 10985
  text: >+
    ¡Dirígete a la Torre I/O!

- id: 10986
  text: >+
    Casi han llegado a la Torre I/O.

    León está haciendo todo lo posible

    desde el mundo exterior.

- id: 10987
  text: >+
    ¡Ve deprisa a la Torre I/O!

- id: 10988
  text: >+
    El programa enviado por León abre el

    navegador solar, que el grupo puede

    usar para llegar hasta el PCM.

- id: 10989
  text: >+
    ¡Usa el navegador solar para llegar al PCM!

- id: 10990
  text: >+
    Sora y sus amigos bajan del navegador

    solar en la loma del PCM.

    La batalla final está cerca.

- id: 10991
  text: >+
    ¡Entra en el núcleo del ordenador central!

- id: 10992
  text: >+
    Sora y los suyos prometen que volverán

    a ver a Tron, que les obsequia con una

    visión de la ciudad en sus orígenes.

- id: 10993
  text: –––
- id: 10994
  text: >+
    Con la ayuda de Axel, conseguimos salir

    de la oscuridad. Al parecer, Kairi estaba

    presa en la mazmorra del castillo.

- id: 10995
  text: >+
    ¡Busca el castillo y salva a Kairi!

- id: 10996
  text: >+
    Primer día

- id: 10997
  text: >+
    Segundo día

- id: 10998
  text: >+
    Tercer día

- id: 10999
  text: >+
    Cuarto día

- id: 11000
  text: >+
    Quinto día

- id: 11001
  text: >2+


- id: 11002
  text: >+
    Guiado por una voz que le llamaba,

    Sora despertó en una vieja mansión.

    Tuvo que estar durmiendo allí

    mucho tiempo, pero no conseguía

    recordar nada.

- id: 11003
  text: >+
    Al salir, estaba en una ciudad que le

    resultaba extrañamente familiar, a pesar

    de que nunca había estado en ella.

- id: 11004
  text: >+
    Sora vagaba perplejo por Villa Crepúsculo

    cuando se encontró con Hayner, Pence

    y Olette en el callejón. Dijeron que

    alguien en la estación preguntó por

    Sora y sus amigos. Por la descripción

    que dieron, debía de tratarse del rey.

- id: 11005
  text: >+
    Sora y sus amigos corrieron hacia la

    estación, pero de repente se vieron

    rodeados por multitud de enemigos. ¡El

    hombre vestido de negro que los sacó

    del apuro no era otro que el mismísimo

    rey! Pero no hubo mucho tiempo para

    celebraciones por el reencuentro.

    ‛¡Tenéis que subir al tren y salir de la

    ciudad!’, dijo el rey; y dio a Sora un

    monedero con platines antes de irse.

    Pero si el rey estaba atrapado en el

    Reino de la Oscuridad y sigue sano y

    salvo, eso significa que Riku también

    debe de estar bien. Sora decidió salir en

    busca de Riku: ‛Así podremos volver a

    las islas juntos. ¡Kairi está allí

    esperándonos!’. Y, por supuesto, Donald

    y Goofy decidieron ir con él

- id: 11006
  text: >+
    Llegó la hora de partir hacia una nueva

    aventura. Tal y como dijo el rey, tenían

    que subir a un tren y salir de la ciudad.

    Se despidieron de Hayner y los demás,

    que habían ido a la estación para

    verles marchar.

- id: 11007
  text: >+
    Fue una despedida emotiva, a pesar de

    que Sora acababa de conocer a los

    tres amigos... Aún con una gran tristeza,

    subieron al tren, que les llevó hasta la

    base de una solitaria torre.

- id: 11008
  text: >+
    Donald y Goofy reconocieron al tipo

    que estaba en la entrada de la torre:

    Pete, un malandrín de cuidado. El rey le

    había desterrado a otra dimensión, pero

    la bruja Maléfica le liberó y él se

    convirtió en su esbirro. Trataba de

    reunir un ejército de sincorazón y su

    objetivo ahora era convertir en uno de

    ellos al maestro Yen Sid, mentor del rey.

- id: 11009
  text: >+
    La torre estaba plagada de sincorazón.

    Cuando Sora y sus amigos consiguieron

    llegar a lo alto de la torre, el maestro

    Yen Sid les aguardaba: ‛¡El elegido de la

    llave espada! Tú eres la llave que abrirá

    la puerta a la luz’.

- id: 11010
  text: >+
    Según Yen Sid, la luz estaba bajo una

    nueva amenaza: los ‛incorpóreos’.

    Estos son el armazón vacío que queda

    cuando alguien con un corazón fuerte

    se convierte en un sincorazón, aunque

    actúan bajo su propia determinación y

    voluntad. Un grupo llamado Organización {XIII}

    está controlando a estos incorpóreos,

    aunque se desconocen sus propósitos.

    El rey ha emprendido viaje para

    averiguar el objetivo de la

    Organización {XIII}. Si Sora y

    sus amigos consiguen hallar al rey,

    puede que descubran también el paradero

    de Riku.

- id: 11011
  text: >+
    Sora decidió salir en busca del rey,

    pero necesitaba renovar su vestuario,

    ya que se le había quedado pequeño.

- id: 11012
  text: >+
    Las tres hadas madrinas proporcionaron

    a Sora ropajes mágicos que le servirían

    en su viaje.

- id: 11013
  text: >+
    Solo quedaba zarpar en la nave gumi que

    el maestro Yen Sid había preparado.

    Tendrían que ir abriendo las puertas

    guiados por el rayo de luz que brotaba de

    la llave espada, y nuevas rutas aparecerían,

    conectando los mundos una vez más.

    Sí, todo está conectado, incluso los

    corazones que se encuentran

    separados por grandes distancias.

    ¡Una nueva aventura aguarda!

- id: 11016
  text: >+
    Al llegar a Villa Crepúsculo de nuevo,

    Vivi corría pidiendo socorro.

- id: 11017
  text: >+
    Sora y sus amigos corrieron hacia el

    solar y derrotaron a los incorpóreos

    que acosaban a Seifer y su pandilla.

    Saïx, un miembro de la Organización {XIII},

    apareció para advertir al grupo:

    Axel había desertado y trataba de

    convertir a Sora en un sincorazón.

    Luego hizo un fugaz comentario sobre

    Riku y desapareció en la oscuridad.

    Seifer intentó que Sora aceptase el

    trofeo al más fuerte de la ciudad.

    Fue entonces cuando Pence, muy

    nervioso, llego y le preguntó: ‛¿Conoces

    a una chica llamada Kairi?’

- id: 11018
  text: >+
    La caja encontrada en el Reino de la

    Oscuridad contenía un helado y fotos

    de la vieja mansión de Villa Crepúsculo.

- id: 11019
  text: >+
    Sora y compañía fueron a la mansión en

    busca de pistas, pero encontraron a

    Hayner y sus amigos, que habían sido

    atacados por los sincorazón. Según Olette,

    creían que la mansión era algún tipo de

    puerta a una Villa Crepúsculo alternativa.

    ‛¿Cómo que Villa Crepúsculo alternativa?’

    Notan que ambos tienen duplicados de un

    monedero y unos cristales que se suponía

    debían ser únicos. Esa era la prueba de

    que ‛por ahí’ había otra Villa Crepúsculo

    similar a la ‛de aquí’. ‛¡En esa otra

    ciudad es donde debe de estar todo lo

    que falta aquí!’, dijo Pence. Si Kairi ha

    desaparecido de esta Villa Crepúsculo...

    ¡quizá nos esté esperando en la otra!

    Fue entonces cuando apareció el rey. Iba

    tras la pista de Ansem el Sabio, quien se

    dirigía a la fortaleza de la Organización {XIII}.

    Aunque no dio muchos detalles, de sus

    palabras se desprendía que Sora podría

    reencontrarse con Riku si seguía al rey.

- id: 11020
  text: >+
    Según el rey, el ordenador de la vieja

    mansión estaba conectado con la otra

    Villa Crepúsculo; y a través de él quizá

    podrían hallar un camino al Reino de la

    Oscuridad.

- id: 11021
  text: >+
    El ordenador tenía una contraseña, pero

    Sora y sus amigos recordaron algo que

    podría estar relacionado: ¡el helado que

    había en la caja con las fotos!

- id: 11022
  text: >+
    La contraseña era: ‛Helado de sal marina’.

    Al introducir el nombre del sabor favorito

    de Ansem el Sabio se activó un

    mecanismo que lanzó un haz de luz.

    El camino a la otra Villa Crepúsculo

    se había abierto.

- id: 11023
  text: >+
    Sora y sus amigos llegaron a la otra

    Villa Crepúsculo y se unieron al rey en

    su búsqueda de una entrada al Reino

    de la Oscuridad.

- id: 11024
  text: >+
    Una vez más regresamos a Bastión

    Hueco. Las cosas habían cambiado,

    pero seguía habiendo problemas.

- id: 11025
  text: >+
    Mientras caminábamos por una ciudad

    infestada de sincorazón, nos cruzamos

    con Yuffie.

- id: 11026
  text: >+
    ‛¡Bienvenidos al Comité de Restauración

    de Bastión Hueco!’ Fuimos a casa de

    Merlín y allí estaban León y todos nuestros

    viejos amigos. Al parecer, todos nos habían

    recordado en los últimos días. Decidimos

    ayudar en la reconstrucción, pero había un

    gran problema en la ciudad.

- id: 11027
  text: >+
    El Valle del Villano estaba plagado de

    sincorazón y de incorpóreos. Sora se

    dispuso a enfrentarse a las hordas, pero

    apareció la Organización {XIII} con su habitual

    retahíla de intrigantes palabras. Sin tiempo

    para reaccionar, la llave espada brilló y la

    puerta a un nuevo mundo apareció. Con

    las palabras de Yen Sid presentes, partimos.

- id: 11028
  text: >+
    Guiados por Merlín, volvimos a Bastión

    Hueco. ¿Qué nos encontramos?

    ¡El libro de Pooh!

- id: 11029
  text: >+
    Pero los sincorazón habían arrancado las

    páginas y Pooh no recordaba nada. Para

    solucionar el entuerto, tendríamos

    que encontrar las páginas arrancadas.

- id: 11030
  text: >+
    ¡Zarzas espinosas en el Castillo Disney!

    Si no nos apresurábamos, quedaría

    sumido en la oscuridad.

- id: 11031
  text: >+
    Con la ayuda de Merlín encontramos la

    forma de salvar el Castillo Disney.

- id: 11032
  text: >+
    Gracias a Sora y sus amigos, la paz

    volvió a reinar en el castillo.

- id: 11033
  text: >+
    En Bastión Hueco, seguía aumentando

    el número de sincorazón y de incorpóreos.

- id: 11034
  text: >+
    Tras volver a la casa de Merlín, descubrimos

    la existencia de un ordenador que Ansem

    utilizaba para sus investigaciones.

- id: 11035
  text: >+
    Y lo que es más importante, ¡descubrimos

    que el rey estaba con León!

- id: 11036
  text: >+
    Pero cuando llegamos al estudio de Ansem,

    ni había rey ni había ordenador.

- id: 11037
  text: >+
    La puerta a la sala de ordenadores

    estaba oculta tras un mecanismo secreto.

- id: 11038
  text: >+
    Sora y Donald, negados para la tecnología,

    se pusieron a aporrear el ordenador. De

    repente, se activó un extraño dispositivo

    que nos llevó a un misterioso mundo.

- id: 11041
  text: >+
    ¡Estábamos dentro de un sistema

    informático! Con la ayuda de un programa

    de seguridad llamado Tron, volvimos al

    mundo exterior y empezamos a buscar la

    contraseña a un entorno de datos que

    había en ese ordenador, dentro del cual

    estaban los datos de las investigaciones

    de Ansem.

- id: 11042
  text: >+
    Una vez en el mundo exterior, unos

    garabatos en una pared (‛Door to

    Darkness’) y la ayuda del rey nos

    sirvieron para descubrir la contraseña:

    los nombres de las Siete Princesas,

    que usamos para abrir la puerta.

- id: 11043
  text: >+
    Volvimos al mundo informático para

    cumplir la promesa que hicimos a Tron.

- id: 11045
  text: >+
    Desbloqueamos el entorno de datos y

    volvimos a Bastión Hueco. ¡Ya teníamos

    acceso a los datos del DTD!

- id: 11046
  text: >+
    Pero la mayoría de los datos estaban

    corruptos y no parecía haber nada sobre

    Riku o Kairi. Fisgoneando, encontramos

    el retrato de alguien. El rey dijo que era

    Ansem, ¡pero no era aquel al que nosotros

    conocíamos! El Ansem al que derrotamos

    era el sincorazón de alguien que se hacía

    pasar por Ansem, y el incorpóreo de ese

    tipo resulta que era el líder de la Organización {XIII}.

    ¡Qué cosas! El rey dijo que buscaba al

    Ansem real, que seguro sabría quién era

    el Ansem falso. Tras ello, la sala se

    estremeció con un fuerte estruendo.

- id: 11047
  text: >+
    Fuera, los sincorazón y los incorpóreos

    infestaban la ciudad.

- id: 11048
  text: >2+


- id: 11049
  text: >+
    León y nuestros otros amigos plantaron

    cara a la avalancha enemiga. Todos se

    lanzaron con valentía contra la marabunta

    de enemigos que manaba desde el valle

    de la Gran Garganta.

- id: 11050
  text: >+
    ¿Y quién se dejó ver al final?

    Xemnas, el líder de la Organización {XIII}.

    Era en realidad Xehanort, aprendiz de

    Ansem el Sabio. Sora trató de preguntarle

    por Riku y Kairi, pero Xemnas le dijo que

    eso "debería preguntárselo a su rey" y,

    tras ello, desapareció en la oscuridad.

    A continuación apareció Axel para advertir

    a Sora de que la Organización le estaba

    utilizando. Perplejo, Sora se vio rodeado

    por los sincorazón cuando un rayo de luz

    apareció... Con gran incertidumbre, la

    batalla pareció cesar un momento.

- id: 11051
  text: >+
    Se suponía que Bastión Hueco debía

    estar en paz...

- id: 11052
  text: >+
    Pero algo no iba bien.

- id: 11053
  text: >+
    El PCM pirateó el sistema informático y

    envió infinidad de sincorazón a la ciudad.

- id: 11054
  text: >+
    Partimos para ver a Tron de nuevo.

- id: 11055
  text: >+
    El origen del problema era el PCM, que

    ansiaba hacerse con el poder. Tras

    acabar con el PCM, recibimos un regalo

    de Tron. Se trataba de una visión de la

    ciudad tal y como era en sus orígenes.

    Al contemplarla, la nostalgia invadió los

    corazones de nuestros amigos. Ninguno

    recordaba cuándo comenzó la ciudad a

    llamarse Bastión Hueco... pero resultó

    que el nombre original era ‛Vergel

    Radiante’.

- id: 11058
  text: >+
    Pasamos por el castillo, pero Bestia

    no parecía estar de muy buen humor.

    Lo único que le importaba era su

    preciada rosa.

- id: 11059
  text: >+
    Preguntamos a Bella qué ocurría.

- id: 11060
  text: >+
    Bella nos dijo que Bestia se estaba portando

    de forma extraña últimamente, y que había

    encerrado a sus sirvientes en la mazmorra.

- id: 11061
  text: >+
    Fuimos al corredor oeste para rescatar

    a los sirvientes y averiguar más.

- id: 11062
  text: >+
    Pero un armario bloqueaba la puerta

    que daba al sótano.

- id: 11063
  text: >+
    Cuando intentamos moverlo, ¡nos habló!

    Resultó que era una persona a la que

    habían transformado con magia. Una

    hechicera convirtió a su amo, el príncipe,

    en una bestia, como castigo a su crueldad;

    y con él, hechizó a todos sus sirvientes

    también.

- id: 11064
  text: >+
    Derrotamos a la vil puerta y entramos en

    la mazmorra, donde encontramos a los

    sirvientes hechizados.

- id: 11065
  text: >+
    Sus años de servicio a Bestia les

    llevaban a creer que los sincorazón eran

    la causa de su comportamiento. Y claro,

    si los sincorazón estaban de por medio,

    ¡era un trabajo para nosotros!

- id: 11066
  text: >+
    Los sirvientes nos mostraron un

    pasadizo secreto.

- id: 11067
  text: >+
    Abrimos la puerta secreta y nos dirigimos

    al cuarto de Bestia.

- id: 11068
  text: >+
    Allí estaba Xaldin, de la Organización {XIII},

    tratando de provocar la ira de Bestia.

    Fuera de sus casillas, Bestia cargó contra

    nosotros, pero recobró la cordura con la

    ayuda de sus sirvientes. Bestia temía

    haberle hecho daño a Bella cuando la

    ira se apoderó de él.

- id: 11069
  text: >+
    Con la intención de hablar con Bella, Bestia

    fue a buscarla, pero no la encontró por

    ningún lado.

- id: 11070
  text: >+
    De repente, ¡la oímos pedir ayuda desde

    el salón de baile!

- id: 11071
  text: >+
    Nos enfrentamos a los sincorazón que

    perseguían a Bella. Resultó ilesa,

    pero Xaldin logró escapar. Bestia se

    disculpó por su comportamiento y ambos

    volvieron a llevarse bien. Sin embargo,

    aún será necesario algo de tiempo para

    que se rompa el hechizo.

- id: 11072
  text: >+
    Volvimos al castillo. Bestia parecía

    inquieto e impaciente.

- id: 11073
  text: >+
    Resultó que era un día muy especial:

    iba a disfrutar de un elegante baile con

    Bella. Sin embargo, cuando el baile iba

    a comenzar, Xaldin apareció y dijo que

    venía a reclamar algo ‛muy preciado’

    para Bestia.

- id: 11074
  text: >+
    Xaldin se había hecho con la preciada rosa

    de Bestia. Desolado, Bestia trató de

    expulsarnos junto con Bella del castillo.

    La rosa era la clave para romper el hechizo

    que afectaba a Bestia y sus sirvientes:

    su única esperanza.

- id: 11075
  text: >+
    Mas no había tiempo para lamentos: ‛No

    desperdicies tu última oportunidad’, le animó

    Sora. Así, Bestia halló la fuerza y el valor

    para luchar de nuevo.

- id: 11076
  text: >+
    El osado Xaldin observó con sorna al

    revitalizado Bestia y le dijo: ‛Cuando

    Kingdom Hearts nos pertenezca...

    nuestra existencia será plena’.

- id: 11077
  text: >+
    Xaldin trató de raptar a Bella para

    atrapar a Bestia, pero ella logró zafarse.

    Aprovechamos ese momento para derrotar

    al malvado Xaldin. La rosa fue recuperada y

    Bestia supo qué era lo que más quería.

    Finalmente, el baile comenzó. No creo que

    el hechizo tarde mucho en romperse...

- id: 11078
  text: >+
    Aparecimos cerca del Coliseo y vimos a

    unos sincorazón que estaban acechando

    a una mujer.

- id: 11079
  text: >+
    Resultó ser una amiga de Hércules llamada

    Megara, que iba a hablar con Hades

    para pedirle que dejara descansar a

    Hércules. Pensamos que era peligroso, así

    que partimos hacia el Inframundo por ella.

- id: 11080
  text: >+
    Entretanto, Hades trataba de hacer que

    Auron, un gran guerrero que había sido

    invocado desde el Inframundo, luchara

    contra Hércules. Este se negó en redondo.

    Llegamos a tiempo para ayudar a Auron

    en su lucha contra Hades, pero la maldición

    del Inframundo mermó nuestras fuerzas.

- id: 11081
  text: >+
    Tras una ardua escaramuza, conseguimos

    rechazar a Cerbero y escapar del

    Inframundo. Al mismo tiempo, Hades

    buscaba una forma de usar la llave espada

    de Sora para desbloquear el coliseo del

    Inframundo: el Infiernódromo.

- id: 11082
  text: >+
    Nos reunimos con Hércules en el Coliseo.

    Cuando le dijimos que queríamos darle una

    lección a Hades, se ofreció para traernos

    la piedra del Olimpo, capaz de evitar que su

    portador sufra la maldición del Inframundo.

- id: 11083
  text: >+
    Mientras esperábamos a Hércules, nos

    entrenamos bajo las órdenes de Fil.

- id: 11084
  text: >+
    Cuando volvió, Hércules no parecía

    tener muy buen aspecto.

- id: 11085
  text: >+
    La Piedra del Olimpo había sido robada

    por un individuo vestido de negro. Justo

    entonces, Hades llegó diciendo que tenía

    secuestrada a Meg en el Inframundo.

    Hércules quiso ir en su ayuda, pero

    tenía un combate contra la Hidra

    y no podía dejarlo pasar.

- id: 11086
  text: >+
    También Fil fue atacado por alguien de

    negro. ¿Quién sino nosotros podía

    desentrañar el misterio?

- id: 11087
  text: >+
    Aun sufriendo la maldición del Inframundo,

    conseguimos adentrarnos en las

    profundidades de la guarida de Hades.

- id: 11088
  text: >+
    Encontramos y derrotamos a un miembro

    de la Organización {XIII} y recuperamos

    la Piedra del Olimpo.

- id: 11089
  text: >+
    Ya éramos inmunes a la maldición.

    Sora descubrió una extraña cerradura

    en lo profundo del Inframundo y la

    abrió con la llave espada.

- id: 11090
  text: >+
    ¡Allí estaba Meg! Pero ¿por qué iba

    Hades tan sonriente cuando se marchó?

    Hércules llegó justo a tiempo y distrajo al

    enemigo para que nosotros nos lleváramos

    a Meg a la superficie. Sin embargo, Meg

    estaba muy preocupada por su musculoso

    amigo.

- id: 11091
  text: >+
    Volvimos para echar una mano y librarnos

    de Pete, que había estado confabulando

    con Hades. Hades nos obsequió con su

    habitual espantada y estas escalofriantes

    palabras: ‛Deberías ir a ver qué hace esa

    Hidra...’.

- id: 11092
  text: >+
    Algo enorme y misterioso había aparecido

    en la entrada del Inframundo.

- id: 11093
  text: >+
    El Infiernódromo que Zeus había clausurado

    tiempo atrás, había sido desbloqueado y

    volvía a estar operativo.

- id: 11094
  text: >+
    Todos, incluido Hércules, nos vimos

    obligados a participar en la Copa Hades.

- id: 11095
  text: >+
    El Infiernódromo que Zeus había clausurado

    tiempo atrás, había sido desbloqueado y

    volvía a estar operativo. Todos, incluido

    Hércules, nos vimos obligados a participar

    en la Copa Hades.

- id: 11096
  text: >2+


- id: 11097
  text: >+
    Si conseguíamos llegar a las finales, nos

    veríamos las caras con Auron. Hércules

    seguía sin estar en plena forma, aunque se

    las arreglaba para seguir en el torneo.

- id: 11098
  text: >+
    ¡Los aspirantes al título estaban listos!

    Sin embargo, algo le pasaba a Auron. Se

    comportaba de forma muy extraña.

- id: 11099
  text: >+
    Hades, malo malísimo donde los haya,

    había estado controlando la voluntad de

    Auron con una especie de muñeco mágico.

- id: 11100
  text: >+
    Había que recuperar el muñeco para que

    Auron volviese a ser él mismo. Con Auron

    y Hércules ya enzarzados en su combate,

    pusimos rumbo hacia el Inframundo.

- id: 11101
  text: >+
    Encontramos el muñeco, que contenía los

    retazos del tortuoso pasado de Auron. Las

    penurias y el sufrimiento que tuvo que

    soportar habían hecho de su corazón una

    auténtica roca.

- id: 11102
  text: >+
    Nos encontramos con Iago, antiguo

    esbirro de nuestro enemigo, Yafar. Juró

    que había cambiado, así que decidimos

    dejar que nos acompañara al palacio para

    ver a Aladdín.

- id: 11103
  text: >+
    Allí estaba Yasmín, que se sorprendió y

    enfadó al ver a Iago. Seguro que pensó

    que sus intenciones eran malvadas.

- id: 11104
  text: >+
    Por la ciudad, oímos a un mercader que

    gritaba: ‛¡Al ladrón!’, mientras perseguía

    a Abú y a Aladdín.

- id: 11105
  text: >+
    Allí estaba Yasmín, que se sorprendió y

    enfadó al ver a Iago. Seguro que pensó

    que sus intenciones eran malvadas.

    Por la ciudad, oímos a un mercader que

    gritaba: ‛¡Al ladrón!’, mientras perseguía

    a Abú y a Aladdín. Al parecer, Abú había

    robado una lámpara del mercader. Aladdín

    la devolvió a su legítimo dueño... pero

    ¡resultó que dicha lámpara era aquella en

    la que estaba Yafar!

- id: 11106
  text: >+
    No podíamos dejar las cosas así, por lo

    que pedimos al mercader que nos diera

    la lámpara. Sin embargo, nos pidió a

    cambio un tesoro digno de un sultán.

- id: 11107
  text: >+
    No podíamos dejar las cosas así, por lo

    que pedimos al mercader que nos diera

    la lámpara. Sin embargo, nos pidió a

    cambio un tesoro digno de un sultán.

    Ir a por el tesoro del palacio era

    imposible, así que a Iago se le ocurrió que

    quizá podríamos encontrar algo adecuado

    en la Cueva de las Maravillas.

- id: 11108
  text: >+
    Llegamos a la Cueva de las Maravillas,

    antiguo hogar de la lámpara mágica,

    para buscar un tesoro.

- id: 11109
  text: >+
    Conseguimos desactivar las trampas de

    la cueva y proseguimos nuestro camino.

- id: 11110
  text: >+
    Finalmente, una escalera apareció

    ante nosotros.

- id: 11111
  text: >+
    Abrimos la puerta.

- id: 11112
  text: >+
    ¡Tras ella había una sala llena de tesoros!

    Elegimos algo apropiado y volvimos a

    Agrabah, ¡pero no había nadie en la

    tienda del mercader!

- id: 11113
  text: >+
    Pete, que quería hacerse con la lámpara,

    iba tras el mercader.

- id: 11114
  text: >+
    Pete invocó a algunos sincorazón para

    hacerse con la lámpara, pero nos dieron

    mucho trabajo. La lámpara fue sellada

    en lo más profundo del palacio. Quizá

    Iago se había reformado después de

    todo...

- id: 11115
  text: >+
    Las cosas deberían estar ya tranquilas

    por Agrabah, pero...

- id: 11116
  text: >+
    ¡Yafar había vuelto! El mercader le liberó

    de la lámpara. Iago nos dijo que estaba

    en las Ruinas Enterradas del desierto.

- id: 11117
  text: >+
    Iago nos guió hasta un oasis. Una tormenta

    de arena nos impedía el paso, pero Genio

    con su magia nos ayudó a continuar

    nuestro camino hacia las ruinas.

- id: 11118
  text: >+
    Pero Yafar no estaba allí. De hecho,

    Iago nos la había jugado llevándonos

    a las ruinas. ¡Era una estratagema

    de Yafar para mantenernos alejados del

    palacio!

- id: 11119
  text: >+
    Corrimos de vuelta al palacio para acabar

    con las malvadas ambiciones de Yafar.

    Genio reconstruyó la desolada ciudad tras

    el combate, y la paz volvió a reinar.

- id: 11120
  text: >2+


- id: 11121
  text: >+
    Llegamos a un bosque de bambú y

    vimos algo que parecía un enorme y

    amenazador sincorazón. Resultó ser

    Mushu, que nos había acompañado en

    nuestro anterior viaje. Sora conoció a

    Mulán y descubrió que Mushu era un

    dragón guardián de su familia. La chica

    pretendía hacerse pasar por un hombre

    para alistarse en el Ejército Imperial y

    enfrentarse a los hunos.

- id: 11122
  text: >+
    Mulán intentó alistarse con el nombre

    de Ping, pero no la aceptaron. Sora le

    propuso una forma para demostrar su

    valía: tenía que completar las misiones

    del Capitán.

- id: 11123
  text: >+
    Ping se empleó a fondo con las misiones

    y se hizo más fuerte.

- id: 11124
  text: >+
    Aunque aceptaron a Ping en el ejército,

    seguían sin valorarle como soldado.

    Entonces, Mushu vio a Shan Yu entrar

    en una cueva. Ping sería todo un héroe

    si conseguía derrotar al temible caudillo

    huno.

- id: 11125
  text: >+
    Junto a Ping, buscamos a Shan Yu en

    la cueva, pero no lo hallamos. En cambio,

    nos libramos de unos cuantos

    sincorazón que encontramos allí.

- id: 11126
  text: >+
    Cuando volvimos al campamento para

    hablarle al Capitán de la gesta de Ping,

    descubrimos que el ejército de Shan Yu

    había arrasado la aldea y las tropas

    imperiales habían caído.

- id: 11127
  text: >+
    Nos enfrentamos al ejército enemigo en

    la cumbre de la montaña. Ping tuvo una

    idea brillante para acabar con Shan Yu y

    los sincorazón, pero se descubrió que

    en realidad era una mujer y fue expulsada

    del ejército.

- id: 11128
  text: >+
    Mulán estaba decidida a abandonar y

    volver a su hogar. Entonces, vio que

    Shan Yu, al que todos creíamos muerto,

    se dirigía a la Ciudad Imperial.

- id: 11129
  text: >+
    ¡El Emperador estaba en peligro!

- id: 11130
  text: >+
    Llegamos justo a tiempo para derrotar

    a Shan Yu y rescatar al Emperador.

    Tanto el Emperador como el Capitán

    reconocieron a Mulán como la mujer

    más valiente de toda China.

- id: 11131
  text: >+
    La paz reinaba en la Tierra de

    Dragones... ¿o quizá no del todo?

- id: 11132
  text: >+
    Pasamos de nuevo por la aldea y vimos

    a un individuo con ropajes negros.

- id: 11133
  text: >+
    Mulán se nos unió en la persecución

    hasta la cumbre de la montaña.

- id: 11134
  text: >+
    Un extraño sentimiento recorrió el cuerpo

    de Sora cuando se encontró cara a cara

    con el encapuchado. ¿Podría ser Riku?

    Se marchó antes de que reaccionara.

- id: 11135
  text: >+
    Un extraño sentimiento recorrió el cuerpo

    de Sora cuando se encontró cara a cara

    con el encapuchado. ¿Podría ser Riku?

    Se marchó antes de que reaccionara.

    ¡Y apareció un gran sincorazón que se

    encaminó a la Ciudad Imperial!

- id: 11136
  text: >+
    Corrimos hacia la ciudad, pero todo

    parecía estar en orden. Se había visto

    a un hombre de negro en las cercanías.

- id: 11137
  text: >+
    Nos apresuramos hacia el palacio.

- id: 11138
  text: >+
    Las puertas estaban bloqueadas, pero

    la astucia de Mulán nos permitió entrar.

    Dentro estaba el encapuchado de negro.

- id: 11139
  text: >+
    ‛¿Riku?’ Tras la llamada de Sora, el

    hombre reveló su identidad. Se trataba

    de Xigbar, de la Organización {XIII}.

    Tuvimos que ocuparnos de los enemigos

    que Xigbar nos envió.

- id: 11140
  text: >+
    Fuimos a asegurarnos de que el Capitán

    y el Emperador estaban a salvo. Ambos

    aseguraron haber conocido a un hombre

    vestido de negro... pero no era Xigbar.

    ¿Sería Riku? Justo entonces, un gran

    estruendo sacudió el palacio.

- id: 11141
  text: >+
    El gran sincorazón que vimos en la

    cumbre había llegado. Juntos, nos

    libramos de él y salvamos la Ciudad

    Imperial. Las valerosas acciones de

    Mulán la hicieron merecedora de un

    puesto en la guardia junto al Capitán.

    Sora, de alguna forma, sentía que Riku

    se encontraba bien... allí donde estuviese.

- id: 11142
  text: >+
    Sora volvió al Bosque de los Cien Acres.

- id: 11143
  text: >+
    Pooh estaba frente a su casa,

    ensimismado en sus pensamientos.

- id: 11144
  text: >+
    Cuando Sora trató de hablar con Pooh,

    una extraña fuerza le lanzó fuera del

    libro, que estaba a punto de ser robado

    por los sincorazón. Sora lo recuperó y

    volvió al libro, pero resultó que lo único

    que quedaba allí era la casa de Pooh.

- id: 11145
  text: >+
    Sin embargo, Sora se alegró al ver

    que Pooh parecía estar bien.

- id: 11146
  text: >+
    Pero solo lo parecía. Las páginas que

    los sincorazón arrancaron habían

    afectado a la memoria de Pooh. ¡Casi

    no se acordaba de nada!

- id: 11147
  text: >+
    Una página de sobra.

- id: 11148
  text: >+
    Cuando Sora llegó con la página arrancada,

    apareció un árbol con una pequeña puerta.

- id: 11149
  text: >+
    Sora vio cómo una ráfaga de viento

    había atrapado en el aire a Piglet.

- id: 11150
  text: >+
    Sora rescató a Piglet, pero le afectó

    tanto que Pooh no se acordara de él,

    que el viento volvió a llevárselo por los

    aires.

- id: 11151
  text: >+
    Sora trató de ayudar a Piglet, pero este

    tenía que dejarse caer desde lo alto de

    un árbol. Su valor hizo que Pooh

    recobrase algo de su memoria:

    se acordó de Piglet, pero no de Sora.

- id: 11152
  text: >+
    Cuando Sora llegó con la página

    arrancada, apareció un árbol rodeado

    por un jardín.

- id: 11153
  text: >+
    Pooh tampoco se acordaba de Igor.

    Su amigo creía que la memoria de Pooh

    mejoraría si comía hasta llenar su tripita,

    así que le llevó hasta un montón de miel.

- id: 11154
  text: >+
    Pero la miel no surtió ningún efecto,

    pues Pooh no recordó nada. Conejo,

    el dueño de la miel, pensó que quizá

    el oso necesitaba mucha más miel.

- id: 11155
  text: >+
    Tampoco funcionó. Al ver a Conejo

    devanándose los sesos, Pooh al fin

    le recordó, y también a Igor. Sin

    embargo, Sora seguía sin resultarle

    familiar.

- id: 11156
  text: >+
    Cuando Sora llegó con la página

    arrancada, apareció un árbol lleno

    de paquetes.

- id: 11157
  text: >+
    Preocupados por Pooh, Cangu y Rito

    le trajeron una medicina, pero Tigger

    se la llevó dando brincos.

- id: 11158
  text: >+
    Tigger sugirió que si todos botaban

    juntos, quizá Pooh recuperaría la

    memoria.

- id: 11159
  text: >+
    Pero tampoco eso surtió efecto. Al ver

    a Tigger deprimido, Pooh recordó al

    resto de sus amigos. Más tarde, en un

    sueño, Pooh estuvo a punto de

    recordar algo...

- id: 11160
  text: >+
    Cuando Sora llegó con la página

    arrancada, apareció una tenebrosa

    cueva.

- id: 11161
  text: >+
    Al parecer, Pooh se había adentrado

    a solas en la cueva.

- id: 11162
  text: >+
    Iba buscando a alguien que le hizo una

    promesa muy especial. ¡Y resultó que

    se trataba de Sora! Ambos se cogieron

    de la mano y volvieron a casa felices

    junto con todos sus amigos.

- id: 11163
  text: >+
    Cuando Sora llegó con la página

    arrancada, apareció una colina estrellada.

- id: 11164
  text: >+
    ¡Pooh había metido la cabeza en un tarro

    de miel y no podía sacarla! ¡Oso torpón!

- id: 11165
  text: >+
    Pooh buscaba una forma de evitar que

    Sora se marchara. Le preguntó si había

    alguna forma de que no se marchase.

    Sora señaló el corazón de Pooh y le

    dijo que él siempre estaría ahí.

- id: 11166
  text: >+
    Nada más llegar a una garganta, unas

    hienas nos atacaron. Su nuevo aspecto

    "salvaje" obligó a Sora, Donald y Goofy

    a practicar para acostumbrarse a la

    nueva forma de moverse.

- id: 11167
  text: >+
    Luego conocieron a Nala, una leona

    que los sincorazón tenían acorralada.

    Nos habló de la triste situación de su

    tierra natal, y Sora decidió ayudarla.

- id: 11168
  text: >+
    Pero según Rafiki, aquel que salvara

    las Tierras del Reino se convertiría

    en rey. Eso dejaba fuera a Sora.

- id: 11169
  text: >+
    Cuando nos disponíamos a dejar las

    Tierras del Reino, el rey Scar y sus

    hienas nos rodearon; pero Nala nos

    ayudó a escapar. Cuando Sora le

    preguntó si había alguien más digno

    de ser rey, la leona murmuró: ‛Si

    Simba estuviera aquí...’

- id: 11170
  text: >+
    Un año antes, Simba había luchado con

    Sora. ¡Nala saltó de alegría al conocer

    la noticia!

- id: 11171
  text: >+
    Scar contó a Nala que Simba había

    muerto junto con Mufasa, el anterior

    rey. Justo entonces, Rafiki apareció y

    señaló hacia el oasis.

- id: 11172
  text: >+
    Allí es donde estaba Simba.

- id: 11173
  text: >+
    Nala le pidió que volviese a las Tierras

    del Reino, pero Simba se negó y dijo

    que prefería olvidar el pasado y vivir

    el presente... ‛hakuna matata’.

- id: 11174
  text: >+
    Simba se sentía culpable por la muerte

    de su padre, pero tuvo una visión de él

    gracias a la que recobró el coraje para

    volver a las Tierras del Reino.

- id: 11175
  text: >+
    Simba desafió a Scar a un combate.

    Durante la lucha, Scar confesó

    haber asesinado al rey Mufasa.

    ¡Simba lanzó un rugió de rabia!

- id: 11176
  text: >+
    Simba derrotó a Scar y rugió triunfal

    desde lo alto de la Roca del Clan. Las

    leonas respondieron a la llamada de su

    recién coronado monarca.

- id: 11177
  text: >+
    Simba ya era rey de las Tierras del Reino.

- id: 11178
  text: >2+


- id: 11179
  text: >+
    Nos encontramos con las hienas en la

    sabana. Con solo oír el nombre de

    Simba, se partieron de risa. Nos pareció

    muy extraño. Cuando íbamos en busca

    de Simba se nos apareció el fantasma

    de Scar.

- id: 11180
  text: >+
    Aunque todo apuntaba a que era una

    prueba del declive del reino, Simba no

    parecía dispuesto a actuar, y su

    comportamiento no hacía más que causar

    desasosiego entre sus súbditos.

- id: 11181
  text: >+
    Había una razón para las tribulaciones

    de Simba: no dejaba de pensar cómo

    actuaría su padre en esa situación. Le

    ayudamos a ver que era su criterio lo

    que importaba, y finalmente recuperó la

    confianza en su capacidad de liderazgo.

- id: 11182
  text: >+
    Según Rafiki, el fantasma de Scar era

    la representación de las debilidades

    de Simba.

- id: 11183
  text: ''
- id: 11184
  text: >+
    Nos dirigimos al Cementerio de Elefantes

    para averiguar el significado de las palabras

    del místico simio. Preguntamos a las hienas

    por el fantasma de Scar, ¡que apareció de

    repente! Al verlo, Simba huyó.

- id: 11185
  text: >+
    Nos encargamos de estimular a Simba y,

    finalmente, se dio cuenta de que sus

    amigos estaban allí para luchar a su lado.

    Simba consiguió derrotar al fantasma de

    Scar.

- id: 11186
  text: >+
    Simba rescató a Nala de las garras de

    un sincorazón gigante, y la paz volvió

    a llenar las Tierras del Reino.

- id: 11187
  text: >+
    Decidimos hacer una visita a Atlántica,

    el reino submarino, y ver una vez más

    a Ariel.

- id: 11188
  text: >+
    Todos estaban preparándose para un

    gran musical, pero Ariel no conseguía

    concentrarse en los ensayos. Sebastián

    pidió a Sora, Donald y Goofy que

    participaran en la obra, pero ni con eso

    consiguieron que Ariel se centrara.

- id: 11189
  text: >+
    Al parecer, Ariel tenía curiosidad por el

    mundo humano. Flounder sugirió que

    podían enseñarle una estatua que había

    encontrado. Creía que con eso la

    animarían, pues ella adoraba la superficie.

- id: 11190
  text: >+
    A Ariel le encantó el regalo de Flounder,

    ya que la estatua representaba al hombre

    por el que Ariel suspiraba.

- id: 11191
  text: >+
    Ariel estaba enamorada de un príncipe humano.

- id: 11192
  text: >+
    Pero, como es lógico, vivía en el mundo

    humano y la única forma para que Ariel

    estuviera con él sería convirtiéndose en

    humana. Úrsula la convenció para que le

    diera su voz a cambio de su deseo.

- id: 11193
  text: >+
    Ariel y Eric lo estaban pasando genial

    juntos... pero Úrsula tenía otros planes.

    Sora evitó que usara la voz de Ariel para

    quedarse con Eric, pero el Rey Tritón

    fue transformado cuando intentó salvar

    a su hija. Por suerte, Eric vino al rescate

    y ayudó a Sora y a sus amigos a derrotar a

    la malvada bruja de los mares.

- id: 11194
  text: >+
    Eric descubrió que Ariel era una sirena,

    pero eso no hizo que sus sentimientos

    por ella cambiaran. Estaban hechos el uno

    para el otro. El musical de Sebastián fue

    un auténtico éxito, con Sora, Donald y

    Goofy en los papeles protagonistas. Y así,

    tierra y mar convivieron en armonía.

- id: 11195
  text: >+
    Hicimos una visita al Castillo Disney,

    algo no parecía ir bien.

- id: 11196
  text: >+
    Los sincorazón habían invadido el pacífico

    castillo. La reina Minnie nos puso al tanto

    de todo y, a continuación, nos separamos

    para averiguar qué estaba pasando.

- id: 11197
  text: >+
    Sora y la reina Minnie se dirigieron a

    la sala de audiencias, abatiendo a su

    paso a cuantos sincorazón encontraron.

- id: 11198
  text: >+
    La razón de los problemas la hallamos

    en el Salón de la Piedra Angular, oculto

    tras el trono. La Piedra Angular de Luz,

    que mantenía la paz del castillo, estaba

    completamente rodeada de zarzas. ¡No

    podía ser obra de nadie más sino de

    Maléfica!

- id: 11199
  text: >+
    Siguiendo el consejo de la reina Minnie,

    nos encaminamos a Bastión Hueco.

    Merlín creó una extraña puerta para

    nosotros. Dijo que podríamos salvar

    el castillo si cerrábamos otra puerta que

    había más allá de la que él creó.

- id: 11200
  text: >+
    Al llegar al mundo tras la misteriosa

    puerta, nos encontramos en un

    mundo en blanco y negro con

    cierto toque nostálgico.

- id: 11201
  text: >+
    Cruzamos la puerta de Merlín hacia

    un mundo en blanco y negro con la

    intención de salvar el castillo.

- id: 11202
  text: >+
    Nos encontramos con Pete, pero parecía

    alguien totalmente diferente. Quizá no

    fuera él quien estaba amenazando el

    castillo. Mientras buscábamos la otra

    puerta, descubrimos una extraña ventana.

    Al tirar de la cuerda, vimos lo que había

    ocurrido en ese mundo instantes antes

    de nuestra llegada.

- id: 11203
  text: >+
    Al mirar por otra ventana, vimos cómo

    Maléfica reprendía muy enfadada a...

    alguien.

- id: 11204
  text: >+
    Otra ventana nos mostró una puerta

    igual a la que Merlín había creado. Debía

    de conducir al mismo mundo en blanco

    y negro en el que nos encontrábamos.

- id: 11205
  text: >+
    Finalmente descubrimos la verdad: estas

    misteriosas puertas estaban conectadas

    con el pasado... ¡y ahí era precisamente

    donde nos encontrábamos!

- id: 11206
  text: >+
    La última ventana nos mostró a

    Pete, pero no al que encontramos

    al llegar a este mundo, sino al Pete

    malvado que ya conocíamos.

- id: 11207
  text: >+
    Detuvimos el barco de Pete y

    evitamos que la Piedra Angular

    de Luz sufriera daño alguno.

- id: 11208
  text: >+
    Con la llave espada, Sora selló la

    puerta para que Pete no pudiese

    volver jamás al pasado. La Piedra

    Angular de Luz fue devuelta a su

    lugar, lo que eliminó del castillo

    todo atisbo de oscuridad.

- id: 11209
  text: >+
    Pasamos por Ciudad de Halloween,

    y nos sorprendió el aspecto que tenía.

- id: 11210
  text: >2+


- id: 11211
  text: >+
    Jack, obsesionado con la Navidad, había

    decorado la ciudad con la esperanza de

    celebrar la Navidad en su ciudad. Sin

    hacer caso de los temores de Sally,

    Jack partió para ver a Santa Claus.

- id: 11212
  text: >+
    Entonces, aparecieron los sincorazón

    en la ciudad. ‛¿Cómo podría relajarse

    Santa Clavos con todo lo que está

    sucediendo?’, dijo Jack, y nos pidió

    que fuéramos sus guardaespaldas.

- id: 11213
  text: >+
    Santa Claus vivía en Ciudad de la

    Navidad, un bello y colorido lugar

    que nos deslumbró nada más llegar.

- id: 11214
  text: >+
    Pero también allí estaban los sincorazón.

    Luchamos codo con codo para llegar

    hasta la casa de Santa Claus.

- id: 11215
  text: >+
    Nos alegramos mucho de que Santa

    Claus estuviese bien, pero, de repente,

    oímos un ruido en uno de los cuartos.

- id: 11216
  text: >2+


- id: 11217
  text: >+
    Vimos cómo Lock, Shock y Barrel

    salían corriendo del taller de juguetes.

- id: 11218
  text: >2+


- id: 11219
  text: >+
    Seguimos las huellas de los tres críos

    hasta Ciudad de Halloween y hallamos

    a los tres malandrines, que nos dijeron

    que Oogie había regresado. Tras eso,

    se escaparon. ¡Maléfica había devuelto

    la vida a Oogie Boogie! Por lo visto,

    los temores de Sally se habían hecho

    realidad. ¡Oogie había raptado a Santa

    Claus!

- id: 11220
  text: >+
    Nos apresuramos hacia Ciudad de la

    Navidad tras los pasos de Oogie.

- id: 11221
  text: >+
    Oogie trataba de apoderarse del taller,

    pero conseguimos derrotarle. Con los

    problemas resueltos, Jack pidió permiso

    a Santa Claus para repartir los regalos

    en su lugar. Sin embargo, el anciano le

    recordó que cada uno tenía asignado

    un cometido muy importante, tras lo que

    Jack volvió a su ciudad para seguir

    siendo el Rey Calabaza.

- id: 11223
  text: >+
    La Navidad estaba ya muy cerca.

- id: 11224
  text: >2+


- id: 11225
  text: >+
    Al llegar a Ciudad de Halloween, hallamos

    regalos tirados por todo el lugar. Tras

    devolvérselos a Santa Claus, nos dijo

    que se los habían robado. Estábamos

    decididos a salir en busca del culpable

    cuando nos sobresaltó un ruido que

    provenía del taller de juguetes.

- id: 11226
  text: >2+


- id: 11227
  text: >+
    Al entrar en el taller, vimos a Lock,

    Shock y Barrel. Nos dijeron que solo

    estaban buscando piezas para el

    experimento del Dr. Finkelstein. Sally

    llegó para decirnos que los sincorazón

    estaban en la plaza de la ciudad.

    ¿Serían ellos los culpables del robo?

- id: 11228
  text: >2+


- id: 11229
  text: >+
    No habían sido los sincorazón. Y el

    experimento del Doctor también había

    sido robado. ¿Quién sería el ladrón?

    No nos quedaba sino prepararle una trampa,

    así que utilizamos el taller de Santa Claus

    para preparar unos regalos trampa.

- id: 11230
  text: >+
    Utilizamos los regalos como cebo para

    atrapar al ladrón.

- id: 11231
  text: >+
    Cuando llegamos a Port Royal, parecía

    haber algún tipo de problema en el

    puerto.

- id: 11232
  text: >+
    Allí encontramos a Pete con una

    tripulación de piratas zombis.

    Dijeron algo sobre un medallón y se

    fueron hacia la ciudad.

- id: 11233
  text: >+
    Fuimos tras ellos y vimos cómo los

    piratas raptaban a Elizabeth, la hija

    del Gobernador. Decidimos ir tras ellos

    junto con un joven llamado Will.

- id: 11234
  text: >+
    Pero los piratas ya habían zarpado.

    Conseguimos convencer a Jack Sparrow,

    un solitario pirata que conocimos en el

    puerto, para robar el "Interceptor" de la

    Marina Real y hacernos a la mar tras el

    barco pirata, la "Perla Negra".

- id: 11235
  text: >+
    Entretanto, Barbossa desveló su secreto:

    por robar un tesoro de oro azteca, su

    tripulación y él estaban bajo una terrible

    maldición. Para romperla, todas las piezas

    de oro debían ser devueltas, y el agravio

    por la sangre reparado...

- id: 11236
  text: >2+


- id: 11237
  text: >2+


- id: 11238
  text: >+
    Resultó que la "Perla Negra" había

    pertenecido a Jack, hasta que Barbossa

    se lo robó. Lo único que hizo que Jack

    nos ayudara fue la oportunidad de

    recuperar el barco. Con su brújula,

    Jack dirigió el "Interceptor" a través

    de los mares. Llegamos a la Isla de

    Muerta, donde estaba el oro azteca.

    Jack nos pidió que vigilásemos el barco

    mientras Will y él trataban de rescatar

    a Elizabeth, pero como tardaban mucho,

    empezamos a preocuparnos. En la gruta,

    los piratas vociferaban frente al oro. Ya

    habían reunido todas las piezas.

    Ahora solo les quedaba reparar el agravio

    por la sangre y se rompería la maldición...

- id: 11239
  text: >+
    ... Eso, claro, si la sangre de Elizabeth

    hubiese funcionado. Aprovechando el

    desconcierto de los piratas, Will pudo

    escapar con Elizabeth.

- id: 11240
  text: >2+


- id: 11241
  text: >+
    De camino a Port Royal, obtuvimos la

    respuesta al misterio de la sangre. No

    era la de Elizabeth la que necesitaban,

    sino la del padre de Will... ¡la sangre de

    un pirata! La misma que corría por las

    venas del joven Will. El malévolo Barbossa

    persiguió el "Interceptor", raptó a Will

    y llenó de explosivos nuestro navío.

- id: 11242
  text: >+
    Todos, incluido Jack, estábamos con el

    agua al cuello, pero logramos salvar el

    cuello y partimos al rescate de Will.

- id: 11243
  text: >+
    Salimos victoriosos del combate contra

    Barbossa... ¡gracias a que Jack también

    era víctima de la maldición! Will y

    Elizabeth estaban radiantes por su

    reencuentro, y Jack levó anclas y zarpó

    en su amada "Perla Negra" otra vez.

- id: 11244
  text: >+
    La ciudad parecía tranquila... pero

    ¿realmente lo estaba?

- id: 11245
  text: >+
    Como ocurriera la primera vez que

    llegamos a Port Royal, algo pasaba

    en el puerto.

- id: 11246
  text: >+
    La maldición, que suponíamos rota,

    no lo estaba, pues el origen del tumulto

    parecían ser los piratas malditos. Los

    derrotamos con la ayuda de Jack y, a

    continuación, apareció Elizabeth. Al

    parecer, Will, creyendo que el oro

    podría ser la causa del problema, había

    partido hacia Isla de Muerta.

- id: 11247
  text: >+
    Tras los ruegos de Elizabeth, zarpamos en

    busca de Will, al que hallamos a la deriva,

    con los restos de un naufragio. Dijo que

    la Organización {XIII} había robado el oro.

- id: 11248
  text: >+
    Jack no quería saber nada del asunto,

    pero apareció un miembro de la

    Organización. Aprovechando que había

    invocado el ‛parlamento’ del código

    de los piratas, se llevó varias piezas del

    oro. En la confusión, un gran monstruo

    nos atacó y el "Interceptor" fue hundido.

- id: 11249
  text: >+
    La corriente nos arrastró hasta un

    cementerio de barcos. Era extraño,

    pero la maldición solo afectaba a Jack.

- id: 11250
  text: >+
    ‛Hacen que los piratas parezcamos

    gente de bien’, dijo Jack, tras lo que

    partimos tras la Organización y el oro.

    El combate definitivo se acabaría

    librando en Port Royal.

- id: 11251
  text: >+
    Derrotamos al monstruo y libramos a

    Jack de la maldición. La Organización

    logró escapar, pero enviamos el arca

    con el oro azteca al fondo del mar para

    que no diera más problemas. Y una vez

    más, el legendario pirata Jack Sparrow

    partió en la "Perla Negra".

- id: 11252
  text: >+
    Al toquetear el ordenador de Ansem, el

    PCM nos arrastró hasta el interior del

    sistema informático. El comandante Sark

    nos metió en una celda, donde conocimos

    a Tron, un programa de seguridad.

- id: 11253
  text: >+
    Escapamos de la celda con ayuda de

    Tron, y nos encaminamos hacia el

    núcleo de energía situado en el cañón.

- id: 11254
  text: >+
    Lo necesitábamos para devolver la

    energía al terminal que teníamos que

    usar para volver al mundo exterior.

- id: 11255
  text: >+
    Cuando todo estaba listo para nuestro

    regreso, Tron nos pidió un favor.

- id: 11256
  text: >+
    Para acceder al entorno de datos llamado

    DTD, necesitábamos encontrar al usuario

    de Tron y pedirle la contraseña...

    ¡pero el usuario no era otro que Ansem!

- id: 11257
  text: >+
    Una vez en el mundo exterior, unos

    garabatos en una pared (‛Door to

    Darkness’) y la ayuda del rey nos

    sirvieron para descubrir la contraseña:

    los nombres de las Siete Princesas,

    que habíamos usado para abrir la puerta.

- id: 11258
  text: >+
    Tron introdujo la contraseña y

    desbloqueó el entorno de datos,

    pero el PCM envió un programa

    hostil contra la ciudad.

- id: 11259
  text: >+
    Corrimos hacia la Torre I/O, pero el

    programa seguía transmitiéndose.

- id: 11260
  text: >+
    Conseguimos destruir el programa hostil

    y con ello salvamos la ciudad.

- id: 11261
  text: >+
    Tras la lucha, Tron nos habló sobre

    Ansem. Tanto Tron como el PCM

    habían sido mejorados por Ansem, pero

    ¿por qué actualizar dos programas

    antagónicos? No acabábamos de

    entenderlo, pero sabíamos que no

    tardaríamos en encontrar la respuesta.

    Unidos a Tron por una conexión muy

    especial, volvimos al mundo exterior.

- id: 11262
  text: >+
    Las cosas deberían andar tranquilas en

    el mundo informático...

- id: 11263
  text: >+
    El PCM tenía en jaque a la ciudad, así

    que volvimos a entrar en el mundo de

    los ordenadores.

- id: 11264
  text: >+
    El PCM lo tenía todo listo para iniciar

    su guerra contra los usuarios. De nuevo

    junto a Tron, fuimos a descargar un

    programa diseñado especialmente para

    erradicar al PCM.

- id: 11265
  text: >+
    León, por su parte, hacía todo lo

    posible en el exterior.

- id: 11266
  text: >+
    Descargamos el programa en la Torre

    I/O, lo que fortaleció a Tron y nos dio

    acceso a un navegador solar.

- id: 11267
  text: >+
    La batalla definitiva se acercaba...

    Subimos a bordo del navegador solar

    y fuimos hacia la loma del PCM.

- id: 11268
  text: >+
    Derrotamos a Sark y arruinamos los

    ambiciosos planes del PCM. Antes de

    despedirnos de Tron, prometimos que

    algún día volveríamos a vernos. Tron

    usó el sistema para enviarnos un regalo:

    una visión de la ciudad en sus orígenes.

- id: 11269
  text: >+
    Axel usó su último aliento para ayudarnos

    a escapar de la oscuridad. Nos vimos en

    un mundo iluminado por la tétrica luz de

    la luna. Al parecer, Kairi estaba cautiva

    en las mazmorras del castillo de esa

    extraña ciudad.

- id: 11270
  text: Un mensaje
- id: 11271
  text: Dar las gracias a Namine.
- id: 11272
  text: El despertar
- id: 11273
  text: >-
    Sora despierta de un largo sueño y se

    reencuentra con sus amigos Donald y Goofy.
- id: 11274
  text: El mentor del rey
- id: 11275
  text: >-
    En la misteriosa torre, vivía el venerable

    Yen Sid, mentor de Magia del rey.
- id: 11276
  text: La llegada de Kairi
- id: 11277
  text: >-
    Kairi llega a Villa Crepúsculo en

    busca de Sora.
- id: 11278
  text: Camino adelante
- id: 11279
  text: >-
    La llave espada de Sora comenzó a

    brillar y abrió un camino a otro mundo.
- id: 11280
  text: Otro mundo
- id: 11281
  text: >-
    Sora y sus amigos habían viajado

    a una Villa Crepúsculo paralela.
- id: 11282
  text: En la oscuridad
- id: 11283
  text: >-
    El poder de Axel reveló el camino al

    castillo de la Organización {XIII}.
- id: 11284
  text: Datos guardados
- id: 11285
  text: ' '
- id: 11286
  text: El Comité
- id: 11287
  text: >-
    León y sus amigos preparaban la

    reconstrucción de Bastión Hueco.
- id: 11288
  text: La Organización {XIII}
- id: 11289
  text: >-
    Los miembros de la Organización {XIII}

    se interpusieron en el camino de Sora.
- id: 11290
  text: Comienza el viaje
- id: 11291
  text: >-
    La llave espada abrió una nueva

    puerta entre los mundos.
- id: 11292
  text: Ansem el Sabio
- id: 11293
  text: >-
    Sora y sus amigos no habían vencido al

    verdadero Ansem, sino a su aprendiz, Xehanort.
- id: 11294
  text: Batalla Real
- id: 11295
  text: >-
    Hordas de incorpóreos y de sincorazón

    habían infestado Bastión Hueco.
- id: 11296
  text: El rey decide
- id: 11297
  text: El rey ocupó su lugar en la feroz batalla.
- id: 11298
  text: Otra vez los sincorazón
- id: 11299
  text: >-
    Una vez más, los sincorazón invadieron

    la pacífica ciudad.
- id: 11300
  text: Su verdadero nombre
- id: 11301
  text: >-
    La paz vuelve a reinar, y todos recuerdan el

    verdadero nombre del lugar: Vergel Radiante.
- id: 11302
  text: Reencuentro con Bestia
- id: 11303
  text: >-
    Sora y sus amigos se reencuentran con

    Bestia, que vive obsesionado por la rosa.
- id: 11304
  text: El secreto del castillo
- id: 11305
  text: >-
    Los sirvientes, convertidos en objetos domésticos,

    estaban encerrados en las mazmorras.
- id: 11306
  text: Bestia engañado
- id: 11307
  text: >-
    La Organización {XIII} le había tendido

    una trampa a Bestia.
- id: 11308
  text: La batalla del salón de baile
- id: 11309
  text: >-
    En el salón de baile, Sora y sus amigos

    combatieron al sincorazón que atacó a Bella.
- id: 11310
  text: Una pareja de gala
- id: 11311
  text: >-
    Los dos se habían vestido con sus mejores

    prendas para un gran baile, pero...
- id: 11312
  text: Lo más preciado
- id: 11313
  text: >-
    Sin su rosa, Bestia estaba tan triste

    que ordenó a Bella abandonar el castillo.
- id: 11314
  text: La victoria de Bella
- id: 11315
  text: >-
    Bella aprovecha la oportunidad y

    recupera la rosa de manos de Xaldin.
- id: 11316
  text: Juntos para siempre
- id: 11317
  text: >-
    Las palabras de Bestia hacen sonreír a Bella:

    ‛Bella, quiero que te quedes...’.
- id: 11318
  text: Auron contra Hades
- id: 11319
  text: >-
    Auron es llamado al Inframundo para hacer

    de asesino, pero se niega a cooperar.
- id: 11320
  text: Reunión heroica
- id: 11321
  text: >-
    Sora y sus amigos se reencuentran

    con Hércules en el Coliseo.
- id: 11322
  text: Megara cautiva
- id: 11323
  text: >-
    Sora va a rescatar a Meg y lucha con

    Pete, que está confabulado con Hades.
- id: 11324
  text: El Coliseo destruido
- id: 11325
  text: >-
    Enfurecida, la Hidra regresa y

    destruye el Coliseo.
- id: 11326
  text: La Copa Hades
- id: 11327
  text: >-
    Hades quiere que el debilitado Hércules

    participe en su torneo.
- id: 11328
  text: El títere de Hades
- id: 11329
  text: >-
    Hades controlaba a Auron para que

    este se deshiciera de Hércules.
- id: 11330
  text: El regreso del héroe
- id: 11331
  text: >-
    Hércules rescata a Megara y vuelve

    a sentirse un verdadero héroe.
- id: 11332
  text: ¡Al fin, héroes!
- id: 11333
  text: >-
    Sora y sus amigos se convierten en

    héroes honorarios.
- id: 11334
  text: El ladrón de la lámpara
- id: 11335
  text: >-
    Aladdín perseguía a Abú, que corría con

    la lámpara por las calles de Agrabah.
- id: 11336
  text: En busca de tesoros
- id: 11337
  text: >-
    Sora y compañía se dirigen a la Cueva de las

    Maravillas a buscar tesoros para el mercader.
- id: 11338
  text: Una dura prueba superada
- id: 11339
  text: >-
    La Cueva de las Maravillas guardaba

    montones de tesoros.
- id: 11340
  text: Embotellado
- id: 11341
  text: >-
    La lámpara que encerraba a Yafar estaba

    a salvo en el sótano del palacio.
- id: 11342
  text: Yafar liberado
- id: 11343
  text: >-
    El mercader liberó a Yafar de su

    encierro en la lámpara.
- id: 11344
  text: La alfombra voladora
- id: 11345
  text: >-
    La alfombra lleva a Sora y sus amigos

    a las ruinas para luchar contra Yafar.
- id: 11346
  text: La trampa de Yafar
- id: 11347
  text: >-
    Iago los condujo a las ruinas, pero allí

    no había rastro de Yafar.
- id: 11348
  text: Por arte de magia
- id: 11349
  text: >-
    Genio reconstruye Agrabah después

    de la destructiva batalla contra Yafar.
- id: 11350
  text: Mushu y Ping
- id: 11351
  text: >-
    En el bosque de bambú estaban Mushu y Mulán,

    que se hacía pasar por un muchacho llamado ‛Ping’.
- id: 11352
  text: ¡Avalancha!
- id: 11353
  text: >-
    Para vencer a Shan Yu, Mulán disparó un cañón

    y provocó una enorme avalancha.
- id: 11354
  text: Mulán descubierta
- id: 11355
  text: >-
    Cuando el Capitán Shang descubre que Mulán

    es una mujer, la expulsa del ejército.
- id: 11356
  text: La más valiente de China
- id: 11357
  text: >-
    El Emperador agradeció a Mulán haber

    vencido a Shan Yu y salvado a China.
- id: 11358
  text: Un hombre de negro
- id: 11359
  text: >-
    Sora ve a un hombre de negro

    en Tung Shao.
- id: 11360
  text: Temblores de tierra
- id: 11361
  text: >-
    El sincorazón que apareció en

    Tung Shao voló hacia la ciudad.
- id: 11362
  text: ¿Podría ser Riku?
- id: 11363
  text: >-
    El hombre de negro del palacio no era

    Riku, sino Xigbar, de la Organización {XIII}
- id: 11364
  text: Buenos amigos
- id: 11365
  text: >-
    En reconocimiento por sus esfuerzos, Mulán

    sirve al Emperador junto al Capitán Shang.
- id: 11366
  text: Recuerdos perdidos
- id: 11367
  text: >-
    Los sincorazón despedazaron su libro,

    y ahora Pooh no puede recordar nada.
- id: 11368
  text: Recuerdos encontrados
- id: 11369
  text: >-
    Pooh comienza a recordar a sus amigos

    del Bosque de los Cien Acres.
- id: 11370
  text: ¡Tú eres... Sora!
- id: 11371
  text: De repente, Pooh recordó a Sora.
- id: 11372
  text: Siempre estaré aquí
- id: 11373
  text: >-
    Sora les promete a Pooh y sus amigos

    que siempre estará junto a ellos.
- id: 11374
  text: Pooh 5
- id: 11375
  text: Número 5
- id: 11376
  text: Pooh 6
- id: 11377
  text: Número 6
- id: 11378
  text: Pooh 7
- id: 11379
  text: Número 7
- id: 11380
  text: Pooh 8
- id: 11381
  text: Número 8
- id: 11382
  text: Un encuentro casual
- id: 11383
  text: >-
    En una noche tormentosa, Ariel rescata

    al príncipe Eric de un naufragio.
- id: 11384
  text: Ariel, humana
- id: 11385
  text: >-
    Ariel firma un contrato con Úrsula y le entrega

    su hermosa voz para que la haga humana.
- id: 11386
  text: La batalla con Úrsula
- id: 11387
  text: >-
    Blandiendo el tridente, una gigantesca

    Úrsula ataca a Sora.
- id: 11388
  text: Dos mundos se vuelven uno
- id: 11389
  text: >-
    Los deseos de Ariel se hacen realidad:

    la tierra y el mar se unen al fin.
- id: 11390
  text: El Castillo Disney
- id: 11391
  text: >-
    Sora llega al Castillo Disney

    para ayudar a la reina Minnie.
- id: 11392
  text: Encuentro con la reina
- id: 11393
  text: >-
    Sora y sus amigos hablan con la reina

    sobre los problemas que aquejan al castillo.
- id: 11394
  text: La Piedra Angular
- id: 11395
  text: >-
    Maléfica ha cubierto de espinas el Salón

    de la Piedra Angular de Luz.
- id: 11396
  text: Vuelve la tranquilidad
- id: 11397
  text: >-
    Los amigos viajan al pasado para proteger

    la Piedra Angular y la paz vuelve al castillo.
- id: 11398
  text: ¿Pete?
- id: 11399
  text: >-
    El Pete del mundo en blanco y negro

    era el Pete del pasado.
- id: 11400
  text: ¿El rey?
- id: 11401
  text: >-
    Sora y sus amigos lucharon contra los

    sincorazón y salvaron al rey en el pasado.
- id: 11402
  text: Pete contra Pete
- id: 11403
  text: >-
    El Pete del pasado se enfrenta

    al Pete actual por el bote de vapor.
- id: 11404
  text: ¡Todos a bordo!
- id: 11405
  text: >-
    Pete agradece a Sora haber

    recuperado su vapor.
- id: 11406
  text: ¿Feliz Halloween?
- id: 11407
  text: >-
    Jack está obsesionado con llevar

    la Navidad a Ciudad de Halloween.
- id: 11408
  text: Santa Clavos
- id: 11409
  text: >-
    Sora conoce a Santa Claus en

    la Ciudad de la Navidad.
- id: 11410
  text: El regreso de Oogie
- id: 11411
  text: >-
    Maléfica ha revivido al malvado

    Oogie Boogie.
- id: 11412
  text: Santa Jack
- id: 11413
  text: >-
    Santa ayuda a Jack a recordar que

    lo suyo es asustar a la gente.
- id: 11414
  text: El ladrón de regalos
- id: 11415
  text: >-
    Acusado de robar regalos, Jack

    sale en busca del verdadero ladrón.
- id: 11416
  text: El trío faenas
- id: 11417
  text: >-
    Lock, Shock y Barrel no tenían nada

    que ver con el robo.
- id: 11418
  text: El verdadero culpable
- id: 11419
  text: >-
    El experimento del Dr. Finkelstein había

    robado los regalos.
- id: 11420
  text: Desde el corazón
- id: 11421
  text: >-
    Lo que importa no es el regalo,

    sino el acto de darlo.
- id: 11422
  text: Amigos incondicionales
- id: 11423
  text: >-
    Sora, sus amigos y Will persiguen

    a los piratas que se llevaron a Elizabeth.
- id: 11424
  text: La maldición de los zombis
- id: 11425
  text: >-
    A la luz de la luna, los piratas malditos

    se convierten en horrendos esqueletos.
- id: 11426
  text: Una llamada cercana
- id: 11427
  text: >-
    Los viles planes de Barbossa ponen

    a Sora y compañía en serios apuros.
- id: 11428
  text: Se levanta la maldición
- id: 11429
  text: >-
    Jack usa el poder de la maldición

    para vencer a su antiguo rival, Barbossa.
- id: 11430
  text: El regreso de la maldición
- id: 11431
  text: >-
    La maldición debería haber terminado, pero

    los piratas zombis han vuelto.
- id: 11432
  text: ¡Parlamento!
- id: 11433
  text: >-
    Luxord, de la Organización {XIII}, ve

    su oportunidad de traer a un sincorazón.
- id: 11434
  text: Hacia Port Royal
- id: 11435
  text: >-
    Decididos a detener a la Organización,

    Jack, Sora y sus amigos se dirigen a Port Royal.
- id: 11436
  text: Botín de guerra
- id: 11437
  text: >-
    Tras acabar con el oro azteca, Jack pide

    la llave espada como recompensa.
- id: 11438
  text: El encuentro con Tron
- id: 11439
  text: >-
    Sora y compañía conocen a Tron

    dentro de un ordenador.
- id: 11440
  text: A jugar el juego
- id: 11441
  text: >-
    El comandante Sark obliga a Sora y a sus

    amigos a pasar por la rejilla de juego.
- id: 11442
  text: Un programa hostil
- id: 11443
  text: >-
    Para destruir la ciudad, el PCM extrae

    un programa del entorno de datos.
- id: 11444
  text: El usuario de Tron
- id: 11445
  text: >-
    Ansem el Sabio era el creador de

    Tron y del PCM.
- id: 11446
  text: El PCM hace estragos
- id: 11447
  text: >-
    El PCM crea una gran cantidad de sincorazón

    para invadir la ciudad de los usuarios.
- id: 11448
  text: El navegador solar
- id: 11449
  text: >-
    Sora y sus amigos vuelan en el navegador solar

    hacia el núcleo del ordenador central del PCM.
- id: 11450
  text: Contra el PCM
- id: 11451
  text: >-
    Sora y compañía se

    enfrentan con el PCM.
- id: 11452
  text: Adiós, Tron
- id: 11453
  text: Tron se despide de sus nuevos amigos.
- id: 11454
  text: Sora
- id: 11455
  text: >-
    Un joven elegido por la llave espada,

    un arma de singular naturaleza.


    No hace mucho, Sora viajó con

    Donald y Goofy en busca de su

    querida amiga Kairi, que había

    desaparecido misteriosamente

    en la oscuridad.


    Al final, consiguieron salvar 

    los mundos de la amenazadora

    oscuridad que se cernía sobre

    ellos.

    Poco después, Sora quiso seguir la

    pista de Riku, su mejor amigo,

    que había quedado atrapado tras

    la puerta de la oscuridad cuando

    la sellaron. Entonces, quedó sumido

    en un profundo sueño.


    Ahora, con nuevas prendas y

    una renovada determinación, Sora

    ha partido una vez más en busca

    de su amigo Riku.
- id: 11456
  text: Donald
- id: 11457
  text: >-
    Es el Mago de la Corte

    del Castillo Disney.


    Hace tiempo, Donald partió

    junto a Goofy en busca del

    rey Mickey. Durante su misión,

    conocieron a Sora y se

    hicieron grandes amigos.


    Tras ayudar a Sora a salvar los

    mundos de la oscuridad, Donald

    y Goofy continuaron buscando

    al rey, que había decidido

    permanecer en el Reino de

    la Oscuridad.


    Pero antes de que dieran con

    él, los tres amigos cayeron

    en un profundo sueño.
- id: 11458
  text: Goofy
- id: 11459
  text: >-
    Es el capitán de los Caballeros

    Reales del Castillo Disney.


    Partió junto a Donald en busca

    del rey, quien les había ordenado

    "seguir al elegido de la llave

    espada". Y así, se unieron a Sora.


    Tras ayudar a salvar los mundos

    de la oscuridad, Goofy continuó

    con la búsqueda. Pero al igual

    que Donald y Sora, cayó en un

    profundo sueño.

    ¿Qué estaría haciendo justo

    antes de caer dormido?
- id: 11460
  text: Kairi
- id: 11461
  text: >-
    Es amiga de la infancia de Sora y

    una de las Siete Princesas que

    enlazan las llaves y las

    cerraduras. Cuando quedó

    atrapada en la oscuridad, Riku

    y Sora trataron de rescatarla,

    cada uno a su modo.


    Gracias a ellos, Kairi consiguió

    volver a las islas, su hogar, pero

    perdió sus recuerdos de Sora,

    por lo que dejó de ir al islote en el

    que siempre solían jugar.
- id: 11462
  text: Ansem
- id: 11463
  text: >-
    Extraño portador de oscuridad.


    ¿Qué pretenderá realmente?
- id: 11464
  text: Riku
- id: 11465
  text: >-
    El antiguo amigo de la infancia de

    Sora decidió por sí mismo.


    Aunque Xehanort trató de controlar

    a Riku, su corazón resistió

    el envite: solo siendo parte

    de la oscuridad conseguiría

    llegar a dominarla.


    Riku adoptó el nombre de ‛Ansem’,

    quizás como muestra de sus

    intenciones, pues moraría en la

    oscuridad, si con eso conseguía

    que su amigo Sora despertara.
- id: 11466
  text: DiZ
- id: 11467
  text: Un individuo rodeado de misterio.
- id: 11468
  text: Ansem
- id: 11469
  text: ''
- id: 11472
  text: Organización {XIII}
- id: 11473
  text: >-
    El n.º {I} de la Organización {XIII}.

    Es el líder del grupo.


    La Organización {XIII} es un grupo

    especial dentro de los incorpóreos.

    Son capaces de pensar y maquinar,

    y parecen aspirar a algo más.


    Ignoramos qué pretenden, pero

    no hay duda de que conocen

    bien la naturaleza de la llave espada.
- id: 11474
  text: Organización {XIII}
- id: 11475
  text: >-
    El n.º {II} de la Organización {XIII}.

    No se sabe nada de él.


    Se desvaneció tras dejar perplejo

    a Sora con sus sinsentidos.

    Al parecer, los miembros de la

    Organización usan la oscuridad

    para desplazarse a su antojo.
- id: 11476
  text: Organización {XIII}
- id: 11477
  text: >-
    El n.º {III} de la Organización {XIII}.


    Cuando alguien de corazón y voluntad

    fuertes se convierte en un sincorazón,

    el cascarón vacío que deja tras de

    sí actúa con voluntad propia.


    ¿Acaso no tienen corazones?

    ¿Son solo espíritus errantes?

    ¿O quizá, simplemente, no son

    nada?
- id: 11478
  text: Vexen
- id: 11479
  text: >-
    Antiguo n.º {IV} de la Organización {XIII}.

    Ha sido eliminado.


    Vexen, Lexaeus y Zexión eran

    miembros fundadores de la

    Organización {XIII}, y

    no profesaban simpatía hacia

    neófitos como Marluxia.

    Vexen se opuso a los planes de

    Marluxia para hacerse con el control

    de la Organización, tras lo que

    fue aniquilado por Axel.
- id: 11480
  text: Lexaeus
- id: 11481
  text: >-
    Antiguo n.º {V} de la Organización {XIII}.

    Solía blandir un hacha enorme,

    pero ha sido eliminado.

    Lexaeus rechazó los planes de

    Marluxia para controlar la

    Organización y conspiró por su

    cuenta, pero fracasó y

    acabó de mala manera.
- id: 11482
  text: Zexión
- id: 11483
  text: >-
    Antiguo n.º {VI} de la Organización {XIII}.

    Fallecido.


    Zexión odiaba mancharse las manos,

    por lo que recurría a su ingenio

    para librarse de sus rivales.

    Supongo que no entraba en sus

    planes ser aniquilado.
- id: 11484
  text: Organización {XIII}
- id: 11485
  text: >-
    El n.º {VII} de la Organización {XIII}.


    Los incorpóreos como él parecen

    tener emociones, pero en realidad

    solo es un truco. Los incorpóreos

    carecen de corazón.
- id: 11486
  text: Axel
- id: 11487
  text: >-
    El n.º {VIII} de la Organización {XIII}.

    Domina el fuego y lleva un

    arma un tanto extraña.


    Ha demostrado ser un tipo raro:

    inflexible con las traiciones, pero

    siempre causando problemas con

    sus maquiavélicas intrigas dentro

    de la Organización.


    Afirma que unos lazos le unen a

    Sora, pero la verdad es que Sora

    ignora a qué se refiere.
- id: 11488
  text: Organización {XIII}
- id: 11489
  text: >-
    El n.º {IX} de la Organización {XIII}.


    Todos los miembros visten túnicas

    negras, y se dice que su número

    corresponde al orden en que

    ingresaron en la Organización.

    Además, sus nombres parecen

    llevar la marca de su hermandad.
- id: 11490
  text: Organización {XIII}
- id: 11491
  text: >-
    El n.º {X} de la Organización {XIII}.


    La Organización ha insinuado que

    además de saber sobre la llave

    espada, también podrían conocer

    muchas cosas sobre Sora. ¿Será

    solo un farol, o realmente saben

    de lo que están hablando?
- id: 11492
  text: Marluxia
- id: 11493
  text: >-
    Antiguo n.º {XI} de la Organización {XIII}.

    Ya acabamos con él.


    Planeó una rebelión dentro de la

    Organización y trató de alzarse

    con el poder de la llave espada,

    pero la traición de Axel provocó

    su destrucción.
- id: 11494
  text: Larxene
- id: 11495
  text: >
    Antigua n.º {XII} de la Organización {XIII}.

    Ha sido eliminada.


    Larxene conspiró con Marluxia

    para hacerse con la Organización.


    Larxene era insensible y le

    encantaba humillar a los demás,

    pero encontró la horma de su

    zapato y así acabó sus días.
- id: 11496
  text: Roxas
- id: 11497
  text: >-
    El n.º {XIII} de la Organización {XIII},

    portador de una llave espada y

    morador de la oscuridad.


    Se desvaneció esbozando una

    sonrisa de satisfacción tras

    enfrentarse a Sora. Pero parece

    que Sora era el único que podía verle.
- id: 11498
  text: Selphie
- id: 11499
  text: >-
    Una chica que habitaba en las

    mismas islas que Sora. Solía

    jugar con él y otros chicos.

    Su paradero era una incógnita tras

    la desaparición de las Islas del

    Destino en el pasado, pero, con

    la ayuda de Sora, pudo volver

    a su hogar.
- id: 11500
  text: Stitch
- id: 11501
  text: >-
    Un extraño visitante de un

    planeta remoto.


    A pesar de su tamaño, tiene

    una fuerza enorme y una clara

    tendencia a hacer travesuras.


    Siempre que Sora le necesite,

    Stitch estará listo para ayudarle.
- id: 11502
  text: Genio
- id: 11503
  text: ''
- id: 11504
  text: Peter Pan
- id: 11505
  text: >-
    Este chico volador proviene

    del País de Nunca Jamás,

    donde los niños nunca crecen.


    Hace tiempo, Peter ayudó a

    Sora y a sus amigos a vencer

    a los sincorazón.


    En esta nueva aventura, Peter

    y su amiga Campanilla vuelven

    a echar una mano.
- id: 11506
  text: Chicken Little
- id: 11507
  text: >-
    Chicken Little es bastante más

    valiente que muchos chicos

    que miden más del doble que él.

    Nunca rehúye un desafío, por 

    grande que sea.


    Es un fiel amigo de Sora, y

    siempre que él le llame, acudirá

    en su ayuda de inmediato.
- id: 11512
  text: Pete
- id: 11513
  text: >-
    Solía ser el capitán de un vapor.

    Donald y Goofy le conocen bien.

    Es tan malvado que el rey

    Mickey tuvo que desterrarlo

    y enviarlo a otra dimensión. 

    Maléfica le encontró y le ayudó

    a volver del exilio. Desde

    entonces, Pete ha estado

    recorriendo los mundos para

    reunir un ejército de sincorazón.

    Juntos planean tomar el

    control y reinar sobre

    todos los mundos.
- id: 11514
  text: Maléfica
- id: 11515
  text: >-
    Es una poderosa bruja.

    En la última aventura, sometió

    a los sincorazón y lideró

    un grupo para obtener

    el poder de la oscuridad.

    Como parte de su vil plan,

    engañó a Riku y le hizo entrar en

    el Reino de la Oscuridad.


    Al final, ella misma sucumbió

    ante el poder de la oscuridad

    y fue derrotada por Sora y sus

    amigos. Pero logró regresar

    valiéndose de su perverso poder.
- id: 11516
  text: Pluto
- id: 11517
  text: >-
    El fiel perro del rey es mucho

    más que su mascota. Les

    unen los lazos más fuertes

    que existen: la amistad y la

    lealtad.

    Cuando Mickey desapareció, Pluto

    salió en su búsqueda con

    los demás.


    Espero que su famoso hocico

    ayude a localizar al rey.
- id: 11518
  text: Pepito Grillo
- id: 11519
  text: >-
    ¡Qué bien tenerte con nosotros!

    Mi nombre es Pepito Grillo.

    La reina Minnie me pidió que os

    acompañara como Cronista Real en

    esta búsqueda. ¡Y sí que hemos

    vivido aventuras!


    Recordarás que también soy

    la conciencia oficial de mi amigo

    Pinocho, y cuando puedo le echo

    una mano. Trato de ayudarle a

    seguir el camino recto y distinguir

    el bien del mal. A veces es un

    chico muy travieso.
- id: 11520
  text: El rey Mickey
- id: 11521
  text: >-
    El rey del Castillo Disney.

    Hace ya tiempo que partió

    solo para combatir a la oscuridad

    que amenazaba los mundos.


    El rey Mickey y Riku se quedaron

    en el Reino de la Oscuridad para

    evitar que los sincorazón

    escaparan de nuevo.


    Donald, Goofy y Sora parten

    nuevamente decididos a

    encontrarle.
- id: 11522
  text: El rey Mickey
- id: 11523
  text: >-
    Rey del Castillo Disney. Fue el

    primero en darse cuenta de la

    amenaza de la oscuridad, y el

    primero en actuar. El rey Mickey

    recorre los mundos, combatiendo a

    los sincorazón y buscando una

    respuesta al enigma de la

    Organización {XIII} y los incorpóreos.


    Hastiado de tantas luchas, ahora

    parece más decidido que

    nunca a acabar con la oscuridad.
- id: 11526
  text: Sora
- id: 11527
  text: >-
    El joven elegido de la llave espada,

    la verdadera ‛llave’ de todo.


    Primavera y sus compañeras hadas,

    con su magia, le han dotado

    de nuevas prendas.


    Parece que esas vestimentas

    vienen provistas de varias

    habilidades, como el poder de

    transformarse.


    Con renovados propósitos, Sora

    parte rumbo a una nueva aventura.
- id: 11528
  text: Pato Donald
- id: 11529
  text: >-
    Es el Mago de la Corte

    en el Castillo Disney.


    Al igual que Sora, Donald había

    caído en un profundo sueño, pero

    despertó unos momentos antes.


    Están felices de haberse

    reencontrado después de tanto

    tiempo y están listos para

    compartir nuevas aventuras.
- id: 11530
  text: Goofy
- id: 11531
  text: >-
    Es el Capitán de los Caballeros

    Reales del Castillo Disney.


    Goofy cayó en un sueño

    profundo, al igual que Sora y Donald.

    No puede recordar qué ha sucedido,

    pero después del sueñecito,

    está como nuevo.


    ¡Quién sabe qué desafíos

    encontrarán estos tres amigos!
- id: 11532
  text: Roxas
- id: 11533
  text: >-
    Un joven habitante de Villa

    Crepúsculo, que, en sueños,

    siente los recuerdos de Sora.


    Sus vacaciones de verano casi han

    acabado y, con ellas, muchos de

    sus planes y sentimientos.
- id: 11536
  text: Naminé
- id: 11537
  text: >-
    Una chica con el poder de

    manipular los recuerdos.


    Parece tener una conexión muy

    fuerte con Sora.
- id: 11538
  text: Hayner
- id: 11539
  text: >-
    Un chico con un carácter

    conflictivo que vive en Villa

    Crepúsculo. Hace todo lo que

    se le pasa por la cabeza... lo que

    siempre acaba arrastrando a

    Pence y Olette.


    Siempre hay malos rollos entre él

    y Seifer, el autroproclamado

    "impartidor de disciplina".
- id: 11540
  text: Pence
- id: 11541
  text: >-
    Un chico de Villa Crepúsculo.

    Suele juntarse con Hayner (el

    ‛líder’) y Olette (la chica

    responsable).


    Es un chico tranquilote. Cuando

    hay algún problema, le gusta

    reflexionar y afrontarlo de

    forma realista.


    Le encanta estar con sus amigos,

    sobre todo si hay algo de helado

    de sal marina de por medio.
- id: 11542
  text: Olette
- id: 11543
  text: >-
    Una joven de Villa Crepúsculo.

    Pasa la mayor parte del tiempo

    con Hayner y Pence.


    Procura siempre estar pendiente

    de todos, y no consiente que

    los deberes se queden sin hacer.


    Le gusta ir de compras a la Calle

    del Mercado y ver la puesta de sol

    mientras charla con sus amigos.
- id: 11544
  text: Seifer
- id: 11545
  text: >-
    El autoproclamado presidente del

    ‛Comité Disciplinario de Villa

    Crepúsculo’.


    Se esfuerza al máximo por que

    se mantenga el decoro en la

    ciudad, pero no todo el mundo

    ve con buenos ojos sus tácticas;

    entre otros, la pandilla de Hayner,

    por ejemplo.


    Sus colegas Viento y Trueno

    siempre van con él.
- id: 11546
  text: Trueno
- id: 11547
  text: >-
    ¡Uno de los colegas de Seifer,

    tío!


    Suele dejarse llevar siempre, y, a

    decir verdad, Viento le da mil

    vueltas.
- id: 11548
  text: Viento
- id: 11549
  text: >-
    Una amiga de Seifer. Nunca

    habla más de lo necesario, lo que

    a veces la lleva a decir solo

    palabras sueltas.


    Viento se ha ganado la confianza

    de Seifer, y vive únicamente para

    agradarle en todo lo que puede.
- id: 11550
  text: Setzer
- id: 11551
  text: >-
    Un tahúr errante, siempre dispuesto

    para un juego o un desafío.

    Dedica su vida por completo

    al azar y deja que sea la suerte

    quien lo guíe.


    Setzer ganó el Struggle del año

    pasado. Suele estar arropado por

    un séquito de chillonas chicas.
- id: 11552
  text: Vivi
- id: 11553
  text: >-
    Un joven de Villa Crepúsculo.

    Su carácter débil le hace, en

    cierto modo, aceptar todo lo que

    Seifer dice, lo que siempre le

    acaba pasando factura.


    A pesar de todo eso, Seifer

    le cae bien y admira su fuerza.
- id: 11554
  text: Yen Sid
- id: 11555
  text: >-
    Un hechicero con poderes

    inigualables. Él fue quien

    enseñó magia al rey.


    Capaz de llenar el cielo de bonitas

    mariposas o de separar las aguas del

    mar, los hechizos de Yen Sid son

    sencillamente asombrosos. Su solo

    nombre hace temblar a muchos.


    Yen Sid compartió su sabiduría

    con Sora y sus amigos, y les mostró

    algunas técnicas muy valiosas

    para afrontar los peligros de

    esta nueva aventura.
- id: 11556
  text: Flora
- id: 11557
  text: >-
    Flora es un hada bondadosa

    que siempre viste de rojo. Como

    líder del grupo, Fauna y

    Primavera confían en ella a

    la hora de tomar decisiones.


    Flora ayudó a Sora a prepararse

    para el viaje dotándole

    de prendas con poderes mágicos.
- id: 11558
  text: Fauna
- id: 11559
  text: >-
    Fauna va siempre vestida

    de verde. Es un hada generosa

    y solo usa su magia para

    ayudar a los demás.


    Colaboró en la confección

    de las prendas mágicas de

    Sora.
- id: 11560
  text: Primavera
- id: 11561
  text: >-
    Siempre vestida de azul,

    Primavera es un hadita gentil,

    aunque un poco cabezota.

    Junto a Fauna y Flora, hace lo

    imposible para que Maléfica

    no haga daño a nadie.


    Primavera ayudó a Sora a

    prepararse para su viaje

    vistiéndole con prendas mágicas.
- id: 11562
  text: Sora
- id: 11563
  text: >-
    El elegido de la llave espada.

    Va buscando a su amigo Riku,

    para poder regresar con él a

    la isla de la que proceden.


    No hace mucho, Sora libró una

    dura batalla contra Maléfica, cuyos

    sincorazón habían invadido los

    pasillos del castillo.
- id: 11564
  text: Pato Donald
- id: 11565
  text: >-
    Es el Mago de la Corte de Disney.

    Junto a Sora y Goofy, recorre los

    mundos en busca del rey Mickey,

    que está en algún lugar combatiendo

    a las fuerzas de la oscuridad.


    Tiempo atrás, Donald participó

    en una gran batalla que se libró aquí

    contra Maléfica, cuyos sincorazón

    invadieron los corredores del castillo.
- id: 11566
  text: Goofy
- id: 11567
  text: >-
    Capitán de los Caballeros

    Reales del Castillo Disney.

    Recorre los mundos con Sora y

    Donald en busca del rey Mickey,

    que está en alguna parte luchando

    contra las fuerzas de la oscuridad.


    Hace un tiempo, Goofy libró

    una gran batalla contra Maléfica

    y los sincorazón que ocupaban

    los corredores del castillo.
- id: 11568
  text: Tío Gilito
- id: 11569
  text: >-
    Es el tío de Donald. Antes de que

    aparecieran los sincorazón,

    recorría los mundos en una nave

    gumi construyendo un gran

    imperio comercial.

    El Tío Gilito tiene más dinero

    del que muchos podrían imaginar,

    pero es bastante tacaño

    a la hora de gastarlo.


    Ahora, se ha metido en un

    negocio de helados con el que

    espera ganar millones.
- id: 11570
  text: Juanito
- id: 11571
  text: >-
    Juanito es uno de los tres sobrinos

    de Donald, y es el líder de la panda.

    Lleva a cabo los planes de

    Jaimito y se ocupa de que Jorgito

    no se quede atrás al ayudar al Tío

    Gilito con su negocio de helados.

    Se le distingue por

    su gorro rojo.


    La última vez que le vimos,

    trabajaba en Ciudad de Paso y

    estaba ahorrando para una expedición.
- id: 11572
  text: Jaimito
- id: 11573
  text: >-
    Es uno de los tres sobrinos de

    Donald y está ayudando al Tío Gilito

    con su negocio de helados.

    Jaimito siempre usa un gorro azul.

    Es listo, alegre y cada dos por tres

    se le ocurren ideas divertidas.


    La última vez que vimos a Jaimito,

    trabajaba en Ciudad de

    Paso y estaba ahorrando para

    hacer una expedición.
- id: 11574
  text: Jorgito
- id: 11575
  text: >-
    Es uno de los tres sobrinos de

    Donald y está ayudando al Tío Gilito

    con su negocio de helados.

    Jorgito es amable y despreocupado,

    aunque se da cuenta de cosas que

    otros pasan por alto. Le puedes

    reconocer por su gorro verde.


    La última vez que le vimos,

    trabajaba en Ciudad de Paso, y

    estaba ahorrando para una expedición.
- id: 11576
  text: Merlín
- id: 11577
  text: >-
    Un poderoso mago que actualmente

    vive en Bastión Hueco. Su casa

    es el centro de reunión del Comité

    de Restauración de la ciudad.


    Merlín tiene poderes mágicos y una

    sabiduría sin igual. Fue él quien le

    enseñó a Donald todo lo que

    sabe de magia. Posee una

    misteriosa bolsa que puede

    contener cualquier cosa, sin

    importar su tamaño.
- id: 11578
  text: León
- id: 11579
  text: >
    Diestro espadachín portador de

    un sable pistola. Su nombre real es

    Squall Leonhart. Para dejar atrás su

    pasado, adoptó el nombre de León;

    un hombre indefenso cuyo hogar

    fue invadido por los sincorazón.


    Durante un tiempo se refugió aquí

    y allá, pero, y en parte gracias a

    Sora, León aceptó Bastión Hueco

    como su hogar. Ahora trabaja

    sin descanso en su reconstrucción.
- id: 11580
  text: Cid
- id: 11581
  text: >-
    Es ingeniero y un genio de la

    tecnología, además de piloto de

    élite. Conoció a Sora cuando

    regentaba una tienda en un lugar

    muy lejos de su hogar.


    Ahora que ha vuelto a casa, Cid se

    ha convertido en un miembro

    activo del Comité de Restauración.
- id: 11582
  text: Cloud
- id: 11583
  text: >-
    Un ‛Soldado’ que porta sin

    problemas una descomunal

    espada. Luchó contra Sora,

    por encargo de Hades.


    Cloud no permite que nadie intuya

    qué tiene en la cabeza, por lo que

    su vida es un auténtico enigma.


    Busca a Sephiroth, ya que él es

    la clave para acabar de una vez

    por todas con su oscuridad interior.
- id: 11584
  text: Aerith
- id: 11585
  text: >-
    Una joven cuyos sosegados ojos

    ocultan una voluntad de hierro.

    Al igual que León, conoció a Sora

    cuando vivía lejos de su hogar.

    Ya le ayudó entonces, y vuelve a

    hacerlo ahora en su nuevo periplo.


    Aerith trabaja ahora junto a León

    y Yuffie pare devolver a la ciudad

    su antiguo esplendor.
- id: 11586
  text: Tifa
- id: 11587
  text: >-
    Esta jovencita busca con

    ahínco a alguien.


    Decidida e implacable, Tifa

    ha removido ya cielo y tierra.


    Su viaje no concluirá hasta que

    encuentre a esa persona.
- id: 11588
  text: Yuffie
- id: 11589
  text: >-
    Esta enérgica chica es miembro

    del Comité de Restauración de

    Bastión Hueco y colabora

    en la defensa de la ciudad.


    Yuffie conoció a Sora mientras

    vivía lejos de su tierra natal.

    La última vez, gracias a su ayuda,

    los sincorazón fueron derrotados y

    ella pudo regresar a casa. Desde

    entonces le está muy agradecida.
- id: 11590
  text: Sephiroth
- id: 11591
  text: >-
    Un espadachín sin igual, alguna

    vez reverenciado como un héroe.


    Durante un tiempo, no se sabía del

    paradero de Sephiroth, y nadie sabe

    con certeza por qué ha regresado.


    Parece tener alguna conexión

    con el pasado de Cloud.
- id: 11592
  text: Yuna
- id: 11593
  text: >-
    Miembro de un singular trío

    de inseparables jovencitas.


    Andaban buscando a León,

    pero... ¿para qué?
- id: 11594
  text: Rikku
- id: 11595
  text: >-
    Miembro de un singular trío

    de amistosas jovencitas.


    Parece que las tres han sido

    contratadas por alguien para llevar

    a cabo una misión... ¿Qué será?
- id: 11596
  text: Paine
- id: 11597
  text: >-
    Miembro de un singular trío

    de inseparables jovencitas.


    Dicen que vienen en son de paz...

    pero ¿qué les trae por aquí realmente?
- id: 11598
  text: Sora
- id: 11599
  text: >-
    El elegido de la llave espada

    lucha sin tregua contra los

    sincorazón y los incorpóreos.

    Su viaje en busca de Riku,

    su amigo perdido, continúa.


    Durante su último viaje, Sora

    y Bestia lucharon juntos para

    liberar a Bella.
- id: 11600
  text: Pato Donald
- id: 11601
  text: >-
    Es el Mago de la Corte.


    Salío del Castillo Disney en la

    nave gumi para buscar al rey

    Mickey.


    Donald y Bestia son viejos

    conocidos. La última vez que se

    encontraron, lucharon juntos para

    librar a Bella de sus captores.
- id: 11602
  text: Goofy
- id: 11603
  text: >-
    Capitán de los Caballeros

    Reales de Disney.


    Goofy salió del Castillo en la

    nave gumi para buscar al rey

    Mickey.


    Goofy y Bestia ya se conocen.

    La última vez que se vieron,

    lucharon juntos para rescatar a

    Bella de sus captores.
- id: 11604
  text: Bestia
- id: 11605
  text: >-
    Una horrible bestia de dientes y garras

    afilados. Su posesión más preciada

    es una misteriosa rosa, conservada

    en una campana de cristal.


    Una vez, Sora y sus amigos le

    ayudaron a rescatar a Bella

    de las garras de Maléfica.
- id: 11606
  text: Bestia
- id: 11607
  text: >-
    Era un príncipe insensible y, para

    castigarle por el egoísmo de su

    corazón, una hechicera

    le convirtió en una bestia.


    Estaba tan avergonzado de su

    horrendo aspecto que se recluyó

    en su castillo.

    Conocer a Bella le ablandó el

    corazón y le devolvió las esperanzas.
- id: 11608
  text: Bestia
- id: 11609
  text: >-
    Un príncipe malcriado y egoísta.

    Como castigo por su frío corazón,

    una hechicera le convirtió en

    una bestia.


    El hechizo solo se romperá si

    aprende a amar y logra que alguien

    le ame antes de que caiga el último

    pétalo de la rosa encantada.


    Cuando conoció a Bella, por

    primera vez en su vida sintió que

    algo le había cambiado dentro.
- id: 11610
  text: Bella
- id: 11611
  text: >-
    Esta joven estuvo cautiva en

    el castillo de Bestia. Al principio

    ella le temía, pero poco a poco,

    comprendió que tras su fiera

    apariencia se ocultaba un

    corazón herido.


    Bella es una de las Siete

    Princesas necesarias para

    abrir la última puerta al Reino de la

    Oscuridad. Cuando fue secuestrada

    por los sincorazón, Sora y Bestia

    la rescataron y ella les está

    enormemente agradecida.
- id: 11612
  text: Bella
- id: 11613
  text: >-
    Bella logró ver más allá del fiero

    aspecto de Bestia y le ayudó a

    compartir los sentimientos de su

    corazón, que había ocultado

    durante tanto tiempo.


    Bella adora los libros que

    relatan aventuras emocionantes

    en lugares remotos.
- id: 11614
  text: Din Don
- id: 11615
  text: >-
    El mayordomo de Bestia. Cuando

    la hechicera encantó a todos en el

    castillo, le convirtió en un reloj.

    ¿Habrá sido porque Din Don es

    tan puntilloso en cuanto al orden

    y la puntualidad?
- id: 11616
  text: Lumiere
- id: 11617
  text: >-
    Es el maître del castillo. Cuando

    la hechicera encantó a todos, a él

    le convirtió en un candelabro.

    Lumiere es elocuente y

    puede resultar encantador.
- id: 11618
  text: Sra. Potts
- id: 11619
  text: >-
    Es el ama de llaves de Bestia y

    la madre de Chip. La hechicera

    la convirtió en una tetera.

    La Sra. Potts siempre está

    dispuesta a reconfortar tu corazón

    con una humeante taza de té.
- id: 11620
  text: Chip
- id: 11621
  text: >-
    El hijito de la Sra. Potts. Por obra

    de la hechicera, Chip se convirtió

    en una taza de té.


    Le faltaba un diente

    y por eso la taza tiene una pequeña

    mella.
- id: 11622
  text: Armario
- id: 11623
  text: >-
    Es la doncella del castillo. La

    hechicera la convirtió en un

    armario.
- id: 11624
  text: Xaldin
- id: 11625
  text: >-
    Es el n.º {III} de la Organización {XIII}.

    Sus artimañas han emponzoñado el

    corazón de Bestia.


    Los motivos de la Organización

    siguen siendo una incógnita.

    ¿Qué pretenderán realmente?
- id: 11626
  text: Sora
- id: 11627
  text: >-
    El héroe elegido por la llave

    espada continúa su viaje

    en busca de Riku.


    Hace no mucho, él y Hércules

    pusieron fin a los planes de Hades

    de dominar el mundo. Fil le ha

    nombrado "Aprendiz de Héroe".
- id: 11628
  text: Pato Donald
- id: 11629
  text: >-
    Es el Mago de la Corte.

    En una carta, el rey les dijo a

    Goofy y a él que debían "seguir

    al elegido de la llave espada".

    Desde entonces, recorren los

    mundos junto a Sora.


    Tiempo atrás, ayudaron a Hércules

    a evitar que Hades controlara el

    mundo. Fil le ha nombrado

    ‛Aprendiz de Héroe’.
- id: 11630
  text: Goofy
- id: 11631
  text: >-
    Capitán de los Caballeros Reales.

    En una carta, el Rey les dijo a

    Donald y a él que debían "seguir

    al elegido de la llave espada".

    Desde entonces, recorren los

    mundos junto a Sora.


    Tiempo atrás, ayudaron a Hércules

    a evitar que Hades controlara el

    mundo. Fil lo ha nombrado

    ‛Aprendiz de Héroe’.
- id: 11632
  text: Hércules
- id: 11633
  text: >-
    Es un héroe legendario con una

    fuerza espectacular. Además es un

    gran amigo. Hércules es el hijo del

    dios Zeus y una mortal, pero él

    no es un dios. Tiempo atrás,

    unió fuerzas con Sora y sus

    amigos para impedir que Hades

    dominara el mundo.


    Cuando lucha en el Coliseo,

    una multitud colma las tribunas

    y él nunca los defrauda. Nunca

    ha perdido un combate.
- id: 11634
  text: Hércules
- id: 11635
  text: >-
    Un héroe legendario de fuerza

    incomparable. Cuando la Hidra

    destruyó el Coliseo, Hércules

    sintió que había decepcionado

    a todo el mundo, y ahora duda

    de sí mismo y de sus cualidades

    como héroe. Su espíritu luchador

    está un poco venido a menos.
- id: 11636
  text: Filoctetes
- id: 11637
  text: >-
    Fil, para los amigos. Es un

    veterano entrenador de héroes

    y el mentor de Hércules. También

    ha entrenado a Sora y a sus amigos

    durante sus primeras aventuras

    con el gran héroe.


    Últimamente Fil está muy ocupado.

    Se encarga del Coliseo y evalúa

    a los contendientes de los torneos.
- id: 11638
  text: Megara
- id: 11639
  text: >-
    Meg, para los amigos. Es fuerte,

    ingeniosa y una verdadera amiga

    de Hércules. Desde que lo conoció,

    Meg es más abierta y ha aprendido

    a confiar en los demás.


    Meg se dirigía al Inframundo sola.

    Sabía que Hércules estaba

    extenuado y quería que Hades

    le diera un respiro con los

    combates del Coliseo.
- id: 11640
  text: Pegaso
- id: 11641
  text: >-
    Un hermoso caballo, capaz de volar

    como un águila. Pegaso es el

    leal compañero de Hércules.

    Zeus creó a Pegaso con una nube

    y se lo regaló a Hércules cuando

    aún era un bebé.


    Estuvieron separados unos años,

    pero, de mayores, se reencontraron.
- id: 11642
  text: Auron
- id: 11643
  text: >-
    Un guerrero que Hades ha hecho

    volver del Inframundo.


    A cambio de su libertad, Auron

    tenía orden de derrotar a Hércules,

    pero se negó a ayudar a Hades.

    Sus enigmáticas palabras fueron:

    ‛Esta es mi historia’.


    No le gusta hablar de sí mismo.

    Su pasado es un gran misterio.
- id: 11644
  text: Dolor
- id: 11645
  text: >-
    Es uno de los lacayos de Hades.

    Dolor trató de atacar a Hércules

    cuando era solo un bebé, pero el

    héroe le dio una buena tunda.


    Dolor puede cambiar de forma

    a su antojo, pero es un poco

    atolondrado. Nunca se aleja de

    su malvado compañero Pánico.
- id: 11646
  text: Pánico
- id: 11647
  text: >-
    Es uno de los lacayos de Hades.

    Pánico trató de atacar a Hércules

    cuando apenas era un bebé, pero el

    héroe le dio una buena tunda.


    Pánico puede cambiar de forma

    a su antojo, pero es un poco

    atolondrado. Nunca se aleja de

    Dolor, su malvado compañero.
- id: 11648
  text: Hades
- id: 11649
  text: >-
    Es el Señor del Inframundo.


    La última vez que Sora y sus amigos

    se cruzaron con él, intentaba

    dominar el mundo usando a los

    sincorazón, pero los tres amigos

    y Hércules pusieron fin a sus planes.

    Sin embargo, Hades será siempre

    malvado y no descansará hasta

    enviar a Hércules al Inframundo

    por toda la eternidad.
- id: 11650
  text: Cerbero
- id: 11651
  text: >-
    Es el guardián de la entrada del

    Inframundo y la leal mascota de

    Hades.


    La última vez, Hércules, Sora,

    Donald y Goofy se unieron y le

    derrotaron, pero Hades hizo que

    volviera y Cerbero tiene

    sed de venganza.
- id: 11652
  text: La Hidra
- id: 11653
  text: >-
    Un monstruo legendario

    con varias cabezas, que

    Hades envió para luchar

    contra Hércules. Si le cortan

    una cabeza, crecen dos más

    en su lugar.
- id: 11656
  text: Demyx
- id: 11657
  text: >-
    El n.º {IX} de la Organización {XIII}.


    Mientras merodeaba por el mundo

    de Hércules, robó la Piedra del

    Olimpo. Lucha de pena.


    Cuando Demyx se dirigió a Sora,

    le llamó ‛Roxas’.
- id: 11658
  text: Sora
- id: 11659
  text: >-
    El elegido de la llave espada

    lucha sin tregua contra los

    sincorazón y los incorpóreos.

    Continúa su viaje en busca de

    Riku, su amigo perdido.


    En su último viaje, Sora ayudó a

    evitar que Yafar controlara Agrabah,

    y le encerró en una lámpara mágica.
- id: 11660
  text: Pato Donald
- id: 11661
  text: >-
    El Mago de la Corte. En busca

    del rey, recorre los mundos

    con Sora y con Goofy.


    La última vez que visitó Agrabah,

    Donald luchó junto a Aladdín

    para defender la ciudad del

    temible Yafar.
- id: 11662
  text: Goofy
- id: 11663
  text: >-
    Junto a Sora y Donald, el Capitán

    de los Caballeros Reales recorre

    los mundos en busca del rey.


    La última vez que visitó Agrabah,

    Goofy luchó junto a Aladdín

    para defender la ciudad del

    temible Yafar.
- id: 11664
  text: Aladdín
- id: 11665
  text: >-
    Este joven proviene del desierto

    en las afueras de Agrabah. En el

    pasado, Sora y sus amigos le

    ayudaron a vencer a Yafar y liberar

    a Genio de la lámpara.


    Aladdín pensaba que alguien

    de condición humilde, como él, no

    podría ganarse el amor de una

    princesa, pero Yasmín le enseñó

    que lo que realmente importa

    es el corazón las personas.


    Siempre va acompañado de su

    amigo, el mono Abú.
- id: 11666
  text: La alfombra mágica
- id: 11667
  text: >-
    Es una alfombra voladora.


    La alfombra es una vieja amiga de

    Genio. Aladdín la encontró en la

    Cueva de las Maravillas y desde

    entonces, ella siempre

    está dispuesta a ayudarle.

    Puede transportarle a través del

    vasto desierto en un abrir y

    cerrar de ojos.
- id: 11668
  text: Iago
- id: 11669
  text: >-
    Este loro astuto y bullicioso sirve

    de ojos y oídos a Yafar, pues

    le cuenta todo lo que ocurre

    en Agrabah.


    A causa de sus maldades, Iago

    acabó encerrado en la lámpara

    junto a su amo. Ahora que es libre

    de nuevo, jura que ha cambiado

    y que es un "loro nuevo".

    Aunque yo no me fiaría mucho...
- id: 11670
  text: Abú
- id: 11671
  text: >-
    Abú, el fiel y peludo compañero de

    Aladdín, no habla mucho, pero

    siempre sabe lo que su amigo

    necesita.


    Por desgracia, Abú no puede

    resistirse al ver un tesoro,

    y no le importa quién sea el dueño.
- id: 11672
  text: Princesa Yasmín
- id: 11673
  text: >-
    Es la princesa de Agrabah y una

    de las Siete Princesas que se

    necesitan para abrir la puerta al

    Reino de la Oscuridad.


    Yasmín conoció a Aladdín cuando

    huyó del palacio en busca de

    aventuras. Siente una enorme

    gratitud hacia Aladdín, Sora y sus

    amigos, pues ellos salvaron

    la ciudad de los terribles planes

    de Yafar.
- id: 11674
  text: Genio
- id: 11675
  text: >-
    Pasó diez mil años

    encerrado en la lámpara

    mágica hasta que Aladdín

    le encontró. Después de

    vencer a Yafar, Aladdín usó

    su tercer deseo para liberar

    a Genio.


    La libertad es su sueño

    hecho realidad. En lugar de

    estar a disposición de un amo,

    ahora disfruta de una vida

    libre de preocupaciones.
- id: 11676
  text: Yafar
- id: 11677
  text: >-
    Antes de convertirse en un genio

    malvado, Yafar era el visir real del

    Sultán.


    La otra vez que estuvimos en

    Agrabah, se valió de los sincorazón

    para apoderarse de la ciudad.

    Logró controlar a Genio y pidió

    convertirse en un poderoso genio

    él mismo. Aladdín, Sora y

    sus amigos se unieron para

    derrotarlo y le encerraron

    en su propia lámpara.
- id: 11678
  text: Yafar
- id: 11679
  text: >-
    Cuando tuvo la lámpara en su

    poder, Yafar usó su último deseo

    para convertirse en un genio

    muy poderoso. Luego terminó

    encerrado en la lámpara, pero

    al final logró escapar gracias

    al mercader.


    Después usó sus poderes mágicos

    para convertirse en un coloso,

    e intentó controlar Agrabah, pero

    Sora y sus amigos volvieron

    a derrotarlo.
- id: 11680
  text: El mercader
- id: 11681
  text: >-
    Es dueño de una tienda donde

    ofrece toda clase de mercancías.

    Es un sujeto muy sospechoso.
- id: 11682
  text: Sora
- id: 11683
  text: >-
    El elegido de la llave espada

    lucha sin tregua contra los

    sincorazón y los incorpóreos.


    Sora continúa investigando qué

    fue de Riku después de que se

    separaran, hace ya bastante tiempo.
- id: 11684
  text: Pato Donald
- id: 11685
  text: >-
    El Mago de la Corte dejó el castillo

    y emprendió la búsqueda del rey,

    que había desaparecido.


    Junto a Sora, recorre los mundos

    en busca de pistas sobre el

    paradero del rey Mickey.
- id: 11686
  text: Goofy
- id: 11687
  text: >-
    El Capitán de los Caballeros Reales

    dejó el castillo y emprendió la

    búsqueda del rey.


    La lealtad de Goofy hacia el rey

    Mickey no tiene igual, y siempre está

    listo para ayudar a su amigo Sora

    cuando las cosas se ponen difíciles.
- id: 11690
  text: Ping
- id: 11691
  text: >-
    Hija única de la distinguida

    familia Fa. Su verdadero nombre

    es Fa Mulán.


    Se disfrazó de hombre y se unió

    al Ejército Imperial en lugar de

    su padre para combatir a los

    hunos y mantener el honor

    de la familia. Los otros soldados

    le conocen como Ping.
- id: 11692
  text: Mulán
- id: 11693
  text: >-
    Hija única de la distinguida

    familia Fa, Mulán no está bien,

    ya que tiene que hacer siempre

    lo que los otros esperan de ella

    y se siente como un bicho raro.

    Cuando su anciano padre

    recibió la orden de volver a

    filas, ella logró escabullirse y

    arriesgó la vida para tomar su lugar.
- id: 11694
  text: Capitán Li Shang
- id: 11695
  text: >-
    Es un joven y brillante oficial. Su

    padre es un distinguido general

    del Ejército Imperial.


    El Capitán Shang debe entrenar a

    un desigual grupo de reclutas

    que han sido llamados a filas

    para combatir a los hunos. Es

    machacón en cuanto a la disciplina,

    y exige a sus inexpertas

    tropas un trabajo arduo.
- id: 11696
  text: Yao
- id: 11697
  text: >-
    Es uno de los reclutas

    alistados para defender China

    de la invasión de los hunos.


    Yao es un tipo bajo que

    suele jactarse de ser más

    fuerte que nadie.
- id: 11698
  text: Chien Po
- id: 11699
  text: >-
    Es uno de los reclutas

    alistados para defender China

    de la invasión de los hunos.


    Chien Po adora la buena comida

    y probablemente sueñe más con

    manjares que con conseguir

    honores o vivir aventuras.
- id: 11700
  text: Ling
- id: 11701
  text: >-
    Es uno de los reclutas

    alistados para defender China

    de la invasión de los hunos.


    Lo que más le gusta es

    conversar y hacer bromas.
- id: 11702
  text: El Emperador
- id: 11703
  text: >-
    Dicen que la sabiduría del Emperador

    de China es vasta como el océano,

    y su determinación firme

    como una montaña.


    Les está profundamente agradecido

    a Mulán y al capitán Shang por

    haber salvado a China de los hunos.
- id: 11704
  text: Mushu
- id: 11705
  text: >-
    Había sido uno de los guardianes de

    la familia Fa, pero sus errores

    lo relegaron a la humilde tarea

    de hacer sonar un gong. Ahora

    está ansioso por ayudar a Mulán,

    para demostrar su valor y recuperar

    su lugar entre los guardianes.


    Durante la última aventura, Mushu

    brindó a Sora y a sus amigos una

    ayuda muy valiosa.
- id: 11706
  text: Shan Yu
- id: 11707
  text: >-
    Es el jefe de los hunos y quiere

    conquistar toda China.


    Shan Yu y su enorme ejército

    son enemigos temibles y

    han derrotado a algunas de las

    mejores tropas del Emperador.

    Ahora, Shan Yu planea invadir

    el Imperio con ayuda de los

    sincorazón.


    Su mirada es aterradora y

    lleva siempre un halcón

    que le hace de ojos y oídos.
- id: 11710
  text: Xigbar
- id: 11711
  text: >-
    El n.º {II} de la Organización {XIII}.

    Cuando Sora le llamó, pensando

    que era Riku, Xigbar le respondió

    fríamente.


    Ignoramos sus motivaciones y

    sus métodos, pero no hay duda de

    que tiene un objetivo muy claro

    en mente. ¿Qué será?
- id: 11712
  text: Sora
- id: 11713
  text: >-
    El portador de la llave espada.


    Hace no mucho, reunió las

    páginas arrancadas de un libro de

    cuentos y se hizo amigo de todos

    los personajes que en él vivían.
- id: 11714
  text: Winnie the Pooh
- id: 11715
  text: >-
    Pooh, para los amigos. Es un

    simpático oso que vive en el

    Bosque de los Cien Acres.

    Adora comer y le rechifla

    la miel.


    A Pooh le gusta hacer ejercicio

    todas las mañanas, pues dice

    que le abre el apetito.
- id: 11718
  text: Tigger
- id: 11719
  text: >-
    Tigger rebosa de energía. Le

    encanta usar su cola para ir

    brincando por todo el Bosque de los

    Cien Acres. A veces exagera,

    pero no le hace daño a nadie.

    Sin embargo, tras esa apariencia de

    feliz despreocupación, hay un

    corazón sensible y generoso.
- id: 11720
  text: Piglet
- id: 11721
  text: >-
    Es uno de los buenos amigos de Pooh

    en el Bosque de los Cien Acres.


    Piglet es pequeñito y se asusta

    por cualquier cosa, pero

    estar rodeado de amigos como

    Pooh le hace sentirse siempre

    protegido.
- id: 11722
  text: Igor
- id: 11723
  text: >-
    Igor es algo pesimista.

    Vive en una casa hecha de palos.

    Su cola está clavada con una

    chincheta, pero todo el tiempo

    se le cae y se le pierde.


    Igor pasa mucho tiempo vagando

    por el Bosque de los Cien Acres

    en busca de un nuevo hogar, porque

    su casa de palos se desmorona.
- id: 11724
  text: Búho
- id: 11725
  text: >-
    Es el habitante más sabio del

    Bosque de los Cien Acres.

    Cuando alguno tiene una pregunta

    que no puede responder, le pregunta

    a Búho. Siempre está dispuesto a

    ayudar, ¡aunque sus respuestas

    no son siempre las correctas!
- id: 11726
  text: Cangu
- id: 11727
  text: >-
    Es la madre de Rito. Cuando sale

    de casa, mete al pequeño

    Rito en su bolsa y parte.


    Cangu siempre tiene un buen

    consejo para ofrecer a sus

    vecinos del bosque.
- id: 11728
  text: Rito
- id: 11729
  text: >-
    Es el habitante más joven del

    Bosque de los Cien Acres. Rito

    admira a Tigger y sueña con

    dar botes como él.
- id: 11730
  text: Topo
- id: 11731
  text: >-
    Es un experto en excavaciones o,

    mejor dicho, se especializa en cavar

    túneles. Si quieres encontrarle,

    busca un montículo

    de tierra fresca.
- id: 11732
  text: Sora
- id: 11733
  text: >-
    Con el poder de la llave espada, este

    chico se abre camino buscando

    a su amigo Riku, así como la

    forma de volver a su hogar.


    En este mundo, Sora ha adoptado

    una forma felina, pero parece tener

    dos pies izquierdos... ¿o cuatro

    patas izquierdas? Bah, no importa.
- id: 11734
  text: Pato Donald
- id: 11735
  text: >-
    El Mago de la Corte recorre los

    mundos en busca del rey,

    acompañado de Sora y de Goofy.


    En este mundo, Donald tiene alas

    y, como era de esperar,

    ha aprendido a usarlas enseguida.
- id: 11736
  text: Goofy
- id: 11737
  text: >-
    El Capitán de los Caballeros Reales

    recorre los mundos junto a Sora

    y a Donald, en busca del rey.


    En este mundo, Goofy se ha

    transformado en una tortuga, y

    su nueva apariencia le va muy bien.
- id: 11738
  text: Pete
- id: 11739
  text: >-
    Pete pretende dominar todos los

    mundos con un ejército de sincorazón.


    Está aquí para ayudar al fantasma

    de Scar. Pero... quien mucho abarca,

    poco aprieta...
- id: 11740
  text: Simba
- id: 11741
  text: >-
    El hijo del gran Mufasa ha crecido

    y se ha convertido en el sucesor

    de su padre como rey de las

    Tierras del Reino.


    Cuando era un cachorro, Simba

    pensó que era responsable de

    la muerte de su padre. Abandonó

    las Tierras del Reino, y conoció a dos

    nuevos amigos: Timón y Pumba.

    Ellos le enseñaron a vivir una vida

    libre de preocupaciones.


    Durante su primera aventura, cuando

    Sora, Donald y Goofy necesitaron de

    él, Simba acudía de inmediato.
- id: 11744
  text: Timón
- id: 11745
  text: >-
    Este suricato es un íntimo

    amigo de Simba. Cuando

    era un cachorro, Timón lo

    encontró casi muerto de sed. Él

    y su amigo Pumba le enseñaron

    a Simba su lema, "Hakuna Matata",

    que significa ‛nada de preocupaciones’.


    Y así fue como Simba creció,

    sin complicarse la vida, pensando

    solo en el día a día.
- id: 11746
  text: Pumba
- id: 11747
  text: >-
    Este jabalí es un gran amigo de

    Simba. Pumba lo encontró casi

    muerto de sed, cuando el rey era solo

    un cachorro que huía de su pasado.

    Timón, su mejor amigo, y él, le

    enseñaron el lema, "Hakuna Matata",

    es decir: ‛nada de preocupaciones’.


    A algunos les molesta cómo

    huele Pumba, pero nunca

    encontrarás a nadie más amable.
- id: 11748
  text: Nala
- id: 11749
  text: >-
    La amiga de la infancia de Simba

    se ha convertido en una fuerte

    leona. Nala está buscando ayuda

    para salvar las Tierras del Reino

    del terrible estado en que se

    encuentran.
- id: 11752
  text: Mufasa
- id: 11753
  text: >-
    Un gran soberano de las Tierras

    del Reino, querido por todos los

    animales que las habitaban. Su

    herencia, la sabiduría de generaciones

    de reyes, ha pasado a su hijo Simba.


    Después de salvar a Simba de una

    estampida, Mufasa trató de trepar

    hasta un lugar seguro, pero Scar

    le hizo caer y provocó su muerte.
- id: 11756
  text: Rafiki
- id: 11757
  text: >-
    Un viejo mandril de las Tierras del

    Reino. Rafiki es un sabio chamán.


    Fue el consejero de confianza de

    Mufasa y siempre ha ansiado ver

    el día en que Simba ocupará

    el lugar de su padre como rey.
- id: 11758
  text: Scar
- id: 11759
  text: >-
    Es el malvado tío de Simba,

    hermano de Mufasa.


    Tras la muerte de Mufasa y la

    desaparición de Simba, Scar

    se convirtió en rey y usó a las

    hienas para hacer el trabajo

    sucio. Scar no ha cuidado bien

    de las Tierras del Reino y

    casi todos los animales se vieron

    obligados a emigrar.
- id: 11762
  text: Shenzi
- id: 11763
  text: >-
    Una hiena cobarde que odia a los

    leones. Shenzi es la jefa

    cuando sus amigas y ella

    hacen de las suyas. Siempre está

    dispuesta a seguir al más fuerte.
- id: 11764
  text: Banzai
- id: 11765
  text: >-
    Una hiena cobarde que odia a los

    leones. Banzai es muy quejica, pero

    no le gusta trabajar. Siempre busca

    la presa fácil.
- id: 11766
  text: Ed
- id: 11767
  text: >-
    Una hiena estúpida, bastante

    simple, que adora reírse. Shenzi y

    Banzai siempre le toman el pelo,

    pero a Ed no parece importarle.
- id: 11768
  text: Sora
- id: 11769
  text: >-
    El héroe de la llave espada. Sora

    sigue buscando a Riku, de

    quien se tuvo que separar hace

    algún tiempo en una gran batalla.


    En uno de sus viajes anteriores,

    cuando Úrsula intentó apoderarse

    del tridente, Sora defendió Atlántica.
- id: 11770
  text: Pato Donald
- id: 11771
  text: >-
    El Mago de la Corte viaja por los

    mundos en busca de pistas sobre

    el paradero del rey Mickey.


    En sus viajes anteriores, Donald

    y sus amigos ayudaron a defender

    Atlántica de Úrsula, la Bruja del Mar.
- id: 11772
  text: Goofy
- id: 11773
  text: >-
    El Capitán de los Caballeros Reales

    viaja por los mundos en busca de

    pistas sobre el paradero del rey

    Mickey.

    En sus viajes anteriores, Donald

    y sus amigos ayudaron a defender

    Atlántica de Úrsula, la Bruja del Mar.
- id: 11774
  text: Ariel
- id: 11775
  text: >-
    Es la séptima hija de Tritón,

    rey de Atlántica. Ariel tiene

    la voz más bella de todas las

    criaturas que habitan el mar.


    Ariel quiere ver el mundo que

    hay fuera del mar. En una gruta

    secreta, atesora una colección de

    objetos del mundo humano.

    La última vez, Sora y sus amigos

    la ayudaron cuando Úrsula intentó

    dominar Atlántica.
- id: 11776
  text: Ariel
- id: 11777
  text: >-
    Séptima hija de Tritón, rey

    de Atlántica, Ariel hizo un

    trato con Úrsula para convertirse

    en humana y por ello perdió

    su hermosa voz.


    Ariel tiene tres días para lograr

    que el príncipe Eric se enamore de

    ella. Si no, volverá a convertirse

    en sirena y será esclava de Úrsula.
- id: 11778
  text: Rey Tritón
- id: 11779
  text: >-
    Es el Rey del Mar y gobierna

    Atlántica. El tridente simboliza

    su poder. Tritón adora a su hija

    Ariel, pero por su seguridad y la

    del reino, le ha prohibido

    terminantemente que tenga

    contacto con ningún humano.
- id: 11780
  text: Rey Tritón
- id: 11781
  text: >-
    Es el Rey de Mar y gobierna Atlántica.

    Por lo menos, solía serlo hasta que

    Úrsula lo transformó en una fea y

    pequeña criatura marina. Pero él

    estuvo dispuesto a pagar el

    precio por salvar a Ariel de la

    malévola magia de Úrsula.
- id: 11782
  text: Sebastián
- id: 11783
  text: >-
    Es el compositor de la corte de

    Tritón. Se podría decir que es un

    genio de la música. Se encarga

    de cuidar que Ariel no se

    meta en líos. Ahora está

    trabajando en un musical muy

    especial.
- id: 11784
  text: Flounder
- id: 11785
  text: >-
    Flounder es el mejor amigo de

    Ariel y haría lo que fuese por ella.

    Es pequeño y no muy valiente, pero

    nunca abandonará a Ariel,

    aunque tenga que correr peligro.
- id: 11786
  text: Príncipe Eric
- id: 11787
  text: >-
    Un príncipe del mundo terrestre

    que adora el mar. Una noche de

    tormenta, cuando su barco se

    hundió, Ariel le salvó y evitó que

    se ahogara.


    El príncipe Eric no recuerda nada

    de esa noche, excepto la

    encantadora voz de Ariel, y

    busca por todas partes a

    la chica que le salvó la vida.
- id: 11788
  text: Jetsam
- id: 11789
  text: >-
    Esta malvada anguila trabaja para

    Úrsula. Su ojo derecho brilla con un

    amenazador destello dorado. Jetsam

    es elocuente y sabe cómo manipular

    los corazones de los demás.


    En la última batalla, Sora y sus

    amigos derrotaron a Jetsam, pero

    ahora ha regresado junto con Úrsula.
- id: 11790
  text: Flotsam
- id: 11791
  text: >-
    Esta malvada anguila trabaja para

    Úrsula. Su ojo izquierdo brilla con un

    amenazador destello dorado. Flotsam

    usa falsas promesas para hacer que

    las sirenas desprevenidas caigan en

    las garras de Úrsula.


    En la última batalla, Sora y sus

    amigos derrotaron a Flotsam, pero

    ahora ha regresado junto con Úrsula.
- id: 11792
  text: Vanessa
- id: 11793
  text: >-
    Úrsula se transformó en una chica

    hermosa para estropear la relación

    de Ariel con el príncipe Eric.


    Se apoderó de la voz de Ariel

    gracias a un contrato...

    y la usó para embelesar al

    príncipe Eric.
- id: 11794
  text: Úrsula
- id: 11795
  text: >-
    La Bruja del Mar vive en una

    cueva alejada del palacio.

    Solía servir al Rey Tritón

    hasta que, por sus maquinaciones,

    fue expulsada del reino.


    Tiempo atrás, intentó

    deshacerse del Rey Tritón

    y dominar Atlántica.

    Sora, Donald y Goofy

    ayudaron a Ariel a derrotarla,

    pero ella se valió de sus

    oscuros poderes para regresar.

    El rencor que le guarda a

    Tritón es más fuerte que nunca...

    Y ahora busca vengarse.
- id: 11796
  text: Sora
- id: 11797
  text: >-
    Mientras continúa su viaje, el

    héroe de la llave espada lucha sin

    descanso contra los sincorazón y

    los incorpóreos. Sora también

    busca al rey, pues este podría

    saber dónde está Riku.


    Sora vino al Castillo Disney a

    petición de la reina Minnie.
- id: 11798
  text: Pato Donald
- id: 11799
  text: >-
    El Mago de la Corte.


    Una mañana despertó y encontró

    una carta que el rey había dejado

    antes de desaparecer. Fue entonces

    cuando Donald emprendió este largo

    viaje.


    Su mayor deseo es reencontrarse

    con el rey y regresar con él

    al Castillo Disney.
- id: 11800
  text: Goofy
- id: 11801
  text: >-
    Capitán de los Caballeros Reales.


    Una mañana despertó y encontró

    una carta que el rey había dejado

    antes de desaparecer. Fue entonces

    cuando Goofy emprendió este largo

    viaje.


    Su mayor deseo es reencontrarse

    con el rey y regresar con él

    al Castillo Disney.
- id: 11802
  text: Reina Minnie
- id: 11803
  text: >-
    La reina del Castillo Disney.


    En ausencia de Mickey, es ella quien

    reina. Ella me pidió que acompañara

    a Donald y a Goofy como Cronista

    Real.

    La reina Minnie está muy preocupada

    por el rey, pero su corazón sabe

    que él volverá sano y salvo.
- id: 11804
  text: Daisy
- id: 11805
  text: >-
    Es la dama de honor de la reina

    Minnie en el Castillo Disney y la

    novia de Donald.


    Está ayudando a la reina Minnie

    a manejar los asuntos del castillo

    mientras los caballeros están lejos.
- id: 11806
  text: Chip
- id: 11807
  text: >-
    Uno de los especialistas en mecánica

    del reino. Ayuda a mantener la nave

    gumi, que puede viajar a cualquier

    destino.

    Es diligente y termina todo

    lo que comienza.


    Chip es casi idéntico a su amigo

    Chop, pero puedes distinguirlos

    por el color de sus narices y la

    forma de sus dientes delanteros.
- id: 11808
  text: Chop
- id: 11809
  text: >-
    Uno de los especialistas en mecánica

    del reino. Ayuda a mantener la nave

    gumi, que puede viajar a cualquier

    destino.

    Chop es muy impulsivo, pero

    meticuloso y constante

    cuando hay que terminar un

    trabajo importante.


    Chop es casi idéntico a su amigo

    Chip, pero puedes distinguirlos

    por el color de sus narices y la

    forma de sus dientes delanteros.
- id: 11810
  text: Escobas
- id: 11811
  text: >-
    El rey Mickey hechizó a estas

    escobas y las ha vuelto muy

    trabajadoras. Limpian, ayudan

    a mantener la nave gumi

    y echan una mano en lo que

    haga falta.
- id: 11812
  text: Sora
- id: 11813
  text: >-
    Abriéndose camino con la llave

    espada, Sora continúa la

    búsqueda de Riku y del rey.


    Para librar al Castillo Disney de

    una invasión de zarzas, Sora

    atravesó una puerta creada por

    Merlín, y apareció en un mundo

    en blanco y negro.
- id: 11814
  text: Pato Donald
- id: 11815
  text: >-
    El Mago de la Corte.


    Para salvar el Castillo Disney,

    Donald cruzó una puerta que

    Merlín hizo aparecer y llegó a

    un mundo en blanco y negro

    que le resultaba extrañamente familiar.
- id: 11816
  text: Goofy
- id: 11817
  text: >-
    Capitán de los Caballeros Reales.


    Para salvar el Castillo Disney,

    Goofy cruzó una puerta que

    Merlín hizo aparecer y llegó a

    un mundo en blanco y negro

    que le resultaba extrañamente familiar.
- id: 11818
  text: Pete
- id: 11819
  text: >-
    Viejo enemigo del rey Mickey,

    viajó al pasado por orden de Maléfica.


    Como parte de su plan de dominar

    el Castillo Disney, Pete quiere

    destruir la Piedra Angular de

    Luz. Sin ella, el castillo quedará

    indefenso.
- id: 11820
  text: Pete (?)
- id: 11821
  text: >-
    Este capitán de un barco de vapor

    es diferente al Pete que ya

    conocemos. No parece tener

    ninguna conexión con los

    sincorazón. ¡Ni siquiera reconoce

    a Sora, Donald y Goofy!


    Me pregunto si estará tratando

    de engañarnos.
- id: 11822
  text: Horacio
- id: 11823
  text: >-
    Un viejo amigo de Sus Majestades,

    Mickey y Minnie, y de los habitantes

    del Castillo Disney. Horacio

    no sería Horacio sin su gran

    collar de arado. También es muy

    amigo de la vaca Clarabella.
- id: 11824
  text: Clarabella
- id: 11825
  text: >-
    Una vieja amiga de Sus Majestades,

    Mickey y Minnie, y de los habitantes

    del Castillo Disney.

    También es íntima amiga del

    caballo Horacio. A Clarabella

    le encantan los cotilleos.
- id: 11826
  text: Clara
- id: 11827
  text: >-
    Una famosa gallina, cantante de

    ópera. Es una vieja amiga del rey

    y la reina, y de los demás habitantes

    del Castillo Disney.
- id: 11828
  text: El rey Mickey (?)
- id: 11829
  text: >-
    Es el mismísimo rey Mickey, pero

    en este mundo no tiene mucho

    que decir; y es un poco distinto

    del rey que todos conocemos.


    Su Majestad está actuando como

    si fuera otra persona.

    ¿Qué estará pasando?
- id: 11830
  text: Sora
- id: 11831
  text: >-
    El elegido de la llave espada

    lucha sin tregua contra los

    sincorazón y los incorpóreos.


    Hace tiempo, ayudó a

    desbaratar los planes de Oogie

    para controlar Ciudad de Halloween.
- id: 11832
  text: Pato Donald
- id: 11833
  text: >-
    El Mago de la Corte recorre los

    mundos en busca del rey,

    acompañado de Sora y de Goofy.


    Hace un tiempo, ayudó a desbaratar

    el plan de Oogie para apoderarse

    de Ciudad de Halloween.
- id: 11834
  text: Goofy
- id: 11835
  text: >-
    El Capitán de los Caballeros Reales

    recorre los mundos junto a Sora

    y Donald, en busca del rey.


    Hace un tiempo, ayudó a desbaratar

    el plan de Oogie para apoderarse

    de Ciudad de Halloween.
- id: 11836
  text: Jack Skelleton
- id: 11837
  text: >-
    El Rey Calabaza. Lo que más le

    gusta en este mundo es asustar

    a la gente. Cuando Sora y sus amigos

    le conocieron por primera vez,

    Jack quería usar a los sincorazón

    para condimentar sus escalofriantes

    celebraciones de Halloween. Pero

    las cosas no resultaron como Jack

    había planeado.


    Ahora está fascinado con la Navidad.

    Ha decidido dar un descanso a

    Santa Claus, y demostrar que él

    puede encargarse del gran día y

    hacer un trabajo de primera.
- id: 11838
  text: Jack Skelleton
- id: 11839
  text: >-
    Adora asustar a la gente, pero

    cuando Jack descubrió la Navidad

    quedó alucinado. Incluso pensó

    que podía mejorarla agregándole

    un toque escalofriante.


    Jack quería entregar los regalos

    a los niños del mundo, en lugar de

    Santa Claus, pero este le ayudó a

    darse cuenta de que su talento era

    más apropiado para Halloween. ¡Pero

    Jack aún guarda el traje de

    Santa Claus que Sally le hizo!
- id: 11840
  text: Sally
- id: 11841
  text: >-
    Una de las creaciones del Dr. Finkelstein.

    Sally está hecha de retazos y sus

    trozos a veces se desprenden y se

    mueven solos. Es experta en

    remendarse a sí misma con

    aguja e hilo.


    Habitualmente, Sally ayuda al Dr.

    Finkelstein en el laboratorio, pero le

    gustaría pasar más tiempo con Jack.
- id: 11842
  text: Dr. Finkelstein
- id: 11843
  text: >-
    El científico loco de Ciudad de

    Halloween. Sally es una de sus

    creaciones.


    Cuando Sora y sus amigos

    conocieron al doctor, este intentaba

    crear un corazón. Fracasó, pero

    no ha perdido el interés en sus

    extrañas invenciones.


    La cabeza del doctor está hecha

    de placas de acero que se abren

    para su mantenimiento.
- id: 11844
  text: Zero
- id: 11845
  text: >-
    El perro fantasma de Jack. En

    cuanto su amo lo llama, sale de

    su tumba y acude enseguida;

    nunca se cansa de jugar con él.
- id: 11846
  text: Alcalde
- id: 11847
  text: >-
    El Alcalde de Ciudad de Halloween

    tiene dos caras, una versión

    feliz y otra triste, que se alternan

    según su estado de ánimo, ¡y

    este es bastante cambiante!


    Él confía plenamente en

    Jack para los preparativos de

    Halloween. De hecho, el Alcalde

    es incapaz de tomar decisiones

    sin antes consultar a Jack.
- id: 11848
  text: Lock
- id: 11849
  text: >-
    Un miembro del trío de bromistas

    junto con Shock y Barrel.

    Su bañera caminante les ayuda

    a trasladarse para cometer

    toda clase de travesuras.


    A veces ayudan a Oogie, pero

    no le son muy fieles.
- id: 11850
  text: Shock
- id: 11851
  text: >-
    Otro miembro del trío travieso.

    Shock es la más ingeniosa de los

    tres y aparece con montones

    de ideas para meter bulla.

    Cuando Oogie fue derrotado,

    comenzó a portarse mejor,

    aunque no demasiado.
- id: 11852
  text: Barrel
- id: 11853
  text: >-
    Un miembro del trío de bromistas

    junto con Shock y Lock. A

    menudo es el blanco de las

    bromas de sus compañeros.
- id: 11854
  text: Santa Claus
- id: 11855
  text: >-
    También conocido como Papá

    Noel. Cada 25 de diciembre

    Santa Claus hace realidad

    los sueños de los niños,

    repartiendo regalos en un trineo

    tirado por renos voladores. Para

    preparar la Navidad, depende

    de su lista de los niños y niñas

    que se han portado bien durante

    el año.


    Parece que nuestro amigo Jack

    Skelleton está un poco confundido.

    Cree que el nombre de Santa Claus

    es Santa Clavos.
- id: 11856
  text: Renos
- id: 11857
  text: >-
    Un conjunto de renos al estilo

    Halloween, especialmente

    diseñados para Jack por el

    Dr. Finkelstein. Son ideales para

    tirar del ataúd que Jack usa

    como trineo para surcar el

    cielo navideño.
- id: 11858
  text: Oogie Boogie
- id: 11859
  text: >-
    Una malvado saco de bichos

    que ama apostar a los dados y

    desea estropear los planes de Jack

    para Halloween. Sora y sus amigos

    ya lo derrotaron una vez, pero

    Maléfica lo trajo de vuelta como

    parte de su plan macabro.
- id: 11860
  text: El experimento
- id: 11861
  text: >-
    Un muñeco creado por el

    Dr. Finkelstein.


    A diferencia de Sally, no poseía un

    corazón, así que intentó encontrar

    uno buscando en el amor que hay

    depositado en los regalos.
- id: 11864
  text: Sora
- id: 11865
  text: >-
    El elegido de la llave espada, un

    chico destinado a combatir a los

    sincorazón y los incorpóreos. Sora

    busca a Riku con la esperanza

    de que puedan regresar juntos

    a sus islas.


    Cuando llegó a Port Royal, Sora

    no pudo disimular su asombro

    ante un mundo tan distinto

    de los otros que había visitado.
- id: 11866
  text: Pato Donald
- id: 11867
  text: >-
    El Mago de la Corte recorre los

    mundos en busca del rey Mickey,

    que pretende resolver el enigma

    de la Organización {XIII}.


    Cuando llegó a Port Royal,

    Donald no podía ocultar el asombro

    que le causaba un mundo tan

    distinto a todos los que había visitado.
- id: 11868
  text: Goofy
- id: 11869
  text: >-
    El Capitán de los Caballeros Reales

    recorre los mundos en busca del

    rey Mickey, que pretende resolver

    el enigma de la Organización {XIII}.


    Cuando llegó a Port Royal,

    Goofy no podía ocultar el asombro

    que le causaba un mundo tan

    distinto a todos los que había visitado.
- id: 11870
  text: Will Turner
- id: 11871
  text: >-
    Un hábil herrero, especialista

    en espadas. Cuando era niño, el

    barco en el que viajaba fue hundido

    por piratas y él quedó a la deriva.

    Fue entonces cuando

    desapareció el medallón pirata

    que su padre le había regalado.


    La joven Elizabeth Swann iba

    a bordo del barco que rescató a Will,

    y desde entonces se hicieron buenos

    amigos. Como el padre de Elizabeth

    es el Gobernador de Port Royal, Will

    se muestra un poco tímido y muy

    formal en su trato con ella.
- id: 11874
  text: Elizabeth Swann
- id: 11875
  text: >-
    Es la hija del gobernador de Port Royal.

    Para proteger a Will, ella ocultó

    el medallón pirata a su padre y sus

    hombres. Tiene una idea romántica

    sobre la vida de los piratas y de vez

    en cuando le gusta contemplar

    el medallón.


    Will es tímido y muy formal

    en su trato, dada la posición

    de su padre, pero ella

    preferiría que no fuera así.
- id: 11876
  text: Capitán Jack Sparrow
- id: 11877
  text: >-
    Un pirata amante de la vida en alta mar.

    Es un pintoresco personaje, que

    valora su libertad sobre todo.

    Asegura que es capitán, pero

    no parece tener tripulación.


    Jack fue arrestado en Port Royal

    y enviado a prisión, pero Will Turner

    le ayudó a escapar durante un ataque

    pirata. Jack parece saber algo

    importante sobre Will.

    Me pregunto qué será.
- id: 11878
  text: Capitán Barbossa
- id: 11879
  text: >-
    Es el capitán de la "Perla Negra" y

    líder de los piratas zombis.


    La maldición del oro azteca mantiene

    a Barbossa y a sus hombres en una

    especie de limbo entre la vida y la

    muerte. A la luz de la luna,

    su verdadera forma se revela, y

    es una visión terrorífica.


    Ahora, el capitán Barbossa

    se ha unido a Pete para buscar

    no sé qué...
- id: 11880
  text: Sora
- id: 11881
  text: >-
    El portador de la llave espada abre

    las puertas de los mundos en

    busca de su amigo Riku.


    Trasteando con el ordenador de

    Ansem, activó alguna clase de

    dispositivo que transportó al grupo

    al interior de un ordenador.
- id: 11882
  text: Pato Donald
- id: 11883
  text: >-
    El Mago de la Corte salió del

    Castillo Disney en busca del

    rey Mickey.


    Donald trató de usar el ordenador

    de Ansem para encontrar al rey, pero

    su impaciencia provocó que el PCM

    transportara a los tres amigos

    a un mundo dentro del sistema

    informático.
- id: 11884
  text: Goofy
- id: 11885
  text: >-
    El Capitán de los Caballeros Reales

    salió del Castillo Disney en busca del

    rey Mickey.

    Donald trató de usar el ordenador

    de Ansem para encontrar al rey, pero

    su impaciencia provocó que el PCM

    transportara a los tres amigos

    a un mundo dentro del sistema

    informático.
- id: 11886
  text: Tron
- id: 11887
  text: >-
    Es un programa de seguridad creado

    por un usuario para vigilar al PCM.


    Tron es muy eficiente y hará

    lo que su usuario le solicite.
- id: 11888
  text: Sark
- id: 11889
  text: >-
    Este poderoso programa no

    responde ante ningún usuario,

    solo ante el PCM.

    El comandante Sark es bastante

    severo con cualquier programa

    que intente resistir al poder de su amo.
- id: 11890
  text: PCM
- id: 11891
  text: >-
    Es el Programa de Control Maestro,

    y como programa de control principal,

    el que rige el sistema.


    En lugar de trabajar para los

    usuarios, el PCM está

    planeando controlar el

    sistema él mismo. Se

    niega a ejecutar órdenes

    de los usuarios, intenta llevar

    a cabo su plan maligno y está

    sembrando el caos entre los

    otros programas.
- id: 11892
  text: Programa hostil
- id: 11893
  text: >-
    Un programa ejecutado desde el

    entorno de datos DTD para

    destruir la ciudad.
- id: 11900
  text: Sora
- id: 11901
  text: >-
    El elegido por la llave espada.


    Junto a Donald y Goofy, ha

    buscado incansablemente a

    Kairi y a Riku. A lo largo de su viaje,

    ha conocido a muchas personas y

    superado numerosas pruebas.

    Por fin, ha atravesado una

    Villa Crepúsculo paralela y la

    oscuridad misma para llegar al

    campo de batalla definitivo.


    Más allá... ¿encontrará la luz...

    o algo distinto? El destino está en

    manos de Sora.
- id: 11902
  text: Pato Donald
- id: 11903
  text: >-
    Es el Mago de la Corte.

    Durante su largo viaje, Donald,

    Goofy y Sora han hecho un

    montón de amigos.


    La lealtad de Donald hacia el rey

    y su amistad con Sora mantienen

    el optimismo del grupo ahora que

    se aproxima la batalla más grande

    de todas.
- id: 11904
  text: Goofy
- id: 11905
  text: >-
    Capitán de los Caballeros Reales.

    Durante su largo viaje, Donald,

    Goofy y Sora han hecho un montón

    de amigos.


    Valiente y confiado, Goofy quiere

    salvar a sus amigos y al rey, y está

    listo para afrontar la batalla

    más grande de todas.
- id: 11906
  text: Xemnas
- id: 11907
  text: >-
    El n.º {I} de la Organización {XIII}

    es el líder del grupo.

    Xemnas es el incorpóreo de

    Xehanort, un aprendiz de Ansem.


    Estaba usando a Sora y su llave

    espada para reunir los corazones

    liberados de los sincorazón y

    culminar Kingdom Hearts.
- id: 11908
  text: Xigbar
- id: 11909
  text: >-
    El n.º {II} de la Organización {XIII}.


    Una vez le dijo a Sora que le

    recordaba a otra persona. Sus

    palabras fueron desconcertantes.


    Algo en él pareció disfrutar de la

    reacción de Sora.
- id: 11912
  text: Vexen
- id: 11913
  text: >-
    El n.º {VII} de la Organización {XIII}.


    Saïx perseguía sin tregua al

    rebelde Axel, y fue él quien atrapó

    a Kairi y la encerró en un calabozo

    del castillo, cuando ella logró

    escapar de Axel.


    Si Saïx ve que puede usar algo

    para sacar ventaja, lo hará sin

    pensarlo dos veces.
- id: 11918
  text: Saïx
- id: 11919
  text: >-
    El n.º {VII} de la Organización {XIII}.


    Saïx perseguía sin tregua al

    rebelde Axel. Fue él quien atrapó

    a Kairi y la encerró en un calabozo

    del castillo, cuando ella logró

    escapar de Axel.


    Si Saïx puede usar algo para

    sacar ventaja, lo hará sin

    pensarlo dos veces.
- id: 11924
  text: Luxord
- id: 11925
  text: >-
    El n.º {X} de la Organización {XIII}.

    Un tahúr capaz de manipular el

    tiempo.


    Tras sorprender a Sora y sus

    amigos con sus ladinas palabras,

    Luxord se dio el gusto de

    luchar contra ellos en un

    extraño juego.


    En Port Royal, Luxord utilizó a los

    sincorazón y las piezas del oro

    maldito para experimentar en

    beneficio de la Organización

    y recolectar más corazones.
- id: 11930
  text: Roxas
- id: 11931
  text: >-
    El n.º {XIII} de la Organización {XIII},

    portador de una llave espada y

    morador de la oscuridad.


    Se desvaneció esbozando una

    sonrisa de satisfacción tras

    enfrentarse a Sora. Pero parece

    que Sora fue el único que pudo verle.
- id: 11932
  text: Soldado
- id: 11933
  text: >-
    Lanza ataques a diestro y

    siniestro. ¡Mucho cuidado

    con él!


    Contraataca con una patada.

    Para evitarlo, lo mejor es usar

    Ciclón, ¡te elevarás en el aire

    y podrás atacarle con combos!
- id: 11934
  text: Sombra
- id: 11935
  text: >-
    Se funde con el suelo al

    moverse. Para vencerle,

    espera el momento correcto.


    ¡Atácale en cuanto salga a

    la superficie!
- id: 11936
  text: Grandullón
- id: 11937
  text: >-
    Suele bloquear los ataques

    frontales. Intenta usar combos

    por la espalda y terminar con

    Machada.


    Cuando se enfurece, embiste

    repetidamente. Aprovéchalo

    y usa los comandos de

    reacción. Y para acabar,

    ¡prueba con Contra!
- id: 11938
  text: Roca plateada
- id: 11939
  text: >
    Se convierte rápidamente en

    una bola de luz y explota al

    volver a aparecer. Usa los

    comandos de reacción cuando

    se convierta en la bola de luz.


    Tiene gran resistencia a la

    magia, ¡así que usa la llave espada!
- id: 11940
  text: Blues esmeralda
- id: 11941
  text: >-
    Atácale desde lejos y ten

    cuidado con sus rápidas

    embestidas. Si tiene poca VT

    forma un tornado que atrae

    a sus enemigos.


    Tiene gran resistencia a la

    magia, ¡así que usa la llave

    espada!
- id: 11942
  text: Jazz carmesí
- id: 11943
  text: >-
    ¡Cuidado con él! Persigue a sus

    enemigos y va dejando minas

    por donde pasa.


    Si tiene poca VT, coloca una

    gran mina. Procura alejarte

    antes de que explote. Tiene

    gran resistencia a la magia,

    ¡así que usa la llave espada!
- id: 11944
  text: Pirata volador
- id: 11945
  text: >-
    Su rapidez lo hace un blanco

    difícil, así que espera a que se

    pare antes de atacar. Para

    detenerle, usa magia.


    ¡Evita sus contraataques

    utilizando los comandos de

    reacción!
- id: 11946
  text: Ilusión fantasmal
- id: 11947
  text: >-
    Tiene dos caras, y ambas

    requieren diferentes

    estrategias de combate.


    Si está en el aire, acércate

    para evitar sus ataques a

    distancia. Si está en el suelo,

    aléjate para evitar sus ataques

    cuerpo a cuerpo.
- id: 11948
  text: Perro rabioso
- id: 11949
  text: >-
    Estará inmóvil hasta que te

    acerques, así que atácale con

    rapidez.


    Si contraatacas, se cansará

    y bajará la guardia. Aprovecha

    ese momento y la batalla

    resultará más fácil.
- id: 11950
  text: Gancho vampiro
- id: 11951
  text: >-
    Suele revolotear por el lugar,

    al acecho. Cuando baje en

    picado, usa Chillido para atraparlo

    y atacar con él a los enemigos

    cercanos.


    Tras ese ataque, usa combos

    aéreos y acaba con él.
- id: 11952
  text: Bibliotecario
- id: 11953
  text: >-
    Un gran mago, diestro en los

    tres tipos de magia elemental.


    Adopta distintas formas para

    usar cada tipo de hechizo, y se

    asemeja a los Nocturno rojo,

    Rapsodia azul y Ópera amarilla.

    Es inmune a todas las magias, y

    debes vencerlo de inmediato si no

    quieres pasarlo mal.
- id: 11954
  text: Minuto explosivo
- id: 11955
  text: >-
    Cuando le atacas, inicia una

    cuenta atrás hasta explotar.

    Usa Cabriola segundos antes de

    la explosión y acabarás con los

    enemigos que haya cerca.


    Si eludes sus embestidas, se

    desalentará y será un blanco fácil.
- id: 11956
  text: Martillo furioso
- id: 11957
  text: >-
    Golpea el suelo y crea una onda

    expansiva. Salta para esquivarla,

    y ataca con combos.


    Cuando su VT baje, lanzará una

    serie de embestidas, ¡así que

    remátalo cuanto antes!
- id: 11958
  text: Vendedor corpulento
- id: 11959
  text: >-
    Extraño sincorazón que solo

    aparece en ciertos mundos, si

    exploras un poco.


    No vuelve a aparecer en el

    mismo lugar por un tiempo.

    Usa los comandos de reacción

    y obtendrás valiosos objetos.

    Si descubres su patrón de

    ataque, conseguirás objetos

    especiales.
- id: 11960
  text: Pitonisa
- id: 11961
  text: >-
    Domina los hechizos Hielo

    y es inmune a ese tipo de magia.


    Si tiene poca VT, intentará

    congelar a sus enemigos.

    Trata de contraatacar a este

    enemigo con Tiro limpio.
- id: 11962
  text: Cañón
- id: 11963
  text: >-
    Lanza bombas desde lejos, así

    que trata de vencerle pronto.

    Al atacarle, evita las áreas

    donde van a caer las bombas.


    Cuando te aproximes, se

    alejará, así que ve tras él

    y no le dejes escapar.
- id: 11964
  text: Cohete repentino
- id: 11965
  text: >-
    Ataca en grupo, así que los

    comandos de reacción te serán

    útiles. Comienza con Trampa

    veloz y sigue con Aeroestocada.


    Cuando contraataca, persigue

    a su enemigo con tesón.

    ¡Será mejor que te alejes!
- id: 11966
  text: Gran taladro
- id: 11967
  text: >-
    Se mueve bajo el suelo, así que

    sigue las nubes de polvo

    para saber su posición.


    Usa un ataque final para que

    salga del suelo, y en cuanto

    asome, ¡ataca con decisión!
- id: 11968
  text: Lancero
- id: 11969
  text: >-
    El soldado y su lanza no acaban

    de congeniar, así que es fácil

    pillarle con la guardia baja.


    Si tiene poca VT, la lanza

    enloquece. Arrebátasela con

    Quitar lanza y úsala para atacar.

    Trata de que baje su VT y

    quítale la lanza, te será muy útil.
- id: 11970
  text: Lucero del alba
- id: 11971
  text: >-
    Cuando su VT baja, lanza su

    ataque Prensa. ¡Contraataca

    con Sacudida y Meteórico!


    ¡Puedes lanzar una sucesión de

    Meteóricos y no olvidar golpear

    a los enemigos que haya cerca!
- id: 11972
  text: Globo fiero
- id: 11973
  text: >-
    Corre antes de atacar, por lo que

    sus movimientos son predecibles.


    Tiene poca VT y no resiste el frío.

    Si usas hechizos de Hielo, no te

    resultará difícil vencerle.
- id: 11974
  text: Cubo helado
- id: 11975
  text: >-
    Salta antes de atacar, por lo que

    sus movimientos son predecibles.


    Tiene poca VT y no resiste el

    fuego. Con hechizos Piro, no te

    resultará difícil vencerle.
- id: 11976
  text: Bandido obeso
- id: 11977
  text: >-
    Es inmune a hechizos Piro, y elude

    la mayoría de los ataques frontales.

    Atácale por la espalda y

    remátalo con un combo.


    ¡Si evitas sus bombas, tendrás

    ocasión de lanzar un ataque Machada!
- id: 11978
  text: Bandido lunar
- id: 11979
  text: >-
    Durante el combate suele echarse

    hacia atrás, así que deberás

    abalanzarte sobre él.


    Si esquivas sus ataques, bajará la

    guardia y podrás vencerlo pronto.
- id: 11980
  text: Gárgola pétrea
- id: 11981
  text: >-
    Parece una estatua común y

    corriente, pero de repente se

    convierte en un molesto enemigo.


    Es inmune a la magia y puede

    atacar desde cualquier distancia.

    Trata de eludirla hasta que puedas

    usar los comandos de reacción.
- id: 11982
  text: Gárgola guerrera
- id: 11983
  text: >-
    Parece una estatua común y

    corriente, pero de repente se

    convierte en un molesto enemigo.


    Es inmune a la magia, y puede

    atacar desde cualquier distancia.

    Evita sus ataques giratorios

    y podrás usar comandos de

    reacción. Si lo haces en el

    momento justo, la vencerás

    de un solo golpe.
- id: 11984
  text: Osado caballero
- id: 11985
  text: >-
    Al principio solo merodea,

    pero una vez que le ataques

    te acosará con insistencia.

    Deberás esquivar sus ataques

    y contraatacar.
- id: 11986
  text: Soldado de plomo
- id: 11987
  text: >-
    Esperará la ocasión de

    acercarse, así que atácale

    desde cierta distancia.


    Cuando se convierta en una caja,

    comenzará a atacar desde lejos,

    y te será difícil acercarte.
- id: 11988
  text: Aviador maligno
- id: 11989
  text: >-
    Dispara balas desde el aire,

    pero solo hacia delante.


    La velocidad de sus movimientos

    aumenta al contraatacar; procura

    vencerle mientras su vuelo es lento.
- id: 11990
  text: Coche loco
- id: 11991
  text: >-
    Es difícil acertarle, pues ataca y

    retrocede a gran velocidad. Para

    vencerle, deberás usar magia.


    Si tiene poca VT, se mueve

    aún más rápido, así que acaba

    con él cuanto antes.
- id: 11992
  text: Centauro fatal
- id: 11993
  text: >-
    Su lanza es letal. Para vencerle,

    es conveniente lanzar ataques

    prudentes con Saltar.


    Si tiene poca VT, se vuelve

    más audaz.

    No le des respiro y trata de

    vencerle antes de que use

    su ataque explosivo.
- id: 11994
  text: Noctámbulo
- id: 11995
  text: >-
    Mientras ataca, salta con tesón.

    Trata de derrotarle de inmediato,

    o se volverá una pesadilla.

    Ten cuidado con su poderoso

    contraataque.
- id: 11996
  text: Cargador magno
- id: 11997
  text: >-
    Gira alrededor de su enemigo en

    el sentido de las agujas del reloj.

    Recuérdalo cuando le ataques.


    Es muy rápido, así que trata de

    atacarle en los pocos momentos

    en que reduce la velocidad.


    Si te mantienes alerta, podrás

    evitar su veloz embestida y

    contraatacar con Estocada rápida.
- id: 11998
  text: Bombardero láser
- id: 11999
  text: >-
    Gira alrededor de su enemigo en

    el sentido de las agujas del reloj.

    Recuérdalo cuando le ataques.


    Trata de mantenerte cerca de él,

    pues con su láser puede atacar

    desde lejos.
- id: 12000
  text: Devastador
- id: 12001
  text: >-
    Es capaz de volar o transformarse

    en un tanque. Acosa a sus

    enemigos desde el aire. Es mejor

    guardar las distancias. El tanque

    ataca desde lejos; esquiva sus

    cañones para aproximarte.


    ¡Ten cuidado, pues durante la

    transformación lanza un poderoso

    ataque eléctrico!
- id: 12002
  text: Huesos vivientes
- id: 12003
  text: >-
    Sus ataques son muy fuertes y

    causan mucho daño. ¡Debes

    evitarlos! ¡Puedes debilitarlo

    en un instante si le aplastas la

    cabeza con el comando de reacción!


    En compañía de un chamán, lanza

    maldiciones mortales.

    Intenta acabar con él como

    si tú fueras un chamán.
- id: 12004
  text: Chamán
- id: 12005
  text: >-
    Ataca desde lejos y se mueve

    poco. Es muy resistente a la

    magia. Cuando adopta la forma

    de una máscara, anula todos

    tus ataques.


    A veces, lanza llamas malditas que

    persiguen a su objetivo con

    insistencia, ¡pero puedes

    aprovecharlas con los comandos

    de reacción!
- id: 12006
  text: Boxeador aéreo
- id: 12007
  text: >-
    Una vez que comienza la batalla,

    no hay escapatoria.


    Usa tres tipos de golpes, y si

    logras predecir cuál usará, podrás

    elegir la estrategia apropiada.


    Su embestida es muy poderosa,

    ¡pero puedes vencerle en poco

    tiempo si usas repetidamente

    los comandos de reacción!
- id: 12008
  text: Tornado golpeador
- id: 12009
  text: >-
    Ataca sin dejar de moverse.

    Cuando empieza a girar, tienes

    que detenerlo con los comandos

    de reacción.


    Si usas Tornado, le atraparás y

    podrás acabar con otras amenazas

    cercanas sin correr peligro.
- id: 12010
  text: Claxon sanador
- id: 12011
  text: >-
    Devuelve la VT a los enemigos

    cercanos, pero si usas Pisotón

    en el momento justo, curará a tus

    aliados.


    En cuanto le ataques

    pedirá ayuda, así que derrótale

    cuanto antes.
- id: 12012
  text: Enredadera
- id: 12013
  text: >-
    Permanece en un lugar y dispara

    semillas. Cuando te ataque

    con sus raíces, usa los comandos

    de reacción.

    ¡Con Podar, puedes arrancarla

    de raíz y atacar a los enemigos

    cercanos simultáneamente!
- id: 12014
  text: Armadura sombría
- id: 12015
  text: >-
    Carga contra su objetivo en grupo.

    Cuando salte para lanzar su

    embestida desde el aire, usa el

    comando de reacción Sol naciente.


    ¡Si lo usas varias veces seguidas,

    lanzarás poderosos combos!
- id: 12016
  text: Robot centinela
- id: 12017
  text: >-
    ¡Trata de usar los comandos de

    reacción Atrapar y Fumigar para

    deshacerte de los enemigos

    cercanos con el láser!


    ¡Si los enemigos logran eludir el

    ataque láser, no dejes de usar

    otros comandos de reacción!
- id: 12020
  text: Neosombra
- id: 12021
  text: >-
    Antes de atacar, proyecta una

    sombra en el suelo. Tras atacar,

    baja la guardia. ¡Aprovecha!


    Cuando intente saltar sobre ti,

    ¡usa Danza del viento, y lanzarás

    una ráfaga de ataques!
- id: 12022
  text: Jefe volcánico
- id: 12023
  text: >-
    Este sincorazón llegó a Agrabah

    con el grupo del avariento Pete.

    Apareció con el Jefe gélido.


    Era débil ante los hechizos Hielo,

    pero atormentó a Sora y compañía

    usando hábilmente el fuego.
- id: 12024
  text: Jefe gélido
- id: 12025
  text: >-
    Este sincorazón llegó a Agrabah

    con el grupo del avariento Pete.

    Apareció con el Jefe volcánico.


    Era débil ante los hechizos Piro,

    pero atormentó a Sora y compañía

    usando hábilmente el hielo.
- id: 12026
  text: Usurpador
- id: 12027
  text: >-
    Este sincorazón apareció en el

    castillo de Bestia. Tomó posesión

    de la puerta de entrada a la

    mazmorra, transformándose en el

    sincorazón llamado Custodio.


    Tenía la habilidad de ocultarse,

    pero no era muy poderoso.
- id: 12028
  text: Custodio
- id: 12029
  text: >-
    La puerta que poseyó

    Usurpador cuando atacó a

    Sora y a sus amigos.


    Usando Liberar, lograron 

    separar a Usurpador de 

    la puerta.

    Todo el poder de la llave espada

    fue descargado en la cerradura

    que bloqueaba con sus brazos.
- id: 12030
  text: Espinas de sombra
- id: 12031
  text: >-
    La versión liberada de Sombra

    acechante que apareció en el

    castillo de Bestia.


    Aparecía, desaparecía y corría

    a lo loco. No fue una batalla fácil

    para Sora y sus amigos.
- id: 12032
  text: Sombra acechante
- id: 12033
  text: >-
    El sincorazón que atacó a Bella

    en el castillo de Bestia.


    Saltaba por el suelo, por las

    columnas e incluso hasta la gran

    lámpara del salón de baile.

    ¡Una verdadera locura!
- id: 12034
  text: Iluminador
- id: 12035
  text: >-
    Un sincorazón que Pete llevó

    a Port Royal.


    Tenía ojos fulgurantes y con la

    lámpara de su cola absorbía la

    luz. Así sumía el lugar en la

    oscuridad y ayudaba a Barbossa,

    cuya debilidad era la luz de la luna.
- id: 12036
  text: Parca pirata
- id: 12037
  text: >-
    Se dice que este sincorazón

    apareció en Port Royal a causa

    del oro azteca maldito.


    Por la maldición se convirtió en

    un zombi demoníaco; un enemigo

    difícil de vencer.
- id: 12038
  text: Terremoto salvaje
- id: 12039
  text: >-
    Es el sincorazón gigante que

    apareció en las Tierras del Reino.

    Surgió debido a la presencia

    fantasmal de Scar.


    Sacudió la tierra y sumió la

    sabana en el caos. El

    gigantesco ser era

    controlado por un ente

    que iba montado en su

    lomo.
- id: 12040
  text: Carcelero
- id: 12041
  text: >-
    Maléfica llevó a este sincorazón

    a Ciudad de Halloween para

    vengarse de Sora.


    Mientras realizaba sus ataques

    elementales, mantenía encerrados

    a Lock, Shock y Barrel.
- id: 12042
  text: Jinete de tormentas
- id: 12043
  text: >-
    Este monstruo gigantesco

    apareció en los cielos de la

    Tierra de Dragones. Sora

    tuvo que librar una intensa

    batalla en las puertas del palacio.


    Originariamente, era una criatura

    que daba fuerzas a la tierra y al

    pueblo chino, pero fue convertida

    en un peligroso sincorazón.
- id: 12044
  text: Trepador
- id: 12045
  text: >-
    Es el más débil de los incorpóreos.

    Adopta varias formas y es

    difícil anticipar sus movimientos.


    Cuando aparece con los umbríos,

    puedes detener sus movimientos con

    Finta antes de atacarles.
- id: 12046
  text: Umbrío
- id: 12047
  text: >-
    Es difícil anticipar los movimientos

    de estas criaturas. Prueba a usar

    Finta para que bajen la guardia y

    así poder atacarles. Si alternas

    series de ataques con fintas

    la batalla será más entretenida.


    Nota: cuando bloqueas sus ataques,

    también bajan la guardia.

    Lo mismo sucede con los demás

    incorpóreos.
- id: 12048
  text: Dragón
- id: 12049
  text: >-
    Un dragón es un incorpóreo de gran

    categoría. Cuando, tras evitar su

    ataque, aparezca una bola de luz, usa

    Aprender. Si eres preciso, podrás

    usar Saltar y atacar.


    Puedes usar Aprender muchas veces,

    así que trata de encadenar ataques

    con el comando Saltar.
- id: 12050
  text: Asesino
- id: 12051
  text: >-
    Un asesino es un incorpóreo de gran

    categoría. Se oculta en el suelo y

    ataca sigilosamente desde atrás.


    No puedes atacarle cuando está en

    el suelo, así que haz lo posible para

    tenerlo frente a frente.


    ¡Ten cuidado si comienza a correr

    alrededor, pues es cuando lanza

    poderosos ataques! ¡Aprovecha

    siempre que puedas los comandos

    de reacción para derrotar a varios

    de una sola vez!
- id: 12052
  text: Samurái
- id: 12053
  text: >-
    Un samurái es un incorpóreo de gran

    categoría. Es capaz de manejar hasta

    cuatro armas a la vez, y usa tanto las

    espadas como sus vainas. Su ataque

    es sereno y muy eficaz.


    No debes perderle de vista

    cuando se oculte bajo el suelo.

    Si repeles su ataque, se sentará a

    esperar, y tú tendrás oportunidad

    de usar comandos de reacción.


    Lucha cada vez con uno, mientras

    los otros se sientan y observan.
- id: 12054
  text: Francotirador
- id: 12055
  text: >-
    Un francotirador es un incorpóreo de

    gran categoría. Es muy hábil y sus

    movimientos desafían la gravedad.

    Si usas magia, te será más fácil

    derrotarlo.


    Arroja peligrosas flechas de luz que

    puedes rechazar con el comando

    Ataque súbito. ¡Si lo usas varias veces,

    no tardarás en conseguir la victoria!
- id: 12056
  text: Bailarina
- id: 12057
  text: >-
    La bailarina es un incorpóreo de gran

    categoría que se desliza por el suelo.

    Cuando te acercas, se aleja con

    rapidez. Espera el final de su ataque

    para lanzar el tuyo. ¡Si al aproximarse

    va agazapada, ten mucho cuidado!


    Cuando la acorralas, contraataca en

    grupo con patadas y otras artimañas.

    Sé muy cuidadoso si te

    superan en número.
- id: 12058
  text: Enloquecedor
- id: 12059
  text: >-
    Un enloquecedor es un incorpóreo

    de gran categoría. Sus ataques son

    casi impredecibles, ya que es

    arrastrado por un martillo maldito.


    Su martillo hace inútiles los

    ataque frontales. Derríbalo

    para quitárselo. Luego, recoge

    el martillo y lanza una ristra de

    ataques con Locura.
- id: 12060
  text: Tahúr
- id: 12061
  text: >-
    El tahúr es un incorpóreo de gran

    categoría. No le va la lucha, así que

    suele dedicarse a flotar por ahí.


    Si te ataca con sus cartas y dados,

    usa el comando de reacción, ¡y el

    juego dará comienzo!


    No pierdas, o sucederá algo terrible.

    ¡Si ganas tendrás la oportunidad de

    atacarle y tal vez obtengas algo

    especial!
- id: 12062
  text: Penumbra espinosa
- id: 12063
  text: >-
    Un incorpóreo gigante al que

    Roxas venció en la Estación

    del Despertar.


    Aunque trató de atrapar a Roxas con

    sus espinas, fue superado y vencido

    por la fuerza del elegido de la

    llave espada.
- id: 12064
  text: Paladín
- id: 12065
  text: Prueba
- id: 12066
  text: Monje
- id: 12067
  text: Prueba
