- id: 10448
  text: Primer dia
- id: 10449
  text: Primer dia
- id: 10450
  text: >-
    Gairebé s'han acabat les vacances d'estiu.

    Per no deprimir-nos, el Hayner ha

    suggerit passar el dia a la platja.
- id: 10451
  text: Segueix el Pence a fora!
- id: 10452
  text: >-
    Quan vaig tornar al lloc de sempre, vaig

    trobar una nota del Hayner. Volia veure'ns

    a l'estació. Al final anàvem a la platja?
- id: 10453
  text: Ves a l'estació!
- id: 10454
  text: >-
    El torneig d'Struggle se celebra avui

    en el solar esportiu.
- id: 10455
  text: Ves al solar com abans millor!
- id: 10456
  text: >-
    Les vacances eren a punt de cloure. Vam

    decidir investigar les Set Meravelles

    de Vila Crepuscle per a la redacció de l'escola.
- id: 10457
  text: Ves a l'estació i puja al tren!
- id: 10458
  text: >-
    Vaig anar al lloc de sempre, però

    era com si els meus amics no em veiessin.

    Ni tan sols els podia tocar!
- id: 10459
  text: Segueix el Hayner!
- id: 10460
  text: >-
    En Sora i els seus amics s'han despertat en una

    antiga i estranya mansió. Han dormit molt de

    temps... i a més a més han perdut la memòria!
- id: 10461
  text: Fes una ullada a fora!
- id: 10462
  text: >-
    Ens dirigim a la ciutat. Tot i que era el

    primer cop que el Sora hi anava, el lloc

    li semblava estranyament familiar.
- id: 10463
  text: Entra per la reixa!
- id: 10464
  text: >-
    Uns xatos que vam conèixer a la ciutat ens

    van dir que el rei

    ens buscava.
- id: 10465
  text: Aneu a l'estació a veure el rei!
- id: 10466
  text: >-
    Per fi hem aconseguit reunir-nos amb el rei!

    Li ha dit al Sora que pugi al tren i li ha donat

    uns quants calés per als bitllets.
- id: 10467
  text: Compra els bitllets!
- id: 10468
  text: >-
    Si el rei ha escapat de la foscor, el Riku

    segur que també! Amb el cor ple

    d'esperança, tornem a emprendre l'aventura.
- id: 10469
  text: Puja al tren!
- id: 10470
  text: >-
    Pugem al tren i arribem a una

    torre fantàstica.
- id: 10471
  text: Cap a la torre!
- id: 10472
  text: >-
    Segons el Pete, que se suposava que havia

    d'estar desterrat a una altra dimensió, la

    torre era la llar del mentor del rei.
- id: 10473
  text: Puja al capdamunt de la torre!
- id: 10474
  text: >-
    El mestre Yen Sid, mentor del rei, ens ha dit

    que el Sora és la clau que connecta el Riku

    amb el viatge que ens espera.
- id: 10475
  text: Llegeix el llibre i parla amb el Yen Sid!
- id: 10476
  text: >-
    El mestre ens ha parlat dels nostres nous

    enemics, els incorporis. Necessitem

    canviar la nostra roba per una nova i preparar-nos

    per a la batalla.
- id: 10477
  text: Ves al vestidor!
- id: 10478
  text: >-
    Les tres fades, expertes cosidores,

    ens esperaven al vestidor.
- id: 10479
  text: Parla amb les fades!
- id: 10480
  text: >-
    Amb la nova roba del Sora, ja estem

    a punt per partir. Però sembla que el mestre

    Yen Sid té alguna cosa per a nosaltres.
- id: 10481
  text: Troba el mestre Yen Sid!
- id: 10482
  text: >-
    Els mons

    ens han preparat noves rutes, i anirem obrint les portes

    a mesura que avancem. Comença la nostra aventura...
- id: 10483
  text: Enlaira't cap al següent món!
- id: 10488
  text: >-
    Quan vam arribar a Vila Crepuscle,

    vam conèixer El Vivi, que buscava

    ajuda. Alguna cosa passava al solar esportiu.
- id: 10489
  text: Afanya't, ves al quadrilàter!
- id: 10490
  text: >-
    L'organització {XIII} es va retirar i el Seifer

    va ser rescatat, però ara sembla que

    és la Kairi qui té problemes.
- id: 10491
  text: Ves a l'estació!
- id: 10492
  text: >-
    La caixa que vam trobar al Regne de

    les Tenebres contenia una foto de l'antiga mansió

    de Vila Crepuscle. Que estrany...
- id: 10493
  text: Ves a la vella mansió
- id: 10494
  text: >-
    Si hi ha dos objectes únics en aquest

    món, vol dir que hi ha dues Vila

    Crepuscle. Serà la Kairi de l'altra?
- id: 10495
  text: Entra a la vella mansió!
- id: 10496
  text: >-
    Segons el rei, l'ordinador de l'antiga

    mansió podria estar connectat amb

    l'altra Vila Crepuscle.
- id: 10497
  text: Troba l'ordinador!
- id: 10498
  text: >-
    Vam trobar l'ordinador, però

    no funciona sense la contrasenya.

    Alguna idea de quina podria ser?
- id: 10499
  text: Intenta recordar el sabor del gelat!
- id: 10500
  text: >-
    En introduir la contrasenya, el dispositiu

    es va activar, llançant un feix de llum.

    Serà el camí cap a l'altra Vila Crepuscle?
- id: 10501
  text: Toca el raig!
- id: 10502
  text: >-
    Vam arribar a l'altra Vila Crepuscle, aquella

    on vivia el Roxas. Hi ha d'haver una porta

    al Regne de la Foscor en algun lloc.
- id: 10503
  text: Busca una entrada a la foscor!
- id: 10504
  text: >
    Un cop més, tornem a Baluard Balmat.

    Les coses han canviat, però els sensecor

    segueixen passejant-s'hi com de costum.
- id: 10505
  text: >+
    Fes un volt per la ciutat!

- id: 10506
  text: >+
    En Sora i els seus amics s'alegren de

    veure la Yuffie. Tots els altres

    els esperen a casa de Merlí.

- id: 10507
  text: >+
    Ves a casa del Merlí!

- id: 10508
  text: >+
    En Léon i la colla intenten reconstruir

    la ciutat. En Sora i els seus amics prometen

    ajudar-hi. El Léon els ha d'ensenyar una cosa.

- id: 10509
  text: >+
    Ves al pati interior!

- id: 10510
  text: >+
    De sobte, apareix l'Organització {XIII}, desconcertant

    -nos amb paraules estranyes.

    La clau espasa ens obre el camí a altres mons

- id: 10511
  text: >+
    Enlaira't cap al següent món!

- id: 10512
  text: >+
    Guiats pel Merlí, el grup torna

    a Baluard Balmat, on els mostra

    el llibre del Pooh.

- id: 10513
  text: >+
    Entra en el llibre!

- id: 10514
  text: >+
    Els sensecor han arrencat algunes

    pàgines del llibre i el Pooh ha perdut la

    memòria. Troba les pàgines perdudes!

- id: 10515
  text: >+
    Reuneix les pàgines arrencades!

- id: 10516
  text: >+
    Han aparegut espines al Castell Disney.

    Potser el Merlí té alguna idea de

    què està passant.

- id: 10517
  text: >+
    Ves a veure el Merlí!

- id: 10518
  text: >+
    El Merlí ens explica com salvar el Castell

    Disney. Ha arribat el moment que en Sora

    i els seus amics passin a l'acció!

- id: 10519
  text: –––
- id: 10520
  text: >+
    El Sora i els seus amics han aconseguit

    salvar el Castell Disney del perill.

- id: 10521
  text: >+
    Enlaira't cap al següent món!

- id: 10522
  text: >+
    La tornada a Baluard Balmat no és grata.

    Els sensecor i els incorporis són a tot

    arreu. Haurem de parlar amb el Léon.

- id: 10523
  text: >+
    Ves a casa del Merlí!

- id: 10524
  text: >+
    El Sora i els seus amics descobreixen que hi ha un

    ordinador que l'Ansem solia utilitzar. La sala dels

    ordinadors és en algun lloc del porticó.

- id: 10525
  text: >+
    Ves al porticó!

- id: 10526
  text: >+
    Segons l'Aerith, el rei és amb el Léon!

    S'ha de trobar aquell ordinador sense

    perdre ni un segon més!

- id: 10527
  text: >+
    Passa pels passadissos subterranis!

- id: 10528
  text: >+
    Arribem a l'estudi de l'Ansem, però

    no hi és ni el rei, ni cap ordinador.

    Llavors, el Léon apareix.

- id: 10529
  text: >+
    Pregunta al Léon què passa!

- id: 10530
  text: >+
    El Léon toqueja la paret de l'estudi i

    hi descobreix un interruptor que obre la

    porta a la sala d'ordinadors.

- id: 10531
  text: >+
    Entra a la sala d'ordinadors!

- id: 10532
  text: >+
    Un dispositiu s'activa quan el Sora i el

    Donald es posen a remenar l'ordinador,

    enviant-los a un món desconegut.

- id: 10533
  text: –––
- id: 10538
  text: >+
    Tornem al món de l'ordinador. Per

    accedir a les dades de recerca,

    necessitem la contrasenya Ansem.

- id: 10539
  text: >+
    Esbrina la contrasenya de l'Ansem!

- id: 10540
  text: >+
    Per fi ens reunim amb el rei!

    Gràcies als escrits a la paret de

    l'estudi, el Sora esbrina la contrasenya.

- id: 10541
  text: >+
    Ves a donar la contrasenya al Tron!

- id: 10542
  text: >+
    El grup torna al món de l'ordinador

    per complir la promesa que han fet

    al Tron.

- id: 10543
  text: >+
    Ves amb el Tron a l'entorn de dades!

- id: 10546
  text: >+
    El Sora i els seus amics tornen sans i

    estalvis a Baluard Balmat. Gràcies al Tron,

    ja es pot accedir a les dades del DTD.

- id: 10547
  text: >+
    Fes servir l'ordinador!

- id: 10548
  text: >+
    Les sorpreses i decepcions que es troben

    a la informació de la DTD aclaparen a tothom.

    Un tremolor sobtat sacseja l'habitació.

- id: 10549
  text: >+
    Comprova què passa a fora!

- id: 10550
  text: >+
    A fora, els sensecor i els incorporis

    envaïen la ciutat. El Léon i els seus

    amics podrien estar en perill.

- id: 10551
  text: >+
    Afanya't a la zona residencial!

- id: 10552
  text: >+
    El Léon i els altres lluiten contra els

    sensecor i els incorporis. El Sora i

    els seus amics van a pel rei.

- id: 10553
  text: >+
    Ves al pati interior!

- id: 10554
  text: >+
    El Gran Congost de la vall ha estat

    presa per les hordes enemigues.

    Uniu forces i derroteu-los!

- id: 10555
  text: >+
    Obre't pas cap al Gran Congost!

- id: 10556
  text: >+
    L'Organització {XIII} busca vèncer els

    sensecor amb la clau espasa. Sembla que 

    la batalla ha acabat... per ara.

- id: 10557
  text: –––
- id: 10558
  text: >+
    La batalla a Baluard Balmat ha acabat,

    per ara, però, com deu estar la ciutat?

- id: 10559
  text: >+
    Ves a Baluard Balmat!

- id: 10560
  text: >+
    Se suposava que la ciutat estava

    en pau, però li passa alguna cosa estranya.

    Serà millor que anem a veure el Léon.

- id: 10561
  text: >+
    Ves a casa el Merlí!

- id: 10562
  text: >+
    El PCM va hackejar el sistema informàtic i

    va enviar una quantitat infinita de sensecor a la ciutat. En Sora

    i els seus amics decideixen anar a veure el Tron.

- id: 10563
  text: >+
    Ves a l'estudi de l'Ansem!

- id: 10564
  text: >+
    El programa d'erradicació de PCM està

    gairebé completat. El Léon demana al Sora

    que vagi a la Torre I/O amb el Tron i esperi.

- id: 10565
  text: >+
    Accedeix a l'ordinador!

- id: 10566
  text: >+
    El Tron obsequia tots amb una visió de com

    era la ciutat en el passat. En aquell instant,

    tothom recorda com es deia abans.

- id: 10567
  text: –––
- id: 10572
  text: >+
    La Bèstia es comporta d'una manera

    estranya quan el Sora i els altres

    arriben al castell. Què li deu passar?

- id: 10573
  text: >+
    Fes una ullada al castell!

- id: 10574
  text: >+
    Hi ha algú al capdamunt de les escales.

    Serà la Bella? Parla amb ella i esbrina

    què està passant.

- id: 10575
  text: >+
    La Bella hauria de ser aquí. Troba-la!

- id: 10576
  text: >+
    La Bèstia ha tancat els seus servents

    a la masmorra. Dirigeix-te a l'ala oest

    per trobar-hi l'entrada.

- id: 10577
  text: >+
    Ves a l'ala oest!

- id: 10578
  text: >+
    Hi ha d'haver una entrada a la

    masmorra en algun lloc de l'ala

    oest...

- id: 10579
  text: >+
    Troba l'entrada al soterrani!

- id: 10580
  text: >+
    L'armari davant la porta del soterrani

    no s'aparta. Hi ha d'haver alguna

    manera de entrar-hi.

- id: 10581
  text: >+
    Aparta l'armari de la porta!

- id: 10582
  text: >+
    L'armari és una persona encisada!

    I la Bèstia també! Rescata els altres

    abans de sentir la resta de la història.

- id: 10583
  text: >+
    Ves a la masmorra!

- id: 10584
  text: >+
    Després de derrotar la porta,

    el grup troba els servents encisats

    que estaven atrapats a la masmorra.

- id: 10585
  text: >+
    Segueix els servents!

- id: 10586
  text: >+
    El comportament de la Bèstia sembla ser

    causat pels sensecor. Un passadís

    secret du a la seva cambra.

- id: 10587
  text: >+
    Utilitza el passadís per cercar la Bèstia!

- id: 10588
  text: >+
    El corredor té un truc!

    Encén tots els fanals del passadís

    per obrir la porta secreta.

- id: 10589
  text: Treballa en equip i encén els fanals!
- id: 10590
  text: >+
    Gràcies a l'ajuda de tothom,

    la porta secreta està oberta.

- id: 10591
  text: >+
    Ves a l'habitació de la Bèstia!

- id: 10592
  text: >+
    És el Xaldin, de l'Organització {XIII}!

    La Bèstia està preocupada per la

    forma en què ha tractat la Bella.

- id: 10593
  text: >+
    Ves amb la Bèstia a veure la Bella!

- id: 10594
  text: >+
    La Bèstia va a l'habitació de la Bella,

    però no la hi troba. Se n'ha anat

    rere un individu misteriós.

- id: 10595
  text: >+
    Busca la Bella!

- id: 10596
  text: >+
    Mentre exploren el castell, Sora i els

    altres, senten la veu de Bella demanant

    ajuda a la sala de ball.

- id: 10597
  text: >+
    Corre al saló de ball i ajuda la Bella!

- id: 10598
  text: >+
    La Bèstia rescata la Bella i es disculpa.

    S'apropen l'un a l'altre, però

    l'encanteri segueix sense trencar-se.

- id: 10599
  text: –––
- id: 10600
  text: >+
    El Sora i els seus amics tornen al castell.

    Tot sembla en ordre, però la Bèstia

    està molt inquieta.

- id: 10601
  text: >+
    Parla amb la Bèstia!

- id: 10602
  text: >+
    El Xaldin interromp el ball per dir

    que ha robat una cosa «molt preada». 

    La Bèstia corre a la seva cambra.

- id: 10603
  text: >+
    Ves l'habitació de la Bèstia!

- id: 10604
  text: >+
    S'ha endut la rosa! I amb això,

    la Bèstia ha perdut tota esperança i la

    voluntat de lluitar. Què s'hi pot fer?

- id: 10605
  text: >+
    Anima la bèstia!

- id: 10606
  text: >+
    El Sora i els seus animen la Bèstia

    i tots surten en cerca de la rosa.

- id: 10607
  text: >+
    Busca la rosa amb la Bèstia!

- id: 10608
  text: >+
    El Xaldin anava rere la Bèstia per aconseguir

    el Kingdom Hearts, el Regne dels

    Cors. Que no escapi!

- id: 10609
  text: >+
    Surt fora i persegueix el Xaldin!

- id: 10610
  text: >+
    La rosa ha estat recuperada i la Bèstia ha

    descobert què és el que més apreua.

    Es trencarà ara l'encanteri?

- id: 10611
  text: –––
- id: 10612
  text: >+
    El Sora i els seus amics arriben a les

    afores del Coliseu. Allà veuen com els

    sensecor assetgen una dona.

- id: 10613
  text: >+
    Ajuda la dona!

- id: 10614
  text: >+
    La Megara anava a veure l'Hades per demanar-li

    que donés un descans a Hèrcules. El Sora i els

    altres s'ofereixen a anar-hi en el seu lloc.

- id: 10615
  text: >+
    Vés a l'Inframón i parla amb l'Hades!

- id: 10616
  text: >+
    L'Auron rebutja l'oferta de l'Hades. El Sora,

    afeblit per la maledicció de l'Inframón,

    coopera amb l'Auron per escapar.

- id: 10617
  text: >+
    Escapa de l'Inframón!

- id: 10618
  text: >+
    El Sora i els altres eviten el Cèrber

    i escapen de l'Inframón, però on

    és l'Auron? S'ha de buscar la Meg.

- id: 10619
  text: >+
    Reuneix-te amb la Meg al Coliseu!

- id: 10620
  text: >+
    Mentre l'Hèrcules cerca la Pedra

    de l'Olimp per neutralitzar la maledicció

    de l'Inframón, el grup s'ha d'entrenar.

- id: 10621
  text: >+
    Ves a veure el Fil!

- id: 10622
  text: >+
    El Fil segueix tan vivaç com sempre.

    Sembla que el Sora i els altres poden

    començar a entrenar quan vulguin.

- id: 10623
  text: >+
    Completa el teu entrenament!

- id: 10624
  text: >+
    En Sora i els seus amics completen el seu

    entrenament. En aquell moment arriba

    Hèrcules, abstret en els seus pensaments.

- id: 10625
  text: >+
    Parla amb l'Hèrcules!

- id: 10626
  text: >+
    La Pedra de l'Olimp ha estat robada...

    i l'Hades ha raptat la Meg! El grup

    s'encamina cap a l'Inframon.

- id: 10627
  text: >+
    Rescata la Meg a l'Inframon!

- id: 10628
  text: >
    El Fil era a l'entrada de l'Inframon

    quan un individu de negre el va atacar.

    S'enduria ell la Pedra de l'Olimp?
- id: 10629
  text: >+
    Segueix l'individu de la túnica negra!

- id: 10630
  text: >+
    En Sora i els seus amics no poden fer

    res contra la maledicció. Necessiten la

    Pedra de l'Olimp com més aviat millor.

- id: 10631
  text: >+
    Ves per l'home de negre!

- id: 10632
  text: >+
    Derroten el membre de l'Organització {XIII}

    i recuperen la pedra. Alliberats de la

    maledicció, van a ajudar la Meg.

- id: 10633
  text: >+
    Endinsa't en l'Inframon!

- id: 10634
  text: >+
    El Sora i els seus amics obren el pany

    per rescatar la Meg, però topen amb

    una porta cap a... algun lloc.

- id: 10635
  text: >+
    Rescata la Meg!

- id: 10636
  text: >+
    L'Hèrcules arriba a temps per rescatar

    la Meg. Deu estar esgotat! No podem

    deixar-lo sol en aquell estat.

- id: 10637
  text: >+
    Torna i ajuda l'Hèrcules!

- id: 10638
  text: >+
    En Sora i l'Hèrcules derroten el Pete, però l'Hades

    deixa caure amb el seu peculiar estil que potser la

    Hidra va “jugant” pel Coliseu.

- id: 10639
  text: >+
    Torna al Coliseu!

- id: 10640
  text: >+
    Alguna cosa ingent i misteriosa ha

    aparegut a l'entrada de l'Inframon.

- id: 10641
  text: >+
    Què està passant a l'Inframon?

- id: 10642
  text: >+
    L'Infernòdrom ha aparegut del

    no res i s'hi estan celebrant

    tota mena de combats.

- id: 10643
  text: >+
    Participa en el torneig!

- id: 10644
  text: >+
    L'Hades anuncia que la Copa Hades

    se celebrarà a l'Infernòdrom. En Sora

    i l'Hèrcules hi decideixen participar.

- id: 10645
  text: >+
    Participa en la Copa Hades!

- id: 10646
  text: >+
    L'Hades anuncia que la Copa Hades

    se celebrarà a l'Infernòdrom. En Sora

    i Hèrcules hi decideixen participar.

- id: 10647
  text: >+
    Participa en la Copa Hades!

- id: 10648
  text: >+
    Pot ser que hagin d'enfrontar-se

    a l'Auron si arriben a les finals, però

    l'Hèrcules no es veu capaç d'aconseguir-ho.

- id: 10649
  text: >+
    Participa en la primera ronda!

- id: 10650
  text: >+
    A pesar de sortir-ne victoriós, l'Hèrcules

    continua deprimit. Ara venen les

    semifinals.

- id: 10651
  text: >+
    Participa en les semifinals!

- id: 10652
  text: >+
    Després de classificar-se per a la final, el grup

    veu l'Auron, però sembla estar una mica

    estrany, i s'endinsa en l'Inframon.

- id: 10653
  text: >+
    Segueix l'Auron!

- id: 10654
  text: >+
    L'Hades estava controlant l'Auron.

    El Sora i els seus amics el segueixen fora

    de l'Inframon, atès que volen ajudar-lo.

- id: 10655
  text: >+
    Parla amb l'Auron!

- id: 10656
  text: >+
    Mentre l'Hèrcules combat a la ronda

    final, el Sora i els seus busquen el

    ninot que controla l'Auron.

- id: 10657
  text: >+
    Ves a l'Inframon i recupera el ninot!

- id: 10658
  text: >+
    El maniquí contenia la voluntat de l'Auron.

    En veure el seu passat, vam comprendre el

    motiu de la seva força. Se li ha de tornar!

- id: 10659
  text: >+
    Dirigeix-te a l'Infernòdrom!

- id: 10660
  text: >+
    El grup es troba amb el Iago, l'antic

    lacai del malvat Jafar. Jura que ha

    canviat, així que se l'enduen a palau.

- id: 10661
  text: >+
    Ves al palau!

- id: 10662
  text: >+
    Al palau, la Jasmín se sorprèn i es preocupa

    per la presència del Iago. En Sora i els altres

    van a la ciutat a parlar amb l'Aladdin.

- id: 10663
  text: >+
    Torna a la ciutat per veure l'Aladdin!

- id: 10664
  text: >+
    Per la ciutat, senten un mercader

    cridar: “Atura't, lladre!”, mentre

    persegueix a l'Abú i Aladdin. Què passa?

- id: 10665
  text: >+
    Segueix l'Aladdin!

- id: 10666
  text: >+
    L'Abú ha robat una de les llanternes del

    mercader. L'Aladdin se la torna, però

    resulta que és la que conté el Jafar!

- id: 10667
  text: >+
    Recupera la llàntia de la botiga!

- id: 10668
  text: >+
    En Sora i els seus amics intenten comprar

    la llàntia al mercader, però aquest

    demana a canvi un tresor digne d'un sultà.

- id: 10669
  text: >+
    Parla amb l'Aladdin fora de la botiga!

- id: 10670
  text: >+
    No poden disposar del tresor reial

    per comprar una miserable llàntia. El Iago suggereix

    cercar alguna cosa a la Cova de les Meravelles.

- id: 10671
  text: >+
    Ves a la Cova de les Meravelles!

- id: 10672
  text: >+
    En Sora i companyia arriben a la cova, una

    antic sojorn de la llàntia màgica, a la

    recerca d'un tresor.

- id: 10673
  text: >+
    Endinsa't a la Cova de les Meravelles!

- id: 10674
  text: >+
    Aconsegueixen desactivar la trampa de

    la Cova de les Meravelles i continuen.

- id: 10675
  text: >+
    Endinsa't a la cova!

- id: 10676
  text: >+
    Un cop superada la prova,

    apareix una escala davant d'ells.

- id: 10677
  text: >+
    Llegeix la inscripció!

- id: 10678
  text: >+
    La porta s'ha obert!

- id: 10679
  text: >+
    A què esperes? Endavant!

- id: 10680
  text: >+
    En Sora i els seus amics porten un tresor

    de la Cova de les Meravelles, però la

    botiga està buida. Què passa?

- id: 10681
  text: >+
    Esbrina què està passant a fora!

- id: 10682
  text: >+
    En Pete persegueix el comerciant i intenta

    arrabassar-li la llàntia màgica. Ambdós

    corren cap al palau.

- id: 10683
  text: >+
    Segueix-los fins al palau!

- id: 10684
  text: >+
    En Sora i companyia recuperen la llàntia

    màgica i la clouen a l'interior del palau.

    Al final, el Iago va resultar no ser tan dolent...

- id: 10685
  text: –––
- id: 10686
  text: >+
    Amb la llàntia closa, Agrabah torna

    a estar fora de perill. Què estaran

    fent tots ara?

- id: 10687
  text: >+
    Cap a Agrabah!

- id: 10688
  text: >+
    En Jafar ha tornat! El mercader el va

    alliberar de la llàntia. El Iago diu que

    és a les Ruïnes Enterrades.

- id: 10689
  text: >+
    Segueix el Iago!

- id: 10690
  text: >+
    La màgia del Geni permet al Sora i els seus

    amics travessar una tempesta de sorra

    mentre es dirigeixen a les ruïnes.

- id: 10691
  text: >+
    Travessa el desert i arriba a les ruïnes!

- id: 10692
  text: >+
    Les ruïnes estan desertes. És una trampa!

    En Sora i companyia s'escapen i s'afanyen a tornar

    al palau, el veritable objectiu del Jafar.

- id: 10693
  text: >+
    De pressa, al palau! I a cercar el Jafar!

- id: 10694
  text: >+
    Els nostres herois han derrotat el

    Jafar gegantí i el Geni ha retornat la malparada

    ciutat al seu estat habitual.

- id: 10695
  text: –––
- id: 10696
  text: >2+


- id: 10697
  text: >2+


- id: 10698
  text: >+
    L'ombra resulta ser en Mushu. En Sora

    coneix la Mulan, que fingeix ser

    un home per allistar-se a l'exèrcit.

- id: 10699
  text: >+
    Ves al campament i allista-t'hi!

- id: 10700
  text: >+
    En Ping no és acceptat a l'exèrcit.

    Ha de realitzar les missions del

    Capità per demostrar la seva vàlua.

- id: 10701
  text: >+
    Completa les missions del Capità!

- id: 10702
  text: >+
    En Ping s'involucra profundament en les

    missions i s'enforteix molt més.

    Rep un nou encàrrec del Capità.

- id: 10703
  text: >+
    Dirigeix-te a la sendera de muntanya!

- id: 10704
  text: >
    Accepten en Ping a l'exèrcit, però ha

    de guanyar-se el respecte dels altres. Va

    a cercar un individu sospitós fins a una cova.
- id: 10705
  text: >+
    Dirigeix-te a la cova propera al poblet!

- id: 10706
  text: >+
    A l'interior de la cova esperaven una

    infinitat de sensecor, però en Ping i el

    grup els han derrotat sense problemes.

- id: 10707
  text: >+
    Explica al Capità què ha passat!

- id: 10708
  text: >+
    L'exèrcit de Shan Yu ha destruït el poblet

    i les seves tropes. El grup es dirigeix cap

    al cim per enfrontar-se als huns.

- id: 10709
  text: >+
    Segueix en Shan Yu fins al cim!

- id: 10710
  text: >+
    En Ping aconsegueix derrotar en Shan Yu i els

    seus homes, però es descobreix la seva farsa i l'expulsen.

    En Sora decideix acompanyar-la de tornada a casa.

- id: 10711
  text: >+
    Descendeix la muntanya!

- id: 10712
  text: >+
    En Shan Yu es dirigeix cap a la

    Ciutat Imperial. Cal avisar a

    l'Emperador tan aviat com sigui possible!

- id: 10713
  text: >+
    Ves a la Ciutat Imperial!

- id: 10714
  text: >+
    En Shan Yu ha entrat al palau. Els

    sensecor del pati cauen derrotats,

    però l'Emperador corre en perill!

- id: 10715
  text: >+
    Corre cap al palau!

- id: 10716
  text: >+
    La Mulan derrota en Shan Yu i salva la Xina.

    L'emperador i el Capità la lloen com la

    dona més valenta de la Xina.

- id: 10717
  text: –––
- id: 10718
  text: >+
    Què farà la Mulan ara que ha

    salvat la Xina?

- id: 10719
  text: >+
    Cap a la Terra dels Dracs!

- id: 10720
  text: >+
    En Sora i els seus amics passen pel poblet i

    amb la Mulan, s'encaminen cap a la muntanya

    per cercar un individu vestit de negre.

- id: 10721
  text: >+
    Segueix l'individu de la túnica negra!

- id: 10722
  text: >+
    L'home vestit de negre sembla

    estar buscant alguna cosa a mesura

    que s'apropa al cim de la muntanya.

- id: 10723
  text: >+
    Puja al cim de la muntanya!

- id: 10724
  text: >+
    En Sora i els seus companys perden el rastre de

    l'individu abans de descobrir la seva identitat.

    Decideixen descendir la muntanya.

- id: 10725
  text: >+
    Descendeix la muntanya!

- id: 10726
  text: >+
    A mig camí, veuen un

    sensecor gegant... dirigint-se

    cap a la Ciutat Imperial!

- id: 10727
  text: >+
    Afanya't cap a la Ciutat Imperial!

- id: 10728
  text: >2+


- id: 10729
  text: >2+


- id: 10730
  text: >+
    El grup acaba amb tots els sensecor

    que troben i corre cap al

    palau rere l'home de negre.

- id: 10731
  text: >+
    Afanya't cap al palau!

- id: 10732
  text: >+
    Les portes estan bloquejades, però

    aconsegueixen entrar gràcies a l'astúcia

    de la Mulan. Allà hi troben l'encaputxat...

- id: 10733
  text: >+
    Descobreix qui és l'home de negre!

- id: 10734
  text: >+
    Aconsegueixen derrotar els esbirros d'en

    Xigbar. La seva preocupació pel Capità

    i l'Emperador els du a veure'ls.

- id: 10735
  text: >+
    Esbrina què passa al palau!

- id: 10736
  text: >+
    L'Emperador i el Capità estan fora de perill.

    Havien vist un altre encaputxat abans. De

    sobte, un gran terrabastall sacseja el palau.

- id: 10737
  text: >+
    Esbrina que està passant a fora!

- id: 10738
  text: >+
    El relat de l'Emperador fa pensar al Sora

    que en Riku està bé. La Mulan aconsegueix un

    càrrec a l'exèrcit, cosa que fa emocionar al Sora.

- id: 10739
  text: –––
- id: 10740
  text: >+
    En Sora visita el Bosc dels Cent Acres

    de nou i va a casa d'en Pooh.

- id: 10741
  text: >+
    Ves a veure el Pooh!

- id: 10742
  text: >+
    En Sora veu el Pooh davant de casa seva,

    abstret en els seus pensaments.

- id: 10743
  text: >+
    Parla amb el Pooh!

- id: 10744
  text: >+
    Una estranya força expulsa el Sora

    del llibre. Quan hi torna, se n'adona

    que només queda la casa d'en Pooh.

- id: 10745
  text: >+
    Esbrina com està el Pooh!

- id: 10746
  text: >+
    Què ha pogut ocórrer? Almenys,

    el Pooh està bé. En Sora s'alegra

    de tornar a veure l'osset.

- id: 10747
  text: >+
    Parla amb el Pooh!

- id: 10748
  text: >+
    A causa de les pàgines trencades pels

    sensecors, el Pooh ha perdut la memòria.

    En Sora ha de recuperar aquestes pàgines.

- id: 10749
  text: >+
    Recupera les pàgines!

- id: 10750
  text: >+
    La culpa de tot aquest embolic radica en

    les pàgines arrencades pels sensecor.

- id: 10751
  text: >+
    Recupera les pàgines i ajuda el Pooh!

- id: 10752
  text: >+
    Quan el Sora va tornar amb una de les

    pàgines arrencades, va aparèixer un

    arbre amb una porta petita.

- id: 10753
  text: >+
    Ves a l'arbre amb la porta!

- id: 10754
  text: >+
    En Sora veu el Piglet,

    sent arrossegat pel vent.

- id: 10755
  text: >+
    Salva el Piglet!

- id: 10756
  text: >+
    En Piglet va ser rescatat, però estava tan

    trist pel fet que el Pooh l'hagués oblidat

    que el vent se'l va tornar a endur.

- id: 10757
  text: >+
    Parla amb en Pooh i salva el Piglet!

- id: 10758
  text: >+
    El valent acte del Piglet va ajudar a

    en Pooh a recordar el seu amic. La

    pàgina del llibre fou restaurada.

- id: 10759
  text: >+
    Troba les altres pàgines!

- id: 10760
  text: >+
    Quan el Sora va arribar amb la pàgina

    arrencada, va aparèixer un arbre

    envoltat d'un jardí.

- id: 10761
  text: >+
    Ves a l'arbre del jardí!

- id: 10762
  text: >+
    En Pooh tampoc recordava l'Igor.

    Ell pensa que el Pooh necessita omplir la seva

    panxeta, així que el guia cap a una mica de mel.

- id: 10763
  text: >+
    Segueix a l'Igor!

- id: 10764
  text: >+
    Però no hi ha prou mel per fer recordar el Pooh.

    El Conill assegura que sap on hi ha

    més mel.

- id: 10765
  text: >+
    Parla amb el Conill i aconsegueix més mel!

- id: 10766
  text: >+
    Quan el Pooh veu el Conill pensant,

    el recorda a ell i a l'Igor també! Tot el

    món està desbordant d'alegria.

- id: 10767
  text: >+
    Troba les altres pàgines!

- id: 10768
  text: >+
    Quan el Sora va arribar amb la pàgina

    arrencada, va aparèixer un arbre

    ple de paquets.

- id: 10769
  text: >+
    Ves a l'arbre carregat de paquets!

- id: 10770
  text: >+
    Preocupats pel Pooh, la Cangu i el Ret li

    han dut una medicina, però

    el Tigger se l'ha emportat tot fent bots.

- id: 10771
  text: >+
    Segueix el Tigger!

- id: 10772
  text: >+
    En Tigger creu que si tots boten a la vegada,

    en Pooh podria recuperar la memòria.

- id: 10773
  text: >+
    Parla amb el Tigger i bota amb ell!

- id: 10774
  text: >+
    Veure en Tigger deprimit fa que en Pooh

    recordi la resta dels seus amics.

    El llibre està gairebé complet.

- id: 10775
  text: >+
    Troba les altres pàgines!

- id: 10776
  text: >+
    Quan el Sora va arribar amb la pàgina

    arrencada, va aparèixer una

    cova tenebrosa.

- id: 10777
  text: >+
    Entra a la cova tenebrosa!

- id: 10778
  text: >+
    En Pooh s'ha endinsat tot sol a la

    cova.

- id: 10779
  text: >+
    Parla amb la Cangu i busca en Pooh!

- id: 10780
  text: >+
    En Pooh buscava algú a qui havia

    fet una promesa especial...

    i va acabar recordant el Sora.

- id: 10781
  text: >+
    Troba la pàgina restant!

- id: 10782
  text: >+
    Quan en Sora va arribar amb la pàgina

    arrencada, va aparèixer un turó estrellat.

- id: 10783
  text: >+
    Ves al turó estrellat!

- id: 10784
  text: >+
    En Pooh ha ficat el cap en un pot de

    mel i no pot treure'l! Os graponer!

- id: 10785
  text: >+
    Ajuda en Pooh!

- id: 10786
  text: >+
    En Pooh intentava trobar una manera perquè

    el Sora no se n'anés. Ell li contesta

    que sempre estarà en el seu cor.

- id: 10787
  text: –––
- id: 10788
  text: >-
    Després d'arribar a una gorja, en Sora

    queda desconcertat pel seu nou cos.

    Serà millor moure's una mica!
- id: 10789
  text: Fes un tomb per acostumar-t'hi!
- id: 10790
  text: >-
    El grup salva la Nala, una lleona,

    d'uns sensecor i decideixen ajudar-la

    a recuperar la seva terra natal.
- id: 10791
  text: Ves a la Roca del Clan!
- id: 10792
  text: >-
    En Rafiki, el profeta, va anunciar que qui salvés

    les Terres del Regne es convertiria en

    rei... Així que en Sora no pot fer-ho!
- id: 10793
  text: Abandona la Roca del Clan!
- id: 10794
  text: >-
    En Sora i els seus amics escapen de l'Scar.

    Decideixen anar a un lloc més tranquil per

    poder parlar del Simba.
- id: 10795
  text: Atravessa la Vall del Nyu!
- id: 10796
  text: >-
    Els nostres amics travessen un

    gran canó a la recerca del Simba, el

    següent en la línia successòria al tron.
- id: 10797
  text: Endinsa't en la Vall del Nyu!
- id: 10798
  text: >-
    L'Scar va dir a la Nala que en Simba

    havia mort amb el Mufasa a la Vall

    del Nyu. En Rafiki assenyala l'oasi.
- id: 10799
  text: Continua cap a les terres ermes!
- id: 10800
  text: >-
    En Sora i companyia finalment es reuneixen

    amb en Simba. De sobte, els amics

    del lleó criden demanant ajuda.
- id: 10801
  text: Ajuda els amics d'en Simba a la jungla!
- id: 10802
  text: >-
    La Nala demana al Simba que torni a la

    Roca del Clan, però ell prefereix oblidar

    el passat i gaudir del present.
- id: 10803
  text: Esbrina què n'opina el Simba!
- id: 10804
  text: >-
    En Simba se sentia culpable per la mort

    del seu pare, però una visió de Mufasa 

    el convenç de tornar a casa.
- id: 10805
  text: Torna al regne i posa-hi ordre!
- id: 10806
  text: >-
    Va ser l'Scar qui va assassinar el Mufasa.

    En Simba i el seu malvat oncle lluiten

    feroçment mentre ascendeixen el cingle.
- id: 10807
  text: Segueix en Simba i l'Scar fins al cingle!
- id: 10808
  text: >-
    En Simba rugeix victoriós des del

    cim de la Roca del Clan. Les lleones

    saluden el seu nou monarca.
- id: 10809
  text: –––
- id: 10810
  text: >+
    En Simba s'ha convertit en el rei de les

    Terres del Regne. Com li deu anar

    al regne amb el seu nou monarca?

- id: 10811
  text: >+
    Cap a les Terres del Regne!

- id: 10812
  text: >+
    Els nostres amics arriben a la sabana.

    Les hienes pinten la cigonya al

    Simba... Què passa?

- id: 10813
  text: >+
    Parla amb el Simba!

- id: 10814
  text: >+
    El grup és perseguit pel fantasma de l'Scar

    mentre es dirigeixen a veure en Simba.

    Cal informar el rei!

- id: 10815
  text: >+
    Parla amb en Simba del fantasma!

- id: 10816
  text: >+
    Tots estan intranquils, perquè

    veuen en el fantasma de l'Scar

    una prova del declivi del regne.

- id: 10817
  text: >+
    Esbrina què en pensa el Simba!

- id: 10818
  text: >+
    A en Simba li preocupava com hagués

    actuat el seu pare, però se n'adona

    que l'important és el seu criteri.

- id: 10819
  text: >+
    Esbrina què en pensa el Rafiki!

- id: 10820
  text: >+
    El fantasma de l'Scar representava

    les debilitats d'en Simba. Tots van al

    Cementiri d'Elefants a investigar.

- id: 10821
  text: >+
    Ves al Cementiri d'Elefants!

- id: 10822
  text: >+
    Al Cementiri d'Elefants, les hienes

    semblen saber què està passant.

- id: 10823
  text: >+
    Atrapa les hienes i que xerrin!

- id: 10824
  text: >+
    En Simba fuig del fantasma de l'Scar.

    Segur que és a l'oasi.

- id: 10825
  text: >+
    Ves a l'oasi!

- id: 10826
  text: >+
    En Simba agraeix el suport dels seus amics

    i derrota el fantasma. Però, d'on han

    sortit tots els altres fantasmes?

- id: 10827
  text: >+
    El regne està en crisi! Fes alguna cosa!

- id: 10828
  text: >+
    En Simba va expulsar els fantasmes

    i va salvar la Nala. La pau torna a

    les Terres del Regne.

- id: 10829
  text: –––
- id: 10830
  text: >+
    En Sora arriba a Atlàntica just a temps

    per participar en un musical. A practicar!

- id: 10831
  text: >+
    Parla amb en Sebastià quan estiguis a punt!

- id: 10832
  text: >+
    En Sora i els seus amics es van apuntar

    al musical perquè l'Ariel es distragués.

    Ha arribat l'hora de cantar.

- id: 10833
  text: >+
    Parla amb en Sebastià quan estiguis a punt!

- id: 10834
  text: >+
    En Flounder pretén dur una estàtua a

    la gruta de l'Ariel com a regal, però

    no aconsegueixen moure-la.

- id: 10835
  text: >+
    Parla amb Flounder quan tinguis Magneto!

- id: 10836
  text: >+
    L'amor secret de l'Ariel ara és més fort.

    La peça del musical ja està a punt, però en

    Sora i els altres encara no poden cantar.

- id: 10837
  text: >+
    {:width 95}Torna-hi quan el teu ind. de Fusió arribi a 5!

- id: 10838
  text: >+
    L'Ariel s'ha enamorat d'un príncep humà.

    Ha trobat una cosa que li pertany,

    però no aconsegueix arribar-hi.

- id: 10839
  text: >+
    Parla amb l'Ariel quan tinguis Magneto+!

- id: 10840
  text: >+
    L'Ariel va firmar un contracte amb l'Úrsula,

    renunciant a la seva veu per convertir-se

    en humana i trobar-se amb l'Eric.

- id: 10841
  text: >+
    Pregunta al Sebastià per l'Ariel!

- id: 10842
  text: >+
    L'Eric i l'Ariel fan una parella perfecta.

    En Sebastià demana al Sora i els seus

    amics ajuda amb el musical.

- id: 10843
  text: >+
    Parla amb en Sebastià quan tinguis Electro++!

- id: 10844
  text: >+
    El musical ha estat tot un èxit!

    La superfície i el mar s'han unit

    en un sol cant d'harmonia.

- id: 10845
  text: –––
- id: 10846
  text: >+
    Al castell de Disney està passant alguna cosa.

    Serà millor parlar amb la reina Minnie

    com més aviat millor.

- id: 10847
  text: >+
    Parla amb la reina Minnie a la biblioteca!

- id: 10848
  text: >+
    El pacífic castell ha estat envaït pels

    sensecor. La reina Minnie i en

    Sora s'encaminen a la sala d'audiències.

- id: 10849
  text: >+
    Ves a la sala d'audiències!

- id: 10850
  text: >+
    La reina Minnie va trencar el segell de

    la sala d'audiències. Què hi deu haver?

- id: 10851
  text: >+
    Entra a la sala d'audiències!

- id: 10852
  text: >+
    La Pedra Angular de Llum està coberta

    d'espines. Serà millor anar a Baluard

    Balmat i parlar amb el Merlí.

- id: 10853
  text: >+
    Ves a veure el Merlí!

- id: 10854
  text: >+
    En Merlí crea una misteriosa porta. Hi ha

    una altra porta més enllà de la que ha creat

    i s'haurà de tancar per salvar el castell.

- id: 10855
  text: >+
    Atravessa la misteriosa porta!

- id: 10856
  text: >+
    Rere la porta d'en Merlí hi ha un

    món en blanc i negre. Tots se senten

    una mica nostàlgics en aquell lloc.

- id: 10857
  text: >+
    Salva el castell!

- id: 10858
  text: >+
    El grup va travessar la porta i va

    arribar a un món monocromàtic. Veuen

    un estrany Pete, però espetega a córrer.

- id: 10859
  text: >+
    Aquell és... el Pete? Seguim-lo!

- id: 10860
  text: >+
    Buscant la porta del Merlí, treuen el

    cap per una estranya finestra i veuen

    els sensecor en quatre llocs diferents.

- id: 10861
  text: >+
    Derrota els sensecor de les finestres!

- id: 10862
  text: >+
    En mirar per la finestra, van veure

    com la Malèfica enfadada renyava algú.

- id: 10863
  text: >+
    Queden tres grups més de sensecor!

- id: 10864
  text: >+
    Aquesta finestra mostrava una porta com

    la que va crear en Merlí. 

    També hauria de conduir a aquest món en blanc i negre.

- id: 10865
  text: >+
    Només queden dos grups de sensecor!

- id: 10866
  text: >+
    Les misterioses portes connectaven

    amb el passat. En Sora i els altres van

    descobrir per fi on eren.

- id: 10867
  text: >+
    Només queda un grup de sensecor!

- id: 10868
  text: >+
    En Pete ha robat la Pedra Angular de Llum.

    Aviat el castell quedarà sumit en

    la foscor. Seguim-lo!

- id: 10869
  text: >+
    En Pete es dirigeix cap al canal! Segueix-lo!

- id: 10870
  text: >+
    Els nostres herois van aconseguir salvar

    la Pedra Angular de Llum, però en Pete

    va saltar del vaixell i va fugir.

- id: 10871
  text: >+
    Segueix el Pete!

- id: 10872
  text: >+
    En Sora i els seus companys van segellar la porta

    que feia servir en Pete i van retornar la Pedra

    Angular de Llum. El castell és segur.

- id: 10873
  text: –––
- id: 10874
  text: >+
    En Sora i els seus amics arriben a

    Vila Halloween. Al principi estan estranyats,

    fins que veuen el Zero, l'amic d'en Jack.

- id: 10875
  text: >+
    Segueix el Zero!

- id: 10876
  text: >+
    En Jack és a la plaça, obsessionat amb

    el Nadal. Vol ensenyar-los una cosa,

    així que els du a veure la Sally.

- id: 10877
  text: >+
    Reuneix-te amb la Sally al laboratori!

- id: 10878
  text: >+
    En Jack es posa en marxa per veure el Pare Cruel

    malgrat els temors de la Sally. Llavors,

    apareixen els sensecor a la plaça.

- id: 10879
  text: >+
    Acaba amb tots els sensecor!

- id: 10880
  text: >+
    En Jack demana al Sora que protegeixi el

    Pare Cruel. La porta de Vila Nadal

    és al bosc, passat el cementiri.

- id: 10881
  text: >+
    Ves al bosc i busca la porta!

- id: 10882
  text: >+
    Un món nevat espera rere la porta:

    Vila Nadal; lluminosa, festiva

    i lliure de terrors i pors.

- id: 10883
  text: >+
    Ves a la ciutat i parla amb el Pare Cruel!

- id: 10884
  text: >+
    També hi ha sensecor a Vila

    Nadal! Tothom lluita

    perquè el Nadal no pateixi cap contratemps.

- id: 10885
  text: >+
    Entra a casa del Pare Cruel!

- id: 10886
  text: >+
    Tots estan ansiosos per conèixer el

    Pare Cruel. Durant la seva visita, senten

    un estrèpit provinent d'una altra habitació.

- id: 10887
  text: >+
    Dona un cop d'ull a l'habitació posterior!

- id: 10888
  text: >+
    El Nyek, la Poll i el Puça han

    sortit corrents del taller.

    Més val que no s'escapin!

- id: 10889
  text: >+
    Segueix aquelles petjades!

- id: 10890
  text: >+
    El Nyek, la Poll i el Puça han

    sortit corrents del taller.

    Més val que no s'escapin!

- id: 10891
  text: >+
    Atrapa aquelles tres paparres!

- id: 10892
  text: >+
    Troben el Nyek, la Poll i el Puça

    i confessen que l'Home del Sac ha tornat! Un

    cop explicat, els petits tornen a fugir.

- id: 10893
  text: >+
    Esbrina què passa a la ciutat!

- id: 10894
  text: >+
    L'Home del Sac ha segrestat el Pare Cruel

    i se n'ha anat cap a Ciutat de

    Nadal!

- id: 10895
  text: >+
    Cap a Vila Nadal! Ràpid!

- id: 10896
  text: >+
    Persegueixen l'Home del Sac fins a Vila

    Nadal, on veuen fum sortint de la

    xemeneia de la casa del Pare Cruel.

- id: 10897
  text: >+
    Afanya't a anar a casa del Pare Cruel!

- id: 10898
  text: >+
    En Jack vol fer la feina del Pare Cruel

    aquest Nadal, però l'ancià li recorda com

    d'important és la seva feina com a Rei Carbassa.

- id: 10899
  text: –––
- id: 10902
  text: >+
    En Jack torna a ser el Rei Carbassa.

    Com li deu anar?

- id: 10903
  text: >+
    Cap a Vila Halloween!

- id: 10904
  text: >+
    En Sora i els altres troben regals per terra

    a Vila Halloween. Ajuden el Jack

    a tornar-los al Pare Noel.

- id: 10905
  text: >+
    Torna els regals al Pare Cruel!

- id: 10906
  text: >+
    Algú havia robat els regals. Justament quan

    sortien a la recerca del culpable,

    senten un soroll al taller.

- id: 10907
  text: >+
    Ves al taller de joguines!

- id: 10908
  text: >+
    En entrar al taller de joguines, 

    descobreixen la causa del soroll.

- id: 10909
  text: >+
    Explora el taller de joguines!

- id: 10910
  text: >+
    Els tres pillets no eren els lladres.

    La Sally apareix per avisar que els

    sensecor son a la plaça.

- id: 10911
  text: >+
    Torna a Vila Halloween!

- id: 10912
  text: >+
    També han robat l'experiment del

    Doctor! El grup es dirigeix a la casa del

    Pare Cruel per preparar regals amb trampa.

- id: 10913
  text: >+
    Demana ajuda a casa del Pare Cruel!

- id: 10914
  text: >+
    En Sora i els altres es dirigeixen al segon

    pis del taller de joguines per preparar

    els regals amb trampa.

- id: 10915
  text: >+
    Puja al segon pis!

- id: 10916
  text: >+
    Els regals amb trampa estan a punt. El

    Pare Cruel comenta que coneix un bon lloc

    per col・locar la trampa per al lladre.

- id: 10917
  text: >+
    Parla amb el Pare Cruel!

- id: 10918
  text: >+
    Els nostres amics van arribar a Port Royal.

    Després de donar-hi un cop d'ull, van sentir

    xivarri al port.

- id: 10919
  text: >+
    Baixa les escales fins al port!

- id: 10920
  text: >+
    Era en Pete i uns pirates zombis!

    Què pretenen? Se'n van anar cap a

    la ciutat a cercar un medalló.

- id: 10921
  text: >+
    Ves a cercar els pirates a la ciutat!

- id: 10922
  text: >+
    L'Elizabeth, la filla del governador, ha estat

    raptada! En Sora i en Will corren cap al

    port darrere dels pirates.

- id: 10923
  text: >+
    Corre cap al port rere els pirates!

- id: 10924
  text: >+
    El vaixell pirata ja havia partit. Amb

    l'ajuda d'un pirata anomenat Jack Sparrow,

    en Sora i els altres decideixen perseguir-los.

- id: 10925
  text: >+
    Parla amb Will i puja a bord!

- id: 10926
  text: >+
    Unes peces d'or van maleir els pirates,

    però si les tornen i restableixen la sang a

    amortitzar, la maledicció es trencarà.

- id: 10927
  text: >+
    Atrapa la nau pirata: la Perla Negra!

- id: 10928
  text: >+
    El Barbossa, líder dels pirates maleïts,

    era abans part de la tripulació del Jack.

    Ara en Jack vol recuperar la Perla.

- id: 10929
  text: >+
    Pren rumb cap a l'Isla de Muerta!

- id: 10930
  text: >+
    A l'Isla de Muerta, en Sora i els seus amics

    es queden vigilant el vaixell. Estan preocupats perquè en Jack i

    en Will triguen massa.

- id: 10931
  text: >+
    Entra a la gruta!

- id: 10932
  text: >+
    Els pirates han recuperat tot l'or.

    Ara s'ha de restablir la sang a

    amortitzar. La cerimònia començarà.

- id: 10933
  text: >+
    Avança fins al fons de la gruta!

- id: 10934
  text: >+
    La sang s'ha amortitzat, però no ha trencat

    la maledicció. En Will va rescatar l'Elizabeth

    i tots van aconseguir escapar.

- id: 10935
  text: >+
    Torna a Port Royal!

- id: 10936
  text: >+
    De tornada a Port Royal, la veritat

    va sortir a la llum. És la sang d'en Will la que es

    necessita per amortitzar.

- id: 10937
  text: >+
    Torna a Port Royal!

- id: 10938
  text: >+
    En Barbossa ha atrapat l'Interceptor, s'ha

    endut en Will i ha omplert la nau d'explosius.

    Saltarà pels aires!

- id: 10939
  text: >+
    Fes alguna cosa amb els barrils de pólvora!

- id: 10940
  text: >+
    En Sora i els seus amics han aconseguit

    salvar la seva pell. Ara han d'enfrontar-se a en

    Barbossa i ajudar en Will.

- id: 10941
  text: >+
    Ves al cor de l'Isla de Muerta!

- id: 10942
  text: >+
    En Barbossa fou derrotat i el Will i l'Elizabeth

    tornaven a estar junts. Pel que fa a en Jack,

    navegava de nou amb la seva Perla Negra.

- id: 10943
  text: –––
- id: 10944
  text: >+
    Com estarà Port Royal ara que els

    pirates maleïts han desaparegut?

- id: 10945
  text: >+
    Cap a Port Royal!

- id: 10946
  text: >+
    En Sora i els seus amics han tornat

    a Port Royal i sembla que hi ha

    problemes al port.

- id: 10947
  text: >+
    Esbrina què passa al port!

- id: 10948
  text: >+
    Els pirates maleïts eren els causants del

    xivarri. Amb l'ajuda del Jack, els van derrotar.

    Però en Will se n'ha anat a l'Isla de Muerta sol!

- id: 10949
  text: >+
    Navega fins a l'Isla de Muerta!

- id: 10950
  text: >+
    Troben en Will, que els explica que

    l'Organització {XIII} ha alliberat un monstre.

    En Jack es nega a anar a buscar-lo.

- id: 10951
  text: >+
    Posa la nau en moviment!

- id: 10952
  text: >+
    En l'encontre, l'Interceptor acaba enfonsat

    i el grup del Sora vençut. Tots acaben

    encallats en un cementiri de naus.

- id: 10953
  text: >+
    Busca una nau que floti a l'illa!

- id: 10954
  text: >+
    De nou, en Jack és víctima de la maledicció a

    causa del monstre de l'Organització. Només

    recuperant l'or robat es desfarà.

- id: 10955
  text: >+
    Recupera les peces d'or!

- id: 10956
  text: >+
    En Sora i els seus amics van recuperar

    tot l'or. L'Organització deu haver anat

    a algun lloc amb molta gent.

- id: 10957
  text: >+
    Dirigeix-te a Port Royal!

- id: 10958
  text: >+
    Es va llençar l'arca amb l'or

    maleït al fons de l'oceà i la seguretat va tornar a Port

    Royal.

- id: 10959
  text: –––
- id: 10960
  text: >+
    En Sora i els seus amics han estat arrossegats

    a l'interior d'un sistema informàtic.

    Decideixen escapar amb l'ajuda del Tron.

- id: 10961
  text: >+
    Obre la porta de la cel・la!

- id: 10962
  text: >+
    Escapen amb l'ajuda d'en Tron. Per

    tornar al món exterior, necessiten

    el nucli d'energia situat al canó.

- id: 10963
  text: >+
    Busca el nucli d'energia al canó!

- id: 10964
  text: >+
    Un cop iniciat, el nucli d'energia

    retornarà el corrent elèctric al terminal necessari

    per tornar al món exterior.

- id: 10965
  text: >+
    Busca el nucli d'energia al canó!

- id: 10966
  text: >+
    Gràcies al Tron, hi ha una via lliure

    cap a casa. Per encendre el terminal,

    el grup ha de tornar a la cel・la.

- id: 10967
  text: >+
    Torna a la cel・la!

- id: 10968
  text: >+
    El Tron necessitava la contrasenya d'un

    entorn de dades anomenat DTD. L'Ansem

    , el seu usuari, l'hauria de tenir.

- id: 10969
  text: >+
    Cerca la contrasenya de l'Ansem!

- id: 10970
  text: >+
    En Sora ha obtingut la contrasenya.

    Ara, s'han d'encaminar cap a l'entorn

    de dades DTD amb el Tron.

- id: 10971
  text: >+
    Ves cap a l'entorn de dades!

- id: 10972
  text: >+
    En Tron utilitza la contrasenya per desbloquejar

    l'entorn de dades, però el PCM contraataca

    amb un programa que amenaça la ciutat.

- id: 10973
  text: >+
    Afanya't a anar a la Torre I/O!

- id: 10974
  text: >+
    El programa hostil continua

    transmetent-se a la ciutat des de la

    Torre I/O.

- id: 10975
  text: >+
    {:width 95}Obre't pas pel corredor de la torre!

- id: 10976
  text: >+
    En Sora i els seus amics han salvat la ciutat.

    Ara han de tornar a l'exterior, perquè

    hi ha moltes preguntes pendents sobre l'Ansem.

- id: 10977
  text: >+
    Torna a Baluard Balmat!

- id: 10978
  text: >+
    El grup torna al món exterior,

    adonant-se que ara tenen un vincle

    molt fort amb el Tron.

- id: 10979
  text: –––
- id: 10980
  text: >+
    En Tron deu estar combatent el PCM.

    Com li deu anar?

- id: 10981
  text: >+
    Rumb a l'Espai Paranoic!

- id: 10982
  text: >+
    El grup ha tornat al

    món informàtic. Estan preocupats pel Tron,

    que està atrapat a la xarxa del joc.

- id: 10983
  text: >+
    Transporta't a la xarxa del joc!

- id: 10984
  text: >+
    El PCM pretén començar una guerra contra

    els usuaris. Amb en Tron, el grup es dirigeix

    a recollir un programa per esborrar el PCM.

- id: 10985
  text: >+
    Dirigeix-te a la Torre I/O!

- id: 10986
  text: >+
    Gairebé han arribat a la Torre I/O.

    En Léon està fent tot el possible

    des del món exterior.

- id: 10987
  text: >+
    Afanya't a anar a la Torre I/O!

- id: 10988
  text: >+
    El programa enviat pel Léon obre el

    navegador solar, que el grup pot

    utilitzar per arribar fins al PCM.

- id: 10989
  text: >+
    Utilitza el navegador solar per arribar al PCM!

- id: 10990
  text: >+
    En Sora i els seus amics baixen del

    navegador solar a l'esquena del PCM.

    La batalla final és a prop.

- id: 10991
  text: >+
    Entra al nucli de l'ordinador central!

- id: 10992
  text: >+
    En Sora i companyia prometen tornar

    a veure en Tron, que els obsequia amb una

    visió dels orígens de la ciutat.

- id: 10993
  text: –––
- id: 10994
  text: >+
    Amb l'ajuda de l'Axel aconseguim

    sortir de la foscor. Segons sembla, la Kairi era

    presa a la masmorra del castell.

- id: 10995
  text: >+
    Troba el castell i salva la Kairi!

- id: 10996
  text: >+
    Primer dia

- id: 10997
  text: >+
    Segon dia

- id: 10998
  text: >+
    Tercer dia

- id: 10999
  text: >+
    Quart dia

- id: 11000
  text: >+
    Cinquè dia

- id: 11001
  text: >2+


- id: 11002
  text: >+
    Guiat per una veu que el cridava, en

    Sora desperta en una vella mansió.

    Devia haver estat dormint allà

    molt de temps, però no aconsegueix

    recordar res.

- id: 11003
  text: >+
    En sortir, es troba en una ciutat que

    li resulta estranyament familiar.

    encara que mai no hi havia estat.

- id: 11004
  text: >+
    En Sora vaga perplex per Vila Crepuscle

    quan es troba amb en Hayner, en Pence

    i l'Olette al carreró. Li diuen que algú

    havia preguntat per en Sora i els seus

    amics a l'estació. Per la descripció que

    en fan, deu tractar-se del rei.

- id: 11005
  text: >+
    En Sora i els seus amics corren cap

    a l'estació, però de sobte es veuen

    rodejats per una munió d'enemics.

    L'home vestit de negre que els fa

    sortir del mal pas no és altre que el rei

    en persona! Però no hi ha hagut gaire

    temps per celebrar el retrobament.

    «Heu de pujar al tren i sortir de la

    ciutat!», els diu el rei; i dona al Sora

    un moneder amb diners abans d'anar-se'n.

    Saber que el rei va estar atrapat al

    Regne de la Foscor i continua sa i estalvi,

    fa entendre que en Riku també deu estar

    bé. En Sora decideix sortir a la recerca 

    d'en Riku: «Així podrem tornar a les illes

    junts. La Kairi és allà esperant-nos!».

    I, per descomptat, en Donald i en Goofy

    decideixen anar-hi també.

- id: 11006
  text: >+
    Ha arribat l'hora de començar una nova

    aventura. Com havia dit el rei, havien

    d'agafar un tren i sortir de la ciutat.

    S'acomiaden d'en Hayner i els altres,

    que han vingut a l'estació per

    veure'ls marxar.

- id: 11007
  text: >+
    Ha estat un comiat emotiu, malgrat

    que en Sora acaba de conèixer els

    tres amics... Encara amb una gran

    tristesa, pugen al tren, que els

    du fins a la base d'una solitària torre.

- id: 11008
  text: >+
    En Donald i en Goofy van reconèixer el

    paio de l'entrada de la torre:

    en Pete, un autèntic malandrí. El rei

    l'havia desterrat a una altra dimensió,

    però la bruixa Malèfica el va alliberar

    i ell es va convertir en el seu esbirro.

    Intentava reunir un exèrcit de sensecor

    i el seu objectiu actual era convertir el

    mestre Yen Sid, mentor del rei.

- id: 11009
  text: >+
    La torre estava infestada de sensecor.

    Quan en Sora i els seus amics van aconseguir

    arribar al capdamunt de la torre, el mestre

    Yen Sid els esperava: “L'escollit de la

    clau espasa! Tu ets la clau que

    obrirà la porta a la llum”.

- id: 11010
  text: >+
    Segons en Yen Sid, la llum es trobava sota

    una nova amenaça: els “incorporis”.

    Aquests són la carcassa buida que queda

    quan algú amb un cor fort es converteix

    en un sensecor, tot i que actuen amb la

    seva pròpia determinació i voluntat. Un

    grup anomenat Organització {XIII} controla

    aquests incorporis, tot i que

    es desconeixen els seus propòsits. El rei

    ha emprès un viatge per esbrinar l'objectiu

    de l'Organització {XIII}. Si en Sora i els seus

    amics aconsegueixen trobar el rei, pot ser

    que descobreixin també on és en Riku.

- id: 11011
  text: >+
    En Sora va decidir sortir a cercar el rei,

    però necessitava renovar la seva roba,

    ja que se li havia quedat petita.

- id: 11012
  text: >+
    Les tres fades protectores van proporcionar

    al Sora l'armari rober màgic que li serviria en el

    seu viatge.

- id: 11013
  text: >+
    Només faltava partir en la nau gumi

    que el mestre Yen Sid havia preparat.

    Haurien d'anar obrint les portes guiats

    pel raig de llum que brotaven de la clau

    espasa i noves rutes apareixerien,

    connectant els mons un cop més.

    Sí, tot està connectat, fins i tot els cors

    que estan separats per grans distàncies.

    Una nova aventura espera!

- id: 11016
  text: >+
    En arribar a Vila Crepuscle de nou,

    en Vivi corria demanant ajuda.

- id: 11017
  text: >+
    En Sora i els seus amics van córrer cap

    al solar i van derrotar els incorporis

    que assetjaven en Seifer i la seva colla.

    En Saïx, un membre de l'Organització {XIII},

    va aparèixer per advertir el grup:

    l'Axel havia desertat i intentava

    convertir en Sora en un sensecor.

    Després va etzibar un comentari sobre

    en Riku i va desaparèixer en la foscor.

    En Seifer va intentar que en Sora acceptés

    el trofeu del més fort de la ciutat.

    Aleshores en Pence, molt

    nerviós, va arribar i li va preguntar:

    “Coneixes una noia anomenada Kairi?”

- id: 11018
  text: >+
    La caixa trobada en el Regne de la

    Foscor contenia un gelat i fotos de

    la vella mansió de Vila Crepuscle.

- id: 11019
  text: >+
    En Sora i els seus companys van anar a la

    mansió a buscar pistes, però van trobar en

    Hayner i els seus amics, que havien estat

    atacats pels sensecors. Segons l'Olette,

    creien que la mansió era algun tipus de

    porta d'entrada a una Vila Crepuscle alternativa.

    “Com que una Vila Crepuscle alternativa?”

    Noten que ambdós tenen duplicats d'un

    moneder i uns cristalls que se suposava

    que havien de ser únics. Aquella era la prova

    que “per allà” hi havia una altra Vila Crepuscle

    similar a la “d'aquí”. “En aquella altra

    ciutat és on deu ser tot el que falta aquí!”,

    va dir en Pence. Si la Kairi ha desaparegut

    d'aquesta Vila Crepuscle... pot ser que ens

    estigui esperant en l'altra! Fou aleshores quan

    va aparèixer el rei. Seguia la pista de

    l'Ansem el Savi, que es dirigia a la fortalesa

    de l'Organització {XIII}. Tot i que no va comentar

    massa detalls, les seves paraules deixaven

    entendre que en Sora podria retrobar-se amb

    en Riku si seguia el rei.

- id: 11020
  text: >+
    Segons el rei, l'ordinador de la vella

    mansió estava connectat amb l'altra

    Vila Crepuscle. Potser a través d'ell

    podrien trobar un camí al Regne de la

    Foscor.

- id: 11021
  text: >+
    L'ordinador estava protegit amb una contrasenya, però

    en Sora i els seus amics van recordar una

    cosa que podria estar relacionada: el gelat

    que era a la caixa amb les fotos!

- id: 11022
  text: >+
    La contrasenya era: «Gelat de sal marina».

    En introduir el nom del sabor preferit de

    l'Ànsem el Savi es va activar un mecanisme

    que va provocar un feix de llum.

    El camí a l'altra Vila Crepuscle

    s'havia obert.

- id: 11023
  text: >+
    En Sora i els seus amics van arribar a l'altra

    Vila Crepuscle i es van unir al rei en la seva

    recerca d'una entrada al Regne de la Foscor.

- id: 11024
  text: >+
    Un cop més tornàvem a Baluard

    Balmat. Les coses havien canviat,

    però encara hi havia problemes.

- id: 11025
  text: >+
    Mentre caminàvem per una ciutat

    infestada de sensecor, ens vam creuar

    amb la Yuffie.

- id: 11026
  text: >+
    «Benvinguts al Comitè de Restauració

    de Baluard Balmat!» Vam anar a casa del

    Merlí i allà hi eren en Léon i tots els nostres

    vells amics. Segons sembla, tots ens havien

    recordat en els últims dies. Vam decidir

    ajudar amb la reconstrucció, però hi havia un

    gran problema a la ciutat.

- id: 11027
  text: >+
    La Vall del Malvat estava infestada de

    sensecor i incorporis. En Sora es va

    disposar a enfrontar-s'hi, però va

    aparèixer l'Organització {XIII} amb el seu

    habitual reguitzell d'intrigants paraules.

    Sense temps per reaccionar, la clau espasa

    va brillar i va aparèixer la porta a un nou
    
    món. Amb les paraules d'en Yen Sid presents,

    partim.

- id: 11028
  text: >+
    Guiats pel Merlí, tornem a Baluard

    Balmat. Què ens trobem?

    El llibre d'en Pooh!

- id: 11029
  text: >+
    Però els sensecor havien arrencat les

    pàgines i en Pooh no recordava res.

    Per solucionar el greuge, hauríem de

    trobar les pàgines arrencades.

- id: 11030
  text: >+
    Han aparegut espines al Castell Disney!

    Si no ens afanyem, quedarà sumit

    en la foscor.

- id: 11031
  text: >+
    Amb l'ajuda d'en Merlí vam trobar la

    manera de salvar el Castell Disney.

- id: 11032
  text: >+
    Gràcies al Sora i els seus amics,

    la pau va tornar a regnar al castell.

- id: 11033
  text: >+
    A Baluard Balmat continuava augmentant

    el nombre de sensecor i incorporis.

- id: 11034
  text: >+
    Després de tornar a cal Merlí, vam descobrir

    l'existència d'un ordinador que l'Ansem

    utilitzava per a les seves investigacions.

- id: 11035
  text: >+
    I el que és més important, vam descobrir

    que el rei estava amb en Léon!

- id: 11036
  text: >+
    Però quan vam arribar a l'estudi de l'Ansem,

    no hi havia ni el rei ni l'ordinador.

- id: 11037
  text: >+
    La porta a la sala de l'ordinador

    estava oculta rere un mecanisme secret.

- id: 11038
  text: >+
    En Sora i en Donald, uns negats de la tecnologia,

    van començar a colpejar l'ordinador. De

    sobte, es va activar un estrany dispositiu

    que ens va dur a un misteriós món.

- id: 11041
  text: >+
    Estàvem dins d'un sistema informàtic!

    Amb l'ajuda d'un programa de seguretat

    anomenat Tron, vam tornar al món

    exterior i vam començar a buscar la

    contrasenya dins l'entorn de dades

    d'aquell ordinador, que contenia

    les

    investigacions de l'Ansem.

- id: 11042
  text: >+
    Un cop érem al món exterior, uns

    gargots en una paret («Door to

    Darkness») i l'ajuda del rei ens va

    servir per descobrir la contrasenya:

    els noms de les Set Princeses, que

    vam utilitzar per obrir la porta.

- id: 11043
  text: >+
    Vam tornar al món informàtic per

    complir la promesa que vam fer al Tron.

- id: 11045
  text: >+
    Vam desbloquejar l'entorn de dades

    i vam tornar a Baluard Balmat.

    Ja teníem accés a les dades del DTD!

- id: 11046
  text: >+
    Però la majoria de les dades estaven

    corruptes i no semblava que hi hagués res sobre el

    Riku o la Kairi. Tafanejant, hi vam trobar

    el retrat d'algú. El rei va revelar que era

    l'Ansem, però no era aquell qui nosaltres

    coneixíem! L'Ansem que vam derrotar

    era el sensecor d'algú que es feia passar

    per ell i l'incorpori d'aquell tipus

    resulta ser el líder de l'Organització {XIII}.

    Quina casualitat! El rei ens va explicar que buscava

    l'Ansem real, i que sabria detectar

    l'Ansem fals. En acabar la sala es va

    estremir amb un fort terrabastall.

- id: 11047
  text: >+
    A fora, els sensecor i els incorporis

    infestaven la ciutat.

- id: 11048
  text: >2+


- id: 11049
  text: >+
    En Léon i els nostres altres amics van plantar

    cara a l'allau enemiga. Tots van

    llençar-se amb valentia contra la marabunta

    d'enemics que abundava des de la vall

    del Gran Congost.

- id: 11050
  text: >+
    I qui va aparèixer al final?

    En Xemnas, el líder de l'Organització {XIII}.

    Era en realitat en Xehanort, aprenent de

    l'Ansem el Savi. En Sora va intentar preguntar

    sobre el Riku i la Kairi, però en Xemnas li va dir

    que allò “hauria de preguntar-ho al seu rei” i,

    en acabat, va desaparèixer en la foscor.

    A continuació va aparèixer l'Axel per

    advertir al Sora que l'Organització l'estava

    utilitzant. Perplex, en Sora es va veure

    rodejat pels sensecor quan, de sobte, un raig de llum

    va aparèixer... Amb gran incertesa, la

    batalla semblava que cessava, almenys de moment.

- id: 11051
  text: >+
    Se suposava que Baluard Balmat

    estava en pau...

- id: 11052
  text: >+
    Però alguna cosa no anava bé.

- id: 11053
  text: >+
    El PCM ha piratejat el sistema informàtic i ha

    enviat una infinitat de sensecor a la ciutat.

- id: 11054
  text: >+
    Partim per veure en Tron de nou.

- id: 11055
  text: >+
    L'origen del problema era el PCM, que

    es delia per aconseguir el poder. En

    derrotar el PCM, vam rebre un regal

    del Tron. Es tractava d'una visió de la

    ciutat tal com era en els seus orígens.

    En contemplar-la, la nostàlgia va envair

    els cors dels nostres amics. Cap d'ells

    recordava quan va començar la ciutat a

    dir-se Baluard Balmat... però va resultar

    que el nom original era “Verger Radiant”.

- id: 11058
  text: >+
    Vam passar pel castell, però la Bèstia

    no semblava estar de massa bon humor.

    L'únic que li importava era la seva

    preuada rosa.

- id: 11059
  text: >+
    Li vam preguntar a la Bella què passava.

- id: 11060
  text: >+
    La Bella ens va dir que la Bèstia s'estava

    portant de manera estranya últimament i que

    havia confinat els seus servents a la masmorra.

- id: 11061
  text: >+
    Vam anar al corredor oest per rescatar

    els servents i descobrir-ne més.

- id: 11062
  text: >+
    Però un armari bloquejava la

    porta del soterrani.

- id: 11063
  text: >+
    Quan vam intentar moure'l, ens va parlar!

    Va resultar ser una persona a qui

    havien transformat amb màgia. Una fetillera

    va convertir el seu amo, el príncep, en una

    bèstia, com a càstig per la seva crueltat;

    i amb ell, va encisar tots els seus servents

    també.

- id: 11064
  text: >+
    Vam vèncer la vil porta i vam entrar a

    la masmorra, on vam trobar els

    servents encisats.

- id: 11065
  text: >+
    Els seus anys de servei a la Bèstia

    els feien creure que els sensecor eren

    la causa del seu comportament. I, per

    descomptat, si els sensecor hi eren

    ficats, era una feina per a nosaltres!

- id: 11066
  text: >+
    Els servents ens van mostrar un

    passadís secret.

- id: 11067
  text: >+
    Vam obrir la porta secreta i ens vam

    dirigir a l'habitació de la Bèstia.

- id: 11068
  text: >+
    Allà hi era en Xaldin, de l'Organització {XIII},

    intentant provocar la ira de la Bèstia.

    Tret de polleguera, la Bèstia va carregar

    contra nosaltres, però va recobrar el seny

    amb l'ajuda dels seus servents. La Bèstia

    temia haver fet mal a la Bella quan la ira

    es va apoderar d'ell.

- id: 11069
  text: >+
    Amb la intenció de parlar amb la Bella,

    la Bèstia va anar a buscar-la, però no

    la va trobar enlloc.

- id: 11070
  text: >+
    De sobte, vam sentir la seva crida d'ajuda

    des de la sala de ball!

- id: 11071
  text: >+
    Ens enfrontem als sensecor que

    perseguien la Bella. Va sortir-ne il・lesa,

    però en Xaldin va aconseguir escapar-ne.

    La Bèstia es va disculpar pel seu

    comportament i ambdós van tornar a

    portar-se bé. 

    No obstant això, encara serà necessari

    una mica més de temps perquè es desfaci

    l'encanteri.

- id: 11072
  text: >+
    Vam tornar al castell. La Bèstia semblava

    inquieta i impacient.

- id: 11073
  text: >+
    Va resultar ser un dia molt especial:

    gaudiria d'un elegant ball amb la

    Bella. No obstant això, just abans

    que comencés el ball, en Xaldin va

    aparèixer i va dir que venia a reclamar

    un objecte «molt preuat» per a la Bèstia.

- id: 11074
  text: >+
    En Xaldin havia aconseguit la preuada rosa

    de la Bèstia. Desolada, la Bèstia va intentar

    expulsar-nos, inclosa la Bella, del castell.

    La rosa era la clau per trencar l'encanteri

    que l'afectava a ell i els seus servents:

    la seva única esperança.

- id: 11075
  text: >+
    Més no hi havia temps per a planys: “No

    desaprofitis la teva última oportunitat”, el

    va animar en Sora. D'aquesta manera, la Bèstia va trobar

    la força i el valor per lluitar de nou.

- id: 11076
  text: >+
    L'agosarat Xaldin va observar amb sorna

    la revitalitzada Bèstia i li va dir: “Quan

    el Kingdom Hearts ens pertanyi...

    la nostra existència serà plena”.

- id: 11077
  text: >+
    En Xaldin va intentar segrestar la Bella per

    atrapar la Bèstia, però la jove va aconseguir

    escapolir-se. Vam aprofitar aquell moment

    per derrotar el malvat Xaldin. La rosa fou

    recuperada i la Bèstia va descobrir què era el

    que més estimava. Finalment, el ball va

    començar. No crec que l'encanteri trigui

    massa a trencar-se...

- id: 11078
  text: >+
    Vam aparèixer prop del Coliseu i vam

    veure uns sensecor que estaven sotjant

    una dona.

- id: 11079
  text: >+
    Va resultar ser una amiga de l'Hèrcules

    anomenada Megara, que anava a parlar

    amb l'Hades per demanar-li que el deixés

    descansar . Vam pensar que era perillós,

    nogensmenys vam partir cap a l'Inframon

    per anar a buscar-lo.

- id: 11080
  text: >+
    Mentrestant, l'Hades intentava fer que

    l'Auron, un gran guerrer que havia

    estat convocat des de l'Inframon, lluités contra

    l'Hèrcules. Aquest s'hi va negar rotundament.

    Vam arribar a temps per ajudar l'Auron en la

    seva lluita contra l'Hades, però la maledicció

    de l'Inframon va minvar les nostres forces.

- id: 11081
  text: >+
    Després d'una àrdua escaramussa, vam

    aconseguir rebutjar el Cèrber i fugir

    de l'Inframon. Alhora, l'Hades buscava

    una manera d'utilitzar la clau espasa

    d'en Sora per desblocar el coliseu de

    l'Inframon: l'Infernòdrom.

- id: 11082
  text: >+
    Ens vam reunir amb l'Hèrcules al Coliseu.

    Quan li vam dir que volíem donar una lliçó

    a l'Hades, es va oferir per dur-nos la pedra

    de l'Olimp, capaç d'evitar que el seu portador

    pateixi la maledicció de l'Inframon.

- id: 11083
  text: >+
    Mentre esperàvem l'Hèrcules, ens

    vam entrenar sota les ordres d'en Fil.

- id: 11084
  text: >+
    Quan va tornar, l'Hèrcules no semblava

    tenir massa bon aspecte.

- id: 11085
  text: >+
    La Pedra de l'Olimp havia estat robada

    per un individu vestit de negre. En aquell

    moment, l'Hades va arribar i va explicar

    que tenia la Meg segrestada a l'Inframon.

    L'Hèrcules va voler anar a ajudar-la,

    però tenia un combat contra l'Hidra

    i no podia desentendre-se'n.

- id: 11086
  text: >+
    També el Fil fou atacat per algú vestit de

    negre. Qui sinó nosaltres podia

    desentranyar el misteri?

- id: 11087
  text: >+
    Malgrat patir la maledicció de l'Inframon,

    vam aconseguir endinsar-nos en les

    profunditats de l'amagatall de l'Hades.

- id: 11088
  text: >+
    Vam trobar i derrotar un membre

    de l'Organització {XIII} i vam recuperar

    la Pedra de l'Olimp.

- id: 11089
  text: >+
    Ja érem immunes a la maledicció.

    En Sora va descobrir un estrany pany

    a les profunditats de l'Inframon i

    l'obrí amb la clau espasa.

- id: 11090
  text: >+
    La Meg era allà! Però per què

    somreia tant l'Hades quan se'n va anar?

    L'Hèrcules va arribar just a temps i va

    distreure l'enemic perquè nosaltres ens

    enduguéssim la Meg a la superfície. Malgrat

    tot, la Meg estava molt preocupada pel seu

    musculós amic.

- id: 11091
  text: >+
    Vam tornar per donar un cop de mà i desfer-nos

    del Pete, que havia estat confabulant amb

    l'Hades. Ell ens va obsequiar amb la seva

    habitual parafernàlia i aquestes esgarrifoses

    paraules: “Hauries d'anar a veure què fa aquella

    Hidra...”.

- id: 11092
  text: >+
    Una cosa enorme i misteriosa havia

    aparegut a l'entrada de l'Inframon.

- id: 11093
  text: >+
    L'Infernòdrom que en Zeus havia clausurat

    temps enrere, havia estat desbloquejat i

    tornava a estar operatiu.

- id: 11094
  text: >+
    Tothom, inclòs l'Hèrcules, es va veure obligat a

    participar a la Copa Hades.

- id: 11095
  text: >+
    L'Infernòdrom que en Zeus havia clausurat

    temps enrere, havia estat desbloquejat i

    tornava a estar operatiu. Tothome, inclòs

    l'Hèrcules, es va veure obligat

    a participar a la Copa Hades.

- id: 11096
  text: >2+


- id: 11097
  text: >+
    Si aconseguíem arribar a les finals, ens

    veuríem les cares amb l'Auron. L'Hèrcules

    continuava sense estar en plena forma, tot i que

    se les arreglava per seguir en el torneig.

- id: 11098
  text: >+
    Els aspirants al títol estaven a punt!

    Malgrat això, alguna cosa li passava a l'Auron.

    Es comportava d'una manera molt estranya.

- id: 11099
  text: >+
    L'Hades, més malvats que els malvats,

    havia estat controlant la voluntat de

    l'Auron amb una espècie de ninot màgic.

- id: 11100
  text: >+
    Havia de recuperar el ninot perquè

    l'Auron tornés a ser ell mateix. Mentre l'Auron

    i l'Hèrcules eren ja combatent,

    vam encaminar-nos cap a l'Inframon.

- id: 11101
  text: >+
    Vam trobar el ninot, que contenia els

    retalls del tortuós passat de l'Auron.

    Les penúries i el patiment que va haver

    de suportar havien convertit el seu cor

    en una autèntica roca.

- id: 11102
  text: >+
    Ens vam trobar amb el Iago, antic

    esbirro del nostre enemic Jafar. Va

    jurar-nos que havia canviat, de manera que vam

    permetre que ens acompanyés al palau

    per veure l'Aladdin.

- id: 11103
  text: >+
    La Jasmín que també era allà, es va sorprendre i

    enfadar en veure en Iago. Segur que va pensar

    que les seves intencions eren malvades.

- id: 11104
  text: >+
    A la ciutat, vam sentir un mercader que

    cridava: “Atura't, lladre”, mentre perseguia

    l'Abú i l'Aladdin.

- id: 11105
  text: >+
    La Jasmín que també era allà, es va sorprendre i

    enfadar en veure en Iago. Segur que va

    pensar que les seves intencions eren malvades.

    A la ciutat, vam sentir un mercader que

    cridava: “Atura't, lladre!”, mentre perseguia

    l'Abú i l'Aladdin. Semblava que l'Abú,

    havia robat una llàntia del mercader. L'Aladdin

    la va retornar al seu amo legítim... però

    va resultar que la dita llàntia era aquella on

    era en Jafar!

- id: 11106
  text: >+
    No podíem deixar les coses així,

    per tant, vam demanar al mercader que ens

    donés la llàntia. No obstant això, ens va demanar

    a canvi un tresor digne d'un sultà.

- id: 11107
  text: >+
    No podíem deixar les coses així,

    per tant, vam demanar al mercader que ens

    donés la llàntia. No obstant això, ens va

    demanar a canvi un tresor digne d'un sultà.

    Aconseguir el tresor del palau era impossible,

    així que al Iago se li va ocórrer que

    potser podríem trobar alguna cosa adequada

    a la Cova de les Meravelles.

- id: 11108
  text: >+
    Vam arribar a la Cova de les Meravelles,

    antiga llar de la llàntia màgica,

    per buscar un tresor.

- id: 11109
  text: >+
    Vam aconseguir desactivar les trampes de

    la cova i vam prosseguir el nostre camí.

- id: 11110
  text: >+
    Finalment, una escala va aparèixer

    davant nostre.

- id: 11111
  text: >+
    Vam obrir la porta.

- id: 11112
  text: >+
    Darrere hi havia una habitació plena de tresors!

    Vam triar una cosa apropiada i vam tornar a

    Agrabah, però no hi havia ningú a la botiga

    del mercader!

- id: 11113
  text: >+
    En Pete, que volia apoderar-se de la llàntia,

    anava darrere del mercader.

- id: 11114
  text: >+
    En Pete va invocar alguns sensecor per

    apoderar-se de la llàntia que ens van

    destorbar molt. La llàntia fou segellada

    a la part més profunda del palau. Potser si

    que en Iago s'havia reformat

    finalment...

- id: 11115
  text: >+
    Les coses ja s'haurien d'haver calmat

    a Agrabah, però...

- id: 11116
  text: >+
    En Jafar havia tornat! El mercader el va

    alliberar de la llàntia. En Iago ens va dir

    que era a les Ruïnes Enterrades del desert.

- id: 11117
  text: >+
    En Iago ens va guiar fins a un oasi. Una

    tempesta de sorra ens impedia el pas, però

    el Geni amb la seva màgia ens va ajudar a

    continuar el nostre camí cap a les ruïnes.

- id: 11118
  text: >+
    Però en Jafar no era allà. De fet,

    en Iago ens l'havia feta bona duent-nos

    a les ruïnes. Era un estratagema

    d'en Jafar per mantenir-nos allunyats

    del palau!

- id: 11119
  text: >+
    Vam córrer cap al palau per acabar

    amb les malvades ambicions d'en Jafar.

    El Geni va reconstruir la desolada ciutat

    després del combat i la pau va tornar a regnar.

- id: 11120
  text: >2+


- id: 11121
  text: >+
    Vam arribar a un bosc de bambú i hi

    vam veure una cosa que semblava un

    enorme i amenaçador sensecor. Va

    resultar ser en Mushu, que ens havia

    acompanyat durant el viatge previ. En

    Sora va conèixer la Mulan i va descobrir

    que el Mushu era un drac guardià de la

    seva família. La noia va fingir ser un

    home per allistar-se a l'Exèrcit

    Imperial i enfrontar-se als huns.

- id: 11122
  text: >+
    La Mulan va intentar allistar-se amb el nom

    de Ping, però no la van acceptar. En Sora

    li va proposar una manera per demostrar la

    seva valia: havia de completar les missions

    del Capità.

- id: 11123
  text: >+
    En Ping es va esforçar molt durant

    les missions i es va enfortir més.

- id: 11124
  text: >+
    Tot i que van acceptar el Ping a l'exèrcit,

    continuaven sense valorar-lo com a soldat.

    Llavors, en Mushu va veure en Shan Yu

    entrar en una cova. El Ping es convertiria

    en un heroi si aconseguia derrotar el

    temible cabdill hun.

- id: 11125
  text: >+
    Fent costat al Ping, vam cercar en Shan

    Yu a la cova, però no el vam trobar.

    En canvi, ens vam desfer d'uns

    quants sensecor que hi vam trobar.

- id: 11126
  text: >+
    Quan vam tornar al campament per

    explicar al Capità la gesta d'en Ping,

    vam descobrir que l'exèrcit d'en Shan Yu

    havia arrasat el poblet i les tropes

    imperials havien caigut.

- id: 11127
  text: >+
    Ens vam enfrontar a l'exèrcit enemic al

    cim de la muntanya. En Ping va tenir una

    idea brillant per acabar amb en Shan Yu

    i els sensecor, però es va descobrir que

    en realitat era una dona i fou expulsada

    de l'exèrcit.

- id: 11128
  text: >+
    La Mulan estava decidida a abandonar i

    tornar a casa seva. Aleshores, va veure

    que en Shan Yu, a qui tots donàvem per

    mort, es dirigia a la Ciutat Imperial.

- id: 11129
  text: >+
    L'Emperador estava en perill!

- id: 11130
  text: >+
    Vam arribar just a temps per derrotar

    en Shan Yu i rescatar l'Emperador.

    Tant l'Emperador com el Capità van

    reconèixer la Mulan com la dona

    més valenta de tota la Xina.

- id: 11131
  text: >+
    La pau regnava a la Terra de

    Dracs... o potser no del tot?

- id: 11132
  text: >+
    Vam passar de nou pel poblet i hi vam

    veure un individu vestit de negre.

- id: 11133
  text: >+
    La Mulan se'ns va unir a la persecució

    fins al cim de la muntanya.

- id: 11134
  text: >+
    Una estranya sensació va recórrer el cos

    d'en Sora quan es va trobar cara a cara

    amb l'encaputxat. Podria ser en Riku?

    Se'n va anar abans que reaccionés.

- id: 11135
  text: >+
    Una estranya sensació va recórrer el cos

    d'en Sora quan es va trobar cara a cara

    amb l'encaputxat. Podria ser en Riku?

    Se'n va anar abans que reaccionés.

    A continuació va aparèixer un gran sensecor que

    es va encaminar a la Ciutat Imperial!

- id: 11136
  text: >+
    Vam córrer cap a la ciutat, però tot

    semblava estar en ordre. S'havia vist

    un home vestit de negre a la rodalia.

- id: 11137
  text: >+
    Ens vam afanyar cap al palau.

- id: 11138
  text: >+
    Les portes estaven bloquejades, però l'astúcia

    de la Mulan ens va permetre entrar.

    L'encaputxat vestit de negre era a dins.

- id: 11139
  text: >+
    “Riku?” Després de la crida d'en Sora,

    l'home va revelar la seva identitat. Es

    tractava d'en Xigbar, de l'Organització {XIII}.

    Vam haver d'ocupar-nos dels enemics

    que ens va enviar.

- id: 11140
  text: >+
    Vam anar a assegurar-nos que el Capità

    i l'Emperador estaven fora de perill. Ambdós

    van assegurar haver conegut un home

    vestit de negre... però no era en Xigbar.

    Seria el Riku? En aquell moment, un gran

    terrabastall va sacsejar el palau.

- id: 11141
  text: >+
    El gran sensecor que havíem vist al

    cim havia arribat. Junts, ens en vam

    desfer i vam salvar la Ciutat

    Imperial. Les valeroses accions de la

    Mulan la van fer mereixedora d'un

    lloc a la guàrdia al costat del Capità.

    En Sora, d'alguna manera, sentia que

    en Riku estava bé... allà on fos.

- id: 11142
  text: >+
    En Sora va tornar al Bosc dels Cent Acres.

- id: 11143
  text: >+
    En Pooh era davant de casa seva,

    abstret en els seus pensaments.

- id: 11144
  text: >+
    Quan el Sora va intentar parlar amb en Pooh,
 
    una estranya força el va empènyer fora.

    El llibre estava a punt de ser robat pels

    sensecor. En Sora va recuperar el llibre

    i el va tornar a entrar-hi, però va

    resultar que l'única cosa que hi

    quedava era la casa d'en Pooh.

- id: 11145
  text: >+
    No obstant això, en Sora va alegrar-se

    en veure que el Pooh semblava estar bé.

- id: 11146
  text: >+
    Però només ho semblava. Les pàgines

    arrencades pels sensecor havien

    afectat la memòria d'en Pooh. Gairebé

    no recordava res!

- id: 11147
  text: >+
    Una pàgina de sobres.

- id: 11148
  text: >+
    Quan en Sora va arribar amb la pàgina arrencada,

    va aparèixer un arbre amb una petita porta.

- id: 11149
  text: >+
    En Sora va veure com una ventada

    havia atrapat en Piglet.

- id: 11150
  text: >+
    En Sora va rescatar en Piglet, però el va

    afectar tant que en Pooh no el recordés,

    que la ventada va tornar a endur-se'l pels

    aires.

- id: 11151
  text: >+
    En Sora va intentar ajudar en Piglet, però aquest

    havia de deixar-se caure des del capdamunt d'un

    arbre. El seu coratge va fer que en Pooh recuperés

    una mica la memòria:

    ja recordava en Piglet, però encara no en Sora.

- id: 11152
  text: >+
    Quan el Sora va arribar amb la pàgina

    arrencada, va aparèixer un arbre

    envoltat d'un jardí.

- id: 11153
  text: >+
    En Pooh tampoc recordava l'Igor.

    El seu amic creia que la memòria d'en Pooh

    milloraria si menjava fins a omplir la seva

    panxeta, així que el va dur fins a dolls de mel.

- id: 11154
  text: >+
    Però la mel no va funcionar gens,

    puix en Pooh no va recordar pas res.

    El Conill, el propietari de la mel, va pensar

    que potser l'os necessitava molta més mel.

- id: 11155
  text: >+
    Tampoc va funcionar. En veure el Conill

    escalfant-se el cap, en Pooh per fi el va

    recordar i també a l'Igor. Malgrat això, en

    Sora continuava sense resultar-li familiar.

- id: 11156
  text: >+
    Quan en Sora va arribar amb la pàgina

    arrencada, va aparèixer un arbre ple

    de paquets.

- id: 11157
  text: >+
    Preocupats pel Pooh, la Cangu i el Ret

    li van dur una medicina, però en Tigger

    se la va endur fent bots.

- id: 11158
  text: >+
    En Tigger va sugerir que si tots botaven

    junts, potser en Pooh recuperaria la

    memòria.

- id: 11159
  text: >+
    Però això tampoc va funcionar. En

    veure en Tigger deprimit, en Pooh

    va recordar la resta dels seus amics.

    Més tard, en un somni, en Pooh va

    estar a punt de recordar una altra cosa...

- id: 11160
  text: >+
    Quan el Sora va arribar amb la pàgina

    arrencada, va aparèixer una

    cova tenebrosa.

- id: 11161
  text: >+
    Semblava que en Pooh s'havia

    endinsat sol a la cova.

- id: 11162
  text: >+
    Cercava algú que li va fer una

    promesa molt especial. I va

    resultar que era en Sora! Ambdós

    es van agafar de la mà i van tornar a

    casa feliços amb tots els seus amics.

- id: 11163
  text: >+
    Quan en Sora va arribar amb la pàgina

    arrencada, va aparèixer un turó estrellat.

- id: 11164
  text: >+
    En Pooh havia ficat el cap en un gerro

    de mel i no el podia treure! Os pocatraça!

- id: 11165
  text: >+
    En Pooh buscava una manera d'evitar

    que en Sora se n'anés. Li va preguntar si

    alguna cosa podria fer que es quedés.

    En Sora li va assenyalar el cor i li

    va dir que ell sempre estaria allà.

- id: 11166
  text: >+
    Tan bon punt vam arribar a un congost, unes

    hienes ens van atacar. El seu nou aspecte

    «salvatge» va obligar en Sora, en Donald

    i en Goofy, a practicar per acostumar-se

    a la nova forma de moure's.

- id: 11167
  text: >+
    Després van conèixer la Nala, una lleona

    que els sensecor havien acorralat.

    Ens va parlar de la trista situació del seu

    poble natal i en Sora va decidir ajudar-la.

- id: 11168
  text: >+
    Però segons en Rafiki, qui salvés les

    Terres del Regne, n'esdevindria rei.

    Això va deixar en Sora fora.

- id: 11169
  text: >+
    Quan estàvem a punt d'abandonar les

    Terres del Regne, el rei Scar i les seves

    hienes ens van rodejar; però la Nala ens

    va ajudar a escapar. Quan en Sora li va

    preguntar si hi havia algú més digne de

    ser rei, la lleona va murmurar: «Si

    en Simba fos aquí...»

- id: 11170
  text: >+
    Un any abans, en Simba havia lluitat amb

    en Sora. La Nala va saltar d'alegria en

    sentir la notícia!

- id: 11171
  text: >+
    L'Scar li va dir a la Nala que en Simba

    havia mort juntament amb en Mufasa,

    l'anterior rei. En aquell moment, en Rafiki

    va aparèixer i va assenyalar cap a l'oasi.

- id: 11172
  text: >+
    Allà era en Simba.

- id: 11173
  text: >+
    La Nala li va demanar que tornés a les Terres

    del Regne, però en Simba s'hi va negar i va

    dir que preferia oblidar el passat i viure

    en el present... «hakuna matata».

- id: 11174
  text: >+
    En Simba es va sentir culpable per la mort

    del seu pare, però va tenir una visió d'ell

    gràcies a la qual va recuperar el coratge

    per tornar a les Terres del Regne.

- id: 11175
  text: >+
    En Simba va desafiar a l'Scar a un combat.

    Durant la baralla, l'Scar

    va confessar haver assassinat el rei Mufasa.

    En Simba va deixar anar un rugit de ràbia!

- id: 11176
  text: >+
    En Simba va derrotar l'Scar i va rugir triomfant

    des de dalt de la Roca del Clan. Les

    lleones van respondre a la crida del seu

    nou monarca coronat.

- id: 11177
  text: >+
    En Simba ja era rei de les Terres del Regne.

- id: 11178
  text: >2+


- id: 11179
  text: >+
    Ens trobem amb les hienes a la

    sabana. En sentir el nom de

    Simba, van esclatar a riure. Ens ha semblat

    molt estrany. Quan

    buscàvem en Simba, se'ns va aparèixer el fantasma

    de l'Scar.

- id: 11180
  text: >+
    Tot i que tot apuntava a això com a

    prova de la decadència del regne, en Simba no

    semblava disposat a actuar, i el seu

    comportament no va fer més que causar

    malestar entre els seus súbdits.

- id: 11181
  text: >+
    Hi havia una raó per a les tribulacions

    d'en Simba: seguia pensant en com

    actuaria el seu pare en aquesta situació. El vam

    ajudar a veure que era el seu judici el

    que importava i, finalment, va recuperar la

    confiança en la seva capacitat de lideratge.

- id: 11182
  text: >+
    Segons en Rafiki, el fantasma de l'Scar era

    la representació de les debilitats

    d'en Simba.

- id: 11183
  text: ''
- id: 11184
  text: >+
    Vam anar al Cementiri de l'Elefant

    per esbrinar el significat de les paraules

    del místic simi. Vam preguntar a les hienes

    sobre el fantasma de l'Scar, que va aparèixer

    de sobte! En veure'l, en Simba va fugir.

- id: 11185
  text: >+
    Ens vam encarregar d'estimular en Simba i

    finalment es va adonar que

    els seus amics eren allà per lluitar al seu costat.

    En Simba va aconseguir derrotar el fantasma de

    l'Scar.

- id: 11186
  text: >+
    En Simba va rescatar la Nala de les urpes d'

    un gegant sensecor i la pau va

    tornar a omplir les Terres del Regne.

- id: 11187
  text: >+
    Vam decidir fer una visita a Atlàntica,

    el regne submarí, i veure l'Ariel un

    cop més.

- id: 11188
  text: >+
    Tothom es preparava per a un gran musical,

    però l'Ariel no podia concentrar-se en

    els assajos. En Sebastià va demanar

    al Sora, el Donald i el Goofy que

    participessin en l'obra, però ni tan sols

    això va aconseguir que l'Ariel se centrés.

- id: 11189
  text: >+
    Pel que sembla, l'Ariel tenia curiositat

    pel món humà. En Flounder va suggerir

    que li podrien ensenyar una estàtua que

    havia trobat. Vaig pensar que això

    l'animaria, perquè adorava la superfície.

- id: 11190
  text: >+
    A l'Ariel li encantava el regal d'en

    Flounder, ja que l'estàtua representava

    l'home per qui l'Ariel sospirava.

- id: 11191
  text: >+
    L'Ariel estava enamorada d'un príncep humà.

- id: 11192
  text: >+
    Però, lògicament, vivia en el món

    humà i l'única manera que tenia l'Ariel d'estar

    amb ell era convertir-se en

    humà. L'Úrsula la va convèncer que li

    donés la seva veu a canvi del seu desig.

- id: 11193
  text: >+
    L'Ariel i l'Eric s'ho passaven molt bé

    junts... però l'Úrsula tenia altres plans.

    En Sora li va impedir utilitzar la veu de l'Ariel per

    quedar-se amb l'Eric, però el rei Tritó es

    va transformar quan va

    intentar salvar la seva filla. Per sort, l'Eric va venir al rescat

    i va ajudar en Sora i els seus amics

    a derrotar la malvada bruixa dels mars.

- id: 11194
  text: >+
    L'Eric va descobrir que l'Ariel era una sirena,

    però això no va canviar els seus sentiments

    per ella. Estaven fets l'un

    per l'altre. El musical d'en Sebastià va ser

    un autèntic èxit, amb en Sora, en Donald i

    en Goofy en els papers principals. I així,

    terra i mar van conviure en harmonia.

- id: 11195
  text: >+
    Vam fer una visita al Castell Disney,

    alguna cosa semblava no anar bé.

- id: 11196
  text: >+
    Els sensecor havien envaït el pacífic

    castell. La reina Minnie ens va informar

    de tot i després ens vam separar

    per esbrinar què passava.

- id: 11197
  text: >+
    En Sora i la reina Minnie es van dirigir a

    la sala d'audiències, abatent al seu pas

    tants sensecor com van poder trobar.

- id: 11198
  text: >+
    El motiu dels problemes es troba

    a la Sala de la Pedra Angular, oculta

    darrere del tron. La Pedra Angular de Llum,

    que mantenia la pau del castell, estava

    completament envoltada d'espines. No

    podia ser obra de ningú més que de

    la Malèfica!

- id: 11199
  text: >+
    Seguint el consell de la reina Minnie,

    ens dirigim a Baluard Balmat.

    En Merlí ens va crear una porta

    estranya. Va dir que podíem salvar

    el castell si tancàvem una altra porta que

    era més enllà de la que ell va crear.

- id: 11200
  text: >+
    Arribant al món darrere de la

    porta misteriosa, ens trobem en un

    món en blanc i negre amb un

    cert toc nostàlgic.

- id: 11201
  text: >+
    Travessem la porta de Merlí cap a

    un món en blanc i negre amb la

    intenció de salvar el castell.

- id: 11202
  text: >+
    Ens vam trobar amb en Pete, però semblava

    una persona totalment diferent. Potser no

    era ell qui amenaçava el

    castell. Mentre cercàvem l'altra

    porta, vam descobrir una finestra estranya.

    Estirant la corda, vam veure el que havia

    passat en aquell món moments

    abans de la nostra arribada.

- id: 11203
  text: >+
    Mirant per una altra finestra, vam veure com

    la Malèfica reprenia molt enfadada... a

    algú.

- id: 11204
  text: >+
    Una altra finestra ens mostrava una porta

    com la que havia creat en Merlí. Deu

    haver conduït al mateix món en blanc

    i negre en què érem.

- id: 11205
  text: >+
    Finalment vam descobrir la veritat: aquestes portes

    misterioses estaven

    connectades amb el passat... i allà era precisament

    on érem!

- id: 11206
  text: >+
    L'última finestra ens mostrava el

    Pete, però no el que vam trobar

    quan vam arribar a aquest món, sinó el

    malvat Pete que ja coneixíem.

- id: 11207
  text: >+
    Hem aturat el vaixell del Pete i hem

    impedit que la Pedra Angular

    de Llum pateixi cap dany.

- id: 11208
  text: >+
    Amb la clau d'espasa, Sora va segellar la

    porta perquè en Pete no pogués

    tornar mai al passat. La

    Pedra Angular de Llum va ser retornada al seu

    lloc, fet que va eliminar

    tot indici de foscor al castell.

- id: 11209
  text: >+
    Vam passar per Vila Halloween

    i ens va sorprendre el seu aspecte.

- id: 11210
  text: >2+


- id: 11211
  text: >+
    En Jack, obsessionat amb el Nadal, havia

    decorat la ciutat amb l'esperança de

    celebrar el Nadal a la seva ciutat. 

    Ignorant les pors de la Sally,

    en Jack se'n va anar a veure el Pare Noel.

- id: 11212
  text: >+
    Llavors, els sensecor van aparèixer

    a la ciutat. “Com podria relaxar-se el

    Pare Cruel es relaxi amb tot el que està

    passant?”, va dir en Jack, i ens va demanar

    que fóssim els seus guardaespatlles.

- id: 11213
  text: >+
    El Pare Noel vivia a Vila

    Nadal, un lloc bonic i colorit

    que ens va enlluernar tan bon punt vam arribar.

- id: 11214
  text: >+
    Però també hi eren els sensecor.

    Lluitem estretament

    per arribar fins a casa del Pare Noel.

- id: 11215
  text: >+
    Ens va alegrar molt que el

    Pare Cruel estigués bé, però de sobte,

    vam sentir un soroll en una de les habitacions.

- id: 11216
  text: >2+


- id: 11217
  text: >+
    Vam veure com el Nyek, la Poll i el Puça

    se n'anaven corrents del taller de joguines.

- id: 11218
  text: >2+


- id: 11219
  text: >+
    Vam seguir les petjades dels tres nens

    fins a Vila Halloween i vam trobar

    els tres canalles, que ens van dir

    que l'Home del Sac havia tornat. Després d'això,

    van escapar. La Malèfica havia fet que

    l'Home del Sac tornés a la vida! Pel que sembla,

    les pors de la Sally s'havien

    fet realitat. L'Home del Sac havia segrestat el

    Pare Cruel!

- id: 11220
  text: >+
    Ens vam afanyar cap a Vila

    Nadal seguint els passos de l'Home del Sac.

- id: 11221
  text: >+
    L'Home del Sac va intentar fer-se càrrec del taller,

    però vam aconseguir derrotar-lo. Amb els

    problemes resolts, en Jack va demanar permís al Pare Noel

    per distribuir els regals

    en el seu lloc. No obstant això, el vell li va

    recordar que cadascú tenia assignada

    una tasca molt important, causant

    la tornada d'en Jack a la seva ciutat per seguir

    sent el Rei Carbassa.

- id: 11223
  text: >+
    El Nadal ja era molt a prop.

- id: 11224
  text: >2+


- id: 11225
  text: >+
    Quan vam arribar a Vila Halloween, vam trobar

    regals repartits per tot arreu. Després de

    tornar-los al Pare Noel, ens va dir

    que havien estat robats. Vam

    decidir anar a la recerca del culpable

    quan ens va sorprendre un soroll

    provinent del taller de joguines.

- id: 11226
  text: >2+


- id: 11227
  text: >+
    En entrar al taller, vam veure el Nyek,

    la Poll i el Puça. Ens van dir que només

    estaven buscant peces per a

    l'experiment del Dr. Finkelstein. La Sally

    va venir a dir-nos que els sensecor

    eren a la plaça del poble.

    Serien ells els culpables del robatori?

- id: 11228
  text: >2+


- id: 11229
  text: >+
    No havien estat els sensecor. I l'

    experiment del Doctor també havia

    estat robat. Qui seria el lladre?

    No ens quedava res més que parar-li una trampa,

    així que vam utilitzar el taller del Pare Noel

    per preparar uns regals amb trampa.

- id: 11230
  text: >+
    Vam utilitzar els regals com a esquer per

    atrapar el lladre.

- id: 11231
  text: >+
    Quan vam arribar a Port Royal,

    semblava que hi havia algun tipus de problema al

    port.

- id: 11232
  text: >+
    Allà vam trobar en Pete amb una

    tripulació de pirates zombis.

    Van dir alguna cosa sobre un medalló i

    van marxar cap a la ciutat.

- id: 11233
  text: >+
    Vam anar a buscar-los i vam veure com

    els pirates segrestaven l'Elizabeth, la filla

    del governador. Vam decidir perseguir-los

    juntament amb un jove anomenat Will.

- id: 11234
  text: >+
    Però els pirates ja havien partit.

    Vam aconseguir convèncer en Jack Sparrow,

    un pirata solitari que vam conèixer al

    port, per robar l'Interceptor de la Marina

    Reial i sortir a navegar en busca del

    vaixell pirata, la Perla Negra.

- id: 11235
  text: >+
    Mentrestant, en Barbossa va revelar el seu secret:

    per robar un tresor d'or asteca, ell i la seva

    tripulació estava sota una terrible

    maledicció. Per trencar-lo, totes

    les peces d'or havien de ser retornades, i

    la reclamació de sang reparada...

- id: 11236
  text: >2+


- id: 11237
  text: >2+


- id: 11238
  text: >+
    Resulta que la «Perla Negra» havia

    estat d'en Jack, fins que en Barbossa la

    hi va robar. L'única cosa que va fer que en Jack

    ens ajudés va ser l'oportunitat de

    recuperar la nau. Amb la seva brúixola,

    en Jack va dirigir l'Interceptor a través

    dels mars. Vam arribar a l'Isla de

    Muerta, on hi havia l'or asteca.

    En Jack ens va demanar de vigilar el vaixell

    mentre en Will i ell intentaven rescatar

    l'Elizabeth, però com que tardaven molt,

    vam començar a preocupar-nos. Dins la gruta,

    els pirates cridaven davant l'or. Ja

    havien reunit totes les peces.

    Ara només havien de reparar el greuge

    amb sang i la maledicció es trencaria...

- id: 11239
  text: >+
    ... Això, per descomptat, sí la sang d'Elizabeth

    hagués funcionat. Aprofitant el

    desconcert dels pirates, Will va poder

    escapar amb Elizabeth.

- id: 11240
  text: >2+


- id: 11241
  text: >+
    De camí a Port Royal, vam saber la

    resposta al misteri de la sang. No

    necessitaven la d'Elizabeth,

    si no la del pare de Will... la sang

    d'un pirata! La mateixa que corria per les

    venes del jove Will. El malèvol Barbossa

    va perseguir l'Interceptor, va segrestar en Will

    i va omplir la nostra nau d'explosius.

- id: 11242
  text: >+
    Tothom, inclòs en Jack, estavem amb l'

    aigua al coll, encara que vam aconseguir salvar-lo

    i vam marxar al rescat d'en Will.

- id: 11243
  text: >+
    Vam sortir victoriosos de la lluita contra

    Barbossa... gràcies al fet que Jack també

    era víctima de la maledicció! Will i

    Elizabeth estaven radiants en

    retrobar-se, i Jack va aixecar ancoratges i es va embarcar

    de nou en la seva estimada Perla Negra.

- id: 11244
  text: >+
    La ciutat semblava tranquil・la... però

    realment ho estava?

- id: 11245
  text: >+
    Com la primera vegada que vam

    arribar a Port Royal, alguna cosa s'estava traginant

    al port.

- id: 11246
  text: >+
    La maledicció, que suposàvem trencada,

    no ho estava, perquè l'origen del rebombori

    semblaven ser els pirates maleïts. Els

    vam derrotar amb l'ajuda de Jack, i

    després va aparèixer Elizabeth. Pel que

    sembla, Will, creient que l'or

    podria ser la causa del problema, havia

    marxat cap a l'Isla de Muerta.

- id: 11247
  text: >+
    Enteses les súpliques d'Elizabeth, vam llevar àncores a la

    recerca de Will, a qui vam trobar a la deriva,

    amb les restes d'un naufragi. Va dir que

    l'Organització {XIII} havia robat l'or.

- id: 11248
  text: >+
    En Jack no volia saber res de l'assumpte,

    però va aparèixer un membre de l'

    Organització. Aprofitant que havia

    invocat el “parlament” del codi

    dels pirates, va endur-se diverses peces d'

    or. Durant la confusió, un gran monstre

    ens va atacar i l'Interceptor va ser enfonsat.

- id: 11249
  text: >+
    El corrent ens va arrossegar fins a un

    cementiri de vaixells. Era estrany,

    perquè la maledicció només afectava en Jack.

- id: 11250
  text: >+
    “Fan que els pirates semblin bones

    persones”, va dir en Jack. Dit això,

    ens vam posar en marxa rere l'Organització i l'or.

    La lluita final s'acabaria

    lliurant a Port Royal.

- id: 11251
  text: >+
    Vam derrotar el monstre i vam alliberar en

    Jack de la maledicció. L'Organització

    va escapar, però vam enviar l'arca

    amb l'or asteca al fons del mar

    perquè no causés més problemes. Un cop

    més, el llegendari pirata Jack Sparrow

    va marxar en el Perla Negra.

- id: 11252
  text: >+
    Tafanejant l'ordinador de l'Ansem,

    el PCM va arrossegar-nos dins el

    sistema informàtic. El comandant Sark

    va ficar-nos dintre d'una cel・la, on vam

    conèixer en Tron, un programa de seguretat.

- id: 11253
  text: >+
    Vam escapar de la cel・la amb l'ajuda de

    Tron i ens vam dirigir cap al

    nucli d'energia situat al barranc.

- id: 11254
  text: >+
    Ho necessitàvem per retornar l'

    energia a la terminal que havíem d'

    utilitzar per arribar al món exterior.

- id: 11255
  text: >+
    Quan tot estava a punt per al nostre

    retorn, Tron ens va demanar un favor.

- id: 11256
  text: >+
    Per accedir al lloc de dades anomenat

    DTD, necessitàvem trobar l'usuari

    de Tron i calia demanar la contrasenya...

    però l'usuari no era altre que n'Ansem!

- id: 11257
  text: >+
    Un cop al món exterior, uns gargots

    en una paret («Door to

    Darkness») i l'ajuda del rei ens

    van permetre descobrir la contrasenya:

    els noms de les Set Princeses,

    que havíem utilitzat per obrir la porta.

- id: 11258
  text: >+
    Tron va introduir la contrasenya i va

    desbloquejar l'entorn de dades,

    però el PCM va enviar un programa

    hostil contra la ciutat.

- id: 11259
  text: >+
    Vam córrer fins la Torre d'I/O, però l'

    espectacle encara s'estava emetent.

- id: 11260
  text: >+
    Vam aconseguir destruir el programa hostil

    i així salvar la ciutat.

- id: 11261
  text: >+
    Després de la lluita, Tron ens va parlar d'

    Ansem. Tant Tron com el PCM

    havien estat millorats per Ansem. Tanmateix,

    per què actualitzar dos programes

    antagonistes? No ho vam

    entendre del tot, però sabíem que

    aviat trobaríem la resposta.

    Vinculats a Tron per una connexió molt

    especial, vam tornar al món exterior.

- id: 11262
  text: >+
    Les coses haurien de ser tranquil・les en

    el món de la informàtica...

- id: 11263
  text: >+
    El PCM tenia la ciutat sota control. Per tant,

    vam tornar a entrar al món dels

    ordinadors.

- id: 11264
  text: >+
    El PCM ho tenia tot a punt per començar

    la seva guerra contra els usuaris. De nou

    amb Tron, vam descarregar un

    programa especialment dissenyat per

    erradicar el PCM.

- id: 11265
  text: >+
    Léon, per la seva banda, feia tot el

    que estava en les seves mans a l'exterior.

- id: 11266
  text: >+
    Vam descarregar el programa a la Torre

    I/O, reforçant Tron i donant-nos

    accés a un navegador solar.

- id: 11267
  text: >+
    S'apropava la batalla final...

    Vam pujar a bord del navegador solar

    i vam anar al turó del PCM.

- id: 11268
  text: >+
    Vam derrotar a Sark i vam arruïnar els

    ambiciosos plans del PCM. Abans d'

    acomiadar-nos de Tron, vam prometre que

    qualsevol dia ens reveuríem. Tron va

    utilitzar el sistema per enviar-nos un regal:

    una visió de la ciutat en els seus orígens.

- id: 11269
  text: >+
    L'Axel va utilitzar el seu últim alè per ajudar-nos

    a escapar de la foscor. Vam arribar a

    un món il・luminat per la depriment llum de

    la lluna. Pel que sembla, la Kairi estava presonera

    a les masmorres del castell d'aquella

    estranya ciutat.

- id: 11270
  text: Un missatge
- id: 11271
  text: Agrair a la Naminé.
- id: 11272
  text: El despertar
- id: 11273
  text: >-
    En Sora es desperta d'un llarg son i es

    retroba amb els seus amics Donald i Goofy.
- id: 11274
  text: El mentor del rei
- id: 11275
  text: >-
    Dins la misteriosa torre, vivia el venerable

    Yen Sid, el mentor de Màgia del rei.
- id: 11276
  text: L'arribada de Kairi
- id: 11277
  text: >-
    La Kairi arriba a Vila Crepuscle en

    recerca d'en Sora.
- id: 11278
  text: El camí a seguir
- id: 11279
  text: >-
    La clau espasa d'en Sora va començar a

    brillar i va obrir un camí cap a un altre món.
- id: 11280
  text: Un altre món
- id: 11281
  text: >-
    En Sora i els seus amics havien viatjat

    a una Vila Crepuscle paral・lela.
- id: 11282
  text: En la foscor
- id: 11283
  text: >-
    El poder d'Axel va revelar el camí cap al

    castell de l'Organització {XIII}.
- id: 11284
  text: Dades Desades
- id: 11285
  text: ' '
- id: 11286
  text: El Comitè
- id: 11287
  text: >-
    Léon i els seus amics estaven preparant la

    reconstrucció de Baluard Balmat.
- id: 11288
  text: L'Organització {XIII}
- id: 11289
  text: >-
    Els membres de l'Organització {XIII}

    es van interposar en el camí d'en Sora.
- id: 11290
  text: Comença el viatge
- id: 11291
  text: >-
    La clau espasa va obrir una nova

    porta entre els mons.
- id: 11292
  text: Ànsem el Savi
- id: 11293
  text: >-
    En Sora i els seus amics no havien derrotat l'

    autèntic Ansem, si no al seu aprenent, Xehanort.
- id: 11294
  text: Batalla Reial
- id: 11295
  text: >-
    Hordes de descarnats i sincorazón

    havien infestat el Baluard Balmat.
- id: 11296
  text: El rei decideix
- id: 11297
  text: El rei va prendre el seu lloc en la ferotge batalla.
- id: 11298
  text: Encara els sincorazón
- id: 11299
  text: >-
    Un cop més, els sincorazón van envair

    la pacífica ciutat.
- id: 11300
  text: El seu nom real
- id: 11301
  text: >-
    La pau torna a regnar i tothom recorda el

    veritable nom del lloc: Verger Radiant.
- id: 11302
  text: Retrobament amb la Bèstia
- id: 11303
  text: >-
    En Sora i els seus amics es reuneixen amb

    la Bèstia, que viu obsessionat per la rosa.
- id: 11304
  text: El secret del castell
- id: 11305
  text: >-
    Els servents, convertits en objectes domèstics,

    estaven tancats a les masmorres.
- id: 11306
  text: La Bèstia enganyada
- id: 11307
  text: >-
    L'organització {XIII} havia posat

    una trampa a la Bèstia.
- id: 11308
  text: La batalla del saló de ball
- id: 11309
  text: >-
    Al saló de ball, en Sora i els seus amics

    van lluitar contra els sincorazón que van atacar a Bella.
- id: 11310
  text: Una parella de gala
- id: 11311
  text: >-
    Els dos s'havien vestit amb la seva millor

    roba per a un gran ball, però...
- id: 11312
  text: El més preuat
- id: 11313
  text: >-
    Sense la seva rosa, la Bèstia estava tan trista

    que va ordenar a Bella que abandonés el castell.
- id: 11314
  text: La victòria de Bella
- id: 11315
  text: >-
    La Bella aprofita l'oportunitat i

    recupera la rosa de Xaldin.
- id: 11316
  text: Junts per sempre
- id: 11317
  text: >-
    Les paraules de la Bèstia fan somriure la Bella:

    «Bella, vull que et quedis...».
- id: 11318
  text: Auron contra Hades
- id: 11319
  text: >-
    Criden l'Auron a l'Inframon per fer

    d'assassí, però es nega a cooperar.
- id: 11320
  text: Trobada heroica
- id: 11321
  text: >-
    En Sora i els seus amics es reuneixen

    amb Hèrcules al Coliseu.
- id: 11322
  text: Megara captiva
- id: 11323
  text: >-
    En Sora rescata la Meg i lluita amb

    en Pete, que està confabulat amb l'Hades.
- id: 11324
  text: Coliseu destruït
- id: 11325
  text: >-
    Enfadada, l'Hidra torna i

    destrueix el Coliseu.
- id: 11326
  text: La Copa Hades
- id: 11327
  text: >-
    Hades vol que el debilitat Hèrcules

    participi en el seu torneig.
- id: 11328
  text: El titella de l'Hades
- id: 11329
  text: >-
    En Hades controlava l'Auron per

    desfer-se d'Hèrcules.
- id: 11330
  text: El retorn de l'heroi
- id: 11331
  text: >-
    Hèrcules rescata Megara i torna a sentir-se com

    un veritable heroi.
- id: 11332
  text: Per fi, herois!
- id: 11333
  text: >-
    En Sora i els seus amics es converteixen en

    herois honorífics.
- id: 11334
  text: El lladre de la llàntia
- id: 11335
  text: >-
    Aladdin perseguia l'Abu, que corria amb

    la llàntia pels carrers d'Agrabah.
- id: 11336
  text: A la recerca de tresors
- id: 11337
  text: >-
    En Sora i els altres es dirigeixen a la Cova de

    les Meravelles a la recerca de tresors per al mercader.
- id: 11338
  text: S'ha superat una prova difícil
- id: 11339
  text: >-
    Hi havia un munt de tresors

    a la Cova de les Meravelles.
- id: 11340
  text: Dins la botella
- id: 11341
  text: >-
    La llàntia que tancava Jafar estava

    segura al soterrani del palau.
- id: 11342
  text: En Jafar alliberat
- id: 11343
  text: >-
    El comerciant va alliberar en Jafar del seu

    confinament dins la llàntia.
- id: 11344
  text: La catifa voladora
- id: 11345
  text: >-
    La catifa porta en Sora i els seus amics

    a les ruïnes per lluitar contra en Jafar.
- id: 11346
  text: Trampa d'en Jafar
- id: 11347
  text: >-
    En Iago els va portar a les ruïnes, però

    no hi havia rastre d'en Jafar.
- id: 11348
  text: Per encanteri
- id: 11349
  text: >-
    El geni reconstrueix Agrabah després

    de la destructiva batalla contra en Jafar.
- id: 11350
  text: Mushu i Ping
- id: 11351
  text: >-
    Al bosc de bambú hi havia Mushu i Mulan,

    que es feien passar per un nen anomenat «Ping».
- id: 11352
  text: L'Allau!
- id: 11353
  text: >-
    Per vèncer en Shan Yu, la Mulan va disparar

    un canó i va causar una enorme allau.
- id: 11354
  text: Mulan descoberta
- id: 11355
  text: >-
    Quan el capità Shang descobreix que la

    Mulan és una dona, l'expulsa de l'exèrcit.
- id: 11356
  text: La més valenta de la Xina
- id: 11357
  text: >-
    L'emperador va donar les gràcies a Mulan

    per derrotar Shan Yu i salvar la Xina.
- id: 11358
  text: Un home de negre
- id: 11359
  text: >-
    En Sora veu un home de negre

    a Tung Shao.
- id: 11360
  text: Terratrèmols
- id: 11361
  text: >-
    El sincorazón que va aparèixer a

    Tung Shao va volar cap a la ciutat.
- id: 11362
  text: Podria ser en Riku?
- id: 11363
  text: >-
    L'home de negre del palau no era en

    Riku, si no en Xigbar, de l'Organització {XIII}
- id: 11364
  text: Bons amics
- id: 11365
  text: >-
    En reconeixement pels seus esforços, Mulan

    serveix a l'Emperador al costat del capità Shang.
- id: 11366
  text: Memòries perdudes
- id: 11367
  text: >-
    Els sensecor van esmicolar el seu llibre,

    i ara en Pooh no recorda res.
- id: 11368
  text: Records retrobats
- id: 11369
  text: >-
    En Pooh comença a recordar els seus amics

    del Bosc dels Cent Acres.
- id: 11370
  text: Tu ets... En Sora!
- id: 11371
  text: De sobte, en Pooh va recordar en Sora.
- id: 11372
  text: Sempre seré aquí
- id: 11373
  text: >-
    En Sora promet a en Pooh i els seus amics

    que sempre estarà amb ells.
- id: 11374
  text: Pooh 5
- id: 11375
  text: Número 5
- id: 11376
  text: Pooh 6
- id: 11377
  text: Número 6
- id: 11378
  text: Pooh 7
- id: 11379
  text: Número 7
- id: 11380
  text: Pooh 8
- id: 11381
  text: Número 8
- id: 11382
  text: Un trobament casual
- id: 11383
  text: >-
    En una nit de tempesta, l'Ariel rescata

    el príncep Eric d'un naufragi.
- id: 11384
  text: Ariel, humana
- id: 11385
  text: >-
    L'Ariel signa un contracte amb l'Úrsula i li dona

    la seva bella veu per fer-la humana.
- id: 11386
  text: La batalla amb l'Úrsula
- id: 11387
  text: >-
    Brandant el trident, una gegantina

    Úrsula ataca en Sora.
- id: 11388
  text: Dos mons esdevenen un
- id: 11389
  text: >-
    Els desitjos de l'Ariel es fan realitat:

    per fi la terra i el mar s'uneixen.
- id: 11390
  text: El Castell de Disney
- id: 11391
  text: >-
    En Sora arriba al castell de Disney

    per ajudar la reina Minnie.
- id: 11392
  text: Trobada amb la reina
- id: 11393
  text: >-
    En Sora i els seus amics parlen amb la reina

    sobre els problemes que pateix el castell.
- id: 11394
  text: La Pedra Angular
- id: 11395
  text: >-
    Malèfica ha cobert amb espines el Saló

    de la Pedra Angular de la Llum.
- id: 11396
  text: Torna la tranquil・litat
- id: 11397
  text: >-
    Els amics viatgen al passat per protegir

    la Pedra Angular i la pau torna al castell.
- id: 11398
  text: Pete?
- id: 11399
  text: >-
    En Pete del món en blanc i negre

    era el Pete del passat.
- id: 11400
  text: El rei?
- id: 11401
  text: >-
    En Sora i els seus amics van lluitar contra els

    sensecor i van salvar el rei en el passat.
- id: 11402
  text: Pete contra Pete
- id: 11403
  text: >-
    En Pete del passat s'enfronta

    al Pete actual pel vaixell de vapor.
- id: 11404
  text: Tots a bord!
- id: 11405
  text: >-
    En Pete agraeix a en Sora que hagi

    recuperat el seu vapor.
- id: 11406
  text: Feliç Halloween?
- id: 11407
  text: >-
    En Jack està obsessionat amb

    portar el Nadal a Vila Halloween.
- id: 11408
  text: Pare Cruel
- id: 11409
  text: >-
    El Sora coneix el Pare Noel

    a Vila Nadal.
- id: 11410
  text: El retorn de l'Home del Sac
- id: 11411
  text: >-
    La Malèfica ha reviscut el malvat

    Home del Sac.
- id: 11412
  text: Pare Jack
- id: 11413
  text: >-
    En Pare Cruel ajuda en Jack a recordar

    que la seva feina és espantar la gent.
- id: 11414
  text: El lladre de regals
- id: 11415
  text: >-
    Acusat de robar regals, en Jack

    va a la recerca del veritable lladre.
- id: 11416
  text: El trio mala passada
- id: 11417
  text: >-
    En Nyek, la Poll i el Puça no eren els culpables

    del robatori.
- id: 11418
  text: El veritable culpable
- id: 11419
  text: >-
    L'experiment del doctor Finkelstein havia

    robat els regals.
- id: 11420
  text: Des del cor
- id: 11421
  text: >-
    El que importa no és el regal,

    si no l'acte de donar-lo.
- id: 11422
  text: Amics incondicionals
- id: 11423
  text: >-
    En Sora, els seus amics i Will persegueixen

    els pirates que es van endur l'Elizabeth.
- id: 11424
  text: La maledicció dels zombis
- id: 11425
  text: >-
    A la llum de la lluna, els pirates maleïts

    es converteixen en esquelets horribles.
- id: 11426
  text: Una trucada propera
- id: 11427
  text: >-
    Els vils plans de Barbossa

    van posar a Sora i a la seva companyia en seriosos problemes.
- id: 11428
  text: S'ha aixecat la maledicció
- id: 11429
  text: >-
    En Jack fa ús del poder de la maledicció

    per derrotar al seu vell rival, en Barbossa.
- id: 11430
  text: El retorn de la maledicció
- id: 11431
  text: >-
    La maledicció hauria d'haver acabat, però

    els pirates zombis han tornat.
- id: 11432
  text: Parlament!
- id: 11433
  text: >-
    En Luxord, de l'Organització {XIII}, veu

    la seva oportunitat de portar un sincorazón.
- id: 11434
  text: Cap a Port Royal
- id: 11435
  text: >-
    Decidits a aturar l'Organització,

    en Jack, en Sora i els seus amics es dirigeixen a Port Royal.
- id: 11436
  text: Botí de guerra
- id: 11437
  text: >-
    Després d'acabar amb l'or asteca, en Jack demana

    la clau espasa com a recompensa.
- id: 11438
  text: La trobada amb Tron
- id: 11439
  text: >-
    En Sora i els altres coneixen en Tron

    dins d'un ordinador.
- id: 11440
  text: Per jugar al joc
- id: 11441
  text: >-
    El comandant Sark obliga en Sora i

    els seus amics a travessar la graella del joc.
- id: 11442
  text: Un programa hostil
- id: 11443
  text: >-
    Per destruir la ciutat, el PCM extreu

    un programa de l'entorn de dades.
- id: 11444
  text: L'usuari de Tron
- id: 11445
  text: >-
    Ansem el Savi va ser el creador de

    Tron i el PCM.
- id: 11446
  text: El PCM causa estralls
- id: 11447
  text: >-
    El PCM crea molts sensecor

    per envair la ciutat dels usuaris.
- id: 11448
  text: El Solar Navegador
- id: 11449
  text: >-
    En Sora i els seus amics volen amb el navegador solar

    fins al nucli de l'ordinador central del PCM.
- id: 11450
  text: Contra el PCM
- id: 11451
  text: >-
    En Sora i els altres

    xoquen amb el PCM.
- id: 11452
  text: Adéu, Tron
- id: 11453
  text: En Tron s'acomiada dels seus nous amics.
- id: 11454
  text: Sora
- id: 11455
  text: >-
    Un jove escollit per la clau espasa,

    una arma de naturalesa única.


    No fa molt, en Sora va viatjar amb en

    Donald i en Goofy a la recerca de la

    seva estimada amiga Kairi, que havia

    desaparegut misteriosament en la foscor.


    Al final, van aconseguir salvar els

    mons de l'amenaçadora foscor

    que se'ls apropava.

    Poc després, en Sora va voler

    localitzar en Riku, el seu millor

    amic, que havia quedat atrapat 

    rere la porta de la foscor quan va

    ser segellada. Llavors, va quedar

    foscor un profund son.


    Ara, amb roba nova i una

    determinació renovada, en Sora

    ha tornat a sortir a la recerca

    del seu amic Riku.
- id: 11456
  text: Donald
- id: 11457
  text: >-
    És el mag de les corts del Castell

    de Disney.


    Fa un temps, en Donald es va posar

    en marxa amb en Goofy a la recerca

    del rei Mickey. Durant la seva missió,

    van conèixer en Sora i es van fer

    grans amics.


    Després d'ajudar-lo a salvar els

    mons de la foscor, en Donald i en

    Goofy van continuar buscant el rei,

    que havia decidit romandre al

    Regne de la Foscor.


    Però abans que poguessin trobar-lo,

    els tres amics van caure en un son

    profund.
- id: 11458
  text: Goofy
- id: 11459
  text: >-
    És el capità dels Cavallers Reials

    del Castell de Disney.


    Va sortir amb en Donald a la recerca

    del rei, que els havia ordenat

    «seguir l'escollit de la clau espasa».

    I així, es van unir a en Sora.


    Després d'ajudar a salvar els mons

    de la foscor, en Goofy va continuar

    la recerca. Però de la mateixa

    manera que en Donald i en Sora,

    va caure en un son profund.

    Què devia fer abans d'adormir-se?
- id: 11460
  text: Kairi
- id: 11461
  text: >-
    És l'amiga de la infància d'en Sora

    i una de les Set Princeses que

    enllacen les claus als panys.

    Quan va quedar atrapada en la foscor,

    en Riku i en Sora van intentar

    rescatar-la, cadascú a la seva manera.


    Gràcies a ells, la Kairi va aconseguir

    tornar a les illes, a casa seva, però

    va perdre els records d'en Sora.

    Per aquest motiu, va deixar d'anar a

    l'illot on sempre havien jugat.
- id: 11462
  text: Ànsem
- id: 11463
  text: >-
    Estrany portador de la foscor.


    Què pretén realment?
- id: 11464
  text: Riku
- id: 11465
  text: >-
    El vell amic de la infància d'en

    Sora va decidir per ell mateix.


    Tot i que en Xehanort va intentar controlar

    en Riku, el seu cor va resistir

    el cop: només formant part

    de la foscor

     podria dominar-la.


    En Riku va adoptar el nom d'«Ansem»,

    potser com a signe de les seves

    intencions, perquè vivia en la

    foscor, sí amb això aconseguia

    que el seu amic Sora es despertés.
- id: 11466
  text: DiZ
- id: 11467
  text: Un individu envoltat de misteri.
- id: 11468
  text: Ansem
- id: 11469
  text: ''
- id: 11472
  text: Organització {XIII}
- id: 11473
  text: >-
    El núm. {I} de l'Organització {XIII}.

    Ell és el líder del grup.


    L'Organització {XIII} és un grup

    especial dins els incorporis.

    Poden pensar i conspirar, i

    semblen aspirar a alguna cosa més.


    No sabem què pretenen, encara

    que, sens dubte, coneixen bé la

    naturalesa de la clau espasa.
- id: 11474
  text: Organització {XIII}
- id: 11475
  text: >-
    El núm. {II} de l'Organització {XIII}.

    No se'n sap res.


    Va desaparèixer després de torbar

    en Sora amb les seves absurditats.

    Pel que sembla, els membres de

    l'Organització utilitzen la foscor

    per moure's a voluntat.
- id: 11476
  text: Organització {XIII}
- id: 11477
  text: >-
    El núm. {III} de l'Organització {XIII}.


    Quan algú amb un cor i una voluntat

    forts es converteix en un sensecor,

    la closca buida que deixa enrere

    actua amb voluntat pròpia.


    És que no tenen cor?

    Tan sols són esperits errants?

    O és que, potser, simplement, 

    no són res?
- id: 11478
  text: Vexen
- id: 11479
  text: >-
    Antic núm. {IV} de l'Organització {XIII}.

    Ha estat eliminat. En Vexen, en

    Lexaeus i en Zexión eren membres

    fundadors de l'Organització {XIII},

    i no professaven simpatia cap

    als neòfits com en Marluxia. En

    Vexen es va oposar als plans d'en

    Marluxia de prendre el control de

    l'Organització, fet que va provocar

    que fos aniquilat per l'Axel.
- id: 11480
  text: Lexaeus
- id: 11481
  text: >-
    Antic núm. {V} de l'Organització {XIII}.

    Acostumat a portar una destral

    enorme, però ha estat eliminat.

    En Lexaeus va rebutjar els plans

    d'en Marluxia de controlar

    l'Organització i va conspirar

    pel seu compte, tot i que va

    fracassar i va acabar malament.
- id: 11482
  text: Zexión
- id: 11483
  text: >-
    Antic núm. {VI} de l'Organització {XIII}.

    Difunt.


    En Zexión odiava embrutar-se les

    mans. És per això que recorria al

    seu enginy per desfer-se dels seus

    rivals.

    Suposo que no comptava que

    seria aniquilat.
- id: 11484
  text: Organització {XIII}
- id: 11485
  text: >-
    El núm. {VII} de l'Organització {XIII}.


    Els incorporis com ell semblen

    tenir emocions, però en realitat

    és només una treta. Els

    incorporis manquen de cor.
- id: 11486
  text: Axel
- id: 11487
  text: >-
    El núm. {VIII} de l'Organització {XIII}.

    Domina el foc i porta una

    arma una mica estranya.


    Ha demostrat ser un tipus estrany:

    inflexible amb les traïcions, però

    sempre causant problemes amb les

    seves intrigues maquiavèl・liques

    dins l'Organització.


    Afirma que alguns lligams el

    vinculen al Sora, però la veritat

    és que en Sora no sap què vol dir.
- id: 11488
  text: Organització {XIII}
- id: 11489
  text: >-
    El núm. {IX} de l'Organització {XIII}.


    Tots els membres vesteixen túniques

    negres, i es diu que el seu nombre

    correspon a l'ordre en què van

    arribar a l'Organització. A més,

    els seus noms semblen portar

    la marca de la seva germanor.
- id: 11490
  text: Organització {XIII}
- id: 11491
  text: >-
    El núm. {X} de l'Organització {XIII}.


    L'Organització ha insinuat que,

    a més de saber sobre la clau

    espasa, també podrien saber

    molt d'en Sora. Serà només

    un engany, o realment

    saben de què parlen?
- id: 11492
  text: Marluxia
- id: 11493
  text: >-
    Antic núm. {XI} de l'Organització {XIII}.

    Ens n'hem desfet.


    Va planejar una rebel・lió dins l'

    Organització i va intentar aixecar-se

    amb el poder de la clau espasa,

    però la traïció de l'Axel va provocar

    la seva destrucció.
- id: 11494
  text: Larxene
- id: 11495
  text: >
    Antiga núm. {XII} de l'Organització {XIII}.

    Ha estat eliminada.


    La Larxene va conspirar amb en Marluxia

    per apoderar-se de l'Organització.


    La Larxene era insensible i li

    encantava humiliar els altres,

    tot i que va trobar sabata de son

    peu i així van acabar els seus dies.
- id: 11496
  text: Roxas
- id: 11497
  text: >-
    El núm. {XIII} de l'Organització {XIII},

    portador d'una clau espasa i

    resident de la foscor.


    Va esvair-se apuntant un somriure

    de satisfacció després d'enfrontar-se

    al Sora. Però sembla que en Sora era

    l'únic que podia veure'l.
- id: 11498
  text: Selphie
- id: 11499
  text: >-
    Una noia que vivia a les

    mateixes illes que en Sora.

    Solia jugar amb ell i altres nois.

    El seu parador és una incògnita

    després de la desaparició de les

    Illes del Destí fa temps, però, amb

    l'ajuda d'en Sora, va poder tornar

    a casa.
- id: 11500
  text: Stitch
- id: 11501
  text: >-
    Un visitant estrany d'un planeta

    remot.


    Malgrat la seva mida, té molta

    força i clara tendència a fer

    entremaliadures.


    Sempre que en Sora el necessiti,

    l'Stitch estarà a punt per ajudar-lo.
- id: 11502
  text: Geni
- id: 11503
  text: ''
- id: 11504
  text: Peter Pan
- id: 11505
  text: >-
    Aquest noi volador és del país

    de Mai més, on els infants mai

    no creixen.


    Fa molt de temps, en Peter va ajudar

    en Sora i els seus amics a derrotar

    els sensecor.


    En aquesta nova aventura, en Peter

    i la seva amiga Campaneta l'ajuden

    de nou.
- id: 11506
  text: Chicken Little
- id: 11507
  text: >-
    En Chicken Little és bastant més

    valent que molts nois el doble

    d'alts que ell.


    Mai rebutja un repte, per gros

    que sigui.


    És un fidel amic d'en Sora.

    Sempre que el cridi, vindrà

    a ajudar-lo immediatament.
- id: 11512
  text: Pete
- id: 11513
  text: >-
    Era, sovint, el capità d'un vaixell

    de vapor. En Donald i en Goofy el

    coneixen bé. És tan malvat que el

    rei Mickey el va haver de desterrar

    i enviar a una altra dimensió. La

    Malèfica el va trobar i el va ajudar

    a tornar de l'exili. Des de llavors,

    en Pete ha estat recorrent els mons

    per reunir un exèrcit de sensecor.

    Junts planegen prendre el control

    i regnar sobre tots els mons.
- id: 11514
  text: Malèfica
- id: 11515
  text: >-
    És una bruixa poderosa.

    A l'última aventura, va sotmetre

    els sensecor i va liderar-ne

    un grup per obtenir el poder

    de la foscor.

    Com a part del seu malèvol pla,

    va enganyar en Riku perquè entrés

    al Regne de la Foscor.


    Al final, ella mateixa va sucumbir

    al poder de la foscor i va ser

    derrotada per en Sora i els seus

    amics. Encara que va aconseguir

    tornar gràcies al seu poder pervers.
- id: 11516
  text: Pluto
- id: 11517
  text: >-
    El gos fidel del rei és molt més

    que la seva mascota. Els uneixen

    els vincles més forts que existeixen:

    l'amistat i la lleialtat.

    Quan en Mickey va desaparèixer,

    en Pluto va embarcar-se a la seva

    recerca amb els altres.


    Espero que el seu famós musell

    ajudi a localitzar el rei.
- id: 11518
  text: Grill-parlant
- id: 11519
  text: >-
    És un plaer tenir-te amb nosaltres!

    Em dic Pep el grill.

    La reina Minnie m'ha demanat que

    t'acompanyi com a Cronista Reial en

    aquesta recerca. I sí que n'hem

    tingut, d'aventures!


    Recordareu que jo també soc la

    consciència oficial del meu amic

    Pinotxo i, quan puc, li dono un cop

    de mà. Intento ajudar-lo a seguir el

    camí correcte i distingir el bé del

    mal. De vegades és vailet molt

    entremaliat.
- id: 11520
  text: El rei Mickey
- id: 11521
  text: >-
    El rei del castell Disney.

    Fa molt de temps que se'n va anar

    sol per lluitar contra la foscor

    que amenaçava els mons.


    El rei Mickey i en Riku van

    quedar-se al Regne de la Foscor

    per evitar que els sensecor

    s'escapessin de nou.


    En Donald, en Goofy i en Sora

    marxen de nou, decidits a trobar-lo.
- id: 11522
  text: El rei Mickey
- id: 11523
  text: >-
    Rei del Castell Disney.

    Va ser el primer a adonar-se de

    l'amenaça de la foscor i el primer

    a actuar. El rei Mickey vaga pels

    mons, lluitant contra els sensecor

    i buscant una resposta a l'enigma de

    l'Organització {XIII} i els incorporis.


    Cansat de tantes lluites, ara

    sembla més decidit que mai a

    posar fi a la foscor.
- id: 11526
  text: Sora
- id: 11527
  text: >-
    El jove escollit de la clau espasa,

    la veritable «clau» de tot.


    La Primavera i les seves companyes

    fades, amb la seva màgia, l'han

    equipat amb noves vestimentes.


    Sembla que aquestes robes tenen

    diverses habilitats, com el

    poder de transformar-se.


    Amb nous propòsits, en Sora

    comença una nova aventura.
- id: 11528
  text: Ànec Donald
- id: 11529
  text: >-
    És el Mag de les Corts

    del castell Disney.


    Com en Sora, en Donald havia

    caigut en un son profund, tot i que

    va despertar-se uns instants abans.


    Estan contents de retrobar-se després

    de tant de temps i estan preparats

    per compartir noves aventures.
- id: 11530
  text: Goofy
- id: 11531
  text: >-
    És el Capità dels Cavallers Reials

    del Castell Disney.


    En Goofy va caure en un son

    profund, com en Sora i en Donald.

    No recorda què va passar,

    però després de la migdiada,

    està com nou.


    Qui sap amb quins reptes

    toparan aquests tres amics!
- id: 11532
  text: Roxas
- id: 11533
  text: >-
    Un jove habitant de Vila

    Crepuscle, que, en somnis,

    sent els records d'en Sora.


    Les seves vacances d'estiu ja gairebé han

    acabat i, amb elles, molts dels

    seus plans i sentiments.
- id: 11536
  text: Naminé
- id: 11537
  text: >-
    Una noia amb el poder de

    manipular records.


    Sembla tenir una connexió molt

    forta amb en Sora.
- id: 11538
  text: Hayner
- id: 11539
  text: >-
    Un noi de caràcter conflictiu

    que viu a Vila Crepuscle.

    Fa tot el que li ve al cap...    

    i arrossega d'aquesta manera a

    en Pence i l'Olette.


    Sempre hi ha mala llet entre ell

    i en Seifer, l'autoproclamat

    «disciplinari».
- id: 11540
  text: Pence
- id: 11541
  text: >-
    Un noi de Vila Crepuscle.

    Se sol reunir amb el Hayner

    (el «líder») i l'Olette (la noia

    responsable).


    És un paio tranquil. Quan

    hi ha un problema, li agrada

    reflexionar i afrontar-lo de

    manera realista.


    Li encanta estar amb els seus amics,

    sobretot si és amb gelats de sal marina.
- id: 11542
  text: Olette
- id: 11543
  text: >-
    Una noia jove de Vila Crepuscle.

    Passa la major part del seu temps

    amb el Hayner i el Pence.


    Intenta estar sempre pendent

    de tothom, i no accepta que

    els deures no estiguin fets.


    Li agrada sortir a comprar al Carrer

    del Mercat i veure el sol sortint a

    l'alba mentre xerra amb els seus amics.
- id: 11544
  text: Seifer
- id: 11545
  text: >-
    L'autoproclamat president de la

    «Comissió Disciplinària de Vila

    Crepuscle».


    Fa tot el possible per mantenir

    el decòrum a la ciutat, però no

    tothom veu de grat les seves maneres

    de fer; entre d'altres, la colla

    d'en Hayner, per exemple.


    Els seus companys, la Vent i en Tro

    sempre van amb ell.
- id: 11546
  text: Tro
- id: 11547
  text: >-
    Un dels companys d'en Seifer, home!


    Sempre es deixa portar i, en

    veritat, la Vent li dona mil

    voltes.
- id: 11548
  text: Vent
- id: 11549
  text: >-
    Una amiga d'en Seifer. Mai parla més

    del necessari, cosa que, de vegades,

    la fa dir només paraules soles.


    La Vent s'ha guanyat la confiança

    d'en Seifer i viu únicament per

    complaure'l en tot el que pot.
- id: 11550
  text: Setzer
- id: 11551
  text: >-
    Un tafur errant, sempre preparat

    per a un joc o un repte.

    Dedica la seva vida completament

    a l'atzar i deixa que la sort

    el guiï.


    Setzer va guanyar la lluita de l'any

    passat. Sol està envoltat

    d'un seguici de noies estridents.
- id: 11552
  text: Vivi
- id: 11553
  text: >-
    Un jove de Vila Crepuscle.

    És de poc caràcter i això li fa, en

    certa manera, acceptar tot el que

    diu en Seifer, la qual cosa sempre

    li acaba passant factura.


    Malgrat tot, a en Seifer li agrada

    i admira la seva força.
- id: 11554
  text: Yen Sid
- id: 11555
  text: >-
    Un bruixot amb uns poders

    inigualables. Va ser ell qui

    va ensenyar màgia al rei.


    Capaç d'omplir el cel de belles

    papallones o separar les aigües del

    mar, els encanteris d'en Yen Sid

    són senzillament increïbles. Només

    el seu nom fa tremolar a molts.


    En Yen Sid va compartir la seva

    saviesa amb en Sora i els seus amics,

    i els va mostrar algunes tècniques

    molt valuoses per afrontar els perills

    d'aquesta nova aventura.
- id: 11556
  text: Flora
- id: 11557
  text: >-
    La Flora és una fada plena de

    bondat que sempre vesteix de vermell.

    Com a líder del grup, la Fauna

    i la Primavera hi confien a

    l'hora de prendre decisions.


    La Flora va dotar en Sora

    de roba amb poders màgics per 

    ajudar-lo a preparar el viatge.
- id: 11558
  text: Fauna
- id: 11559
  text: >-
    La Fauna sempre vesteix de verd.

    És una fada generosa i només

    utilitza la seva màgia per

    ajudar els altres.


    Va col・laborar en la confecció

    de les robes màgiques d'en Sora.
- id: 11560
  text: Primavera
- id: 11561
  text: >-
    Sempre vestida de blau, la

    Primavera és una fada amable,

    encara que una mica obstinada.

    Juntament amb la Fauna i la

    Flora, fa tot el possible perquè

    la Malèfica no faci mal a ningú.


    La Primavera va vestir en Sora

    amb roba màgica per ajudar-lo

    a preparar el seu viatge.
- id: 11562
  text: Sora
- id: 11563
  text: >-
    L'escollit per la clau espasa.

    Està buscant el seu amic Riku,

    per poder tornar amb ell a

    l'illa d'on venen.


    No fa gaire, en Sora va lluitar

    durament contra la Malèfica, perquè

    els seus sensecor havien envaït els

    passadissos del castell.
- id: 11564
  text: Ànec Donald
- id: 11565
  text: >-
    És el Mag de la Cort de Disney.

    Juntament amb en Sora i en Goofy,

    viatja pels mons a la recerca del

    rei Mickey, que és a algun lloc

    lluitant contra les forces de la
    
    foscor.


    Fa temps, Donald va participar

    en una gran batalla que es va

    lliurar aquí contra la Malèfica,

    perquè els seus sensecor van

    envair els passadissos del castell.
- id: 11566
  text: Goofy
- id: 11567
  text: >-
    Capità dels Cavallers Reials del

    Castell de Disney.

    Recorre els mons amb en Sora i

    en Donald a la recerca del rei

    Mickey, que és a algun lloc

    lluitant contra les forces de

    la foscor.


    Fa temps, en Goofy va lliurar

    una gran batalla contra la Malèfica

    i els sensecor que ocupaven

    els passadissos del castell.
- id: 11568
  text: L'Oncle Garrepa
- id: 11569
  text: >-
    És l'oncle d'en Donald. Abans

    que apareguessin els sensecor,

    va vagar pels mons en una nau

    gumi per construir un gran

    imperi comercial.

    L'Oncle Garrepa té més diners

    del que molts podrien imaginar,

    però és bastant garrepa per

    afluixar la bossa.


    Ara, s'ha ficat en un negoci

    de gelats on espera guanyar

    milions.
- id: 11570
  text: Joanet
- id: 11571
  text: >-
    En Joanet és un dels tres nebots

    d'en Donald, i és el líder de la

    colla. Ell porta a terme els plans

    d'en Jaumet i cuida d'en Jordinet

    perquè no es quedi enrere ajudant

    l'Oncle Garrepa amb el seu negoci

    de gelats. Es distingeix pel seu

    barret vermell.


    L'última vegada que el vam veure,

    estava treballant a Ciutat de Pas

    i estalviava per a una expedició.
- id: 11572
  text: Jaumet
- id: 11573 
  text: >-
    És un dels tres nebots d'en

    Donald i està ajudant l'Oncle

    Garrepa amb el negoci de gelats.

    En Jaumet sempre porta un barret

    blau. És intel・ligent, alegre i sovint

    se li ocorren idees divertides.


    L'última vegada que vam veure'l,

    estava treballant a Ciutat de Pas

    i estalviava per anar a una expedició.
- id: 11574
  text: Jordinet
- id: 11575
  text: >-
    És un dels tres nebots d'en Donald

    i està ajudant l'Oncle Garrepa

    amb el seu negoci de gelats.

    En Jordinet és amable i despreocupat,

    encara que para atenció a coses que

    els altres passen per alt. El podeu

    reconèixer pel seu barret verd.


    L'última vegada que el vam veure,

    estava treballant a Ciutat del Pas

    i estalviava per a una expedició.
- id: 11576
  text: Merlí
- id: 11577
  text: >-
    Un poderós mag que actualment viu

    a Baluard Balmat. La seva casa

    és el lloc de reunió del Comitè de

    Restauració de la ciutat.


    En Merlí té poders màgics i una

    saviesa incomparable. Va ser ell

    qui va ensenyar a en Donald tot

    el que sap sobre màgia. Posseeix

    una misteriosa bossa que pot

    contenir-hi qualsevol cosa,

    independentment de la seva mida.
- id: 11578
  text: Léon
- id: 11579
  text: >
    Destre espadatxí que porta una

    pistola espasa. El seu nom real és

    Squall Leonhart. Per deixar enrere

    el seu passat, va adoptar el nom de

    Léon; un home indefens la llar del

    qual va ser envaïda pels sensecor.


    Durant un temps es va refugiar aquí

    i allà, però, i en part gràcies a en

    Sora, en Léon va acceptar Baluard

    Balmat com a casa seva. Ara treballa

    incansablement en la seva reconstrucció.
- id: 11580
  text: Cid
- id: 11581
  text: >-
    És un enginyer i un geni de la

    tecnologia, així com un pilot d'elit.

    Va conèixer en Sora quan tenia una

    botiga en un lloc lluny de casa.


    Ara que ha tornat a casa, en

    Cid s'ha convertit en un membre

    actiu del Comitè de Restauració.
- id: 11582
  text: Cloud
- id: 11583
  text: >-
    Un «Soldat» que maneja una espasa

    descomunal sense despentinar-se

    pas. Va lluitar contra en Sora,

    a demanda de l'Hades.


    En Cloud no permet que ningú

    endevini el que li passa pel cap, així

    que la seva vida és tot un enigma.


    Cerca en Sephiroth, ja que és la

    clau per acabar amb la seva foscor

    interior d'una vegada per totes.
- id: 11584
  text: Aerith
- id: 11585
  text: >-
    Una jove els ulls tranquils de la

    qual amaguen una voluntat de ferro.

    Com en Léon, va conèixer en Sora

    quan vivia lluny de casa. Ella ja

    el va ajudar llavors, i ho torna

    a fer ara en el seu nou viatge.


    L'Aerith ara treballa al costat

    d'en Léon i la Yuffie per restaurar

    la ciutat a la seva antiga glòria.
- id: 11586
  text: Tifa
- id: 11587
  text: >-
    Aquesta jove cerca algú

    amb afany.


    Decidida i implacable, la Tifa

    ja ha remogut cel i terra.


    El seu viatge no acabarà fins

    que trobi aquella persona.
- id: 11588
  text: Yuffie
- id: 11589
  text: >-
    Aquesta noia enèrgica és membre

    del Comitè de Restauració de

    Baluard Balmat i col・labora

    en la defensa de la ciutat.


    La Yuffie va conèixer en Sora quan

    vivia lluny de la seva terra natal.

    L'última vegada, gràcies a la seva

    ajuda, els sensecor van ser derrotats

    i ella va poder tornar a casa. Des

    d'aleshores li ha estat molt agraïda.
- id: 11590
  text: Sephiroth
- id: 11591
  text: >-
    Un espadatxí incomparable,

    temps ha, venerat com un heroi.


    Durant una època, se'n desconeixia

    el parador, i ningú sap amb

    certesa per què ha tornat.


    Sembla tenir alguna connexió

    amb el passat d'en Cloud.
- id: 11592
  text: Yuna
- id: 11593
  text: >-
    Membre d'un trio únic de noies

    joves inseparables.


    Buscaven en Léon,

    però... per a què?
- id: 11594
  text: Rikku
- id: 11595
  text: >-
    Membre d'un trio únic de noies

    joves amables.


    Sembla que les tres han

    estat contractades per dur a

    terme una missió... Què deu ser?
- id: 11596
  text: Paine
- id: 11597
  text: >-
    Membre d'un trio únic de noies

    joves inseparables.


    Diuen que venen en to de pau...

    però què els porta realment per aquí?
- id: 11598
  text: Sora
- id: 11599
  text: >-
    L'escollit de la clau espasa

    lluita implacablement contra els

    sensecor i els incorporis.

    El seu viatge a la recerca d'en Riku,

    el seu amic perdut, continua.


    Durant el seu últim viatge, en Sora

    i la Bèstia van lluitar junts per

    alliberar la Bella.
- id: 11600
  text: Ànec Donald
- id: 11601
  text: >-
    És el Mag de les Corts.


    Va deixar el castell de Disney

    amb la nau gumi per buscar el rei

    Mickey.


    En Donald i la Bèstia són vells

    coneguts. L'últim cop que es van

    trobar, van lluitar junts per

    alliberar la Bella dels seus captors.
- id: 11602
  text: Goofy
- id: 11603
  text: >-
    Capità dels Cavallers

    Reials de Disney.


    En Goofy va deixar el castell amb la

    nau gumi per buscar el rei

    Mickey.


    En Goofy i la Bèstia ja es coneixen.

    L'última vegada que es van veure,

    van lluitar junts per rescatar la

    Bella dels seus captors.
- id: 11604
  text: Bèstia
- id: 11605
  text: >-
    Una horrible bèstia amb dents i urpes

    afilades. La seva possessió més preada

    és una misteriosa rosa, conservada

    en una campana de vidre.


    Una vegada, en Sora i els seus amics

    el van ajudar a rescatar la Bella

    de les urpes de la Malèfica.
- id: 11606
  text: Bèstia
- id: 11607
  text: >-
    Era un príncep insensible i, per

    castigar-lo per l'egoisme del seu

    cor, una bruixa el va convertir

    en una bèstia.


    Estava tan avergonyit de la seva

    horrible aparença que va aïllar-se

    al seu castell.

    Conèixer la Bella va suavitzar el

    seu cor i li va donar esperança.
- id: 11608
  text: Bèstia
- id: 11609
  text: >-
    Un príncep malcriat i egoista.

    Com a càstig pel seu cor fred,

    una bruixa el va convertir en

    una bèstia.


    L'encanteri només es trencarà si

    aprèn a estimar i aconsegueix que

    algú l'estimi abans que caigui

    l'últim pètal de la rosa encantada.


    Quan va conèixer la Bella, per primer

    cop a la seva vida va sentir que

    alguna cosa havia canviat dins seu.
- id: 11610
  text: Bella
- id: 11611
  text: >-
    Aquesta jove fou presonera al

    castell de la Bèstia. Al principi

    ella el temia, però a poc a poc, va

    comprendre que rere la seva aparença

    feroç s'amagava un cor ferit.


    La Bella és una de les Set

    Princeses necessàries per obrir

    l'última porta al Regne de la

    Foscor. Quan fou segrestada pels

    sensecor, el Sora i la Bèstia la

    van rescatar i ella els està

    enormement agraïda.
- id: 11612
  text: Bella
- id: 11613
  text: >-
    La Bella va aconseguir veure més

    enllà de l'aparença ferotge de la

    Bèstia i el va ajudar a compartir

    els sentiments del seu cor, que

    havia amagat durant tant de temps.


    A la Bella li encanten els llibres

    que relaten aventures emocionants

    en indrets remots.
- id: 11614
  text: Din Don
- id: 11615
  text: >-
    El majordom de la Bèstia. Quan la

    fetillera va encantar tothom al

    castell, el va convertir en un

    rellotge.
    
    Serà perquè el Din Don és tan

    picallós pel que fa a l'ordre

    i la puntualitat?
- id: 11616
  text: Lumiere
- id: 11617
  text: >-
    És el maître del castell. Quan la

    fetillera va encantar tothom, a ell

    el va convertir en un canelobre.

    En Lumiere és eloqüent i

    resulta encantador.
- id: 11618
  text: Sra. Potts
- id: 11619
  text: >-
    És la majordoma de la Bèstia i

    la mare del Xip. La fetillera

    la va convertir en una tetera.

    La Sra. Potts sempre està

    disposada a reconfortar el teu

    cor amb una fumejant tassa de te.
- id: 11620
  text: Xip
- id: 11621
  text: >-
    El fillet de la senyora Potts.

    Per obra de la fetillera, el Xip

    es va convertir en una tassa de te.


    Li faltava una dent i per això

    la tassa té un petit escantell.
- id: 11622
  text: Armari
- id: 11623
  text: >-
    És la donzella del castell. La

    fetillera la va convertir en un

    armari.
- id: 11624
  text: Xaldin
- id: 11625
  text: >-
    El núm. {III} de l'Organització {XIII}.

    Els seus estratagemes han corromput

    el cor de la Bèstia.


    Els motius de l'Organització

    continuen sent una incògnita.

    Què pretendran realment?
- id: 11626
  text: Sora
- id: 11627
  text: >-
    L'heroi escollit per la clau

    espasa continua el seu viatge

    a la recerca del Riku.


    No fa gaire, ell i l'Hèrcules

    van posar fi als plans de l'Hades

    per dominar el món. En Fil l'ha

    anomenat «Aprenent d'Heroi».
- id: 11628
  text: Ànec Donald
- id: 11629
  text: >-
    És el Mag de la Cort.

    En una carta, el rei els va dir al

    Goofy i ell que havien de «seguir

    l'escollit de la clau espasa».

    De llavors ençà, recorren els

    mons juntament amb en Sora.


    En el passat, van ajudar l'Hèrcules

    a evitar que l'Hades controlés el

    món. El Fil l'ha anomenat

    «Aprenent d'Heroi».
- id: 11630
  text: Goofy
- id: 11631
  text: >-
    Capità dels Cavallers Reials.

    En una carta, el Rei els va dir al

    Donald i a ell que havien de «seguir

    l'escollit de la clau espasa».

    De llavors ençà, recorren els

    mons juntament amb el Sora.


    En el passat, van ajudar l'Hèrcules

    a evitar que l'Hades controlés el

    món. El Fil l'ha anomenat

    «Aprenent d'Heroi».
- id: 11632
  text: Hèrcules
- id: 11633
  text: >-
    És un heroi llegendari amb una

    força espectacular. A més, és un

    gran amic. Hèrcules és el fill del

    déu Zeus i una mortal, però

    ell no és un déu. En el passat,

    uní forces amb Sora i els

    seus amics per evitar que

    l'Hades s'apoderés del món.


    Quan lluita al Coliseu,

    una multitud omple les grades

    i ell mai els decep. Mai ha

    perdut un combat.
- id: 11634
  text: Hèrcules
- id: 11635
  text: >-
    Un heroi llegendari amb

    una força incomparable. En el moment que l'Hidra

    va destruir el Coliseu, l'Hèrcules

    va sentir que havia

    decebut a tothom, i ara dubta de

    si mateix i de les seves qualitats

    com a heroi. El seu esperit de lluita

    està una mica tocat.
- id: 11636
  text: Filoctetes
- id: 11637
  text: >-
    Fil, per als amics. És un veterà

    entrenador d'herois i el mentor

    de l'Hèrcules. També ha entrenat

    en Sora i els seus amics durant

    les primeres aventures amb el

    gran heroi.


    El Fil ha estat molt ocupat últimament.

    Està a càrrec del Coliseu i avalua

    els concursants dels tornejos.
- id: 11638
  text: Mègara
- id: 11639
  text: >-
    Meg, per als amics. És forta,

    enginyosa i una veritable amiga

    de l'Hèrcules. Des que el va conèixer,

    la Meg és més oberta i ha après

    a confiar en els altres.


    La Meg es dirigia a l'Inframon sola.

    Sabia que l'Hèrcules estava

    esgotat i volia que l'Hades

    el deixés descansar dels

    combats del Coliseu.
- id: 11640
  text: Pegàs
- id: 11641
  text: >-
    Un cavall preciós, capaç de volar

    com una àguila. El Pegàs és el

    fidel company de l'Hèrcules.

    El Zeus va crear el Pegàs a partir

    d'un núvol i el va obsequiar a

    l'Hèrcules quan encara era un nadó.


    Van estar separats durant uns anys,

    però, en fer-se grans, es retrobaren.
- id: 11642
  text: Auron
- id: 11643
  text: >-
    Un guerrer que l'Hades va

    fet portar des de l'Inframon.


    A canvi de la seva llibertat, l'Auron

    va rebre l'ordre de derrotar

    l'Hèrcules, però s'hi va negar.

    Les seves enigmàtiques paraules foren:

    «Aquesta és la meva història».


    No li agrada parlar de si mateix.

    El seu passat és un gran misteri.
- id: 11644
  text: Dolor
- id: 11645
  text: >-
    És un dels lacais de l'Hades.

    En Dolor va intentar atacar l'Hèrcules

    quan era només un nadó, però l'heroi

    es va defensar estomacant-lo de valent.


    El Dolor pot canviar de forma

    a voluntat, però és una mica

    eixelebrat. Mai s'allunya del

    seu malvat company Pànic.
- id: 11646
  text: Pànic
- id: 11647
  text: >-
    És un dels lacais de l'Hades.

    En Pànic va intentar atacar l'Hèrcules

    quan era només un nadó, però l'heroi

    es va defensar estomacant-lo de valent.


    En Pànic pot canviar de forma

    a voluntat, però és una mica

    eixelebrat. Mai s'allunya del

    seu malvat company Dolor.
- id: 11648
  text: Hades
- id: 11649
  text: >-
    És el Senyor de l'Inframon.


    L'última vegada que el Sora i els

    seus amics es van creuar amb ell, va

    intentar dominar el món utilitzant

    els sensecor, però els tres amics i

    l'Hèrcules van posar fi als seus plans.

    No obstant això, l'Hades sempre serà

    malvat i no descansarà fins que

    enviï l'Hèrcules a l'Inframon

    per tota l'eternitat.
- id: 11650
  text: Cèrber
- id: 11651
  text: >-
    És el guardià de l'entrada a

    l'Inframon i la lleial mascota

    de l'Hades.


    L'última vegada, l'Hèrcules,

    el Sora, el Donald i el Goofy

    s'uniren i el derrotaren, però

    l'Hades el va fer tornar i ara

    el ca té set de venjança.
- id: 11652
  text: L'Hidra
- id: 11653
  text: >-
    Un monstre llegendari

    amb diversos caps, que

    l'Hades va enviar a

    lluitar contra l'Hèrcules. Si li tallen

    un cap,

    en creixen dos més al seu lloc.
- id: 11656
  text: Dèmyx
- id: 11657
  text: >-
    El núm. {IX} de l'Organització {XIII}.


    Mentre rondava pel món de l'Hèrcules,

    va robar la Pedra de l'Olimp.

    Lluita de manera lamentable.


    Quan el Demyx va interpel・lar el

    Sora, el va anomenar «Roxas».
- id: 11658
  text: Sora
- id: 11659
  text: >-
    L'escollit de la clau espasa lluita

    implacablement contra els sensecor

    i els incorporis.

    Continua el seu viatge a la recerca

    d'en Riku, el seu amic perdut.


    En el darrer viatge, en Sora va ajudar a

    impedir que en Yafar controlés Agrabah

    i el va tancar en una llàntia màgica.
- id: 11660
  text: Ànec Donald
- id: 11661
  text: >-
    El Mag de la Cort. A la recerca

    del rei, viatja pels mons

    amb el Sora i el Goofy.


    La darrera vegada que va visitar Agrabah,

    el Donald va lluitar fent costat a

    l'Aladí per defensar la ciutat del

    temible Jafar.
- id: 11662
  text: Goofy
- id: 11663
  text: >-
    Juntament amb el Sora i el Donald, el capità

    dels Cavallers Reials recorre

    els mons a la recerca del rei.


    La darrera vegada que va visitar Agrabah, el

    Goofy va lluitar fent costat

    a l'Aladdin per defensar la ciutat del

    temible Jafar.
- id: 11664
  text: Aladdin
- id: 11665
  text: >-
    Aquest jove provè del desert als

    afores d'Agrabah. En el

    passat, en Sora i els seus amics el

    van ajudar a derrotar en Jafar i alliberar el Geni

    de la llàntia.


    L'Aladdin pensava que algú

    de condició humil, com ell, no

    podia guanyar-se l'amor d'una

    princesa, però la Jasmin li va ensenyar

    que el que realment importa

    és el cor de les persones.


    Sempre va acompanyat del seu

    amic, el mico Abu.
- id: 11666
  text: La catifa màgica
- id: 11667
  text: >-
    És una catifa voladora.


    La catifa és una vella amiga del

    Geni. L'Aladdin la va trobar a la

    Cova de les Meravelles i des de

    llavors ella sempre

    està disposada a ajudar-lo.

    Et pot transportar a través del

    vast desert en un obrir i

    tancar d'ulls.
- id: 11668
  text: Iago
- id: 11669
  text: >-
    Aquest lloro astut i bulliciós fa d'ulls i oïda

    del Jafar,

    explicant-li tot el que passa

    a Agrabah.


    A causa de les seves malifetes, el Iago

    va acabar tancat a la llàntia

    juntament amb el seu amo. Ara que torna a ser lliure,

    jura que ha canviat

    i que és un “nou lloro”.

    Tot i que no hi confiaria gaire...
- id: 11670
  text: Abu
- id: 11671
  text: >-
    L'Abu, el company fidel i pelut de l'

    Aladdin, no parla gaire, però

    sempre sap què

    necessita el seu amic.


    Malauradament, l'Abu no pot

    resistir-se en veure un tresor,

    i no li importa qui sigui el propietari.
- id: 11672
  text: Princesa Jasmin
- id: 11673
  text: >-
    Ella és la princesa d'Agrabah i una

    de les Set Princeses

    necessàries per obrir la porta al

    Regne de la Foscor.


    La Jasmin va conèixer l'Aladdin quan

    va fugir del palau a la recerca d'

    aventures. Està immensament agraïda

    a l'Aladdin, el Sora i

    els seus amics, ja que van salvar

    la ciutat dels terribles plans

    del Jafar.
- id: 11674
  text: Geni
- id: 11675
  text: >-
    Va passar deu mil anys

    tancat a la llàntia

    màgica fins que l'Aladdin

    el va trobar. Després de

    derrotar en Jafar, l'Aladdin

    va utilitzar el seu tercer desig

    per alliberar el Geni.


    La llibertat és el seu

    somni fet realitat. Ja no està a

    disposició d'un amo i

    gaudeix d'una vida

    sense preocupacions.
- id: 11676
  text: Jafar
- id: 11677
  text: >-
    Abans de convertir-se en un geni

    del mal, el Jafar era el visir reial del

    Sultà.


    L'altra vegada que vam ser a

    Agrabah, va utilitzar els sensecor

    per apoderar-se de la ciutat.

    Va aconseguir controlar el Geni i va demanar

    convertir-se

    ell mateix en un poderós geni. L'Aladdin, el Sora i

    els seus amics es van unir per

    derrotar-lo i el van tancar

    en la seva pròpia llàntia.
- id: 11678
  text: Jafar
- id: 11679
  text: >-
    Quan va aconseguir tenir la llàntia,

    en Jafar va utilitzar el seu últim desig

    per convertir-se en un geni

    molt poderós. Més tard va

    acabar tancat a la llàntia, però

    al final va aconseguir escapar gràcies

    al mercader.


    Després va utilitzar els seus poders màgics

    per convertir-se en un colós,

    i va intentar controlar Agrabah, però

    el Sora i els seus amics el

    van derrotar de nou.
- id: 11680
  text: El mercader
- id: 11681
  text: >-
    És propietari d'una botiga on

    ofereix tota classe de mercaderies.

    És un tipus molt sospitós.
- id: 11682
  text: Sora
- id: 11683
  text: >-
    L'escollit de la clau espasa lluita

    implacablement contra els sensecor

    i els incorporis.


    En Sora continua investigant què

    va passar amb en Riku després de

    separar-se, ja fa bastant de temps.
- id: 11684
  text: Ànec Donald
- id: 11685
  text: >-
    El Mag de la Cort va sortir del

    castell i va emprendre la recerca

    del rei, que havia desaparegut.


    Juntament amb en Sora, recorre els

    mons a la recerca de pistes de la

    ubicació del rei Mickey.
- id: 11686
  text: Goofy
- id: 11687
  text: >-
    El capità dels Cavallers Reials va

    sortir del castell per emprendre

    la recerca del rei.


    La lleialtat del Goofy cap al rei

    Mickey és incomparable, i sempre

    està disposat a ajudar el seu amic

    Sora quan les coses es compliquen.
- id: 11690
  text: Ping
- id: 11691
  text: >-
    Filla única de la distingida família

    Fa. El seu nom real és Fa Mulan.


    Es va disfressar d'home i es va

    unir a l'Exèrcit Imperial en lloc

    del seu pare per lluitar contra

    els huns i mantenir l'honor de la

    família. Els altres soldats la

    coneixen com a Ping.
- id: 11692
  text: Mulan
- id: 11693
  text: >-
    Filla única de la distingida

    família Fa, la Mulan no està bé,

    ja que sempre ha de fer el que

    els altres esperen d'ella i

    se sent estranya.

    En rebre l'ordre que obligava el seu

    vell pare a tornar a l'exèrcit, ella va 

    aconseguir escapolir-se'n i va arriscar

    la seva vida per ocupar el seu lloc.
- id: 11694
  text: Capità Li Shang
- id: 11695
  text: >-
    És un jove i brillant oficial. El

    seu pare és un distingit general

    de l'Exèrcit Imperial.


    El Capità Shang ha d'entrenar

    un grup desigual de reclutes

    que han estat cridats per

    lluitar contra els huns. És

    molt disciplinat i exigeix

    un treball dur a les seves

    tropes inexpertes.
- id: 11696
  text: Yao
- id: 11697
  text: >-
    És un dels reclutes allistats

    per defensar la Xina de la

    invasió dels huns.


    El Yao és un tipus baixet que

    sol presumir de ser més

    fort que ningú.
- id: 11698
  text: Chien Po
- id: 11699
  text: >-
    És un dels reclutes allistats

    per defensar la Xina de la

    invasió dels huns.


    A en Chien Po li encanta el bon

    menjar i probablement somia més

    amb viandes que amb rebre honors

    o anar d'aventura.
- id: 11700
  text: Ling
- id: 11701
  text: >-
    És un dels reclute sallistats

    per defensar la Xina de la

    invasió dels huns.


    El que més li agrada és

    xerrar i fer bromes.
- id: 11702
  text: L'Emperador
- id: 11703
  text: >-
    Diuen que la saviesa de l'emperador

    de la Xina és tan vasta com l'oceà,

    i la seva determinació tan ferma

    com una muntanya.


    Està profundament agraït

    a Mulan i al capità Shang per

    salvar la Xina dels huns.
- id: 11704
  text: Mushu
- id: 11705
  text: >-
    Era un dels guardians de de la

    família Fa, encara que els seus

    errors el van relegar a la humil

    tasca de fer sonar un gong. Ara

    està ansiós per ajudar Mulan, per

    demostrar el seu valor i recuperar

    el seu lloc entre els guardians.


    Durant l'última aventura, en Mushu

    va donar a en Sora i els seus amics

    cop de mà molt important.
- id: 11706
  text: Shan Yu
- id: 11707
  text: >-
    És el cap dels huns i vol

    conquerir tota la Xina.


    Shan Yu i el seu enorme exèrcit

    són enemics temibles i

    han derrotat algunes de les

    millors tropes de l'Emperador.

    Ara, Shan Yu planeja envair

    l'Imperi amb l'ajuda dels

    sensecor.


    La seva mirada és aterridora i

    sempre porta un falcó

    que li fa d'ulls i oïda.
- id: 11710
  text: Xigbar
- id: 11711
  text: >-
    El núm. {II} de l'Organització {XIII}.

    Quan en Sora el va cridar, pensant

    que era en Riku, en Xigbar va respondre

    fredament.


    Ignorem les seves motivacions i

    mètodes, tot i que sens dubte

    té un objectiu molt clar

    al cap. Què serà?
- id: 11712
  text: Sora
- id: 11713
  text: >-
    El portador de la clau espasa.


    No fa gaire, va recollir les

    pàgines trencades d'un llibre de

    contes i es va fer amic de tots

    els personatges que hi vivien.
- id: 11714
  text: Winnie the Pooh
- id: 11715
  text: >-
    En Pooh, per als amics. És un

    os simpàtic que viu al Bosc

    dels Cent Acres.

    Li encanta menjar i venera

    la mel.


    A en Pooh li agrada fer exercici

    cada matí, perquè diu que

    li desperta la fam.
- id: 11718
  text: Tigger
- id: 11719
  text: >-
    En Tigger està ple d'energia. Li

    agrada fer servir la cua per

    saltar per tot el Bosc dels

    Cent Acres. De vegades fa bombo,

    tanmateix, no fa mal a ningú.

    No obstant això, darrere d'aquesta aparença de

    feliç indiferència, hi ha un

    cor sensible i generós.
- id: 11720
  text: Piglet
- id: 11721
  text: >-
    És un dels bons amics de Pooh

    al Bosc dels Cent Acres. 


    En Piglet és petit i té por

    de tot, però

    estar envoltat d'amics com en

    Pooh, el fa sentir sempre

    protegit.
- id: 11722
  text: Igor
- id: 11723
  text: >-
    L'Igor és una mica pessimista.

    Viu en una casa feta de pals.

    La seva cua està enganxada amb una

    xinxeta, encara que sempre

    li cau i la perd.


    L'Igor passa molt de temps caminant

    pel Bosc dels Cent Acres

    a la recerca d'una nova llar, perquè

    la seva casa de troncs s'enfonsa.
- id: 11724
  text: Mussol
- id: 11725
  text: >-
    És l'habitant més savi del

    Bosc dels Cent Acres.

    Quan algú té una pregunta

    que no pot respondre,

    li pregunta al Mussol. Sempre està disposat a

    ajudar, tot i que les seves respostes

    no sempre són les correctes!
- id: 11726
  text: Cangu
- id: 11727
  text: >-
    És la mare del Ret. Quan surt

    de casa, col・loca el petit

    Ret a la bossa i se'n va.


    La Cangu sempre té bons

    consells per oferir als seus

    veïns del bosc.
- id: 11728
  text: Ret
- id: 11729
  text: >-
    És l'habitant més jove del

    Bosc dels Cent Acres. El Ret

    admira el Tigger i somia amb

    fer bots com ell.
- id: 11730
  text: Talp
- id: 11731
  text: >-
    És expert en excavacions o,

    més aviat, s'especialitza a excavar

    túnels. Si vols trobar-lo,

    busca un turó

    de terra fresca.
- id: 11732
  text: Sora
- id: 11733
  text: >-
    Amb el poder de la clau espasa,

    aquest jove fa camí cercant el

    seu amic Riku i una manera de

    tornar a casa.


    En aquest món, en Sora ha adoptat

    una forma felina, però sembla que

    té dos peus esquerre... o quatre

    potes esquerres? Bé, tant se val.
- id: 11734
  text: Ànec Donald
- id: 11735
  text: >-
    El Mag de la Cort recorre els

    mons a la recerca del rei,

    acompanyat d'en Sora i en Goofy.


    En aquest món, en Donald té ales

    i, com era d'esperar, ha après

    a utilitzar-les de seguida.
- id: 11736
  text: Goofy
- id: 11737
  text: >-
    El Capità dels Cavallers Reials

    recorre els mons amb en Sora i

    en Donald, a la recerca del rei.


    En aquest món, el Goofy s'ha

    transformat en una tortuga, i

    el seu nou aspecte li queda molt bé.
- id: 11738
  text: Pete
- id: 11739
  text: >-
    En Pete pretén dominar tots els

    mons amb un exèrcit de sensecor.


    És aquí per ajudar el fantasma de

    l'Scar. Però... qui tot ho vol,

    tot ho perd...
- id: 11740
  text: Simba
- id: 11741
  text: >-
    El fill del gran Mufasa ha crescut

    i s'ha convertit en el successor

    del seu pare com a Rei de les

    Terres del Regne.


    Quan era un cadell, el Simba va

    pensar que era el responsable de

    la mort del seu pare. Va abandonar

    les Terres del Regne i va conèixer

    dos nous amics: en Timon i en Pumba.

    Ells li van ensenyar a viure una

    vida sense preocupacions.


    Durant la seva primera aventura,

    quan en Sora, en Donald i en Goofy

    el necessitaven, en Simba venia

    immediatament.
- id: 11744
  text: Timon
- id: 11745
  text: >-
    Aquest suricata és un amic íntim

    d'en Simba. Quan era un cadell,

    el Timón el va trobar gairebé mort

    de set. Ell i el seu amic Pumba li

    van ensenyar al Simba el seu lema

    «Hakuna Matata», que vol dir

    «sense preocupacions».


    I així va créixer el Simba,

    sense complicar-se la vida

    pensant només en el dia a dia.
- id: 11746
  text: Pumba
- id: 11747
  text: >-
    Aquest facoquer és un gran amic d'en

    Simba. En Pumba el va trobar gairebé

    mort de set, quan el rei era només

    un cadell que fugia del seu passat.

    En Timon, el seu millor amic, i ell,

    li van ensenyar el lema «Hakuna Matata»,

    que vol dir «sense preocupacions».


    Alguns s'ofenen per l'olor corporal

    del Pumba, però mai trobaràs ningú

    més amable que ell.
- id: 11748
  text: Nala
- id: 11749
  text: >-
    L'amiga de la infància d'en Simba

    s'ha convertit en una forta lleona.

    La Nala busca ajuda per salvar les

    Terres del Regne del terrible estat

    en què es troben.
- id: 11752
  text: Mufasa
- id: 11753
  text: >-
    Un gran sobirà de les Terres

    del Regne, estimat per tots els

    animals que les habitaven. La seva

    herència, la saviesa de generacions

    de reis, ha passat al seu fill Simba.


    Després de salvar en Simba d'una

    estampida, en Mufasa va intentar

    enfilar-se a un lloc segur, però l'Scar

    el va fer caure provocant la seva mort.
- id: 11756
  text: Rafiki
- id: 11757
  text: >-
    Un vell mandril de les Terres del

    Regne. El Rafiki és un savi xaman.


    Era el conseller de confiança del

    Mufasa i sempre ha desitjat veure

    el dia en què el Simba ocuparà el

    lloc del seu pare com a rei.
- id: 11758
  text: Scar
- id: 11759
  text: >-
    És l'oncle malvat del Simba i

    germà del Mufasa.


    Després de la mort del Mufasa i la

    desaparició del Simba, l'Scar es va

    convertir en rei i va utilitzar les

    hienes per fer la feina bruta.

    L'Scar no ha cuidat bé les Terres

    del Regne i gairebé tots els animals

    es van veure obligats a migrar.
- id: 11762
  text: Shenzhi
- id: 11763
  text: >-
    Una hiena covarda que odia

    els lleons. La Shenzi és la cap

    mentre ella i les seves amigues

    fan de les seves. Sempre està

    disposada a seguir el més fort.
- id: 11764
  text: Banzai
- id: 11765
  text: >-
    Una hiena covarda que odia els

    lleons. En Banzai és molt queixós

    i no li agrada treballar. Sempre

    busca preses fàcils.
- id: 11766
  text: Ed
- id: 11767
  text: >-
    Una hiena estúpida, bastant simple,

    a qui li encanta riure. La Shenzi i

    en Banzai sempre li prenen el pèl,

    però a l'Ed sembla que tant li fa.
- id: 11768
  text: Sora
- id: 11769
  text: >-
    L'heroi de la clau espasa. En Sora

    continua buscant el Riku, de

    qui va haver de separar-se fa

    temps en una gran batalla.


    En un dels seus viatges anteriors, quan

    l'Úrsula va intentar apoderar-se del

    trident, el Sora va defensar l'Atlàntica.
- id: 11770
  text: Ànec Donald
- id: 11771
  text: >-
    El Mag de la Cort recorre els mons

    a la recerca de pistes sobre la

    ubicació del rei Mickey.


    En els seus viatges anteriors, el

    Donald i la colla van ajudar a defensar

    Atlàntica de l'Úrsula, la Bruixa del Mar.
- id: 11772
  text: Goofy
- id: 11773
  text: >-
    El Capità dels Cavallers Reials

    recorre els mons a la recerca de

    pistes sobre la ubicació del rei Mickey.

    En els seus viatges anteriors, el Goofy

    i els seus amics van ajudar a defensar

    Atlàntica de l'Úrsula,

    la Bruixa del Mar.
- id: 11774
  text: Ariel
- id: 11775
  text: >-
    És la setena filla de Tritó,

    rei de l'Atlàntica. L'Ariel té

    la veu més bonica de totes les

    criatures que habiten el mar.


    L'Ariel vol veure el món fora del mar.

    En una gruta secreta, atresora una

    col・lecció d'objectes del món humà.

    L'última vegada, el Sora i els seus

    amics la van ajudar quan l'Úrsula

    va intentar dominar Atlàntica.
- id: 11776
  text: Ariel
- id: 11777
  text: >-
    Setena filla del Tritó, rei

    d'Atlàntica, l'Ariel va signar

    un contracte amb l'Úrsula per

    convertir-se en humana i a causa

    d'això va perdre la seva bella veu.


    L'Ariel té tres dies per aconseguir

    que el príncep Èric s'enamori d'ella.

    Si no ho aconsegueix, tornarà a

    convertir-se en una sirena i

    serà l'esclava de l'Úrsula.
- id: 11778
  text: Rei Tritó
- id: 11779
  text: >-
    És el Rei del Mar i governa 

    Atlàntica. El trident simbolitza

    el seu poder. El Tritó adora la seva

    filla Ariel, però per la seva seguretat

    i la del regne, li ha prohibit

    estrictament tenir contacte amb

    qualsevol humà.
- id: 11780
  text: Rei Tritó
- id: 11781
  text: >-
    És el Rei del Mar i governa Atlàntica.

    Almenys, ho era fins que l'Úrsula el

    va transformar en una petita i lletja

    criatura marina. Però ell estigué

    disposat a pagar-ne el preu per

    salvar l'Ariel de la màgia

    malèvola de l'Úrsula.
- id: 11782
  text: Sebastià
- id: 11783
  text: >-
    És el compositor de la cort del Tritó.

    Se'l podria qualificar d'autèntic geni

    musical. S'encarrega de vigilar que

    l'Ariel no es fiqui en problemes.

    Ara està treballant en un musical

    molt especial.
- id: 11784
  text: Flounder
- id: 11785
  text: >-
    En Flounder és el millor amic de

    l'Ariel i faria qualsevol cosa per ella.

    És petit i una mica poruc, però

    mai abandonarà l'Ariel, encara

    que hagi de córrer riscs.
- id: 11786
  text: Príncep Èric
- id: 11787
  text: >-
    Un príncep del món terrestre que

    adora el mar. Una nit de tempesta,

    instants després que el seu vaixell

    s'enfonsés, l'Ariel el va salvar i

    va evitar que s'ofegués.


    El príncep Èric no recorda res

    d'aquella nit, excepte la veu

    encantadora de l'Ariel, i

    busca per tot arreu la noia

    que li va salvar la vida.
- id: 11788
  text: Jetsam
- id: 11789
  text: >-
    Aquesta malvada anguila treballa a

    les ordres de l'Úrsula. El seu ull

    dret brilla amb un amenaçador llampec

    daurat. En Jetsam és eloqüent i sap

    com manipular els cors dels altres.


    En l'última batalla, el Sora i els seus

    amics van derrotar en Jetsam, però ara

    ha tornat juntament amb l'Úrsula.
- id: 11790
  text: Flotsam
- id: 11791
  text: >-
    Aquesta malvada anguila treballa a les

    ordres de l'Úrsula. El seu ull esquerre

    brilla amb un amenaçador llampec daurat.

    En Flotsam fa falses promeses a les

    sirenes desprevingudes perquè caiguin

    a les urpes de l'Úrsula.


    En l'última batalla, el Sora i els seus

    amics van derrotar el Flotsam, però ara

    ha tornat juntament amb l'Úrsula.
- id: 11792
  text: Vanessa
- id: 11793
  text: >-
    L'Úrsula es va transformar en una noia

    bonica per malmetre la relació de

    l'Ariel amb el príncep Èric.


    Va apoderar-se de la veu de l'Ariel

    gràcies a un contracte...

    i la va utilitzar per encisar

    el príncep Èric.
- id: 11794
  text: Úrsula
- id: 11795
  text: >-
    La Bruixa del Mar viu en una

    cova allunyada del palau.

    Solia servir el rei Tritó fins que,

    a causa de les seves maquinacions,

    va ser expulsada del regne.


    Fa temps, va intentar desfer-se

    del rei Tritó i dominar l'Atlàntica.

    El Sora, el Donald i el Goofy van

    ajudar l'Ariel a derrotar-la, però

    ella va utilitzar els seus poders

    obscurs per retornar.

    El rancor que guarda contra

    el Tritó és més fort que mai...

    I ara cerca venjança.
- id: 11796
  text: Sora
- id: 11797
  text: >-
    A mesura que continua el seu viatge,

    l'heroi de la clau espasa lluita

    incansablement contra els sensecor

    i els incorporis. El Sora també

    busca el rei, ja que podria

    saber on és el Riku.


    El Sora va venir al Castell Disney

    a petició de la reina Minnie.
- id: 11798
  text: Ànec Donald
- id: 11799
  text: >-
    El Mag de la Cort.


    Un matí es va despertar i va trobar

    una carta que el rei havia deixat just

    abans de desaparèixer. Va ser llavors

    quan en Donald va emprendre aquest

    llarg viatge.


    El seu desig més gran és retrobar-se

    amb el rei i tornar plegats

    al Castell Disney.
- id: 11800
  text: Goofy
- id: 11801
  text: >-
    El Capità dels Cavallers Reials.


    Un matí es va despertar i va trobar

    una carta que el rei havia deixat just

    abans de desaparèixer. Va ser llavors

    quan en Goofy va emprendre aquest

    llarg viatge.


    El seu desig més gran és retrobar-se

    amb el rei i tornar plegats

    al Castell Disney.
- id: 11802
  text: Reina Minnie
- id: 11803
  text: >-
    La reina del Castell Disney.


    En absència del Mickey, és ella

    qui regna. Ella em va demanar que

    acompanyés el Donald i el Goofy

    com a Cronista Reial.

    La reina Minnie està molt preocupada

    pel rei, però el seu cor sap

    que tornarà sa i estalvi.
- id: 11804
  text: Daisy
- id: 11805
  text: >-
    És la dama d'honor de la reina

    Minnie al Castell Disney i

    la companya del Donald.


    Està ajudant la reina Minnie a

    gestionar els assumptes del castell

    mentre els cavallers són fora.
- id: 11806
  text: Xip
- id: 11807
  text: >-
    Un dels especialistes en mecànica

    del regne. Ajuda a mantenir la nau

    gumi perque pugui viatjar a

    qualsevol destinació.

    És diligent i acaba

    tot el que comença.


    El Xip és gairebé idèntic al seu

    amic Xop, però es distingeixen

    pel color del nas i la forma

    de les dents frontals.
- id: 11808
  text: Xop
- id: 11809
  text: >-
    Un dels especialistes en mecànica

    del regne. Ajuda a mantenir la nau

    gumi, perque pugui viatjar a

    qualsevol destinació.

    El Xop és molt impulsiu, però

    meticulós i consistant a

    l'hora d'acabar treballs

    importants.


    El Xop és gairebé idèntic al seu

    amic Xip, però es distingeixen

    pel color del nas i la forma

    de les dents frontals.
- id: 11810
  text: Escombres
- id: 11811
  text: >-
    El rei Mickey va embruixar aquestes

    escombres i les ha fet molt

    treballadores. Netegen, ajuden

    a mantenir la nau gumi

    i donen un cop de mà en

    el que sigui necessari.
- id: 11812
  text: Sora
- id: 11813
  text: >-
    Obrint-se pas amb la clau

    espasa, el Sora continua la

    recerca del Riku i el rei.


    Per alliberar el Castell Disney

    d'una invasió d'esbarzers, el Sora

    va travessar una porta creada pel

    Merlí i va aparèixer en un

    món en blanc i negre.
- id: 11814
  text: Ànec Donald
- id: 11815
  text: >-
    El Mag de la Cort.


    Per salvar el Castell Disney, en

    Donald va creuar una porta que en

    Merlí va fer aparèixer i va arribar

    a un món en blanc i negre li

    resultava estranyament familiar.
- id: 11816
  text: Goofy
- id: 11817
  text: >-
    El Capità dels Cavallers Reials.


    Per salvar el Castell Disney, el

    Goofy va creuar una porta que el

    Merlí va fer aparèixer i va arribar a

    un món en blanc i negre que li

    resultava estranyament familiar.
- id: 11818
  text: Pete
- id: 11819
  text: >-
    Vell enemic del rei Mickey,

    va viatjar al passat per ordre de la Malèfica.


    Com a part del seu pla per

    dominar el Castell Disney, el Pete vol

    destruir la Pedra Angular de

    Llum. Sense ella, el castell quedarà

    indefens.
- id: 11820
  text: Pete (?)
- id: 11821
  text: >-
    Aquest capità d'un vaixell de vapor

    és diferent del Pete que ja

    coneixem. No sembla tenir

    cap connexió amb els

    sensecor. Ni tan sols

    reconeix el Sora, el Donald i el Goofy!


    Em pregunto si estarà

    intentant enganyar-nos.
- id: 11822
  text: Horaci
- id: 11823
  text: >-
    Un vell amic de Ses Majestats,

    Mickey i Minnie, i

    dels habitants del Castell Disney. L'Horaci

    no seria l'Horaci sense la seva gran

    collera. També és

    molt amic de la vaca Clarabella.
- id: 11824
  text: Clarabella
- id: 11825
  text: >-
    Una vella amiga de Ses Majestats,

    Mickey i Minnie, i dels habitants

    del Castell Disney.

    També és amiga íntima del

    cavall Horaci. A la Clarabella

    li encanten les xafarderies.
- id: 11826
  text: Clara
- id: 11827
  text: >-
    Una famosa gallina, cantant

    d'òpera. És una vella amiga del rei

    i la reina, i dels altres habitants

    del Castell Disney.
- id: 11828
  text: El rei Mickey (?)
- id: 11829
  text: >-
    És el rei Mickey en persona, però

    en aquest món no té gaire

    a dir; i és una mica

    diferent del rei que tots coneixem.


    Sa Majestat actua com

    si fos una altra persona.

    Què deu estar passant?
- id: 11830
  text: Sora
- id: 11831
  text: >-
    L'escollit de la clau espasa

    lluita incansablement contra els sensecor

    i els incorporis.


    Fa temps, va ajudar a

    frustrar els plans de l'Home del Sac

    per controlar Vila Halloween.
- id: 11832
  text: Ànec Donald
- id: 11833
  text: >-
    El Mag de la Cort recorre els

    mons a la recerca del rei,

    acompanyat del Sora i el Goofy.


    Fa temps, va ajudar a frustrar

    els plans de l'Home del Sac

    d'apoderar-se de Vila Halloween.
- id: 11834
  text: Goofy
- id: 11835
  text: >-
    El Capità dels Cavallers Reials

    recorre els mons amb el Sora

    i el Donald, a la recerca del rei.


    Fa temps, va ajudar a frustrar

    els plans de l'Home del Sac

    d'apoderar-se de Vila Halloween.
- id: 11836
  text: Jack Skellington
- id: 11837
  text: >-
    El Rei Carbassa. El que més

    li agrada d'aquest món és espantar

    la gent. El Sora i els seus amics

    el van conèixer per primera vegada quan el

    Jack volia utilitzar els sensecor

    per condimentar les seves esgarrifoses

    celebracions de Halloween. Però

    les coses no van sortir com el Jack

    havia planejat.


    Ara li fascina el Nadal.

    Ha decidit oferir descansar al

    Pare Noel i demostrar que

    ell pot encarregar-se del gran dia i

    fer una feina excel・lent.
- id: 11838
  text: Jack Skellington
- id: 11839
  text: >-
    Li encanta espantar la gent, però

    quan en Jack va descobrir el Nadal

    va quedar impressionat. Fins i tot

    va pensar que podria millorar-ho afegint-hi

    un toc esgarrifós.


    El Jack volia lliurar els regals

    als nens del món, en lloc del

    Pare Noel, però ell el va ajudar a

    adonar-se que el seu talent era

    més apropiat per Halloween. Però

    el Jack encara conserva el vestit

    de Pare Noel que li va fer la Sally!
- id: 11840
  text: Sally
- id: 11841
  text: >-
    Una de les creacions del Dr. Finkelstein.

    La Sally està feta de retalls i els seus

    trossos a vegades es desprenen i

    es mouen sols. És experta en

    apedaçar-se a ella mateixa amb

    agulla i fil.


    Normalment, la Sally ajuda el Dr.

    Finkelstein al laboratori, però li

    agradaria passar més temps amb el Jack.
- id: 11842
  text: Dr. Finkelstein
- id: 11843
  text: >-
    El científic boig de

    Vila Halloween. La Sally és una de

    les seves creacions.


    El Sora i els seus amics

    van conèixer el metge quan estava intentant

    crear un cor. Va fracassar, però

    no ha perdut l'interès pels seus

    estranys invents.


    El cap del doctor està fet

    de plaques d'acer que s'obren

    pel seu manteniment.
- id: 11844
  text: Zero
- id: 11845
  text: >-
    El gos fantasma del Jack. 

    Tan bon punt el seu amo el crida, surt de la

    seva tomba i ve immediatament;

    no es cansa mai de jugar amb ell.
- id: 11846
  text: Batlle
- id: 11847
  text: >-
    El Batlle de Vila Halloween

    té dues cares, una

    feliç i una trista, que s'alternen

    segons el seu estat d'ànim, i

    canvia a tort i a dret!


    Ell confia plenament en

    el Jack per als preparatius

    de Halloween. De fet, el Batlle

    no pot prendre decisions

    sense consultar-les abans amb el Jack.
- id: 11848
  text: Nyek
- id: 11849
  text: >-
    Un membre del trio de bromistes

    juntament amb la Poll i el Puça.

    La seva banyera errant els ajuda

    a moure's per cometre

    tota classe d'entremaliadures.


    A vegades ajuden a l'Home del Sac, tot i que

    no li són del tot fidels.
- id: 11850
  text: Poll
- id: 11851
  text: >-
    Un altre membre del trio entremaliat.

    La Poll és la més enginyosa dels

    tres i té un munt

    d'idees per-la grossa.

    Va començar a comportar-se millor

    després que l'Home del Sac fou derrotat,

    encara que no massa.
- id: 11852
  text: Puça
- id: 11853
  text: >-
    Un membre del trio de bromistes

    juntament amb la Poll i el Nyek. 

    Acostuma a ser l'objecte de les

    bromes dels seus companys.
- id: 11854
  text: Pare Noel
- id: 11855
  text: >-
    Tan solidari com el

    Cagatió. Cada 25 de desembre,

    el Pare Noel fa realitat

    els somnis dels nens,

    reparteix regals en un trineu

    estirat per rens voladors. Per

    preparar el Nadal,

    depèn de la seva llista de nens i nenes

    que s'han portat bé durant

    l'any.


    Sembla que el nostre amic Jack

    Skellington està una mica confós.

    Ell creu que el nom del Pare Noel

    és Pare Cruel.
- id: 11856
  text: Rens
- id: 11857
  text: >-
    Un conjunt de rens a l'

    estil de Halloween per al Jack, especialment

    dissenyat pel

    Dr. Finkelstein. Són ideals per

    estirar del taüt que el Jack utilitza

    com a trineu per solcar el

    cel nadalenc.
- id: 11858
  text: Home del Sac
- id: 11859
  text: >-
    Un malvat sac de cuques

    que li encanta apostar als daus i

    dessitja malbaratar els plans del Jack

    per Halloween. El Sora i els seus amics

    ja el van derrotar una vegada, però la

    Malèfica el va fer tornar com a

    part del seu macabre pla.
- id: 11860
  text: L'experiment
- id: 11861
  text: >-
    Una ninot creat pel

    Dr. Finkelstein.


    A diferència de la Sally, no tenia

    un cor, així que va intentar trobar

    -ne un en

    l'amor dels regals.
- id: 11864
  text: Sora
- id: 11865
  text: >-
    L'escollit de la clau espasa, un

    noi destinat a lluitar contra els

    sensecor i els incorporis. El Sora

    cerca el Riku amb l'esperança

    que puguin tornar junts

    a les seves illes.


    Quan va arribar a Port Royal, el Sora

    no va poder dissimular el seu

    estupor davant d'un món tan

    diferent als altres que havia visitat.
- id: 11866
  text: Ànec Donald
- id: 11867
  text: >-
    El Mag de la Cort recorre els

    mons a la recerca del rei Mickey,

    que pretén resoldre l'enigma

    de l'Organització {XIII}.


    Quan va arribar a Port Royal, el

    Donald no va poder dissimular l'estupor

    que li va causar un món tan

    diferent a tots els que havia visitat.
- id: 11868
  text: Goofy
- id: 11869
  text: >-
    El Capità dels Cavallers Reials

    recorre els mons a la recerca del

    rei Mickey, que pretén resoldre

    l'enigma de l'Organització {XIII}.


    Quan va arribar a Port Royal, el

    Goofy no va poder dissimular l'estupor

    que li va causar un món tan

    diferent a tots els que havia visitat.
- id: 11870
  text: Will Turner
- id: 11871
  text: >-
    Un hàbil ferrer, especialista

    en espases. De petit, el

    vaixell en què viatjava va ser enfonsat

    per pirates i ell va quedar a la deriva.

    Va ser llavors quan va

    desaparèixer el medalló pirata

    que el seu pare li havia regalat. La


    jove Elizabeth Swann anava

    a bord del vaixell que va rescatar el Will,

    i es van fer bons

    amics des de llavors. Com que el pare de l'Elizabeth

    és el governador de Port Royal, el Will

    és una mica tímid i molt

    formal en el tracte amb ella.
- id: 11874
  text: Elizabeth Swann
- id: 11875
  text: >-
    És la filla del governador de Port Royal.

    Per protegir el Will, va amagar

    el medalló pirata al seu pare i

    els seus homes. Té una idea romàntica

    sobre la vida dels pirates i de

    tant en tant li agrada contemplar

    el medalló.


    El Will és tímid i de tracte molt formal,

    a causa de la posició

    del seu pare, però ella

    preferiria que no fos així.
- id: 11876
  text: Capità Jack Sparrow
- id: 11877
  text: >-
    Un pirata que estima la vida a alta mar.

    És un personatge pintoresc, que

    valora la seva llibertat per sobre de tot.

    Assegura ser capità, però no sembla

    tenir tripulació.


    El Jack va ser arrestat a Port Royal

    i enviat a la presó, però el Will Turner

    el va ajudar a escapar durant un atac

    pirata. El Jack sembla que coneix alguna cosa

    important sobre el Will.

    Em pregunto què serà.
- id: 11878
  text: Capità Barbossa
- id: 11879
  text: >-
    És el capità de la “Perla Negra” i

    el líder dels pirates zombis.


    La maledicció de l'or asteca

    deixa el Barbossa i els seus homes en una

    mena de limbe entre la vida i

    la mort. A la llum de la lluna, es revela la

    seva forma veritable, i

    és una visió terrorífica.


    Ara, el capità Barbossa

    s'ha unit al Pete per buscar

    no sé què...
- id: 11880
  text: Sora
- id: 11881
  text: >-
    El portador de la clau espasa obre

    les portes dels mons a la

    recerca del seu amic Riku.


    Remenant l'ordinador de

    l'Ansem, va activar una mena de

    dispositiu que va transportar

    el grup dins d'un ordinador.
- id: 11882
  text: Ànec Donald
- id: 11883
  text: >-
    El Mag de la Cort va sortir del

    Castell Disney a la recerca del

    rei Mickey.


    En Donald va intentar utilitzar

    l'ordinador de l'Ansem per trobar

    el rei, però la seva impaciència va

    fer que el PCM transportés els tres

    amics a un món dins el sistema

    informàtic.
- id: 11884
  text: Goofy
- id: 11885
  text: >-
    El Capità dels Cavallers Reials va

    sortir del Castell Disney a la recerca

    del rei Mickey.


    En Goofy va intentar utilitzar

    l'ordinador de l'Ansem per trobar

    el rei, però la seva impaciència va

    fer que el PCM transportés els tres

    amics a un món dins el sistema

    informàtic.
- id: 11886
  text: Tron
- id: 11887
  text: >-
    És un programa de seguretat creat

    per un usuari amb l'objectiu de

    vigilar el PCM.


    El Tron és molt eficient i farà

    el que li demani el seu usuari.
- id: 11888
  text: Sark
- id: 11889
  text: >-
    Aquest potent programa no

    respon a cap usuari, només

    al PCM.

    El comandant Sark és bastant sever

    amb qualsevol programa que provi

    de resistir el poder del seu amo.
- id: 11890
  text: PCM
- id: 11891
  text: >-
    És el Programa de Control Mestre,

    i com a programa de control principal,

    el que governa el sistema.


    En lloc de treballar per als

    usuaris, el PCM està planejant

    controlar ell mateix el sistema.

    Es nega a executar les ordres

    dels usuaris, intenta dur a

    terme el seu pla malvat i està

    sembrant el caos entre els

    altres programes.
- id: 11892
  text: Programa hostil
- id: 11893
  text: >-
    Un programa executat des de

    l'entorn de dades DTD per

    destruir la ciutat.
- id: 11900
  text: Sora
- id: 11901
  text: >-
    L'escollit per la clau espasa.


    Juntament amb el Donald i el Goofy, ha

    buscat incansablement la

    Kairi i el Riku. Al llarg del seu viatge,

    ha conegut molta gent i ha

    superat nombroses proves.

    Per fi, ha travessat una

    Vila Crepuscle paral・lela i la

    foscor mateixa per arribar al

    camp de batalla definitiu.


    Més enllà... trobarà la llum...

    o alguna cosa diferent? El destí està en

    mans del Sora.
- id: 11902
  text: Ànec Donald
- id: 11903
  text: >-
    És el Mag de la Cort.

    Durant el seu llarg viatge, el Donald,

    el Goofy i el Sora han fet

    un munt d'amics.


    La lleialtat del Donald vers el rei

    i la seva amistat amb el Sora mantenen

    l'optimisme del grup

    ara que s'acosta la batalla més gran

    de totes.
- id: 11904
  text: Goofy
- id: 11905
  text: >-
    El Capità dels Cavallers Reials.

    Durant el seu llarg viatge, el Donald,

    el Goofy i el Sora han fet un munt

    d'amics.


    Valent i confiat, el Goofy vol

    salvar els seus amics i el rei, i està

    preparat per enfrontar-se a la batalla

    més gran de totes.
- id: 11906
  text: Xemnas
- id: 11907
  text: >-
    El núm. {I} de l'Organització {XIII}

    és el líder del grup.

    El Xemnas és l'incorpori del

    Xehanort, un aprenent de l'Ansem.


    Estava utilitzant el Sora i la seva clau

    espasa per reunir els cors

    alliberats dels sensecor i

    culminar el Kingdom Hearts.
- id: 11908
  text: Xigbar
- id: 11909
  text: >-
    El núm. {II} de l'Organització {XIII}.


    Una vegada li va dir al Sora que li

    recordava a una altra persona. Les seves

    paraules foren desconcertants.


    Alguna cosa semblava fer-lo gaudir de la

    reacció del Sora.
- id: 11912
  text: Vexen
- id: 11913
  text: >-
    El núm. {VII} de l'Organització {XIII}.


    El Saïx perseguia implacablement el rebel Axel,

    i va ser ell qui va

    atrapar la Kairi i la va tancar en una masmorra

    del castell, quan ella

    aconseguí escapar de l'Axel.


    Si el Saïx veu que pot

    utilitzar alguna cosa en el seu benefici, ho farà sense

    pensar-s'ho dues vegades.
- id: 11918
  text: Saïx
- id: 11919
  text: >-
    El núm. {VII} de l'Organització {XIII}.


    El Saïx perseguia implacablement el

    rebel Axel. Va ser ell qui va

    atrapar la Kairi i la va tancar en una masmorra

    del castell, quan ella

    aconseguí escapar de l'Axel.


    Si el Saïx veu que pot

    utilitzar alguna cosa en el seu benefici, ho farà sense

    pensar-s'ho dues vegades.
- id: 11924
  text: Luxord
- id: 11925
  text: >-
    El núm. {X} de l'Organització {XIII}.

    Un tafurer capaç de manipular

    el temps.


    Després de sorprendre a Sora i

    als seus amics amb les seves astutes paraules

    , Luxord va tenir el plaer de

    lluitar contra ells en un joc

    estrany.


    A Port Royal, Luxord va utilitzar els

    sensecor i les peces d'or

    maleït per experimentar en

    benefici de l'Organització

    i recollir més cors.
- id: 11930
  text: Roxas
- id: 11931
  text: >-
    El núm. {XIII} de l'Organització {XIII},

    portador d'una clau espasa i

    resident de la foscor.


    Va esvair-se

    apuntant un somriure de satisfacció després

    d'enfrontar-se al Sora. Però sembla

    que en Sora fou l'únic que el va poder veure.
- id: 11932
  text: Soldat
- id: 11933
  text: >-
    Llança atacs a tort i

    a dret. Cal anar amb compte

    amb ell!


    Contraataca amb un cop de peu.

    Per evitar-lo, el millor és utilitzar

    el Cicló, t'elevaràs enlaire i

    podràs atacar-lo amb combos!
- id: 11934
  text: Ombra
- id: 11935
  text: >-
    Es fon amb el terra mentre

    es mou. Per vèncer-lo,

    espera el moment adequat.


    Ataca'l tan aviat com surti a

    la superfície!
- id: 11936
  text: Ganàpia
- id: 11937
  text: >-
    Acostuma a bloquejar els atacs

    frontals. Intenta utilitzar combos

    des de l'esquena i acaba amb

    Audàcia.


    Quan està enfurismat, envesteix

    repetidament. Aprofita-te'n i

    utilitza les ordres de reacció.

    I finalment, prova amb Contra!
- id: 11938
  text: Roca platejada
- id: 11939
  text: >
    Es converteix ràpidament en

    una bola de llum i explota tan aviat com

    torna a aparèixer. Utilitza les

    ordres de reacció quan

    es converteixi en la bola de llum.


    Té una gran resistència a la

    màgia, de manera que fes servir la clau espasa!
- id: 11940
  text: Blues esmaragda
- id: 11941
  text: >-
    Ataca'l des de lluny i

    vigila amb les ràpides

    escomeses. Si té poca VT

    forma un tornado que

    atrau els seus enemics.


    Té una gran resistència a la

    màgia, de manera que fes servir la

    clau espasa!
- id: 11942
  text: Jazz carmesí
- id: 11943
  text: >-
    Cal tenir compte amb ell! Persegueix els seus

    enemics i deixa mines

    per allà on passa.


    Si té poca VT, col・loca una

    gran mina. Intenta allunyar-te

    abans que exploti. Té

    una gran resistència a la màgia,

    de manera que fes servir la clau espasa!
- id: 11944
  text: Pirata volador
- id: 11945
  text: >-
    La seva velocitat el converteix en un objectiu

    difícil, així que espera

    que s'aturi abans d'atacar. Per

    aturar-lo, utilitza màgia.


    Evita els seus contraatacs

    utilitzant les ordres de

    reacció!
- id: 11946
  text: Il・lusió fantasmal
- id: 11947
  text: >-
    Té dues cares, i ambdues

    requereixen estratègies de

    combat diferents.


    Si està en l'aire, acosta't

    per evitar els seus atacs a

    distància. Si és a terra,

    allunya't per evitar els seus

    atacs cos a cos.
- id: 11948
  text: Gos rabiós
- id: 11949
  text: >-
    Estarà immòbil fins que t'hi

    acostis, així que ataca'l

    ràpidament.


    Si contraataques, es cansarà

    i abaixarà la guàrdia. Aprofita

    aquest moment i la batalla

    serà més fàcil.
- id: 11950
  text: Ganxo vampir
- id: 11951
  text: >-
    Acostuma a voletejar per la zona,

    a l'aguait. Quan es llenci en picat,

    utilitza Esgarip per atrapar-lo i

    atacar-hi els enemics propers.


    Després d'aquest atac, usa combos

    aèries i remata'l.
- id: 11952
  text: Bibliotecari
- id: 11953
  text: >-
    Un gran mag, hàbil en els

    tres tipus de màgia elemental.


    Adopta diferents formes per

    utilitzar cada tipus d'encanteri, i

    s'assembla al Nocturn vermell, la

    Rapsòdia Blava i l'Òpera Groga.

    És immune a tota màgia, i

    has de derrotar-lo immediatament si no

    vols passar-ho malament.
- id: 11954
  text: Minut explosiu
- id: 11955
  text: >-
    Quan l'ataques, inicia un

    compte enrere fins que explota.

    Utilitza Cabriola uns instants abans

    de l'explosió i

    aniquila els enemics propers.


    Si eludeixes les seves envestides, es

    desanimarà i serà un objectiu fàcil.
- id: 11956
  text: Martell furiós
- id: 11957
  text: >-
    Colpeja el terra i genera una

    ona expansiva. Salta per esquivar-la,

    i ataca amb combinacions.


    Quan la seva VT disminueixi, llançarà una

    sèrie d'envestides, de manera

    que remata'l com més aviat millor!
- id: 11958
  text: Venedor corpulent
- id: 11959
  text: >-
    Un estrany sensecor que només

    apareix en certs mons, si

    explores una mica.


    No torna a aparèixer al

    mateix lloc durant una estona.

    Utilitza les ordres de reacció

    i obtindràs objectes de valor.

    Si descobreixes el seu patró

    d'atac, aconseguiràs objectes

    especials.
- id: 11960
  text: Pitonissa
- id: 11961
  text: >-
    Domina els encanteris de Glaç

    i és immune a aquest tipus de màgia.


    Si té poca VT, intentarà

    congelar els seus enemics.

    Prova de contraatacar aquest

    enemic amb Tir net.
- id: 11962
  text: Canó
- id: 11963
  text: >-
    Llença bombes des de lluny,

    així que intenta vèncer-lo aviat.

    Quan ataquis, evita les zones

    on cauran les bombes.


    Si t'hi acostes,

    s'allunyarà, així que ves a buscar-lo

    i no el deixis escapar.
- id: 11964
  text: Coet sobtat
- id: 11965
  text: >-
    Atacar en grup, de manera que

    les ordres de reacció et siguin

    útils. Comença amb Trampa

    veloç i continua amb Aeroestocada.


    Quan contraataca, persegueix

    el seu enemic amb perseverança.

    Serà millor que t'hi allunyis!
- id: 11966
  text: Gran trepant
- id: 11967
  text: >-
    Es mou sota terra, de manera que

    segueix els núvols de pols

    per conèixer la seva posició.


    Fes servir un atac final per

    fer-lo sortir a la superfície, i tan aviat com

    aparegui, ataca amb decisió!
- id: 11968
  text: Llancer
- id: 11969
  text: >-
    El soldat i la seva llança no acaben

    de congeniar, així que és fàcil

    descobrir-lo amb la guàrdia baixa.


    Si té poca VT, la llança embogeix.

    Arrabassa-li amb Roba llança i

    utilitza-la per atacar.

    Intenta que baixi la seva VT i treu-li

    la llança, et serà d'allò més útil.
- id: 11970
  text: Estrella matutina
- id: 11971
  text: >-
    Quan la seva VT disminueix, llança el seu

    atac Premsa. Contraataca

    amb Batzegada i Meteòric!


    Pots llançar una successió de Meteòrics

    i no t'oblidis de colpejar

    els enemics propers!
- id: 11972
  text: Globus ferí
- id: 11973
  text: >-
    Corre abans d'atacar, de manera que els

    seus moviments són previsibles.


    Té una VT baixa i no pot suportar el fred.

    Si fas servir els encanteris de Glaç, no et

    resultarà difícil vèncer-lo.
- id: 11974
  text: Cub Gelat
- id: 11975
  text: >-
    Salta abans d'atacar, de manera que els

    seus moviments són previsibles.


    Té una VT baixa i no pot suportar el

    foc. Amb encanteris Piro, no et

    resultarà difícil vèncer-lo.
- id: 11976
  text: Bandit obès
- id: 11977
  text: >-
    És immune als encanteris Piro

    i evita la majoria d'atacs frontals.

    Ataca'l per darrere i

    remata'l amb una combinació.


    Si evites les seves bombes, tindràs

    l'oportunitat de llançar un atac Audàcia!
- id: 11978
  text: Bandit lunar
- id: 11979
  text: >-
    Durant el combat, normalment

    retrocedeix, així que hauràs d'abalançar-te

    sobre ell.


    Si esquives els seus atacs, baixarà la

    guàrdia i podràs vèncer-lo aviat.
- id: 11980
  text: Gàrgola pètria
- id: 11981
  text: >-
    Sembla una estàtua ordinària,

    però de sobte es converteix

    en un enemic molest.


    És immune a la màgia i pot

    atacar des de qualsevol distància.

    Intenta evitar-la fins que puguis

    utilitzar les ordres de reacció.
- id: 11982
  text: Gàrgola guerrera
- id: 11983
  text: >-
    Sembla una estàtua ordinària,

    però de sobte es converteix

    en un enemic molest.


    És immune a la màgia i pot

    atacar des de qualsevol distància.

    Evita els seus atacs giratoris

    i podràs utilitzar ordres de

    reacció. Si ho fas en el moment

    adequat, venceràs d'un sol cop.
- id: 11984
  text: Cavaller agosarat
- id: 11985
  text: >-
    Al principi només volta,

    però un cop l'ataquis,

    t'assetjarà insistentment.

    Hauràs d'esquivar els seus atacs

    i contraatacar.
- id: 11986
  text: Soldadet de plom
- id: 11987
  text: >-
    Esperarà l'oportunitat

    d'apropar-se, així que ataca'l

    des de certa distància.


    Quan es converteixi en una caixa,

    començarà a atacar des de lluny,

    i serà difícil acostar-s'hi.
- id: 11988
  text: Aviador maligne
- id: 11989
  text: >-
    Dispara bales des de l'aire,

    però només cap endavant.


    La velocitat dels seus moviments

    augmenta quan contraataca; procura

    vèncer-lo mentre el seu vol és lent.
- id: 11990
  text: Cotxe foll
- id: 11991
  text: >-
    És difícil encertar-lo, perquè ataca i

    retrocedeix a gran velocitat. Per

    vèncer-lo, hauràs d'utilitzar màgia.


    Si té poca VT, es mou

    encara més ràpid, així que desfés-te'n

    tan aviat com sigui possible.
- id: 11992
  text: Centaure fatal
- id: 11993
  text: >-
    La seva llança és letal. Per

    vèncer-lo, és convenient llençar

    atacs prudents amb Salta.


    Si té poca VT, es torna

    més audaç.

    No el deixis respirar i intenta

    vèncer-lo abans que faci servir

    el seu atac explosiu.
- id: 11994
  text: Noctàmbul
- id: 11995
  text: >-
    Mentre ataca, salta amb tenacitat.

    Intenta derrotar-lo immediatament,

    o es convertirà en un malson.

    Compte amb el seu poderós

    contraatac.
- id: 11996
  text: Carregador magne
- id: 11997
  text: >-
    Gira al voltant del seu enemic

    en el sentit de les agulles del rellotge.

    Recorda-ho quan l'ataquis.


    És molt ràpid, així que intenta

    atacar-lo durant les breus estones

    en què disminueix la velocitat.


    Si estàs alerta, podràs

    evitar la seva veloç envestida i

    contraatacar amb Estocada ràpida.
- id: 11998
  text: Bombarder làser
- id: 11999
  text: >-
    Gira al voltant del seu enemic en

    el sentit de les agulles del rellotge.

    Recorda-ho quan l'ataquis.


    Intenta mantenir-te a prop seu,

    perquè amb el seu làser pot atacar

    des de lluny.
- id: 12000
  text: Devastador
- id: 12001
  text: >-
    És capaç de volar o

    transformar-se en un tanc. Assetja els seus

    enemics des de l'aire. És millor

    mantenir la distància. El tanc

    ataca des de lluny; esquiva els seus

    canons per apropar-te.


    Ves amb compte, perquè durant la

    transformació llança un potent

    atac elèctric!
- id: 12002
  text: Ossos vivents
- id: 12003
  text: >-
    Els seus atacs són molt forts i

    causen molt dany. Cal que els

    evitis! Pots afeblir-lo

    en un instant si li esclafes

    el cap amb l'ordre de reacció!


    En companyia d'un xaman, llança

    malediccions mortals.

    Intenta deixar-lo fora de combat com

    si fossis tu el xaman.
- id: 12004
  text: Xaman
- id: 12005
  text: >-
    Ataca des de lluny i es mou

    poc. És molt resistent a la

    màgia. Quan pren la forma

    d'una màscara, anul・la tots els

    teus atacs.


    De vegades, llança flames maleïdes que

    persegueixen el seu objectiu

    insistentment, però pots

    aprofitar-les amb les ordres

    de reacció!
- id: 12006
  text: Boxejador aeri
- id: 12007
  text: >-
    Un cop comença la batalla,

    no hi ha escapatòria.


    Utilitza tres tipus de cops, i si

    endevines quina farà servir, podràs

    triar l'estratègia adequada.


    La seva envestida és molt poderosa, però

    pots vèncer-lo aviat

    si uses repetidament

    les ordres de reacció!
- id: 12008
  text: Tornado sorprenent
- id: 12009
  text: >-
    Ataca sense parar de moure's.

    Quan comença a girar,

    cal aturar-lo amb

    les ordres de reacció.


    Si fas servir Tornado, l'atraparàs i

    podràs acabar amb altres amenaces

    properes de forma segura.
- id: 12010
  text: Clàxon guaridor
- id: 12011
  text: >-
    Retorna la VT als enemics

    propers, però fer servir Trepitjada

    en el moment adequat, curarà

    els teus aliats.


    Tan aviat com l'ataquis,

    demanarà ajuda, així que derrota'l tan

    aviat com sigui possible.
- id: 12012
  text: Enfiladissa
- id: 12013
  text: >-
    Roman en un lloc i dispara

    llavors. Quan t'ataqui amb

    les seves arrels, utilitza

    les ordres de reacció.

    Amb Poda, pots arrencar-la

    d'arrel i atacar els enemics

    propers simultàniament!
- id: 12014
  text: Armadura ombrívola
- id: 12015
  text: >-
    Carrega contra el seu objectiu en grup.

    Quan salti per llançar la seva

    envestida des de l'aire, utilitza

    l'ordre de reacció Sol naixent.


    Si l'utilitzes diverses vegades seguides,

    llançaràs poderoses combinacions!
- id: 12016
  text: Robot sentinella
- id: 12017
  text: >-
    Intenta utilitzar les ordres de

    reacció Atrapa i Fumiga per

    desfer-te dels enemics

    propers amb el làser!


    Si els enemics aconsegueixen evadir

    l'atac làser, assegura't d'utilitzar

    altres ordres de reacció!
- id: 12020
  text: Neoombra
- id: 12021
  text: >-
    Abans d'atacar, projecta una

    ombra a terra. Després d'atacar,

    abaixa la guàrdia. Aprofita-ho!


    Quan intenti saltar sobre

    teu, fes servir Dansa del vent i llançaràs

    una ràfega d'atacs!
- id: 12022
  text: Cap volcànic
- id: 12023
  text: >-
    Aquest sensecor va arribar a Agrabah

    amb el grup del cobdiciós Pete.

    Va aparèixer amb el Cap gelat.


    Era feble als encanteris de Glaç,

    però va turmentar el Sora i companyia

    utilitzant hàbilment el foc.
- id: 12024
  text: Cap gelat
- id: 12025
  text: >-
    Aquest sensecor va arribar a Agrabah

    amb el grup del cobdiciós Pete.

    Va aparèixer amb el Cap volcànic.


    Era feble als encanteris Piro,

    però va turmentar el Sora i companyia

    utilitzant hàbilment el glaç.
- id: 12026
  text: Usurpador
- id: 12027
  text: >-
    Aquest sensecor va aparèixer al

    castell de la Bèstia. Va prendre

    possessió de la porta d'entrada

    a la masmorra i es va transformar

    en el sensecor anomenat Custodi.


    Tenia l'habilitat d'ocultar-se,

    però no era gaire poderós.
- id: 12028
  text: Custodi
- id: 12029
  text: >-
    La porta que va posseir

    l'Usurpador quan va atacar

    el Sora i els seus amics.


    Usant Allibera, van aconseguir 

    separar l'Usurpador de 

    la porta.

    El poder de la clau espasa va ser

    completament descarregat al pany

    que bloquejava amb els braços.
- id: 12030
  text: Espines d'ombra
- id: 12031
  text: >-
    La versió alliberada de l'Ombra

    sotjant que va aparèixer al

    castell de la Bèstia.


    Apareixia, desapareixia i corria

    embogit. No fou una batalla fàcil

    per al Sora i els seus amics.
- id: 12032
  text: Ombra sotjant
- id: 12033
  text: >-
    El sensecor que va atacar la Bella

    al castell de la Bèstia.


    Saltava per terra, per les

    columnes i fins i tot fins a la gran

    làmpada de la sala de ball.

    Una autèntica bogeria!
- id: 12034
  text: Il・luminador
- id: 12035
  text: >-
    Un sensecor que el Pete va portar

    a Port Royal.


    Tenia ulls fulgurants i amb la

    làmpada de la cua absorbia la

    llum. Així sumia el lloc en la

    foscor i ajudava el Barbossa, la debilitat del

    qual era la llum de la lluna.
- id: 12036
  text: Parca pirata
- id: 12037
  text: >-
    Les males llengües comenten que aquest sensecor

    va aparèixer a Port Royal a causa

    de l'or asteca maleït.


    A causa de la maledicció, es va convertir en

    un zombi demoníac; un enemic

    difícil de vèncer.
- id: 12038
  text: Terratrèmol salvatge
- id: 12039
  text: >-
    És el sensecor gegant que

    va aparèixer a les Terres del Regne.

    Va sorgir a causa de la presència

    fantasmal de l'Scar.


    Va sacsejar la terra i va sumir la

    sabana en el caos. L'ésser

    gegantí estava

    controlat per una entitat

    muntada a la seva

    esquena.
- id: 12040
  text: Carcerari
- id: 12041
  text: >-
    La Malèfica va dur aquest sensecor

    a Vila Halloween per

    venjar-se del Sora.


    Mentre realitzava els seus atacs

    elementals,

    mantenia empresonats el Nyek, la Poll i el Puça.
- id: 12042
  text: Genet de tempestats
- id: 12043
  text: >-
    Aquest monstre gegantí

    va aparèixer als cels de la

    Terra de Dracs. El Sora

    va haver de combatre'l en una intensa

    batalla a les portes del palau.


    Originalment, era una criatura

    que donava força a la terra i el

    poble xinès, però es va

    convertir en un perillós sensecor.
- id: 12044
  text: Enfiladís
- id: 12045
  text: >-
    És l'incorpori més feble.

    Adopta diverses formes i és

    difícil preveure els seus moviments.


    Quan apareix amb els foscants,

    pots aturar els seus moviments amb

    Finta abans d'atacar-los.
- id: 12046
  text: Foscant
- id: 12047
  text: >-
    És difícil preveure els moviments

    d'aquestes criatures. Intenta utilitzar

    Finta perquè abaixin la guàrdia i

    poder atacar-los. Si alternes

    sèries d'atacs amb fintes,

    el combat serà més entretingut.


    Nota: quan bloqueges els seus atacs,

    també abaixen la guàrdia.

    Passa el mateix amb els altres

    incorporis.
- id: 12048
  text: Drac
- id: 12049
  text: >-
    Un drac és un incorpori de gran

    categoria. Quan aparegui una bola de llum després d'evitar el seu

    atac, utilitza

    Aprèn. Si ets precís, pots

    utilitzar Salta i atacar.


    Pots fer servir Aprèn moltes vegades,

    així que prova d'encadenar atacs

    amb l'ordre Salta.
- id: 12050
  text: Assassí
- id: 12051
  text: >-
    Un assassí és un incorpori de gran

    categoria. S'amaga a terra i

    ataca sigil・losament per darrere.


    No pots atacar-lo quan està a

    terra, així que fes el possible per

    mantenir-lo cara a cara.


    Ves amb compte si comença a

    córrer per les engires, és llavors quan llança

    poderosos atacs! Aprofita

    les ordres de reacció

    sempre que puguis per

    derrotar-ne diversos alhora!
- id: 12052
  text: Samurai
- id: 12053
  text: >-
    Un samurai és un incorpori de gran

    categoria. És capaç d'emprar fins a

    quatre armes a la vegada, i utilitza

    tant les espases com les seves beines.

    El seu atac és serè i molt efectiu.


    No l'has de perdre de vista quan

    s'amaga sota terra.

    Si repel・leixes el seu atac, s'asseurà

    a esperar, i tindràs l'oportunitat

    d'utilitzar ordres de reacció.


    Lluita amb un cada vegada, mentre

    els altres s'asseuen i observen.
- id: 12054
  text: Franctirador
- id: 12055
  text: >-
    Un franctirador és un incorpori

    de gran categoria. És molt hàbil i

    els seus moviments desafien la gravetat.

    Si fas servir la màgia, et serà més fàcil

    derrotar-lo.


    Llança fletxes de llum perilloses que

    pots repel・lir amb l'ordre

    Atac sobtat. Si l'utilitzes diverses vegades, aviat

    obtindràs la victòria!
- id: 12056
  text: Ballarina
- id: 12057
  text: >-
    La ballarina és una incorpori de gran

    categoria que llisca per terra.

    Quan t'acostes, s'allunya

    ràpidament. Espera que acabi el seu atac

    per llançar el teu. Si s'aproxima

    agotzonada, tingues molta cura!


    Quan l'acorrales, contraataca en

    grup amb cops de peu i altres estratagemes.

    Ves amb compte si et

    superen en nombre.
- id: 12058
  text: Embogidor
- id: 12059
  text: >-
    Un embogidor és un incorpori

    de gran categoria. Els seus atacs

    són gairebé imprevisibles, ja que és

    arrossegat per un martell maleït.


    El seu martell inutilitza

    els atacs frontals. Tomba'l

    per treure-l'hi. A continuació,

    agafa el martell i llença una

    sèrie d'atacs amb Bogeria.
- id: 12060
  text: Tafur
- id: 12061
  text: >-
    El tafur és un incorpori de gran

    categoria. No li agrada lluitar,

    per la qual cosa acostuma a flotar

    per tot arreu.


    Si t'ataca amb les seves cartes i

    daus, utilitza l'ordre de reacció

    i el joc començarà!


    No perdis o passarà una cosa terrible.

    Si guanyes, tindràs l'oportunitat

    d' atacar-lo i potser n'obtens

    alguna cosa especial!
