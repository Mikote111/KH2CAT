- id: 14051
  text: Informe Ansem 1
- id: 14052
  text: >2

    Mis esfuerzos de tantos años han dado

    sus frutos: el mundo que gobierno se ha

    convertido en un paraíso digno de ser

    llamado ‛Vergel Radiante’.


    Gracias a la pureza del agua, que es la

    fuente de la vida, las flores abren sus

    capullos y todos comienzan cada día con

    una sonrisa de esperanza.


    Pero donde hay luz, también la

    oscuridad acecha.


    Como anuncié en mi informe previo,

    busco aclarar el misterio de la ‛oscuridad

    del corazón’. El futuro de este paraíso

    depende de esa respuesta.


    Realizaré un experimento para estudiar las

    profundidades del corazón humano. Uno de

    mis aprendices, Xehanort, se ha ofrecido

    como voluntario.


    Este joven me ha asistido desde que le

    ayudé a regresar de las puertas de la

    muerte, hace ya varios años.


    En aquel momento, él había perdido todos

    sus recuerdos, pero luego demostró grandes

    inquietudes intelectuales. Pronto asimiló mis

    enseñanzas y alcanzó gran sabiduría. Aunque

    es comprensible que, por su edad, todavía se

    muestre inmaduro en algunos aspectos.


    Si logro explorar el corazón de Xehanort con

    tests psicológicos, tal vez pueda recobrar los

    recuerdos que allí quedaron encerrados. Mi

    aprendiz, Even, también ha mostrado gran

    interés en los recuerdos de Xehanort.


    ¿Pero será él el sujeto que necesito para

    la investigación? Xehanort realmente

    exhibe un talento extraordinario...


    Demasiado extraordinario...

    Casi sobrehumano...
- id: 14053
  text: Informe Ansem 2
- id: 14054
  text: >2

    He cometido un grave error.


    Mi estudio sobre la ‛oscuridad del corazón’

    comenzó como un simple test psicológico y

    rápidamente se transformó en una

    creciente fuente de problemas.


    Alentado por el más joven de mis pupilos,

    Ienzo, construí un enorme laboratorio en el

    sótano de mi castillo.


    Sin yo saberlo, mis seis aprendices

    comenzaron a reunir a un gran número de

    sujetos para realizar peligrosos experimentos

    sobre la ‛oscuridad del corazón’.


    En cuanto lo supe, reuní a mis

    aprendices y les ordené poner

    fin a sus estudios y destruir

    los resultados obtenidos.


    ¿Qué diablos sucedía en los corazones

    de mis seis amados discípulos?

    ¿Es posible que, mientras perseguían el

    misterio de la oscuridad del corazón, ellos

    mismos se hubieran extraviado en sus honduras?


    Pero creo que yo he sido un inconsciente

    por haber comenzado estos experimentos.


    Tardé demasiado en ver que no debemos

    inmiscuirnos en las profundidades de los

    corazones ajenos, sean cuales fueren las 

    razones que puedan llevarnos a hacerlo...


    Mi error me sumió en la desesperación.


    Pero un visitante de otro mundo sosegó

    mi alma abatida.


    Un pequeño rey, llamado Mickey, llegó

    blandiendo la "llave espada’, arma capaz

    de traer al mundo tanto caos como prosperidad.


    Su sabiduría me sorprendió. Nuestra

    amistad fue creciendo gracias a nuestras

    cordiales conversaciones.


    Siguiendo su consejo, decidí revisar los

    datos que había obtenido en mi laboratorio

    subterráneo.


    Fue allí donde descubrí los ‛Informes Ansem’.


    A pesar de que llevaban mi nombre, yo

    solo había escrito el número 0.


    Aparentemente, Xehanort había continuado

    redactando los informes 1 al 8.


    Sí, el primer sujeto de mis imprudentes

    investigaciones.
- id: 14055
  text: Informe Ansem 3
- id: 14056
  text: >2

    El caos no solo afecta a este mundo,

    sino a todos los otros.


    En los ‛Informes Ansem’, que mi aprendiz

    Xehanort había escrito bajo mi nombre,

    encontré los registros de sus odiosos

    experimentos, junto con sus hipótesis

    acerca de una puerta que había surgido

    en la oscuridad de mi sótano.


    Todo lo que vive tiene corazón, y todos los

    corazones tienen en el fondo una parte oscura.


    Los mundos no son una excepción. Si un

    mundo es un ser, su corazón debe de

    poseer una fuerza colosal...


    Del mismo modo, la oscuridad de su

    interior ha de ser monstruosa.


    ¿Ha traspasado Xehanort la puerta? ¿Habrá

    entrado en contacto con ese reino oscuro?


    Me temo que sí. Y no solo Xehanort.


    Al parecer, mis otros cinco aprendices,

    convencidos de que lo hacían por el bien de

    la investigación, intentaron ver el interior

    de la oscuridad y fueron atrapados dentro.


    Even, Ienzo, Braig, Dilan, Aeleus...


    Todos han dejado de ser humanos.


    Yo también me he visto despojado de todo

    cuanto poseía, desterrado a un reino vacío

    donde la nada es soberana.


    ¿Qué espera ganar Xehanort robándome

    mi existencia?


    ¿Se esfumará también la dicha de mi pueblo?


    Si la luz de la esperanza se ha extinguido,

    de ahora en adelante caminaré con la

    oscuridad como compañera.


    Aquí, en el reino vacío al que he sido relegado.


    Aquí, en esta oscuridad, en medio de la nada.


    ’La oscuridad nula’.


    El nombre ‛Ansem’ ya no me pertenece.


    En adelante, se me conocerá como DiZ.


    Y nada me detendrá hasta que logre mi

    venganza.
- id: 14057
  text: Informe Ansem 4
- id: 14058
  text: >2

    Los días que viví en ese adorable paraíso

    no son ya más que una ilusión.


    ¿Cuánto tiempo he pasado aquí, desterrado

    en el reino de la nada?


    Solo sostenido por mi furia y mi odio, he

    sido capaz de conservar mi sentido de la

    identidad en este sitio donde toda

    existencia se anula.


    Mi corazón sucumbe por el odio hacia

    mis discípulos, poseído por la oscuridad

    y por el odio que me provoca el haber

    permitido tan ingenuamente que me

    traicionaran.


    ¿Cuánto tardará esta oscuridad en devorar

    mi corazón?


    No puedo continuar malgastando

    mi tiempo aquí.


    ¿Qué es lo que Xehanort y los otros

    pretenden hacer?


    Deberé desentrañar el misterio de estos

    Informes Ansem, interceptar a mis

    discípulos y derrotarles.


    Esa es mi misión... Es la única forma de

    compensar al mundo por mis faltas.


    Esos seres que carecen de corazón

    deben de ser la clave: los sincorazón.


    La oscuridad del corazón hecha carne.

    Esas sombras malditas acechan los

    corazones de todas las cosas vivas y, al

    apoderarse de ellos, se multiplican.


    ¿De dónde surgieron y hasta dónde

    llegarán?


    Tres elementos se combinan para crear vida:

    un corazón, un alma y un cuerpo.


    ¿Pero qué son el cuerpo y el alma

    cuando el corazón se ha perdido?


    El cuerpo es la vasija del alma. Cuando el

    alma abandona el cuerpo, la vida da lugar a

    la muerte. ¿Pero qué ocurre cuando el que

    deja el cuerpo es el corazón?


    Cuando el corazón abandona el cuerpo,

    el ser no perece. Sólo es el corazón el

    que desaparece en la oscuridad.


    Hay poco tiempo.


    Si permanezco en este reino, seguramente

    aprenderé las respuestas de la manera

    más terrible e irremediable.


    Mi corazón ya es otro prisionero de la oscuridad.
- id: 14059
  text: Informe Ansem 5
- id: 14060
  text: >2

    En este reino, donde toda existencia ha

    sido desintegrada, me las he ingeniado

    para preservar mi sentido de la identidad

    a través del pensamiento y la escritura.


    En este lugar, incluso el tiempo ha perdido

    su significado. Aquí la eternidad no es más

    que un momento.


    Debo darme prisa. Estoy seguro de que los

    planes de mis pupilos ya están en marcha.


    Los sincorazón deben de ser la clave para

    desentrañar este misterio.


    Los seis traidores trabajaban en un

    laboratorio que producía esas malditas

    sombras sin cesar.


    No solo crearon muchos sincorazón

    ‛purasangre’ a partir de corazones vivientes,

    sino que también usaron a esos sincorazón

    para fabricar versiones artificiales.


    Los sincorazón artificiales llevaban insignias

    y fueron llamados ‛Emblemas’.


    Purasangre o Emblemas, los actos de estos

    sincorazón solo obedecen a sus instintos.

    Sus estrechas mentes detectan corazones

    y se limitan a apiñarse a su alrededor.


    Un líder humano sería ineficaz: los

    sincorazón fácilmente robarían el corazón

    del humano y lo usarían para aumentar sus

    propias filas.


    ¿Pero qué sucede si quien da las órdenes

    también es un sincorazón... más fuerte?


    Si alguien se desprendiera de su cuerpo y alma

    y se convirtiera en uno de ellos, ¿no sería

    capaz de controlar a los, de otro modo

    ingobernables, sincorazón?


    Además, solo podría planear hacer uso

    del instinto básico de esas criaturas.

    Si las búsquedas de los sincorazón se

    orientaran hacia un corazón más grande y

    poderoso, su objetivo final sería claro

    como el agua.


    El corazón más grande que existe

    es el corazón del mundo.


    Esto no es más que una conjetura, pero

    sospecho que los sincorazón están siendo

    utilizados para buscar el camino que

    conduce al corazón del mundo.
- id: 14061
  text: Informe Ansem 6
- id: 14062
  text: >2

    Haberme unido a la oscuridad que reina

    en medio de esta nada, fue un gran acierto.


    En cuanto me atreví a mirar hacia delante

    con el corazón calmo, sin rechazar ni temer

    la oscuridad, obtuve un nuevo poder.


    Un poder sobrehumano: el poder de

    la oscuridad.


    Es probable que Xehanort y los demás

    hayan sido cautivados por este poder y

    quizá se hayan vuelto sus prisioneros.


    Haré lo imposible para que la oscuridad

    no devore mi corazón, como devoró

    los de ellos.


    Con este nuevo poder, pude revelar el

    ‛pasaje de oscuridad’ que conecta el

    reino de la nada con el mundo exterior.

    Si bien aún me es difícil ir y venir a mi

    antojo, mi destierro ya es cosa del pasado.


    Para engañar a Xehanort y a mis pupilos,

    lo primero que hice fue usar mi nuevo

    poder y cambiar de aspecto antes de

    regresar al Reino de la Luz.


    Como había supuesto, Xehanort se había

    convertido en un sincorazón.


    Bajo mi nombre, él dirigía a otros

    sincorazón con el fin de arrebatar los

    corazones de muchos mundos distintos.


    En el centro de los corazones que Xehanort

    había robado estaba Kingdom Hearts,

    que atrae hacia sí una tremenda oscuridad

    e intenta llevar toda materia hacia sus

    profundidades.


    Los otros cinco han desaparecido.

    ¿Se habrán convertido en sincorazón

    al igual que Xehanort?


    ¿O se esfumaron después de que Xehanort

    se aprovechara de ellos?


    En mi búsqueda de la verdad, me he

    familiarizado con una ‛entidad’ inusual.


    Es el alma y el cuerpo que quedan

    cuando un ser pierde su corazón.


    Cuando nace un sincorazón, estos entes

    desaparecen del Reino de la Luz y renacen

    como seres enteramente nuevos en un

    reino completamente diferente.
- id: 14063
  text: Informe Ansem 7
- id: 14064
  text: >2

    Aunque los seres nacidos de la oscuridad y

    los que carecen de corazón pueden

    sentirse a gusto en los pasajes oscuros,

    éstos son peligrosos para todos. La

    oscuridad corroe el corazón.


    En busca de un lugar donde poder

    investigar, lejos de miradas indiscretas,

    llegué a Villa Crepúsculo.

    Es un sitio tranquilo y olvidado, en el

    abismo que hay entre la luz y la oscuridad.

    Me instalé en el sótano de una mansión

    abandonada, al amparo de un bosque.


    Mis investigaciones subterráneas me han

    deparado un descubrimiento tras otro.


    Cuando nace un sincorazón, el cuerpo y

    el alma abandonados renacen en este

    mundo como un ser diferente.


    Las intenciones de estos seres difieren de

    las de sus hermanos sincorazón, y aunque

    no está claro qué buscan estas "cosas"

    es posible que sean los responsables de

    muchas de las locuras de este mundo.


    Mi antiguo amigo el rey y sus súbditos

    están luchando contra los sincorazón, junto

    a un héroe portador de una llave espada, 

    pero una nueva amenaza se avecina.


    Una nueva amenaza... Seres que se han

    dado a sí mismos un nombre que considero

    apropiado.


    Son los ‛incorpóreos’.


    Un gran número de incorpóreos ha perdido

    su forma humana, como los sincorazón.

    Pero un incorpóreo nacido de alguien con

    un corazón fuerte retiene su forma, con

    cambios apenas visibles.


    Al parecer, mis detractores han conservado

    sus formas humanas como incorpóreos, y

    están reclutando más seguidores con la

    esperanza de promover un nuevo plan.


    La Organización {XIII}, formada por

    trece incorpóreos, con mis traidores como

    núcleo, se ha dividido en dos, y están

    llevando a cabo una especie de investigación.


    Me he propuesto descubrir sus planes,

    y para eso he decidido dirigirme

    adonde se encuentran seis de sus miembros.

    El lugar se alza por encima de los límites

    externos del reino que hay entre la

    oscuridad y la luz: el Castillo del Olvido.
- id: 14065
  text: Informe Ansem 8
- id: 14066
  text: >2

    Al parecer, me he dejado llevar por el

    comportamiento de Xehanort y sus

    seguidores, y por los hechos que

    ocurren en torno a ellos.


    La lucha de mis amigos por proteger el

    Reino de la Luz contra la amenaza de los

    sincorazón ha concluido. Al fin, el sincorazón

    de Xehanort que se hacía llamar Ansem, el

    buscador de oscuridad, ha sido derrotado.


    El otro portador de la llave espada, ese

    ‛héroe’, viajaba de mundo en mundo

    sellando las cerraduras y combatiendo a

    los sincorazón.


    Entretanto, el rey se había aventurado en 

    el Reino de la Oscuridad y trataba, junto al 

    elegido de la llave espada, cerrar la puerta

    a Kingdom Hearts. Así planeaba terminar

    con la amenaza de una tremenda oscuridad.


    Pero todavía hay un gran número de

    sincorazón en pie, y la Organización {XIII} y

    los incorpóreos continúan al acecho

    desde las sombras.


    Lo cierto es que el mundo sigue

    siendo un lugar muy peligroso.


    Debemos encontrar la manera de

    combatir a estos enemigos.


    Así podré reparar los daños que causé

    y lograr mi venganza.


    Esos son los motivos que me llevaron a

    infiltrarme en el Castillo del Olvido.


    El castillo consta de trece pisos y doce

    sótanos, y lo que hay en sus "salas

    blancas’ se transforma a la medida de los

    recuerdos de sus visitantes.

    Allí, la Organización {XIII} estaba

    realizando experimentos sobre la memoria.


    El sujeto de estas investigaciones, una

    chica llamada Naminé, parece poseer

    habilidades extremadamente inusuales.


    ¿Qué provecho querrán obtener

    de estos poderes?


    Sin querer entretenerme con la Organización

    {XIII}, regresé a mi propia

    investigación secreta, pero un nuevo

    visitante ha aparecido hoy en el castillo.


    Era Sora, el elegido de la llave espada.

    Llegó con sus compañeros tras haber

    vencido a Ansem.


    Desde las profundidades subterráneas,

    surgió el hedor de la oscuridad.


    Parece que nos encontraremos todos

    en el mismo sitio.
- id: 14067
  text: Informe Ansem 9
- id: 14068
  text: >2

    No esperaba menos de un elegido

    de la llave espada.


    Sora y sus amigos desafiaron la amenaza de

    la Organización {XIII} y rescataron a Naminé.


    Naminé era una bruja que controlaba las

    memorias de los otros.


    Muy probablemente haya conseguido estos

    poderes por algún proceso especial

    ocurrido durante su nacimiento.


    Naminé es un incorpóreo, creado cuando

    el corazón de una joven abandonó su cuerpo.


    Sin embargo, Naminé no tiene su

    sincorazón correspondiente.


    Esto se debe a que, en este caso, la 

    ‛joven’ era una princesa.


    Kairi, una habitante de Vergel Radiante,

    la ciudad que goberné, era una de las

    Siete Princesas que preservan el Reino

    de la Luz.


    Al no haber oscuridad en su corazón, Kairi

    no produjo un sincorazón, y en lugar de

    desvanecerse, su cuerpo permaneció en el

    Reino de la Luz.


    En otras palabras, el incorpóreo llamado

    Naminé y el sincorazón, prueba de un

    corazón perdido, son seres sumamente

    inestables que carecen del cuerpo necesario

    para crear un incorpóreo. Por lo tanto,

    tampoco poseen los recuerdos de Kairi. 

    Una explicación posible es que,

    cuando se separó de su cuerpo, el corazón

    de Kairi no volvió a la oscuridad, sino que

    migró a otra vasija... a lo profundo del

    corazón de Sora.


    Naminé es entonces un alter ego de la

    Kairi que afectó profundamente al

    corazón de Sora. ¿Será por esto que los

    recuerdos de Sora podían ser controlados,

    al igual que los de aquellos cuyos corazones

    están conectados con el de él?


    Ella es un ‛no ser’ en el sentido literal

    de la palabra; sin haberse convertido en un

    verdadero incorpóreo y sin tener adónde ir,

    Naminé es la más fugaz de las sombras.
- id: 14069
  text: Informe Ansem 10
- id: 14070
  text: >2

    Para poder recuperar los recuerdos perdidos

    en el Castillo del Olvido, Sora entró en un

    profundo sueño. Llevaría un buen tiempo

    recuperar los recuerdos que había

    acumulado a lo largo de su vida.


    Pero la Organización {XIII} dominaba

    el Castillo del Olvido.


    Era necesario que Sora permaneciera

    en un lugar más seguro.


    Persuadí a Naminé para trasladar al durmiente

    Sora a Villa Crepúsculo y poder velar por él.


    Naminé.


    Como ya he dicho, es un ser de

    lo más inusual.


    Nacida como un incorpóreo,

    pero sin sus atributos.


    Quizá continúa dibujando con la esperanza

    de capturar algo que no posee:

    recuerdos de otros, quizá los de Sora.


    He llegado a una conclusión.


    Creo que Naminé nació como un tipo

    especial de incorpóreo, cuando Sora se 

    atacó a sí mismo con la llave espada y

    provocó que su corazón y el de Kairi

    abandonaran sus cuerpos simultáneamente.


    Naminé surgió como un incorpóreo de Kairi,

    pero el cuerpo y el alma necesarios para

    existir como incorpóreo pertenecían a Sora.


    Cuando a una persona le roban el corazón,

    nace un sincorazón sin sentido de la identidad,

    y el cuerpo y el alma abandonados dan lugar

    a un incorpóreo.


    ¿Pero qué ocurre si uno voluntariamente

    libera su corazón de su cuerpo?


    Sora y Xehanort conservaron su individualidad

    incluso después de convertirse en sincorazón.


    Luego, tenemos a Kairi y a Naminé.


    Kairi era excepcional por no haber albergado

    oscuridad alguna en su corazón. También era

    excepcional que su corazón, una vez liberado,

    hubiera migrado a un nuevo receptáculo:

    Sora.


    La combinación de estas dos excepciones,

    teóricamente improbables, podría ser lo que

    explique esta anomalía.


    Hay asuntos que debo atender

    mientras Sora esté dormido.


    Un nuevo aliado ha entrado en escena:

    Riku.
- id: 14072
  text: ?????
- id: 14241
  text: El reencuentro
- id: 14242
  text: >-
    Al final del viaje, Riku, todavía con el aspecto

    de Ansem, se reúne con Sora y Kairi.
- id: 14243
  text: ¿Qué sucederá?
- id: 14244
  text: >-
    Cuando Kingdom Hearts explota, Riku

    recupera su verdadera apariencia.
- id: 14245
  text: La última puerta
- id: 14246
  text: >-
    Xemnas, el último miembro de la Organización

    {XIII}, se desvanece tras la puerta final.
- id: 14254
  text: Informe Ansem 11
- id: 14255
  text: >2

    En el Castillo del Olvido, me reencontré

    con un viejo amigo, pero no pude

    revelar mi identidad.


    Si él conociera la situación, probablemente

    intentaría disuadirme de llevar a cabo

    mi venganza.


    Realmente me encantaría conversar con él,

    como en los viejos tiempos... Pero ahora

    eso es solo un sueño vano.


    Mi amigo ha estado luchando en el Reino

    de la Oscuridad. Probablemente haya

    llegado allí a través de Ciudad de Paso.


    Como el Castillo del Olvido, ese lugar

    se asienta sobre el abismo que hay entre la

    luz y la oscuridad. Está hecho con restos de

    mundos cuyos corazones han caído en 

    manos de los sincorazón.


    Eventualmente, aquellos que escaparon

    a la destrucción de sus mundos se

    reencontraron allí.


    Este ‛intersticio’ es muy inestable y de

    cuando en cuando los pasajes de

    oscuridad abren caminos hasta aquí.


    Cuando un mundo desaparece, algunos de sus

    habitantes pueden llegar aquí a través de

    esos pasajes.


    Seguramente Sora atravesó estos mismos

    pasajes de oscuridad cuando llegó por

    primera vez a Ciudad de Paso.


    Parece que mi amigo, que luchaba en el Reino

    de la Oscuridad, apareció en el Castillo del 

    Olvido a través de un pasaje de oscuridad

    construido por la Organización {XIII}.


    Mi nuevo aliado, Riku, también regresó por

    uno de estos pasajes.


    Me juró que haría cualquier cosa por

    ayudar a su mejor amigo, Sora.


    Lo cierto es que los recuerdos de Sora han

    tardado en regresar.


    Y tuve que pedirle a Riku que me trajera a

    otro Sora: a su incorpóreo.


    Sora es indispensable para mis pretensiones.


    Necesito que el elegido de la llave espada

    surque el Reino de la Luz y derrote a la

    Organización {XIII}.
- id: 14256
  text: Informe Ansem 12
- id: 14257
  text: >2

    Además de Naminé, los incorpóreos pueden

    conservar los recuerdos de su vida como

    humanos. Pero Roxas, el incorpóreo de

    Sora, ha perdido la memoria.


    Esto probablemente se deba a que Sora

    fue un sincorazón durante muy poco tiempo.

    Sora recuperó su corazón y su forma

    humana inmediatamente después de que

    naciera su incorpóreo.


    Parece ser que Roxas es muy similar a Naminé.

    Naminé es el incorpóreo de Kairi, pero cobró

    vida a través del cuerpo y el alma de Sora.


    Del mismo modo, Roxas es el incorpóreo de

    Sora. Uno excepcional, ya que para recobrar la

    forma humana, el sincorazón de Sora usó

    el corazón de Kairi en lugar del suyo propio.


    Puede que los recuerdos de Sora tarden en

    recuperarse, porque todavía falta una mitad

    de él, es decir, Roxas.


    Debo convertir a Roxas en datos y

    devolverlo a Sora.


    Como era miembro de la Organización {XIII},

    fue extremadamente difícil lograr que Roxas

    cooperase. Roxas derrotó a mi aliado una vez.

    Pero en su segunda batalla, Riku se jugó la

    vida, usó el poder de la oscuridad y logró

    regresar trayendo a Roxas consigo.


    Pero la Organización {XIII} es una amenaza

    cada vez más cercana. Aquí, en Villa

    Crepúsculo, es donde Roxas renació como

    incorpóreo. 


    Aquí es donde Roxas se encontró por primera

    vez con la Organización {XIII} y donde se unió

    a sus filas. Sé que registrarán este lugar.


    Primero debo convertir todo Villa Crepúsculo

    en datos y construir una ‛réplica del mundo"

    en la memoria de Sora.

    Debo dejar a Roxas en ese mundo para

    que pase allí el resto de sus días y

    recuperar esos recuerdos.


    Hay poco tiempo.


    Los planes de la Organización también

    deben de estar avanzando a paso firme.
- id: 14258
  text: Informe Ansem 13
- id: 14259
  text: >2

    Sora despertará mañana.


    Mi larga e implacable venganza se

    acerca a su fin.


    Xehanort, el que me despojó de todo,

    no existe ya como sincorazón. Pero como

    líder de la Organización {XIII}, su ambición

    es, una vez más, capturar Kingdom Hearts,

    el más colosal de todos los corazones.


    Su sincorazón había intentado extraer

    la gran oscuridad de Kingdom Hearts,

    creada con los corazones de los mundos.

    Pero su incorpóreo casi ha terminado

    de reunir corazones humanos para

    que Kingdom Hearts los asimile.


    ¡Maldito necio!


    Solo queda un misterio por desvelar.


    ¿Cómo se las ingenió Xehanort para abrir

    la puerta que apareció en el sótano de mi

    castillo?


    No... Ahora que pronto todo llegará a

    su fin, no tendría sentido aventurarse

    en teorías.


    Roxas, Ansem, Naminé...


    Desafían toda lógica y sin embargo allí están:

    únicas excepciones a la regla.


    Las teorías que propusimos, tanto la

    Organización {XIII} como yo, han

    sido desmontadas por un puñado de

    individuos de gran corazón.


    Sora, Kairi, Riku.


    Ah, sí. Riku.


    Aunque su corazón tenía sus debilidades,

    que lo hicieron propenso a la oscuridad,

    supo encontrar apoyo en la esperanza que

    descubrió más allá del sufrimiento.


    Esa esperanza le permitió mantenerse firme,

    y que la oscuridad de su corazón pasara de

    ser un enemigo a convertirse en su mejor arma.


    Cuando todo esto acabe, mi más ferviente

    deseo es que él y Sora puedan regresar

    juntos a su isla.


    Si pudiera, me gustaría volver a Vergel

    Radiante, y una vez más contemplar

    la pureza del agua, las hermosas flores,

    las sonrisas esperanzadas de la gente.


    ¡Querido rey, amigo mío!


    Tengo el presentimiento de que, tarde

    o temprano, darás con estos veraces

    informes míos.


    ¡Cuánto me habría gustado volver a

    conversar contigo!


    ¡Qué tonto fui al obsesionarme con la

    venganza del modo en que lo hice!


    Espero que sepas perdonarme.
- id: 14260
  text: Informe Ansem 14
