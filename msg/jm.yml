- id: 19304
  text: Geni savi/Tret diví
- id: 19305
  text: >-
    Desenvolupament
     ⤷Tret
       Justícia Divina

    Notes:

    amb Tret ataques enemics llunyans

    del davant. Llences contínuament bales

    màgiques.


    Utilitza Justícia Divina per atacar

    tots els enemics propers a la vegada!


    Has de llençar els atacs ràpidament

    o l'efecte del límit s'aturarà!
- id: 19306
  text: Geni Mestre/Arcà
- id: 19307
  text: >-
    Desenvolupament
     Arcà
       ⤷Sacsejada

    Notes:

    amb Arcà ataques contínuament

    tots els enemics propers.


    Si la Sacsejada del Geni i en Sora

    té èxit,

    els enemics llunyans també patiran mal.

    Has de llençar els atacs ràpidament

    o l'efecte del límit s'aturarà!
- id: 19308
  text: Geni final/Infinitat
- id: 19309
  text: >-
    Desenvolupament
     Infinitat
       ⤷Descarrega

    Notes:

    Infinitat deslliga tot el poder de la

    clau espasa. En Sora es pot

    moure, així que no deixis d'atacar!


    Conclou la lluita amb Descàrrega.


    Has de llençar els atacs ràpidament

    o l'efecte del límit s'aturarà!
