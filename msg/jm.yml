  text: Total
- id: 19156
  text: Donald/Fantasia
- id: 19157
  text: >-
    Desenvolupament
     Cometa
       ⤷Pluja de estels

    Notes: La

    pluja d'estels és un moviment

    final que executa en Sora.

    Apropa't a l'enemic per assestar

    tants cops com sigui possible.


    En Sora pot moure's lliurement durant

    aquest límit, així que mantén-te a prop

    dels enemics i a l'atac!
- id: 19158
  text: Donald/Fulgor encegador
- id: 19159
  text: >-
    Desenvolupament
     Fulgor
       ⤷Fulgor+
          ⤷Fulgor++

    Notes:

    Amb Fulgor ataques els enemics que

    tens al davant, però no pots establir un

    objectiu ja que és un atac màgic.


    Amb Fulgor+ llença coets a l'enemic.

    Utilitza aquest atac després d'acumular

    diversos coets.


    Pots llençar Fulgor++ contra un grup

    d'enemics. A més de fer-ne mal al

    principal, faràs que els que

    l'envolten caiguin. En Sora pot moure's

    lliurement durant aquest límit, així que

    no et tallis i segueix atacant!
- id: 19162
  text: Goofy/Unitat
- id: 19163
  text: >-
    Desenvolupament
     Cop destructor
       ⤷ Duo mortífer
          ⤷ Impuls còsmic

    Notes:

    El Cop destructor és de curta durada,

    així que assesta'n tants com puguis.


    El Duo mortífer causa mal contínu

    i t'apropa a l'enemic.


    Executa els atacs ràpidament

    o l'efecte límit s'aturarà!
- id: 19164
  text: Bestia/Lluna udolaire
- id: 19165
  text: >-
    Desenvolupament
     Doble udol
       ⤷ Ullal fidel/Alarit
          ⤷ Udol final

    Notes:

    amb Udol colpeges repetidament, però

    té un abast reduït. 


    Ullal fidel infligeix mal als enemics

    propers amb una ona sònica.


    Utilitza tots dos atacs

    segons la situació.
- id: 19166
  text: Auron/A tot vent
- id: 19167
  text: >-
    Desenvolupament
     Bushido
       ⤷ Estrella fugaç/Càstig místic
          ⤷Espiral

    Notes:

    Alterna atacs entre l'Auron i en Sora. Després

    d'atacar l'Auron, l'ordre d'en Sora

    canvia. Utilitza'l immediatament!


    Aquest límit no permet que en Sora es mogui,

    així que centra't en l'ús de les ordres!
- id: 19168
  text: Mulan/Drac de foc
- id: 19169
  text: >-
    Desenvolupament
     Coet vermell
       ⤷ Llança ardent/Llengua ígnia
          ⤷ Meteor carmesí

    Notes:

    Si utilitzes Llança ardent i segueixes amb Llengua ígnia,

    obtindràs un fantàstic combo.


    En Sora pot volar durant aquest límit.

    Per moure's cap amunt i cap avall, utilitza {:icon dynamic-right-analog-up}{:icon dynamic-right-analog-down}.
- id: 19170
  text: Aladdin/Truc fantàstic
- id: 19171
  text: >-
    Desenvolupament
     Rabent
       ⤷Jugada veloç
          ⤷ Entabanador

    Notes:

    Quan utilitzis Rabent i Jugada veloç,

    apropa't a tants enemics

    com sigui possible i els colpejaràs tots.


    Tant l'Aladdin com en Sora poden utilitzar el

    joc ràpid, així que intenta alternar

    aquest atac i la batalla acabarà ràpidament.
- id: 19172
  text: Jack/Ovació
- id: 19173
  text: >-
    Desenvolupament
     A ballar!
       ⤷Al compàs/Sincronització
          ⤷Apoteosi

    Notes:

    Al compàs i Sincronització ataquen

    enemics que tinguis davant, així que

    apropa-t'hi per utilitzar aquests límits.


    Pots aconseguir molts punts per

    combos, ja que en Sora pot moure's.
- id: 19174
  text: Jack Sparrow/Illa del Tresor
- id: 19175
  text: >-
    Desenvolupament
     Fanfarronada
       ⤷Navalla/Sanguinari
          ⤷Trampa final

    Notes:

    Fanfarronada atreu els enemics cap a un lugar,

    i és molt útil en batalles contra grups.


    Després d'utilitzar Navalla, en Sora pot llençar

    Sanguinari per a atacs veloços.

    La clau per sortir-ne victoriós és

    alternar els atacs d'en Jack i en Sora.


    Aquest límit no li permet moure's, a en Sora,

    així que concentra't a utilitzar les ordres!
- id: 19176
  text: Simba/Orgull del Rei
- id: 19177
  text: >-
    Desenvolupament
     Furia felina
       ⤷Ullal Feroç/Urpa voraç
          ⤷Rugit noble

    Notes:

    Ullal Feroç i Urpa voraç són atacs

    ràpids que s'han d'executar repetidament

    tan aviat com comença el límit.


    No deixis de llençar aquests atacs fins

    que arribi el moment d'executar el

    moviment final, Rugit noble.
- id: 19178
  text: Tron/Compilació completa
- id: 19179
  text: >-
    Desenvolupament
     Configura
       ⤷Codi de clúster/Pols explosiu
          ⤷Reprograma

    Notes:

    utilitza Pols explosiu a curta distància

    i Codi de clúster per a enemics llunyans.

    Utilitza Codi de clúster durant Pols

    explosiu per obtenir més potència.


    Amb Reprograma continua la caça

    d'enemics després

    d'acabar el límit. Amb Atura es cancel・la l'atac.

    En Sora pot moure's, així

    que utilitza'l per repartir una bona

    quantitat de cops!
- id: 19180
  text: Riku/Sessió eterna
- id: 19181
  text: >-
    Desenvolupament
     Sessió
       ⤷Canó fosc/Sabre extrem
          ⤷ Mestre de Cors/XIII acers
             ⤷Armagedon

    Notes:

    Canó fosc i Sabre extrem

    ataquen un únic objectiu i són útils per

    derrotar enemics poderosos.


    Durant Mestre de Cors i

    XIII acers pots moure't, així que

    aprofita per guanyar punts!
- id: 19182
  text: Sora/Trio
- id: 19183
  text: >-
    Desenvolupament
     Trio
       ⤷Summum/Artema/Fusió extrema
          ⤷Inicia combo

    Notes:

    Després de seleccionar un atac, Inicia

    combo substituirà l'atac triat.

    Amb Inicia combo es llença el nombre total

    de cops fets pels altres tres atacs.

    Reserva Inicia combo fins a haver

    assestat molts cops amb els

    altres atacs!


    Pots utilitzar-lo quan en Sora és sol,

    però els seus dos amics no vindran a ajudar-lo.
- id: 19184
  text: '{:width 85}Peter Pan/País de Mai Més'
- id: 19185
  text: >-
    Desenvolupament
     Fada petita/Noi volador

    Notes:

    Agafa l'enemic i el porta en bandades!


    La fada petita causa un gran mal

    i llença els enemics enlaire.


    Noi Volador fa menys mal, però

    el fa constantment mentre

    arrossega els enemics. Utilitza l'atac

    adequat segons la situació.


    En Sora pot volar durant aquest límit.

    Per moure's cap amunt i cap avall, utilitza {:icon dynamic-right-analog-up}{:icon dynamic-right-analog-down}.

    Selecciona Atura per finalitzar el límit.
- id: 19186
  text: Chicken Little/Primera persona
- id: 19187
  text: >-
    Desenvolupament
     Boles/Focs

    Notes:

    pots disparar en primera persona

    amb en Sora i en Chicken Little en equip. El

    moviment de la càmera és clau.


    Estableix l'objectiu per llançar les pilotes.

    Si necessites aturar un enemic,

    pots utilitzar Focs.


    En Sora pot moure's durant aquest

    límit. Selecciona Atura per finalitzar.
- id: 19188
  text: Stitch/Ohana!
- id: 19189
  text: >-
    Desenvolupament
     Dispara/Ukelele
       ⤷Final

    Notes:

    el moviment de la càmera és clau

    per a aquest atac. Utilitza Dispara

    per atacar un enemic a la vista, i Ukelele per

    aturar a tothom.

    En Sora no pot moure's durant el

    límit, així que enfoca't en les

    ordres i la càmera!
- id: 19190
  text: Geni valent/Estocada sònica
- id: 19191
  text: >-
    Desenvolupament
     Estocada
       ⤷Repeteix

    Notes:

    amb Estocada ataques contínuament

    els enemics que tens al davant. Per causar

    més mal, continua utilitzant Repeteix.


    Has de llençar els atacs ràpidament

    o l'efecte del límit s'aturarà!
- id: 19194
  text: Goofy/Tornado fusió
- id: 19195
  text: >-
    Desenvolupament
     Gir Goofy
       ⤷Gir Goofy+
          ⤷Gir Goofy++

    Notes:

    Gir Goofy i Gir Goofy+ llencen molts

    cops, però tenen un rang reduït.

    Has d'apropar-te a l'enemic

    abans d'atacar.


    Pots moure't mentre executes el gir Goofy++,

     així que intenta

    atacar també els enemics propers.


    Executa els atacs ràpidament

    o l'efecte del límit s'aturarà!
