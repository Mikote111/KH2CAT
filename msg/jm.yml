- id: 19304
  text: Genio sabio/Tiro divino
- id: 19305
  text: >-
    Desarrollo
     Tiro
       ⤷Justicia divina

    Notas:

    con Tiro atacas hacia el frente

    a enemigos lejanos. Lanzas balas

    mágicas de modo continuo.


    ¡Usa Justicia divina para atacar a todos

    los enemigos cercanos a la vez!


    ¡Debes lanzar los ataques rápidamente

    o el efecto del límite cesará!
- id: 19306
  text: Genio maestro/Arcano
- id: 19307
  text: >-
    Desarrollo
     Arcano
       ⤷Sacudida

    Notas:

    con Arcano atacas continuamente a

    todos los enemigos cercanos.


    Si la Sacudida de Genio y Sora tiene

    éxito, también sufrirán daños los

    enemigos distantes.

    ¡Debes lanzar los ataques rápidamente

    o el efecto del límite cesará!
- id: 19308
  text: Genio final/Infinidad
- id: 19309
  text: >-
    Desarrollo
     Infinidad
       ⤷Descarga

    Notas:

    Infinidad desata todo el poder de la

    llave espada. Sora puede moverse,

    ¡así que no dejes de atacar!


    Concluye el combate con Descarga.


    ¡Debes lanzar los ataques rápidamente

    o el efecto del límite cesará!
