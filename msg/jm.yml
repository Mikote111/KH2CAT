- id: 18315
  text: >-
    Volien algú capaç de viatjar pel Regne

    de la Llum i destruir l'Organització {XIII}...

    Davant les càpsules, un home esperava.
- id: 18316
  text: Apropa't a l'home...
- id: 18317
  text: >2+


- id: 18400
  text: Enterramorts
- id: 18401
  text: >-
    S'apropa al seu enemic

    amb valentia, però abaixa la guàrdia

    després del seu atac.


    Quan es transforma en una

    làpida, invoca

    uns dimonis persistents. Intenta vèncer-lo

    abans que cridi

    aquestes molestes criatures.
