- id: 20296
  text: Quin trencaclosques vols veure?
- id: 20297
  text: Troba totes les peces i completa els trencaclosques!
- id: 20298
  text: "Troba totes les peces i completa\n els trencaclosques!\n \n- Troba les peces -\nEl primer que has de fer és buscar\nper tots els racons dels mons les peces\nque conformen el trencaclosques.\n \nAlgunes peces no seran accessibles al principi,\naixí que caldrà tornar-hi a mesura que\nles habilitats d'en Sora milloren.\n \n- Munta els trencaclosques -\nUn cop reuneixis totes les peces, és l'hora\nde la veritat: munta el trencaclosques!\n \n{:icon dynamic-dpad}: Mou cursor.\n{:icon dynamic-cross}: Tria/Deixa la peça.\n{:icon dynamic-circle}: Cancel・la.\n \nEn alguns trencaclosques, hauràs de\ngirar les peces amb {:icon dynamic-right-analog}.\n \nCompleta cadascun dels trencaclosques i obtindràs\nuna gran recompensa... a més de divertir-te!"
