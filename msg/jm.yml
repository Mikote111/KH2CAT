- id: 19579
  text: Sora
- id: 19580
  text: >-
    Un joven elegido por la llave espada,

    un arma de singular naturaleza.


    No hace mucho, Sora viajó con

    Donald y Goofy en busca de su

    querida amiga Kairi, que había

    desaparecido misteriosamente

    en la oscuridad.


    Al final, consiguieron salvar los

    mundos de la amenazadora

    oscuridad que se cernía sobre

    ellos.


    Más tarde, Sora quedó sumido

    en un profundo sueño.


    Ahora ha vuelto a despertar, pero

    ni siquiera es capaz de recordar

    por qué estaba dormido.
- id: 19599
  text: '{:unk 72}Golpes'
- id: 19616
  text: Peter Pan (1953)
- id: 19617
  text: Chicken Little (2005)
- id: 19625
  text: >-
    La paz vuelve a reinar en el castillo

    de Bestia. ¿Habrá hecho las paces con

    Bella?
- id: 19626
  text: ¡Dirígete al castillo de Bestia!
- id: 19627
  text: >+
    La paz volvía a reinar en el castillo...

    por ahora.

- id: 20056
  text: N.º {I}
- id: 20057
  text: "De rápidos movimientos y certeros\nataques, es el más duro de pelar\nentre los suyos.\n \nObtendrás puntos golpeándolo.\nSuele usar Finta, pero si contrarrestas\ncon Finta también, quedará expuesto."
- id: 20058
  text: N.º {II}
- id: 20059
  text: "Incansable sincorazón que no deja\nde lanzar proyectiles mágicos.\n \nObtendrás puntos esquivando sus\nproyectiles. Si en vez de eso se los\ndevuelves, ¡lograrás aún más puntos!"
- id: 20060
  text: N.º {III}
- id: 20061
  text: "Torpe sincorazón que va dejando\ncaer premios por doquier.\n \n¡No dejes que se pierda ni uno de ellos!"
- id: 20062
  text: N.º {IV}
- id: 20063
  text: "Sincorazón juguetón que adora jugar\nal \"Tú la llevas\" persiguiendo a Sora.\n \nCuando lo golpeas, en vez de rendirse\nconvoca a más de los suyos.\nNo te dejes atrapar y acaba con ellos\npara que no se multipliquen."
- id: 20064
  text: N.º {V}
- id: 20065
  text: "Duro de pelar, aprovecha para curarse\nmientras dormita.\n \nNo te dejes intimidar por su poder\nregenerativo y ataca con todo para\nevitar que recupere su VT."
- id: 20066
  text: N.º {VI}
- id: 20067
  text: "Este sincorazón se replica a sí mismo\ny lanza a sus copias al ataque.\n \nLa mejor estrategia es observar qué\nformación adopta junto a sus clones\ny actuar en consecuencia."
- id: 20068
  text: N.º {VII}
- id: 20069
  text: "Sincorazón belicoso que representa\nuna continua amenaza.\n \nNo dejará que te acerques a él,\npor lo que los ataques mágicos\na cierta distancia son la mejor\nopción para hacerle frente."
- id: 20070
  text: N.º {VIII}
- id: 20071
  text: "Este sincorazón se medio oculta en\nla tierra a la espera de que lo saquen.\n \nUna vez fuera, procura que no toque\nel suelo para darle una buena tunda."
- id: 20072
  text: N.º {IX}
- id: 20073
  text: "Bailarín nato que reacciona danzando\nen círculos cuando se le golpea.\n \n¡Atácalo sin cesar y no dejes que\npare de girar!"
- id: 20074
  text: N.º {X}
- id: 20075
  text: "Peculiar sincorazón que invoca\nréplicas para confundir a Sora.\n \nTendrás que discernir cuál es el\nverdadero para centrar tus ataques."
- id: 20076
  text: N.º {XI}
- id: 20077
  text: "No hay nada más intimidante que\nlos números, y este sincorazón lo\nsabe muy bien.\n \n¡Ataca sin pausa para hacer que el\ncontador llegue a cero y cesen\nsus problemas numéricos!"
- id: 20078
  text: N.º {XII}
- id: 20079
  text: "Sincorazón capaz de teleportarse\nde un lado a otro para atacar a Sora\ncuando está desprevenido.\n \nFijarlo como objetivo y los ataques\na distancia son la mejor opción\npara hacerle morder el polvo."
- id: 20080
  text: N.º {XIII}
- id: 20081
  text: "Misterioso sincorazón surgido\nde un fulgor casi divino.\n \nEncomendó a Sora el gran tesoro\nde sus antepasados como prueba\nde que el joven había salido victorioso\nen combate contra todos los suyos."
- id: 20092
  text: Consciencia latente
- id: 20093
  text: "Misterioso hombre que permanecía\nal otro lado del portal dimensional\nabierto en el Castillo Disney.\n \nEnfundado en una imponente\narmadura, su destreza\ncon la llave espada\nsupera incluso a la de Sora."
- id: 20130
  text: Metal cian
- id: 20131
  text: "Aunque no se mueve mucho,\nusa sus artes para atraer a sus\nrivales hacia sí.\n \nEs mejor no dejarle a sus anchas\ne ir a por él en cuanto aparezca.\nResiste bien la magia, así que usar\nla llave espada es lo recomendado."
- id: 20132
  text: Vikingo volador
- id: 20133
  text: "Arremete con ímpetu sin cesar, lo que\ncomplica atinar contra sus puntos\ndébiles. Para detenerle, usa magia.\n \n¡Aprovecha para contraatacar utilizando\nlos comandos de reacción!"
- id: 20134
  text: Espectro mágico
- id: 20135
  text: "Sincorazón que muestra dos rostros.\nCuando está en el aire, no sirve\nde nada atacarlo con la llave\n espada.\n \nLos hechizos harán que descienda\nal suelo. ¡Procura que se arrepienta\nde haber bajado!"
- id: 20136
  text: Anzuelo
- id: 20137
  text: "Utiliza sus rápidos movimientos\npara confundir a Sora. Usa Chillido\npara atraparlo y atacar con él\na los enemigos cercanos.\n \nEs inmune a los hechizos de Hielo."
- id: 20138
  text: Arcanista
- id: 20139
  text: "Poderoso sincorazón hechicero\ndiestro en los tres tipos de magia\nelemental básica.\n \nUsa su gran libro como escudo."
- id: 20140
  text: Maza férrica
- id: 20141
  text: "Da grandes saltos acompañados\nde ataques giratorios.\nMucho cuidado con la onda\nexpansiva que libera al aterrizar.\n \nJusto antes de empezar a atacar\nqueda expuesto. ¡Aprovéchalo!"
- id: 20142
  text: Chocador chiflado
- id: 20143
  text: "Sincorazón tan pesado que es\nimposible levantarlo del suelo.\nSe vuelve más agresivo cuando\nevitas sus ataques o te cubres.\n \nEs inmune al elemento Fuego,\npero los hechizos de Hielo te\ndarán muy buenos resultados."
- id: 20144
  text: Lanzador silente
- id: 20145
  text: "Observa atentamente a sus enemigos,\nlocaliza a los más débiles y centra\nsus proyectiles en él.\n \nEs inmune tanto al Fuego como\nal Rayo."
- id: 20146
  text: Temerario
- id: 20147
  text: >-
    Sincorazón incansable que no

    conoce la palabra "quietud".

    Se sirve de ataques giratorios

    y libera descargas eléctricas,

    hecho por lo que también es

    inmune al elemento Rayo.
- id: 20148
  text: Lancero audaz
- id: 20149
  text: "El soldado y su lanza no acaban\nde congeniar, así que es fácil\npillarle con la guardia baja.\nAtaca con tanta fuerza que\npuede hacer volar a Sora.\n \nArrebátale la lanza con\nQuitar lanza y úsala para atacar."
- id: 20150
  text: Necromante
- id: 20151
  text: "Diestro escapista, este sincorazón\ndesaparece a placer. Aunque en\nese estado no se puede fijar\nblanco en él, volverá a aparecer\nsi logras golpearle.\n \nCuando adopta la forma de una\nmáscara, anula todos tus ataques.\nQueda expuesto tras atacar."
- id: 20152
  text: Campeón aéreo
- id: 20153
  text: "Donde pone los ojos, pone\nlos guantes... ¡sin parar!\n \nSu repertorio de golpes cuenta\ncon tres tipos de puñetazos,\npero descubre su juego antes de\nlanzarlos. ¡Observa y reacciona!"
- id: 20160
  text: Sora
- id: 20161
  text: "Joven elegido por la llave espada\nque libra una ardua batalla contra\nlos sincorazón y los incorpóreos.\n \nAl pisar por primera vez Ciudad\nde la Navidad, la llave espada\nplasma su gran sorpresa dotándolo\ncon este peculiar aspecto."
- id: 20162
  text: Donald
- id: 20163
  text: "Es el Mago de la Corte en el\nCastillo Disney y acompaña a\nSora buscando al rey Mickey.\n \nAunque fue guardaespaldas\nde Santa Claus, parece no\nrecordar nada al llegar a\nCiudad de la Navidad."
- id: 20164
  text: Goofy
- id: 20165
  text: "Es el Capitán de los Caballeros\nReales del Castillo Disney y\nacompaña a Sora buscando\nal rey Mickey.\n \nSimpático y algo atolondrado,\nsiempre acompaña fiel a sus\nleales amigos."
