- id: 14620
  text: Conill 
- id: 14621
  text: >-
    En Conill està orgullós de les

    verdures que cultiva al seu hort

    , especialment les pastanagues. A en Pooh

    li agrada anar a visitar-lo, perquè

    sempre té mel per convidar.


    En Conill és molt treballador i

    no li fa gràcia que en Tigger

    salti tan a prop de les seves

    preuades pastanagues.
- id: 14627
  text: Torre de tensió
- id: 14628
  text: >-
    El seu nivell de defensa és molt bo

    i només la seva cara és vulnerable.

    Ataca'l implacablement!


    Si t'atrapa amb el seu làser, utilitza

    repetidament l'ordre de reacció

    Raig invers per escapar.

    Si ho aconsegueixes, una gran explosió

    causarà estralls entre els enemics

    propers.
- id: 14666
  text: ' '
- id: 14667
  text: La Bella Dorment (1959)
- id: 14756
  text: Pete
- id: 14757
  text: >-
    És el flagell del rei Mickey.

    Està reunint un exèrcit de

    sensecor i ajudant la Malèfica

    amb els seus plans per dominar

    tots els mons. També dona suport

    a l'Hades i els seus sensecor.
- id: 14758
  text: El fantasma de l'Scar
- id: 14759
  text: >-
    Després de la mort de l'Scar, aquest

    fantasma va començar a

    vagar per les Terres del Regne. 

    Sembla haver estat engendrat per

    la malícia del cor de l'Scar, i s'alimenta de

    la feblesa del cor d'en Simba.


    El fantasma podria ser un signe

    de mal presagi. En Simba encara

    no confia en ell mateix i els

    altres lleons estan cada

    vegada més preocupats.
- id: 14760
  text: Pirata zombi A
- id: 14761
  text: >-
    Un pirata maleït per l'or

    asteca. A la llum de la lluna,

    mostra un aspecte esgarrifós.
- id: 14762
  text: Pirata zombi B
- id: 14763
  text: >-
    Un pirata maleït per l'or

    asteca. A la llum de la lluna, es

    converteix en un esquelet i és

    vulnerable als atacs màgics.
- id: 14764
  text: Pirata zombi C
- id: 14765
  text: >-
    Un pirata maleït per l'or

    asteca. El capità Barbossa

    i ell busquen alguna cosa

    que acabi amb la maledicció.
- id: 14766
  text: Rei Mickey
- id: 14767
  text: >-
    El rei del Castell de Disney

    ha fet front a enormes perills

    en la seva solitària recerca dels

    secrets de l'Organització {XIII}.


    Sembla que sap alguna cosa sobre

    el que li va passar a en Riku, però

    sigui el que sigui, s'ho està

    guardant per a si mateix.
- id: 14768
  text: Ànsem el Savi
- id: 14769
  text: >-
    Qui es feia anomenar

    «DiZ» i amagava el rostre amb

    benes, va resultar ser

    l'Ànsem el Savi.


    El veritable Ànsem va iniciar

    estudis sobre

    els cors i els sensecor. Els va deixar per

    por que poguessin afectar

    l'ordre dels mons.

    En Xehanort, el seu aprenent, el va

    trair, en robar-li els seus

    estudis i el seu orgull.


    Des de llavors, l'Ànsem fruïa de

    desig de venjança. Quan

    va veure que en Riku havia sacrificat el seu

    cos per ajudar el seu amic

    Sora, es va emocionar i el seu

    cor va canviar...
- id: 14773
  text: Riku
- id: 14774
  text: >-
    És l'amic de la infància d'en Sora.

    Ha deixat que la foscor envaeixi el

    seu cos per aprendre a controlar-la

    i això ha canviat

    la seva aparença.


    No obstant això, en el moment en què el codificador del Kingdom Hearts

    de l'Ànsem real va explotar,

    en Riku va recuperar la seva

    forma original.


    Es podria dir que fou un

    miracle obrat per un cor indomable

    que ni tan sols la foscor va poder doblegar.
- id: 14775
  text: Xemnas
- id: 14776
  text: >-
    El núm. {I} de l'Organització {XIII}.

    És el líder del grup.


    En realitat és l'incorpori d'en

    Xehanort, l'antic aprenent de

    l'Ànsem el Savi. En secret, en

    Xehanort va estudiar les portes

    i el cor de tots els mons,

    fins i tot va usurpar el nom

    del seu mentor, Ànsem.

    Quan en Xehanort es va convertir

    en un sensecor, el seu incorpori,

    en Xemnas, va tornar a la vida.


    En Xemnas està utilitzant en Sora:

    reuneix els cors que ell allibera

    cada vegada que mata un sensecor

    amb la seva clau espasa.
- id: 14777
  text: Xigbar
- id: 14778
  text: >-
    El núm. {II} de l'Organització {XIII}.

    Quan en Sora el va cridar, pensant

    que era en Riku, en Xigbar va

    respondre fredament.


    Ignorem les seves motivacions i

    mètodes, tot i que sens dubte té

    un objectiu molt clar al cap. Quin?
- id: 14779
  text: Xaldin
- id: 14780
  text: >-
    El núm. {III} de l'Organització {XIII}.

    Volia fer-se amb el sensecor

    i l'incorpori de la Bèstia per

    aconseguir el Kingdom Hearts.


    Dominava el vent i brandia hàbilment

    sis llances... però en Sora va posar

    fi a les seves males accions.
- id: 14781
  text: Dèmyx
- id: 14782
  text: >-
    El núm. {IX} de l'Organització {XIII}.

    Utilitzava una mena d'instrument

    musical anomenat «sitar» per

    controlar l'aigua. No obstant això,

    no lluitava gaire bé.


    A en Dèmyx se li havia ordenat

    «alliberar la veritable naturalesa

    d'en Sora» mentre era al

    Coliseu de l'Olimp.
- id: 14783
  text: Luxord
- id: 14784
  text: >-
    El núm. {X} de l'Organització {XIII}.

    Un tafurer capaç de manipular

    el temps.


    Després de sorprendre en Sora i els

    seus amics amb les seves astutes

    paraules , en Luxord va tenir el

    plaer de lluitar contra ells en

    un joc estrany.


    A Port Royal, en Luxord va utilitzar

    els sensecor i les peces d'or

    maleït per experimentar en

    benefici de l'Organització

    i recollir més cors.
- id: 14785
  text: Pete
- id: 14786
  text: >-
    Des que en Mickey

    treballava en el seu vaixell de vapor,

    en Pete ha estat un

    malson per al rei.


    Ara en Pete s'ha aliat amb

    el capità Barbossa i els seus homes.

    Alguna cosa dolenta estarà tramant;

    d'això no n'hi ha dubte.
- id: 14787
  text: Ànsem el Savi
- id: 14788
  text: >-
    L'individu que es feia anomenar

    «DiZ» i amagava el rostre amb

    benes, va resultar ser 

    l'Ànsem el Savi.


    L'Ànsem real va iniciar

    estudis sobre els cors i

    els sensecor, però els va deixar per

    por que això pogués afectar

    l'ordre dels mons. 

    No obstant això, en Xehanort, el seu aprenent, el va

    trair, i li va robar els seus estudis i,

    amb ells, el seu orgull.


    Des de llavors, l'Ànsem fruïa de

    desig de venjança. L'exemple

    d'en Riku, que havia sacrificat el seu

    cos per ajudar el seu amic

    Sora, el va emocionar i el seu

    cor va canviar...
- id: 14789
  text: Moguris
- id: 14790
  text: >-
    Raça estranya que apareix als

    llocs més variats per obrir

    botigues.


    El Moguris odien que els toquin

    els pompons - com a tothom, no? -,

    però sembla que a tothom li

    agrada fer-ho. Potser per això

    ara gestionen les seves botigues

    amb hologrames, mentre es

    rasquen el ventre a casa.
- id: 14832
  text: Fetiller
- id: 14833
  text: >-
    El bruixot, un incorpori de classe

    alta, és immune a la màgia

    i ataca amb cubs invulnerables.


    Ves amb compte amb els cubs

    mentre ataques el seu cos. Quan hi hagis acabat,

    els cubs desapareixeran.
- id: 17244
  text: Pete
- id: 17245
  text: >-
    Capità d'un vaixell de vapor.

    És en Pete, però en el passat.

    Fa molt de temps, el rei Mickey

    treballava per a en Pete a la nau.


    Sona estrany, però en Pete

    ha robat el vaixell a sí mateix...

    Més aviat, el Pete del futur

    és qui ho va fer.
- id: 17246
  text: Malèfica
- id: 17247
  text: >-
    Aquesta poderosa bruixa és culpable

    dels estranys esdeveniments

    al Castell Disney. 


    La Malèfica vol

    dominar-lo peti qui peti.

    Per dur a terme el seu macabre pla

    , utilitzarà el poder de la foscor.
- id: 17248
  text: Banyera
- id: 17249
  text: >-
    La banyera per caminar que en Nyek, la Poll

    i en Puça utilitzen per transportar-se.

    És prou gran per portar-hi també

    els instruments que requereixen

    les seves entremaliadures.
- id: 17250
  text: Luxord
- id: 17251
  text: >-
    El núm. {X} de l'organització {XIII}

    és un mestre de la retòrica. Les seves

    paraules van desconcertar en Sora

    i els seus amics.


    En Luxord utilitzava l'or

    maleït per dur a terme experiments

    en nom de l'Organització.
- id: 17285
  text: >-
    La Kairi va aparèixer a Vila Crepuscle, però l'Axel

    se la va endur. Ens hem posat en marxa de nou confiant

    que el nostre camí ens hi portaria.
- id: 17286
  text: Enlaira't cap al següent món!
- id: 17287
  text: >-
    Hem trobat la porta del Regne de la

    Foscor a l'entrada del soterrani. La

    fortalesa de l'enemic ja no és lluny!
- id: 17288
  text: Endinsa't en la foscor!
- id: 17289
  text: >
    L'Axel va utilitzar les seves últimes forces per

    obrir un passadís cap a la foscor. La

    Kairi esperava a dins...
- id: 17290
  text: –––
- id: 17291
  text: >+
    La Kairi va arribar a Vila Crepuscle en

    busca d'en Sora, però l'Axel la va segrestar. Mentre en

    Sora cridava «He d'ajudar la Kairi!», el

    cristall del trofeu d'en Seifer va començar a

    brillar i es va obrir un nou camí.

    Sens dubte, el camí

    conduïa a la Kairi i en Riku... i convençuts d'això,

    en Sora i companyia es van posar en marxa.

- id: 17292
  text: >+
    L'entrada era una bretxa esfereïdora

    que es s'obria al soterrani de la mansió.

- id: 17293
  text: >+
    En Sora i els seus amics van entrar a la

    foscor, però van ser atacats per

    innombrables enemics. Va ser l'Axel

    qui va treure les castanyes del foc. Es

    va disculpar pel segrest de la Kairi i va lluitar

    fins al seu últim alè per eliminar

    els enemics. Quan en Sora li va preguntar

    per què ho havia fet, va dir abans de

    desaparèixer: «Volia veure en Roxas. Em

    feia sentir com si tingués cor».

    Tot i donar-hi la vida, l'Axel va utilitzar les

    seves últimes forces per obrir l'últim

    camí que en Sora havia de seguir: el camí

    que el portaria a la Kairi.

- id: 17923
  text: Kairi
- id: 17924
  text: >-
    És l'amiga de la infància d'en Sora

    i una de les Set Princeses que

    enllacen les claus i els panys.

    No recordava res d'en Sora,

    però com que ha recuperat els

    seus records, l'únic que vol és

    reunir-s'hi.


    Després de caure per un estrany

    forat de foscor, va arribar a

    Vila Crepuscle i es va fer amiga

    d'en Hayner, en Pence i l'Olette. 

    Aviat, l'Axel la va segrestar.


    La Kairi desitja amb tota la seva

    ànima tornar a veure el seu amic Sora.
- id: 17943
  text: Saïx
- id: 17944
  text: >-
    El núm. {VII} de l'Organització {XIII}.


    Seguia els passos de l'Axel renegat,

    però, per alguna raó, semblava més

    interessat en la seguretat d'en Sora.


    Saïx no té cor, però és un expert

    a fer mal al cor.

    Sens dubte, la seva fredor amaga el

    seu rostre més salvatge. Va insinuar

    que sabia quelcom d'en Riku.
- id: 18041
  text: Xehanort
- id: 18042
  text: >-
    El que una vegada va ser aprenent

    de l'Ànsem el Savi.


    Després de convertir-se en un

    sensecor, en Xehanort va continuar

    investigant les portes i el cor de

    tots els mons... sempre sota el

    nom d'«Ànsem», per descomptat.


    Mentrestant, en Xemnas, el seu

    incorpori, s'havia elevat al

    lideratge de l'Organització {XIII}.
- id: 18246
  text: >-
    Necessitem més diners per anar a la platja.

    En Hayner va dir que se n'encarregaria i

    va sortir pitant cap al Carrer del Mercat.
- id: 18247
  text: Ves al Carrer del Mercat!
- id: 18248
  text: >-
    La idea d'en Hayner era estalviar

    els calés junts per anar a la

    platja. Com? Fent feina.
- id: 18249
  text: Ves a l'estació amb els calés!
- id: 18250
  text: >-
    La idea d'en Hayner era estalviar

    els calés junts per anar a la

    platja. Com? Fent feina.
- id: 18251
  text: Ves a la taquilla!
- id: 18252
  text: >-
    De camí cap a l'estació, vaig veure una noia

    estranya. «Volia veure't almenys una vegada»,

    em va dir; i se'n va anar cap a la mansió embruixada.
- id: 18253
  text: Fes una ullada a la mansió!
- id: 18254
  text: >-
    Els monstres em van envoltar, però la veu

    de la noia em va xiuxiuejar que utilitzés la

    clau espasa. De sobte, vaig veure'm en un món de llum.
- id: 18255
  text: L'elecció és teva, endavant.
- id: 18256
  text: >-
    Després de derrotar criatures fosques

    amb la clau espasa,

    un cofre va aparèixer del no-res.
- id: 18257
  text: Obre'l, no mossega!
- id: 18258
  text: >-
    Tan bon punt va obrir el cofre, una

    enorme porta va aparèixer del no-res.
- id: 18259
  text: Endavant!
- id: 18260
  text: >-
    Bé, en Hayner i jo vam parlar, però

    el que va passar ahir ha refredat una mica les coses

    entre nosaltres. En fi, ja comença el torneig!
- id: 18261
  text: Consulta les normes del torneig!
- id: 18262
  text: >-
    Després de repassar les normes del torneig,

    la primera ronda anava a començar.
- id: 18263
  text: A lluitar! Parla amb l'organitzador.
- id: 18264
  text: >-
    Vaig derrotar en Hayner i vaig passar a la següent

    ronda, però semblava que hi havia quelcom

    estrany en el meu proper rival, en Vivi.
- id: 18265
  text: Les finals! Parla amb l'organitzador.
- id: 18266
  text: >-
    Tot i haver estat involucrat en

    esdeveniments estranys, finalment vaig aconseguir guanyar el

    torneig. I ara, a pel campió!
- id: 18267
  text: Pel títol! Parla amb l'organitzador.
- id: 18268
  text: >-
    Vam anar a l'Estació del Capvespre,

    a les Terrasses, per començar

    les nostres investigacions de les Set Meravelles.
- id: 18269
  text: Ves a l'Estació del Capvespre!
- id: 18270
  text: >-
    Els graons de

    pedra no tenien res de misteriós, així que vam començar a investigar la

    resta de les Set Meravelles a les Terrasses.
- id: 18271
  text: Investiga les Set Meravelles!
- id: 18272
  text: >-
    Per investigar la següent meravella,

    el misteri del tren fantasma, ens

    dirigim al Turó del Capvespre.
- id: 18273
  text: Ves al Turó del Capvespre!
- id: 18274
  text: >-
    Els meus amics en passaven, així

    que vaig anar sol a veure l'última de les

    meravelles: la mansió encantada.
- id: 18275
  text: Dirigeix-te a la vella mansió!
- id: 18276
  text: >-
    En tornar de la mansió, l'Olette va suggerir que ens

    trobéssim amb en Hayner a l'estació.

    Només ens quedaven dos dies de vacances...
- id: 18277
  text: Reuneix-te amb en Hayner a l'estació!
- id: 18278
  text: >-
    La ciutat també semblava diferent...De nou 

    lluitant amb l'Axel, vaig sentir una veu:
     «Roxas, vine a la mansió»!
- id: 18279
  text: Ves a la vella mansió!
- id: 18280
  text: >-
    Els enemics intentaven acorralar-me, però

    vaig confiar en els records que m'inundaven la

    ment i vaig obrir-ne l'entrada amb la clau espasa.
- id: 18281
  text: Descobreix de qui és la veu!
- id: 18282
  text: >-
    Vaig conèixer la Naminé a la vella mansió,

    però un misteriós home cobert de

    benes se la va endur. On han anat?
- id: 18283
  text: Busca pistes a la mansió!
- id: 18284
  text: >-
    Vaig examinar la mansió i vaig

    descobrir l'entrada a una habitació

    secreta de la biblioteca.
- id: 18285
  text: Explora el soterrani!
- id: 18286
  text: >-
    Vaig començar a recuperar els meus records

    perduts mentre era a la sala

    d'ordinadors.
- id: 18287
  text: Segueix avançant per la mansió!
- id: 18288
  text: >-
    L'Axel em va incitar a lluitar, però el vaig vèncer

    .«Et veuré en una altra vida», em va dir,

    mentre s'esvaïa en un forat negre.
- id: 18289
  text: Segueix avançant!
- id: 18290
  text: >-
    En Donald i en Goofy dormien tranquils

    a les seves càpsules. I hi havia una porta

    que portava més endins...
- id: 18291
  text: Endinsa't en les profunditats de la mansió!
- id: 18292
