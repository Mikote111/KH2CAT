- id: 14003
  text: Encara no hi ha res!
- id: 14051
  text: Informe Ànsem 1
- id: 14052
  text: >2

    Els meus esforços de tants anys han

    fruitat: el món que governo ha

    esdevingut un paradís digne de ser

    anomenat «Verger Radiant».


    Gràcies a la puresa de l'aigua, que és la

    font de la vida, les flors floreixen en

    abundància i tothom afronta els dies

    amb somriures d'esperança.


    Però arreu on hi ha llum, també s'hi

    amaga la foscor.


    Tal com vaig anunciar en el meu informe

    anterior, cerco aclarir el misteri de la

    «foscor del cor». El futur d'aquest

    paradís en depèn.


    Faré un experiment per estudiar les

    profunditats del cor humà. Un dels meus

    aprenents, en Xehanort, s'hi ha oferit

    com a voluntari.


    Aquest jove m'ha assistit des que el

    vaig rescatar de les portes de la

    mort, fa ja uns quants anys.


    En aquell moment, havia perdut tots els

    records, però llavors va mostrar una

    extraordinària inquietud intel・lectual.

    Aviat va assimilar els meus ensenyaments

    i va copsar una gran saviesa. Tot i que

    és comprensible que, per la seva edat,

    encara sigui immadur en alguns aspectes.


    Si puc explorar el cor d'en Xehanort amb

    proves psicològiques, potser podré recuperar

    els records que hi havia tancats. El meu

    aprenent, Even, també ha mostrat un gran

    interès pels records d'en Xehanort.


    Però, segur que és ell el subjecte que

    necessito? En Xehanort realment

    mostra un talent extraordinari...


    Massa extraordinari...

    Gairebé se'n podria dir sobrehumà...
- id: 14053
  text: Informe Ànsem 2
- id: 14054
  text: >2

    He comès un greu error.


    El meu estudi de la «foscor del cor»

    va començar com una simple prova psicològica

    i ràpidament va esdevenir un problema

    cada cop més gros.


    Encoratjat pel més jove dels meus alumnes,

    en Ienzo, vaig construir un enorme laboratori

    al soterrani del meu castell.


    Sense adonar-me'n, els meus sis aprenents

    havien començat a reunir un gran nombre de

    subjectes per dur a terme experiments

    perillosos sobre la «foscor del cor».


    Tan aviat com ho vaig saber, vaig reunir els

    meus aprenents i els vaig ordenar, no només

    l'aturada immediata dels seus estudis, sinó

    també la destrucció dels resultats obtinguts.


    Què dimonis passava als cors

    dels meus sis estimats deixebles?

    És possible que, mentre encalçaven el

    misteri de la foscor del cor, ells mateixos

    s'hagueren perdut en les seves profunditats?


    Encara que no són ells, sinó jo, el més neci

    per haver començat aquests experiments.


    No hauríem d'interferir en el fons dels

    cors dels altres, siguin quines siguin les 

    raons que ens puguin dur a fer-ho...


    El meu error va dur-me a la desesperació.


    Però un visitant d'un altre món

    em va calmar l'ànima abatuda.


    Un petit rei, anomenat Mickey, venia brandant

    la «clau espasa», una arma capaç de dur

    al món tant el caos com la prosperitat.


    La seva saviesa va sorprendre'm. La nostra

    amistat va crèixer gràcies a les nostres

    cordials converses.


    Gràcies al seu consell, vaig decidir revisar

    les dades que havia obtingut al meu

    laboratori subterrani.


    Va ser allà on vaig descobrir
    
    els «Informes Ànsem».


    Tot i que portaven el meu nom,

    només n'havia escrit el número 0.


    Pel que sembla, en Xehanort havia continuat

    escrivint els informes 1 a 8.


    Sí, el primer subjecte de les meves temeràries

    investigacions.
- id: 14055
  text: Informe Ànsem 3
- id: 14056
  text: >2

    El caos no només afecta aquest món,

    sinó tots els altres.


    Als «Informes Ànsem», que el meu aprenent

    Xehanort havia escrit sota el meu nom,

    vaig trobar els registres dels seus odiosos

    experiments, juntament amb les seves hipòtesis

    sobre una porta que havia sorgit

    a la foscor del meu soterrani.


    Tot el que viu té un cor, i tots

    els cors en tenen una part fosca al fons. Els


    mons no en són una excepció. Si un

    món és un ésser, el cor que conté ha de

    ser colossal...


    Així mateix, la foscor

    interior ha de ser monstruosa.


    Haurà en Xehanort traspassat la porta en un intent 

    d'entrar en contacte amb el regne de la foscor?


    Temo que sí. I no només en Xehanort.


    Pel que sembla, els meus altres cinc aprenents,

    convençuts que ho feien per recerca,

    van intentar veure-hi dins la foscor i

    hi van quedar atrapats.


    L'Even, l'Ienzo, en Braig, en Dilan, l'Aeleus...


    Tothom ha deixat de ser humà.


    A mi també se'm va arrabassar

    tot el que posseïa, desterrat a un regne balmat

    del no-res.


    Què espera guanyar en Xehanort robant-me

    l'existència?


    S'esvairà també l'alegria del meu poble?


    Si la llum de l'esperança s'ha extingit, a

    partir d'ara caminaré amb

    la foscor com a companya.


    Aquí, en aquest regne balmat al qual he estat relegat.


    Aquí, en aquesta foscor, enmig del no-res.


    «La foscor nul・la».


    El nom «Ansem» ja no em pertany.


    A partir d'ara, se'm coneixerà com a DiZ.


    I res no m'aturarà fins que no aconsegueixi la meva

    venjança.
- id: 14057
  text: Informe Ànsem 4
- id: 14058
  text: >2

    Els dies que vaig viure en aquell paradís

    encantador no són ja més que una il・lusió.


    Quant de temps he passat aquí,

    desterrat al regne del no-res?


    Només sostingut per la meva fúria i odi,

    he pogut preservar el meu sentit

    d'identitat en aquest lloc on tota

    existència queda anul・lada.


    El meu cor sucumbeix a l'odi dels meus

    deixebles, posseït per la foscor i per

    l'odi que em prové d'haver-me deixat

    trair tan ingènuament.


    Serà que aquesta foscor m'està devorant

    el cor?


    No puc seguir perdent el temps aquí.


    Què és el que en Xehanort i els altres

    pretenen fer?


    He de desentranyar el misteri d'aquests

    informes Ànsem, interceptar els meus

    deixebles i derrotar-los.


    Aquesta és la meva missió... És l'única

    manera de compensar el món per les

    meves faltes.


    Aquells éssers que no tenen cor

    n'han de ser la clau: els sensecor.


    La foscor del cor feta carn.

    Aquestes ombres maleïdes s'amaguen en

    els cors de tots els éssers vius, i a

    mesura que se n'apoderen, es multipliquen.


    D'on van sorgir i fins on arribaran?


    Tres elements es combinen per crear vida:

    un cor, una ànima i un cos.


    Però, què són el cos i l'ànima quan el

    cor s'ha perdut?


    El cos és el receptacle de l'ànima. Quan

    l'ànima abandona el cos, la vida resulta

    en la mort. Però què passa quan qui

    abandona el cos és el cor?


    Quan el cor abandona el cos, l'ésser

    no mor. Només és el cor, el que

    desapareix en la foscor.


    Queda poc temps.


    Si romanc en aquest regne, segurament

    n'aprendré les respostes de la manera

    més terrible i irremeiable.


    El meu cor ja és un altre presoner de la foscor.
- id: 14059
  text: Informe Ànsem 5
- id: 14060
  text: >2

    En aquest regne, on tota l'existència

    s'ha desintegrat, he aconseguit preservar

    el meu sentit d'identitat a través

    del pensament i l'escriptura.


    En aquest lloc, fins i tot el temps ha

    perdut el seu significat. Aquí l'eternitat

    és només un moment.


    He d'afanyar-me. Ben segur que

    els seus plans ja estan en marxa.


    Els sensecor han de ser la clau per

    desentranyar aquest misteri.


    Els sis traïdors treballaven en un

    laboratori que produïa sense aturador

    aquestes maleïdes ombres.


    No només van crear molts sensecor

    «pura-sang» a partir de cors vius,

    sinó que també van utilitzar-los

    per fabricar-ne versions artificials.


    Els sensecor artificials portaven insígnies

    i se'ls anomenava «Emblemes».


    Pura-sang o Emblemes, els actes d'aquests

    sensecor només obeeixen els seus instints.

    Les seves estretes ments detecten els cors

    i simplement s'hi apiloten.


    Un líder humà seria ineficaç: els

    sensecor li robarien fàcilment el cor i

    l'utilitzarien per augmentar les seves

    pròpies files.


    Però, i si un sensecor encara més

    fort és el que dona les ordres?


    Si algú es desprengués del seu cos i

    ànima i s'hi convertís, no seria capaç

    de controlar els que d'altra manera

    serien ingovernables sensecor?


    A més, no estaria planejant fer

    ús de l'instint d'aquestes criatures?


    Si els cercadors de cors tinguessin el

    punt de mira cap a un cor més gran i més

    poderós, el seu objectiu final seria més

    clar que l'aigua.


    El cor més gran és el del món.


    Això no és més que una conjectura,

    però sospito que els sensecor els

    està utilitzant per buscar el camí

    que condueix al cor del món.
- id: 14061
  text: Informe Ànsem 6
- id: 14062
  text: >2

    Unir-se a la foscor que regna enmig

    d'aquest no-res va ser un gran èxit.


    Tan aviat com em vaig atrevir a mirar

    endavant amb el cor tranquil, sense

    rebutjar ni témer la foscor, vaig

    obtenir un nou poder.


    Un poder sobrehumà: el poder de la foscor.


    És probable que en Xehanort i els altres

    hagin estat seduïts per aquest poder i

    potser n'han esdevingut presoners.


    Faré l'impossible perquè la foscor no

    devori el meu cor, com va devorar els

    seus.


    Amb aquest nou poder, vaig poder revelar

    el «passatge de la foscor» que connecta

    el regne del no-res amb el món exterior.

    Tot i que encara em costa anar-hi i

    venir-ne al meu caprici, el meu desterrament

    ja és cosa del passat.


    Per enganyar en Xehanort i els meus alumnes,

    el primer que vaig fer va ser utilitzar el

    meu nou poder i canviar la meva aparença

    abans de tornar al Regne de la Llum.


    Com havia suposat, en Xehanort

    s'havia tornat un sensecor.


    Sota el meu nom, va dirigir altres

    sensecor per tal d'arrabassar els

    cors de molts mons diferents.


    Al centre dels cors que en Xehanort

    havia robat hi havia el Kingdom Hearts,

    que atrau una tremenda foscor i

    intenta arrossegar tota la matèria

    cap a les seves profunditats.


    Els altres cinc han desaparegut.

    S'han tornat sensecor com en

    Xehanort?


    O van desaparèixer després que en

    Xehanort se n'aprofités?


    En la meva recerca de la veritat, he

    conegut una «entitat» inusual.


    Són l'ànima i el cos els que queden

    quan un ésser perd el cor.


    Quan neix un sensecor, aquest ens

    desapareix del Regne de la Llum i reneix

    com un ésser completament nous en un

    regne completament diferent.
- id: 14063
  text: Informe Ànsem 7
- id: 14064
  text: >2

    Tot i que els éssers nascuts de la

    foscor i els que no tenen cor poden

    sentir-se a gust als passatges foscos,

    són perillosos per a tothom. 

    La foscor corroeix el cor.


    A la recerca d'un lloc on poder

    investigar, lluny de mirades indiscretes,

    vaig arribar a Vila Crepuscle.

    És un lloc tranquil i oblidat, al

    llindar entre la llum i la foscor.

    Em vaig instal・lar al soterrani d'una

    mansió abandonada, encobrida per un bosc.


    Les meves investigacions clandestines

    m'han dut un descobriment rere l'altre.


    Quan neix un sensecor, el cos i

    l'ànima abandonats reneixen en aquest

    món com un ésser diferent.


    Les seves intencions difereixen dels

    seus germans sensecor, i encara que no

    està clar què busquen aquestes «coses»,

    és possible que siguin responsables de

    moltes de les bogeries d'aquest món.


    El meu vell amic el rei i els seus

    súbdits lluiten contra els sensecor,

    al costat d'un heroi que du una clau

    espasa, però una nova amenaça s'apropa.


    Una nova amenaça... Éssers que s'han

    autoanomenat amb un nom que considero

    oportú.


    Són els «incorporis».


    Un gran nombre d'incorporis han perdut

    la seva forma humana, com els sensecor.

    Però un incorpori nascut d'algú amb un

    cor fort conserva la seva forma, amb

    canvis poc visibles.


    Pel que sembla, els meus detractors han

    conservat les seves formes humanes com a

    incorporis i estan reclutant més seguidors

    amb l'esperança de promoure un nou pla.


    L'Organització {XIII}, formada per tretze

    incorporis, amb els meus traïdors al seu

    nucli, s'ha dividit en dos, i estan

    duent a terme una mena d'investigació.


    M'he proposat descobrir els seus plans,

    i per això he decidit anar on hi ha

    sis dels seus membres.

    El lloc s'eleva per sobre dels límits

    exteriors del regne entre la llum

    i foscor: el Castell de l'Oblit.
- id: 14065
  text: Informe Ànsem 8
- id: 14066
  text: >2

    Pel que sembla, m'he deixat portar pel

    comportament d'en Xehanort i

    els seus seguidors, i pels esdeveniments que

    ocorren al seu voltant.


    La lluita dels meus amics per protegir el

    Regne de la Llum contra l'amenaça dels

    sensecor ha acabat. Per fi, el sensecor

    Xehanort, que es feia dir Ànsem, el

    Cercador de la Foscor, ha estat derrotat.


    L'altre portador de la clau espasa, aquell

    «heroi», va viatjar de món en món

    segellant els panys i lluitant contra

    els sensecor.


    Mentrestant, el rei s'havia aventurat 

    al Regne de la Foscor i havia intentat, juntament amb l' 

    escollit de la clau espasa, tancar la porta

    del Kingdom Hearts. Així planejava posar fi

    a l'amenaça d'una tremenda foscor.


    Però encara hi ha un gran nombre de persones

    sensecor, i l'Organització {XIII} i

    els sensecor continuen a l'aguait des

    de les ombres.


    La veritat és que el món

    segueix sent un lloc molt perillós.


    Hem de trobar la manera de

    lluitar contra aquests enemics.


    Així podré reparar el mal que he causat

    i aconseguir la meva venjança.


    Aquests són els motius que em van dur a

    infiltrar-me al Castell de l'Oblit.


    El castell consta de tretze plantes i dotze

    soterranis, i el que hi ha a les seves «sales

    blanques» es transforma per adaptar-se als

    records dels seus visitants.

    Allà, l'Organització {XIII} estava

    duent a terme experiments sobre la memòria.


    L'objecte d'aquestes investigacions, una

    noia anomenada Naminé, sembla posseir

    habilitats extremadament inusuals.


    Quin benefici en voldran obtenir,

    d'aquests poders?


    No volia pas entretenir-me amb l'Organització

    {XIII}, així que vaig tornar a la meva pròpia

    investigació secreta, però avui ha aparegut un nou

    visitant al castell.


    És en Sora, l'escollit de la clau espasa.

    Ha arribat amb els seus companys després d'haver

    derrotat l'Ansem.


    Des de les profunditats subterrànies,

    va sorgir la pesta de la foscor.


    Sembla que tots ens

    trobarem al mateix lloc.
- id: 14067
  text: Informe Ànsem 9
- id: 14068
  text: >2

    No esperava menys d'un escollit

    de la clau espasa.


    El Sora i els seus amics van desafiar l'amenaça

    de l'Organització {XIII} i van rescatar la Naminé.


    La Naminé era una bruixa que controlava els

    records dels altres.


    És molt probable que hagi obtingut aquests

    poders per algun procés especial

    que es va produir durant el seu naixement.


    La Naminé és un incorpori, creada quan

    el cor d'una jove va deixar el seu cos.


    No obstant això, la Naminé no té el

    seu sensecor corresponent.


    Això és perquè, en aquest cas, la 

    «jove» era una princesa.


    La Kairi, habitant de Veger Radiant,

    la ciutat que jo governava, era una de les

    Set Princeses que conserven el Regne

    de la Llum.


    Sense foscor en el seu cor, la Kairi

    no va produir un sensecor, i en lloc 

    d'esvair-se, el seu cos va romandre en el

    Regne de la Llum.


    En altres paraules, l'incorpori anomenat

    Naminé i el sensecor, prova d'un

    cor perdut, són éssers extremadament

    inestables que no tenen el cos necessari

    per crear un incorpori. Per tant,

    tampoc posseeixen els records de la Kairi. 

    Una possible explicació és que,

    quan es va separar del seu cos, el cor

    de la Kairi no va tornar a la foscor, sinó que va

    emigrar a un altre receptacle... al fons del

    cor d'en Sora.


    La Naminé és llavors un alter ego de la

    Kairi que va afectar profundament

    el cor de Sora. Podria ser per això que

    els records de Sora es podien controlar

    , com els d'aquells que tenen el

    cor connectat amb el seu?


    Ella és un «no ser» en el sentit literal

    de la paraula; sense haver-se convertit en un

    veritable incorpori i no tenir enlloc on anar,

    la Naminé és la més fugaç de les ombres.
- id: 14069
  text: Informe Ànsem 10
- id: 14070
  text: >2

    Per tal de recuperar els records perduts

    al Castell de l'Oblit, en Sora va entrar en un somni

    profund. Caldria molt de temps per

    recuperar els records que havia

    acumulat al llarg de la seva vida.


    Però l'Organització {XIII} dominava

    el Castell de l'Oblit.


    Calia que en Sora romangués

    en un lloc més segur.


    Vaig convèncer la Naminé de traslladar el

    letàrgic Sora a Vila Crepuscle perquè pogués vigilar-lo.


    Naminé.


    Com ja he dit, és un ésser molt

    insòlit.


    Nascuda com a incorpori,

    però sense els seus atributs.


    Potser continua dibuixant amb l'esperança

    d'enxampar alguna cosa que no posseeix:

    records d'altres, potser els d'en Sora.


    He arribat a una conclusió.


    Em sembla que la Naminé va néixer com una espècie

    especial d'incorpori, quan en Sora es va 

    atacar a si mateix amb la clau espasa i

    va fer que el seu cor i el de Kairi

    abandonessin el seu cos simultàniament.


    La Naminé va sorgir com un incorpori de la Kairi,

    però el cos i l'ànima necessaris per

    existir com a incorpori pertanyien a en Sora.


    Quan el cor d'una persona és robat,

    neix un sensecor sense sentit de la identitat,

    i el cos i l'ànima abandonats esdevenen

    a un incorpori.


    Però què passa sí un allibera

    voluntàriament el seu cor del seu cos?


    En Sora i en Xehanort van conservar la seva individualitat

    fins i tot després d'esdevenir sensecor.


    Després tenim la Kairi i la Naminé.


    La Kairi era excepcional per no haver albergat cap

    foscor en el seu cor. També era

    excepcional que el seu cor, un cop alliberat,

    hagués migrat a un nou receptacle: 

    en Sora.


    La combinació d'aquestes dues excepcions,

    teòricament improbables, podria ser el que

    expliqui aquesta anomalia.


    Hi ha coses que he d'atendre

    mentre en Sora dorm.


    Un nou aliat ha entrat en escena:

    en Riku.
- id: 14072
  text: ?????
- id: 14241
  text: La retrobada
- id: 14242
  text: >-
    Al final del viatge, en Riku, encara semblant a l'

    Ànsem, es troba amb en Sora i la Kairi.
- id: 14243
  text: Què passarà?
- id: 14244
  text: >-
    Quan el Kingdom Hearts explota, en Riku

    recupera la seva veritable aparença.
- id: 14245
  text: L'última porta
- id: 14246
  text: >-
    En Xemnas, l'últim membre de l'Organització

    {XIII}, desapareix rere l'última porta.
- id: 14254
  text: Informe Ànsem 11
- id: 14255
  text: >2

    Al Castell de l'Oblit, em vaig reunir

    amb un vell amic, però no vaig poder

    revelar la meva identitat.


    Si conegués la situació, probablement

    intentaria dissuadir-me de dur a terme

    la meva venjança.


    M'encantaria xerrar amb ell,

    com als vells temps... Però ara allò només

    és un somni inútil.


    El meu amic ha estat lluitant al Regne

    de les Foscor. Probablement hi vas

    arribar a través de Ciutat de Pas.


    Igual que el Castell de l'Oblit, aquest lloc

    es troba a l'abisme entre la

    llum i la foscor. Està fet de restes de

    mons els cors dels quals han caigut en 

    mans dels sensecor.


    Eventualment, aquells que van escapar de

    la destrucció dels seus mons

    s'hi van reunir.


    Aquest «interstici» és molt inestable i de

    tant en tant els passatges de

    la foscor arriben fins aquí.


    Quan un món desapareix, alguns dels seus

    habitants poden arribar fins aquí a través d'

    aquests passadissos.


    Segurament en Sora va travessar algun d'aquests

    passatges de la foscor quan va arribar per

    primera vegada a Ciutat de Pas.


    Sembla que el meu amic, que lluitava al Regne

    de la Foscor, va aparèixer al Castell de

    l'Oblit a través d'un passatge de la foscor

    construït per l'Organització {XIII}.


    El meu nou aliat, en Riku, també va tornar per

    un d'aquests passatges.


    Em va jurar que faria qualsevol cosa per

    ajudar el seu millor amic, en Sora.


    La veritat és que els records d'en Sora han

    trigat a tornar.


    I vaig haver de demanar a en Riku que em portés

    un altre Sora: el seu incorpori.


    En Sora és indispensable per a les meves pretensions.


    Necessito que l'escollit la clau

    espasa vagi pel Regne de la Llum i derroti

    l'Organització {XIII}.
- id: 14256
  text: Informe Ànsem 12
- id: 14257
  text: >2

    Així com fa la Naminé, els incorporis també poden

    retenir records de la seva vida com a

    humans. Però en Roxas, l'incorpori d'en

    Sora, ha perdut la memòria.


    Això probablement es deu al fet que en Sora fou

    un sensecor durant molt poc temps.

    En Sora va recuperar el cor i la forma

    humana immediatament després de

    néixer el seu incorpori.


    Sembla que en Roxas és molt semblant a la Naminé. La

    Naminé és l'incorpori de la Kairi, però va cobrar

    vida a través del cos i l'ànima d'en Sora.


    De la mateixa manera, en Roxas és l'incorpori d'en

    Sora. Un d'excepcional, ja que per recuperar la

    forma humana, el sensecor d'en Sora

    va utilitzar el cor de la Kairi en lloc del seu. Els records d'en Sora


    poden trigar a

    recuperar-se, perquè en manca una meitat

    d'ell, és a dir, en Roxas.


    He de convertir en Roxas en dades i

    tornar-lo a en Sora.


    Com que era membre de l'Organització {XIII}, va

    ser extremadament difícil aconseguir que en Roxas

    cooperés. En Roxas va derrotar el meu aliat una vegada.

    Però a la seva segona batalla, en Riku va arriscar

    la seva vida, amb l'ús del poder de la foscor i va aconseguir

    tornar-ne amb en Roxas.


    Però l'Organització {XIII} és una amenaça

    creixent. Aquí, a Vila

    Crepuscle, és on en Roxas va renéixer com a

    incorpori. 


    Aquí és on en Roxas va topar per

    primera vegada amb l'Organització {XIII} i on

    s'hi allistà. Sé que registraran aquest lloc.


    Primer he de convertir tot Vila Crepuscle

    en dades i construir una «rèplica del món»

    a la memòria d'en Sora.

    He de deixar en Roxas en aquell món

    perquè pugui passar la resta dels seus dies allà i

    recuperar aquells records.


    Queda poc temps.


    Els plans de l'Organització també

    deuen estar avançant a bon ritme.
- id: 14258
  text: Informe Ànsem 13
- id: 14259
  text: >2

    En Sora es despertarà demà.


    La meva llarga i implacable venjança està

    arribant a la seva fi.


    En Xehanort, qui em desposseí de tot, ja

    no existeix com a sensecor. Però com a

    líder de l'Organització {XIII}, la seva ambició

    és, de nou, capturar el Kingdom Hearts,

    el més colossal de tots els cors.


    El seu sensecor havia intentat extreure

    la gran foscor del Kingdom Hearts,

    creada amb els cors dels mons.

    Però el seu incorpori gairebé ha

    acabat de reunir cors humans perquè el Kingdom Hearts

    els assimili.


    Maleït neci!


    Només queda un misteri per desvelar.


    Com va aconseguir en Xehanort obrir

    la porta que va aparèixer al soterrani del meu

    castell?


    No... Ara que tot acabarà aviat

    , no tindria sentit

    aventurar-se en teories.


    En Roxas, l'Ànsem, la Naminé...


    Desafien tota lògica i, així i tot, hi són:

    les úniques excepcions a la regla.


    Les teories que vam proposar, tant

    l'Organització {XIII} com jo mateix, han

    estat desmuntades per un grapat

    d'individus de gran cor.


    En Sora, la Kairi, en Riku.


    Ah, sí. En Riku.


    Tot i que el seu cor tenia les seves debilitats,

    que el feien propens a la foscor,

    va saber trobar suport en l'esperança que

    descobrí més enllà del sofriment.


    Aquesta esperança va permetre'l mantenir-se ferm,

    i la foscor del seu cor va passar de

    ser un enemic a convertir-se en la seva millor arma.


    Quan tot això hagi acabat, el meu

    desig més volgut és que ell i en Sora puguin tornar

    junts a la seva illa.


    Si pogués, m'agradaria tornar a Verger

    Radiant, i tornar a contemplar un cop més

    la puresa de l'aigua, les

    formoses flors, els somriures esperançadors de la gent.


    Estimat rei, amic meu!


    Tinc la sensació que, tard

    o d'hora, trobaràs aquests

    veraços informes meus.


    Tant de bo pogués haver tornat a

    conversar amb tu!


    Quina ximpleria la meva obsessió per

    la venjança de la manera que ho vaig fer!


    Espero que sàpigues perdonar-me.
