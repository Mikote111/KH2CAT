- id: 19328
  text: Ronda{:unk 72}
- id: 19372
  text: Sora
- id: 19373
  text: >-
    L'heroi escollit per la clau espasa i

    no fa gaire salvador de tots els mons.


    S'ha sumit en un son profund,

    en una misteriosa mansió,

    amb els seus amics Donald i Goofy.


    Sembla que ha crescut una mica

    mentre dormia.
- id: 19377
  text: Prova-ho una vegada.
- id: 19378
  text: Torna a intentar-ho
- id: 19493
  text: Deliri de carrer
- id: 19494
  text: Patí de sorra
- id: 19495
  text: Estil lliure
- id: 19496
  text: Taller delirant
- id: 19497
  text: Contrarrellotge
- id: 19579
  text: Sora
- id: 19580
  text: >-
    Un jove escollit per la clau espasa,

    una arma de naturalesa única.


    No fa molt, en Sora va viatjar amb en

    Donald i en Goofy a la recerca de la

    seva estimada amiga Kairi, que havia

    desaparegut misteriosament en la foscor.


    Al final, van aconseguir salvar els

    mons de l'amenaçadora foscor

    que se'ls apropava.


    Més tard, en Sora va

    caure en un son profund.


    Ara s'ha despertat de nou, però

    ni tan sols és capaç de recordar

    per què dormia.
- id: 19599
  text: '{:unk 72}Cops'
- id: 19616
  text: Peter Pan (1953)
- id: 19617
  text: Chicken Little (2005)
- id: 19625
  text: >-
    La pau torna a regnar al castell

    de la Bèstia. Has fet les paus amb la

    Bella?
- id: 19626
  text: Ves al castell de la Bèstia!
- id: 19627
  text: >+
    La pau tornava a regnar al castell...

    per ara.

- id: 20056
  text: Núm. {I}
- id: 20057
  text: "De ràpids moviments i precisos\natacs, és l'os més dur de rosegar\nentre els seus.\n \nGuanyaràs punts colpejant-lo.\nNormalment utilitza Finta, però si contrarestes\namb Finta també, quedarà exposat."
- id: 20058
  text: Núm. {II}
- id: 20059
  text: "Incansable sensecor que no para\nde llençar projectils màgics.\n \nGuanyaràs punts esquivant els\nseus projectils. Si en canvi se'ls retornes,\nobtindràs encara més punts!"
- id: 20060
  text: Núm. {III}
- id: 20061
  text: "Sensecor pocatraça que va deixant\ncaure premis per tot arreu.\n \nNo deixis que un d'ells es perdi!"
- id: 20062
  text: Núm. {IV}
- id: 20063
  text: "Sensecor enjogassat que li encanta jugar\nal \"Tocar i parar\" perseguint en Sora.\n \nEn colpejar-lo, en lloc de rendir-se\nconvoca més dels seus.\nNo et deixis atrapar i mata'ls\nperquè no es multipliquin."
- id: 20064
  text: Núm. {V}
- id: 20065
  text: "Os dur de rosegar, aprofita per curar-se\nmentre dormisqueja.\n \nNo et deixis intimidar pel seu poder\nregeneratiu i ataca amb tot per\nevitar que recuperi la seva VT."
- id: 20066
  text: Núm. {VI}
- id: 20067
  text: "Aquesta sensecor es replica a sí mateix\ni llença les seves còpies a l'atac.\n \nLa millor estratègia és mirar quina\nformació adopta juntament amb els seus clons\ni actuar en conseqüència."
- id: 20068
  text: Núm. {VII}
- id: 20069
  text: "Sensecor bel・licós que representa\nuna contínua amenaça.\n \nNo deixarà que t'hi apropis,\naixí que els atacs màgics\na una certa distància són els millors\nopció per fer-li front."
- id: 20070
  text: Núm. {VIII}
- id: 20071
  text: "Aquest sensecor es mig oculta en\nla terra a la espera que el treguin.\n \nUn cop fora, procura que no toqui\nel terra per donar-li un bon fart de llenya."
- id: 20072
  text: Núm. {IX}
- id: 20073
  text: "Ballarí nat que reacciona dansant\nen cercles quan se'l colpeja.\n \nAtaca-la sense parar i no deixis\nque pari de girar!"
- id: 20074
  text: Núm. {X}
- id: 20075
  text: "Peculiar sensecor que invoca\nrèpliques per confondre en Sora.\n \nHauràs de discernir quin és el\nvertader per centrar-hi els teus atacs."
- id: 20076
  text: Núm. {XI}
- id: 20077
  text: "No hi ha res més intimidant que\nels númers, i aquest sensecor ho\nsap molt bé.\n \nAtaca sense parar per fer que el\nel comptador arribi a zero i cessin\nels seus problemes numèrics!"
- id: 20078
  text: Núm. {XII}
- id: 20079
  text: "Sensecor capaç de teletransportar-se\nd'un lloc a l'altre per atacar en Sora\nquan no estigui a l'aguait.\n \nFixar-lo com a objectiu i els atacs\na distància són la millor opció\nper fer-lo arrossegar per terra."
- id: 20080
  text: Núm. {XIII}
- id: 20081
  text: "Misteriós sensecor sorgit\nd'un fulgor gairebé diví.\n \nVa confiar a en Sora el gran tresor\ndels seus avantpassats com a prova\nque el jove havia sortit victoriós\nen combat contra tots els seus."
- id: 20092
  text: Consciència latent
- id: 20093
  text: "Home misteriós que era a l'altre\ncostat del portal dimensional\nobert al Castell Disney.\n \nEnfundat en una imponent\narmadura, la seva destresa\namb la clau espasa\nsupera fins i tot la d'en Sora."
- id: 20130
  text: Metall cian
- id: 20131
  text: "Tot i que no es mou gaire,\nutilitza les seves arts per atreure\nels seus rivals cap a ell.\n \nÉs millor no deixar-lo fer i anar-li\nal darrere tan aviat com aparegui.\nResisteix bé la màgia, així que utilitzar\nla clau espasa es recomana."
- id: 20132
  text: Viking volador
- id: 20133
  text: "Arremet amb ímpetu sense parar,\ncosa que complica encertar\ncontra els seus punts dèbils. Per aturar-lo, utilitza màgia.\n \nAprofita per contraatacar utilitzant\nles ordres de reacció!"
- id: 20134
  text: Espectre màgic
- id: 20135
  text: "Sensecor que mostra dues cares.\nQuan és a l'aire, no serveix\nde res atacar-lo amb la clau\nespasa.\n \nEls encanteris faran que baixi a\nterra. Assegura't que es penedeixi\nd'haver baixat!"
- id: 20136
  text: Ham
- id: 20137
  text: "Utilitza els seus moviments ràpids\nconfondre en Sora. Utilitza Esgarip\nper atrapar-lo i atacar amb ell\nels enemics propers.\n \nÉs immune als encanteris de Glaç."
- id: 20138
  text: Arcanista
- id: 20139
  text: "Poderós sensecor fetiller\ndestre en els tres tipus de màgia\nelemental bàsica.\n \nUtilitza el seu gran llibre com a escut."
- id: 20140
  text: Maça fèrrica
- id: 20141
  text: "Fa grans salts acompanyats\nd'atacs giratoris.\nCal anar amb compte amb l'onada\nexpansiva que allibera en aterrar.\n \nJust abans de començar a atacar\nqueda exposat. Aprofita-ho!"
- id: 20142
  text: Xocador sonat
- id: 20143
  text: "Sensecor tan pesat que és\nimpossible aixecar-lo de terra.\nEs torna més agressiu quan\nevites els seus atacs o et cobreixes.\n \nÉs immune a l'element Foc,\nperò els encanteris de Glaç\ndonaran molt bons resultats."
- id: 20144
  text: Llançador silenciós
- id: 20145
  text: "Mira de prop els teus enemics,\nlocalitza els més febles i centra-hi\nels seus projectils.\n \nÉs immune tant al Foc com\nal Raig."
- id: 20146
  text: Temerari
- id: 20147
  text: >-
    Sensecor incansable que no

    coneix la paraula «quietud».

    Utilitza atacs rotatoris

    i allibera xocs elèctrics,

    per la qual cosa també és

    immune a l'element Raig.
- id: 20148
  text: Llancer atrevit
- id: 20149
  text: "El soldat i la seva llança no acaben\nde congeniar, així que és fàcil\ndescobrir-lo amb la guàrdia baixa.\nAtaca amb tanta força que\npot fer volar en Sora.\n \nArrabassa-li la llança amb\nRoba la llança i utilitza-la per atacar."
- id: 20150
  text: Nigromant
- id: 20151
  text: "Destre escapista, aquest sensecor\ndesapareix a voluntat. Tot i que en\naquell estat no s'hi pot fixar\nblanc, tornarà a aparèixer\nsi aconsegueixes colpejar-lo.\n \nQuan pren la forma d'una\nmàscara, anul・la tots els teus atacs.\nS'exposa després d'atacar."
- id: 20152
  text: Campió aeri
- id: 20153
  text: "On posa els ulls, hi posa\nels guants... sense parar!\n \nEl seu repertori de plantofades compta\namb tres tipus de cops de puny,\nperò descobreix el seu joc abans de\nllençar-los. Observa i reacciona!"
- id: 20160
  text: Sora
- id: 20161
  text: "Jove escollit per la clau espasa\nque lliura una àrdua batalla contra\nels sensecor i els incorporis.\n \nQuan trepitja per primer cop\nVila Nadal, la clau espasa\nencarna la seva gran sorpresa\namb aquest peculiar aspecte."
- id: 20162
  text: Donald
- id: 20163
  text: "És el Mag de la Cort al\nCastell Disney i acompanya\nen Sora buscant el rei Mickey.\n \nTot i ser guardaespatlles\ndel Pare Noel, sembla que\nno recorda res quan arriba\na Vila Nadal."
- id: 20164
  text: Goofy
- id: 20165
  text: "És el Capità dels Cavallers\nReials del Castell Disney i\nacompanya en Sora buscant\nel rei Mickey.\n \nSimpàtic i una mica estupefacte,\nsempre acompanya fidelment els\nseus lleials amics."
