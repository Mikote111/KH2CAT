- id: 20298
  text: "¡Encuentra todas las piezas y completa los puzles!\n \n- Encuentra las piezas -\nLo primero que debes hacer es buscar por\ntodos los rincones de los mundos las piezas\nque conforman el puzle.\n \nAlgunas piezas no serán accesibles al principio,\npor lo que será necesario volver a por ellas\na medida que mejoren las aptitudes de Sora.\n \n- Monta los puzles -\nUna vez reúnas todas las piezas, llega el momento\nde la verdad: ¡montar el puzle!\n \n{:icon dynamic-dpad}: mover el cursor.\n{:icon dynamic-cross}: seleccionar/colocar pieza.\n{:icon dynamic-circle}: cancelar.\n \nEn algunos puzles, tendrás que rotar las piezas\ncon {:icon dynamic-right-analog}.\n \nCompleta cada uno de los puzles y obtendrás\nuna magnífica recompensa... ¡además de divertirte!"
