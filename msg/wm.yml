- id: 7840
  text: '{:unk08 01 01 06}Hola, Sora! Com va?'
- id: 7841
  text: >-
    {:unk08 01 00 05}Ei! Què ha passat amb

    Vila Crepuscle?
- id: 7850
  text: '{:unk08 01 00 05}Eh?'
- id: 7859
  text: "{:unk08 01 00 05}Fixa-t'hi! Vila Crepuscle!"
- id: 7862
  text: >-
    {:unk08 01 01 06}El rei, el Riku... i ara

    he tornat a perdre la Kairi.
