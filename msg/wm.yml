  text: '{:unk08 01 01 05}Només un?'
- id: 18818
  text: "{:unk08 01 01 06}No n'hi ha prou amb això!"
- id: 18819
  text: >-
    {:unk08 01 00 05}Espereu!

    Em sembla que és un món que coneixem!
- id: 18820
  text: >-
    Utilitza {:icon dynamic-left-analog} per controlar la nau gumi.

    Intenta apropar-te a la ruta gumi amb forma de porta.

    Quan hi arribis, prem {:icon dynamic-triangle} per desembarcar-hi.{:clear }No pots desembarcar a mons no connectats per rutes gumi.

    Obre les rutes gumi per connectar els mons.
- id: 18821
  text: '{:unk08 01 01 06}Sí, ja la veig! Ha tornat!'
- id: 18822
  text: '{:unk08 01 01 05}Gràcies, nois.'
- id: 18823
  text: >-
    {:unk08 01 00 05}Oh, no! Baluard Balmat!

    Està sumit en la foscor!
- id: 18824
  text: >-
    {:unk08 01 01 06}És veritat, Xip!

    Què deu estar passant?
- id: 18825
  text: >-
    {:unk08 01 00 05}Sora! Hem d'esbrinar què

    passa immediatament!
- id: 18830
  text: "{:unk08 01 01 06}N'estàs segur? Deixa'm veure."
- id: 18831
  text: '{:unk08 01 00 05}Mira... Tot està ennuvolat i com borrós.'
- id: 18832
  text: '{:unk08 01 01 06}Ja, però tot segueix ennuvolat i com borrós.'
- id: 18833
  text: '{:unk08 01 00 05}Mmm... Bé, una cosa sí que és clara.'
- id: 18834
  text: >-
    {:unk08 01 00 05}I passa alguna cosa rara amb Vila Crepuscle.

    N'estic veient dues!
- id: 18835
  text: >-
    {:unk08 01 01 06}Mira! Una altra pujada enorme d'energia!

    I ve del mateix punt, prop de la ciutat.
- id: 18865
  text: >-
    {:unk08 01 01 06}Ei, un moment...

    La nau s'està movent sola?
- id: 18885
  text: >-
    Utilitza {:icon dynamic-left-analog} per controlar la nau gumi.

    Intenta apropar-te al món que hi ha a la part inferior de la pantalla.

    Quan hi arribis, prem {:icon dynamic-triangle} per aterrar-hi.
- id: 18886
  text: >-
    {:unk08 01 00 05}Sip, sembla que ens dirigim

    a Baluard Balmat.
- id: 18890
  text: '{:unk08 01 01 06}Serà alguna fallada...'
- id: 18891
  text: '{:unk08 01 00 05}No sé jo...'
- id: 18892
  text: '{:unk08 01 01 06}Quina cosa?'
- id: 18893
  text: >-
    {:unk08 01 00 05}Que quan el Sora,

    el Donald i el Goofy surten a ajudar

    la gent, el senyal es fa més fort.
- id: 18894
  text: '{:unk08 01 01 06}Vaja! Per què serà?'
- id: 18895
  text: >-
    {:unk08 01 00 05}Sora! Nosaltres intentarem esbrinar

    alguna cosa més sobre el senyal.
- id: 18896
  text: '{:unk08 01 01 06}Mentrestant, vosaltres seguiu buscant per allà!'
- id: 18897
  text: '{:unk08 01 00 05}Comptem amb vosaltres, nois!'
- id: 18898
  text: >-
    {:unk08 01 00 05}No sé molt bé què passa, nois,

    però em temo que s'està muntant un

    bon embolic a Vila Crepuscle!
