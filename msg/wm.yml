- id: 19329
  text: >-
    {:unk08 01 00 05}Suposo que a vegades l'ajuda

    sorgeix de llocs inesperats.
- id: 19330
  text: '{:unk08 01 01 06}I tant.'
- id: 19331
  text: >-
    {:unk08 01 00 05}Una foto i un gelat? Uhm...

    Semblen una mena de pista.

    I... qui ens l'haurà deixada?
- id: 19332
  text: '{:unk08 01 01 06}El Riku?'
- id: 19333
  text: '{:unk08 01 00 05}Tu creus?'
- id: 19334
  text: '{:unk08 01 01 06}Alguna cosa em diu que sí.'
- id: 19335
  text: '{:unk08 01 01 06}Mireu! Gairebé hi hem arribat!'
- id: 19336
  text: >-
    {:unk08 01 01 06}Ei, i si tornen els sensecor?

    No puc utilitzar la clau espasa... això

    només beneficiaria l'Organització.
- id: 19337
  text: >-
    {:unk08 01 00 05}Però Sora, has de fer-la servir.

    Si no lluitem, els sensecor

    seguiran fent mal a la gent.
- id: 19382
  text: '{:unk08 01 01 06}Oh, oh. No podem seguir.'
- id: 19383
  text: >-
    {:unk08 01 00 05}Òndia! Potser s'ha encallat

    la porta o alguna cosa.
- id: 19384
  text: '{:unk08 01 00 05}Eh? Vols tornar a Vila Crepuscle?'
- id: 19385
  text: '{:unk08 01 01 06}Vinga! Hem de seguir endavant!'
- id: 19386
  text: Com? No ho entenc. No ens hi deixa anar.
- id: 19387
  text: S'haurà trencat res?
- id: 19469
