- id: 18107
  text: Cancel・la
- id: 18410
  text: >-
    {:unk08 01 00 05}Som els teus mecànics gumi preferits,

    a punt per treballar. Xip...
- id: 18411
  text: '{:unk08 01 01 06}I Xop!'
- id: 18412
  text: Bon viatge!
- id: 18413
  text: '{:unk08 01 01 06}Ha desaparegut?'
- id: 18414
  text: '{:unk08 01 01 06}No estiguis trist!'
- id: 18415
  text: >-
    {:unk08 01 00 05}El Donald té raó! Tu ets

    la clau que connecta tot.
- id: 18416
  text: '{:unk08 01 01 06}Llavors tot és culpa meva.'
- id: 18417
  text: >-
    {:unk08 01 00 05}Òndia! Jo no volia dir allò.

    Tu segueix el teu instint i

    segur que els trobem.
- id: 18418
  text: '{:unk08 01 01 06}Ben dit!'
- id: 18426
  text: >-
    {:unk08 01 00 05}Atents! Estic detectant

    un senyal molt estrany.
- id: 18427
  text: >-
    {:unk08 01 00 05}És aquell estrany senyal d'abans.

    Veus? Sabia que no era una fallada.
- id: 18428
  text: '{:unk08 01 00 05}Què és allò? Aquella cosa tan... gran.'
- id: 18429
  text: >-
    {:unk08 01 01 06}Pot ser que sigui l'origen d'aquell

    senyal tan estrany que hem detectat.
