- id: 19525
  text: El nou coliseu?
- id: 19526
  text: >-
    Ha començat un estrany torneig.

    {:width 90}El Dolor i el Pànic han de saber-ne més...
- id: 19527
  text: La Copa Cèrber ha començat!
- id: 19528
  text: >-
    Un torneig amb rivals molt desafiants.

    Parla amb el Pànic per apuntar-t'hi!
- id: 19529
  text: La Copa Tità ha començat!
- id: 19530
  text: >-
    Aquest torneig és una mica estrany.

    Parla amb el Pànic per apuntar-t'hi!
- id: 19531
  text: Comença la Copa Deesa del Destí!
- id: 19532
  text: >-
    Aquest torneig desafia la teva destresa.

    Parla amb el Pànic per apuntar-t'hi!
- id: 19533
  text: '{:width 95}La Copa Paradoxa del Dolor i el Pànic!'
- id: 19534
  text: >-
    {:width 95}Diuen que hi ha un torneig secret.

    Parla amb l'Hades per apuntar-t'hi!
- id: 19535
  text: '{:width 95}Comença la Copa Paradoxa del Cèrber!'
- id: 19536
  text: >-
    Quina classe de torneig és aquest...?

    Parla amb l'Hades per apuntar-t'hi!
- id: 19537
  text: '{:width 95}Comença la Copa Paradoxa del Tità!'
- id: 19538
  text: >-
    {:width 95}En aquest torneig, els rivals són molt

    forts! Parla amb l'Hades per apuntar-t'hi!
- id: 19539
  text: "{:width 95}Comença la Copa Paradoxa de l'Hades!"
- id: 19540
  text: >-
    Aquest és el torneig més difícil de tots.

    Parla amb l'Hades per apuntar-t'hi!
- id: 20527
  text: Explora la Gruta de l'Evocació!
- id: 20528
  text: Explora la masmorra de davant del castell!
- id: 20529
  text: Endinsa't a les entranyes de la gruta!
- id: 20530
