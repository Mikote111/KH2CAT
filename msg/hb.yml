- id: 2935
  text: '{:unk06 02}{:unk13 A4 01 78 00}{:unk08 03 00 05}Ho hem aconseguit!'
- id: 2936
  text: >-
    {:unk13 96 00 3C 00}{:unk08 01 01 06}On heu

    estat?
- id: 2937
  text: '{:unk13 A4 00 3C 00}{:unk08 01 01 05}A veure, eh...'
- id: 2938
  text: >-
    {:unk13 B9 00 3C 00}{:unk08 01 01 05}Dins d'aquest ordinador

    hi ha un... món...{:clear }... on hi viuen uns... eh...

    programes i...
- id: 2939
  text: >-
    {:unk13 91 00 50 00}{:unk08 01 01 07}En altres paraules...{:clear }Sense la contrasenya

    no es pot accedir

    a les dades de...{:clear }les investigacions

    de l'Ànsem.
- id: 2940
  text: '{:unk13 87 00 73 00}{:unk08 01 01 06}Crec que sí.'
- id: 2941
  text: >-
    {:unk13 A6 00 43 00}{:unk08 01 01 06}Però ja vau acabar

    amb l'Ànsem...
- id: 2942
  text: >-
    {:unk13 90 01 9B 00}{:unk08 01 00 05}Òndia, pot ser

    que mai trobem

    la contrasenya.
- id: 2943
  text: '{:unk13 C8 00 32 00}{:unk08 01 01 06}O sigui...'
- id: 2944
  text: >-
    {:unk13 82 00 46 00}{:unk08 01 01 07}És com buscar una

    agulla en un paller.
- id: 2947
  text: '{:unk13 54 01 B4 00}{:unk08 01 00 05}Ella mai es rendirà...'
- id: 2948
  text: '{:unk06 02}{:unk13 72 01 C8 00}{:unk08 03 00 05}I nosaltres tampoc!'
- id: 2949
  text: >-
    {:unk13 C9 00 89 00}{:unk08 01 01 05}Som-hi, hem de trobar

    aquella contrasenya!
- id: 2950
  text: >-
    {:unk13 4A 01 50 00}{:unk08 01 00 05}Sí. Li ho vam

    prometre al Tron.
- id: 2952
  text: Què són aquests gargots?
- id: 2953
  text: Baluard... {:delay 5F 00}{:clear }{:delay 3C 00}Central... {:delay 4B 00}{:clear }{:delay 3C 00}{:clear }Seguretat, Tron... {:delay C8 00}{:clear }{:delay 37 00}{:clear }«Door to...
- id: 2954
  text: Sembla un diagrama o una cosa així.
- id: 2955
  text: '«Door To... Darkness»?'
- id: 2956
  text: Oh!
- id: 2957
  text: D!{:delay 2D 00}{:clear }{:delay 23 00}{:clear }T!{:delay 2D 00}{:clear }{:delay 23 00}{:clear }D!
- id: 2958
  text: DTD!
- id: 2959
  text: Què passa?
- id: 2960
  text: >-
    Mira això! Deu ser

    l'entorn de dades!{:delay B4 00}{:clear }{:delay 25 00}{:clear }DTD! No ho veus?

    Les sigles de «Door To Darkness»!
- id: 2961
  text: >-
    És clar! Però...

    ens segueix faltant la contrasenya.
- id: 2962
  text: >-
    Ei, nanos. Digueu-me.

    Algú ha dit «Door to Darkness»?
- id: 2963
  text: Majestat!
- id: 2964
  text: Us estàvem buscant!
- id: 2965
  text: >-
    Shhh! {:delay 23 00}{:clear }{:delay 50 00}{:clear }L'Organització podria

    estar escoltant-nos!
- id: 2966
  text: Parlàveu de la Porta a la Foscor?
- id: 2967
  text: Oh, és clar, senyor.{:delay 50 00}{:clear }{:delay 33 00}{:clear }Busquem la contrasenya secreta.
- id: 2968
  text: Contrasenya?
- id: 2969
  text: Ah, suposo que vols dir una clau.
- id: 2970
  text: >-
    Aviam, la Porta a la Foscor

    només pot obrir-se{:delay A3 00}{:clear }quan es reuneixen les Set Princeses.{:delay 6E 00}{:clear }Que són Blancaneus, Jasmín, Bella...
- id: 2971
  text: És clar...
- id: 2972
  text: Què és el que voleu fer?
- id: 2973
  text: >-
    Amb aquella contrasenya podriem

    accedir a les investigacions de l'Ànsem.
- id: 2974
  text: >-
    Això vol dir...

    que potser descubriu el seu parador!
- id: 2975
  text: >-
    Deixi's de bromes, Majestat. {:delay 64 00}{:clear }{:delay 0F 00}{:clear }Ja vam derrotar l'Ànsem,

    i vos ho sabeu.
- id: 2976
  text: >-
    Em sembla que tinc

    molt per explicar-vos.
- id: 2977
  text: Som tot orelles, Majestat!
- id: 2978
  text: >-
    Està bé, però abans

    tinc una pregunta...
- id: 2979
  text: Nois... no està el Tron esperant-vos?
- id: 2980
  text: >-
    No us preocupeu,

    no aniré enlloc.{:delay 8B 00}{:clear }Si aquells sensecor ataquen, seré aquí

    i m'ocuparé de fer-los-hi front.
- id: 2981
  text: És clar! Nosaltres també.
- id: 2982
  text: Llavors ja parlarem després.
- id: 2983
  text: Us ho prometo!
- id: 2984
  text: Ens veurem més tard!
- id: 2985
  text: ''
- id: 2986
  text: Cel・la
- id: 2987
  text: Torre I/O
- id: 2988
  text: "{:width 90}Nucli de l'ordinador central"
- id: 2989
  text: 'Guia de la cel・la #0'
- id: 2990
  text: 'Guia de la cel・la #1'
- id: 2991
  text: 'Guia de la cel・la #2'
- id: 2992
  text: 'Guia de la torre #0'
- id: 2993
  text: 'Guia de la torre #1'
- id: 2994
  text: 'Guia de la torre #2'
- id: 2995
  text: "Guia del nucli de l'ordinador central #0"
- id: 2996
  text: "Guia del nucli de l'ordinador central #1"
- id: 2997
  text: "Guia del nucli de l'ordinador central #2"
- id: 2998
  text: Sí
- id: 2999
  text: No
- id: 3000
  text: Selecciona una destinació.
- id: 3001
  text: Vols transportar-t'hi?
- id: 7525
  text: No es pot anar per aquí.
- id: 8067
  text: Derrota tots els incorporis!
- id: 8068
  text: >-
    Derrota tots els incorporis!

    Si utilitzes les ordres de reacció

    amb {:icon dynamic-triangle}, la batalla serà més fàcil!
- id: 8069
  text: Derrota tots els incorporis i protegeix les portes!
- id: 8070
  text: >-
    Lluita junt amb el Léon i venç tots els

    incorporis mentre protegeixes les portes!

    La batalla acaba si es buida l'indicador!
- id: 8071
  text: Derrota tots els enemics!
- id: 8072
  text: >-
    Derrota tots els enemics!

    Si utilitzes les ordres de reacció

    amb {:icon dynamic-triangle}, la batalla serà més fàcil!
- id: 8073
  text: Derrota tots els enemics!
- id: 8074
  text: Derrota tots els enemics!
- id: 8075
  text: Derrota tots els sensecor!
- id: 8076
  text: >-
    Lluita junt amb els teus

    amics i derrota els sensecor!
- id: 8077
  text: Estàs atrapat! Derrota tots els sensecor per escapar!
- id: 8079
  text: Estàs atrapat! Derrota tots els sensecor per escapar!
- id: 8081
  text: Estàs atrapat! Derrota tots els sensecor per escapar!
- id: 8083
  text: Derrota tots els enemics!
- id: 8084
  text: >-
    Derrota tots els enemics!

    Si utilitzes les ordres de reacció

    amb {:icon dynamic-triangle}, la batalla serà més fàcil!
- id: 8085
  text: Derrota els sensecor!
- id: 8086
  text: Utilitza les defenses de la ciutat per derrotar els sensecor!
- id: 8087
  text: Derrota els sensecor!
- id: 8088
  text: >-
    Lluita junt amb els teus

    amics i derrota els sensecor!
- id: 8148
  text: >-
    Un moment... Creia que tot

    estava sota control per aquí!
- id: 8149
  text: Eh, mireu!
- id: 8150
  text: >-
    Una altra cop l'Organització {XIII}.

    Hem d'anar a veure el Léon.
- id: 8151
  text: '{:unk13 90 01 18 01}{:unk08 01 00 01}Endavant!'
- id: 8152
  text: >-
    {:unk13 A0 00 6E 00}{:unk08 01 01 05}Un moment...{:clear }Què li ha passat

    a aquest lloc?
- id: 8153
  text: >-
    {:unk13 79 01 E1 00}{:unk08 01 00 04}Aquells sensecor no

    s'assemblaven als

    del món del Tron?
- id: 8154
  text: >-
    {:unk13 91 00 3C 00}{:unk08 01 01 06}Som-hi,

    entreu-hi!
- id: 8155
  text: "{:unk13 54 01 5A 00}{:unk08 01 01 06}Afanya't, Cid!"
- id: 8156
  text: "{:unk06 02}{:unk13 C8 00 50 00}{:unk08 03 01 06}Dona'm un segon!"
- id: 8157
  text: '{:unk13 96 00 41 00}{:unk08 01 00 05}Cagondena! Ràpid!'
- id: 8158
  text: '{:unk06 02}{:unk13 36 01 50 00}{:unk08 03 00 05}Perquè no...!'
- id: 8159
  text: '{:unk13 A5 00 9B 00}{:unk08 01 01 06}Què passa?'
- id: 8160
  text: >-
    {:unk13 A0 00 37 00}{:unk08 01 01 06}Sempre apareixeu en

    el moment exacte!
- id: 8161
  text: >-
    {:unk13 2C 01 37 00}{:unk08 01 01 06}El PCM está sembrant el

    caos dins l'ordinador.
- id: 8162
  text: '{:unk13 87 00 09 01}{:unk08 01 00 06}Un altre cop no!'
- id: 8163
  text: >-
    {:unk13 D2 00 37 00}{:unk08 01 01 06}Almenys això és

    el que creu el Léon...
- id: 8164
  text: >-
    Ha anat a l'estudi de l'Ànsem a

    esbrinar què carai anava tot això.
- id: 8165
  text: >-
    Sembla que el PCM està

    utilitzant dades del sistema{:delay B4 00}{:clear }per crear més sensecor.
- id: 8166
  text: >-
    I, a més, s'està carregant tot el

    sistema de control de la ciutat.
- id: 8167
  text: >-
    [Necis usuaris

    Obeïu el PCM]
- id: 8168
  text: >-
    Aquest PCM no sap quan rendir-se,

    oi que no?
- id: 8169
  text: '{:unk13 85 00 35 00}{:unk08 01 01 06}Un programa mai es rendeix.'
- id: 8170
  text: '{:unk13 FA 00 91 00}{:unk08 01 00 05}Com li va al Tron?'
- id: 8171
  text: >-
    {:unk13 2C 01 55 00}{:unk08 01 01 06}No podem comunicar-nos amb ell.{:clear }Creiem que l'han forçat

    a anar a la xarxa de joc.
- id: 8172
  text: >-
    {:unk13 1E 01 3C 00}{:unk08 01 00 05}I no sembla que sigui un

    joc especialment divertit.
- id: 8175
  text: >-
    {:unk13 AF 00 37 00}{:unk08 01 01 06}Gràcies, xaval.{:clear }Estem preparant un programa

    d'Erradicació del PCM.{:clear }Em fa l'efecte que

    ja quasi està acabat.
- id: 8176
  text: >-
    {:unk13 F0 00 50 00}{:unk08 01 00 05}Tant de bo. Espero que

    tinguis raó aquesta vegada.
- id: 8177
  text: >-
    {:unk13 04 01 41 00}{:unk08 01 01 06}Escolteu, necessitarem l'ajuda

    del Tron quan aquell Erradicador

    estigui complet.
- id: 8178
  text: >-
    {:unk13 FA 00 8C 00}{:unk08 01 00 05}No us preocupeu.{:clear }Ens encarregarem

    d'avisar el Tron!
- id: 8179
  text: >-
    {:unk13 50 01 3A 00}{:unk08 01 00 04}Recordeu, nanos,

    comptem amb vosaltres.
- id: 8180
  text: '{:unk13 F5 00 AF 00}{:unk08 01 00 05}Entesos!'
- id: 8181
  text: '{:unk13 C6 00 39 00}{:unk08 01 00 05}Òndia, som nosaltres!'
- id: 8182
  text: >-
    {:unk13 AA 00 50 00}{:unk08 01 00 06}No podreu parlar amb el Tron si

    perdem el control d'aquesta sala.
- id: 8183
  text: >-
    {:unk13 FA 00 3C 00}{:unk08 01 01 06}Heu parlat

    amb el Cid?
- id: 8184
  text: '{:unk13 C8 00 6E 00}{:unk08 01 00 05}Sí.'
- id: 8185
  text: "{:unk13 40 01 2D 00}{:unk08 01 01 06}I l'Erradicador?"
- id: 8186
  text: '{:unk13 96 00 82 00}{:unk08 01 00 05}Està quasi llest.'
- id: 8187
  text: '{:unk13 C8 00 64 00}{:unk08 01 00 05}Genial!'
- id: 8188
  text: >-
    {:unk13 D2 00 50 00}{:unk08 01 00 05}Eh, Léon, per què no

    vas a ajudar el Cid?{:clear }Jo m'encarrego d'això.

    D'acord?
- id: 8189
  text: >-
    {:unk13 CF 00 43 00}{:unk08 01 01 07}N'estàs segura?

    Tu sola?...
- id: 8190
  text: >-
    {:unk13 F0 00 3C 00}{:unk08 01 01 07}... Ja, ho sento.

    Tot teu.
- id: 8191
  text: '{:unk13 FA 00 3C 00}{:unk08 01 00 05}Com està el Tron?'
- id: 8192
  text: >-
    {:unk13 F0 00 46 00}{:unk08 01 01 07}Seguim sense poder

    contactar amb ell.{:clear }Per què no ho

    intenteu vosaltres?
- id: 8193
  text: >-
    {:unk13 0E 01 3C 00}{:unk08 01 00 05}No, anirem a

    veure'l en persona.
- id: 8194
  text: >-
    {:unk13 A0 00 40 01}{:unk08 01 01 02}Llavors feu-me

    un favor.{:clear }Quan trobeu el Tron,

    digueu-li que vagi a la

    Torre I/O.{:clear }Allà hi carregarem el programa

    d'Erradicació del PCM.
- id: 8195
  text: >-
    {:unk13 8C 00 5A 00}{:unk08 01 00 05}La Torre I/O.

    Entesos!
- id: 8196
  text: >-
    {:unk13 E4 00 3F 00}{:unk08 01 01 07}Gràcies.

    I aneu amb compte.
- id: 8197
  text: >-
    [Necis usuaris

    Obeïu el PCM]
- id: 8198
  text: Aguanta, Tron, ja venim.
- id: 8199
  text: Has acabat?
- id: 8200
  text: >-
    Ho hauria fet, si no fos

    per aquest vell xaruc.
- id: 8201
  text: Vell xaruc, dius?
- id: 8202
  text: Estic intentant treballar!
- id: 8203
  text: >-
    Jo, jo, jo... Ja t'ensenyaré

    jo qui és un vell xaruc!
- id: 8204
  text: Ja està!
- id: 8205
  text: >-
    Té, Léon.{:delay 64 00}{:clear }{:delay 14 00}{:clear }Un programa casolà.

    Delicatessen màgica del vell xaruc.
- id: 8206
  text: Serà millor que funcioni.
- id: 8207
  text: Me'n vaig.
- id: 8208
  text: Estigues alerta!
- id: 8209
  text: >-
    Alerta.{:delay 4B 00}{:clear }{:delay 0F 00}Control d'usuari

    anul・lat indefinidament.
- id: 8210
  text: És inútil!
- id: 8211
  text: Léon, deixa-m'ho intentar.
- id: 8212
  text: Aquest és l'último avís.{:delay 5A 00}{:clear }{:delay 28 00}{:clear }Desistin.
- id: 8213
  text: Bon appetit!
- id: 8214
  text: I no parlis amb la boca plena!
- id: 8215
  text: Què... què hi estàs carregant?
- id: 8216
  text: >-
    Les coses s'estan

    calmant a la ciutat!{:delay 62 00}{:clear }{:delay 27 00}{:clear }Els únics sensecor que queden

    són els habituals de per aquí.{:delay 8A 00}{:clear }{:delay 30 00}{:clear }Fins i tot hi ha menys que abans.
- id: 8217
  text: >-
    Ara només cal tornar els

    nostres amics d'una peça.
- id: 8218
  text: Sou aquí!
- id: 8219
  text: Benvinguts!
- id: 8220
  text: Com va la ciutat?
- id: 8221
  text: De primera!
- id: 8222
  text: >-
    Tampoc hi ha rastre del PCM. Tot torna

    a la normalitat. Ho hem aconseguit.
- id: 8223
  text: Eh, i aquestes cares llargues?{:delay 78 00}{:clear }{:delay 19 00}{:clear }Què ha passat?
- id: 8224
  text: El Tron ha desaparegut.
- id: 8225
  text: I ens ha promès que el tornaríem a veure...
- id: 8226
  text: Què està passant?
- id: 8227
  text: >-
    Salut, amics.{:delay 3C 00}{:clear }El sistema és actiu i

    llest per a l'usuari.
- id: 8228
  text: Tron!
- id: 8229
  text: No m'oblideu.
- id: 8230
  text: Sí!
- id: 8231
  text: Oh, bufa! Oh, bufa!
- id: 8232
  text: Prou! Em fas pesigolles!
- id: 8233
  text: El Tron té pesigolles?
- id: 8234
  text: Què et sembla això?
- id: 8235
  text: Si us plau, para!
- id: 8236
  text: >-
    El Tron ha passat massa

    temps amb aquests nanos.
- id: 8237
  text: >-
    Espereu. Un moment.{:delay B1 00}{:clear }Vull ensenyar-vos una cosa que

    he trobat entre els arxius vells. {:delay B4 00}{:clear }És la ciutat tal i com es va construir.
- id: 8238
  text: És clar!{:delay 5A 00}{:clear }{:delay 19 00}{:clear }Ara me'n recordo.
- id: 8239
  text: Com en els vells temps!
- id: 8240
  text: >-
    Mmmm...{:delay 3C 00}{:clear }{:delay 19 00}{:clear }M'agradaria esbrinar quan{:delay 81 00}{:clear }aquesta ciutat va començar a ser coneguda

    per l'horrible nom de Baluard Balmat.
- id: 8241
  text: >-
    Abans, aquesta ciutat es

    deia d'una altra manera.
- id: 8242
  text: ''
- id: 8243
  text: Vergel Radiant.{:delay 6E 00}{:clear }{:delay 2D 00}{:clear }
- id: 8244
  text: On és la resta?
- id: 8245
  text: >-
    Ni idea. Tindran altres

    afers a atendre.
- id: 8246
  text: Quins afers?
- id: 8247
  text: >-
    Insinues que tenen qüestions

    més importants a preocupar-se{:delay 9C 00}{:clear }que el meu retorn?
- id: 8248
  text: >-
    A veure, vejam, hi ha una tal Organització {XIII}

    que no deixa d'entremetre-s'hi...
- id: 8249
  text: >-
    Deixa que aquells il・lusos

    segueixin amb el seu petit joc!
- id: 8250
  text: >-
    I què fem amb l'escanyolit de la clau

    espasa? També és un autèntic mal de cap.
- id: 8251
  text: Oh, de debò?
- id: 8252
  text: >-
    Molt bé doncs. Llavors més et val que m'expliquis

    què ha passat durant la meva abscència.
- id: 8253
  text: Que hi ha algú a casa?
- id: 8254
  text: Merlí!
- id: 8255
  text: El castell està en perill!
- id: 8256
  text: A què ve tant d'alderull?
- id: 8257
  text: Jo, jo! Sou vosaltres!
- id: 8258
  text: >-
    Veig que heu après molt des de

    l'última vegada que ens vam veure.
- id: 8259
  text: De debò?
- id: 8260
  text: En tenim una de grossa!{:delay 78 00}{:clear }És la Maléfica! Ha tornat! És aquí!
- id: 8261
  text: On? Al castell?
- id: 8262
  text: Sí! I s'hi ha dut els sensecor.
- id: 8263
  text: Vaja, vaja...
- id: 8264
  text: Haurà passat alguna cosa?
- id: 8265
  text: ''
- id: 8266
  text: Som-hi!
- id: 8267
  text: Carai! Heu trigat una mica, no?
- id: 8268
  text: >-
    Has estat tu qui ens

    ha invocat, Merlí?
- id: 8269
  text: >-
    Exactament...{:delay 64 00}{:clear }{:delay 1E 00}{:clear }Però em fa l'efecte que he

    utlitzat massa poder en fer-ho{:delay A5 00}{:clear }i aquells infernals sensecor...
- id: 8270
  text: Què ha passat?
- id: 8271
  text: >-
    Mmm... doncs que m'he trobat amb

    una cosa que us pot interessar.
- id: 8272
  text: El llibre del Pooh!
- id: 8273
  text: >-
    Correcte. {:delay 44 00}{:clear }Sé que ets un bon amic

    del Winnie the Pooh, Sora,{:delay BD 00}{:clear }per això us he invocat.
- id: 8274
  text: >-
    Quan ho he fet,

    m'han atacat els sensecor.{:delay B4 00}{:clear }M'he defensat amb encanteris

    bastant poderosos,{:delay D8 00}{:clear }però temo que el llibre hagi

    patit cap mal, així que...{:delay E8 00}{:clear }{:delay 45 00}Espereu. Serà millor que avisi

    al Léon i els altres abans.{:delay C2 00}{:clear }Vaig a buscar-los.

    Torno en res.
- id: 8275
  text: Com li deu anar al Pooh?
- id: 8276
  text: Ho esbrinem?
- id: 8277
  text: Sí!
- id: 8278
  text: Sora!
- id: 8279
  text: Tu cobreix-me, d'acord?
- id: 8280
  text: Sora! Vine ràpid!
- id: 8281
  text: Donald?
- id: 8282
  text: Has portat el llibre, Sora?
- id: 8283
  text: Eh!
- id: 8284
  text: Torneu-nos-el!
- id: 8285
  text: Creieu que estarà bé?
- id: 8286
  text: >-
    Òndia! Potser hauries de

    tornar i assegurar-te'n.
- id: 8287
  text: I què fem amb el Merlí?
- id: 8288
  text: Bah, ja li'n direm alguna cosa!
- id: 8289
  text: Entesos!
- id: 8290
  text: >-
    {:unk13 AA 00 46 00}{:unk08 01 01 05}Era massa molèstia

    esperar un vell mag, no?
- id: 8291
  text: '{:unk13 96 00 50 00}{:unk08 01 01 06}Ho sento molt...'
- id: 8292
  text: '{:unk13 2C 01 64 00}{:unk08 01 00 05}Com van les coses per allà?'
- id: 8293
  text: >-
    {:unk13 18 01 78 00}{:unk08 01 01 06}Aviam...{:clear }el Pooh sembla haver-se

    olblidat de mí per complet.{:clear }I no només de mi, també

    dels seus altres amics.
- id: 8294
  text: >-
    {:unk13 FA 00 50 00}{:unk08 01 00 05}Era el que

    em temia...
- id: 8295
  text: >-
    {:unk13 C8 00 64 00}{:unk08 01 00 04}Sospito que està relacionat

    amb les pàgines que els

    sensecor han robat.{:clear }Haureu de recuperar les pàgines

    arrencades i reparar el llibre

    per arreglar aquest embolic.
- id: 8296
  text: >-
    {:unk13 B4 00 3C 00}{:unk08 01 01 05}Aquest llibre és un dels

    elements més preuats del món.{:clear }Havia pensat a dir al

    Léon que l'havia trobat...{:clear }però potser ho hauriem de 

    mantenir en secret per ara.
- id: 8297
  text: '{:unk06 02}{:unk13 A0 00 2C 01}{:unk08 03 01 02}Entesos!'
- id: 8298
  text: '{:unk06 02}{:unk13 72 01 64 00}{:unk08 03 00 05}Entesos!'
- id: 8299
  text: '{:unk06 02}{:unk13 6E 00 3C 00}{:unk08 03 01 06}Entesos!'
- id: 8300
  text: '{:unk13 94 00 5F 00}{:unk08 01 01 06}Perfecte.'
- id: 8998
  text: >-
    La sala de l'ordinador és per aquí.{:clear }Els ordinadors són delicats. Podeu

    tocar-los, però no feu ximpleries.
- id: 8999
  text: >-
    Si segueix així, destruirà l'estudi

    abans que trobem la contrasenya.{:clear }Ho sento, Sora, però has

    de vigilar a aquella noia.
- id: 9000
  text: >-
    Deixa'ns això a nosaltres.

    Tu concentra't en les dades.{:clear }Utilitza la contrasenya i treballa amb

    el Tron per alliberar les dades del DTD.
- id: 9001
  text: >-
    Doneu un cop de mà al {:theme 0A}Tron{:reset} fins

    que el programa estigui llest.{:clear }No us preocupeu,

    jo m'encarregaré de tot aquí.
- id: 9002
  text: >-
    Primer s'hauran de trobar les

    dades de la investigació de l'Ànsem.{:clear }Després us ho explicaré tot.

    Per favor, aneu amb compte.
- id: 9003
  text: >-
    {:theme 0A}L'ordinador és allà davant.{:reset}{:clear }Dins, el camí es torna enganyós.

    Si us perdeu, camineu prop de la paret.
- id: 9004
  text: >-
    Busco un paio amb una gran espasa.

    No, no té una cicatriu a la cara.{:clear }Té els ulls d'un color estrany

    i intenta ocupar-se ell sol de tot.
- id: 9005
  text: >-
    El Léon i els altres són a la zona

    residencial. Han anat a casa el Merlí.
- id: 9006
  text: >-
    És bo el gelat de sal marina, eh?

    Però no és moment de menjar gelats!{:clear }Ajudeu el Léon i  els altres. I no

    espereu una recompensa a canvi.
- id: 9007
  text: >-
    Si us creueu amb un home de pèl

    platejat i una llarga espasa, aviseu-me.{:clear }El seu nom és Sephiroth.

    És el més infaust dels meus enemics.
- id: 9008
  text: >-
    Sembla que les teves peces es van dissenyar

    per acumular energia quan utilitzes la màgia.{:clear }No et continguis, puix que la teva

    màgia es recupera de seguida.
- id: 9009
  text: >-
    El PCM ha tornat els dispositius

    de defensa contra nosaltres.{:clear }Si t'hi apropes, hauràs

    d'esquivar els seus atacs.
- id: 9010
  text: >-
    Serà dur, però si seguim treballant

    aquest món tornarà a la normalitat.{:clear }Ara ets lliure de seguir el teu camí.

    Ves amb compte, Sora.
- id: 9011
  text: >-
    Has vist els dispositius de defensa

    de la ciutat? Els anomenen Claymore.{:clear }No tenen tant poder com vosaltres,

    però si els utilitzeu bé poden...{:clear }ser de gran ajuda.
- id: 9012
  text: >-
    La sala de l'ordinador és més enllà

    del {:theme 0A}porticó{:reset}. Ves amb compte.
- id: 9013
  text: >-
    Ho sento. Acabar el programa d'Erradicació

    del PCM encara trigarà una mica.{:clear }Mentrestant, aneu i ajudeu el Tron

    {:theme 0A}des de la sala de l'ordinador{:reset}.
- id: 9014
  text: >-
    El Léon és al pati interior.

    No us entretingueu, entesos?
- id: 9015
  text: >-
    Si aneu cap a la dreta i pugeu les

    escales, arribareu al pati interior.{:clear }Allà hi ha molts sensecor, així

    que prepareu-vos bé al mercat.
- id: 9016
  text: >-
    Com he dit abans, aquesta ciutat

    poseeix dispositius de defensa.{:clear }Poden ser molt útils. Lluitar al seu

    costat hauria de simplificar-vos les coses.
- id: 9017
  text: >-
    Nosaltres vigilem els sensecor!{:clear }La vostra comesa és

    enfrontar-vos-hi! Bona sort! ♪
- id: 9018
  text: >-
    El PCM està utilitzant la màquina

    de fabricar sensecor de l'estudi.{:clear }També té el control del sistema de

    defensa. Això comença a ser preocupant.
- id: 9019
  text: >-
    Sé que el Pooh i vosaltres sou bons amics.{:clear }Hauríem d'esperar el Merlí, però

    m'agradaria saber si el Pooh està bé.
- id: 12075
  text: >-
    Tots hi poseu l'espatlla per salvar

    el que considereu important.{:clear }I seguiu endavant perquè esteu

    junts. Seria difícil fer-ho sols.
- id: 12317
  text: Malèfica! {:delay 64 00}{:clear }{:delay 28 00}{:clear }Malèfica!
- id: 12318
  text: Pot ser que sí hagin acabat amb ella.
- id: 12319
  text: >-
    I aquest castell sí que no me l'esperava així.

    No brilla, no res.
- id: 12320
  text: Què passarà ara amb el nostre pla?
- id: 12321
  text: És Baluard Balmat!
- id: 12322
  text: Òndia! Es veu com diferent ara.
- id: 12323
  text: Espero que el Léon i la colla estiguin bé.
- id: 12324
  text: >-
    Oh, oh. Em sembla que

    haurem de lluitar.
- id: 12325
  text: '{:unk06 02}{:unk13 0E 01 54 01}{:unk08 03 00 02}Oncle Garrepa!?'
- id: 12326
  text: '{:unk13 A5 00 55 00}{:unk08 01 00 06}Eh? Qui...?'
- id: 12327
  text: >-
    {:unk13 3B 01 47 00}{:unk08 01 00 07}És el tiet del Donald...

    un magnat dels negocis!{:clear }Abans d'aparèixer els sensecor,

    viatjava pels mons en

    una nau gumi amb el rei.{:clear }Estava ajudant a establir un

    sistema de tràfic entre mons.
- id: 12328
  text: '{:unk06 02}{:unk13 D7 00 54 01}{:unk08 03 01 01}Un sistema de trànsit!'
- id: 12329
  text: '{:unk13 18 01 4B 00}{:unk08 01 00 06}Què és aquest enrenou?'
- id: 12330
  text: >-
    {:unk13 18 01 4B 00}{:unk08 01 00 06}Vaja, però si és el Donald!{:clear }I el Goofy!

    Hola, xicots!{:clear }Eh, teniu un molt

    bon aspecte!
- id: 12331
  text: >-
    {:unk13 D5 00 55 01}{:unk08 01 01 01}Tu també,

    Oncle Garrepa.
- id: 12332
  text: >-
    {:unk13 F0 00 F5 00}{:unk08 01 01 01}Ai, no creieu...{:clear }No aconsegueixo reproduir

    el sabor del meu vell gelat

    preferit.{:clear }Guanyaria una fortuna

    si pogués...
- id: 12333
  text: '{:unk13 54 01 50 00}{:unk08 01 00 05}Dolentíssim!'
- id: 12334
  text: Eh! Què passa aquí?
- id: 12335
  text: >-
    És el mecanisme de

    defensa de la ciutat.
- id: 12336
  text: Yuffie!
- id: 12337
  text: Compte!
- id: 12338
  text: Hola, nois!
- id: 12339
  text: Veig que seguiu en plena forma.
- id: 12340
  text: Què esperaves? {:delay 55 00}{:clear }{:delay 0A 00}{:clear }Veig que a tu et va molt bé.
- id: 12341
  text: Què t'esperaves tu?
- id: 12342
  text: Com van els altres?
- id: 12343
  text: Genial!
- id: 12344
  text: >-
    Ei, Yuffie,

    has vist el rei i el Riku?
- id: 12345
  text: No.
- id: 12346
  text: >-
    Però tenia la sensació

    que us tornaria a veure.
- id: 12347
  text: >-
    «Potser mai tornem a veure'ns,

    però mai ens oblidarem.»
- id: 12348
  text: Se suposa que aquell era el Léon?
- id: 12349
  text: >-
    Tots estan treballant

    a casa el Merlí. {:delay AF 00}{:clear }{:delay 0A 00}{:clear }Som-hi!
- id: 12350
  text: >-
    Us presento el Comitè de

    Reconstrucció de Baluard Balmat!
- id: 12351
  text: Quant de temps!
- id: 12352
  text: Vaja! Què bé que us veig!
- id: 12353
  text: Ho sabia.
- id: 12354
  text: Què sabies?
- id: 12355
  text: >-
    Fa poc, de cop, tots ens recordem

    de vosaltres. Tots a la vegada.
- id: 12356
  text: >-
    Us... en vau recordar? {:delay 50 00}{:clear }{:delay 0A 00}{:clear }Espera! Vols dir que

    ens havíeu oblidat?
- id: 12357
  text: Gràcies!
- id: 12358
  text: On heu estat tot aquest temps?
- id: 12359
  text: Estàvem dormint.
- id: 12360
  text: On? En una nevera?
- id: 12361
  text: >-
    Tant se val! És fantàstic.

    Tots junts un altre cop!
- id: 12362
  text: >-
    Escolteu... mm... Estem buscant

    el Riku i el rei. Els heu vist?
- id: 12363
  text: Bé.
- id: 12364
  text: >-
    Em sap greu. Però digueu-nos si podem

    ajudar en qualsevol cosa, d'acord?
- id: 12365
  text: D'acord. Gràcies.
- id: 12366
  text: No ens doneu les gràcies encara.
- id: 12368
  text: >-
    Et refereixes als

    incorporis i els sensecor?
- id: 12369
  text: Exacte!
- id: 12370
  text: >-
    Em sembla que us vindria

    bé la nostra ajuda.
- id: 12371
  text: Llavors, anem per feina.
- id: 12372
  text: >-
    Sora, Donald, Goofy...{:delay 78 00}{:clear }Esperàvem que els tres poguéssiu

    donar-nos un cop de mà per aquí.
- id: 12373
  text: Com si ens hi anéssim a negar.
- id: 12374
  text: '{:delay 83 00}{:clear }Oblidava amb qui estic parlant.'
- id: 12375
  text: Eh! Què vols dir amb això?
- id: 12376
  text: >-
    Pren-t'ho com un dels

    compliments del Léon.
- id: 12377
  text: >-
    Seguiu-me fins al pati interior.

    Hi ha una cosa que heu de veure.
- id: 12378
  text: >-
    Oh! Imaginava que éreu vosaltres.

    Just a temps!
- id: 12379
  text: És el Merlí!
- id: 12380
  text: El Sora i la colla ens ajudaran!
- id: 12381
  text: Fantàstic! Comptem amb vosaltres!
- id: 12382
  text: Fet!
- id: 12383
  text: >-
    Ah, sí. Els has donat

    els carnets, estimada?
- id: 12384
  text: Oh!
- id: 12385
  text: >-
    Teniu...

    Són per a vosaltres.{:delay B4 00}{:clear }El Léon va pensar que us agradaria tenir-los.
- id: 12386
  text: >-
    Membre Honorífic del Comitè de

    Reconstrucció de Baluard Balmat!
- id: 12387
  text: Carnets de membre!
- id: 12388
  text: És genial, eh?
- id: 12389
  text: Ei, gràcies, Léo-... Eh?
- id: 12390
  text: >-
    Oh, no! Se suposava que

    anàvem al pati interior!
- id: 12391
  text: Mireu allò.
- id: 12392
  text: ''
- id: 12393
  text: >-
    Volem reconstruir Baluard Balmat

    per a que sigui com abans. {:delay C3 00}{:clear }{:delay 1E 00}{:clear }Potser fins i tot millor.
- id: 12394
  text: >-
    Queda molt per fer,

    però podrem amb tot...
- id: 12395
  text: Excepte... amb allò.
- id: 12396
  text: I allò.
- id: 12397
  text: Ens n'encarregarem.
- id: 12398
  text: Vaja, està bé escoltar això.
- id: 12399
  text: >-
    Llavors, Sora...

    tens idea del que està passant?
- id: 12400
  text: >-
    Hi ha un tal Pete que va per allà

    tramant alguna cosa amb els sensecor.
- id: 12401
  text: >-
    Aquell llondro no sap ni

    cantar l'abecedari. {:delay B8 00}{:clear }Els que han de preocupar-nos

    són els incorporis...
- id: 12402
  text: >-
    I els d'aquella

    Organització {XIII} també!
- id: 12403
  text: Ens cridàveu?
- id: 12404
  text: Ho esteu fent bé.
- id: 12405
  text: Qui hi ha!?
- id: 12406
  text: Això és digne de celebració.
- id: 12407
  text: >-
    La clau espasa...

    Una arma realment meravellosa.{:delay FA 00}{:clear }{:delay 37 00}{:clear }Si fos en mans...

    més capaces...
- id: 12408
  text: Doneu la cara!
- id: 12409
  text: L'Organització {XIII}!
- id: 12410
  text: Bé. Així hi posem ja punt i final.
- id: 12411
  text: Quina llàstima! {:delay 78 00}{:clear }{:delay 19 00}{:clear }I mira que pensava que podríem ser amics...
- id: 12412
  text: Alto!
- id: 12413
  text: Què preteneu!?
- id: 12414
  text: Vaja. Vaja.
- id: 12415
  text: Aparta!
- id: 12416
  text: Et sembla de bona educació{:delay 7D 00}{:clear }{:delay 19 00}{:clear }barrar-me el pas així?
- id: 12417
  text: He dit que t'apartis!
- id: 12420
  text: >-
    Vejam, això funcionaria si...

    jo fos un simple pocatraça.
- id: 12429
  text: Vaja!... {:delay 37 00}{:clear }{:delay 19 00}{:clear }Doncs no ho sé.
- id: 12431
  text: Espera!
- id: 12435
  text: Sí, tens raó. Només hi ha un Sora!
- id: 12436
  text: >-
    El Membre Honorífic del Comitè

    de Reconstrucció de Baluard Balmat!
- id: 12440
  text: Ahhh... Ja ho entenc.
- id: 12445
  text: Creieu que...?
- id: 12446
  text: Sembla que hi ha més sensecor ara.
- id: 12447
  text: ''
- id: 12448
  text: Anem a veure a la resta.
- id: 12449
  text: Seran a casa el Merlí.
- id: 12450
  text: >-
    {:unk13 09 01 46 00}{:unk08 01 00 06}Ai! Era tan a prop

    d'aconseguir aquell sabor...
- id: 12451
  text: >-
    {:unk13 0E 01 46 00}{:unk08 01 00 06}Com anem, xicots?{:clear }El Léon i els seus amics

    són a la zona residencial.{:clear }Sí, a casa el Merlí.
- id: 12452
  text: Ah! Cloud!
- id: 12453
  text: Què fas?
- id: 12454
  text: >-
    Aniré a per ell.{:delay 3C 00}{:clear }{:delay 3C 00}{:clear }Aquesta vegada hi posarem punt i final. {:delay 69 00}{:clear }{:delay 50 00}{:clear }Jo, i qui representa tota la

    foscor de dins meu.
- id: 12456
  text: Si és així, és per culpa seva.
- id: 12457
  text: De qui?
- id: 12458
  text: Sephiroth.{:delay 41 00}{:clear }{:delay 28 00}{:clear }Aviseu-me si el veieu.
- id: 12459
  text: D'acord. Com és ell?
- id: 12460
  text: >-
    Pèl platejat.

    Porta una llarga espasa.
- id: 12461
  text: És clar.{:delay 3C 00}{:clear }Bé, ens veiem, Cloud.
- id: 12462
  text: Tingueu compte.
- id: 12463
  text: >-
    Juga amb la teva ment; pensareu

    que la foscor és l'única sortida.
- id: 12464
  text: >-
    {:unk13 9B 00 46 00}{:unk08 01 01 07}Eh, nois, arribeu

    just a temps.{:clear }Tenim bones notícies

    per a vosaltres.{:clear }Heu d'anar a

    veure el Léon.
- id: 12465
  text: '{:unk13 4A 01 91 00}{:unk08 01 00 05}Quines notícies?'
- id: 12466
  text: >-
    {:unk13 59 01 46 00}{:unk08 01 00 04}Hem trobat l'ordinador

    que l'Ànsem utilitzava!
- id: 12467
  text: '{:unk13 A5 00 E6 00}{:unk08 01 00 05}Ostres!'
- id: 12468
  text: >-
    {:unk13 C4 00 E6 00}{:unk08 01 01 02}Sí. Potser aconseguim l'accés

    a informació sobre els

    sensecor i l'Organització.
- id: 12470
  text: '{:unk13 90 01 AF 00}{:unk08 01 00 05}I el rei.'
- id: 12471
  text: >-
    {:unk13 18 01 37 00}{:unk08 01 01 06}Aneu a veure'l

    vosaltres mateixos!
- id: 12472
  text: '{:unk13 FA 00 28 00}{:unk08 01 00 05}No mossega!'
- id: 12473
  text: '{:unk13 40 01 8C 00}{:unk08 01 00 05}Què vols dir?'
- id: 12474
  text: >-
    {:unk13 D2 00 32 00}{:unk08 01 01 06}Res. Aneu a la sala d'ordinadors,

    pel porticó del castell.{:clear }Aneu amb compte!
- id: 12476
  text: >-
    Tenen coses a fer al

    porticó del castell.
- id: 12477
  text: Bomba!
- id: 12478
  text: Eh?
- id: 12479
  text: Anem a informar.
- id: 12480
  text: A qui?
- id: 12481
  text: A la nostra cap, és clar!
- id: 12482
  text: Sí, ja saps, la Malèfi...
- id: 12483
  text: No li feu cas.{:delay 3C 00}{:clear }{:delay 14 00}{:clear }Us aseguro... que venim en pau.
- id: 12484
  text: Mentidera...
- id: 12485
  text: Algun problema?{:delay 3C 00}{:clear }{:delay 39 00}{:clear }Bé, d'acord, parla tu.
- id: 12486
  text: Sento molt tot això!
- id: 12487
  text: '{:unk06 02}{:unk13 4A 01 50 00}{:unk08 03 00 05}Léon!'
- id: 12488
  text: '{:unk13 64 00 64 00}{:unk08 01 00 05}Per aquí!'
- id: 12489
  text: >-
    {:unk13 A0 00 5A 00}{:unk08 01 01 05}Heu trobat l'ordinador

    de l'Ànsem?
- id: 12490
  text: >-
    {:unk13 B4 00 3C 00}{:unk08 01 01 07}Sí. El rei hi està

    molt interessat.
- id: 12491
  text: '{:unk13 DC 00 96 00}{:unk08 01 00 05}El rei?'
- id: 12492
  text: '{:unk13 95 00 2D 00}{:unk08 01 01 06}Esta amb el Léon.'
- id: 12493
  text: '{:unk06 02}{:unk13 8C 00 91 00}{:unk08 03 01 05}Per fi veurem el rei!'
- id: 12494
  text: '{:unk06 02}{:unk13 A4 01 41 00}{:unk08 03 00 05}Hurra!'
- id: 12495
  text: >-
    {:unk13 86 01 B8 00}{:unk08 01 00 00}Eh...{:clear }El Riku està

    amb ells?
- id: 12496
  text: >-
    {:unk13 BE 00 50 00}{:unk08 01 00 06}Bé, almenys puc

    preguntar-li al

    rei què és d'ell.{:clear }I aquell ordinador

    potser podria

    dir-nos alguna cosa.
- id: 12497
  text: '{:unk13 0E 01 2D 00}{:unk08 01 01 06}Bona idea!'
- id: 12498
  text: Ànsem...
- id: 12499
  text: >-
    Òndia! Suposo que aquest

    deu ser el seu quarto.
- id: 12500
  text: On és el rei?
- id: 12501
  text: Hola?
- id: 12502
  text: Ei, vosaltres!
- id: 12503
  text: >-
    Estic buscant a algú. Heu vist

    un xato amb el pèl de punta?
- id: 12504
  text: '{:delay 32 00}Més de punta.'
- id: 12505
  text: Deixeu-me fer-hi un cop d'ull.
- id: 12506
  text: Sento les molèsties.
- id: 12507
  text: No és molèstia, senyoreta.
- id: 12508
  text: Ja era hora.
- id: 12509
  text: Léon!
- id: 12510
  text: >-
    {:unk13 4A 01 73 00}{:unk08 01 01 06}El rei no

    està amb tu?
- id: 12512
  text: '{:unk06 02}{:unk13 18 01 C3 00}{:unk08 03 01 06}Ei!'
- id: 12513
  text: >-
    {:unk13 37 01 34 00}{:unk08 01 00 05}Bé, potser això calma

    la vostra impaciència.
- id: 12514
  text: >-
    {:unk13 AA 00 50 00}{:unk08 01 01 06}La sala d'ordinadors

    de l'Ànsem.
- id: 12515
  text: Aquí està!
- id: 12516
  text: On és la Kairi... i el Riku?
- id: 12517
  text: Afluixa... {:delay 3C 00}{:clear }{:delay 23 00}{:clear }Que vols trencar-lo o què?
- id: 12518
  text: Oh... ho sento. {:delay 5A 00}{:clear }{:delay 12 00}{:clear }Crec que m'he emocionat.
- id: 12519
  text: Baixa d'allà!
- id: 12520
  text: >-
    Atenció, usuari.

    Això és una advertència.{:delay DF 00}{:clear }Si prosegueix amb el mal ús

    d'aquest terminal s'accionaran{:delay 78 00}{:clear }mesures defensives immediatament.
- id: 12521
  text: Qui hi ha?
- id: 12522
  text: Soc el Programa de Control Mestre.{:delay 73 00}{:clear }{:delay 14 00} {:clear }Jo superviso aquest sistema.
- id: 12523
  text: On ets?
- id: 12524
  text: Donald!
- id: 12525
  text: Perdó...
- id: 12526
  text: >-
    Punt de decisió assolit.

    Esteu arrestats.
- id: 12527
  text: Arrestats!?
- id: 12528
  text: Correu!
- id: 12529
  text: >-
    {:unk13 6E 00 78 00}{:unk08 01 00 05}Que esteu

    buscant què?
- id: 12530
  text: >-
    {:unk13 89 00 BB 00}{:unk08 01 01 02}Apa!

    Una habitació secreta!{:clear }Serà millor que hi faci

    un altre cop d'ull.
- id: 12531
  text: Amb permís.
- id: 12532
  text: Bé, s'ha acabat.
- id: 12533
  text: Mireu.
- id: 12534
  text: Tron... no et rendeixis.
- id: 12535
  text: Bé, per on comencem?
- id: 12536
  text: Ja ho sé! Anem a accedir al DTD!
- id: 12537
  text: >-
    El rei està comprovant

    la situación a la ciutat.{:delay 78 00}{:clear }Tornarà aviat.

    No us preocupeu. {:delay 75 00}{:clear }{:delay 39 00}{:clear }Eh, mireu, ens demana una contrasenya.
- id: 12538
  text: Això és fàcil! És...
- id: 12539
  text: Sora!
- id: 12540
  text: Donald!
- id: 12541
  text: Goofy!
- id: 12542
  text: Doncs... és correcta.
- id: 12543
  text: I bé?
- id: 12544
  text: Magnífic. Hem entrat.
- id: 12545
  text: >-
    Haig d'anar a la ciutat. {:delay 5F 00}{:clear }{:delay 19 00}{:clear }Vull veure què ha fet

    aquesta última sacsejada.
- id: 12546
  text: >-
    No consultaràs les dades?

    No han sigut gens fàcils d'aconseguir.
- id: 12547
  text: >-
    Torno ara mateix. {:delay 46 00}{:clear }{:delay 46 00}{:clear }Ei, Sora... per què no les hi

    comences a carregar i copiar?
- id: 12548
  text: >-
    Només s'ha de teclejar

    una mica. És fàcil, no?
- id: 12549
  text: Ha funcionat?
- id: 12550
  text: Ei, aquestes coses triguen estona, entesos?
- id: 12551
  text: Oh! {:delay 3C 00}{:clear }Està fent alguna cosa!
- id: 12552
  text: ''
- id: 12553
  text: >-
    Crec que vol saber

    què estem buscant.
- id: 12554
  text: El Riku i la Kairi!
- id: 12555
  text: '[Error de dades]'
- id: 12556
  text: Res...
- id: 12557
  text: >-
    Ni tan sols l'ordinador

    de l'Ànsem ho sap.
- id: 12558
  text: Què estàs fent?
- id: 12559
  text: >-
    Li pregunto a l'ordinador si pot

    parlar-nos d'aquells incorporis.
- id: 12560
  text: '[Estudis sobre els incorporis. Informes Ànsem.]'
- id: 12561
  text: Què és això?
- id: 12562
  text: Les dades estan danyades.
- id: 12564
  text: I de l'Organització?
- id: 12565
  text: Mireu!
- id: 12566
  text: Estúpid ordinador!
- id: 12567
  text: Sora!
- id: 12568
  text: ''
- id: 12569
  text: Qui és aquest xato?
- id: 12570
  text: >-
    Bé, veig que l'heu

    fet funcionar.
- id: 12571
  text: Oh! Majestat!
- id: 12572
  text: >-
    Ben fet. {:delay 3A 00}{:clear }L'ordinador ens dirà tot

    el que necessitem saber.
- id: 12573
  text: >-
    Però no para de dir que les

    dades estan totes atrotinades.
- id: 12574
  text: >-
    Només tenim la foto d'un

    paio que no coneixem.
- id: 12575
  text: L'Ànsem el Savi!
- id: 12576
  text: Ens esteu prenent el pèl?
- id: 12577
  text: >-
    Us heu oblidat de quin aspecte

    tenia l'Ànsem, Majestat?
- id: 12578
  text: És clar que no! Aquell no és ell. {:delay 68 00}{:clear }N'estic segur!
- id: 12580
  text: >-
    Disculpeu, podeu venir

    per aquí, si us plau?
- id: 12581
  text: >-
    Mireu, aquest és l'Ànsem. {:delay 78 00}{:clear }{:delay 25 00}{:clear }Ja sabeu, aquell a qui tant

    ens va costar derrotar.
- id: 12582
  text: >-
    Oh, és veritat.

    No us ho he acabat d'explicar.
- id: 12583
  text: ''
- id: 12584
  text: >-
    L'home de la foto és, sens dubte, {:delay 7C 00}{:clear }el que intentà apoderar-se del regne;{:delay 7C 00}{:clear }a qui vosaltres derrotàreu. {:delay 7F 00}{:clear }Però no lluitàveu contra ell,

    sinó contra el seu sensecor.{:delay 44 01}{:clear }En realitat no era l'Ànsem; {:delay 8F 00}{:clear }anava per allà dient-li a

    tot el món que ho era.
- id: 12585
  text: Aleshores...
- id: 12586
  text: Quèeee?
- id: 12587
  text: >-
    Vam lluitar tant sols per

    derrotar a un impostor?
- id: 12589
  text: No m'ho puc creure!
- id: 12590
  text: >-
    Eh... M'estic fent un embolic. {:delay 8C 00}{:clear }Si és un farsant,

    què li va passar al vertader Ànsem?
- id: 12591
  text: >-
    Bé, això és el que

    intento esbrinar.
- id: 12592
  text: >-
    Ànsem el Savi deu saber tot sobre

    els plans de l'Organizació {XIII}{:delay FC 00}{:clear }i el que le està passant als mons.
- id: 12593
  text: Estic segur que ens ajudarà.
- id: 12594
  text: >-
    Sabeu? Vaig ser a punt

    de trobar-lo una vegada...
- id: 12595
  text: ''
- id: 12596
  text: No em digueu que hi ha més!{:delay 5A 00}{:clear }{:delay 2E 00}{:clear }Ja vaig suficientment perdut!
- id: 12597
  text: >-
    Anem a veure...{:delay 5E 00}{:clear }Un tipus anomenat Ànsem,

    que no era realment l'Ànsem,{:delay DE 00}{:clear }es va convertir en un sensecor.{:delay 74 00}{:clear }Llavors, també es va crear un

    incorpori quan va passar allò?
- id: 12598
  text: Sí!
- id: 12599
  text: >-
    I aquell incorpori és el

    líder de l'Organització.
- id: 12600
  text: Quèeee?
- id: 12601
  text: >-
    Sé que he vist abans

    a aquell «fals» Ànsem{:delay 90 00}{:clear }i també he vist el líder

    de l'Organització {XIII}.
- id: 12602
  text: Era com estar amb el mateix tipus.
- id: 12603
  text: Però... on el vau veure?
- id: 12604
  text: Vaja! {:delay 32 00}{:clear }{:delay 34 00}{:clear }No me'n recordo.
- id: 12605
  text: >-
    Ànsem el Savi...{:delay 64 00}{:clear }El vertader Ànsem... Ell deu saber

    la vertadera identitat de l'impostor.{:delay 07 01}{:clear }Per això haig de trobar-lo

    i preguntar-l'ho.
- id: 12606
  text: Tu! {:delay 3C 00}{:clear }{:delay 2D 00}{:clear }Tu vas començar tot això! {:delay 54 00}{:clear }{:delay 4E 00}{:clear }Per culpa teva, el Riku i la Kairi...
- id: 12607
  text: >-
    {:delay 30 00}{:clear }Majestat...

    sabeu on és el Riku?
- id: 12608
  text: Ell... {:delay 3C 00}{:clear }{:delay 54 00}{:clear }Ho sento. {:delay 48 00}{:clear }No sé res.
- id: 12609
  text: De debò, Majestat? {:delay 42 00}{:clear }{:delay 30 00}{:clear }N'esteu segurs?
- id: 12610
  text: Ho sento, Sora.
- id: 12611
  text: >-
    I què passa amb la Kairi? {:delay 3C 00}{:clear }{:delay 2A 00}{:clear }Potser que l'Organització

    l'hagi segrestada!
- id: 12612
  text: Oh, no!
- id: 12613
  text: Sora, Donald, Goofy...
- id: 12614
  text: >-
    Pensava anar a demanar

    ajuda a l'Ànsem el Savi, {:delay A8 00}{:clear }{:delay 1C 00}{:clear }però m'he adonat que he oblidat

    una cosa molt important.
- id: 12615
  text: >-
    Ajudar als altres és més necessari

    que demanar ajuda als altres.
- id: 12616
  text: >-
    Estem sans i estalvis...

    i som lliures!
- id: 12617
  text: >-
    O sigui que no tenim excusa  per

    no voler ajudar els nostres amics.
- id: 12618
  text: >-
    Anirem junts a buscar

    el Riku i la Kairi.
- id: 12620
  text: A fora!
- id: 12621
  text: >-
    Parlant d'ajudar... sembla

    que se'ns necessita aquí!
- id: 12622
  text: >-
    Escolteu, mos sensecor!{:delay 8A 00}{:clear }Ataqueu a aquelles closques

    blanques! Aniquileu-los!
- id: 12623
  text: >-
    Què? Estàs boja?

    No guanyarem mai! {:delay B4 00}{:clear }No sé tu, però jo em piro!
- id: 12624
  text: Ets un cobard patètic!
- id: 12625
  text: ''
- id: 12626
  text: >-
    Sensecor! {:delay 42 00}{:clear }Deixeu els blancs!

    Concentreu-vos en el Sora i llurs amics!
- id: 12627
  text: Oh, oh!
- id: 12628
  text: On és la Malèfica?
- id: 12629
  text: Em sembla que s'ha escapat.
- id: 12630
  text: >-
    Doncs això és bastant

    penós per part seva.
- id: 12631
  text: >-
    Crec que ens hem

    equivocat de bàndol.
- id: 12632
  text: >-
    Mmm... Si voleu escollir bàndol,{:delay 90 00}{:clear }per què no us alieu amb el Léon?

    Sempre necessita ajuda.
- id: 12633
  text: Aquell tal Léon té algún tresor?
- id: 12634
  text: Sí, un munt de coses!
- id: 12635
  text: Perfecte!
- id: 12636
  text: Som-hi.
- id: 12637
  text: Qui sou?
- id: 12638
  text: Ningú que calgui mencionar.
- id: 12639
  text: Solo tres fanáticas de los tesoros.
- id: 12640
  text: Ens veiem, nois!
- id: 12641
  text: De debò que el Léon té un tresor?
- id: 12643
  text: No tenim temps per a això!
- id: 12644
  text: ''
- id: 12645
  text: Sora, és en Sephiroth!
- id: 12646
  text: No se suposa que el Sephiroth és {:delay 74 00}{:clear }la part fosca del cor del Cloud?
- id: 12647
  text: En Cloud us ha dit això?{:delay D2 00}{:clear }{:delay 2D 00}{:clear }Ja deu de ser conscient de tot.
- id: 12648
  text: Però, què penses fer-li?
- id: 12649
  text: >-
    No res.{:delay 7C 00}{:clear }En Cloud és qui

    anhela la foscor.
- id: 12650
  text: Diu que teniu asumptes pendents.
- id: 12651
  text: Ja veig...{:delay 3C 00}{:clear }{:delay 6E 00}{:clear }Vol tornar a veure'm.
- id: 12652
  text: Doncs li donaré el que vol.
- id: 12653
  text: >-
    L'últim raig de llum

    és el més difícil... d'apagar.
- id: 12654
  text: Us hi ajudarem!
- id: 12655
  text: Sora! Darrere teu!
- id: 12657
  text: >-
    El rei és en el pati interior.

    Dirigiu-vos cap allà!
- id: 12658
  text: Entesos!
- id: 12659
  text: ''
- id: 12660
  text: Creus que podràs amb tants?
- id: 12661
  text: Bé...{:delay 6E 00}{:clear }Serà dur si n'apareix un més.
- id: 12662
  text: "{:delay 87 00}{:clear }Llavors jo me n'encarregaré"
- id: 12663
  text: Què? Tu també pretens lluitar?
- id: 12664
  text: Sephiroth!
- id: 12665
  text: >-
    Tinc entès que

    m'estaves buscant.
- id: 12666
  text: >-
    Sí.{:delay 2D 00}{:clear }{:delay 23 00}{:clear }Quan em desfaci de tu,

    la foscor desapareixerà.
- id: 12667
  text: >-
    I voldràs fer-ho? {:delay 5A 00}{:clear }{:delay 28 00}{:clear }Aquella foscor sorgeix

    dels teus propis records. {:delay B4 00}{:clear }{:delay 32 00}{:clear }Creus que pots esborrar el teu passat?
- id: 12668
  text: Calla!
- id: 12669
  text: >-
    Reconèix-ho. Has donat l'esquena

    al present i vius en el passat, {:delay 33 01}{:clear }{:delay 28 00}{:clear }perquè la llum del

    present és molt forta.
- id: 12670
  text: Tu no em coneixes!
- id: 12671
  text: Cloud!
- id: 12672
  text: Ho sé, perquè...{:delay A8 00}{:clear }{:delay 25 00}{:clear }jo soc tu.
- id: 12673
  text: Cloud! Espera!
- id: 12674
  text: Léon! Nois! Aguanteu!
- id: 12675
  text: >-
    Bé, nois, heu d'anar

    a buscar el Riku i la Kairi.
- id: 12676
  text: >-
    El Léon i els altres també

    són els nostres amics!
- id: 12677
  text: >-
    No et preocupis,

    aquí ja hi ha molta ajuda.{:delay 78 00}{:clear }Nosaltres ens encarreguem

    d'aquesta batalla.
- id: 12678
  text: Però... li ho vaig prometre al Léon!
- id: 12679
  text: Donald! Goofy! {:delay 5A 00}{:clear }Agafeu el Sora i aneu-vos-en!
- id: 12680
  text: >-
    Riku, Kairi... doneu-me

    una mica de temps, d'acord?
- id: 12681
  text: Majestat!
- id: 12682
  text: >-
    Entesos. Partirem en

    busca del Riku i la Kairi.
- id: 12683
  text: Bé. Aneu amb compte!
- id: 12684
  text: El mateix us dic, Majestat!
- id: 12685
  text: Espereu, nois!
- id: 12686
  text: Sora, obeeix!
- id: 12687
  text: Vindràs amb nosaltres, t'agradi o no!
- id: 12688
  text: Som-hi, Sora! Has de ser bo.
- id: 12689
  text: D'acord.
- id: 12690
  text: Bé doncs, toquem el dos!
- id: 12691
  text: Endavant!
- id: 12692
  text: Ho sento, Majestat!
- id: 12693
  text: ''
- id: 12694
  text: Espero que ens perdoneu!
- id: 12695
  text: Ei, nois, s'us veu molt animats!
- id: 12696
  text: Fot el camp!
- id: 12697
  text: >-
    No estaves tu trastejant

    en el Inframón? {:delay CC 00}{:clear }Com ha entrat un estaquirot

    com tu a l'Organització {XIII}?
- id: 12698
  text: Segur que no saps ni lluitar.
- id: 12699
  text: Però nosaltres sí!
- id: 12700
  text: >-
    No s'ha de jutjar a ningú

    per les aparences.
- id: 12701
  text: >-
    Uughh... Mira que els vaig dir que

    no m'emboliquessin en aquest merder...
- id: 12702
  text: Qui és aquest sonat?
- id: 12703
  text: >-
    Recorda que l'Organització

    està formada per incorporis.
- id: 12704
  text: Ja... sense cors!
- id: 12705
  text: >-
    Sí que tenim cor!

    No sigueu així...
- id: 12706
  text: No ens enganyes!
- id: 12707
  text: Silenci, traidor!
- id: 12708
  text: >-
    Algú de l'Organització

    vol ser el pròxim?
- id: 12709
  text: Ei! Sora!
- id: 12710
  text: No els provoquis!
- id: 12711
  text: >-
    Sí, hem d'ajudar

    els nostres amics.
- id: 12712
  text: Oh. Perdó.
- id: 12713
  text: Som-hi doncs!
- id: 12714
  text: Ajà! Sou aquí!
- id: 12715
  text: Teniu molts amics als que ajudar.
- id: 12716
  text: >-
    Així que serà millor unir forces i

    acabar amb aquesta batalla d'una vegada!
- id: 12717
  text: Sí, Majestat!
- id: 12718
  text: Compte!
- id: 12719
  text: Goofy!
- id: 12720
  text: No...
- id: 12721
  text: >-
    Ei! Ets el Capità del rei!

    T'has d'aixecar!
- id: 12722
  text: Vinga, desperta!
- id: 12723
  text: Goofy, és l'hora de menjar!
- id: 12724
  text: Goofy!...
- id: 12725
  text: Goofy...
- id: 12726
  text: Això no està passant...{:delay 3C 00}{:clear }{:delay 3C 00}{:clear }No pot ser veritat...{:delay 4B 00}{:clear }{:delay 28 00}{:clear }No pot...
- id: 12727
  text: Això ens ho pagaran.
- id: 12728
  text: Estàs bé?
- id: 12729
  text: Sí, estic bé, però...
- id: 12730
  text: Oohh... Goofy!
- id: 12731
  text: Hola, nois!
- id: 12732
  text: Goofy!
- id: 12733
  text: Ei, això ha fet molt de mal.
- id: 12734
  text: Ahhh, Goofy!
- id: 12735
  text: >-
    Ai, Majestat, sempre

    m'acaben donant a la closca.
- id: 12736
  text: ''
- id: 12737
  text: ''
- id: 12738
  text: Això fa mal també.
- id: 12739
  text: No tornis a fer això mai més!
- id: 12740
  text: Eh?
- id: 12741
  text: Què els passa?
- id: 12742
  text: Eh!
- id: 12743
  text: És el tipus aquell que no és l'Ànsem!
- id: 12744
  text: Vols dir el seu incorpori!
- id: 12745
  text: El líder de l'Organització {XIII}...
- id: 12746
  text: Un moment! Ara ho entenc!
- id: 12747
  text: Savi Ànsem,{:delay 54 00}{:clear }vinc a demanar son consell.
- id: 12748
  text: >-
    M'alegra tenir la oportunitat

    de parlar així, amic meu.{:delay D2 00}{:clear }{:delay 20 00}{:clear }Estic intrigat amb la teva hipòtesi...{:delay 9C 00}{:clear }i em resulta difícil contenir

    les ànsies de posar-la a prova.{:delay 0C 01}{:clear }Tot i així...{:delay 48 00}{:clear }em preocupa l'estabilitat dels mons.
- id: 12749
  text: Sí, a mi també em preocupa.
- id: 12750
  text: >-
    Les portes que han aparegut...{:delay 78 00}{:clear }{:delay 28 00}{:clear }El lloc que busquen els sensecor...{:delay 78 00}{:clear }{:delay 46 00}{:clear }Temo que la meva investigació

    hagi provocat tot això...
- id: 12751
  text: >-
    Mestre Ànsem.{:delay 48 00}{:clear }Amb respecte a l'experiment que

    li vaig presentar l'altre dia...{:delay 99 00}{:clear }{:delay 18 00}{:clear }amb el seu permís, voldria continuar...
- id: 12752
  text: >-
    Ho prohibeixo!{:delay 38 00}{:clear }{:delay 29 00}{:clear }Oblida't de la dita de les portes

    i el cor de tots els mons.{:delay C6 00}{:clear }Aquell lloc no debe ser profanat!
- id: 12753
  text: >-
    Però, mestre Ànsem...

    he estat pensant...
- id: 12754
  text: Xehanort...{:delay 50 00}{:clear }{:delay 2D 00}{:clear }Serà millor que te n'oblidis.
- id: 12755
  text: Ja me'n recordo!{:delay 4E 00}{:clear }És en Xehanort!{:delay 3C 00}{:clear }L'aprenent de l'Ànsem!
- id: 12756
  text: >-
    El líder de l'Organització {XIII}

    és l'incorpori d'en Xehanort!
- id: 12757
  text: Som-hi!
- id: 12758
  text: Fora!
- id: 12759
  text: Hem d'anar a pel Xehanort!
- id: 12760
  text: Sí!
- id: 12761
  text: I el rei?
- id: 12762
  text: És allà!
- id: 12763
  text: Som-hi!
- id: 12764
  text: Majestat!
- id: 12765
  text: Xehanort!
- id: 12766
  text: >-
    Quant de temps deu fer des que

    vaig desfer-me d'aquell nom...
- id: 12767
  text: >-
    Canta-ho, incorpori!

    On és la Kairi? I el Riku?
- id: 12768
  text: No sé res de cap Kairi.{:delay 83 00}{:clear }{:delay 30 00}{:clear }En quant al Riku...{:delay 71 00}{:clear }potser hauries de preguntar-li al teu rei.
- id: 12769
  text: Alto!
- id: 12770
  text: Se n'ha anat!
- id: 12771
  text: Sora... Goofy...
- id: 12772
  text: Què està passant?
- id: 12773
  text: Heu caigut directes a la seva trampa.
- id: 12775
  text: Xemnas?
- id: 12776
  text: L'individu que acabeu de veure.{:delay 5A 00}{:clear }{:delay 14 00}{:clear }El seu líder.{:delay 5A 00}{:clear }{:delay 28 00}{:clear }Et queda clar?{:delay 50 00}{:clear }{:delay 2D 00}{:clear }X-E-M, N-A-S.
- id: 12777
  text: >-
    L'Organització {XIII} vols

    desfer-se dels sensecor?
- id: 12778
  text: Sí que ets curtet nano!
- id: 12779
  text: >-
    Cada sensecor que abateix aquella

    clau espasa allibera un cor captiu.
- id: 12780
  text: I això és el que l'Organització busca.
- id: 12781
  text: >-
    I què pensen fer aquells

    tipus amb els cors?
- id: 12782
  text: No xerraré.
- id: 12783
  text: Parla!
- id: 12784
  text: >-
    Tu! Tu ets el que ha

    segrestat la Kairi!
- id: 12785
  text: Bingo. Em dic Axel. Et queda clar?
- id: 12786
  text: On és la Kairi!?
- id: 12787
  text: Si us plau. Digue-m'ho!
- id: 12788
  text: Mira, pel que fa a la Kairi...{:delay 64 00}{:clear }{:delay 23 00}{:clear }ho sento.
- id: 12789
  text: Axel!
- id: 12790
  text: Oh, oh!
- id: 12791
  text: >-
    Ens asegurarem que

    rebi el màxim càstig.
- id: 12793
  text: >-
    Si és la Kairi el que et preocupa,

    tranquil,{:delay A0 00}{:clear }n'estem cuidant molt bé.
- id: 12794
  text: Porta'm amb ella.
- id: 12795
  text: Tan important és per a tu?
- id: 12796
  text: Sí. Més que res.
- id: 12797
  text: Demostra'm quant t'importa.
- id: 12798
  text: T'ho suplico...
- id: 12800
  text: Maleït...!
- id: 12801
  text: >-
    Estàs enfadat? M'odies?{:delay B6 00}{:clear }{:delay 43 00}{:clear }Pren aquella ràbia i

    dirigeix-la cap als sensecor.
- id: 12802
  text: >-
    Pobres sensecor,

    acumulant cors nèciament.
- id: 12803
  text: >-
    Malgrat això, ni s'imaginen

    el vertader poder que alberguen.
- id: 12804
  text: >-
    La fúria de la clau espasa

    allibera aquells cors,
- id: 12805
  text: >-
    que es concentren en la foscor,

    sense amo, lliures...
- id: 12806
  text: >-
    fins a acabar formant el Regne

    dels Cors, Kingdom Hearts.
- id: 12807
  text: >-
    I quan arribi aquell moment,

    per fi podrem existir realment.
- id: 12808
  text: Però què carai t'empatoies?
- id: 12809
  text: El Kingdom Hearts em pertany a mi!
- id: 12810
  text: >-
    El cor de tots els regnes,

    el cor de tot el que és viu.
- id: 12811
  text: >-
    Un domini anomenat

    Kingdom Hearts ha de ser només meu!
- id: 12812
  text: Malèfica, no! No més sensecor!
- id: 12813
  text: No acepto ordres teves!
- id: 12814
  text: Necia...
- id: 12815
  text: Oh, no!
- id: 12816
  text: >-
    Jo tindré a aquestes criatures a ratlla.{:delay A0 00}{:clear }Tu idea la forma

    d'aniquilar-les per a sempre!
- id: 12817
  text: Malèfica!
- id: 12818
  text: >-
    No t'equivoquis.{:delay 64 00}{:clear }{:delay 19 00}{:clear }Tingues clar que algun

    dia em venjaré de tu.
- id: 12819
  text: Malèfica!
- id: 12820
  text: Ves-te'n!
- id: 12821
  text: No acepto ordres teves!
- id: 12822
  text: Sora! Som-hi!
- id: 12823
  text: Però... què passa amb...?
- id: 12824
  text: Aviam... on ho vam deixar?
- id: 12825
  text: ''
- id: 12826
  text: De part de qui esteu vosaltres?
- id: 12827
  text: >-
    Els sensecor sempre

    s'alien amb el més fort.
- id: 12828
  text: Sí, Sora!{:delay 3C 00}{:clear }{:delay 18 00}{:clear }Allibera més cors!
- id: 12829
  text: No! Els cors!
- id: 12830
  text: >-
    Potser tot el que hem fet...

    no hagi servit de res.{:delay FF 00}{:clear }{:delay 32 00}{:clear }Què faré si no puc

    utilitzar la clau espasa!?
- id: 12831
  text: >-
    Imbècils!{:delay 54 00}{:clear }No es pot confiar en

    vosaltres per a res!
- id: 12832
  text: Eh?
- id: 12833
  text: Sora! Donald! Goofy!
- id: 12834
  text: Tranquil.{:delay 3C 00}{:clear }{:delay 1E 00}{:clear }Aquells no cauran tan fàcilement.
- id: 12835
  text: Aquell escollit de la clau espasa...{:delay 71 00}{:clear }{:delay 41 00}{:clear }és un nano amb sort.
- id: 12836
  text: Fins aviat.
- id: 12837
  text: Mentiders!
- id: 12838
  text: Què?
- id: 12839
  text: El Léon no té cap tresor!
- id: 12840
  text: I mira que vam lluitar per vosaltres.
- id: 12841
  text: Donald...?
- id: 12842
  text: A veure, els havia de dir alguna cosa!
- id: 12843
  text: >-
    No veig com podrem

    arreglar això.
- id: 12844
  text: Llavors, què fem?
- id: 12845
  text: Ens endurem el vostre tresor.
- id: 12846
  text: Però si no tenim res!
- id: 12847
  text: Seguro?
- id: 12848
  text: '{:delay 6A 00}Hmm... anem a veure-ho!'
- id: 12849
  text: ''
- id: 12850
  text: Ajà!
- id: 12851
  text: Bé! Està decidit!{:delay 6A 00}{:clear }Ens endurem tots els vostres objectes!
- id: 12852
  text: Serà una broma!
- id: 12853
  text: Vinga ja!
- id: 12854
  text: Quin fàstic!
- id: 12855
  text: No érem amics?
- id: 12856
  text: Mireu, ho sentim per l'engany, però...
- id: 12858
  text: >-
    O sigui que no estaria bé

    que us ho traguéssim tot.
- id: 12860
  text: Adeu! Bona sort!
- id: 12861
  text: Què fa el Cloud?
- id: 12862
  text: Ni idea.
- id: 12863
  text: '{:delay 85 00}Per cert, vosaltres tres...{:delay BE 00}{:clear }{:delay 1F 00}{:clear }qui sou?'
- id: 12864
  text: No sé si t'ho hauríem de dir.
- id: 12865
  text: Vaja!{:delay 30 00}{:clear }{:delay 23 00}{:clear }Quina espasa més interessant que dus.
- id: 12866
  text: És la clau espasa!
- id: 12867
  text: >-
    Ja ho veig...{:delay 38 00}{:clear }{:delay 67 00}{:clear }Així que allò és una clau espasa.{:delay 7F 00}{:clear }{:delay 48 00}{:clear }I suposo que tu en

    deus ser l'escollit.
- id: 12868
  text: I què si ho soc?
- id: 12869
  text: >-
    Em pregunto si canviarà d'opinió...

    quan et derroti.
- id: 12870
  text: Què t'ha semblat?
- id: 12871
  text: "Admeto que ets molt hàbil...{:delay 90 00}{:clear }{:delay 2B 00}{:clear }però, aparentment, el Cloud és\nl'únic... que pot eliminar-me. "
- id: 12872
  text: >-
    {:delay AF 00}{:clear }Digues al Cloud que vingui aquí.{:delay 85 00}{:clear }{:delay 37 00}{:clear }Digues-li que el Sephiroth vol

    resoldre les coses.
- id: 12937
  text: '{:unk13 DF 00 EA 00}{:unk08 01 01 00}És a les Fosques Profunditats.'
- id: 12938
  text: >-
    {:unk13 92 00 34 00}{:unk08 01 01 06}Ja veig...{:clear }Doncs suposo que és el

    moment d'acabar amb tot això.
- id: 12939
  text: '{:unk13 91 00 4B 00}{:unk08 01 01 06}Cloud...'
- id: 12940
  text: "{:unk13 A9 00 32 00}{:unk08 01 01 04}No n'estic molt segur..."
- id: 12941
  text: >-
    {:unk13 A5 00 4B 00}{:unk08 01 01 06}Si el veus,

    avisa'm.
- id: 12942
  text: Li has donat el meu missatge?
- id: 12943
  text: Pot ser.
- id: 12944
  text: >-
    Sento haver-te fet esperar,

    Sephiroth!
- id: 12945
  text: Cloud...{:delay 2D 00}{:clear }{:delay 5E 00}{:clear }Mai deixaràs enrere la foscor...
- id: 12946
  text: Calla.
- id: 12947
  text: Mai deixaràs enrere el teu passat...
- id: 12948
  text: Calla!
- id: 12949
  text: Cloud! A per ell!
- id: 12950
  text: ''
- id: 12952
  text: No importen les vegades que caigui...{:delay 7E 00}{:clear }{:delay 2D 00}{:clear }la teva foscor segueix cridant-me!
- id: 12953
  text: ''
- id: 12954
  text: Fals!
- id: 12955
  text: Tifa! No t'hi apropis!
- id: 12956
  text: Què dius!?{:delay 32 00}{:clear }{:delay 19 00}{:clear }Vull ajudar-te.
- id: 12957
  text: No pots.{:delay 3C 00}{:clear }{:delay 28 00}{:clear }Mai abandonarà la foscor.
- id: 12958
  text: >-
    No té per què. Només necessita

    a algú que el rodegi amb llum.
- id: 12959
  text: >-
    La foscor seguirà allà, Sephiroth...{:delay AE 00}{:clear }però en un lloc on tu

    no hi podràs arribar.
- id: 12960
  text: No em diguis?
- id: 12961
  text: Vejam què pot fer aquesta llum teva.
- id: 12962
  text: No!
- id: 12965
  text: Compte!
- id: 12967
  text: Cloud, pots comptar amb la meva llum.
- id: 12968
  text: La llum no t'encaixa.
- id: 12969
  text: Jo ja...{:delay 3C 00}{:clear }{:delay 73 00}{:clear }ni ho sé...
- id: 12970
  text: Prou!
- id: 12971
  text: Eh?
- id: 12972
  text: ''
- id: 12973
  text: On s'han ficat?
- id: 12974
  text: >-
    Creieu que han tornat

    al seu propi món?
- id: 12975
  text: >-
    Han anat a un altre lloc...{:delay 69 00}{:clear }{:delay 5A 00}{:clear }En Cloud ha anat a lliurar

    una gran batalla...{:delay 78 00}{:clear }{:delay 2D 00}{:clear }contra la seva foscor interna.
- id: 12976
  text: Se n'ha tornat a anar.
- id: 12977
  text: Què faràs ara?
- id: 12978
  text: '{:delay 93 00}Suposo que seguir buscant.'
- id: 12980
  text: No et preocupis.{:delay 37 00}{:clear }{:delay 2D 00}{:clear }La llum és fàcil de trobar.
- id: 12981
  text: Haig de marxar.{:delay 30 00}{:clear }{:delay 0F 00}{:clear }Teniu, això és per ajudar-me.
- id: 12982
  text: >-
    Però... espera...

    quan t'hem ajudat?
- id: 12983
  text: ''
- id: 12988
  text: Heu vist el Sephiroth?
- id: 12989
  text: >-
    {:unk13 00 01 40 01}{:unk08 02 00 06}Parlar-li del Sephiroth?

    {:chardelay 0A 00}No, potser no n'hauria.

    {:chardelay 09 00}És clar!
- id: 12990
  text: >-
    Oblidem tantes coses.

    A vosaltres, la ciutat...{:clear }Ara ja les recordem. Les coses

    estimades sempre es queden en el cor.
- id: 12995
  text: >-
    Puc sentir-ho en el meu cor.{:clear }Sephiroth...

    sé que ets a prop.
- id: 12996
  text: >-
    Digues-li al Cloud que vingui aquí, que

    en Sephiroth vol arreglar unes qüestions.
- id: 12997
  text: >-
    Aquí tampoc hi és. Tot i així,

    sento que hi soc a prop.{:clear }Segur que l'estic estalonant.

    Aviat l'enxamparé.
- id: 13019
  text: >-
    Riqueses! ¡Riqueses!
            Soc tan feliç! ♪{:clear }... Ah! Tu!?
- id: 13020
  text: >-
    Ei, Rikku! Para de cantar

    i escolta...{:clear }... Eh? Tu!?
- id: 13872
  text: '{:unk13 FA 00 2D 00}{:unk08 01 00 05}Aviat el veureu.'
- id: 13963
  text: >-
    No m'interessa el que

    li passi a aquest món.{:clear }A més, no crec que necessitis

    més ajuda de la que ja tens.
- id: 14151
  text: >-
    Pensava que seria més gustós...

    No aconsegueixo atinar amb el sabor.{:clear }Si pogués fer aquell gelat,

    sé que a tots els hi encantaria.{:clear }I jo guanyaria una fortuna!
- id: 14247
  text: >-
    {:unk13 D2 00 37 00}{:unk08 01 00 06}Santes gaites!

    Ho he aconseguit!{:clear }He recreat el

    «Gelat de sal marina»!
- id: 14248
  text: >-
    {:unk13 72 01 8C 00}{:unk08 01 00 06}Mmm!

    Podem tastar-lo?
- id: 14249
  text: '{:unk13 FF 00 41 00}{:unk08 01 00 05}I tant!'
- id: 14250
  text: '{:unk06 02}{:unk13 45 01 32 00}{:unk08 03 00 05}Bufa! És bo!'
- id: 14251
  text: '{:unk06 02}{:unk13 13 01 3F 00}{:unk08 03 00 05}Que salat!'
- id: 14252
  text: '{:unk13 A4 01 6E 00}{:unk08 01 00 06}I dolç!'
- id: 14253
  text: >-
    {:unk13 C8 00 78 00}{:unk08 01 00 05}Sí. És únic!{:clear }Quan era un xic, a tots

    els marrecs ens encantava.
- id: 14294
  text: >-
    Pot ser que tot el que hem fet...

    no hagi servit de res.{:delay FF 00}{:clear }{:delay 32 00}{:clear }Què faré si no puc

    utilitzar la clau espasa!?
- id: 14295
  text: Imbècils!{:delay 54 00}{:clear }No es pot confiar en vosaltres per a res!
- id: 14296
  text: Eh?
- id: 14297
  text: ''
- id: 14672
  text: >-
    Sí, un farsant. Però se l'havia

    d'aturar de totes maneres.
- id: 14755
  text: >-
    Baluard Balmat té un problema...

    i molt gros.
- id: 15149
  text: >-
    Si home! Pots dir el que

    vulguis, però això no canviarà res.
- id: 15150
  text: Doncs t'apartarem per la força!
- id: 15151
  text: >-
    Però no ho soc. Estic amb

    l'Organització i no em feu cap por.
- id: 15152
  text: >-
    Ja! {:delay 22 00}{:clear }Gran discurs per a algú que

    es queda al marge mentre {:delay 7E 00}{:clear }els incorporis lluiten per ell!
- id: 15153
  text: >-
    Vaja, vaja. {:delay 46 00}{:clear }{:delay 19 00}{:clear }Us heu endut una

    impressió equivocada.
- id: 15154
  text: I ploraràs?
- id: 15155
  text: >-
    Si home!{:delay 3C 00}{:clear }I si et recordo què tant durs que

    són aquells a qui us enfronteu?
- id: 15156
  text: Recordar-me?
- id: 15157
  text: '{:delay B0 00}{:clear }Així és. Ell solia posar aquesta mateixa cara.'
- id: 15158
  text: >-
    Suposo que creus que pots

    marejar-me dient coses aleatories.
- id: 15159
  text: Porteu-vos bé!
- id: 15160
  text: Ostres! S'ha escapat!
- id: 15161
  text: Què estrany! {:delay 4B 00}{:clear }{:delay 23 00}{:clear }Què és això de «la mateixa cara»?
- id: 15162
  text: >-
    Ehh, jo crec que només

    intentava confondre't.
- id: 15163
  text: Eh?
- id: 15164
  text: Què és això?
- id: 15165
  text: No serà...?
- id: 15166
  text: >-
    Pot ser que s'hagi obert la porta

    com va dir en Yen Sid.
- id: 15167
  text: Sí senyor!
- id: 15168
  text: Ho sento, Léon, {:delay 69 00}{:clear }{:delay 1E 00}{:clear }però la resta de mons ens criden.
- id: 15169
  text: >-
    L'Organització {XIII}...{:delay 64 00}{:clear }{:delay 50 00}{:clear }Semblen molt durs.

    Aneu amb compte per allà fora.
- id: 15170
  text: Fins aviat.
- id: 15173
  text: >-
    {:unk13 A0 00 E3 00}{:unk08 01 01 02}I potser també alguna cosa

    del Regne de la Foscor?{:clear }Sembla que allà és

    on són el Riku i la Kairi.
- id: 15174
  text: '{:unk13 9A 01 BE 00}{:unk08 01 00 05}Ouuugh...'
- id: 15175
  text: '{:unk13 91 00 37 00}{:unk08 01 01 06}Anirem a veure el Tron.'
- id: 15255
  text: Sí que se't veu una mica canviat, Cloud...
- id: 15256
  text: Passa alguna cosa?
- id: 15257
  text: Ehh...
- id: 15258
  text: No és res.
- id: 15259
  text: ''
- id: 15260
  text: No t'hi fiquis.
- id: 15261
  text: >-
    Voldràs dir que no em vols

    al teu costat quando marxis.
- id: 15263
  text: De debò?
- id: 15264
  text: Sí.
- id: 15265
  text: >-
    Veus? No sembles molt segur. {:delay 91 00}{:clear }{:delay 64 00}{:clear }Bé, d'acord, ho entenc.

    Ves-te'n. Fes el que has de fer.
- id: 15266
  text: Eh?
- id: 15267
  text: Per molt lluny que siguis d'aquí,{:delay 70 00}{:clear }{:delay 4D 00}quan trobis la teva llum... {:delay 51 00}{:clear }{:delay 37 00}{:clear }segur que et guiarà de tornada...{:delay 7A 00}{:clear }{:delay 4F 00}Oi que sí?
- id: 15268
  text: Suposo.
- id: 15269
  text: Doncs jo em quedaré aquí...{:delay 51 00}{:clear }{:delay 37 00}{:clear }i pensaré en tu.{:delay 70 00}{:clear }{:delay 46 00}D'acord, Cloud?
- id: 15270
  text: D'acord.
- id: 15271
  text: Creus que li anirà bé?
- id: 15272
  text: Li anirà bé.{:delay 33 00}{:clear }{:delay 5C 00}{:clear }Segur que encara conserva una mica de llum.
- id: 15273
  text: Tens raó.
- id: 15278
  text: >-
    És que... {:delay 32 00}{:clear }{:delay 78 00}{:clear }Escolta, encara que

    marxi lluny, tornaré.
- id: 15610
  text: >-
    M'alegra que tots estiguin bé,

    però encara no podem relaxar-nos.{:clear }Ens hem de mantenir units

    pel bé dels nostres amics!
- id: 15774
  text: >-
    Vinga va, és tot un montatge

    de l'Organització {XIII}.
- id: 15775
  text: >-
    El Xemnas us està utilitzant

    per destruir els sensecor.{:delay D2 00}{:clear }Aquell és el seu pla mestre.
- id: 15963
  text: Oblida-te'n.
- id: 15964
  text: >-
    El Léon ens ho ha explicat tot.{:delay 62 00}{:clear }{:delay 24 00}{:clear }Diu que el vostre viatge

    ha sigut bastant dur.
- id: 15965
  text: Us animarem!
- id: 15966
  text: Teniu, això és un regal!
- id: 15967
  text: >-
    Perdoneu, sou del

    Comitè de Reconstrucció?
- id: 15968
  text: Què trama la colla del Léon?
- id: 16056
  text: >-
    {:unk13 B2 00 39 00}{:unk08 01 01 07}Són just

    per allà.
- id: 16057
  text: Quin lloc és aquest?
- id: 16058
  text: El Regne de la Foscor!
- id: 16059
  text: Kairi! Riku!
- id: 16060
  text: Qui hi ha!?
- id: 16061
  text: Què és això?
- id: 16062
  text: Segur que vols obrir...
- id: 16063
  text: '... allò?'
- id: 16064
  text: >-
    Òndia!

    És la colla de Vila Crepuscle.{:delay B8 00}{:clear }Hi són el Hayner, el Pence, l'Olette...{:delay 91 00}{:clear }I, ehm...
- id: 16065
  text: Roxas.
- id: 16066
  text: El coneixes?
- id: 16067
  text: >-
    No...{:delay 2D 00}{:clear }{:delay 2F 00}{:clear }M'ha vingut aquell nom de cop.

    Ell és... el Roxas.
- id: 16068
  text: Segur que vols menjar-te...
- id: 16069
  text: '... això?'
- id: 16070
  text: Salat?...{:delay 50 00}{:clear }{:delay 14 00}{:clear }No!... Dolç!
- id: 16071
  text: >-
    Encara no!

    Haig de buscar la Kairi!
- id: 16072
  text: Saps on anar?
- id: 16750
  text: El Léon ha caigut! Utilitza Sanar per despertar-lo!
- id: 17002
  text: Un retrat de l'Ànsem.
- id: 17003
  text: >-
    Un retrat de l'home a qui

    vas confondre con l'Ànsem.
- id: 17004
  text: Un retrat d'en Xehanort.
- id: 17005
  text: >-
    El gargot que diu

    «Door to Darkness».
- id: 17006
  text: No saps per a què serveix aquest aparell.
- id: 17007
  text: Aquest aparell et permet veure el Tron.
- id: 17008
  text: Està tancada amb un sistema especial.
- id: 17624
  text: >-
    {:unk0f 03 1E 00 59 01}{:color #00F0F080}S'ha agregat l'ordre Màgia.{:reset}

    En utilitzar màgia, consumeixes PM de

    l'indicador de la part inferior dreta.{:clear }{:unk0f 00 00 00 00 00}Per utilitzar dreceres, prem {:icon dynamic-l1}.

    En acabar-se, els PM es recuperen als

    cercles de llum o després d'una estona.
- id: 17625
  text: >-
    {:unk0f 03 1E 00 59 01}{:color #00F0F080}S'ha agregat l'ordre Invocar.{:reset}

    En utilitzar-lo, l'indicador de Fusió es converteix en el d'Invocar.{:clear }{:unk0f 00 00 00 00 00}El personatge invocat reemplaça la resta

    del grup. Prova les diferents accions que

    apareixen amb cada invocació.
- id: 17626
  text: >-
    {:unk0f 01 02 01 96 00}A les ciutats, parla amb els Moguris.

    Poden fabricar objectes amb diversos materials.{:clear }{:unk0f 00 00 00 00 00}Recull els materials necessaris

    per a la fabricació d'objectes.
- id: 17845
  text: Derrota a tots els enemics!
- id: 17846
  text: >-
    Derrota a tots els enemics!

    Si utilitzes les ordres de reacció

    amb {:icon dynamic-triangle}, la batalla serà més fácil!
- id: 17863
  text: >-
    Si ens separem, com ja va passar,

    no podrem ajudar-nos mútuament.{:clear }En moments així, no hem de

    donar treva als nostres enemics!
- id: 17864
  text: >-
    Vaja! No sé què ha passat, però

    em sap greu haver-us preocupat!{:clear }Què passarà ara? Hem d'estar

    preparats per al que sigui!
- id: 17865
  text: >-
    Quin caràcter té aquella nana!

    Pensava que ho destrossaria tot.{:clear }Tot i que potser ha trencat alguna cosa.

    Podríes anar a revisar l'estudi?
- id: 17866
  text: >-
    El rei s'ha avançat sol!

    Hem d'anar rere seu! Ràpid!
- id: 17867
  text: >-
    Aquella explosió ve de fora, no?

    Deu estar passant alguna cosa terrible!{:clear }Em temo que serà una llarga batalla.

    Estàs preparat, Sora?
- id: 17868
  text: >-
    Hi ha qui, si té l'oportunitat,

    pot convertir-se en heroi.{:clear }Mai perdis el teu coratge ni la

    teva compassió pels altres, Sora.
- id: 17869
  text: >-
    Una vegada que el programa del Cid

    sigui a punt, l'enviaré des de l'{:theme 0A}estudi{:reset}.{:clear }Però, si perdem el Tron, serà inútil.

    Ves i ajuda'l, Sora.
- id: 17870
  text: >-
    Sembla que has crescut un

    munt aquest últim any.{:clear }No em refereixo només al teu cos.

    T'has tornat encara més fort.{:clear }Aquest és el Sora que conec.
- id: 17871
  text: >-
    El sistema de defensa ha estat

    restaurat i ens hem ocupat del PCM.{:clear }Ara heu de continuar el vostre viatge.

    Si ens necessiteu, compteu amb nosaltres.
- id: 17872
  text: >-
    Serà genial ser del Comitè de

    Reconstrucció del Verger Radiant!{:clear }No veig l'hora! Atents, ciutadans.

    Aquí ve la gran ninja Yuffie!
- id: 17919
  text: Tot això m'és igual.
- id: 17920
  text: >-
    Deixa'm entrar al Regne

    de la Foscor, d'acord?
- id: 17927
  text: >-
    Ja l'has trobat?

    M'alegro que estigui bé.{:clear }Crec que si l'un busca suficientment,

    sempre trobarà el que vol.{:clear }Per on hauria de seguir ara?
- id: 17928
  text: >-
    Últimament tenim molts problemes.{:clear }Mira aquella estranya màquina del

    meu quarto. Es carrega l'ambient!
- id: 17929
  text: >-
    La màgia és molt útil i pot

    combinar-se amb altres accions.{:clear }Molts són capaços d'utilitzar màgia,

    així que no t'oblidis de practicar.
- id: 17930
  text: >-
    Diuen que la ciutat pot ser

    reconstruïda sense ordinadors.{:clear }El Merlí estava en contra d'ells.

    Deia que interferien en tot.
- id: 17931
  text: >-
    El Léon estava preocupat per vosaltres.

    No va dir res, però era evident.{:clear }Ja! No entenc per què els homes

    sempre amaguen els seus sentiments!
- id: 17932
  text: >-
    Veig que esteu tots

    més animats que mai.{:clear }Manteniu la calma, amics.

    Recordeu que això no és un joc.
- id: 17933
  text: >-
    Existeixen moltes armes estranyes.

    Algunes destinades als escollits.{:clear }Aquelles armes estan lligades

    fortament als seus amos.{:clear }Tu i la teva clau espasa

    en sou una mostra.
- id: 17934
  text: >-
    El Tron ja està bé i la reconstrucció

    de la ciutat segueix en marxa.{:clear }Quan la ciutat estigui restaurada,

    farem una festa en el vostre honor.
- id: 17935
  text: >-
    Protegirem la ciutat.

    Tu ves a per el líder enemic.{:clear }No et preocupis.

    Confia en mi, xicot!
- id: 17936
  text: >-
    Hi ha masses enemics fins i tot per al

    Léon. Heu de donar-li un cop de mà.{:clear }Podeu arribar fins a ell a través de la

    paret trencada del pati interior. Ràpid!
- id: 17937
  text: >-
    Vosaltres sí que sabeu lluitar!

    El meu ninjutsu també és poderós!{:clear }Mireu! Hiiiioh... Un moment. Si

    fes allò, podria enderrocar la casa.
- id: 17938
  text: >-
    Què està passant!? Tindrà alguna

    cosa a veure amb aquells programes?{:clear }Si és així, aneu per aquell terminal

    i arregleu-ho amb el Tron.
- id: 17939
  text: >-
    La ciudad sencera està tremolant!

    Sora, què passa allà dins?
- id: 18015
  text: >-
    Així que t'importa de veritat.

    En aquest cas...
- id: 18016
  text: La resposta és no.
- id: 18017
  text: Absurd.
- id: 18018
  text: >-
    Res guanyaràs derrotant-me.

    Tu ho saps millor que ningú, Cloud.
- id: 18074
  text: >-
    Mmm.

    Aquí tampoc hi és.{:clear }Bé, no deixaré que

    s'amagui de mi sempre.
- id: 18075
  text: >-
    He posat el llibre a l'estanteria.{:clear }Per què trigarà tant el Merlí?

    Espero que el Pooh estigui bé.
- id: 18076
  text: >-
    Parlaré amb el Merlí. Tu ves a

    veure què ha passat dins del llibre.{:clear }Ha rebut una bona sacsejada.

    Tant de bo que el Pooh i els altres estiguin bé.
- id: 18225
  text: Això són notes sobre la foscor.
- id: 18226
  text: >-
    Això són notes sobre

    els cors del món.
- id: 18227
  text: >-
    Això són notes sobre

    les connexions entre mons.
- id: 18228
  text: >-
    Aquesta tuberia subministra

    energia a la ciutat.
- id: 18229
  text: >-
    Pots veure la Vall del Malvat,

    on hi vivia la Malèfica.
- id: 18230
  text: >-
    Davant teu s'extèn una

    profund congost.
- id: 18231
  text: >-
    Aquesta màquina controla el

    sistema de seguretat de la paret.
- id: 18232
  text: Aquesta grua s'utilitza per reconstruir la ciutat.
- id: 18233
  text: >-
    Amb aquest gel es

    podrien fer bons gelats.
- id: 18234
  text: >-
    Aquí es guarden

    materials de construcció.
- id: 18235
  text: Aquesta botiga és un refrigerador gegant.
- id: 18236
  text: Un plànol de la xarxa elèctrica de la ciutat.
- id: 18237
  text: Plànols del sistema de defensa.
- id: 18238
  text: >-
    Aquest ordinador ha estat modificat

    per a l'ús personal del Cid.
- id: 18239
  text: Una pissarra per a reunions d'estratègia.
- id: 18240
  text: Hi ha pèls de la barba d'en Merlí.
- id: 18241
  text: >-
    Aquesta màquina s'utilitza

    per a estudis de màgia.
- id: 18242
  text: >-
    La maleta preferida d'en Merlí.

    Molt espaiosa.
- id: 18243
  text: >-
    Un diari sobre els mons que en

    Merlí ha visitat i sobre el futur.
- id: 18244
  text: >-
    En aquest llibre, es descriuen amb

    detall els encanteris creats pel Merlí.
- id: 18245
  text: >-
    Aquest és l'armari que en

    Merlí sempre miniaturitza.
- id: 18708
  text: >-
    En Demyx t'ha desafiat a una sèrie de

    proves! Supera-les i enfronta-t'hi!
- id: 18709
  text: >-
    Utilitza totes les teves estratègies

    i habilitats per vèncer el Sephiroth!
- id: 18836
  text: "{:unk13 FA 00 3C 00}{:unk08 01 01 06}Un moment, Sora.{:clear }Què n'és, de la teva màgia?"
- id: 18837
  text: '{:unk13 18 01 64 00}{:unk08 01 00 05}Eh?{:clear }Ah, doncs la veritat...'
- id: 18838
  text: >-
    {:unk13 C8 00 46 00}{:unk08 01 01 07}Potser te n'has

    oblidat mentre

    dormies!
- id: 18839
  text: >-
    {:unk13 AA 00 46 00}{:unk08 01 01 07}Ai, què faré amb tu?{:clear }Bé, hauré de deixar-te

    alguns encanteris.{:clear }Però has d'anar

    amb compte!
- id: 18840
  text: >-
    {:unk13 AC 00 53 00}{:unk08 01 01 05}Gràcies,

    Merlí!
- id: 18841
  text: >-
    {:unk13 68 01 D2 00}{:unk08 01 00 05}Al pati interior,

    i ràpid!
- id: 18842
  text: >-
    {:unk13 BB 00 48 00}{:unk08 01 00 06}Ah! Una cosa més.{:clear }Sora, deixa que t'atorgui nous

    poders a les teves peces.
- id: 18843
  text: '{:unk13 F0 00 64 00}{:unk08 01 01 06}De debò!?'
- id: 18844
  text: >-
    {:unk13 A9 00 4C 00}{:unk08 01 00 06}És clar!{:clear }Has fet tantes coses...

    Considera-ho una mostra

    d'agraïment.
- id: 18845
  text: >-
    {:unk13 A0 00 4B 00}{:unk08 01 01 07}Gràcies, Majestat!{:clear }Ara hem de reunir-nos

    amb el Tron.{:clear }Podríeu esperar-nos

    aquí?
- id: 18846
  text: >-
    {:unk13 DE 00 4E 00}{:unk08 01 00 05}Ho faré, Sora.

    I recorda: ves amb compte!
- id: 18847
  text: >-
    {:unk13 18 01 46 00}{:unk08 01 01 06}Ara bé, el llibre no és

    l'únic valuós...{:clear }Això és per a tu, Sora.
- id: 18848
  text: '{:unk13 FA 00 5A 00}{:unk08 01 00 05}Què és?'
- id: 18849
  text: >-
    {:unk13 A0 00 46 00}{:unk08 01 01 06}Només cal que et concentris

    en això amb tot el teu cor...{:clear }i només anomenant-lo

    podràs invocar un aliat...{:clear }per a que t'ajudi en

    els moments difícils.
- id: 18850
  text: >-
    {:unk13 DC 00 46 00}{:unk08 01 00 05}Com ho feien el Simba i el Mushu

    l'última vegada que vam ser aquí?
- id: 18851
  text: >-
    {:unk13 C8 00 3C 00}{:unk08 01 01 06}Exactament.{:clear }Ara, tu i els teus amics

    heu de seguir endavant!
- id: 18852
  text: >-
    {:unk13 DC 00 46 00}{:unk08 01 00 06}Gràcies, Merlí.{:clear }Estem preocupats pel Pooh,

    així que tornarem en quant

    trobem les pàgines arrencades.
- id: 18908
  text: >-
    He inventat un nou producte:

    un monopatí. Vols veure com va?
- id: 18909
  text: >-
    {:unk13 00 01 40 01}{:unk08 02 00 06}Què oportú. El proves?

    {:chardelay 33 00}No, estic molt ocupat.

    {:chardelay 52 00}És clar, per què no?
- id: 18910
  text: >-
    No consegueixo el sabor del gelat, però

    almenys els meus monopatins van bé.
- id: 18911
  text: >-
    {:unk13 00 01 40 01}{:unk08 02 00 06}Què oportú. Una altra vegada?

    {:chardelay 33 00}No, estic molt ocupat.

    {:chardelay 52 00}És clar, per què no?
- id: 18912
  text: >-
    Necessito millorar el meu monopatí.

    Podries ajudar-me?
- id: 18913
  text: >-
    {:unk13 00 01 40 01}{:unk08 02 00 06}Vols provar el monopatí?

    {:chardelay 33 00}No, estic molt ocupat.

    {:chardelay 52 00}Sí, per què no?
- id: 19322
  text: >-
    Tens alguna pàgina del llibre del

    Pooh? Estan escampades pels mons.{:clear }Troba-les totes! Sé que el Pooh

    i els seus amics t'importen molt.
- id: 19323
  text: >-
    Què està passant!? La ciutat està

    infestada d'incorporis i sensecor!{:clear }El Léon i els altres han anat al pati

    interior. Anem a buscar-los!
- id: 19324
  text: >-
    Així que aquell era el Sephiroth.

    S'assembla una mica al Cloud.{:clear }M'agradaria avisar-lo, però

    abans hem d'ajudar als altres.
- id: 19566
  text: >-
    Això són notes

    sobre el cor humà.
- id: 19748
  text: Baluard Balmat
- id: 19860
  text: La Malèfica vol apoderar-se del castell...
- id: 19864
  text: No pot seeeeer!
- id: 19871
  text: '[Gràcies.]'
- id: 19889
  text: '[Gràcies!]'
- id: 20173
  text: >-
    {:unk08 02 00 06}Vols enfrontar-te a una versió més

    forta del Xemnas a partir de les seves dades?

    {:chardelay 33 00}Ara no.

    {:chardelay A1 00}A punt per lluitar!
- id: 20174
  text: >-
    {:unk08 02 00 06}Vols enfrontar-te a una versió més forta

    del Xigbar a partir de les seves dades?

    {:chardelay 33 00}Ara no.

    {:chardelay A2 00}A punt per lluitar!
- id: 20175
  text: >-
    {:unk08 02 00 06}Vols enfrontar-te a una versió més forta

    del Xaldin a partir de les seves dades?

    {:chardelay 33 00}Ara no.

    {:chardelay A3 00}A punt per lluitar!
- id: 20176
  text: >-
    {:unk08 02 00 06}Vols enfrontar-te a una versió més forta

    del Vexen a partir de les seves dades?

    {:chardelay 33 00}Ara no.

    {:chardelay A4 00}A punt per lluitar!
- id: 20177
  text: >-
    {:unk08 02 00 06}Vols enfrontar-te a una versió més forta

    del Lexaeus a partir de les seves dades?

    {:chardelay 33 00}Ara no.

    {:chardelay A5 00}A punt per lluitar!
- id: 20178
  text: >-
    {:unk08 02 00 06}Vols enfrontar-te a una versió més forta

    del Zexión a partir de les seves dades?

    {:chardelay 33 00}Ara no.

    {:chardelay A6 00}A punt per lluitar!
- id: 20179
  text: >-
    {:unk08 02 00 06}Vols enfrontar-te a una versió més forta

    del Saïx a partir de les seves dades?

    {:chardelay 33 00}Ara no.

    {:chardelay A7 00}A punt per lluitar!
- id: 20180
  text: >-
    {:unk08 02 00 06}Vols enfrontar-te a una versió més forta

    de l'Axel a partir de les seves dades?

    {:chardelay 33 00}Ara no.

    {:chardelay A8 00}A punt per lluitar!
- id: 20181
  text: >-
    {:unk08 02 00 06}Vols enfrontar-te a una versió més forta

    del Demyx a partir de les seves dades?

    {:chardelay 33 00}Ara no.

    {:chardelay A9 00}A punt per lluitar!
- id: 20182
  text: >-
    {:unk08 02 00 06}Vols enfrontar-te a una versió més forta

    del Luxord a partir de les seves dades?

    {:chardelay 33 00}Ara no.

    {:chardelay AA 00}A punt per lluitar!
- id: 20183
  text: >-
    {:unk08 02 00 06}Vols enfrontar-te a una versió més forta

    del Marluxia a partir de les seves dades?

    {:chardelay 33 00}Ara no.

    {:chardelay AB 00}A punt per lluitar!
- id: 20184
  text: >-
    {:unk08 02 00 06}Vols enfrontar-te a una versió més forta

    de la Larxene a partir de les seves dades?

    {:chardelay 33 00}Ara no.

    {:chardelay AC 00}A punt per lluitar!
- id: 20185
  text: >-
    {:unk08 02 00 06}Vols enfrontar-te a una versió més forta

    del Roxas a partir de les seves dades?

    {:chardelay 33 00}Ara no.

    {:chardelay AD 00}A punt per lluitar!
- id: 20239
  text: >-
    Un dispositiu de control i emmagatzematge

    de dades. El corredor s'ha obert.
- id: 20337
  text: >-
    No és possible seguir per aquí.

    Haurem de buscar una altre camí.
- id: 20358
  text: N'ha passat molt, de temps, «vell amic».
- id: 20541
  text: Utilitza atacs potents per obrir les vàlvules. Has d'obrir les tres a la vegada!
- id: 20543
  text: >-
    Venç el Vexen de l'Organització {XIII}!

    Trenca el seu escut per poder fer-li.

    Evita els cercles o robarà les teves dades!
- id: 20544
  text: >-
    Venç el Zexión de l'Organització {XIII}!

    No perdis de vista el seu llibre màgic!
- id: 20545
  text: >-
    Venç el Marluxia de l'Organització {XIII}!

    Perds si el comptador sobre el teu cap

    arriba a zero amb els cops de godalla.

    Aprofita les ordres de reacció!
- id: 20546
  text: >-
    Venç la Larxene de l'Organització {XIII}!

    Quan es multipliqui, ataca a dos dels seus

    dobles a la vegada i inflingiràs el doble de mal.
- id: 20547
  text: >-
    Venç el Lexaeus de l'Organització {XIII}!

    La seva força va augmentant durant la

    batalla. Contraatacar és la teva millor opció!
- id: 20600
  text: Prem {:icon dynamic-triangle} per començar el duel! Colpeja'l i fes que no deixi de girar!
- id: 20693
  text: Perds si el comptador arriba a zero!
- id: 20697
  text: Rescata els teus amics atrapats en el llibre!
- id: 21388
  text: '{:unk13 31 01 5A 00}{:unk08 01 00 05}Eh?'
- id: 21389
  text: '{:unk13 82 00 37 00}{:unk08 01 01 06}Crec que han sortit de allà.'
- id: 21390
  text: >-
    {:unk13 54 01 8C 00}{:unk08 01 00 05}Des de quan hi ha allà un forat?

    Hi habrà alguna cosa dins?
- id: 21391
  text: >-
    {:unk06 02}{:unk13 A0 00 A0 00}{:unk08 03 01 05}Ja hi haurà temps per a això!

    Hem d'anar a per el rei!
- id: 21483
  text: "{:delayandfade 08 78} \nSegons el Merlí, el Pooh no recorda\nres perquè els sensecor han robat\nalgunes pàgines del seu llibre.\n \nEl Sora ha d'afanyar-se en\nrecuperar una a una les pàgines\ni tornar al món del simpàtic os\nabans que la cosa empitjori.\n \n \n"
- id: 21484
  text: "{:delayandfade 0A 78} \nEl Sora torna a casa el Merlí\ni rep de part del Cid la notícia que\nl'ordinador de l'Ànsem ha aparegut\ni que podria contenir dades sobre el\nRiku, la Kairi, el rei i l'Organització {XIII}.\n \nEntusiasmats per la troballa,\nen Sora, el Donald i el Goofy\ns'afanyen cap a la sala de l'ordinador.\n \n"
- id: 21485
  text: "{:delayandfade 07 B4} \nGràcies a l'inestimable ajuda del Tron,\nel Sora i els seus aconsegueixen tornar al\nmón real, però encara queda molt per fer.\n \n \n \n \n \n \n"
- id: 21486
  text: "{:delayandfade 08 78} \nEs necesaria una contraseña\npara acceder a los datos de\nlas investigaciones de Ànsem,\ny qué mejor lugar para buscarla\nque su propio estudio.\n \nSora y sus amigos saben que\ndar con ella no será una tarea\nfácil, pero tras un registro\nminucioso...\n"
- id: 21487
  text: "{:delayandfade 0A 78} \nUn año atrás, Sora y sus amigos\nse enfrentaron a un vil sincorazón\nque pretendía hacerse con\nKingdom Hearts: Ànsem, el buscador\nde oscuridad.\n \nSin embargo, ahora descubren que\nno es ese su verdadero nombre.\nAquel sincorazón era un impostor\nque simplemente suplantó tal nombre."
- id: 21488
  text: "{:delayandfade 0A 78} \nL'infame líder de l'Organització {XIII}.\nL'incorpori del Xehanort, l'aprenent\nde l'Ànsem.\n \n \n \n \n \n \n \n"
- id: 21489
  text: "{:delayandfade 0A 78} \nHa arribat el moment de\nposar fi a la contesa.\n \nEl Xehanort no pot escapar-se!\n \n \n \n \n \n \n"
- id: 21490
  text: "{:delayandfade 0A 78} \nCom poden estar els sensecor\nde l'entorn de dades del Tron\nen el món real?\n \nSegons la Yuffie, el PCM està\nmovent els fils del seu malvat\npla des de el món dels ordinadors.\n \n \n \n"
- id: 21491
  text: "{:delayandfade 0A 78} \nNo hi ha forma de contactar amb el\nTron així que les esperances recauen\nen Cid, que està desenvolupant el\nprograma d'Erradicació del PCM.\n \n \n \n \n \n"
- id: 21492
  text: "{:delayandfade 08 78} \nAra que ho han resolt,\nnomés queda una cosa a fer.\n \nMentre l'Aerith i la resta\nd'encarreguen de les coses en\nel món dels usuaris, el Sora ha\nd'entrar de nou a l'entorn de dades.\n \n \n"
- id: 21493
  text: "{:delayandfade 0A 78} \nEn acabar de compartir amb el Cloud\nles paraules del Sephiroth, el jove\nabaixa el cap i reflexiona...\n \n\"«Doncs és l'hora que acabem\namb això»\", sentencia.\n \n \n \n"
- id: 21565
  text: Les teves ordres són al llibre! Allibera-les!
- id: 21566
  text: Ja pots utilitzar les ordres!
- id: 21623
  text: Troba el vertader abans que sigui massa tard!
