- id: 5771
  text: >-
    Si us plau, convenç el Jack perquè

    desisteixi. Em preocupa que faci res perillós.
- id: 5772
  text: >-
    No puc comptar amb aquella

    canalla per fer les coses bé.{:clear }En comptes d'ells, voldríeu

    ajudar-m'hi vosaltres?
- id: 5773
  text: >-
    Mai podrem organitzar Halloween

    amb aquells tipus per aquí prop!{:clear }De pressa! Has d'anar amb el

    {:theme 0A}Pare Cruel{:reset} i posar-hi punt i final!
- id: 5774
  text: >-
    Oh, no! Mireu! Surt fum

    de la casa!{:clear }Heu de rescatar el Pare Cruel!

    De pressa!
- id: 5778
  text: >-
    Mmm... Aquí no veig res que

    puguem utilitzar per a Halloween.
- id: 5779
  text: >-
    Qui sigui que s'hagi colat en el

    taller ha d'haver sortit corrent.{:clear }Dubto que hagin arribat molt lluny.

    Potser en trobem pistes a fora.
- id: 5780
  text: >-
    L'entrada al taller de

    joguines és per allà.{:clear }Hem estat tan ocupats que el {:theme 0A}taller{:reset}

    ha funcionat dia i nit! No dormim!
- id: 5781
  text: >-
    Bé, no puc permetre

    que el Jack m'eclipsi.{:clear }Espero que aquest any tots

    gaudiu de Halloween i de Nadal.
- id: 5784
  text: >-
    Els sensecor estan causant problemes

    a la{:theme 0A} Plaça de la Guillotina{:reset}.{:clear }Semblava que estaven jugant amb regals.

    Aneu amb compte.
- id: 5785
  text: >-
    Hi ha un dispositiu

    especial colocat a dalt.{:clear }Com que va causar molts problemes, ara

    només hi pot entrar el personal autoritzat.
- id: 5790
  text: Això és Vila Halloween, oi?
- id: 5791
  text: >-
    Sí! Sí que s'assembla a

    Vila Hallo... Eh?
- id: 5792
  text: Ei! És el Zero!{:delay 6C 00}{:clear }Com va, nano?
- id: 5793
  text: Què deu ser això?
- id: 5794
  text: És el Jack!
- id: 5795
  text: Sora, Donald i Goofy! {:delay 9B 00}{:clear }Benvinguts i bon Nadal!
- id: 5796
  text: Bon Nadal? {:delay 85 00}{:clear }Voldràs dir bon Halloween!
- id: 5797
  text: >-
    I tant! Bon Halloween

    de part de Jack Skelleton...{:delay D2 00}{:clear }el Rei Carbassa!
- id: 5798
  text: >-
    Perdoneu-me! És que aquest any

    celebraré Nadal sense estar-me de res,{:delay 0E 01}{:clear }així que me'n vaig a Vila

    Nadal a veure el Pare Cruel.
- id: 5799
  text: Pare Cruel?
- id: 5800
  text: Em penso que es refereix al Pare Noel.
- id: 5801
  text: No són preciosos aquests adorns?
- id: 5802
  text: >-
    Aquest any, Nadal també inundarà

    Vila Halloween!
- id: 5803
  text: Però abans...
- id: 5804
  text: >-
    Hem de visitar la Sally.{:delay 72 00}{:clear }Està traballant en una cosa que qualsevol

    Pare Cruel que es preï hauria de tenir.{:delay EA 00}{:clear }Veniu... Us l'ensenyaré!
- id: 5805
  text: Un Nadal a Vila Halloween...
- id: 5806
  text: Hi fem un cop d'ull?
- id: 5807
  text: Som-hi, ràpid!
- id: 5808
  text: Hola, Doctor! On és la Sally?
- id: 5809
  text: >-
    No veus que estic enmig

    d'un experiment?
- id: 5810
  text: Eh! Això pesa massa!
- id: 5811
  text: Deixem-ho anar!
- id: 5812
  text: Ni s'us acudeixi fer-ho!{:delay 7D 00}{:clear }I ara, porteu-ho aquí.
- id: 5813
  text: Compte!
- id: 5814
  text: >-
    Imbècils!

    M'heu arruinat l'experiment!
- id: 5815
  text: Sally! L'has acabat?{:delay 6C 00}{:clear }Vull ensenyar-ho als meus amics.
- id: 5816
  text: Em sap greu, Jack.{:delay 5A 00}{:clear }Necesito una mica més de temps.
- id: 5817
  text: Ohh...
- id: 5818
  text: Bé, no passa res.{:delay 66 00}{:clear }Mentre estigui a punt per Nadal!
- id: 5819
  text: Però... Jack...
- id: 5820
  text: >-
    Millor me'n vaig ja.{:delay 4E 00}{:clear }Haig d'aconseguir el

    Pare Cruel de seguida!
- id: 5821
  text: Ha sigut un plaer tornar a veure-us.
- id: 5822
  text: Fins aviat!
- id: 5823
  text: '«Aconseguir» el Pare Noel?'
- id: 5824
  text: >-
    Si us plau, Sora.{:delay 3C 00}{:clear }Temo que li passi una cosa horrible si

    el Jack segueix endavant amb això.
- id: 5825
  text: Oi tant, Sally!
- id: 5826
  text: Sora?
- id: 5827
  text: >-
    Aquells tipus tan raros de la plaça

    del poble van amb vosaltres?
- id: 5828
  text: Eh? Quins tipus?
- id: 5829
  text: >-
    Ja saps, aquells que volen

    sabotejar Halloween i Nadal.{:delay C6 00}{:clear }Com es deien?{:delay 73 00}{:clear }Sensecor?
- id: 5830
  text: >-
    És clar que no van amb nosaltres!{:delay 5A 00}{:clear }  {:delay 14 00}{:clear }Tranquil. El Donald, el 

    Goofy i jo ens en desfarem.
- id: 5831
  text: I després anirem a veure el Pare Noel!
- id: 5832
  text: Però primer... els sensecor!
- id: 5833
  text: >-
    Escolteu-me bé... bestioles rares!{:delay 96 00}{:clear }Sortiu de Vila Halloween ara

    mateix, per ordre de l'Alcalde!
- id: 5834
  text: >-
    Jack! On ets?{:delay 8A 00}{:clear }Jo només soc un simple funcionari,

    no puc ocupar-me'n sol.
- id: 5835
  text: Jack!
- id: 5836
  text: Ja venim!
- id: 5837
  text: >-
    {:unk13 2F 01 38 00}{:unk06 01}{:unk08 01 00 05}Com podria relaxar-se

    el Pare Cruel amb tot...{:clear }el que està passant?
- id: 5838
  text: >-
    {:unk13 4A 01 50 00}{:unk06 01}{:unk08 01 00 05}Exacte, amics!{:clear }El Pare Cruel necessita

    guardaespatlles. Esteu

    preparats per a la tasca?
- id: 5839
  text: '{:unk13 AE 01 D2 00}{:unk06 02}{:unk08 03 00 06}Nosaltres?'
- id: 5840
  text: '{:unk13 E6 00 78 00}{:unk06 00}{:unk08 01 01 06}Sí!'
- id: 5841
  text: Què ens enduem la propera vegada?
- id: 5842
  text: Un cub ple d'orugues!
- id: 5843
  text: O una cosa encara pitjor!
- id: 5844
  text: Qui és aquella?
- id: 5845
  text: Sembla una vella!
- id: 5846
  text: Silenci!
- id: 5847
  text: Una bruixa?
- id: 5848
  text: >-
    Vosaltres tres podríeu ser-me útils.{:delay 02 01}{:clear }Veniu amb mi.{:delay 66 00}{:clear }Us ensenyaré el vertader

    significat de la paraula «maldat».
- id: 5849
  text: >-
    Bé, guardaespatlles!{:delay 66 00}{:clear }Vila Nadal és per aquí!{:delay 90 00}{:clear }La porta és al bosc,

    just després del cementiri!
- id: 5850
  text: >-
    Aquí és!

    La porta de Vila Nadal.
- id: 5851
  text: >-
    Els ensurts de Halloween van

    perdent gràcia cada any.{:delay F0 00}{:clear }Volia alguna cosa nova.

    I em vaig topar amb això!
- id: 5852
  text: >-
    Rere aquesta porta hi ha un món ple

    de meravelles com mai les heu vistes!
- id: 5853
  text: >-
    Al principi no podia

    creure el que veia!{:delay 84 00}{:clear }Tot era tan nou i emocionant!
- id: 5854
  text: Va! Obre-la ja!
- id: 5855
  text: Guauuuu!
- id: 5856
  text: I el Pare Noel?
- id: 5857
  text: En el seu taller.
- id: 5858
  text: Hi anem?
- id: 5859
  text: Aquí també!?
- id: 5860
  text: En guàrdia, fidels guardaespatlles meus!
- id: 5861
  text: El Nadal té problemes!
- id: 5862
  text: >-
    Òndia! No podem deixar

    que li passi res al Nadal.
- id: 5863
  text: Allà és on viu el Pare Cruel.
- id: 5864
  text: >-
    Vaja! Hola a tothom.{:delay 66 00}{:clear }Veniu a veure si sou a la

    meva llista de nens bons?
- id: 5865
  text: El teu nom?
- id: 5866
  text: Eh... Sora, senyor.
- id: 5867
  text: A veure... Sora...
- id: 5868
  text: Aquí ets.
- id: 5869
  text: >-
    Doncs segons la meva llista, Sora...{:delay B4 00}{:clear }fa set anys vas dir a tothom

    que no creies en el Pare Noel.{:delay 4A 01}{:clear }Això no està gens bé.
- id: 5870
  text: Què diu del Donald i el Goofy?
- id: 5871
  text: Si senyor!
- id: 5872
  text: >-
    Soc jo a la seva llista?

    Soc el Jack!
- id: 5873
  text: Jack Skelleton?
- id: 5874
  text: >-
    Espero que no vinguis a

    causar problemes un altre cop.
- id: 5875
  text: Un altre cop?
- id: 5876
  text: És una llarga història.
- id: 5877
  text: Per què hem d'amagar-nos?
- id: 5878
  text: >-
    Silenci!{:delay 60 00}{:clear }Vaja! Quina sopresa més agradable!{:delay A8 00}{:clear }Aquell babau del Jack hi ha

    portat el Sora i els altres.{:delay BA 00}{:clear }Ara podrem defer-nos-en a la vegada!
- id: 5879
  text: Què vols que fem?
- id: 5880
  text: Qui hi ha?
- id: 5881
  text: Pescats!
- id: 5882
  text: Són el Nyek, la Poll i el Puça!
- id: 5883
  text: Aquells tres...!
- id: 5884
  text: No venen amb nosaltres.
- id: 5885
  text: >-
    Doncs sigui com sigui,

    han sigut molt trapelles.{:delay B7 00}{:clear }Aneu a buscar-los i porteu-los aquí.{:delay 84 00}{:clear }S'han guanyat una bona reprimenda.
- id: 5886
  text: >-
    Eh... Sr. Cruel...{:delay 54 00}{:clear }Volia parlar amb vosté

    sobre Nadal...
- id: 5887
  text: >-
    Això haurà d'esperar.{:delay 78 00}{:clear }Haig de veure com van

    les coses en el meu taller.
- id: 5888
  text: Va, Jack.{:delay 23 00}{:clear }Atrapem aquells gamberros.
- id: 5889
  text: Aahh... Molt bé, doncs.
- id: 5890
  text: >-
    Em venia de gust destruir aquella

    ridícula Vila Nadal.{:delay 4A 01}{:clear }Però ara que el Sora i aquells babaus

    són aquí, cal un canvi de pla.{:delay 6E 01}{:clear }Al cap i a la fi, la venjança

    va abans que el plaer.
- id: 5891
  text: Quina classe de venjança?
- id: 5892
  text: >-
    La més malèvola i roí que existeixi,

    és clar.
- id: 5893
  text: Allò sona a molt dolent.
- id: 5894
  text: Tan dolent com el del Sac!
- id: 5895
  text: I això ja és dolentíssim!
- id: 5896
  text: L'Home del Sac?{:delay 66 00}{:clear }Aquell sac de cuques rabioses?{:delay 1A 01}{:clear }Què interessant!{:delay 6C 00}{:clear }On puc trobar-lo?
- id: 5897
  text: >-
    El Jack i els seus estúpids

    amics van acabar amb ell.
- id: 5898
  text: Ah, sí. Ja me'n recordo.{:delay E4 00}{:clear }Doncs molt millor!{:delay 90 00}{:clear }Em sembla que us retornaré el vostre amo.
- id: 5899
  text: "{:delay CD 00}{:clear }Em sento com un milió de cuques! {:delay B4 00}{:clear }  {:delay 1E 00}{:clear }Te'n dec una, Malèfica."
- id: 5900
  text: Oi tant, Home del Sac.{:delay 96 00}{:clear }Et recordes del Sora, el Donald i el Goofy?
- id: 5901
  text: >-
    I tant que me'n recordo!

    Ets increïble! {:delay FA 00}{:clear }  {:delay 0F 00}{:clear }Mai podria oblidar el que em...{:delay C8 00}{:clear }  {:delay 14 00}{:clear }Què era el que em van fer?
- id: 5902
  text: Et van aixafar com una cuca!
- id: 5903
  text: No sona bé això!
- id: 5904
  text: I el Jack els va ajudar!
- id: 5905
  text: Encara pitjor!
- id: 5906
  text: Et van apallissar!
- id: 5907
  text: >-
    És veritat, és veritat! {:delay 78 00}{:clear }  {:delay 14 00}{:clear }Allò és una cosa que no oblidaré fàcilment!

    És l'últim que recordo. {:delay 1D 01}{:clear }  {:delay 0F 00}{:clear }I serà l'únic que recordo fins que{:delay 91 00}{:clear }ensenyi a aquells pallassos a no

    ficar-se amb l'Home del Sac.
- id: 5908
  text: Sí... Exacte. Així es parla.{:delay FC 00}{:clear }I ja tinc el pla perfecte en ment.
- id: 5909
  text: >-
    Has sentit a parlar de

    Vila Nadal?
- id: 5910
  text: Home del Sac!
- id: 5911
  text: Desperta! Desperta!
- id: 5912
  text: Volem veure com de dolent ets!
- id: 5913
  text: >-
    {:delay 4E 00}{:clear }Sembla que encara no

    s'ha recuperat del tot.{:delay 02 01}{:clear }Vosaltres tres, quedeu-vos aquí i

    manteniu el Sora i els altres ocupats.
- id: 5914
  text: >-
    Els meus sensecor us ajudaran.

    Però no em falleu!
- id: 5915
  text: Són allà!
- id: 5916
  text: Atureu-los!
- id: 5917
  text: Fot-los canya!
- id: 5918
  text: A ells!
- id: 5919
  text: '{:unk13 6E 00 96 00}{:unk06 00}{:unk08 01 00 06}Ha, ha, ha!'
- id: 5920
  text: '{:unk13 2C 01 64 00}{:unk06 00}{:unk08 01 00 06}Que divertit!'
- id: 5921
  text: '{:unk13 04 01 78 00}{:unk06 00}{:unk08 01 01 06}Aneu a veure si el Sr. Sac és a punt!'
- id: 5922
  text: '{:unk13 DD 00 36 00}{:unk06 02}{:unk08 03 00 05}Home del Sac!?'
- id: 5923
  text: >-
    {:unk13 6C 01 61 00}{:unk06 00}{:unk08 01 00 05}No és el mateix que un

    cop va intentar dominar

    Vila Halloween?
- id: 5924
  text: >-
    {:unk13 40 01 2D 00}{:unk06 00}{:unk08 01 00 05}El mateix. Amics, aquí 

    fa olor de problemes...
- id: 5925
  text: >-
    {:unk13 2C 01 82 00}{:unk06 00}{:unk08 01 01 06}Òndia, com si no en

    tinguéssim prou ja.
- id: 5926
  text: Ostres, jo ara m'he perdut.
- id: 5927
  text: >-
    Ah! Això és absolutament ridícul.{:delay A8 00}{:clear }Tot ha de ser a punt

    abans de Nadal!
- id: 5928
  text: És vostè el Sr. Pare Cruel?
- id: 5929
  text: >-
    Més o menys.

    Millor digues-me Pare Noel.
- id: 5930
  text: >-
    És clar.{:delay 3C 00}{:clear }Sr. Pare Noel,

    esperava trobar-lo aquí.{:delay E4 00}{:clear }Miri... és molt important

    que torni a Vila Nadal.{:delay F6 00}{:clear }Tinc por que passi alguna

    cosa horrible si no ho fa.
- id: 5931
  text: >-
    Bé, els preparatius per al

    gran dia van amb retràs.{:delay F6 00}{:clear }Digues al Jack que l'espero a casa.{:delay DE 00}{:clear }Volia dir-me alguna cosa de Nadal.
- id: 5932
  text: >-
    Aquell és el problema!{:delay 66 00}{:clear }Si us plau, vagi a casa i tanqui la

    porta. I si en Jack truca, no l'obri!
- id: 5933
  text: Allà! El grassonet de vermell.
- id: 5934
  text: Només haig de segrestrar-lo?
- id: 5935
  text: >-
    Exacte.{:delay 5A 00}{:clear }Tanca'l immediatament!{:delay 78 00}{:clear }Després, comença a destruir

    Vila Nadal.{:delay D8 00}{:clear }Segur que el Sora i aquells

    babaus vindran corrent.
- id: 5936
  text: I llavors seran meus!
- id: 5937
  text: >-
    Sí...{:delay 50 00}{:clear }  {:delay 14 00}{:clear }I mentrestant,{:delay 3C 00}{:clear }convertiré el

    Pare Noel en Pare Sensecor!{:delay F0 00}{:clear }
- id: 5938
  text: Ja n'estem?
- id: 5939
  text: Qui hi ha?
- id: 5940
  text: '{:unk13 FA 00 3C 00}{:unk06 00}{:unk08 01 01 06}Què passa, Sally?'
- id: 5941
  text: >-
    {:unk13 AA 00 64 00}{:unk06 01}{:unk08 01 00 06}Jack! L'Home del Sac ha

    segrestat el Pare Noel!
- id: 5942
  text: '{:unk13 E6 00 3C 00}{:unk06 02}{:unk08 03 01 07}Oh, no!'
- id: 5943
  text: >-
    {:unk13 AA 00 64 00}{:unk06 01}{:unk08 01 00 06}I es dirigia cap

    a Vila Nadal!
- id: 5944
  text: >-
    {:unk13 FA 00 78 00}{:unk06 00}{:unk08 01 01 06}Som-hi, Jack,

    de pressa!
- id: 5945
  text: ''
- id: 5946
  text: He redecorat això una mica!
- id: 5947
  text: >-
    Espera...

    Em sembla que hi falta alguna cosa...{:delay B4 00}{:clear }  {:delay 28 00}{:clear }Ja ho tinc!{:delay 64 00}{:clear }Un xic més del toc

    especial de l'Home del Sac!
- id: 5948
  text: >-
    Espero que aquest vell grassonet tingui

    ganes de convertir-se en un sensecor!
- id: 5949
  text: Seràs carnús!
- id: 5950
  text: >-
    Segueixes aquí? {:delay 73 00}{:clear }Per què no dessacpareixes per on

    has vingut? M'estàs fotent!
- id: 5951
  text: >-
    És que has oblidat qui t'ha fet

    tornar, insolent sac de cuques?
- id: 5952
  text: >-
    Em sap greu!

    No em recordo de res!
- id: 5953
  text: >-
    Molt bé, ingrat.{:delay 72 00}{:clear }Et penediràs del dia en què

    vas menysprear la meva ajuda.
- id: 5954
  text: La casa del Pare Noel!
- id: 5955
  text: ''
- id: 5956
  text: Jack Skelleton!
- id: 5957
  text: Ah! Home del Sac!
- id: 5958
  text: >-
    {:delay 82 00}{:clear }Tu i jo tenim un

    deute pendent, Jack!{:delay B4 00}{:clear }  {:delay 1E 00}{:clear }I el mateix va pels teus amiguets!
- id: 5959
  text: Què penses fer al Pare Cruel?
- id: 5960
  text: Qui? {:delay 3C 00}{:clear }  {:delay 2D 00}{:clear }Pare Cruel? {:delay 64 00}{:clear }  {:delay 28 00}{:clear }No sé de què m'estàs parlant.
- id: 5961
  text: >-
    I què fa aquí aquest

    grassonet de vermell?{:delay A0 00}{:clear }  {:delay 32 00}{:clear }Toca el dos, vell xaruc!
- id: 5962
  text: Eh?
- id: 5964
  text: Sr. Pare Noel!
- id: 5965
  text: Maleïts!
- id: 5966
  text: ''
- id: 5967
  text: Alto!
- id: 5968
  text: ''
- id: 5969
  text: >-
    Bé.

    El Nadal està salvat!
- id: 5970
  text: >-
    Perfecte!

    Serà millor que em posi a treballar!
- id: 5971
  text: Deixa-ho al Pare Noel!
- id: 5972
  text: >-
    Sí, tu hauries de limitar-te

    a Halloween i els ensurts!
- id: 5973
  text: Jack.
- id: 5974
  text: Ja està acabat.
- id: 5975
  text: Meravellós!{:delay 48 00}{:clear }Vaja, és perfecte!{:delay 48 00}{:clear }Gràcies, Sally!
- id: 5976
  text: Jack...{:delay 36 00}{:clear }de debò has de fer això?
- id: 5977
  text: Però si soc un Pare Cruel estupend!
- id: 5978
  text: >-
    Vejam, Jack Skelleton.{:delay 90 00}{:clear }Has salvat el Nadal i a mi.

    I te n'estic molt agraït.{:delay 08 01}{:clear }Però promet-me que no

    causaràs més problemes!
- id: 5979
  text: I pel que fa a aquell vestit...!
- id: 5980
  text: Ni se t'acudeixi intentar suplantar-me!
- id: 5981
  text: >-
    Penso que li vindria bé una mica

    d'ajuda aquest any, Sr. Cruel.{:delay C6 00}{:clear }Deu estar esgotat

    amb tants preparatius.{:delay A2 00}{:clear }Només dic que si descansés

    aquest any, jo podria...
- id: 5982
  text: >-
    {:delay 3C 00}{:clear }Sí, ser el Pare Noel

    pot ser esgotador,{:delay C6 00}{:clear }però deixa que et digui una cosa, Jack.{:delay 7E 00}{:clear }Veure les cares felices dels nens

    quan descobreixen els regals{:delay 0E 01}{:clear }fa que tot valgui la pena,

    any rere any rere any.
- id: 5983
  text: >-
    Però tu, Jack...{:delay 54 00}{:clear }A tu t'encanta fer que cridin

    i veure com tremolen de por.{:delay E4 00}{:clear }I si algú intentés

    treure't tot això?
- id: 5984
  text: >-
    Els dos tenim feines

    molt importants.{:delay D8 00}{:clear }Jo haig de cuidar-me de Nadal

    i tu de Halloween.{:delay 26 01}{:clear }Així que cadascú ha de fer el que

    li toca de la millor manera possible.
- id: 5985
  text: >-
    Al cap i a la fi,{:delay 5A 00}{:clear }tu ets l'estrella de Halloween,

    Jack Skelleton!{:delay D2 00}{:clear }El Rei Carbassa!{:delay 54 00}{:clear }El senyor dels malsons!
- id: 5986
  text: >-
    Tot i que estiguis fascinat

    amb Nadal, Jack,{:delay D2 00}{:clear }Halloween és la teva

    veritable especialitat.{:delay AE 00}{:clear }No ho veus?{:delay 5A 00}{:clear }Els nens depenen de la nostra feina.{:delay A8 00}{:clear }Halloween i Nadal ens necessiten

    els dos urgentment.
- id: 5987
  text: >-
    Té raó!

    Soc el mestre del terror!{:delay D2 00}{:clear }I si Halloween ha caigut

    en la monotonia,{:delay 8A 00}{:clear }hauré de pensar en noves

    maneres d'espantar!
- id: 5988
  text: Jack! Jack!
- id: 5989
  text: >-
    T'he estat buscant

    per tot arreu!{:delay 9C 00}{:clear }Hem de repassar els plans

    per al proper Halloween!{:delay C6 00}{:clear }I necessito la teva aprovació!
- id: 5990
  text: És cert.
- id: 5991
  text: Bona sort, Jack Skelleton.
- id: 5992
  text: En fi. Cap allà que va!
- id: 5993
  text: >-
    Sí!{:delay 3C 00}{:clear }I jo tinc molts noms a comprovar

    i un munt de coses a acabar!
- id: 5994
  text: Jack! No és moment d'ensurts ara!
- id: 5995
  text: >-
    Què és això?{:delay 4E 00}{:clear }Potser és massa

    festiu per al Halloween.
- id: 5996
  text: Serà millor que ens en anem.
- id: 5997
  text: >-
    Abans d'anar-te'n, Sora...{:delay 78 00}{:clear }Em sembla que hi ha un amic teu que,

    si no ho recordo malament,{:delay 02 01}{:clear }fou qui et va dir que

    el Pare Noel no existia.
- id: 5998
  text: Ah, sí.{:delay 64 00}{:clear }  {:delay 0F 00}{:clear }Sí que m'ho va dir.
- id: 5999
  text: >-
    No t'oblidis de donar-li

    records de part meva.
- id: 6000
  text: Oh, i tant, però...{:delay 32 00}{:clear }  {:delay 1E 00}{:clear }sap on puc trobar el Riku?
- id: 6001
  text: No...{:delay 5A 00}{:clear }Però no et rendeixis! Recorda,{:delay A2 00}{:clear }si creus en el Riku... el trobaràs.{:delay E4 00}{:clear }Igual que m'has trobat a mi.
- id: 6002
  text: D'acord!
- id: 6003
  text: >-
    Mmm...{:delay 48 00}{:clear }No hi ha cap errada en el meu disseny.

    És perfecte!{:delay E4 00}{:clear }Hi deu haver alguna fallada en les

    peces que m'han dut aquells babaus.
- id: 6004
  text: Haig de buscar-me uns altres ajudants.
- id: 6005
  text: Eeehh?
- id: 6006
  text: Just a temps, cavallers!{:delay 72 00}{:clear }Què us sembla si em doneu un cop de mà?
- id: 6007
  text: >-
    Diria que aquests regals són

    del Pare Cruel.{:delay 84 00}{:clear } Hauríem de tornar-los-hi.
- id: 6008
  text: Segur que només vols retornar-los?
- id: 6009
  text: >-
    És clar, Sora.{:delay 4E 00}{:clear }S'han acabat les fantasies

    de Nadal. Ja ho saps.
- id: 6010
  text: I no penses treure't aquell vestit?
- id: 6011
  text: Això?{:delay 28 00}{:clear }Només és una disfressa.
- id: 6012
  text: >-
    I la Sally ha treballat

    moltíssim per fer-lo.
- id: 6013
  text: Som-hi! Tenim molta feina a fer!
- id: 6014
  text: Oh!
- id: 6015
  text: On has trobat això?
- id: 6016
  text: >-
    A Vila Halloween.{:delay 60 00}{:clear }Els necessitaràs per al Nadal,

    oi, Cruel?
- id: 6017
  text: >-
    I tant.{:delay 8A 00}{:clear }Però aquests són només alguns

    dels regals que em van robar.
- id: 6018
  text: L'hi han robat?
- id: 6019
  text: >-
    Oh, Cruel!

    No pensaràs que he estat jo.
- id: 6020
  text: Segueixes duent el vestit, pel que veig.
- id: 6021
  text: >-
    Només volia estar

    elegant per a l'ocasió.{:delay E4 00}{:clear }Si no em creus,{:delay 7B 00}{:clear }haurem d'esbrinar qui

    ho va fer en realitat.
- id: 6022
  text: Molt bé, t'ho deixo a tu.
- id: 6023
  text: >-
    Molt bé!{:delay 2A 00}{:clear }Sora, Donald, Goofy!

    Ens en anem!
- id: 6024
  text: Això fa bona pinta.
- id: 6025
  text: No!
- id: 6026
  text: Quin rotllo!
- id: 6027
  text: Aquest?
- id: 6028
  text: No!
- id: 6029
  text: Ni parlar-ne!
- id: 6030
  text: Eh!
- id: 6031
  text: Així que vosaltres sou els lladres!
- id: 6032
  text: Lladres?
- id: 6033
  text: >-
    Heu robat els regals,

    oi que sí?
- id: 6034
  text: Nosaltres no hem sigut!
- id: 6035
  text: Però...
- id: 6036
  text: Això sembla molt divertit!
- id: 6037
  text: A córrer!
- id: 6038
  text: '{:unk13 0E 01 5A 00}{:unk06 00}{:unk08 01 00 00}On heu posat els regals?'
- id: 6039
  text: >-
    {:unk13 2C 01 64 00}{:unk06 00}{:unk08 01 00 05}Ja t'ho hem dit!

    No els tenim!
- id: 6040
  text: >-
    {:unk13 7D 01 51 00}{:unk06 00}{:unk08 01 00 05}Què esteu fent

    aquí doncs!?
- id: 6041
  text: >-
    {:unk13 2C 01 32 00}{:unk06 00}{:unk08 01 00 06}Estem buscant peces

    per a l'experiment.
- id: 6042
  text: '{:unk13 5B 01 6F 00}{:unk06 00}{:unk08 01 00 05}Experiment?'
- id: 6043
  text: >-
    {:unk13 71 01 87 00}{:unk06 00}{:unk08 01 01 07}El Dr. Finkelstein ens

    està fabricant un amic!
- id: 6044
  text: '{:unk13 4D 01 51 01}{:unk06 00}{:unk08 01 01 07}Un a qui puguem potinejar!'
- id: 6045
  text: >-
    {:unk13 59 01 41 00}{:unk06 00}{:unk08 01 00 05}És cert, últimament

    el Doctor ha estat treballant

    moltes hores en alguna cosa...
- id: 6046
  text: >-
    {:unk13 5E 01 32 00}{:unk06 00}{:unk08 01 00 05}A més, els regals

    de Nadal són avorrits!{:clear }No espanten ni fan fàstic...

    Què poden tenir-ne, de bo?
- id: 6047
  text: '{:unk13 A4 01 78 00}{:unk06 00}{:unk08 01 00 06}Això!'
- id: 6048
  text: >-
    {:unk13 42 01 32 00}{:unk06 00}{:unk08 01 00 05}No hi ha res divertit aquí.

    Tornem a Vila Halloween!
- id: 6049
  text: >-
    {:unk13 4E 01 2D 00}{:unk06 00}{:unk08 01 00 05}Bé, se n'han anat els gamberros

    que s'havien endut els regals?
- id: 6050
  text: '{:unk13 F9 00 2B 00}{:unk06 00}{:unk08 01 01 06}No ho sembla.'
- id: 6051
  text: '{:unk13 E9 00 AC 00}{:unk06 00}{:unk08 01 00 05}Això vol dir que...'
- id: 6052
  text: '{:unk13 96 00 64 00}{:unk06 00}{:unk08 01 00 05}Sally!'
- id: 6053
  text: >-
    {:unk13 B4 00 50 00}{:unk06 00}{:unk08 01 01 06}Oh, gràcies a Déu!

    Sou tots aquí.
- id: 6054
  text: '{:unk13 C8 00 64 00}{:unk06 00}{:unk08 01 00 05}Que passa res?'
- id: 6055
  text: >-
    {:unk13 B4 00 50 00}{:unk06 00}{:unk08 01 01 06}Els sensecor han tornat

    a la plaça del poble.{:clear }Penso que ho havíeu de saber.
- id: 6056
  text: '{:unk13 C8 00 64 00}{:unk06 00}{:unk08 01 00 05}És el nostre moment!'
- id: 6057
  text: '{:unk13 46 01 81 00}{:unk06 00}{:unk08 01 00 05}Tornem a Vila Halloween!'
- id: 6058
  text: '{:unk13 5E 01 3C 00}{:unk06 00}{:unk08 01 00 05}Un moment!'
- id: 6059
  text: >-
    {:unk13 39 01 31 00}{:unk06 00}{:unk08 01 00 06}La veritat és que...{:clear }els sensecor estaven jugant amb

    uns regals quan els vaig veure.
- id: 6060
  text: >-
    {:unk13 30 01 58 00}{:unk06 02}{:unk08 03 00 05}Ahà!

    Ja tenim els culpables!
- id: 6061
  text: >-
    No podeu ser aquí!{:delay 82 00}{:clear }Sortiu de Vila Halloween,

    per ordre de l'Alcalde!
- id: 6062
  text: >-
    Socors! Ajuda!{:delay 7B 00}{:clear }Jo només soc un simple funcionari,

    no puc ocupar-me'n jo sol.
- id: 6063
  text: La Sally tenia raó.
- id: 6064
  text: Hem de recuperar els regals!
- id: 6065
  text: >-
    Quina llàstima!

    Semblava un regal molt bonic.
- id: 6066
  text: Eh... Jack?
- id: 6067
  text: >-
    Ai! Socors!{:delay 6C 00}{:clear }Que algú m'ajudi!{:delay 72 00}{:clear }El meu últim experiment ha desaparegut!

    L'han robat!
- id: 6068
  text: L'han robat!
- id: 6069
  text: >-
    {:unk13 D4 00 48 00}{:unk06 00}{:unk08 01 01 06}Era aquí assegut

    meditant, quan de

    sobte m'han atacat!
- id: 6070
  text: >-
    {:unk13 3F 01 43 00}{:unk06 00}{:unk08 01 01 06}He perdut el coneixement!

    I quan m'he recuperat...{:clear }el meu experiment

    havia desaparegut!
- id: 6071
  text: >-
    {:unk13 AA 00 41 00}{:unk06 00}{:unk08 01 01 06}No es preocupi, Doctor,

    sabem qui se l'ha endut.
- id: 6072
  text: '{:unk13 87 01 6A 00}{:unk06 02}{:unk08 03 01 06}Qui!?'
- id: 6073
  text: '{:unk13 DC 00 50 00}{:unk06 00}{:unk08 01 01 06}Els sensecor.'
- id: 6074
  text: >-
    {:unk13 AD 00 64 00}{:unk06 00}{:unk08 01 01 06}Aquelles coses endimoniades?{:clear }És ridícul! Això no té res

    a veure amb els sensecor.
- id: 6075
  text: >-
    {:unk13 B4 00 50 00}{:unk06 00}{:unk08 01 01 06}O sigui que no són els

    sensecor. Hmm...
- id: 6076
  text: '{:unk13 E6 00 C8 00}{:unk06 00}{:unk08 01 00 06}Qui més podria ser?'
- id: 6077
  text: '{:unk13 96 00 50 00}{:unk06 00}{:unk08 01 01 06}Em sembla que en tinc una idea.'
- id: 6078
  text: >-
    {:unk13 C8 00 50 00}{:unk06 00}{:unk08 01 01 06}Al lladre deuen agradar-li els

    regals de Nadal. O sigui que...{:clear }el temptarem amb regals

    irresistibles i caurà en la trampa.
- id: 6079
  text: >-
    {:unk13 96 00 50 00}{:unk06 00}{:unk08 01 01 06}I aquell bergant és el

    mateix que va robar

    el meu experiment?
- id: 6080
  text: '{:unk13 A4 01 46 00}{:unk06 00}{:unk08 01 00 05}Correcte.'
- id: 6081
  text: '{:unk13 A0 00 82 00}{:unk06 00}{:unk08 01 01 05}I com ho demostrem?'
- id: 6082
  text: >-
    {:unk13 FA 00 50 00}{:unk06 00}{:unk08 01 01 06}Doncs és

    molt fàcil!{:clear }L'espantarem per

    a que confessi!
- id: 6083
  text: '{:unk13 DC 00 96 00}{:unk06 00}{:unk08 01 00 05}Òndia...'
- id: 6084
  text: >-
    {:unk13 A0 00 6E 00}{:unk06 00}{:unk08 01 01 06}Què n'opineu?

    Seguim el pla del Jack...

    almenys per ara?
- id: 6085
  text: >-
    {:unk13 C8 00 50 00}{:unk06 00}{:unk08 01 01 06}Anem a casa del Pare

    Cruel de seguida!{:clear }Hem de preparar alguns

    regals de Nadal, ràpid!
- id: 6086
  text: '{:unk13 BE 00 B7 00}{:unk06 00}{:unk08 01 00 06}Ja has trobat els regals?'
- id: 6087
  text: '{:unk13 BD 00 2F 00}{:unk06 00}{:unk08 01 01 06}Gairebé, Sr. Cruel!'
- id: 6088
  text: >-
    {:unk13 FA 00 B4 00}{:unk06 00}{:unk08 01 01 06}Anem a pescar el lladre amb

    regals de Nadal d'esquer!
- id: 6089
  text: >-
    {:unk13 5E 01 50 00}{:unk06 00}{:unk08 01 00 05}Uns regals

    d'esquer, dius?{:clear }Mare meva... No m'agrada

    gens com sona allò.
- id: 6090
  text: >-
    {:unk13 C8 00 82 00}{:unk06 00}{:unk08 01 00 06}Només aquest cop, suposo.

    És per una bona causa...{:clear }Molt bé, utilitzeu el segon pis.

    I poseu-hi el cor.
- id: 6091
  text: Ja està!
- id: 6092
  text: No del tot.
- id: 6093
  text: Hi ha més?
- id: 6094
  text: >-
    No us preocupeu,

    jo me n'ocupo.
- id: 6095
  text: Heu acabat amb els regals?
- id: 6096
  text: Sí. Estem esperant el Jack.
- id: 6097
  text: >-
    I bé,

    on s'han de dur?
- id: 6098
  text: >-
    Mmm.{:delay 6C 00}{:clear }Conec un bon lloc.{:delay 78 00}{:clear }Quan estigueu a punt,

    només m'ho heu de dir.
- id: 6099
  text: >-
    Quan estigueu a punt,

    només m'ho heu de dir.
- id: 6100
  text: Ja soc aquí!
- id: 6101
  text: Aquesta plaça és perfecta per al teu pla.
- id: 6102
  text: I bé, Jack... quin és aquell pla?
- id: 6103
  text: Ho tinc tot pensat.
- id: 6104
  text: Ah, sí?
- id: 6105
  text: >-
    És clar.{:delay 60 00}{:clear }I tinc una idea meravellosa.{:delay 84 00}{:clear }Si atrapem el lladre,

    seria un honor per a mi...{:delay C0 00}{:clear }
- id: 6106
  text: Bé, ens en anem ja.
- id: 6107
  text: Però què fas? Deixa'm anar!
- id: 6108
  text: No clavis cops de peu!
- id: 6109
  text: No soc jo, Donald.
- id: 6110
  text: Paciència, amics.
- id: 6111
  text: Shhh!
- id: 6112
  text: He dit que paris!
- id: 6113
  text: Òndia! Has sigut tu?
- id: 6114
  text: Per què hem de fer d'esquer?
- id: 6115
  text: Un pla genial, eh?
- id: 6116
  text: Ai!
- id: 6117
  text: Atrapat!
- id: 6118
  text: Eh?
- id: 6119
  text: Ha sigut l'experiment del Doctor!
- id: 6120
  text: Ho hem aconseguit! Misteri resolt!
- id: 6121
  text: Heu atrapat el lladre?
- id: 6122
  text: Naturalment!
- id: 6123
  text: No entenc per què{:delay 4A 00}{:clear }{:delay 02 00}{:clear }l'experiment del Doctor anava per allà{:delay 8E 00}{:clear }robant regals de Nadal.
- id: 6124
  text: Un experiment?
- id: 6125
  text: >-
    El lladre!{:delay 64 00}{:clear }Era un ninot errant fabricat

    pel Dr. Finkelstein.
- id: 6126
  text: >-
    Mmm... El doctor ha

    fabricat un ninot errant?{:delay 8E 00}{:clear } {:delay 22 00}{:clear }Ja veig...

    Sempre amb les seves coses...
- id: 6127
  text: >-
    Escolta'm, Jack.{:delay 50 00}{:clear }Vull agrair-te l'ajuda.{:delay 74 00}{:clear }Tot i que repartir regals és una

    tasca exclusiva del Pare Noel,{:delay F8 00}{:clear }vull que tinguis una idea de com és.
- id: 6128
  text: Pare Cruel!
- id: 6129
  text: >-
    Sí, l'únic que volia aquell

    pobre ninot era un cor.
- id: 6130
  text: Ho! Ho! Ho!
- id: 6131
  text: >-
    Interessant!{:delay 7A 00}{:clear }O sigui que, malgrat tot, el ninot no va ser

    robat, sinó que va fugir pel seu compte!{:delay 56 01}{:clear }O sigui que...

    el meu experiment és un èxit rotund!
- id: 6132
  text: >-
    El Pare Noel creu que potser se'n

    va anar perquè volia trobar un cor.
- id: 6133
  text: >-
    És molt possible.{:delay 78 00}{:clear }A diferència de la meva Sally,

    no estava equipat amb un cor.
- id: 6134
  text: >-
    Si el que volia era un cor,{:delay 78 00}{:clear }per què anava per allà

    robant regals de Nadal?
- id: 6135
  text: >-
    Potser perquè els regals són un manera

    d'oferir el teu cor a algú especial.
- id: 6136
  text: Mmm, vist d'aquesta manera...{:delay 6A 00}{:clear } {:delay 0F 00}{:clear }sento una mica de pena per ell.
- id: 6137
  text: Bon Halloween!
- id: 6138
  text: Quin regal més bonic!
- id: 6139
  text: No ho entenc.{:delay 54 00}{:clear }No hi ha caixa!{:delay 4B 00}{:clear }No hi ha cap llaç!
- id: 6140
  text: >-
    Jack, la caixa i el llaç no importen.{:delay A5 00}{:clear } {:delay 0A 00}{:clear }El que compta és el que

    hi ha dins de la caixa!
- id: 6141
  text: >-
    No, Sora...{:delay 4E 00}{:clear }El que de debò compta,

    el més especial,{:delay A2 00}{:clear }és donar el regal i desitjar

    profundament en el teu cor{:delay F6 00}{:clear }fer feliç algú.
- id: 6142
  text: >-
    És clar!{:delay 3C 00}{:clear }Oh, i tant!{:delay 4E 00}{:clear }Gràcies, Sally.

    Tens tota la raó.
- id: 6143
  text: Espera!{:delay 48 00}{:clear }Què és això?{:delay 54 00}{:clear }Em sento tan estrany...{:delay 6C 00}{:clear } tan, tan feliç...
- id: 6144
  text: >-
    Jack, deu ser el

    regal de la Sally!
- id: 6145
  text: >-
    De debò?

    Aquesta meravellosa sensació?
- id: 6146
  text: >-
    Oh, Sally!{:delay 6A 00}{:clear }M'has fet el regal

    més bonic del món!{:delay A8 00}{:clear }I jo no tinc res per donar-te a canvi.{:delay 88 00}{:clear }Què t'agradaria? El que vulguis.{:delay 9C 00}{:clear }Et donaré el que sigui.
- id: 6147
  text: >-
    El millor regal que

    puc demanar, Jack,{:delay 26 01}{:clear }és poder estar amb tu.
- id: 6148
  text: Això no ho has ni de demanar.
- id: 6149
  text: >-
    Pot ser que mai li donés

    un regal de veritat.
- id: 6150
  text: A qui?
- id: 6151
  text: >-
    Segur que a la Kairi li agradava

    tot el que li regalaves!
- id: 6152
  text: >-
    Ho sé. Per això em costava

    tant decidir-m'hi.
- id: 6153
  text: >-
    No és el regal!

    És el que tens al cor!
- id: 6154
  text: El meu cor...
- id: 6155
  text: Sí! La Kairi és com la Sally!
- id: 6156
  text: Com!?
- id: 6157
  text: >-
    Bé, mentre pugui estar amb tu,

    què més necessita?
- id: 7974
  text: >-
    El meu experiment es seguirà

    movent encara que el facin miques!{:clear }Però les peces serien difícils de

    recuperar, puix atacaran per separat.
- id: 7978
  text: Be, hi esteu tots a punt?
- id: 7979
  text: >-
    {:unk13 00 01 40 01}{:unk08 02 00 06}Ajudem amb els regals?

    {:chardelay 33 00}Espera.

    {:chardelay 09 00}Sí, som-hi!
- id: 7980
  text: >-
    Si l'Home del Sac no hi és, no hi ha res a fer.

    Em sembla que aniré a ajudar el Doctor.
- id: 7981
  text: >-
    Aj! Per què ha de passar això ara

    que he aconseguit tots els materials?{:clear }Aquell invent del Doctor hauria

    animat les coses per aquí.
- id: 7982
  text: >-
    L'Home del Sac solia ser ple de tota

    classe de cuques bufones!{:clear }Però ara que no hi ha cuques,

    no crec que el veiem per un temps.
- id: 7983
  text: >-
    Algú ha robat la criatura que estava

    fabricant el Doctor. Heu de recuperar-la!{:clear }Aquesta era la nostra

    oportunitat de tenir un còmplice!
- id: 7984
  text: >-
    El Jack està planejant

    un altre Halloween.{:clear }Em pregunto si seguirà amb

    el vestit vermell posat.
- id: 7985
  text: >-
    Aquell regal de Nadal era ben maco.{:clear }Potser hauria de colar-me de nou

    en la casa del Pare Cruel...
- id: 8050
  text: >-
    {:unk13 A5 00 32 00}{:unk06 00}{:unk08 01 01 06}Podríem utiltizar el seu

    taller per preparar...{:clear }uns regalets?
- id: 8105
  text: Derrota tots els sensecor!
- id: 8106
  text: >-
    Derrota tots els sensecor!

    Aprofita els objectes que hi ha a la vila!
- id: 8107
  text: '{:theme 07}Desafiament{:reset}: derrota tots els enemics!'
- id: 8108
  text: >-
    Derrota tots els sensecor!

    Aprofita els objectes que hi ha en la vila!
- id: 8109
  text: Derrota el sensecor!
- id: 8110
  text: >-
    Derrota el sensecor!

    Combina atacs màgics i físics!
- id: 8111
  text: Atrapa el Nyek, la Poll i el Puça amb les caixes màgiques!
- id: 8112
  text: >-
    Intenta atrapar el Nyek, la Poll i

    el Puça amb les caixes màgiques!

    Si utilitzes les ordres de reacció

    amb {:icon dynamic-triangle}, la batalla serà més fàcil!
- id: 8113
  text: Recupera els regals!
- id: 8114
  text: >-
    Derrota els sensecor i

    recupera els regals!
- id: 8115
  text: Fes alguns regals!
- id: 8116
  text: >-
    Llença joguines a les caixes per

    embolicar-los i preparar regals.

    Compte amb el Nyek, la Poll i el Puça!
- id: 13023
  text: >-
    Què ha sigut aquest terrabastall?

    Sembla que venia del {:theme 0A}taller{:reset}.{:clear }Tinc un mal presentiment.

    Sora, podries fer-hi un cop d'ull?
- id: 13035
  text: >-
    Teniu autorització per

    utilitzar el {:theme 0A}2n pis del taller{:reset}.{:clear }Encara que estigueu fabricant un

    regal-trampa, feu-lo de cor!
- id: 13973
  text: >-
    És fàcil perdre de vista les coses

    immaterials, però de vegades...{:clear }són les de més valor.{:clear }Intenta no oblidar les coses

    valuoses que duem dins.
- id: 13974
  text: >-
    Mmm... No esperava que el meu

    experiment volgués tenir un cor propi.{:clear }Hauré de tornar a dissenyar-lo!
- id: 13975
  text: >-
    Ha passat una cosa terrible!

    El Pare Noel està emmordassat!{:clear }Va venir aquell nano grandot i em vaig amagar

    tan de pressa com vaig poder! Què farem!?
- id: 14073
  text: Un s'ha escapat de la caixa!
- id: 14074
  text: Atrapa el Nyek, la Poll o el Puça quan estiguin cansats, per a que no escapin!
- id: 16707
  text: >-
    Apareixen els sensecor, el Jack vol

    convertir-se en Pare Noel...{:clear }Tinc un mal pressentiment. Només

    espero que no passi res terrible...
- id: 16708
  text: >-
    Què? Aquelles criatures també estan

    causant problemes a una altra vila?{:clear }Bah, el que passi a altres viles

    no afecta la meva investigació.
- id: 16709
  text: >-
    Si l'Home del Sac ha tornat, segur

    que no trama res de bo.{:clear }Aquí tot està en calma, però pot ser que

    estigui fent de les seves en un altre lloc.
- id: 16710
  text: >-
    Aparentement, més enllà del cementiri,

    hi ha una sendera que duu al Pare Cruel.{:clear }Per què estarà el Jack tan

    obsessionat amb el Pare Cruel i Nadal?
- id: 16711
  text: >-
    Esteu buscant aquelles criatures?

    Acabo de veure-les en el cementiri.{:clear }El terra és ple de fang. N'hauríeu de

    poder seguir el rastre amb facilitat.
- id: 16712
  text: >-
    Home del Sac!?

    Creia que el Jack hi havia acabat!{:clear }Quin horror! Si ha tornat, també

    espatllarà el Halloween d'aquest any!
- id: 16713
  text: >-
    Observeu aquella porta misteriosa!

    Mirar-la fa calfreds!{:clear }Va, apropeu-vos-hi i us

    explicaré el que va passar.
- id: 16714
  text: >-
    Sé que estàs entusiasmat amb veure...{:clear }el Pare Noel, però jo tinc un mal

    pressentiment. I la Sally també.
- id: 16715
  text: >-
    Pot ser que el Jack vulgui ser Pare

    Noel, però no em sembla bona idea.{:clear }Se'm fa difícil imaginar

    un Nadal així.
- id: 16716
  text: >-
    Què us sembla la vista? Bonica, no?

    A Vila Halloween no hi ha res així.{:clear }Bé, {:theme 0A}la casa del Pare Cruel {:reset}és allà

    davant. Va, som-hi.
- id: 16717
  text: >-
    Vaja! Mireu aquest lloc!

    On és el Pare Noel!? On!?
- id: 16718
  text: >-
    Aquest lloc és molt diferent

    a Vila Halloween.{:clear }Ara veig per què el Jack

    està tan entusiasmat.
- id: 16719
  text: >-
    Què ha sigut aquell soroll?

    Ha vingut del {:theme 0A}taller{:reset}.{:clear }En tindrem una de grossa si aquella

    màquina no funciona! Aniré a revisar-la.
- id: 16720
  text: >-
    Quan vaig revisar el taller, vaig veure algú

    de blanc en el muntacàrregues del sostre.{:clear }Aquell muntacàrregues està espatllat.

    Si el colpegen, es pot trencar!
- id: 16721
  text: >-
    Per què algú faria

    una cosa tan horrible!?{:clear }Espero que el Pare

    Noel l'alliçoni!
- id: 16722
  text: >-
    Porteu-me aquells nens. De pressa. Ja

    en parlarem quan ens n'encarreguem.
- id: 16723
  text: >-
    Vila Nadal era

    un lloc bonic de debò.{:clear }Però qualsevol lloc pot ser

    bonic si un és amb els seus amics.
- id: 16724
  text: >-
    Què passa? No veieu que estic ocupat?

    Em distreieu de la meva feina!{:clear }La meva investigació està gairebé

    acabada. Si no teniu res a dir, fora!
- id: 16728
  text: >-
    Sento veus en el 

    {:theme 0A}2n pis del taller{:reset}.{:clear }M'encantaria investigar,

    però estic molt espantada!
- id: 16729
  text: >-
    Si voleu fabricar regals, parleu

    amb el {:theme 0A}nan {:reset}del quarto de dalt.{:clear }Recordeu: el truc per fer

    bons regals és «apuntar bé».
- id: 16730
  text: >-
    Els regals són importants, però {:theme 0A}Vila 

    Halloween {:reset}també necessita la teva ajuda.{:clear }Primer encarrega't

    dels problemes d'allà.
- id: 16731
  text: >-
    Últimament, no donem l'abast.

    No volem més embolics!
- id: 16732
  text: >-
    Veniu a fer regals, no?

    Podeu utilitzar aquesta màquina.
- id: 16733
  text: >-
    {:unk13 00 01 40 01}{:unk08 02 00 06}Fabricar regals?

    {:chardelay 33 00}Espera.

    {:chardelay 09 00}Molt bé, som-hi!
- id: 16734
  text: >-
    No em sembla bé utilitzar

    un regal com a trampa.{:clear }Però no troba altra forma

    de fer-ho.
- id: 16735
  text: >-
    Sembla que el Jack encara

    no s'ha oblidat de Nadal.{:clear }Només cal mirar-lo per adonar-se'n.
- id: 16736
  text: >-
    M'és igual com, atrapeu la

    persona que m'ha robat l'experiment!
- id: 16737
  text: >-
    Eh? No anàveu a Vila Nadal

    per parlar amb el Jack?{:clear }Podeu arribar-hi des

    de les Terres Remotes.
- id: 16738
  text: >-
    Aquells regals estan molt bé.

    Ara aneu a parlar amb el {:theme 0A}Pare Noel{:reset}.
- id: 16739
  text: >-
    Els sensecor estan jugant amb

    regals? M'agradaria veure-ho!{:clear }Encara que Vila Halloween

    em fa una mica de por.
- id: 16740
  text: >-
    Han sigut els mateixos nens

    d'abans, no?{:clear }És que no entenen que les

    coses dels altres no es toquen?
- id: 16741
  text: Sou aquí per fabricar més regals?
- id: 16742
  text: >-
    {:unk13 00 01 40 01}{:unk08 02 00 06}Fabricar regals?

    {:chardelay 33 00}Espera.

    {:chardelay 09 00}D'acord, som-hi!
- id: 16743
  text: >-
    Bona feina! Sembla que heu

    fet uns regals genials.{:clear }Ara el que s'ha de fer és

    preparar el vostre regal-trampa.
- id: 16744
  text: >-
    De pressa! Acabem amb aquells

    sensecor i recuperem els regals!{:clear }Va, som-hi!
- id: 16745
  text: >-
    En què consisteix aquell experiment

    que està fent el Doctor?{:clear }L'últim cop no ens va ajudar en res.

    I dubto que ara en resulti res bo.
- id: 16746
  text: >-
    Si els sensecor van per allà

    lliures, no podem ignorar-los.{:clear }Hem de tornar a {:theme 0A}Vila

    Halloween{:reset} i encarregar-nos-en.
- id: 16747
  text: >-
    El Pare Cruel no ens parlarà fins

    que haguem atrapat aquelles criatures.{:clear }Hem de trobar-los i

    Portar-los-hi.
- id: 16748
  text: >-
    No les perdrem si van

    deixant {:theme 0A}petjades {:reset}tan clares.{:clear }Potser ens han parat una trampa.

    Serà millor que estiguem alerta.
- id: 16749
  text: >-
    Hauran tornat a

    Vila Halloween?{:clear }Aquestes {:theme 0A}petjades{:reset} són molt rares.

    Anaven descalços?
- id: 16784
  text: >-
    Sabeu què? Estic pensant en enviar regals

    a aquelles criatures de Vila Halloween.{:clear }Si els envio uns bonics ninots,

    potser ens duguem millor.
- id: 16785
  text: >-
    De la mateixa manera que jo m'ocupo del

    Nadal, el Jack és a càrrec de Halloween.{:clear }Cadascú té la seva pròpia vocació.

    Tu has d'ajudar els teus amics, Sora.
- id: 16789
  text: >-
    «Font de la Plaça de la Guillotina:

    colpeja-la per a que s'activi.»
- id: 16790
  text: A la porta gran li han posat cadenes.
- id: 16791
  text: La porta està tancada amb clau.
- id: 16792
  text: >-
    «Els cavallets funcionen malament a

    causa d'un raig. Ara són perillosos.»
- id: 16858
  text: >-
    El Pare Cruel

    em va protegir.{:clear }Si us plau, rescateu-lo

    de seguida!
- id: 16859
  text: >-
    A l'Home del Sac li encanten les trampes,

    com la del seu dau trucat.{:clear }Segur que no trama res de bo. Si lluiteu

    amb ell, prepareu-vos per al pitjor.
- id: 16860
  text: >-
    L'Home del Sac ha anat a Vila Nadal!

    Hem d'afanyar-nos, Sora!
- id: 16861
  text: >-
    No sabem què està tramant l'Home del Sac.

    Serà millor preparar-nos abans d'anar-hi.
- id: 17097
  text: >-
    «Clavegueres en obres.

    Si t'hi poses a sobre...»
- id: 17098
  text: >-
    «El sistema de seguretat de la casa del Jack

    funciona molt bé, com era de esperar.»
- id: 17099
  text: >-
    «Guillotina: instrument per tallar coses.

    No utilitzar per a la preparació d'aliments.»
- id: 17100
  text: >-
    Aquí hi ha un gargot que diu:

    «Maltractar làpides porta mala sort.»
- id: 17101
  text: >-
    Aquesta és la tomba del Zero.

    Sembla que hi dorm sovint.
- id: 17102
  text: És una màquina per fabricar regals.
- id: 17104
  text: Hi ha escombraries escampades.
- id: 17712
  text: >-
    Aquelles criatures sempre

    estan causant problemes!
- id: 17713
  text: >-
    Que avorrit és tot

    sense l'Home del Sac.
- id: 17714
  text: >-
    Mmm... Em pregunto si estarà passant

    alguna cosa aterradora de debò...
- id: 17715
  text: >-
    Aquesta cosa blanca i freda...

    Seran cendres?
- id: 17716
  text: >-
    Quan el ganàpia va colpejar la Sally i se

    li va sortir la cama, em vaig desmaiar!{:clear }La gent de Vila Halloween

    deu ser molt forta!
- id: 17901
  text: Utilitza els regals per llençar a l'Home del Sac del muntacàrregues!
- id: 17902
  text: >-
    Utilitza els regals per llençar a

    l'Home del Sac del muntacàrregues!
- id: 17903
  text: Col・loca't a la mateixa cinta que l'Home del Sac per colpejar-lo amb les caixes!
- id: 18114
  text: >-
    {:unk13 57 01 2D 00}{:unk06 00}{:unk08 01 00 05}Què passa amb el

    lladre de regals?
- id: 18199
  text: Queden dos!
- id: 18200
  text: Queda un!
- id: 18520
  text: >-
    L'Home del Sac ha segrestat el Pare Noel!{:clear }Va entrar per la porta que hi ha

    a les Terres Remotes! Atureu-lo!
- id: 18526
  text: >-
    Només en tornar, el primer que fa l'Home del

    Sac és intentar desbaratar el meu Nadal!{:clear }Em temo que l'últim cop

    no va aprendre'n la lecció.
- id: 18527
  text: >-
    L'Home del Sac és aquell que l'últim cop va

    causar estralls amb els sensecor, no?{:clear }Si ha segrestat el Pare Noel, qui

    portarà els meus regals de Nadal!?
- id: 18528
  text: >-
    D'on haurà sortit l'Home del Sac? L'últim

    cop va intentar controlar els sensecor.{:clear }Què estarà tramant ara?
- id: 18531
  text: '{:delay 38 00}{:clear }Eh? {:delay 37 00}{:clear }'
- id: 18532
  text: '{:delay 5A 00}{:clear }Un altre cop?'
- id: 18727
  text: Disparar
- id: 18728
  text: Recarregar
- id: 18750
  text: >-
    Destrueix el sensecor experimental del Dr. Finkelstein!

    Aprofita't de les parts del seu cos!
- id: 18914
  text: >-
    He trobat una cosa increïble a casa del

    Pare Cruel. Per què no veniu amb mi?
- id: 18915
  text: >-
    {:unk13 00 01 40 01}{:unk08 02 00 06}Sona interessant. Hi anem?

    {:chardelay 33 00}No, gràcies.

    {:chardelay 52 00}Sí, li faré un cop d'ull.
- id: 18916
  text: >-
    Tornaré a casa del Pare Cruel.

    Voleu venir-hi?
- id: 18917
  text: >-
    {:unk13 00 01 40 01}{:unk08 02 00 06}Sona interessant. Hi anem?

    {:chardelay 33 00}No, gràcies.

    {:chardelay 52 00}Sí, li faré un cop d'ull.
- id: 19075
  text: >-
    Feia temps que no em

    disfressava de mòmia.{:clear }Al principi no m'agradava, però

    quan t'hi acostumes és divertit.
- id: 19076
  text: >-
    Busques el Zero? Ha volat

    cap a aquells edificis.{:clear }Li agrada molt estar amb el Jack.

    Potser ell també hi és.
- id: 19096
  text: Aquestes petjades semblen recents.
- id: 19097
  text: Aquestes petjades són de fa uns minuts.
- id: 19098
  text: >-
    Pots distingir el lleu

    rastre d'unes petjades.
- id: 19099
  text: Aquestes petjades són molt recents.
- id: 19100
  text: Aquestes petjades ja estan gairebé esborrades.
- id: 19101
  text: >-
    La porta gran ha estat tancada

    per evitar que algú robi el trineu.
- id: 19102
  text: >-
    Aquestes petjades podrien dur-nos

    fins a aquelles tres criatures.
- id: 19103
  text: >-
    Aquestes petjades s'han esborrat gairebé

    per complet. Semblen molt antigues.
- id: 19104
  text: >-
    La xemeneia dona a l'habitació

    una calidesa molt acollidora.
- id: 19105
  text: >-
    Probablement és ple de

    vestits vermells de Pare Noel.
- id: 19106
  text: Per aquí surten els regals.
- id: 19107
  text: >-
    Aquí es guarden

    els regals.
- id: 19108
  text: >-
    Amb aquesta màquina es fabriquen

    regals, però ara està espatllada.
- id: 19125
  text: >-
    El trineu està completament destruït.

    Qui ha pogut fer tal cosa?
- id: 19364
  text: >-
    Mou la cua alegrement.

    Sembla recordar-se de tots.
- id: 19365
  text: Sembla que vol jugar.
- id: 19366
  text: >-
    Sembla enfadat perquè

    últimament ningú juga amb ell.
- id: 19367
  text: >-
    Mou la cua alegrement mentre

    ensuma les escombraries.
- id: 19368
  text: >-
    Sembla que ensuma el lloc

    on eren les escombraries.
- id: 19369
  text: >-
    Observa tothom

    amb curiositat.
- id: 19759
  text: Vila Halloween
- id: 20612
  text: Prem {:icon dynamic-triangle} per començar el duel! Compte amb els seus encanteris!
- id: 21541
  text: "{:delayandfade 08 78} \nLes malifetes dels sensecor\ntenen en escac el Pare Noel,\naixí que el Jack li demana al Sora\ni els seus amics que el protegeixin\ncom els seus guardaespatlles.\n \nNo obstant, una altre sinistre\nperill sembla cerner-se sobre\nVila Halloween...\n \n"
- id: 21542
  text: "{:delayandfade 08 78} \nEl Sora i el grup donen una bona\nreprimenda al Nyek, la Poll i el\nPuça. Els tres diablets surten\npitant, asegurant-se abans que el\nvil Home del Sac ha tornat.\n \nDesprés de fracasar fa un any\namb el seu pla de fer-se amb Vila\nHalloween, què voldrà ara?\n \n"
- id: 21543
  text: "{:delayandfade 07 B4} \nL'Home del Sac ha segrestat el Pare Noel!\n \nSense perdre un instant, el Sora i els seus\namics es dirigeixen a Vila Nadal.\n \n \n \n \n \n \n"
- id: 21544
  text: "{:delayandfade 08 78} \nQuan el Sora atrapa finalment\nel Nyek, la Poll i el Puça,\nesbrina que els tres murris\nno són els lladres de regals.\n \nL'únic que feien els diablets\nera buscar peces per a\nl'experiment del Doctor.\n \n"
- id: 21545
  text: "{:delayandfade 0A 78} \nLa veritat acaba sortint a la llum.\n \nSón els sensecor els qui\nhan robat els regals i estan\nfent de les seves a la vila.\n \n \n \n \n \n"
- id: 21546
  text: "{:delayandfade 0A 78} \nTot i que el Sora i els seus\namics creien que els sensecor\nestan darrere tot l'embull, el causant\ndels excessos resulta ser un altre.\n \nPer això, ideen un pla amb regals\ntrampa per atrapar el vertader\nculpable.\n \n \n"
- id: 21547
  text: "{:delayandfade 0A 78} \nNomés hi ha un lloc en el que\npodrien fabricar els regals trampa:\nel taller del Pare Noel.\n \n \n \n \n \n"
