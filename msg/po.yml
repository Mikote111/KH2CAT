- id: 7896
  text: >-
    Aquesta és l'enèsima vegada

    que veig el Pooh així!{:clear }Sora, no t'aturis.

    Ves i treu-li aquell pot.
- id: 7897
  text: >-
    Sora? Ets tu, Sora?

    Socors!
- id: 7898
  text: >-
    {:unk13 00 01 40 01}{:unk08 02 00 06}Deu menjar mel ara?

    {:chardelay 33 00}Deixa'l en pau.

    {:chardelay 09 00}Ajudem-lo!
- id: 7899
  text: >-
    Hola, algú que no conec.

    Avui és un dia formós, no et sembla?
- id: 7900
  text: >-
    Hola, Sora. Fa un día preciós.

    Perfecte per menjar mel!{:clear }I per fer exercici.

    Avui també podríem jugar!
- id: 7901
  text: >-
    En realitat, encara queda mel,

    però jo no hi arribo.
- id: 7902
  text: >-
    {:unk13 00 01 40 01}{:unk08 02 00 06}Passar-li la mel?

    {:chardelay 33 00}Potser jo tampoc hi arribo.

    {:chardelay 09 00}Jo me n'encarrego!
- id: 7903
  text: >-
    No és fàcil recollir mel

    a les esquenes del Pooh.{:clear }Però en veure'l tan feliç,

    em dic: «tant és!».
- id: 7904
  text: >-
    Si puc menjar mel,

    et seguiré on sigui.{:clear }Però promet-me que m'ajudaràs si em

    fico en embolics, algú que no conec.
- id: 7905
  text: >-
    Al Pooh li fan por les abelles. Intenta

    evitar que es fiqui en un rusc.{:clear }Manten-te al seu costat i no

    deixis que se n'allunyi massa.
- id: 7906
  text: >-
    Va, segueix-me.{:clear }Passa a davant, si vols.

    Jo vaig molt a poc a poc.
- id: 7907
  text: >-
    Sembla que el Talp s'ha avançat

    per fer alguns preparatius.{:clear }Algun dia, ell ens

    protegirà a tots.
- id: 7908
  text: >-
    Avui construiré una casa! Tot i que estic

    segur que alguna cosa sortirà malament.
- id: 7909
  text: >-
    No facis cap ximpleria

    mentre reculls la mel.{:clear }Pots anar a per mel totes les vegades

    que vulguis, però escull-hi un camí segur.
- id: 7910
  text: >-
    Mira aquella persona flotant per allà.

    Deu ser molt divertit!
- id: 7911
  text: >-
    {:unk13 00 01 40 01}{:unk08 02 00 06}Es deu divertir?

    {:chardelay 33 00}Sí, quina enveja!

    {:chardelay 09 00}Està ballant-la! L'hem d'ajudar!
- id: 7912
  text: >-
    M'alegro que el Pooh

    s'hagi recordat de mi.{:clear }És horrible que un amic a qui

    estimes tant t'oblidi completament.
- id: 7913
  text: >-
    Esquiva i trenca les coses

    que volen cap a tu.{:clear }Algunes coses no es trenquen fàcilment

    i hauràs de provar-hi una altra cosa.
- id: 7914
  text: >-
    Jo, jo! No tot es

    soluciona fàcilment.{:clear }Si estàs encallat, pren-te el teu

    temps per buscar-hi una solució.
- id: 7915
  text: >-
    Si algú dels altres està en

    problemes, ajuda'l, si us plau.{:clear }Jo ajudaré en tot el que pugui.
- id: 7916
  text: >-
    Què feu tots aquí?

    Passarà res especial?{:clear }Un concurs de mel, per ventura?

    O una carrera?
- id: 7917
  text: >-
    Sigui on sigui, el Tigger

    sempre va fent bots.{:clear }Solíem fer-ho tots junts, però es

    veu que el Pooh també l'ha oblidat.
- id: 7918
  text: >-
    Si el Tigger parés

    més atenció...{:clear }Això és terrible. Hem de

    recuperar aquella medicina.
- id: 7919
  text: >-
    Trepitja els globus.

    En esclatar, t'enlairaran.{:clear }També pots parlar amb el Ret.

    Ell coneix altres maneres de saltar.
- id: 7920
  text: >-
    Has d'aturar el Tigger de

    seguida o se la prendrà tota!
- id: 7921
  text: >-
    El Tigger em va ensenyar

    el secret de fer bots.{:clear }Si saltes de nou de seguida que

    aterres, podràs fer un salt diferent!
- id: 7923
  text: >-
    Encara no se'n recorda? És rar...{:clear }Ja sé! Fem bots tots junts!

    Això li refrescarà la memòria!
- id: 7924
  text: >-
    {:unk13 00 01 40 01}{:unk08 02 00 06}Fer bots?

    {:chardelay 33 00}No puc.

    {:chardelay 09 00}Provem-ho!
- id: 7925
  text: >-
    Ju, ju, ju, ju!

    Soc el millor del món fent bots.♩{:clear }Tant se val qui siguis, botar

    solucionarà tots els teus problemes! ♩
- id: 7927
  text: >-
    Vols dir que el Pooh

    va venir sol a aquest lloc?{:clear }Bah, tant se val.

    De pressa! Anem a buscar-lo!
- id: 7928
  text: >-
    Aquest lloc és fosc i

    sembla un laberint!{:clear }Si em perdo, em trobaràs, oi?

    Compto amb tu!
- id: 7929
  text: >-
    Per més que el busco,

    no el trobo.{:clear }El terra és lliscant. Espero

    no caure i perdre la meva cua.
- id: 7930
  text: >-
    Puc sentir un brunzit d'ales.

    Espero que no hi hagi abelles per aquí.{:clear }Sora, si ens ataquen les abelles,

    ocupa-te'n, si us plau.
- id: 7931
  text: >-
    Mmm...

    Aquest lloc sembla perillós.{:clear }Molt bé, colla, estigueu alerta

    mentre anem per aquí.
- id: 7932
  text: >-
    No imaginava que aquí hi hagués

    la mel que agrada al Pooh.{:clear }Les parets són dures, però cauen a trossos.

    Compte amb les roques que cauen.
- id: 7933
  text: >-
    Ei, Sora, potser hauríem

    d'anar a buscar el Pooh.
- id: 7934
  text: >-
    {:unk13 00 01 40 01}{:unk08 02 00 06}Anar a buscar a Pooh?

    {:chardelay 33 00}Pensem-nos-ho dos cops.

    {:chardelay 09 00}És clar que sí. Som-hi.
- id: 13954
  text: >-
    A on em dus, amable

    algú que no conec?{:clear }Sigui on sigui, espero

    que hi hagi mel a dolls.
- id: 13955
  text: >-
    A l'Igor sempre li

    cau la cua.{:clear }Moltes vegades hem

    d'ajudar-lo a buscar-la.
- id: 13956
  text: >-
    Si saltes bé, pots

    trepitjar els globus.{:clear }Quants més trepitgis, més alt arribaràs.

    Qui sap què trobaràs allà dalt?
- id: 13972
  text: >-
    Vols que faci bots amb aquell algú

    que no conec? Trobaré res de mel?{:clear }Em sembla olorar una cosa

    bona que ve del cel.
- id: 16084
  text: >-
    Conec aquella veu. Ets tu, Sora, oi?

    Estic encallat un altre cop! Ajuda'm!
- id: 16085
  text: >-
    {:unk13 00 01 40 01}{:unk08 02 00 06}Sembla ser el Pooh.

    {:chardelay 33 00}Mirem una mica més.

    {:chardelay 09 00}Anem a ajudar-lo!
- id: 16086
  text: >-
    Hola, Sora.

    Vols aconseguir més mel?
- id: 16087
  text: >-
    {:unk13 00 01 40 01}{:unk08 02 00 06}Anar a per una mica de mel?

    {:chardelay 33 00}Ara no la necessito.

    {:chardelay 09 00}Sí, som-hi!
- id: 16088
  text: >-
    Avui sí que fa molt de vent. Si no

    vas amb compte, pots sortir volant!
- id: 16089
  text: >-
    {:unk13 00 01 40 01}{:unk08 02 00 06}Intentrd anar-hi volant?

    {:chardelay 33 00}Prefereixo anar-hi a peu.

    {:chardelay 09 00}Volem!
- id: 16090
  text: >-
    Hu, hu, hu, hu! Fer bots t'animarà!

    Va, Sora, intenta-ho!
- id: 16091
  text: >-
    {:unk13 00 01 40 01}{:unk08 02 00 06}Fas bots amb el Tigger?

    {:chardelay 33 00}Ho sento, estic ocupat.

    {:chardelay 09 00}Sí, som-hi!
- id: 16092
  text: >-
    Vull anar amb tots a fer-hi un cop d'ull.

    Ajudaràs tu també, Sora?
- id: 16093
  text: >-
    {:unk13 00 01 40 01}{:unk08 02 00 06}Anar a buscar-lo?

    {:chardelay 33 00}Tinc coses a fer.

    {:chardelay 09 00}És clar que sí!
- id: 18087
  text: >-
    M'ho he passat molt bé flotant

    per allà, algú que no conec.{:clear }Recordo haver flotat abans

    en un globus...
- id: 18088
  text: >-
    L'altre dia estava encantat

    de tenir tota aquella mel.{:clear }Podríem anar-ne a buscar en una altra

    ocasió, algú que no conec.
- id: 18089
  text: >-
    Un cop, tots ens vam vestir com

    el Tigger i ens vam posar a fer bots.{:clear }Si vols, un dia podem repetir-ho,

    algú que no conec.
- id: 18090
  text: >-
    És divertit fer bots

    tots junts.{:clear }Però, no sé per qué, tots

    cauen sempre a sobre de ma casa.
- id: 18091
  text: >-
    Estic tan content que el Pooh

    s'hagi recordat de tu, Sora.{:clear }Però em pregunto per què

    no et recordava al principi.
- id: 18092
  text: >-
    Si la pròxima vegada que ens veiem

    ma casa està acabada, t'hi convidaré.{:clear }Tot i que dubto que l'acabi...
- id: 18093
  text: >-
    Hi ha altres amics en el

    Bosc dels Cent Acres.{:clear }Pero no els he vist últimament.

    Espero que tots estiguin bé.
- id: 18094
  text: >-
    Pot ser que al Tigger li agradi fer bots,

    però li fan por les altures.{:clear }Pot ser que soni contradictori, però,

    no és contradictori el món, per ventura? Jo, jo!
- id: 18095
  text: >-
    M'alleujar que el Pooh hagi

    recobrat la memèria.{:clear }Volia cantar per celebrar-ho, però no

    sé per què els altres no m'han deixat.
- id: 18096
  text: >-
    Els dies de gandulejar, com avui,

    són els millors.{:clear }Els dies de tempesta, l'arbre on hi tinc el

    meu niu cruix tant que no puc ni pensar-hi!
- id: 18097
  text: >-
    Mmm... Què faré si esclata el

    globus mentre recullo mel?{:clear }No et preocupis! Soc tan fort

    que una cosa així no m'aturaria!
- id: 18098
  text: >-
    El Piglet pot semblar un caguetes, però

    quan es compromet amb alguna cosa, compleix!{:clear }Em va sorprendre que entrés a buscar el Pooh

    per un forat que fins i tot a mi m'esglaiava!
- id: 18099
  text: >-
    El meu somni és construir

    el túnel suprem.{:clear }Si alguna vegada arribo a fer-lo

    realitat, t'hi enviaré una invitació, Sora!
- id: 18100
  text: >-
    El Duc mai es queda sense paraules.

    A vegades també diu coses molt estranyes!
- id: 18101
  text: >-
    El Tigger m'ensenyarà un

    nou salt ben súper!{:clear }Es diu el «molta revolta

    revoladora» o una cosa així!
- id: 18102
  text: >-
    Explorar pot fer una mica de por,

    però és molt divertit!{:clear }Tots estan sempre buscant amorets

    o coses així, i jo també hi vull anar!
- id: 18103
  text: >-
    L'altre dia, quan estava explorant

    jo sol, vaig conèixer un nou amic.{:clear }És divertit tenir amics.
- id: 18104
  text: >-
    Si el Pooh no està bé,

    tots ho passem malament.{:clear }Som un grup molt unit i

    volem que tots estiguin bé.
- id: 18324
  text: Des d'aquest arbre, es veu tot el turó.
- id: 18325
  text: >-
    Segur que des d'aquí la

    lluna es veu molt bé.
- id: 18326
  text: >-
    Deu voler dir:

    «Toca la campana».
- id: 18327
  text: Veus una bonica cortina.
- id: 18328
  text: Perceps la dolça aroma de la mel.
- id: 18329
  text: 'Hi hauria de dir: «Pastanaga».'
- id: 18330
  text: 'Han volgut posar: «Enciam».'
- id: 18331
  text: 'Sembla ser que hi diu: «Carbassa».'
- id: 18332
  text: Aquesta és l'entrada a la casa del Conill.
- id: 18333
  text: "En aquesta bústia s'hi llegeix: \"«Conill»\"."
- id: 18334
  text: Roba estesa a eixugar.
- id: 18335
  text: És molt gran per pescar.
- id: 18336
  text: 'En aquesta bústia hi posa: «Piglet».'
- id: 18337
  text: Només el Piglet podria passar per aquesta porta.
- id: 18338
  text: Deu ser el nom de l'avi del Piglet.
- id: 18339
  text: "En aquestes bústies s'hi llegeix: \"«Cangu»\" i \"«Ret»\"."
- id: 18340
  text: 'En aquesta bústia hi posa: «Cangu».'
- id: 18521
  text: >-
    {:unk13 64 01 DA 00}{:unk06 00}{:unk08 01 01 05}Què divertit!

    Ho fem un altre cop?
- id: 18522
  text: >-
    {:unk13 CD 00 5A 00}{:unk06 00}{:unk08 01 01 06}Si el Pooh menja d'aquella manera,

    haurem de trobar més mel!
- id: 18523
  text: >-
    {:unk13 2E 01 3F 00}{:unk06 00}{:unk08 01 01 05}Carai, els teus bots podrien ser

    més «boters».
- id: 18524
  text: "{:unk13 37 01 83 00}{:unk06 00}{:unk08 01 00 05}On s'ha ficat l'os...?"
- id: 18525
  text: '{:unk13 9B 01 69 00}{:unk06 00}{:unk08 01 00 05}Genial...'
- id: 18722
  text: Colpeja
- id: 18723
  text: Accelera
- id: 18996
  text: "{:unk13 A7 00 86 00}{:unk06 02}{:unk08 03 01 05}Sora? Ets tu?{:clear }Ajuda'm!"
- id: 19374
  text: >-
    {:unk13 67 01 DC 00}{:unk06 00}{:unk08 01 01 05}Sembla que som

    en greus problemes!{:clear }Sora, t'importaria

    ocupar-te del pobre Piglet?
- id: 19396
  text: >-
    Doncs suposo que fer bots

    no és la solució.{:delay B8 00}{:clear }Gairebé m'entren ganes de no

    tornar a fer bots mai més.
- id: 19754
  text: Bosc dels Cent Acres
- id: 19888
  text: '{:delay B4 00}És genial!{:delay 4E 00}{:clear }'
- id: 21520
  text: "{:delayandfade 07 78} \nEn Sora salva el Piglet, però no sembla\nque el Pooh tingui ni la més remota\nidea de qui és el seu amic!\n \nDesconcertat i afligit per la\nmala memòria del Pooh, poc més\nhi pot dir, puix una forta\nràfega de vent torna a endur-se'l\nenlaire.\n \n"
- id: 21521
  text: "{:delayandfade 0A 78} \nQuan el Pooh ja comença a acabar-se\nla mel, el Conill apareix clarament\nairejat, puix havia treballat molt\nper reunir tota aquella mel.\n \nTot canvia però, quan veu com\nd'estrany es comporta  el Pooh,\naixí que suggereix donar-li\nencara més mel. Pot ser que el Pooh\nes recuperi si té la panxeta ben plena!\n \n"
- id: 21522
  text: "{:delayandfade 0A 78} \nEl Tigger està convençut que\nel Pooh recuperarà la memòria\nsi tots es posen a saltar amb\nalegria.\n \nAl Sora, el Donald i el Goofy\nels sembla una bona idea i,\nsense dubtar-ne, s'apunten\nal festival de salts.\n \n"
- id: 21523
  text: "{:delayandfade 0A 78} \nEl Pooh s'ha endinsat sol en\nuna cova. Ai, aquest Pooh!\n \nAquell és un lloc molt perillós,\naixí que el Sora i els seus amics no\ns'ho pensen i surten a buscar-lo.\n \n \n"
- id: 21524
  text: "{:delayandfade 08 78} \nEn arribar al Turó de les estrelles,\nel Sora es troba el Pooh amb\nel caparró encallat en un gran\npot de mel.\n \nTot i que al principi el Sora no està\nmolt segur de si hauria d'intervenir,\nacaba donant un cop de mà a l'apurat\ndel Pooh.\n \n"
