- id: 831
  text: ''
- id: 832
  text: Segur que això és el Coliseu?
- id: 833
  text: És per allà!
- id: 834
  text: Uff... Quasi ens perdem.
- id: 836
  text: Els sensecor!
- id: 3460
  text: >-
    Hem entrenat molt, però no sé si en

    serà prou per lluitar contra l'Hades.{:clear }Serà millor que demanem a

    l'Hèrcules aquella Pedra de l'Olimp.
- id: 3461
  text: >-
    L'Hèrcules ha tornat.{:clear }Sembla que està buscant

    algú. Què deu passar?
- id: 3462
  text: >-
    La maledicció de l'Inframon, no?

    Sí, és una llauna.{:clear }Però si aconsegueixes superar aquella

    prova, seràs a un pas de ser un heroi.
- id: 3463
  text: >-
    Vols practicar, no?

    D'acord, ara veuràs el que és suar!
- id: 3464
  text: ※ₓₓₓₓₓₓₓₓₓₓₓₓₓₓ
- id: 3465
  text: >-
    Sempre s'ha d'entrenar. La clau per

    progressar és saber equipar-se bé.
- id: 3466
  text: >-
    L'Hèrcules està molt bé.

    Només necessita un descans.{:clear }Oi que sí, home meravella?
- id: 3467
  text: '[Renilla amb tristesa]'
- id: 3468
  text: >-
    El tipus de negre va apagar el foc que

    bloquejava l'entrada i va entrar a la cova.{:clear }Sincerament, em teniu preocupat.

    Prepareu-vos molt bé abans d'entrar.
- id: 3469
  text: ※ₓₓₓₓₓₓₓₓₓₓₓₓₓₓ
- id: 3471
  text: >-
    L'Hades mai es rendeix. Al final,

    aconseguirà el que vol de l'Hèrcules.
- id: 3472
  text: >-
    En aquell estat, l'Hèrcules

    no podrà derrotar l'Auron!{:clear }Per fi, el poderós heroi cau!
- id: 3473
  text: >-
    La cambra de l'Hades és

    al fons d'aquesta cova.{:clear }Cada vegada que em demana que hi vagi,

    un calfred em recorre l'esquena!
- id: 3474
  text: >-
    Aquesta inscripció és per als tornejos

    regulars, no per a la Copa Hades.
- id: 3476
  text: >-
    L'Hèrcules ha anat a buscar

    la Pedra de l'Olimp.{:clear }Mentrestant, no hauríeu

    d'entrenar, aprenents d'heroi?
- id: 3477
  text: >-
    Estic ocupat. Si no tens

    res a dir, ves-te'n.
- id: 3478
  text: >-
    Et vigilaré,

    escollit de la clau espasa.{:clear }He, he, he, he...
- id: 3479
  text: Dirigeix-te a la sortida!
- id: 3481
  text: Protegeix la Megara i acaba amb els enemics!
- id: 3482
  text: Derrota el Pete abans que la cova s'esfondri!
- id: 3498
  text: Se n'ha anat?
- id: 3499
  text: No hi comptis.
- id: 3500
  text: Ja us en aneu?
- id: 3501
  text: >-
    No està gens malament.

    Ets un heroi o una cosa així?
- id: 3502
  text: No... Res d'això. Només soc un...
- id: 3503
  text: '... Auron.'
- id: 3504
  text: Em dic així.
- id: 3505
  text: Soc el Sora.
- id: 3506
  text: Donald.
- id: 3507
  text: Goofy!
- id: 3508
  text: >-
    Pot ser que ens hagi reunit el destí.

    Potser necessiteu un escorta.
- id: 3509
  text: Escorta? Gràcies, però no.
- id: 3511
  text: Què? Està tancat!
- id: 3512
  text: Ha de cedir!
- id: 3513
  text: "{:delay 5A 00}Obre't d'una vegada! {:delay 14 00}"
- id: 3514
  text: ''
- id: 3515
  text: "{:delay 0F 00}S'obrirà amb això? {:delay 2C 01}"
- id: 3516
  text: '{:delay 0A 00}Sí, em sembla que sí.'
- id: 3517
  text: Afanya't!
- id: 3519
  text: ''
- id: 3520
  text: Som-hi!
- id: 3521
  text: ''
- id: 3522
  text: Gràcies, però estic bé.
- id: 3523
  text: I qui sou vosaltres?
- id: 3524
  text: >-
    Jo soc el Sora, aquests

    són el Donald i el Goofy. {:delay AF 00}{:clear }Venim a veure com

    li va a l'Hèrcules.
- id: 3525
  text: Coneixeu l'home meravella?
- id: 3526
  text: Sí! També som herois!
- id: 3527
  text: "{:delay 2A 00}{:clear }Voldràs dir aprenents d'heroi, Donald."
- id: 3528
  text: '{:delay 48 00}{:clear }Sembla que tenim un amic en comú.{:delay 9C 00}{:clear }Em dic Megara.{:delay 6C 00}{:clear }El meus amics em diuen Meg.'
- id: 3529
  text: "{:unk13 4E 01 87 00}{:unk06 00}{:unk08 01 00 05}I com va l'Hèrcules?"
- id: 3530
  text: >-
    {:unk13 C8 00 50 00}{:unk06 00}{:unk08 01 00 06}L'home meravella?

    Bé, lluita al Coliseu

    tots els dies.{:clear }Com se sol dir,

    «la feina d'un heroi

    mai s'acaba».{:clear }Si volgués, podria deixar-ho,

    però continua lluitant.{:clear }Tot i que fins i tot l'home

    meravella té els seus límits.{:clear }I Zeus n'hi do amb els

    rivals; enviats especials

    de l'Hades mateix...
- id: 3531
  text: "{:unk13 5E 01 DC 00}{:unk06 02}{:unk08 03 00 05}L'Hades!?"
- id: 3532
  text: >-
    {:unk13 18 01 50 00}{:unk06 00}{:unk08 01 00 05}Exacte. El Senyor de l'Inframon.

    Ara em dirigia a veure'l.{:clear }Potser puc aconseguir que li

    doni un respir a l'Hèrcules.{:clear }Si li passés res

    a aquell noi, jo...
- id: 3533
  text: >-
    {:unk13 5E 01 96 00}{:unk06 00}{:unk08 01 01 05}Òndia...{:clear }Sembla que sou

    més que amics!
- id: 3534
  text: '{:unk13 5E 01 96 00}{:unk06 00}{:unk08 01 01 05}'
- id: 3535
  text: '{:unk13 FA 00 50 00}{:unk06 01}{:unk08 01 00 05}Oh... eh, no... vull dir...'
- id: 3536
  text: >-
    {:unk13 61 01 76 00}{:unk06 00}{:unk08 01 00 06}Nosaltres anirem a

    parlar amb l'Hades.{:clear }No m'ho perdonaria, si

    et passés res pel camí.
- id: 3537
  text: >-
    {:unk13 BE 00 5A 00}{:unk06 00}{:unk08 01 00 06}Ho dius de debò?

    Bé, sembla que

    saps el que fas.{:clear }Em sembla que acceptaré

    la teva oferta.
- id: 3538
  text: >-
    {:unk13 BE 00 5A 00}{:unk06 00}{:unk08 01 00 06}Però... que quedi entre

    nosaltres l'asumpte de la

    xerrada amb l'Hades, d'acord?
- id: 3539
  text: '{:unk13 72 01 96 00}{:unk06 01}{:unk08 01 01 04}Som una tomba!'
- id: 3540
  text: L'Organització!
- id: 3541
  text: Sí.
- id: 3542
  text: Hora de tocar el dos!
- id: 3543
  text: Doncs molt bé...
- id: 3544
  text: >-
    D'on treuen aquests borinots?

    Mare meva!
- id: 3545
  text: >-
    Bah, no són més que uns

    embrolladors, tots ells!{:delay B4 00}{:clear }Bé... eh...

    què faràs amb l'Hèrcules?
- id: 3546
  text: >-
    Ha fet miques tots els

    lluitadors que li has enviat.{:delay F6 00}{:clear }Aviat no hi cabrà ni una

    agulla, a l'Inframon.
- id: 3548
  text: >-
    Ei, per què no envies a

    algú que ja estigui mort{:delay BA 00}{:clear }i li estalvies les molèsties?
- id: 3549
  text: >-
    Mort? Bona idea!

    I hi coneixo el guerrer perfecte.
- id: 3550
  text: ''
- id: 3551
  text: Jo també tinc por, Donald.
- id: 3552
  text: Hades, dona la cara!
- id: 3553
  text: ''
- id: 3554
  text: Uufff... Què hi ha allà abaix?
- id: 3555
  text: >-
    Es el calabós més profund

    de l'Inframon.{:delay 6E 00}{:clear }{:delay 28 00}{:clear }Aquesta vegada trauré el més

    dolent de tots els dolents.
- id: 3556
  text: Et refereixes a...?
- id: 3557
  text: ''
- id: 3558
  text: Aniré al gra.{:delay 42 00}{:clear }T'oferiré un tracte.
- id: 3559
  text: >-
    Et deixo sortir de la garjola.

    Sense lligams. Lliure com un ocell.
- id: 3560
  text: I tot per una simple feina.
- id: 3561
  text: >-
    Lluitar contra l'Hèrcules al Coliseu...

    a mort.
- id: 3562
  text: >-
    Aquesta és la meva història.

    I tu no en formes part.
- id: 3563
  text: Has oblidat amb qui parles? {:delay B4 00}{:clear }Soc el Senyor dels Morts!
- id: 3564
  text: Hun! No m'estranya que ningú vulgui morir.
- id: 3565
  text: Ara veuràs!
- id: 3566
  text: ''
- id: 3567
  text: Hades!
- id: 3568
  text: Vosaltres!?
- id: 3569
  text: Lluita!
- id: 3570
  text: Aixeca't!
- id: 3571
  text: Alguna cosa no va bé.
- id: 3572
  text: Em sento una mica estrany...
- id: 3573
  text: >-
    Exacte! Mireu, aquesta és la clau.{:delay AA 00}{:clear }A l'Inframon, «braç de ferro»

    vol dir «zero». Ve amb el lloc.
- id: 3574
  text: >-
    A l'Inframon, «braç de ferro»

    vol dir «zero». Ve amb el lloc.
- id: 3575
  text: Fugim!
- id: 3576
  text: Però haig de parlar amb l'Hades!
- id: 3577
  text: Què has dit?
- id: 3578
  text: >-
    No podem lluitar amb ell aquí!

    Ens n'hem d'anar... ara!
- id: 3579
  text: >-
    Tinc els sensecor

    per tot l'Inframon,{:delay BA 00}{:clear }així que deixa'm a mi a aquells mocosos.{:delay BA 00}{:clear }Mira, nano, tu continua intentant

    convertir l'Hèrcules en un sensecor.{:delay 08 01}{:clear }Llavors sí que serà meu.
- id: 3582
  text: L'Inframon em pertany!{:delay B4 00}{:clear }{:delay 2A 00}{:clear }Jo mateix me'n ocuparé!
- id: 3584
  text: Cèrber, endavant!
- id: 3585
  text: >-
    Au va, ganàpia,

    pren-te un descans avui.{:delay AA 00}{:clear }{:delay 08 00}{:clear }Pels vells temps...
- id: 3587
  text: >-
    Han vingut a veure'm.

    Han vingut a veure un heroi.{:delay BE 00}{:clear }No puc fallar-los.
- id: 3589
  text: >-
    No et preocupis, Meg. {:delay 4E 00}{:clear }Tot anirà bé. Per a què necessita

    descansar un heroi? Eh?
- id: 3590
  text: >-
    Tot anirà bé. Per a què necessita

    descansar un heroi? Eh?
- id: 3591
  text: Sora, no em fallis.
- id: 3592
  text: '{:unk13 4A 01 50 00}{:unk06 00}{:unk08 01 00 05}Ufff...'
- id: 3593
  text: '{:unk13 B6 01 82 00}{:unk06 00}{:unk08 01 00 05}Eh?'
- id: 3594
  text: "{:unk13 84 00 1F 01}{:unk06 00}{:unk08 01 01 01}On s'ha ficat l'Auron?"
- id: 3595
  text: >-
    {:unk13 2C 01 64 00}{:unk06 00}{:unk08 01 00 05}Ell sap cuidar-se.{:clear }Busquem la Meg. Llavors ja

    ho intentarem un altre cop.
- id: 3596
  text: >-
    Aviam si m'ha quedat clar...{:delay 46 00}{:clear }La clau espasa d'aquest

    mocós obre qualsevol pany?
- id: 3597
  text: Correcte.
- id: 3598
  text: >-
    {:delay 49 00}{:clear }T'he parlat de la passada de coliseu{:delay 68 00}{:clear }que tenim a l'Inframon?{:delay 9F 00}{:clear }Fa que el de dalt sembli

    una piscineta al seu costat.
- id: 3600
  text: >-
    Doncs allà és on acabarem{:delay 54 00}{:clear }amb la ratxa triomfal de

    d'aquell pallasso de l'Hèrcules.
- id: 3601
  text: >-
    Hi ha un problema.

    El Zeus l'ha clausurat.
- id: 3602
  text: ''
- id: 3603
  text: ''
- id: 3604
  text: Bingo!{:delay 3C 00}{:clear }{:delay 1E 00}{:clear }Pisparem la clau i{:delay 78 00}{:clear }reobrirem l'Infernòdrom.
- id: 3605
  text: >-
    Sento dir-ho, però aquella

    clau és molt particular.{:delay AE 00}{:clear }Ella tria el seu portador.

    I aquell xaval no és un estaquirot.
- id: 3606
  text: ''
- id: 3607
  text: Aquí cal un toc femení.
- id: 3608
  text: '{:unk13 1D 01 E6 00}{:unk06 00}{:unk08 01 00 04}Òndia, això em porta records!'
- id: 3609
  text: >-
    Sora! Donald! Goofy!

    Quan heu arribat?
- id: 3610
  text: Hola, Hèrcules!
- id: 3611
  text: Hola!
- id: 3612
  text: Com va!
- id: 3613
  text: Una altra aventura?
- id: 3614
  text: >-
    Sí. Busco uns amics, em

    carrego uns sensecor...
- id: 3615
  text: "Aprenents d'heroi: sempre ocupats."
- id: 3616
  text: I tant!
- id: 3617
  text: >-
    {:unk13 F0 00 5F 00}{:unk06 00}{:unk08 01 00 05}Bé, heu trobat

    els vostres amics?
- id: 3618
  text: >-
    {:unk13 5E 01 69 00}{:unk06 00}{:unk08 01 00 06}Encara busquem.

    Quan hem arribat aquí,

    ens hem trobat la Meg...
- id: 3619
  text: >-
    {:unk13 5E 01 69 00}{:unk06 00}{:unk08 01 00 06}Meg...mega...problemes!

    Així que hem hagut d'ajudar

    algú en problemes.{:clear }Hem decidit donar a

    l'Hades una bona lliçó...{:clear }... però a l'Inframon

    les nostres forces

    no serveixen de res.{:clear }Se t'acudeix res?
- id: 3620
  text: >-
    {:unk13 54 01 57 00}{:unk06 00}{:unk08 01 00 05}Bé, existeix una pedra

    que protegeix contra la

    maledicció de l'Inframon.{:clear }Els deus del

    Mont Olimp l'utilitzen

    quan hi han d'anar.
- id: 3621
  text: '{:unk13 68 01 86 00}{:unk06 00}{:unk08 01 00 07}Creieu que podríem utilitzar-la?'
- id: 3622
  text: "{:unk13 0E 01 46 00}{:unk06 00}{:unk08 01 00 05}I tant, per què no?{:clear }Us l'aconseguiré."
- id: 3623
  text: '{:unk13 95 01 E8 00}{:unk06 00}{:unk08 01 01 05}Gràcies!'
- id: 3624
  text: '{:unk13 1E 01 9F 00}{:unk06 00}{:unk08 01 01 05}És molt amable per part teva!'
- id: 3625
  text: >-
    {:unk13 EC 00 3D 00}{:unk06 00}{:unk08 01 00 05}Encara que tingueu la Pedra de 

    l'Olimp, l'Hades no és pas poca cosa.{:clear }I jo tinc un combat avui, o sigui

    que no us hi puc acompanyar...
- id: 3626
  text: >-
    {:unk13 40 01 35 00}{:unk06 00}{:unk08 01 00 04}Sabeu què necessiteu?

    Entrenar!{:clear }Per què no aneu a

    parlar amb el Fil?
- id: 3627
  text: '{:unk13 22 01 6E 00}{:unk06 00}{:unk08 01 01 05}Bé, bona idea!'
- id: 3628
  text: >-
    Hola, campió. {:delay 48 00}{:clear }Com et sents?{:delay 54 00}{:clear }Més et val descansar

    per al combat de demà.{:delay B4 00}{:clear }Ningú vol pagar per veure

    un heroi esgotat, m'entens?{:delay 20 01}{:clear }Recorda sempre:{:delay 6C 00}{:clear }la victòria es basa en dues senzilles paraules:{:delay D8 00}{:clear }menjar,{:delay 46 00}{:clear }banyar-se{:delay 42 00}{:clear }i dormir.
- id: 3629
  text: >-
    {:delay 32 00}{:clear }Però si són els

    aprenents d'heroi!
- id: 3630
  text: Què bé que et veig!
- id: 3631
  text: >-
    Millor que mai!{:delay 60 00}{:clear }Com us va?{:delay 48 00}{:clear }Us heu convertit ja

    en autèntics herois?
- id: 3632
  text: >-
    Com us va?{:delay 48 00}{:clear }Us heu convertit ja

    en autèntics herois?
- id: 3633
  text: Tranquils que tot arribarà.{:delay 84 00}{:clear }Bé... Com va?
- id: 3634
  text: >-
    {:unk13 7C 01 50 00}{:unk06 00}{:unk08 01 00 06}Ha, ha, ha!

    Vosaltres tres us

    encarregareu de l'Hades?
- id: 3635
  text: '{:unk13 A3 00 96 00}{:unk06 00}{:unk08 01 01 05}Què té de graciós!?'
- id: 3636
  text: >-
    {:unk13 2C 01 64 00}{:unk06 00}{:unk08 01 01 05}Teniu pit. Això m'agrada.{:clear }Eh, mai se sap... coses

    més rares s'han vist, no?

    Posem fil a l'agulla!
- id: 3637
  text: >-
    {:unk13 95 00 02 01}{:unk06 00}{:unk08 01 01 06}Bé, me n'haig d'anar

    un moment.
- id: 3638
  text: '{:unk13 6B 01 75 00}{:unk06 00}{:unk08 01 00 06}A on?'
- id: 3639
  text: '{:unk13 C8 00 04 01}{:unk06 00}{:unk08 01 01 05}No és cosa teva.'
- id: 3640
  text: >-
    {:unk13 12 01 42 00}{:unk06 00}{:unk08 01 00 05}Ho sento, xicots...{:clear }Han robat la

    Pedra de l'Olimp.
- id: 3641
  text: '{:unk13 F6 00 A3 00}{:unk06 02}{:unk08 03 01 07}Què!?'
- id: 3642
  text: '{:unk13 82 01 7E 00}{:unk06 00}{:unk08 01 01 06}Qui?'
- id: 3643
  text: >-
    {:unk13 32 01 46 00}{:unk06 00}{:unk08 01 00 04}No ho sabem encara.{:clear }L'únic segur és que ha

    estat un tipus de negre,

    amb una caputxa.{:clear }I que els seus camarades

    eren un munt de

    criatures blanques.
- id: 3644
  text: '{:unk13 D6 00 37 00}{:unk06 00}{:unk08 01 00 05}El coneixeu?'
- id: 3645
  text: >-
    {:unk13 40 01 64 00}{:unk06 00}{:unk08 01 01 05}Em sembla que sí.{:clear }Eh, si aconseguim recuperar

    la Pedra de l'Olimp, podem

    quedar-nos-la una estona?
- id: 3646
  text: '{:unk13 C8 00 46 00}{:unk06 00}{:unk08 01 00 05}I tant.'
- id: 3647
  text: >-
    {:unk13 13 01 34 00}{:unk06 00}{:unk08 01 00 05}Per cert, heu vist

    la Meg per aquí?
- id: 3648
  text: "{:unk13 DC 00 46 00}{:unk06 00}{:unk08 01 00 05}Oh, d'acord..."
- id: 3649
  text: >-
    Què et passa, heroiet?{:delay 79 00}{:clear }Et sents sobrepassat?{:delay 3C 00}{:clear }{:delay 18 00}{:clear }No em diguis?{:delay 3F 00}{:clear }Creia que mantenir-se en forma

    era part dels deures d'un heroi.{:delay A4 00}{:clear }Tu m'entens.
- id: 3650
  text: Ah, ja! Hades, hem de parlar!
- id: 3651
  text: >-
    He vingut a compartir

    notícies molt sucoses.{:delay A2 00}{:clear }Sembla ser que, la teva

    estimada, dolça i petita Meg...
- id: 3652
  text: "... ha anat i s'ha perdut per l'Inframon."
- id: 3653
  text: És a dir, que l'has segrestrada!
- id: 3654
  text: >-
    Sí... bé... però

    perquè entrar en detalls?
- id: 3655
  text: >-
    {:delay 49 00}{:clear }Ara no te'n pots anar. {:delay 6E 00}{:clear }A veure, avui tens un combat

    molt important contra...{:delay 4F 01}{:clear }la sanguinària... Hidra! {:delay 8D 00}{:clear }{:delay 13 00}{:clear }Si no et quedes, qui sap quants

    accidents li podrien passar?
- id: 3656
  text: Ja, tots causats per tu.
- id: 3657
  text: >-
    Com he dit...

    A qui li importen els detalls?
- id: 3658
  text: Ets un covard!
- id: 3659
  text: Bé, no tots podem ser herois.
- id: 3660
  text: Us en podeu ocupar?
- id: 3661
  text: És clar! Som herois!
- id: 3662
  text: Només aprenents, Donald.
- id: 3663
  text: >-
    Tu t'encarregues de l'Hidra

    i nosaltres de la resta.
- id: 3664
  text: Compto amb vosaltres.
- id: 3665
  text: Busca la Meg.
- id: 3666
  text: '{:unk13 4A 01 50 00}{:unk06 02}{:unk08 03 01 05}Fil!'
- id: 3667
  text: '{:unk13 81 00 9F 00}{:unk06 00}{:unk08 01 00 06}Ugh, ugh...'
- id: 3668
  text: '{:unk13 4A 01 50 00}{:unk06 00}{:unk08 01 00 05}Què ha passat?'
- id: 3669
  text: >-
    {:unk13 C2 00 58 00}{:unk06 00}{:unk08 01 00 05}He vist un tipus estrany

    vestit de negre.{:clear }He intentat seguir-lo, però m'ha

    descobert. Després d'això, només sé

    que he començat a veure estrelles.
- id: 3670
  text: '{:unk13 54 01 67 00}{:unk06 02}{:unk08 03 00 07}Vestit de negre!?'
- id: 3671
  text: >-
    {:unk13 FA 00 50 00}{:unk06 00}{:unk08 01 01 05}És el que va robar

    la Pedra de l'Olimp.
- id: 3672
  text: '{:unk13 4A 01 2E 00}{:unk06 00}{:unk08 01 01 06}Cap on es dirigia?'
- id: 3673
  text: "{:unk13 96 00 82 00}{:unk06 00}{:unk08 01 00 06}A l'Inframon."
- id: 3674
  text: >-
    {:unk13 2C 01 B4 00}{:unk06 00}{:unk08 01 00 07}És una mala pua, sí.

    Jo l'únic que volia era

    trobar un heroi suplent...{:clear }per si l'Hèrcules necessitava

    fer un descans.
- id: 3675
  text: >-
    {:unk13 B4 00 AA 00}{:unk06 00}{:unk08 01 01 06}Herois, eh?

    Ja ho podries haver demanat!
- id: 3676
  text: '{:unk13 75 01 01 01}{:unk06 02}{:unk08 03 00 06}Coneixeu algú!?'
- id: 3677
  text: '{:unk13 C8 00 78 00}{:unk06 00}{:unk08 01 00 05}Ah, sí, és clar...'
- id: 3678
  text: '{:unk13 55 01 46 00}{:unk06 00}{:unk08 01 00 06}Nois...'
- id: 3679
  text: >-
    {:unk13 12 01 45 00}{:unk06 00}{:unk08 01 01 05}La maledicció de l'Inframon

    m'està afectant.
- id: 3680
  text: >-
    {:unk13 B4 00 47 00}{:unk06 00}{:unk08 01 01 04}Hem de recuperar aquella

    Pedra de l'Olimp ràpid!
- id: 3681
  text: Ah! Tu!
- id: 3682
  text: Un moment...
- id: 3683
  text: Roxas?
- id: 3684
  text: Perdona?
- id: 3685
  text: Oohh, és inútil...
- id: 3686
  text: Eh? De què parles tu ara?
- id: 3687
  text: >-
    Aviam, aquí...{:delay 75 00}{:clear }{:delay 25 00}{:clear }«Si el subjecte no respongués, {:delay 8E 00}{:clear }empri's la violència per alliberar

    la seva veritable naturalesa.»{:delay FC 00}{:clear }{:delay 2E 00}{:clear }Perfecte. {:delay 48 00}{:clear }Mai s'hauran equivocat

    triant el tipus per fer això...?
- id: 3688
  text: Ets molt raret!
- id: 3689
  text: ''
- id: 3690
  text: Ell deu ser el lladre!
- id: 3691
  text: Quina grolleria!
- id: 3692
  text: '{:delay 6C 00}{:clear }Roxas, torna amb nosaltres.'
- id: 3693
  text: El nano és un disc ratllat!
- id: 3694
  text: Ei, mireu!
- id: 3695
  text: Som-hi! La Meg ens necessita!
- id: 3696
  text: Meg!
- id: 3697
  text: Ja gairebé hi som.
- id: 3698
  text: '{:delay AE 00}{:clear }Aquella sí que és una clau!'
- id: 3699
  text: Vaja! Gràcies per la teva ajuda!{:delay 84 00}{:clear }{:delay 54 00}{:clear }Que tinguis un bon dia!
- id: 3700
  text: Sora! Darrere teu!
- id: 3701
  text: >-
    {:delay 84 00}{:clear }Què passa? No sabeu

    lluitar a l'Inframon?
- id: 3702
  text: Això s'haurà de veure!
- id: 3703
  text: En són massa!
- id: 3704
  text: Marxem!
- id: 3705
  text: Sento la tardança.
- id: 3706
  text: >-
    Emporteu-vos la Meg d'aquí.

    Ens veiem al Coliseu.
- id: 3707
  text: I tu què?
- id: 3708
  text: >-
    Ensenyaré a aquests nanos el que passa

    quan es fiquen amb un autèntic heroi.
- id: 3709
  text: Espera un segon!
- id: 3710
  text: Sora... No puc abandonar-lo.
- id: 3711
  text: Estarà bé.
- id: 3712
  text: >-
    Mira, fins i tot l'Hèrcules té els seus

    límits. No pot guanyar eternament.
- id: 3713
  text: Doncs anirem a ajudar-lo.
- id: 3714
  text: Treu d'aquí la Meg!
- id: 3715
  text: >-
    {:delay 3C 00}{:clear }Aquest lloc em fa calfreds.{:delay 6C 00}{:clear }{:delay 15 00}{:clear }M'encarregaré de vosaltres

    la propera vegada!
- id: 3716
  text: >-
    Podria anar encara més

    bé el dia d'avui?{:delay D8 00}{:clear }Aquest cop l'alè Meravella

    caurà d'una vegada per totes!
- id: 3717
  text: >-
    {:unk13 C8 00 50 00}{:unk06 00}{:unk08 01 00 05}Però si és el més famós dels

    fracassats! Aquesta vegada

    sí que l'has feta bona.
- id: 3718
  text: >-
    {:unk13 4A 01 78 00}{:unk06 01}{:unk08 01 01 04}A ningú li agrada els que

    no saben perdre, Hades.
- id: 3719
  text: '{:unk13 16 01 2D 00}{:unk06 02}{:unk08 03 00 04}Tanca la boca, nano-clau!'
- id: 3720
  text: "{:unk13 4A 01 5A 00}{:unk06 00}{:unk08 01 01 06}Aleshores deixa-m'ho a mi."
- id: 3721
  text: >-
    {:unk13 4A 01 50 00}{:unk06 00}{:unk08 01 00 07}A ningú li agrada els que

    no saben perdre, Hades.
- id: 3722
  text: >-
    {:unk13 4A 01 50 00}{:unk06 00}{:unk08 01 00 04}Sí, ja, el que tu diguis.{:clear }Ei, escolta, no tenies tu

    un assumptet amb l'Hidra?

    Uff, a saber què deu fer...
- id: 3723
  text: >-
    {:unk13 4A 01 50 00}{:unk06 00}{:unk08 01 00 04}He sentit que les

    coses estan complicades

    allà dalt, campió.
- id: 3724
  text: '{:unk13 AA 01 D2 00}{:unk06 02}{:unk08 03 01 05}Alto!'
- id: 3725
  text: >-
    {:unk13 C8 00 46 00}{:unk06 00}Sento les presses, però

    tinc altres assumptets a

    atendre.
- id: 3726
  text: No pot ser...
- id: 3727
  text: Campió! Ets fora de perill!
- id: 3728
  text: He fallat...
- id: 3729
  text: Tu no en tens la culpa!
- id: 3730
  text: Us he deixat a tots indefensos.
- id: 3731
  text: >-
    L'Hades tenia raó.

    Estic acabat.
- id: 3732
  text: >-
    Bah, au va ja, campió.

    Jo no et vaig entrenar per pensar així!
- id: 3733
  text: Heroi meu...
- id: 3734
  text: >-
    En Fil té raó.

    No és moment de castigar-te.
- id: 3735
  text: Quin heroi...
- id: 3736
  text: L'Hèrc necessita ajuda!
- id: 3737
  text: Sí!
- id: 3738
  text: Hi ha lloc per a un més?
- id: 3739
  text: Ens hi apuntem!
- id: 3740
  text: ''
- id: 3741
  text: Us he fallat. Només soc...{:delay 96 00}{:clear }{:delay 50 00}un inútil.
- id: 3742
  text: >-
    Tu no en tens la culpa.

    Ei, fins i tot un déu n'estaria esgotat.
- id: 3743
  text: >-
    Té raó.

    Hauries de descansar una mica.
- id: 3744
  text: >-
    A més, no hi haurà Jocs

    en una temporada.
- id: 3745
  text: >-
    No us preocupeu per l'home meravella.

    Jo me'n cuidaré.{:delay 14 01}{:clear }Sora,{:delay 54 00}{:clear }Donald,{:delay 4E 00}{:clear }Goofy...{:delay 42 00}{:clear }us dec un gran favor.
- id: 3746
  text: >-
    Ei, no passa res.{:delay 54 00}{:clear }{:delay 39 00}{:clear }Avisa'ns si l'Hades o els

    sensecor donen taba,{:delay AE 00}{:clear }i ens n'encarregarem.
- id: 3748
  text: Sí! Per a això hi són els herois!
- id: 3749
  text: Des de quan sou herois?
- id: 3750
  text: >-
    En parlarem un altre dia.

    Ara ens en anem.
- id: 3751
  text: D'acord. Serem aquí.
- id: 3752
  text: >-
    Òndia! Espero que et

    recuperis aviat, Hèrcules.
- id: 3753
  text: Sí...
- id: 3754
  text: Fil?
- id: 3755
  text: >-
    Bé... Cuideu-vos, nois.{:delay 7E 00}{:clear }Quedeu-vos una mica

    més la pròxima vegada.{:delay 6C 00}{:clear }Tenim molt a entrenar.
- id: 3757
  text: En fi, ens en anem.
- id: 3758
  text: >-
    Ah, se m'oblidava.

    La Pedra de l'Olimp!
- id: 3759
  text: >-
    {:unk13 B4 00 78 00}{:unk06 00}{:unk08 01 01 06}Creieu que l'Hades

    és aquí?
- id: 3760
  text: '{:unk13 7C 01 DC 00}{:unk06 00}{:unk08 01 00 06}Esbrinem-ho!'
- id: 3761
  text: '{:unk13 96 00 A0 00}{:unk06 00}{:unk08 01 01 05}I bé?'
- id: 3762
  text: '{:unk13 68 01 96 00}{:unk06 00}{:unk08 01 00 05}Via lliure!'
- id: 3763
  text: >-
    {:unk13 AA 00 7D 00}{:unk06 00}{:unk08 01 01 05}Ni rastre dels incorporis

    ni dels sensecor...

    com a mínim per ara.
- id: 3764
  text: '{:unk13 69 01 CB 00}{:unk06 00}{:unk08 01 01 05}Què és allò?'
- id: 3765
  text: "{:unk13 96 00 64 00}{:unk06 00}{:unk08 01 00 05}L'Infernòdrom."
- id: 3766
  text: >-
    {:unk13 FA 00 64 00}{:unk06 00}{:unk08 01 00 05}Hi va haver un temps en el

    que els dimonis lluitaven aquí...

    sense cap pietat.{:clear }Però al Zeus no li agradava

    la violència sense sentit,

    així que el va clausurar.
- id: 3767
  text: "{:unk13 5E 01 C8 00}{:unk06 02}{:unk08 01 01 05}I per què s'ha reobert?"
- id: 3768
  text: >-
    {:unk13 96 00 96 00}{:unk06 00}{:unk08 01 00 05}Algun neci deu haver

    trencat el segell.
- id: 3769
  text: '{:unk13 5E 01 96 00}{:unk06 00}{:unk08 01 01 05}Quin idiota.'
- id: 3770
  text: '{:unk13 96 00 96 00}{:unk06 00}{:unk08 01 00 05}Ehem.'
- id: 3771
  text: >-
    {:unk13 C8 00 64 00}{:unk06 00}{:unk08 01 01 05}On vas ara, Auron?

    Tenim molt a parlar!
- id: 3772
  text: >-
    {:unk13 A2 00 64 00}{:unk06 00}{:unk08 01 01 05}Si voleu fer res,

    ajudeu els vostres amics.
- id: 3773
  text: Hola.
- id: 3774
  text: Hèrcules, et trobes millor?
- id: 3775
  text: >-
    Bé, el de sempre.{:delay 78 00}{:clear }L'home meravella pensa que els

    seus dies de glòria han passat.{:delay BA 00}{:clear }I el Fil creu que és tot psicològic.
- id: 3776
  text: >-
    Òndia, Hèrcules!

    Sabem que ets un heroi!
- id: 3777
  text: I tant, home cagarel・la.
- id: 3778
  text: >-
    Com pots estar trist

    en un dia tan gloriós?
- id: 3779
  text: >-
    L'Infernòdrom s'obre

    i n'has d'omplir les grades.
- id: 3780
  text: >-
    Els teus seguidors no es conformarien

    amb res que no sigui un heroi titulat!
- id: 3781
  text: >-
    Bé, si no et ve de gust,

    sempre pots...{:delay 78 00}{:clear }no sé, perdre-hi.
- id: 3782
  text: Més t'agradaria!
- id: 3783
  text: >-
    Què dius? Perdona.{:delay 7E 00}{:clear }Jo no soc egoista com aquells

    estirats tan repelents de l'Olimp.
- id: 3784
  text: >-
    Represento les masses!

    I en tinc una idea digna!
- id: 3785
  text: >-
    Els Jocs, dames i cavallers...

    han tornat!
- id: 3786
  text: El seu fidel servidor, Hades...{:delay A8 00}{:clear }l'un i únic Senyor dels Morts...
- id: 3787
  text: >-
    us porta els millors jocs{:delay 72 00}{:clear }per celebrar la reobertura

    del millor coliseu!
- id: 3788
  text: >-
    Donarem resposta a la

    gran incògnita,{:delay 7C 00}{:clear }qui es mereix el títol

    de Millor Heroi?
- id: 3789
  text: >-
    Aquests Jocs resoldran el

    debat d'una vegada per totes!{:delay B4 00}{:clear }El guanyador serà el rei suprem...
- id: 3790
  text: De què? Ho heu endevinat,{:delay A2 00}{:clear }de la Copa Hades!
- id: 3791
  text: >-
    I us asseguro que el «Gran» Hèrcules

    hi serà... {:delay AE 00}{:clear }Perquè si no...
- id: 3792
  text: '... no tornarà a veure la seva xicota.'
- id: 3793
  text: Miserable!
- id: 3794
  text: Què que n'ets, d'amable, nano!
- id: 3795
  text: '{:unk13 C8 00 5A 00}{:unk06 00}{:unk08 01 00 05}Contra qui lluitem primer?'
- id: 3796
  text: '{:unk13 9A 00 5F 00}{:unk06 00}{:unk08 01 01 05}Vejam...'
- id: 3797
  text: '{:unk13 68 01 78 00}{:unk06 00}{:unk08 01 00 06}Contra «Cop giratori».'
- id: 3798
  text: >-
    {:unk13 73 01 7B 00}{:unk06 00}{:unk08 01 00 06}Mireu! L'Auron

    també és al torneig!
- id: 3799
  text: >-
    {:unk13 57 01 6B 00}{:unk06 00}{:unk08 01 00 06}Oh, oh! Potser ens hi hem

    d'enfrontar a la final!
- id: 3800
  text: '{:unk13 C8 00 5A 00}{:unk06 00}{:unk08 01 00 05}És digne de ser un heroi?'
- id: 3801
  text: >-
    {:unk13 E4 00 58 00}{:unk06 00}{:unk08 01 00 06}Bé, no crec que sigui

    mala persona...
- id: 3802
  text: >-
    {:unk13 E8 00 45 00}{:unk06 00}{:unk08 01 00 06}Però tu ets l'únic heroi

    per aquí, Hèrcules.

    Ja ho saps.
- id: 3803
  text: >-
    {:unk13 A2 00 2D 00}{:unk06 00}{:unk08 01 01 04}Potser ho vaig ser...

    Ara només soc un fraca...
- id: 3804
  text: '{:unk13 09 01 82 00}{:unk06 02}{:unk08 01 00 06}Deixa-ho ja!'
- id: 3805
  text: >-
    {:unk13 86 00 94 00}{:unk06 00}{:unk08 01 01 06}Com t'ha anat,

    campió?
- id: 3806
  text: >-
    {:unk13 4C 01 56 00}{:unk06 00}{:unk08 01 01 06}Ja no soc el que era.

    Lamento haver-vos-hi

    arrossegat, amics.
- id: 3807
  text: >-
    {:unk13 DB 00 76 00}{:unk06 00}{:unk08 01 00 06}No llencis la tovallola encara,

    Hèrcules! Et necessitem

    a les semifinals!
- id: 3808
  text: >-
    {:unk13 7D 01 A0 00}{:unk06 00}{:unk08 01 00 06}Ja som a les

    semifinals...
- id: 3809
  text: >-
    {:unk13 27 01 9A 00}{:unk06 02}{:unk08 03 00 06}Ostres!

    Contra «Mala cosa»!?
- id: 3810
  text: '{:unk13 E2 00 5A 00}{:unk06 00}{:unk08 01 00 05}Són bons?'
- id: 3811
  text: >-
    {:unk13 2C 01 96 00}{:unk06 00}{:unk08 01 00 05}Semblen ser molt «dolents»...

    però no ens fan por!
- id: 3812
  text: '{:unk13 66 01 4F 00}{:unk06 00}{:unk08 01 01 06}Hem arribat a la final!'
- id: 3813
  text: >-
    {:unk13 F7 00 97 00}{:unk06 00}{:unk08 01 01 05}Si guanyem, serem

    uns veritables herois!
- id: 3814
  text: >-
    {:unk13 2A 01 5B 00}{:unk06 00}{:unk08 01 01 05}Ah, per això estàs

    tan content.
- id: 3815
  text: >-
    {:unk13 53 01 3A 00}{:unk06 00}{:unk08 01 01 06}No podem ser aprenents

    d'heroi per a sempre, no?
- id: 3816
  text: '{:unk13 C8 00 96 00}{:unk06 00}{:unk08 01 00 05}Intentaré no ficar-hi la pota.'
- id: 3817
  text: "{:unk13 DC 00 AD 00}{:unk06 00}{:unk08 01 01 05}Ja n'hi ha prou..."
- id: 3818
  text: '{:unk13 5B 00 40 01}{:unk06 00}{:unk08 01 00 05}Mireu. Allà.'
- id: 3819
  text: >-
    {:unk13 7C 00 D6 00}{:unk06 00}{:unk08 01 00 05}És el nostre últim

    adversari, no?
- id: 3820
  text: '{:unk13 80 01 69 00}{:unk06 00}{:unk08 01 00 05}Auron!'
- id: 3821
  text: '{:unk13 C8 00 64 00}{:unk06 00}{:unk08 01 01 05}I vosaltres sou?'
- id: 3822
  text: '{:unk13 4F 00 85 00}{:unk06 00}{:unk08 01 01 05}Eh?'
- id: 3823
  text: '{:unk13 CE 00 AA 00}{:unk06 00}{:unk08 01 00 05}Auron...?'
- id: 3824
  text: >-
    {:unk13 C8 00 64 00}{:unk06 00}{:unk08 01 01 05}Haig de vèncer-vos per

    redimir els meus crims.
- id: 3825
  text: '{:unk13 64 00 82 00}{:unk06 02}{:unk08 01 01 05}Eh!'
- id: 3826
  text: '{:unk13 54 01 46 00}{:unk06 00}{:unk08 01 00 05}A què ve tot allò?'
- id: 3827
  text: >-
    Bé, anem a veure.

    Quin és el teu crim, presoner?
- id: 3828
  text: >-
    Existir. Aquell és el meu crim...

    i és inexcusable.
- id: 3829
  text: Ahà... Bé, magnífic.
- id: 3830
  text: >-
    Què li passa, a l'Auron?

    Mai s'havia comportat així.
- id: 3831
  text: ''
- id: 3832
  text: >-
    D'acord, has comès un petit 

    error de res: existir.
- id: 3833
  text: >-
    Però et perdono.{:delay 97 00}{:clear }Si compleixes la teva part

    del nostre petit tracte,{:delay 83 00}{:clear }estic disposat a fer-ne

    la vista grossa.
- id: 3834
  text: Entesos. Derrotaré l'Hèrcules.
- id: 3835
  text: I els pesats dels seus amics.
- id: 3836
  text: Què? No, només l'Hèrcules.
- id: 3837
  text: >-
    Aahh... T'has oblidat de qui

    mana aquí, per ventura?
- id: 3838
  text: >-
    A l'Hèrcules i als altres tres,

    està clar?
- id: 3839
  text: Cristal・lí, Hades.
- id: 3840
  text: Senyor meu Hades.
- id: 3841
  text: Senyor meu Hades...
- id: 3842
  text: Bé.{:delay 47 00}{:clear }{:delay 3D 00}{:clear }Ara, ves-te'n.
- id: 3843
  text: Així és com controla l'Auron!
- id: 3844
  text: '{:unk13 78 00 82 00}{:unk06 02}{:unk08 03 01 05}Quin idiota!'
- id: 3845
  text: >-
    {:unk13 36 01 5A 00}{:unk06 00}{:unk08 01 00 05}Segur que s'ho prendria

    com un compliment.
- id: 3846
  text: >-
    {:unk13 56 01 3C 00}{:unk06 00}{:unk08 01 00 06}No soporto veure l'Auron

    servir a fins tan baixos...{:clear }Hem d'ajudar-lo!
- id: 3847
  text: >-
    {:unk13 78 00 4B 00}{:unk06 02}{:unk08 03 01 06}Som-hi, anem

    a buscar-lo!
- id: 3848
  text: Què passa, Sora?
- id: 3849
  text: >-
    L'Auron té problemes!

    L'Hades li ha rentat el cervell!
- id: 3850
  text: Està utilitzant una mena de ninot.
- id: 3851
  text: >-
    Saps què?

    Allò m'és familiar.
- id: 3852
  text: >-
    {:delay 72 00}{:clear }L'Hades deu fer servir aquell ninot

    per dominar la voluntat de l'Auron.
- id: 3853
  text: Què fem?
- id: 3854
  text: >-
    Intenteu trobar aquell ninot.{:delay 66 00}{:clear }{:delay 1E 00}{:clear }Ha de ser en alguna

    part de l'Inframon.
- id: 3855
  text: D'acord! Jo me n'encarrego!
- id: 3856
  text: >-
    Digue'm que no estàs

    pensant a anar-te'n.{:delay 6C 00}{:clear }{:delay 1C 00}{:clear }Tens un combat.
- id: 3857
  text: >-
    Lluitaré contra l'Auron en la final.

    Cara a cara.
- id: 3858
  text: Oh, ho faràs?
- id: 3859
  text: >-
    Intentaré aconseguir-vos

    una mica de temps.
- id: 3860
  text: Però...
- id: 3861
  text: >-
    Afanyeu-vos.

    Compto amb vosaltres.
- id: 3862
  text: >-
    Enhorabona!

    Tracte fet!
- id: 3863
  text: Gràcies.
- id: 3864
  text: >-
    Amb una condició!{:delay 42 00}{:clear }El portador de la clau espasa

    i els seus fidels amics{:delay 84 00}{:clear }han d'enfrontar-se al guanyador

    en un combat final. Què em dius?
- id: 3865
  text: El públic es tornarà boig.
- id: 3866
  text: >-
    Més els val. Els he promès el

    combat de la seva vida eterna!
- id: 3867
  text: >-
    {:delay 48 00}Necis. M'ho estan

    posant massa fàcil.
- id: 3868
  text: Això sí que és un espectacle!
- id: 3869
  text: El tenim!
- id: 3870
  text: ''
- id: 3871
  text: Eh?
- id: 3872
  text: Què passaaaa?
- id: 3873
  text: >-
    Encara hi som a temps!

    Tornem-hi!
- id: 3874
  text: >-
    Sí, però ara...

    No puc acceptar-ho.
- id: 3875
  text: Quin sentit té tot això?
- id: 3876
  text: Però... hi ha d'haver una altra manera!
- id: 3877
  text: Les vostres morts hauran estat debades!
- id: 3878
  text: Heu de viure!
- id: 3879
  text: >-
    És clar! Això pertany

    al cor de l'Auron.
- id: 3880
  text: >-
    Òndia! Deu haver tingut

    una vida molt dura.
- id: 3881
  text: >-
    Sí, però, al final, això

    és el que l'ha fet tan fort.
- id: 3882
  text: Anem a tornar-li-ho!
- id: 3883
  text: >-
    Incorporis?

    D'on han sortit?
- id: 3884
  text: Ei! Fora d'aquí!
- id: 3885
  text: >-
    No sé què són,

    però millor no preguntar.
- id: 3886
  text: Més ens val tocar el dos.
- id: 3887
  text: Ara! Acaba amb ell!
- id: 3888
  text: Auron! No ho facis!
- id: 3889
  text: >-
    Ei, Auron!

    Això és teu!
- id: 3890
  text: Sora... Donald... Goofy.
- id: 3891
  text: Auron!
- id: 3892
  text: Aquests maleïts...!
- id: 3893
  text: Ugh, presoner!
- id: 3894
  text: >-
    Què ha estat del nostre

    mutu acord?{:delay 90 00}{:clear }{:delay 24 00}{:clear }Podem començar de cap i de nou,

    però has d'ajudar-me.
- id: 3895
  text: Potser no em vas sentir bé.
- id: 3896
  text: >-
    Aquesta és la meva història,

    i tu no en formes part.
- id: 3897
  text: >-
    Ja n'hi ha prou! {:delay 90 00}{:clear }{:delay 4E 00}{:clear }S'ha acabat el joc!

    He respectat les normes fins ara.
- id: 3898
  text: >-
    Està bé, ho confesso.

    Esperava que l'home meravella perdés,{:delay F4 00}{:clear }però ha estat un combat just.

    Au va, tan dolent és això? Eh?
- id: 3899
  text: De debò? Un combat just?
- id: 3900
  text: '{:delay 53 00}Riu tot el que vulguis!{:delay 53 00}{:clear }{:delay 49 00}{:clear }Perquè riu bé qui riu darrer!'
- id: 3901
  text: Vols saber per què?
- id: 3902
  text: >-
    Perquè ara jugarem

    amb les meves normes.
- id: 3903
  text: ''
- id: 3904
  text: Meg!
- id: 3905
  text: Hèrcules!
- id: 3906
  text: >-
    Mira que t'ho vaig

    advertir des del principi.{:delay 85 00}{:clear }Si no hi ha combat,

    et quedes sense xicota.
- id: 3907
  text: No!
- id: 3908
  text: Meg! Aguanta!
- id: 3909
  text: >-
    Em sembla que l'home meravella

    ha caigut de les eliminatòries.
- id: 3910
  text: >-
    Bé, encara t'has

    d'encarregar de nosaltres!
- id: 3911
  text: Oohh, sí. Això serà brutal.
- id: 3912
  text: ''
- id: 3913
  text: És impossible.
- id: 3914
  text: Per què?
- id: 3915
  text: Perquè això és l'Inframon!
- id: 3916
  text: Òndia! I com el guanyarem?
- id: 3917
  text: >-
    Em sembla que un autèntic

    heroi us vindria bé.
- id: 3918
  text: Però... Tu...
- id: 3919
  text: Te'n dec una, Hades.
- id: 3920
  text: >-
    No he dubtat a donar la meva vida

    per la Meg. I això m'ha fet recordar...
- id: 3921
  text: >-
    que és la força del cor el que et

    converteix en un autèntic heroi.
- id: 3922
  text: No tornaré a oblidar-me'n.
- id: 3923
  text: Deixa't estar d'espectacles.
- id: 3924
  text: >-
    Tothom fa bogeries quan

    s'està enamorat.
- id: 3925
  text: Què us fa tanta gràcia, imbècils?
- id: 3926
  text: >-
    Com us atreviu a tenir un

    final feliç! Com us atreviu!
- id: 3927
  text: "{:delay CC 00}{:clear }Això...{:delay 48 00}{:clear }no s'ha acabat...{:delay 72 00}{:clear }"
- id: 3928
  text: Què faràs ara?
- id: 3929
  text: >-
    He passat la meva vida

    defenent els altres.
- id: 3930
  text: >-
    Però ja...

    no em queda ningú a qui protegir.
- id: 3931
  text: >-
    Potser és l'hora d'escriure

    la meva pròpia història.
- id: 3932
  text: >-
    Sí, t'ho mereixes, Auron,

    després de tot el que has patit.
- id: 3933
  text: Suposo que... hauria d'agrair-vos-ho.
- id: 3934
  text: No cal.
- id: 3935
  text: Bé.
- id: 3936
  text: >-
    És a dir...

    sí que podries agrair-nos-ho una mica.
- id: 3937
  text: Hauries de dir el que sents.
- id: 3938
  text: >-
    Suposo que us puc 

    dedicar algunes paraules.
- id: 3939
  text: Gràcies per entremeter-vos.
- id: 3940
  text: Eh! Què vol dir això?
- id: 3941
  text: >-
    Gràcies un altre cop, nanos!

    Sou els millors.
- id: 3942
  text: Disculpa'ns per haver-nos-hi entremès.
- id: 3943
  text: >-
    Ohh... Per què ho dius?

    Nosaltres no ho pensem.
- id: 3944
  text: >-
    De veritat.

    Gràcies, Sora, Donald... Goofy.
- id: 3945
  text: Bé, on aneu ara?
- id: 3946
  text: Doncs ja saps...
- id: 3947
  text: >-
    Sembla que vosaltres dos,

    colomins, estareu bé{:delay C0 00}{:clear }sense nosaltres rondant per aquí.
- id: 3948
  text: Sí, ens n'hem d'anar.
- id: 3949
  text: >-
    Ahà. Abans que ens

    entremetem en res.
- id: 3950
  text: Exacte.
- id: 3951
  text: >-
    Preteneu deixar-me

    sense feina, xatos?
- id: 3952
  text: >-
    Si no pareu de arrasar en tots

    els reptes, a qui entrenaré?
- id: 3953
  text: >-
    Eh, no pots deixar-me ara, Fil!{:delay 8D 00}{:clear }Haig d'estar en plena forma

    per si l'Hades torna a aparèixer.
- id: 3954
  text: Eh! Ja som herois de veritat?
- id: 3955
  text: Això! Au va, Fil. Porta't bé.
- id: 3956
  text: Anem a veure...{:delay 6C 00}{:clear }Bé, us cal una mica de saviesa.
- id: 3957
  text: I esteu una mica... verds encara.
- id: 3958
  text: Molt bé, molt bé, ens ha quedat clar.
- id: 3959
  text: Mira, xaval, jo no decideixo.
- id: 3960
  text: I ho diu ara.
- id: 3961
  text: >-
    Si per mi fos, no hi

    tindríeu problema.{:delay A8 00}{:clear }Us nombraria herois a l'instant!
- id: 3962
  text: De debò!?
- id: 3963
  text: Repeteix-ho!
- id: 3964
  text: >-
    Pensant-m'ho millor,{:delay 36 00}{:clear }si aquella és la vostra millor cara

    d'heroi, encara teniu molt a millorar.
- id: 3965
  text: Eh! Què vols dir?
- id: 3966
  text: Fora!
- id: 3967
  text: Fil!
- id: 3968
  text: Deixa'm en pau!
- id: 3969
  text: Has vist allò?
- id: 3970
  text: Vaja, fixa-t'hi!
- id: 3971
  text: '{:icon dynamic-triangle}Diari'
- id: 3972
  text: Practica
- id: 3973
  text: Maníac
- id: 3974
  text: ''
- id: 3975
  text: >-
    Trenca els atuells i recull

    tantes esferes com puguis!
- id: 3976
  text: ''
- id: 3977
  text: ''
- id: 3978
  text: >-
    Trenca els atuells i recull

    tantes esferes com puguis!
- id: 3979
  text: ''
- id: 3980
  text: Sí
- id: 3981
  text: No
- id: 3982
  text: Tria un curs d'entrenament.
- id: 3983
  text: Llavors, t'agradaria fer aquest curs?
- id: 3984
  text: '{:icon dynamic-triangle}Diari'
- id: 3993
  text: Copa Pena i Pànic
- id: 3994
  text: Copa Cèrber
- id: 3995
  text: Copa Tità
- id: 3996
  text: Copa Deessa del Destí
- id: 3999
  text: '{:width 81}Copa Paradoxa de Pena i Pànic'
- id: 4000
  text: Copa Paradoxa de Cèrber
- id: 4001
  text: Copa Paradoxa de Tità
- id: 4002
  text: Copa Paradoxa d'Hades
- id: 4005
  text: Copa Pena i Pànic
- id: 4006
  text: >-
    Lluita la costat dels teus amics.

    No pots utilitzar l'indicador

    de Fusió, però els Límits

    consumeixen menys PM que

    de costum.
- id: 4007
  text: >-
    No guanyes experiència.

    {:color #F0F00080}Nivell del torneig: 25{:reset}
- id: 4008
  text: Copa Cèrber
- id: 4009
  text: >
    En Sora lluita sol.

    L'indicador de Fusió

    s'omple més ràpid que

    de costum i en Sora pot

    utilitzar Fusió estant sol.
- id: 4010
  text: >-
    No guanyes experiència.

    {:color #F0F00080}Nivell del torneig: 30{:reset}
- id: 4011
  text: Copa Tità
- id: 4012
  text: >
    En aquest torneig, en

    Sora lluita sol, però

    pot utilitzar Invocar.
- id: 4013
  text: >-
    No guanyes experiència.

    {:color #F0F00080}Nivell del torneig: 45{:reset}
- id: 4014
  text: Copa Deessa del Destí
- id: 4015
  text: >
    Lluita al costat dels

    teus amics.

    Les normes varien

    segons la ronda.
- id: 4016
  text: >-
    No guanyes experiència.

    {:color #F0F00080}Nivell del torneig: 55{:reset}
- id: 4023
  text: '{:width 81}Copa Paradoxa de Pena i Pànic'
- id: 4024
  text: >-
    Lluita al costat dels teus amics.

    No pots utilitzar l'indicador

    de Fusió, però els Límits

    consumeixen menys PM que

    de costum.
- id: 4025
  text: >-
    No guanyes experiència.

    {:color #F0F00080}Nivell del torneig: 60{:reset}
- id: 4026
  text: Copa Paradoxa de Cèrber
- id: 4027
  text: >
    En Sora lluita sol.

    L'indicador de Fusió

    s'omple més ràpido que

    de costum i en Sora pot

    utilitzar Fusió estant sol.
- id: 4028
  text: >-
    No guanyes experiència.

    {:color #F0F00080}Nivell del torneig: 70{:reset}
- id: 4029
  text: Copa Paradoxa de Tità
- id: 4030
  text: >
    En aquest torneig, en

    Sora lluita sol, però

    pot utilitzar Invocar.
- id: 4031
  text: >-
    No guanyes experiència.

    {:color #F0F00080}Nivell del torneig: 80{:reset}
- id: 4032
  text: Copa Paradoxa d'Hades
- id: 4033
  text: >
    Lluita al costat dels

    teus amics.

    En aquest torneig no

    hi ha normes especials.
- id: 4034
  text: >-
    No guanyes experiència.

    {:color #F0F00080}Nivell del torneig: 99{:reset}
- id: 4041
  text: Sí
- id: 4042
  text: No
- id: 4043
  text: A quin torneig t'apuntes?
- id: 4044
  text: A quin torneig t'apuntes?
- id: 4045
  text: A quin torneig t'apuntes?
- id: 7511
  text: >-
    La classificació de la Copa Hades,

    en què tan bé vas lluitar.
- id: 7512
  text: >-
    La classificació de la Copa

    Hèrcules, en què vas vèncer.
- id: 7513
  text: >-
    La classificació de la Copa Pegàs,

    en què vas combatre amb valentia.
- id: 7514
  text: >-
    La classificació d'un torneig

    memorable, la Copa Fil.
- id: 7518
  text: El trofeu de la Copa Hades.
- id: 7519
  text: El trofeu de la Copa Hèrcules.
- id: 7520
  text: El trofeu de la Copa Pegàs.
- id: 7521
  text: L'escut de la Copa Fil.
- id: 7523
  text: >-
    Només hi ha una norma:

    joc net!
- id: 7651
  text: >-
    El Coliseu era tan bonic.

    I mira'l ara...{:clear }L'Hades tenia raó.

    No tinc fusta d'heroi...
- id: 7652
  text: >-
    Es necessita alguna cosa més que

    força bruta per ser un heroi.{:clear }Un cor fort, per exemple.
- id: 7653
  text: >-
    El gran heroi sol tenir millor

    pinta amb un somriure triomfal!
- id: 7654
  text: >-
    [Renilla

    de felicitat]
- id: 8036
  text: >-
    Derrota els sensecor i ves cap a la sortida!

    No et molestis en atacar l'Hades ara!
- id: 8037
  text: La sendera és oberta! Endavant!
- id: 8038
  text: >-
    Protegeix la Megara i

    acaba amb els enemics!
- id: 8039
  text: >-
    Lluita al costat de l'Hèrcules i derrota

    el Pete abans que la cova s'esfondri!
- id: 8040
  text: Derrota tots els incorporis!
- id: 8041
  text: >-
    Derrota tots els incorporis!

    Si utilitzes les ordres de reacció

    amb {:icon dynamic-triangle}, la batalla serà més fàcil!
- id: 12076
  text: ※ₓₓₓₓₓₓₓₓₓₓₓₓₓ
- id: 12078
  text: >-
    Ha! L'Hèrcules ja deu

    demanar compassió!{:clear }Què? També has

    vingut a veure'l perdre?
- id: 12079
  text: >-
    {:unk13 00 01 40 01}{:unk08 02 00 06}Ajudes l'Hèrcules?

    {:chardelay 33 00}Encara no.

    {:chardelay 09 00}Per descomptat!
- id: 15586
  text: Benvinguts a la Copa Paradoxa d'Hades.
- id: 16140
  text: >-
    L'Hèrcules solia entrenar

    amb en Fil, no?{:clear }No crec que ningú

    neixi sent ja un heroi.
- id: 16141
  text: >-
    Hem de trencar aquelles coses

    ràpidament i recollir-ne les esferes.{:clear }Em sembla que hauríem d'apuntar

    a les que estan apilades.
- id: 16142
  text: >-
    A través d'aquesta cova, arribareu

    a la sala on és l'Hades.{:clear }A l'Inframon perds força.

    Compte amb les pedres que cauen.
- id: 16143
  text: >-
    La maledicció de l'Inframon

    consumeix les nostres forces.{:clear }També a vosaltres us haurà

    debilitat. No us n'oblideu.
- id: 16144
  text: >-
    M'encantaria anar a rescatar la

    Megara sense perdre temps...{:clear }Si us plau, Sora, ajuda-la

    fins que acabi amb l'Hidra!
- id: 16145
  text: >-
    L'Auron és realment poderós. Potser

    ho negui, però deu ser un heroi.
- id: 16146
  text: >-
    Hem de mantenir la nostra promesa a

    la Megara, tot i que l'Hades ens ignori.{:clear }{:theme 0A}Hauríem d'anar-nos-en{:reset}.

    Ja pensarem en alguna cosa.
- id: 16147
  text: >-
    Ha arribat l'hora de la veritat.

    Si n'apareix un de gros, que no escapi.
- id: 16148
  text: Derrota tots els sensecor!
- id: 16149
  text: >-
    Derrota tots els sensecor!

    Si utilitzes les ordres de reacció

    amb {:icon dynamic-triangle}, la batalla serà més fàcil!
- id: 16150
  text: Derrota tots els sensecor!
- id: 16151
  text: >-
    Derrota tots els sensecor!

    Si utilitzes les ordres de reacció

    amb {:icon dynamic-triangle}, la batalla serà més fàcil!
- id: 16162
  text: >-
    Estic esgotat. No crec que

    pugui guanyar el torneig...
- id: 16163
  text: >-
    Ha anat de poc. Tu i els teus

    amics m'heu salvat, Sora.
- id: 16164
  text: >-
    Aquell és el tal Auron que

    vosaltres coneixeu, no?{:clear }Què estrany! No semblava

    que us reconegués...
- id: 16165
  text: >-
    En aquell estat, l'Hèrcules

    mai guanyarà el combat.{:clear }Podeu ajudar-lo? Si us plau.
- id: 16166
  text: >-
    Mai he vist l'Hèrcules

    tan decaigut.{:clear }Se sent responsable pel

    que va passar a l'Olimp.
- id: 16167
  text: >-
    A on aneu tan de pressa?

    Ja heu parlat amb {:theme 0A}l'Auron{:reset}?
- id: 16168
  text: >-
    Aquell tipus ha entrat a la {:theme 0A}Cova

    dels Morts{:reset}. Serà amic de l'Hades?
- id: 16169
  text: >-
    Aquell tipus tenia els ulls vidriosos,

    com si només pensés a lluitar.{:clear }L'Hèrcules haura d'enfrontar-s'hi

    en el combat final?
- id: 16170
  text: >-
    En aquell estat, l'Hèrcules no

    us farà guanyar gaire temps.{:clear }Si us plau, aneu a la {:theme 0A}cambra

    de l'Hades{:reset} i recupereu el ninot!
- id: 16171
  text: >-
    En aquest indret, hi tenen

    lloc tota classe de tornejos.{:clear }Si vols participar-hi,

    només has de parlar amb el Pànic.
- id: 16172
  text: >-
    Si voleu entrar a la Copa Hades,

    consulteu-ne abans la classificació.{:clear }Si després d'allò us veieu amb

    cor de participar, us apuntaré.
- id: 16175
  text: >-
    Aquí podeu apuntar-vos per a la Copa

    Hades. Si us agrada el dolor, endavant!
- id: 16176
  text: >-
    {:unk13 00 01 40 01}{:unk08 02 00 06}Participes a la Copa Hades?

    {:chardelay 33 00}Eh, no gràcies.

    {:chardelay 09 00}Sí, m'hi apunto!
- id: 16177
  text: >-
    Ara arriben les semifinals.

    Procura no perdre massa ràpid.
- id: 16178
  text: >-
    {:unk13 00 01 40 01}{:unk08 02 00 06}Continues a les semifinals?

    {:chardelay 33 00}Encara no hi estic a punt.

    {:chardelay 09 00}Som-hi!
- id: 16179
  text: >-
    Si l'Hèrcules perd, la nostra

    feina serà molt més fàcil.{:clear }Però si guanya...

    No, això no passarà...
- id: 16442
  text: >-
    L'Hèrcules no està molt bé.

    Potser l'hem d'ajudar.{:clear }Si estàs nerviós, podem entrar en

    calor en els tornejos de l'Infernòdrom.
- id: 16475
  text: >-
    Qui deu haver trencat el

    segell de l'Inframon?{:clear }L'únic que se'n beneficia

    és l'Hades.
- id: 16476
  text: >-
    La Copa Hades es juga per equips,

    així que unim-nos a l'Hèrcules.{:clear }A l'Inframon, es disputen,

    a més a més, altres tornejos.{:clear }Si tenim temps, hauríem

    de provar-los també.
- id: 16477
  text: >-
    Encara que estigui deprimit, és bo

    tenir l'Hèrcules al nostre costat.{:clear }Confio que reaccionarà

    quan el necessitem.
- id: 16575
  text: >-
    Eh!

    Aquella roca s'assembla a la Megara!{:clear }Segur que allà és

    on la tenen captiva!
- id: 16576
  text: >-
    Tot gràcies a la clau espasa!{:clear }La Megara deu ser per allà.

    Som-hi!
- id: 16577
  text: >-
    La Pedra de l'Olimp ha eliminat

    la maledicció de l'Inframon.{:clear }Sento com tornen les meves forces,

    com si em traguessin un pes de sobre.
- id: 16578
  text: >-
    Segur que la Megara no és

    l'única que ens està esperant.{:clear }Ves amb molt de compte,

    Sora.
- id: 16579
  text: >-
    [Renilla per a que torneu al

    Coliseu]
- id: 16580
  text: >-
    Si lluiteu contra un enemic gros,

    busqueu el seu punt dèbil.{:clear }Dos consells: manteniu la calma,

    manteniu-vos alerta i moveu-vos!
- id: 16581
  text: >-
    Sora, hi ha problemes al Coliseu!{:clear }Ves-hi! Nosaltres

    farem el que puguem.
- id: 16984
  text: El trofeu de la Copa Tità.
- id: 16985
  text: El trofeu de la Copa Cèrber.
- id: 16986
  text: El trofeu de la Copa Pena i Pànic.
- id: 16987
  text: El trofeu de la Copa Deessa del Destí.
- id: 16988
  text: El trofeu de la Copa Paradoxa d'Hades.
- id: 16989
  text: >-
    La Copa Hades mostrarà qui és un

    veritable heroi! Qui guanyarà?
- id: 16990
  text: Les flames impedeixen el pas.
- id: 16991
  text: Prohibida l'entrada.
- id: 17094
  text: >-
    Per aquí entren al Coliseu

    els contendents.
- id: 17241
  text: ''
- id: 17242
  text: ''
- id: 17243
  text: ''
- id: 17585
  text: >-
    El llum s'ha apagat.

    Ja no hi pots entrar.
- id: 17711
  text: >-
    Vaja, vaja, què fa aquí

    l'escollit de la clau espasa?{:clear }No hauries d'ajudar

    aquell covard «campió»?
- id: 17842
  text: "{:unk13 BE 00 4C 00}{:unk06 00}{:unk08 01 01 05}Què t'ha semblat això?"
- id: 17843
  text: >-
    {:unk13 49 01 48 00}{:unk06 00}{:unk08 01 00 06}Això no s'ha acabat, xicot!

    Teniu molt a entrenar encara.{:clear }Ja us relaxareu quan hagueu

    conclòs el vostre entrenament.
- id: 17844
  text: '{:unk13 BE 00 4C 00}{:unk06 00}{:unk08 01 01 05}Cap problema!'
- id: 18108
  text: Puja a l'esquena de l'Hidra!
- id: 18109
  text: Ataca l'Hades amb Aurasfera!
- id: 18739
  text: >-
    Venç l'Hidra!

    Lluita al costat dels teus amics!
- id: 18740
  text: Lluita al costat de l'Hèrcules per vèncer l'Hades!
- id: 18767
  text: >-
    Derrota el Cèrber!

    Si utilitzes les ordres de reacció

    amb {:icon dynamic-triangle}, la batalla serà més fàcil!
- id: 18768
  text: >-
    Derrota les creacions d'en Demyx

    abans que s'acabii el temps!
- id: 18771
  text: >-
    {:unk13 1C 01 7A 00}{:unk06 00}{:unk08 01 01 05}Si voleu participar en un torneig,

    només us cal dir-m'ho.
- id: 18772
  text: >-
    {:unk13 C7 00 7C 00}{:unk06 00}{:unk08 01 01 05}Sa Majestat Perniciosa avui

    està bondadosa, així que no us

    preocupeu per morir i això.{:clear }És el vostre dia de sort!
- id: 18773
  text: >-
    {:unk13 BF 00 82 00}{:unk06 00}{:unk08 01 01 05}Jo m'ocupo de les inscripcions

    per a la Copa Hades. El

    Pena no hi té res a veure!
- id: 18993
  text: >-
    {:unk13 15 01 8C 00}{:unk06 00}{:unk08 01 01 05}I si triomfeu, obtindreu un

    munt de premis fabulosos!
- id: 19009
  text: >-
    {:unk13 A3 00 8C 00}{:unk06 00}{:unk08 01 01 05}Hi ha un munt de tornejos,

    així que estigueu-hi pendents.
- id: 19010
  text: >-
    {:unk13 5E 01 7C 00}{:unk06 00}{:unk08 01 00 05}Sí, és una bona manera

    de passar el temps.
- id: 19303
  text: Mode de puntuació doble!
- id: 19356
  text: >-
    Aquí pots apuntar-te als tornejos.

    Hi pots participar les vegades que vulguis.
- id: 19357
  text: >-
    Quan l'Auron estigui en el seu seny,

    l'Hades ens les pagarà!{:clear }Però si volem encarregar-nos-en,

    necessitarem l'ajuda de l'Hèrcules.
- id: 19358
  text: >-
    Si li donem el ninot, l'Auron

    hauria de posar-se a la raó.{:clear }Parlem amb el tipus lila

    i tornem a l'Infernòdrom!
- id: 19392
  text: Derrota els enemics abans que s'acabi el temps!
- id: 19393
  text: Lluita en la foscor i venç tots els enemics!
- id: 19394
  text: Venç els teus enemics abans de quedar-te sense punts!
- id: 19395
  text: S'ha de sobreviure fins que el temps s'acabi!
- id: 19409
  text: Arriba a la ronda 30 amb les normes de la Copa Pena i Pànic!
- id: 19410
  text: Arriba a la ronda 20 amb les normes de la Copa Tità!
- id: 19411
  text: Arriba a la ronda 40 amb les normes de la Copa Cèrber!
- id: 19412
  text: >-
    Oblida't dels enemics menors.

    Encarrega't del líder!
- id: 19413
  text: >-
    No pots utilitzar l'indicador de Fusió,

    però els Límits consumeixen menys PM!
- id: 19414
  text: >-
    Pots utilitzar les Formes, i l'indicador

    de Fusió s'omple més ràpidament!

    Per guanyar el torneig, derrota tots

    els enemics abans que s'acabi el temps!
- id: 19415
  text: >-
    L'ordre Fusió no està disponible.

    Estàs sol, però pots utilitzar Invocar!

    Quan pateixes mal, perds punts.

    Si els perds tots, el joc s'acaba!
- id: 19422
  text: >-
    En aquest torneig

    no hi ha normes!

    Dona-ho tot!
- id: 19423
  text: >-
    No pots utilitzar l'indicador de Fusió,

    però els Límits consumeixen menys PM!

    Arriba a la ronda 30 amb aquestes normes!
- id: 19424
  text: >-
    Estàs sol, però pots utilitzar Formes, i

    l'indicador de Fusió s'omple en un no res!

    Arriba a la ronda 40 amb aquestes normes!
- id: 19425
  text: >-
    Estàs sol. No pots utilitzar Fusió, però

    sí Invocar. Quan pateixes mal, perds

    punts. Si s'exhaureixen, s'ha acabat.

    Arriba a la ronda 20!
- id: 19430
  text: >-
    En aquest torneig

    no hi ha normes!

    Dona-ho tot!
- id: 19468
  text: '{:scale 13}Des de la ronda'
- id: 19479
  text: N'estàs segur?
- id: 19549
  text: En Sora està sol!
- id: 19550
  text: En Sora està sol!
- id: 19559
  text: Lluita al costat dels teus amics i derrota tots els enemics!
- id: 19594
  text: >-
    En aquest torneig no hi ha normes!

    Dona-ho tot!

    Oblida't dels enemics menors.

    Encarrega't del líder!
- id: 19595
  text: >-
    En aquest torneig no hi ha normes!

    Dona-ho tot!

    Oblida't dels enemics menors.

    Encarrega't del líder!
- id: 19596
  text: Heu de sobreviure fins que el temps s'acabi!
- id: 19628
  text: Bé... Millor us deixo sols...
- id: 19751
  text: Coliseu de l'Olimp
- id: 19865
  text: Ens veiem!
- id: 19866
  text: Ho hem aconseguit!
- id: 19872
  text: Sora, espera!
- id: 19874
  text: A l'atac!
- id: 19884
  text: Hèrcules! Hèrcules!
- id: 19885
  text: Gràcies! Espero que n'hagueu gaudit!
- id: 20166
  text: >-
    Sembla un vell llibre

    titulat «Essències intangibles».
- id: 20167
  text: >-
    {:unk08 02 00 06}Una Essència intangible, una

    entitat fosca lligada a una arma.

    {:chardelay 33 00}Millor no arriscar-s'hi.

    {:chardelay A1 00}Fem-hi un cop d'ull!
- id: 20604
  text: Prem {:icon dynamic-triangle} per començar el duel! Desfes-te ràpidament dels enemics que apareguin!
- id: 21392
  text: '{:unk13 AA 00 D2 00}{:unk06 00}{:unk08 01 00 06}Què és aquest llibre?'
- id: 21393
  text: >-
    {:unk13 F0 00 5E 01}{:unk06 00}{:unk08 01 00 02}A la coberta hi posa...

    «Essències intangibles».
- id: 21394
  text: >-
    {:unk13 68 01 68 01}{:unk06 00}{:unk08 01 00 02}Estàs segur que ho vols tocar?{:clear }Això és l'Inframon,

    qui sap què pot ser...
- id: 21395
  text: >-
    {:unk13 E6 00 5E 01}{:unk06 00}{:unk08 01 00 02}Tens raó.

    Podria ser una trampa!
- id: 21396
  text: '{:unk13 A0 00 5A 00}{:unk06 00}{:unk08 01 00 06}Uh?'
- id: 21397
  text: '{:unk13 40 01 AA 00}{:unk06 02}{:unk08 03 00 06}Tu de nou!?'
- id: 21398
  text: >-
    {:unk13 54 01 3C 00}{:unk06 00}{:unk08 01 00 05}Ohhh, no siguis així, i més ara

    que soc aquí per parlar-vos.{:clear }d'una cosa encara millor

    que la Pedra de l'Olimp.
- id: 21399
  text: >-
    {:unk13 72 01 41 00}{:unk06 00}{:unk08 01 00 05}La presència tenebrosa 

    d'una existència ja extinta...{:clear }Una Essència intangible.
- id: 21400
  text: >-
    {:unk13 68 01 78 00}{:unk06 00}{:unk08 01 01 06}Essència intangible?

    Parles d'aquell llibre?
- id: 21401
  text: '{:unk13 A0 00 78 00}{:unk06 00}{:unk08 01 00 05}No només del llibre.'
- id: 21402
  text: >-
    {:unk13 AA 00 73 00}{:unk06 00}{:unk08 01 00 05}Son entitats fosques lligades

    a l'arma que un dia empunyaren.
- id: 21403
  text: >-
    {:unk13 8C 00 8C 00}{:unk06 00}{:unk08 01 01 05}Enfrontar-t'hi potser

    t'ajuda a veure més enllà...{:clear }Potser així el teu veritable

    tu obre finalment els ulls.
- id: 21404
  text: >-
    {:unk13 A0 00 32 00}{:unk06 00}{:unk08 01 01 06}Per què em deixes

    anar tot aquest rotllo?
- id: 21405
  text: >-
    {:unk13 82 00 8C 00}{:unk06 00}{:unk08 01 01 05}Tu ets l'escollit.

    Esbrina-ho tu mateix.
- id: 21406
  text: >-
    {:unk13 0E 01 37 00}{:unk06 00}{:unk08 01 00 06}Però què és allò?

    Una Essència intangible.
- id: 21407
  text: >-
    {:unk13 7C 01 C3 00}{:unk06 02}{:unk08 03 01 05}No hi ha temps per a allò!

    Hem de rescatar la Megara!
- id: 21408
  text: '{:unk13 AA 00 41 00}{:unk06 02}{:unk08 03 01 06}És veritat!'
- id: 21499
  text: "{:delayandfade 07 78} \nLa Megara estava molt preocupada per\nl'Hèrcules, perquè semblava fatigat\namb tanta lluita, i per això va decidir\nvisitar l'Hades i demanar-li que li\ndonés un respir a l'heroi.\n \nLa Megara sola a l'Inframon?\nAixò sí que és preocupant!,\npensa en Sora, raó per què\ns'ofereix a anar-hi en el seu lloc.\n \n"
- id: 21500
  text: "{:delayandfade 0A 78} \nDesprés d'acomiadar-se de l'Auron,\nen Sora i els seus decideixen tornar\namb la Meg per recomposar files.\n \nNo obstant, els sinistres\nplans de l'Hades ja estan en\nmarxa.\n \n \n \n"
- id: 21501
  text: "{:delayandfade 07 78} \nEn Sora vol esbrinar més de\nla maledicció de l'Inframon i\nl'Hèrcules sembla saber d'una cosa\nque podria anul・lar-ne els seus efectes:\nla Pedra de l'Olimp.\n \nPerò no és la maledicció l'únic\nque preocupa, puix l'Hades és un\ndur rival contra qui només en Fil\npodria preparar el grup.\n"
- id: 21502
  text: "{:delayandfade 0A 78} \nEn Fil acull amb una gran riallada\nla petició d'en Sora i decideix sense\ndubtar-ne entrenar el grup.\n \n \n \n \n \n"
- id: 21503
  text: "{:delayandfade 07 78} \nUna vegada acabat l'entrenament,\nl'Hèrcules sobreprèn a tots amb\nuna terrible notícia: un encaputxat\nha robat la Pedra de l'Olimp.\n \nEn Sora i els seus amics no poden\nquedar-se amb els braços creuats\ni surten rabents a buscar del\nmalefactor.\n \n"
- id: 21504
  text: "{:delayandfade 08 78} \nDe camí a l'Inframon, els amics\nes troben el Fil, que jeia a\nterra després d'haver-hi cagut\nderrotat de mans d'un encaputxat.\n \nLes coses han empitjorat\ni ara tot depèn de l'escollit\nde la clau espasa.\n \n"
- id: 21505
  text: "{:delayandfade 0A 78} \nL'Hades no deixa escapar l'ocasió\nper anunciar a en Sora i els seus\nel nefast futur que es cerneix\nsobre l'Olimp.\n \nQuè voldrà dir realment\nel díscol déu?\n \n \n"
- id: 21506
  text: "{:delayandfade 07 78} \nL'Olimp sembla més animat\nque de costum, tot gràcies\na la reobertura de l'Infernòdrom,\nun born on es disputen\ncombats contra bèsties.\n \nAmb monstres de per mig,\nen Sora sap que l'Hèrcules podria\nestar en un embolic, així que\ns'afanya a buscar l'heroi.\n"
- id: 21507
  text: "{:delayandfade 07 B4} \nEls tres amics al costat de l'Hèrcules\ns'inscriuen a la Copa Hades i batallen amb\ntenacitat fins a fer-se un lloc a les finals.\n \n \n \n \n \n \n \n"
- id: 21508
  text: "{:delayandfade 0A 78} \nL'Auron apareix repentinament,\ntot i que no actua com sempre,\ncosa que queda clara quan apunta\nla seva espasa cap a l'Hèrcules.\n \nQuè haurà provocat tal reacció\nen l'enigmàtic guerrer?\n \n \n"
