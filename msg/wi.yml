- id: 5517
  text: >-
    Acabo de veure passar el Pete, i

    després l'altre Pete perseguint-lo!{:clear }Què passa aquí!?
- id: 5518
  text: >-
    Trobaràs el Pete al {:theme 0A}moll{:reset}.{:clear }Si no és allà, segur que ha sortit amb

    el seu vaixell. És el seu gran orgull!
- id: 5519
  text: >-
    Què és això? Sembla una finestra,

    però té una estranya marca...{:clear }M'agradaria fer-hi un cop d'ull,

    tot i que fa una mica de por.
- id: 5520
  text: >-
    Ai, em fa mal el cap...

    Per què m'heu atacat així?{:clear }Si n'esteu penedits, afanyeu-vos i

    atrapeu el tipus que ha robat el meu vaixell!
- id: 5521
  text: >-
    Hi ha un quarto a l'altre costat

    d'aquella finestra, i això no és tot.{:clear }Estan llençant fora els mobles.

    Aviat només serà un quarto buit.
- id: 5522
  text: Mireu! La Pedra Angular és allà!
- id: 5523
  text: >-
    Què passa?

    Tot és en blanc i negre.
- id: 5524
  text: >-
    Eh, això sembla com...

    Ah... Mm... Ehhh...
- id: 5525
  text: Déjà vu?
- id: 5526
  text: Sí, exacte!
- id: 5527
  text: Sí? Havíeu estat aquí abans?
- id: 5528
  text: >-
    Ei, vosaltres! Heu vist

    algú amb pinta de dolent?
- id: 5529
  text: Com que jo!
- id: 5530
  text: >-
    Bah! No tinc temps per

    bregar amb aixafaterrossos,{:delay C6 00}{:clear }així que passaré de vosaltres.
- id: 5531
  text: Heus aquí el nostre dolent.
- id: 5532
  text: >-
    Què us passa, escarransits?

    Teniu res en contra meu?
- id: 5533
  text: I tant que sí!
- id: 5534
  text: Veig que busqueu brega!
- id: 5535
  text: Oh!
- id: 5536
  text: No tan ràpid!
- id: 5537
  text: Això!
- id: 5538
  text: Però què teniu en contra meu?
- id: 5539
  text: Qui sou? Sou nous per aquí?
- id: 5540
  text: Deixa't estar de rotllos!
- id: 5541
  text: Carai!
- id: 5542
  text: Ai, ai, ai!
- id: 5543
  text: >-
    Ei, aquí hi ha alguna cosa

    que no encaixa molt bé.{:delay 06 01}{:clear }Segur que ell és el Pete?
- id: 5544
  text: >-
    Doncs és clar que soc el Pete.

    El capità del vaixell de vapor.{:delay E4 00}{:clear }Així que pareu de molestar-me!
- id: 5545
  text: Fumeu el camp!
- id: 5546
  text: Carai! Potser hi hem ficat la pota.
- id: 5547
  text: >-
    Començo a pensar el mateix.{:delay B0 00}{:clear }Ni tant sols ha cridat

    els sensecor.
- id: 5548
  text: >-
    Perdoni que l'haguem

    atacat així, capità Pete.
- id: 5549
  text: >-
    Ah si? Bé, si ho sentiu de debò,

    aneu i porteu-me mon vaixell.
- id: 5550
  text: Sí, senyor!
- id: 5551
  text: Uuhh... Ma esquena!
- id: 5552
  text: >-
    {:unk13 6F 01 72 00}{:unk06 00}{:unk08 01 00 06}Estava segur que

    el Pete era el dolent.
- id: 5553
  text: >-
    {:unk13 76 00 14 01}{:unk06 00}{:unk08 01 01 07}Ah, allò seria

    massa simple.
- id: 5554
  text: >-
    {:unk13 D8 00 69 00}{:unk06 00}{:unk08 01 00 05}Va, nois. Busquem

    aquell vaixell de vapor.
- id: 5555
  text: >-
    {:unk13 82 01 7C 00}{:unk06 00}{:unk08 01 00 06}Bé, hem dit que

    ho faríem, però...
- id: 5556
  text: >-
    {:unk13 7A 00 F6 00}{:unk06 00}{:unk08 01 01 05}Ei! Tenim una

    porta a trobar!
- id: 5557
  text: '{:unk13 8F 01 90 00}{:unk06 00}{:unk08 01 00 05}Ai, sí!'
- id: 5558
  text: '{:unk13 AF 00 C8 00}{:unk06 00}{:unk08 01 01 06}No veig cap porta.'
- id: 5559
  text: '{:unk13 51 01 7D 00}{:unk06 00}{:unk08 01 01 05}Eh? Què és allò?'
- id: 5560
  text: '{:unk13 6A 01 9E 00}{:unk06 00}{:unk08 01 01 04}No veig res de res...'
- id: 5561
  text: Mireu! La Pedra Angular és allà!
- id: 5562
  text: >-
    Què passa?

    Tot és en blanc i negre.
- id: 5563
  text: >-
    Eh, això sembla com...

    Ah... Mm... Ehhh...
- id: 5564
  text: Déjà vu?
- id: 5565
  text: Sí, exacte!
- id: 5566
  text: Sí? Havíeu estat aquí abans?
- id: 5567
  text: '{:unk13 E1 00 C2 00}{:unk06 00}{:unk08 01 01 05}Què ha sigut això?'
- id: 5568
  text: >-
    {:unk13 8E 01 82 00}{:unk06 00}{:unk08 01 01 05}Els sensecor

    en surten...
- id: 5569
  text: '{:unk13 18 01 F5 00}{:unk06 00}{:unk08 01 01 07}... i nosaltres hi entrem.'
- id: 5570
  text: '{:unk13 31 01 A5 00}{:unk06 00}{:unk08 01 01 05}I això què vol dir?'
- id: 5571
  text: '{:unk13 B3 01 85 00}{:unk06 00}{:unk08 01 00 05}Eh?'
- id: 5572
  text: '{:unk13 3B 01 40 00}{:unk06 00}{:unk08 01 01 06}Desfem-nos-en!'
- id: 5573
  text: '{:unk13 9D 00 6D 00}{:unk06 00}{:unk08 01 01 06}I aleshores, què farem?'
- id: 5574
  text: '{:unk13 4A 01 43 00}{:unk06 00}{:unk08 01 01 06}Ja hi pensarem després!'
- id: 5575
  text: El rei!
- id: 5576
  text: Vaja! Sembla una mica canviat, no?...
- id: 5577
  text: Va! Hem d'ajudar-lo!
- id: 5578
  text: Necessita la nostra ajuda!
- id: 5579
  text: Uufff!
- id: 5580
  text: Eh?
- id: 5581
  text: Foc!
- id: 5582
  text: El rei!
- id: 5583
  text: Vaja! Sembla una mica canviat, no?...
- id: 5584
  text: Va! Hem d'ajudar-lo!
- id: 5585
  text: Foc!
- id: 5586
  text: Necessita la nostra ajuda!
- id: 5587
  text: Majestat!
- id: 5588
  text: Un problema menys!
- id: 5589
  text: Ei!
- id: 5590
  text: ''
- id: 5591
  text: La ciutat s'ha encongit!
- id: 5592
  text: O potser nosaltres hem crescut.
- id: 5593
  text: >-
    Ei! Mireu quins canonets

    de joguina!
- id: 5594
  text: Ouch!
- id: 5595
  text: El rei!
- id: 5596
  text: Vaja! Sembla una mica canviat, no?...
- id: 5597
  text: Què creieu que intenta dir-nos?
- id: 5598
  text: Ei! Són els sensecor!
- id: 5599
  text: ''
- id: 5600
  text: La ciutat ha encongit!
- id: 5601
  text: O potser nosaltres hem crescut.
- id: 5602
  text: >-
    Ei! Mireu quins canonets

    de joguina!
- id: 5603
  text: Ouch!
- id: 5604
  text: Què diu?
- id: 5605
  text: Ei! Són els sensecor!
- id: 5606
  text: Nano, quina cosa més rara!
- id: 5607
  text: Mira, Sora! Allà!
- id: 5608
  text: Què estan construint?
- id: 5609
  text: ''
- id: 5610
  text: Compte!
- id: 5611
  text: Sensecor! Ho sabia!
- id: 5612
  text: El rei!
- id: 5613
  text: Vaja! Sembla una mica canviat, no?...
- id: 5614
  text: Ens heu salvat!
- id: 5615
  text: I ara, pels sensecor!
- id: 5616
  text: Què estan construint?
- id: 5617
  text: ''
- id: 5618
  text: Compte!
- id: 5619
  text: Sensecor! Ho sabia!
- id: 5620
  text: Gràcies, Majestat!
- id: 5621
  text: I ara, pels sensecor!
- id: 5622
  text: Què us ha semblat això!?
- id: 5623
  text: Ei, mireu!
- id: 5624
  text: Ets un idiota!{:delay 8B 00}{:clear }No n'encertes ni una!
- id: 5625
  text: >-
    I a més a més... has tingut

    la ridícula idea que podies{:delay F9 00}{:clear }ocupar el meu lloc en la meva absència.
- id: 5626
  text: >-
    Per ara, estàs acabat.{:delay AE 00}{:clear }Recorda les meves paraules,{:delay 47 00}{:clear }no hi haurà lloc per a tu quan

    aconseguim la victòria!
- id: 5627
  text: Maleït inútil.
- id: 5628
  text: Pe... però jo...
- id: 5629
  text: >-
    Per l'amor de Déu!

    No calia dir tot allò.
- id: 5630
  text: >-
    Que sí, que l'he feta

    bona de tant en tant.{:delay B5 00}{:clear }però alguna cosa bé hauré fet.
- id: 5631
  text: Recordo que fa ja molts anys...
- id: 5632
  text: >-
    Ah... Com trobo a

    faltar aquells temps!{:delay C5 00}{:clear }El que donaria per tornar enrere...
- id: 5633
  text: El que donaria jo...
- id: 5634
  text: '{:delay 78 00}{:clear }Eh?'
- id: 5635
  text: ''
- id: 5636
  text: Fascinant...{:delay 8B 00}{:clear }Això sembla un portal al passat!
- id: 5637
  text: Sí! Ha estat la cosa més estranya!
- id: 5638
  text: >-
    Para de contemplar-lo!{:delay 94 00}{:clear }{:delay 14 00}{:clear }I comença a pensar en

    la manera d'utilitzar-lo!
- id: 5639
  text: D'acord...
- id: 5640
  text: >-
    Pot ser que consideri donar-te

    una oportunitat per redimir-te.
- id: 5641
  text: >-
    Oh, gràcies!

    Pots comptar amb mi!{:delay C7 00}{:clear }Però... què faig?
- id: 5642
  text: Paciència, estimat...
- id: 5643
  text: >-
    Què tenim aquí? Vaja, però

    si és la Pedra Angular de Llum...
- id: 5644
  text: >-
    Mmm... Aconseguirem arrabassar

    el castell a aquells necis{:delay FC 00}{:clear }si actuem amb cautela.
- id: 5645
  text: Escolta'm bé.
- id: 5646
  text: >-
    A l'altre costat d'aquest portal,{:delay 78 00}{:clear }començaran en breus la remodelació

    d'aquell miserable castell.
- id: 5647
  text: >-
    Mentrestant, la seva preada Pedra

    Angular de Llum es troba desprotegida,{:delay 66 01}{:clear }albergant encara tot el seu poder.
- id: 5648
  text: La Pedra Angular... de Llum?
- id: 5649
  text: >-
    Sí! És aquella maleïda esfera la

    que ens impedeix entrar al castell.
- id: 5650
  text: Oohh...
- id: 5651
  text: Ho vas entenent?
- id: 5652
  text: Ehhh...
- id: 5653
  text: >-
    Doncs ves-te'n. És l'hora de demostrar

    la teva vàlua! I no em fallis un altre cop!
- id: 5654
  text: Que no torni a fallar, diu...
- id: 5655
  text: Ja ho sé!{:delay 3C 00}{:clear }Faré miques aquella Pedra Angular!
- id: 5656
  text: >-
    Però abans...

    haig de recuperar el meu vell vaixell.
- id: 5657
  text: '{:unk13 A0 01 52 00}{:unk06 00}{:unk08 01 00 05}Què era allò?'
- id: 5658
  text: >-
    {:unk13 D4 00 5B 00}{:unk06 00}{:unk08 01 01 05}Algú tenia

    un bon enuig.
- id: 5659
  text: '{:unk13 7B 00 C1 00}{:unk06 00}{:unk08 01 01 05}No entenc res.'
- id: 5660
  text: >-
    {:unk13 49 01 63 00}{:unk06 00}{:unk08 01 00 07}Ocupem-nos primer

    dels sensecor.{:clear }Aquest lloc és net, però en

    queden tres per revisar.
- id: 5661
  text: '{:unk13 67 00 6D 00}{:unk06 00}{:unk08 01 01 05}Una porta?'
- id: 5662
  text: '{:unk13 02 01 26 01}{:unk06 00}{:unk08 01 00 05}Em resulta familiar...'
- id: 5663
  text: >-
    {:unk13 63 01 59 00}{:unk06 00}{:unk08 01 01 05}Sí, és el portal que

    el Merlí va crear!
- id: 5664
  text: >-
    {:unk13 97 00 52 00}{:unk06 00}{:unk08 01 01 05}Llavors hauria de venir

    directe cap aquí, no?
- id: 5665
  text: '{:unk13 6A 01 67 00}{:unk06 00}{:unk08 01 01 05}Segur que sí! O això penso...'
- id: 5666
  text: "{:unk13 99 00 54 00}{:unk06 00}{:unk08 01 01 05}Fem-hi un cop d'ull!"
- id: 5667
  text: '{:unk13 E5 00 E5 00}{:unk06 02}{:unk08 03 01 06}Malèfica!'
- id: 5668
  text: '{:unk13 42 01 45 00}{:unk06 00}{:unk08 01 01 05}Ho deu haver sabut sempre!'
- id: 5669
  text: >-
    {:unk13 D0 00 60 00}{:unk06 00}{:unk08 01 00 05}Vejam... si aquella porta està

    connectada al passat...
- id: 5670
  text: >-
    {:unk13 24 01 DC 00}{:unk06 01}{:unk08 01 01 05}No, no, no!

    Dona aquí.
- id: 5671
  text: '{:unk13 4B 01 3F 00}{:unk06 00}{:unk08 01 01 06}Eh?'
- id: 5672
  text: >-
    {:unk13 FA 00 5D 00}{:unk06 00}{:unk08 01 00 05}Llavors som

    al passat!
- id: 5673
  text: '{:unk13 5E 01 64 00}{:unk06 00}{:unk08 01 00 05}Què!?'
- id: 5674
  text: '{:unk13 1A 01 45 00}{:unk06 00}{:unk08 01 01 06}Vaja!'
- id: 5675
  text: >-
    {:unk13 F9 00 41 00}{:unk06 00}{:unk08 01 01 06}Si som

    al passat...
- id: 5676
  text: >-
    {:unk13 6E 01 D9 00}{:unk06 00}{:unk08 01 00 05}... podem canviar

    el futur!
- id: 5677
  text: >-
    {:unk13 CD 00 42 00}{:unk06 00}{:unk08 01 00 06}Un moment, nois!

    Recordeu el que ha dit el Merlí?{:clear }Que confiava en nosaltres.{:clear }I que havíem de

    resistir-ne la tentació!
- id: 5678
  text: '{:unk13 5E 01 64 00}{:unk06 00}{:unk08 01 00 05}'
- id: 5679
  text: '{:unk13 5E 01 64 00}{:unk06 00}{:unk08 01 00 05}'
- id: 5680
  text: '{:unk13 DE 00 5D 01}{:unk06 00}{:unk08 01 01 03}Ei, només feia broma.'
- id: 5681
  text: >-
    {:unk13 FF 00 69 00}{:unk06 00}{:unk08 01 01 05}A més, qui voldria

    canviar el futur?
- id: 5682
  text: '{:unk13 39 01 71 00}{:unk06 00}{:unk08 01 01 05}Bé... què fem?'
- id: 5683
  text: >-
    {:unk13 E8 00 48 00}{:unk06 00}{:unk08 01 00 05}Portes, vilans...

    Uff! Em fa mal el cap!
- id: 5684
  text: >-
    {:unk13 DC 00 1B 01}{:unk06 00}{:unk08 01 01 07}Com a mínim sabem

    que anem pel bon camí!
- id: 5685
  text: O sigui, que sí que era el Pete!
- id: 5686
  text: Ah! Ens ha enganyat!
- id: 5687
  text: Però hi ha alguna cosa que continua sense encaixar.
- id: 5688
  text: ''
- id: 5689
  text: >-
    El Pete que hem conegut aquí tenia una mica

    de mal geni, però no semblava un mal nano...
- id: 5690
  text: Mireu!
- id: 5691
  text: '{:delay BC 00}{:clear }El castell ja és nostre!'
- id: 5692
  text: Aquell és el Pete que coneixem!
- id: 5693
  text: És ell!
- id: 5694
  text: Oh, no!
- id: 5695
  text: La Pedra Angular no hi és!
- id: 5696
  text: Però això vol dir...
- id: 5697
  text: >-
    que la foscor s'apoderarà del

    castell! Hem d'afanyar-nos!
- id: 5698
  text: Ei, alto!
- id: 5699
  text: >-
    Ni de broma, maco!{:delay 71 00}{:clear }Mira per on he trobat l'aixafaterrossos

    que m'ha robat el vaixell!
- id: 5700
  text: Però si vas ser tu!
- id: 5701
  text: Exacte! Jo!{:delay 6B 00}{:clear }Bé, jo, jo no! Algú que se m'assembla!
- id: 5702
  text: Oh, quin embolic.
- id: 5703
  text: Espera!!!!
- id: 5704
  text: Calla!
- id: 5705
  text: >-
    El teu futur està en joc, amic,

    així que aparta i dona'm el vaixell!
- id: 5706
  text: La Pedra Angular!
- id: 5707
  text: Perseguim-lo!
- id: 5708
  text: Bé!
- id: 5709
  text: Me les pagareu!
- id: 5710
  text: És la Pedra Angular!
- id: 5711
  text: >-
    Donald, ja tornarem

    per ella més tard!
- id: 5712
  text: El Pete es dirigeix cap al portal!
- id: 5713
  text: ''
- id: 5714
  text: Ja! Continues sent un pagerol!
- id: 5715
  text: Lluita contra nosaltres!
- id: 5716
  text: ''
- id: 5717
  text: T'ho mereixes!
- id: 5718
  text: Hmph!
- id: 5719
  text: El portal!
- id: 5720
  text: I no tornis mai més!
- id: 5721
  text: Sora!
- id: 5722
  text: Sí, ho sé!
- id: 5723
  text: >-
    Pot dir-me algú què ha passat aquí?

    I qui carai era aquell fantotxe?
- id: 5724
  text: Com? Aquell fantotxe era...
- id: 5725
  text: Sora, és un secret!
- id: 5726
  text: Secret? Quin secret? Bah, és igual.{:delay CD 00}{:clear }Sento haver-vos ficat en tot aquest embolic.
- id: 5727
  text: Està bé, però no t'hi acostumis!
- id: 5728
  text: >-
    I per demostrar-vos el meu agraïment,{:delay 91 00}{:clear }us deixo pilotar mon vaixell de vapor.

    És la millor nau del riu!
- id: 5729
  text: >-
    Va, mon contramestre

    Mickey arriba tard.
- id: 5730
  text: ''
- id: 5731
  text: >-
    Suposo que el castell

    ja és fora de perill.
- id: 5732
  text: Hauríem de tornar.
- id: 5733
  text: >-
    Espereu!

    Ja que som al passat...
- id: 5734
