- id: 8097
  text: Derrota tots els sensecor i protegeix els mobles!
- id: 8098
  text: >-
    Derrota tots els sensecor

    i protegeix els mobles!

    Si utilitzes les ordres de reacció

    amb {:icon dynamic-triangle}, la batalla serà més fàcil!
- id: 8099
  text: Derrota tots els sensecor i evita que l'edifici es cremi!
- id: 8100
  text: >-
    Derrota tots els sensecor i

    evita que l'edifici es cremi!
- id: 8101
  text: Acaba amb tots els sensecor i protegeix la ciutat!
- id: 8102
  text: >-
    Derrota tots els sensecor

    i protegeix la ciutat!

    Pots utilitzar el canó!
- id: 8103
  text: Derrota els sensecor abans que caigui la bastimentada!
- id: 8104
  text: >-
    Derrota tots els sensecor

    abans que caigui la bastimentada!

    Si utilitzes les ordres de reacció

    amb {:icon dynamic-triangle}, la batalla serà més fàcil!
- id: 10376
  text: >-
    Haig de trobar el pocavergonya

    que m'ha robat el vaixell!
- id: 13138
  text: S'ha trencat el cable!
- id: 15223
  text: >-
    Aquell nano deu tenir coratge per

    haver robat així el meu vaixell...{:clear }És estrany. Em resultava

    bastant familiar...
- id: 16032
  text: Trenca la gàbia abans que el Pete escapi!
- id: 16033
  text: >-
    Trenca la gàbia abans que el Pete escapi

    i recupera'n la Pedra Angular de Llum!

    Si utilitzes les ordres de reacció

    amb {:icon dynamic-triangle}, la batalla serà més fàcil!
- id: 16839
  text: >-
    Sembla que al Pete li han robat

    el vaixell.{:clear }El que no entenc és per què

    algú faria una cosa així.
- id: 16840
  text: >-
    El Pete ha recuperat el seu vaixell!

    I ha tornat a ser el vell Pete.{:clear }Res és el mateix sense el

    so del xiulet del seu vapor.
- id: 16841
  text: >-
    Oh, no! Hi ha foc a l'altre costat

    d'aquella finestra! Hem d'apagar-lo!{:clear }Però com ho farem? N'hi haurà prou

    amb llençar aigua a la finestra?
- id: 16842
  text: >-
    Des d'aquest turó pots arribar al

    moll, a l'embarcador o al canal.{:clear }És un lloc genial per caminar. Siguis

    on siguis, sempre acabes aquí.
- id: 16843
  text: >-
    És genial que construeixin un castell,

    però trobaré a faltar aquest passeig.{:clear }Pot ser que els demani que facin un jardí

    per sortir-hi a caminar dins del castell.
- id: 16844
  text: >-
    Aquí és on es construirà

    el Castell Disney.{:clear }Ara només és un camp buit, però

    segur que serà un edifici enorme!
- id: 16845
  text: >-
    Acostumes a venir molt, no? Si penses

    comprar terrenys, ara és el moment.{:clear }Quan construeixin el castell, el

    preu de la terra es dispararà!
- id: 16846
  text: >-
    No podem deixar que el

    Pete escapi d'aquest món.{:clear }A més, alguna cosa estranya passa

    amb aquella Pedra Angular de Llum...
- id: 16847
  text: >-
    Hi ha una ciutat rere aquella finestra.

    Quina classe de truc és aquest?{:clear }Hi ha un canó enmig de la ciutat.

    Podem disparar tot el que vingui!
- id: 16848
  text: >-
    Jo també vull arribar al vaixell del

    Pete, però abans hi són els sensecor.
- id: 16852
  text: >-
    Acabo de veure el Pete perseguint-se

    a sí mateix una altra vegada!{:clear }Finestres misterioses, més d'un

    Pete... Què passa en aquest món!?
- id: 16853
  text: >-
    Estic cansada de mirar aquesta estranya

    finestra. Necessito un altre passatemps.{:clear }He vist el Pete còrrer cap al canal.

    Hi deu passar res?
- id: 16854
  text: >-
    El Pete ha passat corrent cap a l'{:theme 0A}embarcador{:reset}.{:clear }Mai he vist a ningú còrrer així.

    Deu entrenar per a una carrera?
- id: 16855
  text: >-
    Bé, a què ve tanta pressa?

    Se't veu esgotat.{:clear }Si no et prens un descans de tant

    en tant, pots acabar malament.
- id: 16992
  text: Brilla amb una llum radiant.
- id: 16993
  text: Aquí es construirà el Castell Disney.
- id: 16994
  text: '«Willy», el vaixell de vapor del Pete.'
- id: 18487
  text: >-
    Aquell era el Pete, no?{:clear }M'ho sembla o se'l veu

    una mica canviat?
- id: 18488
  text: >-
    Per aquella finestra, es veu una obra

    en construcció. És molt estrany!{:clear }A més sembla bastant inestable. Si

    es trenca aquella corda, s'ensorrarà!
- id: 18489
  text: >-
    Resolent els greuges de les

    finestres, sembla que podem veure-hi...{:clear }el que ha passat en el passat immediat.{:clear }Vejam què passa si els resolem

    tots.
- id: 18748
  text: Desfes-te del Pete!
- id: 18749
  text: >-
    Desfes-te del Pete!

    L'altre Pete t'ajudarà en la batalla!
- id: 19086
  text: La Pedra Angular ha desaparegut.
- id: 19087
  text: Taquilla de bitllets de vaixell.
- id: 19088
  text: Un petit port.
- id: 19089
  text: Està assegurada amb peces de metall.
- id: 19090
  text: >-
    Prohibida l'entrada

    a causa del foc.
- id: 19091
  text: >-
    Sembla que els van llençar

    fora a corre cuita.
- id: 19092
  text: >-
    Aquest és el cotxe de bombers

    que va entrar corrent a l'escena.
- id: 19093
  text: >-
    Ha de mantenir calent

    l'amo quan és a casa.
- id: 19094
  text: >-
    Està fermament assegurat,

    així que no es mourà.
- id: 19095
  text: >-
    Un preciós arbre de Nadal.

    Qui el deu haver decorat?
- id: 19758
  text: Riu Etern
- id: 19861
  text: >-
    Ei! Què feu!?

    Deixeu-me anar! Deixeu-me anar!
- id: 20610
  text: Prem {:icon dynamic-triangle} per començar el duel! Ataca fins que el comptador arribi a zero.
- id: 21365
  text: S'han de protegir els mobles!
- id: 21366
  text: I gairebé no queden mobles!
- id: 21367
  text: Protegeix l'edifici de les flames!
- id: 21368
  text: L'edifici no aguantarà molt més!
- id: 21369
  text: Estan atacant la ciutat! Atura'ls utilitzant Trepitjada!
- id: 21370
  text: La ciutat caurà!
- id: 21371
  text: S'ha trencat un cable! La bastimentada caurà!
- id: 21372
  text: Si es trenca un altre cable caura la bastimentada!
- id: 21373
  text: S'han trencat tots els cables...
- id: 21536
  text: "{:delayandfade 08 78} \nSegons el Merlí, en aquest estrany món\nhi hauria d'haver un altre portal com\nel del Castell Disney...\n \nNo obstant això, en lloc d'una porta,\nel que el Sora troba és una finestra...\non es veu el grup instants\nabans d'arribar al món en blanc i negre!\n \n"
- id: 21537
  text: "{:delayandfade 0A 78} \nI allà no s'acaba tot.\nDesprès d'allò, sorgeixen altres quatre finestres.\nDecidits a esbrinar-ne més, el Sora i els altres\nno dubten a endinsar-se'n en la primera.\n \n \n \n"
- id: 21538
  text: "{:delayandfade 0A 78} \nLa finestra mostra la Malèfica\ndonant una bona reprimenda\na algú, tot i que el blanc de\nles seves ires és un misteri.\n \nHauria de continuar apuntant\nla resta de finestres per poder\nesbrinar-ne més coses.\n \n \n"
- id: 21539
  text: "{:delayandfade 0A 78} \nLa finestra mostra un portal\nidèntic al que el Merlín va\nconjurar en el Castell de Disney.\n \nAmb el misteri a mig resoldre,\nel Sora i els seus amics no tenen més\nremei que continuar el seu periple\na través de les finestres.\n \n \n"
- id: 21540
  text: "{:delayandfade 08 78} \nEl portal connecta amb el passat!\n \nEl pla de Malèfica és modificar\nel passat per fer-se amb el\nCastell Disney.\n \nAmb les idees ja més clares,\nsembla ser que ha arribat el moment\nde veure què hi ha la quarta finestra.\n \n"
