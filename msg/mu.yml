- id: 4586
  text: La primera batalla
- id: 4587
  text: Atac sorpresa
- id: 4588
  text: L'emboscada
- id: 4589
  text: La recerca
- id: 4590
  text: La invasió
- id: 4591
  text: 〜 Campament 〜
- id: 4592
  text: >-
    L'indicador superior esquerre determina la

    teva supervivència! Si s'omple, hauràs fallat!

    Confio en tu!
- id: 4593
  text: Derrota els sensecor en el campament!
- id: 4594
  text: 〜 Post de control 〜
- id: 4595
  text: >-
    Han vist una estranya

    figura al post de control!

    Ves-hi ràpid i venç l'enemic!
- id: 4596
  text: >-
    Derrota els sensecor

    al post de control!
- id: 4597
  text: 〜 Post de control 〜
- id: 4598
  text: >-
    Una horda enemiga es

    dirigeix al post de control.

    Atura-la i estigues atent

    als enemics estranys!
- id: 4599
  text: >-
    Derrota els sensecor

    al post de control!
- id: 4600
  text: 〜 Campament 〜
- id: 4601
  text: >-
    Sembla que l'enemic ha

    envaït el campament.

    Derrota tots els enemics

    que trobis!
- id: 4602
  text: Derrota els sensecor ocults!
- id: 4603
  text: 〜 Sendera de muntanya 〜
- id: 4604
  text: >-
    En Ping i tu heu d'obrir-vos camí fins al final de la sendera de muntanya.

    Derroteu els enemics que hi trobeu i cobriu-vos les espatlles!
- id: 4605
  text: Ves fins al final de la sendera de muntanya!
- id: 4606
  text: Sí
- id: 4607
  text: No
- id: 4608
  text: Tria una missió.
- id: 4609
  text: Vols començar aquesta missió?
- id: 7657
  text: >-
    Està barrada des de dins.

    Ara no hi pots passar.
- id: 7757
  text: '{:unk13 01 01 64 00}{:unk08 01 00 05}Mira qui ha decidit aparèixer.'
- id: 7944
  text: Derrota tots els sensecor!
- id: 7945
  text: >-
    Derrota tots els sensecor!

    Lluita al costat d'en Ping!
- id: 7946
  text: Derrota tots els sensecor!{:theme 07}⭑{:reset}Que l'indicador d'ànim no es buidi!{:theme 07}⭑{:reset}
- id: 7947
  text: >
    Derrota tots els sensecor!

    L'indicador disminueix quan tusten

    en Ping. No deixis que es buidi!
- id: 7948
  text: Derrota tots els sensecor!{:theme 07}⭑{:reset}Que l'indicador d'ànim no es buidi!{:theme 07}⭑{:reset}
- id: 7949
  text: >-
    Derrota tots els sensecor!

    L'indicador d'ànim i el rellotge van

    units. Ambdós disminueixen alhora.
- id: 7950
  text: Derrota tots els sensecor!{:theme 07}⭑{:reset}Que l'indicador d'ànim no es buidi!{:theme 07}⭑{:reset}
- id: 7951
  text: >
    Derrota tots els sensecor!

    Els cops del sensecor gegant

    afecten l'ànim. Que no es buidi!
- id: 7952
  text: Derrota tots els enemics ocults!{:theme 07}⭑{:reset}Que l'indicador d'ànim no es buidi!{:theme 07}⭑{:reset}
- id: 7953
  text: >-
    Derrota tots els sensecor!

    L'indicador d'ànim i el rellotge van

    units. Ambdós disminueixen a la vegada.
- id: 7954
  text: De pressa! Al cim!{:theme 07}⭑{:reset}Que l'indicador d'ànim no es buidi!{:theme 07}⭑{:reset}
- id: 7955
  text: >-
    De pressa! Al cim!

    Que l'indicador d'ànim no es buidi!

    Què el farà disminuir?

    És una sorpresa!
- id: 7956
  text: La sendera és oberta! Endavant!
- id: 7957
  text: Derrota tots els sensecor!
- id: 7958
  text: >-
    Derrota tots els sensecor!

    Lluita al costat d'en Ping!
- id: 7959
  text: Derrota tots els sensecor!
- id: 7960
  text: >-
    Derrota tots els sensecor!

    Si manes ordres de reacció

    amb {:icon dynamic-triangle}, la batalla serà més fàcil!
- id: 7961
  text: Derrota tots els sensecor!
- id: 7962
  text: Derrota tots els sensecor!
- id: 7963
  text: Derrota el Shan Yu i protegeix les portes!
- id: 7964
  text: >-
    Derrota el Shan-Yu i protegeix les portes!

    Si manes ordres de reacció

    amb {:icon dynamic-triangle}, la batalla serà més fàcil!
- id: 7965
  text: Derrota l'home misteriós!
- id: 7966
  text: Derrota l'home misteriós!
- id: 7967
  text: Derrota tots els sensecor!
- id: 7968
  text: >-
    Derrota tots els sensecor!

    Si manes ordres de reacció

    amb {:icon dynamic-triangle}, la batalla serà més fàcil!
- id: 7969
  text: Derrota tots els incorporis!
- id: 7970
  text: >-
    Derrota tots els incorporis!

    Si manes ordres de reacció

    amb {:icon dynamic-triangle}, la batalla serà més fàcil!
- id: 7971
  text: '{:theme 07}ₓₓ{:reset}ₓ ₓₓₓₓₓₓₓₓ'
- id: 7972
  text: ₓₓₓₓₓₓₓₓₓₓₓₓ
- id: 8042
  text: '{:theme 07}ₓₓ{:reset}ₓ ₓₓₓₓₓₓₓₓₓₓₓₓ'
- id: 8043
  text: ₓₓₓₓₓₓₓₓₓₓₓₓₓₓₓₓ
- id: 8057
  text: "{:unk13 FA 00 50 00}{:unk08 01 00 05}No puc quedar-m'hi. Em preocupa el Shang."
- id: 10377
  text: >-
    Hem aconseguit restaurar bona

    part d'aquell poblet incendiat.{:clear }Tot i que hi continuïn havent guerres,

    l'esperança mai desapareixerà.
- id: 13867
  text: '{:unk13 B4 00 3C 00}{:unk08 01 01 06}Però el Capità...'
- id: 13964
  text: >-
    Pot ser que sigueu forte, però no

    heu de descuidar l'entrenament diari.{:clear }Així com nosaltres ens enfortim,

    també l'enemic es torna més poderós.
- id: 14071
  text: >-
    Els altres ja deuen rebre ara

    una càlida benvinguda en el palau.{:clear }Estar de guàrdia és avorrit. Hi faré

    un cop d'ull des del post de control.
- id: 15224
  text: >-
    Diuen que últimament hi ha

    gent sospitosa en el {:theme 0A}cim{:reset}.{:clear }Tant de bo les patrulles no

    estiguin molt debilitades.
- id: 16944
  text: Decidits a acceptar una missió?
- id: 16945
  text: >-
    El Shan Yu ha envaït el nostre país.

    Hem d'aturar-lo sens falta.
- id: 16946
  text: >-
    El nostre objectiu és derrotar el Shan Yu.

    No podeu fallar en la vostra missió.
- id: 16947
  text: >-
    Aquesta és la primera vegada que veig en Ping...

    vull dir... la Mulan com una noia.{:clear }Sense la disfressa, ningú

    la confondria amb un xicot.
- id: 16948
  text: >-
    No entenc com ningú ha pogut

    sobreviure a un allau com aquell.{:clear }De pressa, trobem el Shan Yu.

    Probablement es dirigeixi cap al palau.
- id: 16949
  text: >-
    Diuen que en Shan Yu és un espadatxí

    expert, però tu també ho ets, Sora.{:clear }Si aconsegueixes esquivar els seus atacs,

    tindràs oportunitat de contraatacar.
- id: 16950
  text: >-
    Diversos destacaments ja han estat atacats

    pel Shan Yu. Se'ns acaba el temps.
- id: 16995
  text: En aquesta roca hi vas veure l'ombra d'en Mushu.
- id: 16996
  text: Una fletxa sobresurt per la part superior.
- id: 17049
  text: En Ping està cansat!
- id: 17092
  text: >-
    Enganyat? No, no no no.

    Mireu, jo... d'això...{:delay C0 00}{:clear }no volia atabalar-vos...
- id: 17096
  text: La porta és tancada.
- id: 17436
  text: >-
    El camí al cim és perillós.

    Moltes roques barren el pas.{:clear }Haureu de trobar la manera de

    moure-les per poder passar.
- id: 17437
  text: >-
    Un soldat astut està preparat

    per a qualsevol imprevist.{:clear }No us oblideu de

    dur-hi prou objectes.
- id: 17438
  text: >-
    Haureu d'anar per la sendera

    de muntanya fins al cim.{:clear }Aneu-hi ben armats.

    Hi ha molts enemics.
- id: 17629
  text: >-
    {:unk0f 03 1E 00 6D 01}{:color #00F0F080}S'ha agregat l'ordre Grup.{:reset}

    Permet canviar amb rapidesa els membres del grup.{:clear }{:unk0f 00 00 00 00 00}Mana-la en les batalles en què

    no és possible obrir els menús.
- id: 17630
  text: >-
    {:unk0f 03 1E 00 84 01}{:color #00F0F080}S'ha agregat l'ordre Límit.{:reset}

    Prem {:icon dynamic-dpad-left} per veure el Límit i després selecciona'l..{:clear }{:unk0f 00 00 00 00 00}Els Límits són habilitats que consumeixen els PM

    del Sora i s'executen amb membres del grup.
- id: 17699
  text: >-
    La Mulan es va unir a l'exèrcit en lloc

    del seu pare, per voluntat pròpia.{:clear }No vull ni imaginar el que passaria

    si es descobrís el seu secret.
- id: 17700
  text: >-
    Quan era a punt de liquidar aquelles criatures

    horribles, s'han espantat i han fugit!{:clear }Són uns rivals molt estranys.
- id: 17701
  text: >-
    Jo soc en Chien-Po. Aquell baixet és

    en Yao i l'altre primatxó és en Ling.{:clear }Què eren aquelles criatures que vam veure?

    Lluitem contra allò?
- id: 17702
  text: >-
    El camí que du al palau des del

    post de control és tancat ara.{:clear }Potser ens hi permeten passar quan

    haguem complert amb algunes missions.
- id: 17703
  text: >-
    Ei, com aneu? Aviam, quan

    sereu tan forts com nosaltres?
- id: 17704
  text: >-
    Preferiria entrenar per

    a un concurs de menjar.
- id: 17705
  text: >-
    La Mulan ha estat molt ocupada

    últimament.{:clear }És lògic.

    És l'heroïna de la nostra nació.
- id: 17706
  text: >-
    A vegades, un sol soldat pot

    canviar el curs d'una batalla.{:clear }Allò és el que va fer la Mulan,

    amb la vostra ajuda, és clar.
- id: 17707
  text: >-
    Des d'aquesta bosquina, pots observar

    un poblet incendiat pel Shan Yu.{:clear }El seu exèrcit no s'aturarà per res

    fins que envaeixi el nostre país.
- id: 18745
  text: >-
    Derrota el líder sensecor!

    Intenta aprofitar els remolins!
- id: 18934
  text: >-
    En Ping torna a ser la Mulan.

    La Mulan ha après una nova habilitat.
- id: 19085
  text: >-
    Sembla que fou construït

    com un símbol de pau.
- id: 19155
  text: >-
    {:unk13 FF 00 50 00}{:unk0f 05 32 00 32 00}L'indicador superior esquerre representa l'ànim

    del grup. {:color #00F0F080}Si l'indicador es buida, s'acaba el joc{:reset}. 

    Aquest es completa amb les esferes dels enemics.{:clear }{:unk0f 00 00 00 00 00}Les esferes són vitals per a la supervivència

    del grup, així que assegura't de recollir-ne

    tantes com puguis, en especial les rares.
- id: 19338
  text: >-
    {:unk13 51 01 39 00}{:unk08 01 00 05}No ho heu fet

    pas malament.{:clear }Però estigueu alerta!{:clear }Això és només

    el començament.
- id: 19339
  text: >-
    {:unk13 59 01 3D 00}{:unk08 01 00 05}Mmm, gens malament.{:clear }Ara prepareu-vos

    per a la resta de

    les missions.
- id: 19340
  text: >-
    {:unk13 68 01 32 00}{:unk08 01 00 05}Bé, això és exactament el

    que necessito de vosaltres.{:clear }Però encara teniu tasques

    pendents. Afanyeu-vos.
- id: 19753
  text: Terra de Dracs
- id: 19868
  text: Foc! Necessito foc!
- id: 19875
  text: >-
    Bé! Genial!

    Ho hem aconseguit! Hurra!
- id: 19876
  text: Senyor!
- id: 20608
  text: Prem {:icon dynamic-triangle} per començar el duel! No deixis que t'atrapi!
- id: 21515
  text: "{:delayandfade 08 78} \nTot i que no accepten en Ping a l'exèrcit,\ncompleix amb afany les tasques\nd'ensinistrament i es va fent\ncada cop més fort.\n \nÉs aleshores quan en Mushu arriba\namb notícies i assegura haver vist\nen Shan Yu pels voltants.\n \n \n"
- id: 21516
  text: "{:delayandfade 0A 78} \nDerrotar el temible Shan Yu serviria\nper guanyar-se les simpaties de\ntots, així que en Sora i els altres\ns'endinsen en una cova a per ell,\nperò tot resulta ser una trampa\ndel malvat hun.\n \n \n \n"
- id: 21517
  text: "{:delayandfade 0A 78} \n \n \n \n \n \n \n \n \n \n \n "
- id: 21518
  text: "{:delayandfade 08 78} \nEn Sora i els seus amics planten cara\nal monstre d'en Xigbar i salven\nel capità Shang i l'Emperador.\n \nAmbdós asseguren al Sora haver vist\nun jove vestit de negre...\nque podria ser el Riku!\n \nNo queda temps per a més, puix un\nsobtat estrèpit sacseja el palau.\n"
- id: 21519
  text: "{:delayandfade 0A 78} \n \n \n \n \n \n \n \n \n \n \n "
