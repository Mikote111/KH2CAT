- id: 16213
  text: ''
- id: 16214
  text: >-
    Segons l'Axel, la Kairi

    és a les masmorres.
- id: 16215
  text: >-
    Doncs més ens val trobar

    un camí cap a aquell castell!
- id: 16216
  text: Sora!
- id: 16217
  text: Donald! Goofy!
- id: 16218
  text: ''
- id: 16219
  text: Una clau espasa?
- id: 16220
  text: Qui ets tu?
- id: 16221
  text: Algú de la foscor.
- id: 16222
  text: No seràs el Riku?
- id: 16223
  text: Riku?... {:delay 6C 00}{:clear }Jo he derrotat a un Riku abans.
- id: 16224
  text: Que vas fer què...!?
- id: 16225
  text: Digues-m'ho... {:delay 8B 00}{:clear }Digues-me per què t'hi ha triat, a tu!
- id: 16226
  text: Ara ho entenc. Per això.
- id: 16227
  text: Ets un bon altre.
- id: 16228
  text: Ets un bon altre...
- id: 16229
  text: Estàs bé?
- id: 16230
  text: Què... ha passat?
- id: 16231
  text: >-
    Òndia! No ho sé. {:delay 76 00}{:clear }Has desaparegut {:delay 6C 00}{:clear }i el Donald i jo hem hagut de

    lluitar contra uns incorporis.
- id: 16232
  text: Oh.
- id: 16233
  text: Ha dit... {:delay 64 00}{:clear }que va derrotar el Riku.
- id: 16234
  text: Qui ho ha dit?
- id: 16235
  text: Aquell paio. El de l'abric negre.
- id: 16236
  text: Però si ningú pot vèncer en Riku!
- id: 16237
  text: '... Sí, tens raó.'
- id: 16238
  text: >-
    Si duia abric negre és

    de l'Organització {XIII}. {:delay D0 00}{:clear }Estaria intentant enganyar-te.
- id: 16239
  text: És clar, per això no l'hem vist!
- id: 16240
  text: ''
- id: 16241
  text: Deus estar cansat, Sora.
- id: 16242
  text: >-
    Au va, anem a buscar la manera

    d'entrar en aquell castell!
- id: 16243
  text: Kairi, has estat genial!
- id: 16244
  text: Eh?
- id: 16245
  text: Et veig canviada, Kairi, {:delay 5A 00}{:clear }però m'alegra que siguis aquí!
- id: 16246
  text: >-
    El Riku i tú mai vau tornar a casa,

    així que he vingut a per vosaltres.
- id: 16247
  text: Ho sento.
- id: 16248
  text: Això és real...
- id: 16249
  text: Espera! Ànsem! {:delay 5A 00}{:clear }{:delay 2A 00}{:clear } Vull dir... sensecor d'en Xehanort.{:delay 88 00}{:clear }{:delay 72 00}{:clear }Mai hagués dit que et tornaria a veure.
- id: 16250
  text: >-
    Només de pensar en totes les coses

    que vas fer em poso malalt. {:delay 1F 01}{:clear }Però...
- id: 16251
  text: Però has salvat la Kairi, no? {:delay 70 00}{:clear } {:delay 2B 00}{:clear }Això t'ho agraeixo... {:delay 5E 00}{:clear } {:delay 50 00}{:clear }Gràcies.
- id: 16252
  text: Riku, no te'n vagis!
- id: 16253
  text: Eh?
- id: 16254
  text: Kairi, què acabes de dir?
- id: 16255
  text: Riku.
- id: 16256
  text: >-
    No soc ningú, només un

    resident de la foscor.
- id: 16257
  text: Sora, vine aquí.{:delay 5A 00}{:clear }{:delay 21 00}Digues-li alguna cosa tu.
- id: 16258
  text: Mira.{:delay 3C 00}{:clear }{:delay 25 00}Ara ho entendràs.
- id: 16259
  text: Clou els ulls.
- id: 16260
  text: Riku...
- id: 16261
  text: Riku!{:delay 3C 00}{:clear }{:delay 1B 00}Ets tu...
- id: 16262
  text: T'he estat buscant!
- id: 16263
  text: Au va, Sora... has de comportar-te.
- id: 16264
  text: T'he buscat per tot arreu!
- id: 16265
  text: No volia que em trobessis.
- id: 16266
  text: Però era ell el que ens ajudava, no?
- id: 16267
  text: Eh?
- id: 16268
  text: >-
    Aquelles pistes que trobàvem.

    Devien ser del Riku.
- id: 16269
  text: >-
    Em començava a preocupar

    que no us n'adonéssiu mai. {:delay 9C 00}{:clear } {:delay 3C 00}{:clear }El Sora mai ha escollit amics gaire llestos.
- id: 16270
  text: Què vols dir amb això!?
- id: 16271
  text: >-
    Per què no em vas

    dir que estaves bé?
- id: 16272
  text: >-
    T'ho he dit. {:delay 66 00}{:clear }No volia que em trobessis. {:delay 64 00}{:clear }{:delay 32 00}{:clear }Així no. No podia.{:delay CB 00}{:clear }{:delay 19 00}{:clear }Vaig lluitar contra l'Ànsem... 

    contra el sensecor del Xehanort,{:delay E3 00}{:clear }{:delay 29 00}quan va envair el meu cor. I vaig vèncer. {:delay A9 00}{:clear }Però per utilitzar el poder de la foscor,

    vaig haver de convertir-me en el propi Ànsem.
- id: 16273
  text: >-
    Vols dir...

    que ja no pots canviar?
- id: 16274
  text: >-
    La batalla no s'ha acabat. {:delay 54 00}{:clear } {:delay 42 00}{:clear }I fins que no s'acabi,

    necessito el poder de la foscor.
- id: 16275
  text: Doncs... posem-hi punt i final.
- id: 16276
  text: Tu ets el Riku, passi el que passi!
- id: 16277
  text: Què em dieu? {:delay 3C 00}{:clear }{:delay 3C 00}Preparats per a una última baralla junts? {:delay 9C 00}{:clear }El rei ens espera!
- id: 16278
  text: Sí! En marxa!
- id: 16279
  text: No... El meu Kingdom Hearts... destruït.{:delay 07 01}{:clear } {:delay 7F 00}{:clear }Hauré de començar de zero.
- id: 16280
  text: Guerrers de la clau espasa! {:delay B1 00}{:clear }Avanceu! I dueu-me més cors!
- id: 16281
  text: No!
- id: 16282
  text: Estadants de la llum, responeu:{:delay F3 00}{:clear }per què odieu la foscor?
- id: 16283
  text: >-
    Ohh... no la odiem. {:delay 60 00}{:clear } {:delay 23 00}{:clear }És només que fa... {:delay 4E 00}{:clear }{:delay 29 00}por. {:delay 4E 00}{:clear } {:delay 42 00}{:clear }Però el món està fet

    de llum i foscor. {:delay C0 00}{:clear }No es pot tenir una sense l'altra,

    perquè la foscor és la meitat de tot.
- id: 16284
  text: És per qui aguaita allà dins.
- id: 16285
  text: >-
    Permeteu-me una altra pregunta doncs. {:delay 96 00}{:clear } {:delay 3B 00}{:clear }Accepteu la foscor,

    però viviu en la llum. {:delay E4 00}{:clear } {:delay 30 00}{:clear }Per què ens detesteu als que

    vivim en el límit del no res, {:delay 0B 01}{:clear }{:delay 2F 00}els que hem estat rebutjats

    per la llum i per la foscor, {:delay 3E 01}{:clear }sense cap elecció?
- id: 16286
  text: Molt senzill. {:delay 3C 00}{:clear } {:delay 3C 00}{:clear }Perquè altereu els nostres mons.
- id: 16287
  text: Pot ser. {:delay 54 00}{:clear }{:delay 3C 00}Malgrat tot, {:delay 3C 00}{:clear }{:delay 42 00}quina altra alternativa teníem?
- id: 16288
  text: >-
    Ja n'hi ha prou! {:delay 61 00}{:clear }Sou incorporis!

    No existiu! {:delay AC 00}{:clear }No sentiu llàstima per res!
- id: 16289
  text: >-
    {:delay 6E 00}{:clear }Molt bé.{:delay 77 00}{:clear }No se t'escapa res.{:delay 8F 00}{:clear }{:delay 3F 00}{:clear }No puc sentir... pena... {:delay A0 00}{:clear }{:delay 30 00}{:clear }No importa quina misèria

    pugui turmentar els mons.{:delay D7 00}{:clear }{:delay 28 00}{:clear }És igual el que penseu,

    el que sentiu o com existiu.
- id: 16290
  text: Nois?
- id: 16291
  text: Sora! On ets?
- id: 16292
  text: Sora! Contesta'm!
- id: 16293
  text: Estàs bé!
- id: 16294
  text: On és el Xemnas?
- id: 16296
  text: >-
    Ajuda'm, Kingdom Hearts! {:delay 96 00}{:clear } {:delay 6C 00}{:clear }Presta'm el teu poder

    per assolir el zenit! {:delay 14 01}{:clear } {:delay 4E 00}{:clear }El poder per acabar amb

    els necis que ens destorben.
- id: 16297
  text: Xemnas! No!
- id: 16298
  text: Cors que palpiteu d'odi!
- id: 16299
  text: Xemnas! No!
- id: 16300
  text: Cors que crispeu de ràbia!
- id: 16301
  text: Mai venceràs!
- id: 16302
  text: Cors punyits per l'enveja!
- id: 16303
  text: >-
    El neci de l'Ànsem va dir que la naturalesa

    del cor escapava de la seva comprensió...{:delay 8F 01}{:clear }Però no de la meva! {:delay A4 00}{:clear }Els cors són la

    font de tot poder!
- id: 16304
  text: Xemnas! Et trobarem!
- id: 16305
  text: No podem deixar que escapi ara!
- id: 16306
  text: Mireu allò!
- id: 16307
  text: Què està passant?
- id: 16308
  text: Kingdom Hearts...
- id: 16309
  text: Som-hi.{:delay 2A 00}{:clear }{:delay 38 00}El Xemnas deu ser dins.
- id: 16310
  text: >-
    Els mons ens han donat aquesta porta.{:delay A8 00}{:clear }Volen que siguem els

    guardians del seu destí!
- id: 16311
  text: ''
- id: 16312
  text: >-
    Una vegada entrem,

    no hi ha marxa enrere. {:delay 78 00}{:clear }{:delay 3D 00}És la victòria...{:delay 43 00}{:clear }{:delay 17 00}o l'oblit. {:delay 32 00}{:clear }{:delay 46 00}Sora...{:delay 26 00}{:clear }{:delay 36 00}estàs a punt?
- id: 16313
  text: Prepara't, Xemnas! {:delay 60 00}{:clear }És l'hora!
- id: 16314
  text: >-
    Bé... sembla que els vostres cors

    us han guiat a la aniquilació. {:delay 2C 01}{:clear } {:delay 42 00}{:clear }Potser que no valgui la 

    pena fer-li cas al cor. {:delay F0 00}{:clear } {:delay 87 00}{:clear }Intentaré no oblidar-ho mai.
- id: 16317
  text: No!
- id: 16318
  text: Sols podem amb ell!
- id: 16319
  text: Necessito... més ràbia.{:delay E6 00}{:clear }Més... cors.
- id: 16320
  text: >-
    Xemnas. {:delay 5E 00}{:clear }El cor és més que

    la rabia o el odio. {:delay B0 00}{:clear }Està ple de sentiments. {:delay 5E 00}{:clear } {:delay 60 00}{:clear }No te'n recordes?
- id: 16321
  text: Per desgràcia...{:delay 5A 00}{:clear }{:delay 57 00}No.
- id: 16322
  text: Vaja! Heu estat genials!
- id: 16323
  text: Tornes amb nosaltres, no?
- id: 16324
  text: Jo vaig cedir a la foscor...
- id: 16325
  text: Riku!
- id: 16326
  text: Com miraria als que em coneixien?
- id: 16327
  text: Així!
- id: 16328
  text: Ràpid!
- id: 16329
  text: Obriré un camí!
- id: 16330
  text: >-
    El teu lloc ja no és en el

    Regne de la Foscor, Riku.
- id: 16331
  text: Com sortim d'aquí, Majestat?
- id: 16332
  text: ''
- id: 16333
  text: Qui ha fet això?
- id: 16334
  text: Bé, no n'estic segur. {:delay 69 00}{:clear }Però serà millor que ens afanyem.
- id: 16335
  text: Espereu-me!
- id: 16336
  text: Som-hi!
- id: 16337
  text: Gràcies, Naminé.
- id: 16338
  text: De res.
- id: 16339
  text: >-
    Veus? Tornarem a veure'ns,

    com ens vam prometre.
- id: 16340
  text: Eh?
- id: 16341
  text: Vas dir que ens veuríem,{:delay 52 00}{:clear }{:delay 3E 00}però que potser...{:delay 37 00}{:clear }{:delay 32 00}no ens reconeixeríem.
- id: 16342
  text: Ho vaig dir, oi?
- id: 16343
  text: Però ho he fet.
- id: 16344
  text: Mmm... Què rar...
- id: 16345
  text: >-
    Crec que ja ho entenc.{:delay 4C 00}{:clear }{:delay 64 00}Jo em veig a mi mateix

    com tu em recordes.{:delay 8F 00}{:clear } {:delay 6A 00}{:clear }I tu et veus a tu mateixa

    com jo et recordo.
- id: 16346
  text: >-
    Creia que el destí dels incorporis

    era diluir-se en la foscor.
- id: 16347
  text: >-
    Sí...{:delay 24 00}{:clear }{:delay 3C 00}però tu i jo no.{:delay 61 00}{:clear }Hem conegut els nostres

    èssers originals.
- id: 16348
  text: Llavors...{:delay 64 00}{:clear }podem estar junts!
- id: 16349
  text: Sí.{:delay 5C 00}{:clear }Sempre que el Sora i el Kairi ho estiguin.
- id: 16350
  text: >-
    Estarem junts tots els dies,

    oi, Sora?
- id: 16351
  text: Aahh... Sí!
- id: 16352
  text: Espavila!
- id: 16353
  text: Tranquil, segueixes sent tu.
- id: 16354
  text: Eh, marxem cap a casa!
- id: 16355
  text: Riku... anem.
- id: 16356
  text: Sí.
- id: 16357
  text: Sora! Riku!
- id: 16358
  text: Què...!?
- id: 16359
  text: Riku!
- id: 16360
  text: Sora!
- id: 16361
  text: >-
    Herois del Regne de la Llum...{:delay 00 01}{:clear }No permetré que això acabi així.{:delay CD 00}{:clear }{:delay 1C 00}Encara no.{:delay A0 00}{:clear }Si la llum i la foscor són eternes, {:delay FA 00}{:clear }sens dubte els que no som

    res devem de ser igual...{:delay 63 01}{:clear }d'eternos!
- id: 16362
  text: >-
    Tens raó, la llum i la

    foscor són eternes. {:delay F6 00}{:clear }Tot i que suposo que

    res dura per a sempre.{:delay 8A 00}{:clear } {:delay 3C 00}{:clear }Però endevina, Xemnas...
- id: 16363
  text: Això no vol dir que siguis etern!
- id: 16364
  text: >-
    {:delay A2 00}{:clear }No més etern que aquesta

    brillantor vostra...
- id: 16365
  text: Ho hem aconseguit!
- id: 16366
  text: Jo no n'estaria tan segur.
- id: 16367
  text: '{:delay 6D 00}{:clear }Sora... {:delay 77 00}{:clear }no puc...'
- id: 16368
  text: No diguis res! {:delay 80 00}{:clear }Això no acaba aquí. Ni parlar-ne.
- id: 16369
  text: Com pots dir això? {:delay 6C 00}{:clear }Encara que no poguéssim seguir...{:delay 89 00}{:clear }mira on som.
- id: 16370
  text: Ah, som-hi Riku. {:delay 6C 00}{:clear }Portes massa temps a la foscor. {:delay 72 00}{:clear } {:delay 45 00}{:clear }Has de ser més positiu!
- id: 16371
  text: Sora...
- id: 16372
  text: ''
- id: 16373
  text: Et segueixo.
- id: 16374
  text: Entesos.
- id: 16375
  text: >-
    Saps? {:delay 65 00}{:clear }Sempre he cregut que jo

    era millor que tu en tot.
- id: 16376
  text: De debò?
- id: 16377
  text: Et molesta?
- id: 16378
  text: >-
    No.{:delay 5B 00}{:clear }Jo també he cregut sempre

    que tu erets millor en tot.
- id: 16379
  text: Riku... mira.{:delay 72 00}{:clear }Què és aquella llum?
- id: 16380
  text: Per què!? {:delay 42 00}{:clear }Per què tens la clau espasa?
- id: 16381
  text: Calla!
- id: 16382
  text: T'has decidit?
- id: 16383
  text: Per què em va escollir la clau espasa?{:delay D3 00}{:clear }Haig de saber-ho.
- id: 16384
  text: >-
    No pots trair

    l'Organització!
- id: 16385
  text: Per què!? {:delay 42 00}{:clear }Per què tens la clau espasa?
- id: 16386
  text: Calla!
- id: 16387
  text: >-
    Si els dones l'esquena,

    et destruiran!
- id: 16388
  text: Ningú em trobaria a faltar.
- id: 16389
  text: Això no és cert!{:delay 83 00}{:clear }Jo sí.
- id: 16390
  text: Sora... Ho has fet bé.
- id: 16391
  text: On és la Kairi?
- id: 16392
  text: >-
    Qui sap? Suposo que posant-se al

    dia amb el seu amiguet de la foscor.
- id: 16393
  text: Què vols dir?
- id: 16394
  text: Ja no et necessita.
- id: 16395
  text: Se suposa que haig de creure'm això?
- id: 16396
  text: >-
    Bé, no fa falta... {:delay B4 00}{:clear }{:delay 3F 00}{:clear }pero creu-te això: {:delay 76 00}{:clear }{:delay 3C 00}{:clear }a l'Organització {XIII} ja

    no li serveixes de res.
- id: 16397
  text: >-
    El nostre Kingdom Hearts. {:delay 78 00}{:clear }{:delay 66 00}{:clear }Gràcies a tu, reunim

    innombrables cors... {:delay DE 00}{:clear }{:delay 3C 00}{:clear }Pots sentir la seva joia?
- id: 16398
  text: >-
    Ara només falta una ajuda més

    de l'escollit de la clau espasa.
- id: 16399
  text: S'ha de lluitar!
- id: 16400
  text: Però... Kingdom Hearts!
- id: 16401
  text: Sora!
- id: 16402
  text: Sora! Ets tu de veritat!
- id: 16403
  text: Kairi!
- id: 16404
  text: Deixeu en pau el Sora!
- id: 16405
  text: Sora...!
- id: 16406
  text: Agafa-la!
- id: 16407
  text: Molt bé.{:delay 55 00}{:clear }Aquest cop... lluitaré.
- id: 16408
  text: >-
    Ja saps que el Sora està

    indefens sense nosaltres. {:delay A0 00}{:clear }{:delay 1E 00}{:clear }Som-hi, Riku!
- id: 16409
  text: Vaja, vaja. {:delay 5A 00}{:clear }{:delay 3C 00}{:clear }No acabaran mai les intromissions?
- id: 16410
  text: Oh, Pete... {:delay 46 00}{:clear }{:delay 28 00}{:clear }aquest castell és perfecte. {:delay A0 00}{:clear }{:delay 3C 00}{:clear }Potser hauríem... d'adquirir-lo.
- id: 16411
  text: >-
    El lloc no està malament,

    suposo, però... eh...{:delay DD 00}{:clear }què passa amb tots els sensecor? {:delay 83 00}{:clear }Aquest món intermedi està

    molt a prop de la foscor. {:delay E0 00}{:clear }Aquí no ens faran cas!
- id: 16412
  text: Una vegada més, em subestimes.
- id: 16413
  text: Deixeu-me!
- id: 16414
  text: Què està passant?
- id: 16415
  text: Has sigut un bon noi?
- id: 16416
  text: Dona la cara!
- id: 16417
  text: Oh, em sembla que no.
- id: 16418
  text: Sora! Roxas!
- id: 16419
  text: Roxas?
- id: 16420
  text: Ei! M'acaba de dir Roxas?
- id: 16421
  text: >-
    Has posat l'Organització {XIII}

    en un bon embolic. {:delay D2 00}{:clear }{:delay 26 00}{:clear }Suposo que per això

    et va escollir la clau espasa. {:delay AA 00}{:clear }{:delay 2E 00}{:clear }Però NANO, quin mocós

    ha escollit aquest cop! {:delay 96 00}{:clear }{:delay 32 00}{:clear }No sembles ni la meitat

    d'heroi que els altres.
- id: 16422
  text: Has acabat de vacil・lar?
- id: 16423
  text: >-
    Vacil・lar? Si home! {:delay 7E 00}{:clear }{:delay 38 00}{:clear }En definitiva, traidor,

    t'ha arribat l'hora!
- id: 16424
  text: Que ve!
- id: 16425
  text: Per què m'has dit Roxas?
- id: 16426
  text: "{:delay 78 00}A que t'agradaria saber-ho?"
- id: 16427
  text: Ei! Espera!
- id: 16428
  text: Sora! És la Kairi!
- id: 16429
  text: Oh, oh! Necessiten ajuda.
- id: 16430
  text: >-
    El Sora i el Riku són junts.

    Res podem fer ja aquí.
- id: 16431
  text: >-
    Vaja! Em pregunto si el Riku

    tornarà a ser el d'abans.
- id: 16432
  text: >-
    El Riku va triar aquella forma per

    poder utilitzar el poder de la foscor. {:delay F0 00}{:clear }{:delay 1E 00}{:clear }No serà fàcil.
- id: 16433
  text: Kairi, ja venim!
- id: 16434
  text: >-
    Sí... Kingdom Hearts... {:delay F0 00}{:clear }{:delay 42 00}{:clear }Alegra't i gaudeix dels

    cors que t'oferim!{:delay 02 01}{:clear }{:delay 5F 00}{:clear }Que la teva tènue llum

    il・lumini aquest regne buit.{:delay D6 00}{:clear }{:delay 35 00}{:clear }Comparteix el teu poder amb

    nosaltres els incorporis!
- id: 16435
  text: >-
    Xemnas. Ja és a punt

    el Kingdom Hearts?
- id: 16436
  text: Queda poc.
- id: 16437
  text: >-
    Llavors, puc acabar

    amb aquesta farsa?
- id: 16438
  text: És clar.
- id: 16439
  text: Quines ganes tenia de sentir-ho!
- id: 16443
  text: Aquest lloc servirà.
- id: 16444
  text: Per a què és aquest aparell?
- id: 16445
  text: >-
    Serveix per convocar el Kingdom

    Hearts i codificar-lo com dades.
- id: 16446
  text: No sé si ho entenc.
- id: 16447
  text: >-
    Jo tampoc sé quin serà el

    resultat d'aquesta operació. {:delay C8 00}{:clear }{:delay 46 00}{:clear }Després de tot...
- id: 16448
  text: Què és això?
- id: 16449
  text: >-
    Són el rei i el DiZ... {:delay 47 00}{:clear }{:delay 13 00}{:clear }vull dir, l'Ànsem el Savi. {:delay 96 00}{:clear }{:delay 20 00}{:clear }Deuen ser més amunt.

    Afanyem-nos.
- id: 16450
  text: Tu!
- id: 16451
  text: Preferiria saltar-me les formalitats.
- id: 16452
  text: Com has pogut... Roxas?
- id: 16453
  text: Soc el Sora!
- id: 16454
  text: Estàs bé?
- id: 16455
  text: Sí, cap problema. {:delay 5A 00}{:clear }{:delay 24 00}{:clear }Seguim.
- id: 16456
  text: Sora! Riku!
- id: 16457
  text: Això no acabarà mai!
- id: 16458
  text: Junts els aturarem!
- id: 16459
  text: >-
    Fora d'aquí! Deixeu-nos

    aquestes criatures a nosaltres!
- id: 16460
  text: Jo no crec que puguem amb tots!
- id: 16461
  text: >-
    Els enviaré a pel Xemnas. {:delay AE 00}{:clear }O potser preferiries lluitar

    contra ells tu mateix?
- id: 16462
  text: >-
    Sincerament, 

    preferiria fugir!
- id: 16463
  text: Doncs ves-te'n!
- id: 16464
  text: >-
    Vaja, però si és el

    rei de la barqueta!
- id: 16465
  text: >-
    Hora de llevar àncores,

    capità Pete?
- id: 16466
  text: >-
    Insinues que abandono el vaixell?

    Ni parlar-ne!
- id: 16467
  text: >-
    Sora! Majestat! No ho oblideu: {:delay CC 00}{:clear }quan els hagi destruit a tots,

    aquest castell serà meu!
- id: 16468
  text: >-
    Vaja! Oportunitats com aquesta

    no es presenten tots els dies!
- id: 16469
  text: A per ells!
- id: 16470
  text: Hay que darse prisa.
- id: 16472
  text: Fan el que els ordena el seu cor.{:delay 83 00}{:clear }{:delay 1F 00}No podem interferir.
- id: 16478
  text: Però...
- id: 16488
  text: Riku?
- id: 16491
  text: Riku!
- id: 16493
  text: >-
    L'Ànsem ha dit que podia

    passar qualsevol cosa.
- id: 16494
  text: Riku, no t'ho treus?
- id: 16495
  text: Oh...
- id: 16496
  text: Què era això?
- id: 16497
  text: Els seus ulls no poden mentir.
- id: 16498
  text: Mentir?
- id: 16499
  text: >-
    I a qui intentaves enganyar?

    Eh? Eh?
- id: 16500
  text: A mi.
- id: 16501
  text: Riku...
- id: 16502
  text: >-
    Au, nano!{:delay 3C 00}{:clear }{:delay 26 00}Per què ho intentes

    fer tot tu sol?
- id: 16503
  text: Te n'has oblidat?
- id: 16504
  text: Digue-ho un altre cop!
- id: 16505
  text: Oh, oh!
- id: 16506
  text: Què fem, Riku?
- id: 16507
  text: >-
    Hem de derrotar el Xemnas. {:delay 66 00}{:clear } {:delay 1F 00}{:clear }És l'únic que queda

    de l'Organització.
- id: 16508
  text: D'acord!
- id: 16509
  text: Som-hi!
- id: 16516
  text: Ha passat de molt temps, amic meu.
- id: 16517
  text: >-
    Ànsem el Savi. {:delay 54 00}{:clear }{:delay 28 00}{:clear }Per què no vas acudir a mi abans

    que les coses es compliquessin tant?
- id: 16518
  text: >-
    Xemnas, el Gran Mentor

    de l'Organització,{:delay A8 00}{:clear }és l'incorpori d'en Xehanort,

    el meu millor aprenent. {:delay DE 00}{:clear }{:delay 39 00}{:clear }Jo havia de carregar amb la culpa.
- id: 16519
  text: Això és tot?
- id: 16520
  text: >-
    No nego que hi havia més. {:delay 96 00}{:clear }{:delay 38 00}{:clear }Jo estava... ofuscat per les

    meves ànsies de venjança. {:delay D8 00}{:clear }{:delay 22 00}{:clear }Els meus aprenents em van

    robar tot el que apreciava: {:delay CC 00}{:clear }{:delay 1C 00}{:clear }els meus estudis... i el meu orgull.
- id: 16521
  text: Jo no puc ajudar-te amb la teva venjança.
- id: 16522
  text: Ho sé. {:delay 3C 00}{:clear }{:delay 36 00}{:clear }El Riku m'ho ha dit mil vegades.
- id: 16523
  text: On és?
- id: 16524
  text: >-
    Ara ja deu ser amb els seus amics.{:delay 96 00}{:clear }{:delay 2A 00}{:clear }El Riku m'ha suposat una gran ajuda. {:delay 8A 00}{:clear }El vaig trobar vagant per la

    foscor, després que us perdèssiu.
- id: 16525
  text: >-
    Bé! No ens havíem perdut

    exactament. El Riku se'n va anar... {:delay F0 00}{:clear }És que el sensecor d'en Xehanort

    era dins seu, confonent-lo.{:delay 08 01}{:clear }{:delay 1B 00}{:clear }Ha hagut de patir molt... {:delay 90 00}{:clear }Però no entenc per què segueix així;

    en el seu cor sempre serà el Riku.
- id: 16526
  text: >-
    Jo en tinc la culpa. {:delay 54 00}{:clear }{:delay 78 00}{:clear }Quan vaig veure el Riku

    per primera vegada{:delay 72 00}{:clear }{:delay 38 00}{:clear }seguia tenint l'aspecte d'un nen. {:delay 9C 00}{:clear }{:delay 54 00}{:clear }Probablement perquè

    tenia un cor molt fort.
- id: 16527
  text: >-
    Li vaig demanar que busqués a un jove

    anomenat Roxas, de l'Organització {XIII}, {:delay 0E 01}{:clear }i m'ho dugués. {:delay 48 00}{:clear }{:delay 54 00}{:clear }Quan li vaig dir que allò ajudaria a que

    el Sora despertés de la seva letargia,{:delay F0 00}{:clear }El Riku va marxar sense dir paraula.
- id: 16528
  text: >-
    Es va enfrontar al Roxas, però em temo

    que el Riku va perdre aquell combat.
- id: 16529
  text: >-
    El Riku devia d'entendre que per

    lluitar en el Regne de la Foscor {:delay E4 00}{:clear }havia submergir-se en

    aquella mateixa foscor. {:delay D2 00}{:clear }{:delay 12 00}{:clear }I així ho va fer... {:delay 3C 00}{:clear }{:delay 24 00}{:clear }Ja has vist el que ha sigut d'ell.
- id: 16530
  text: >-
    Quan el Riku em va dur el Roxas,

    es va presentar a sí mateix com... Ànsem.
- id: 16531
  text: >-
    Si amb això despertava el seu amic,

    estava disposat a viure en la foscor...
- id: 16532
  text: El Riku va ser la víctima de la meva venjança.
- id: 16533
  text: Ah, com em cremava el cor. {:delay CA 00}{:clear }Només podia riure {:delay 48 00}{:clear }{:delay 16 00}{:clear }per amagar la meva vergonya.
- id: 16534
  text: >-
    Devia ser després d'allò de quan

    vaig tornar a veure el Riku. {:delay DB 00}{:clear }Deia que volia ajudar el Sora... {:delay 83 00}{:clear }però em va fer prometre{:delay 6D 00}{:clear }que mai li diria tot

    el que li havia passat a ell {:delay B3 00}{:clear }mentre era a la foscor.
- id: 16535
  text: >-
    Amic meu, ha arribat l'hora.{:delay 98 00}{:clear }Haig d'arreglar les coses

    amb aquells joves.
- id: 16536
  text: >-
    Només tu podies arribar tan

    lluny d'una sola peça... Roxas.
- id: 16537
  text: Ja me n'estic afartant.
- id: 16538
  text: Sí! Ell és el Sora!
- id: 16539
  text: Diferent nom, mateix destí.
- id: 16540
  text: Per què...? {:delay 46 00}{:clear }{:delay 32 00}Kingdom Hearts... {:delay 5F 00}{:clear }{:delay 50 00}on és el meu cor?
- id: 16541
  text: No ho entenc.{:delay 3C 00}{:clear }{:delay 1E 00}Per què em diuen tots Roxas?
- id: 16542
  text: Perquè, Sora...{:delay 3C 00}{:clear }{:delay 60 00}el Roxas és el teu incorpori.
- id: 16543
  text: >-
    El meu... incorpori? {:delay 96 00}{:clear }{:delay 24 00}Això és de bojos.

    Jo mai he sigut un sensec... {:delay 93 00}{:clear }{:delay 30 00}Ah, ja!
- id: 16544
  text: >-
    Va ser quan vas venir a rescatar-me,

    te'n recordes?
- id: 16545
  text: >-
    El Xemnas va ser el que va trobar el Roxas.{:delay 84 00}{:clear }{:delay 3C 00}Podia utilitzar la clau espasa

    perquè era el teu incorpori.
- id: 16546
  text: >-
    Per això el Xemnas el va dur

    a l'Organització.{:delay 96 00}{:clear }{:delay 30 00}Però el Roxas els va traicionar. {:delay 5A 00}{:clear }{:delay 36 00}Vaig lluitar contra ell perquè pensava

    que això t'ajudaria a despertar. {:delay AD 00}{:clear }{:delay 22 00}{:clear }Vaig perdre.{:delay 4E 00}{:clear }Però en la nostra següent

    trobada, jo ja era més fort.
- id: 16548
  text: Roxas... {:delay 42 00}{:clear }{:delay 3E 00}Tant de bo pogués conèixer-lo...
- id: 16549
  text: Molt bé. Som-hi.
- id: 16550
  text: Ànsem?
- id: 16551
  text: >-
    {:delay F8 00}Soc un ilús. {:delay 47 00}{:clear }{:delay 46 00}{:clear }M'he passat anys estudiant

    els secrets del cor, {:delay D0 00}{:clear }{:delay 31 00}{:clear }però no n'he après res.
- id: 16552
  text: Què vols dir?
- id: 16553
  text: >-
    La codificació dels cors

    no és calculable.
- id: 16554
  text: Els habitants de la meva Vila Crepuscle{:delay AF 00}{:clear }eren dades de cors reals.
- id: 16555
  text: >-
    Creia que pensarien i actuarien

    com jo havia previst...{:delay 0D 01}{:clear }però no podia estar més equivocat.
- id: 16556
  text: Ànsem! La màquina!
- id: 16557
  text: >-
    Una prova més que els cors

    no poden plasmar-se en dades. {:delay F7 00}{:clear }Fuig, amic meu! S'autodestruirà

    i podria passar qualsevol cosa!
- id: 16558
  text: Però...
- id: 16559
  text: Majestat!
- id: 16560
  text: Sora, la resta depèn de tu... {:delay A8 00}{:clear }{:delay 29 00}i del Roxas.{:delay 37 00}{:clear }{:delay 21 00}Dubto que pugui sentir-me, però, de debò...{:delay BF 00}{:clear }{:delay 11 00}ho sento.
- id: 16561
  text: Ànsem!
- id: 16562
  text: El meu cor em diu el que haig de fer.{:delay 94 00}{:clear }{:delay 32 00}Per favor, permet-me que li faci cas.
- id: 16563
  text: No!
- id: 16564
  text: Riku!
- id: 16565
  text: >-
    El seu cor ha decidit.

    No podem fer-hi res.
- id: 16566
  text: >-
    Em preguntava qui gosa interferir

    en el meu Kingdom Hearts i mira... {:delay DC 01}{:clear }aquí hi sou tots. {:delay 7D 00}{:clear }Què bé que em va!
- id: 16567
  text: >-
    Ànsem el Savi...

    estàs fet un fàstic.
- id: 16568
  text: >-
    Riu-te'n si vols. {:delay 5A 00}{:clear }{:delay 29 00}M'ho mereixo per no haver

    vist en tu què tant neci erets.
- id: 16569
  text: >-
    Els alumnes són com els seus mestres.{:delay AC 00}{:clear }{:delay 36 00}Només un neci seria el teu aprenent. {:delay A3 00}{:clear }{:delay 1C 00}A més, res d'això

    hagués passat sense tu.
- id: 16570
  text: >-
    Tu ets la font de

    tots els sensecor.{:delay D2 00}{:clear }{:delay 24 00}Els teus estudis em van inspirar per

    anar més enllà del que tu mai vas somiar.
- id: 16573
  text: Ja n'hem dit prou! {:delay 5A 00}{:clear }{:delay 3A 00}{:clear }Riku, ja saps què fer! {:delay 61 00}{:clear }{:delay 63 00}{:clear }Rei Mickey, amic meu, ho sento.{:delay C8 00}{:clear }{:delay 34 00}{:clear }Adeu!
- id: 16671
  text: I ara què?
- id: 16672
  text: >-
    Hi ha d'haver un

    camí per algun lloc.
- id: 16673
  text: Què faràs amb nosaltres?
- id: 16674
  text: >-
    Tu ets el foc que

    alimenta la fúria d'en Sora.
- id: 16675
  text: No... {:delay 26 00}{:clear }{:delay 32 00}El Sora està en perill per culpa meva...
- id: 16676
  text: Per aquí!
- id: 16677
  text: Qui...?
- id: 16678
  text: Creu en tu mateixa. Au va, ràpid!
- id: 16679
  text: Kairi... Ja venim.
- id: 16680
  text: Kairi! On ets?
- id: 16681
  text: >-
    Shhh! Recorda on som!

    Aquest és el seu quarter general!
- id: 16682
  text: Espera, Majestat!
- id: 16683
  text: Compte! Crec que tenim companyia!
- id: 16684
  text: Naminé... Ets aquí.
- id: 16685
  text: Naminé...?
- id: 16686
  text: >-
    Kairi. Em temo que no

    puc deixar-te anar.
- id: 16687
  text: Et duré a veure el Sora.
- id: 16688
  text: No volies això?
- id: 16689
  text: Sí, més que res,{:delay 84 00}{:clear } {:delay 1C 00}però no amb tu a prop.
- id: 16690
  text: >-
    Si tingués cor, ara

    mateix em moriria de risa.
- id: 16691
  text: Tu... {:delay 41 00}{:clear } {:delay 32 00}{:clear }No s'havia desfet de tu el Roxas?
- id: 16692
  text: Ocupa-te'n tu, {:delay 60 00}{:clear }Riku.
- id: 16693
  text: Riku?
- id: 16699
  text: Espera!
- id: 16700
  text: Riku... de debò ets tu?
- id: 17000
  text: >-
    Darrere aquesta porta,

    comença el final del teu viatge.
- id: 17001
  text: >-
    Preparat per enfrontar el teu destí?

    {:chardelay 33 00}Necessito temps per tranquilitzar-me.

    {:chardelay 09 00}Som-hi, posem-hi punt i final!
- id: 17050
  text: Compta amb els teus amics!
- id: 18224
  text: els cors són impredictibles.
- id: 18357
  text: >-
    Aquest edifici vigila els

    residents de la foscor.
- id: 18358
  text: El pas està completament bloquejat.
- id: 18359
  text: El Franctirador
- id: 18360
  text: El Remolí de la Llança
- id: 18361
  text: L'Acadèmic Gèlid
- id: 18362
  text: L'Heroi Silent
- id: 18363
  text: El Conspirador Velat
- id: 18364
  text: L'Endevinador Llunar
- id: 18365
  text: Ràfega de Flames Dansaires
- id: 18366
  text: El Nocturn Melodiós
- id: 18367
  text: El Tafur del Destí
- id: 18368
  text: L'Assassí Virtuós
- id: 18369
  text: La Nimfa Salvatge
- id: 18370
  text: La Clau del Destí
- id: 18371
  text: Està segellat màgicament.
- id: 18437
  text: >-
    El rei s'ha tornat a avançar!

    És que no pot esperar!?{:clear }Estic una mica nerviós, però em tranquilitza

    poder tornar a Vila Crepuscle quan vulguem.
- id: 18438
  text: >-
    Aquesta ciutat és molt fosca.

    Aquí viuen els incorporis, no?{:clear }Som-hi. Hem de trobar un camí

    fins al {:theme 0A}castell{:reset} on tenen la Kairi.
- id: 18439
  text: >-
    Segur que l'Organització {XIII} 

    us estarà esperant en aquel castell.{:clear }No fa falta que us digui quant

    poderosos són. No baixeu la guàrdia.
- id: 18440
  text: >-
    Aquest món és molt estrany.

    La lluna sembla un cor.{:clear }Som-hi! El camí al {:theme 0A}castell{:reset}

    és obert, rescatem la Kairi!
- id: 18441
  text: >-
    Aquell castell és el quarter de l'enemic.

    Hi haurà un munt d'incorporis.{:clear }Són rivals difícils, però tots

    tenen debilitats. Intenta descobrir-les.
- id: 18442
  text: >-
    Vaja! Si des de fora semblava gran,

    per dins aquest lloc és immens!{:clear }Aquesta pot ser la nostra última batalla.

    Ara veuran qui som!
- id: 18443
  text: >-
    Carai, sento que la foscor ens

    rodeja, però no he vist a cap...{:clear }membre de l'Organització {XIII}.{:clear }Ja saps que sempre apareixen del

    no-res. Hem d'estar preparats.
- id: 18444
  text: >-
    Què està passant?

    L'Ànsem estava lluitant al costat de la Kairi!{:clear }Però ara la Kairi té problemes!

    Hem d'ajudar-la!
- id: 18445
  text: >-
    No crec que des d'aquí puguem

    arribar directament on és la Kairi.{:clear }Sé que tens pressa, però

    necessitem seguir aquest camí.
- id: 18446
  text: >-
    Aquest lloc em fa mala espina.

    És com... un cementiri.{:clear }Quasi tot sembla estar en ruïnes.

    Per què serà, Sora?
- id: 18447
  text: >-
    Mira!

    Ara hi ha una llum en aquella entrada.{:clear }Tindrà alguna cosa a veure

    amn els teus enemics, Sora?
- id: 18448
  text: >-
    Voldria lluitar com el Riku i tu...{:clear }Sé el que penseu, però no hauríeu

    de ser els únics que us arriscareu.
- id: 18449
  text: >-
    Alguns membres de l'Organització {XIII}

    és prenen la lluita com un joc.{:clear }No importen las normes, sempre tindràs

    una oportunitat de guanyar. Aprofita-la.
- id: 18450
  text: >-
    Puc percebre el Saïx. Està utilitzant

    alguna cosa per incrementar el seu poder.{:clear }Si podem descobrir d'on el treu,

    potser també puguem utilitzar-lo.
- id: 18451
  text: >-
    El camí és obert. Allà

    ens espera el Xemnas.{:clear }És el líder de l'Organització {XIII}.

    Afanyem-nos, Sora.
- id: 18452
  text: >-
    Roxas... Conec aquell nom.

    Vaig parlar-hi una vegada.{:clear }Em recordava a tu, Sora.

    El coneixes?
- id: 18453
  text: >-
    Probablement el Xemnas s'hagi

    enfortit i ens estigui esperant.{:clear }Tot va començar amb les investigacions

    de l'Ànsem. Acabem-ho en el seu honor!
- id: 18454
  text: >-
    Estic cansada d'esperar, o sigui que

    no em diguis que em quedi enrere!{:clear }Des d'ara, a on hi vagi un,

    hi aniran els altres, d'acord?
- id: 18455
  text: >-
    Te'n recordes? Ens vam quedar cara a

    cara, cadascú a un costat d'aquella porta.{:clear }Ara som al mateix costat.

    Tornem a casa junts aquest cop, d'acord?
- id: 18456
  text: >-
    No baixis la guàrdia. Podem acabar

    separats en qualsevol moment.{:clear }Au va, salvem el món de nou!
- id: 18457
  text: >-
    El Kingdom Hearts ha

    obert la porta al Xemnas.{:clear }No podem deixar passar aquesta oportunitat.

    Serà una batalla dura, però nosaltres podem!
- id: 18458
  text: >-
    O sigui que vosaltres éreu d'aventures, 

    mentre jo vivia una vida normal.{:clear }Per què sempre em quedo fora!?

    M'ho haureu d'explicar tot més tard!
- id: 18459
  text: >-
    Vaig trobar el Roxas gràcies

    a un tipus anomenat DiZ.{:clear }Al principi no confiava en ell, però

    ens necesitàvem l'un a l'altre.
- id: 18460
  text: >-
    Uf! Estic fet pols!

    Anem a descansar una mica.
- id: 18461
  text: >-
    Per a què construirien

    aquest castell?{:clear }És bastant misteriós.
- id: 18462
  text: >-
    Mmm. No està malament, Sora.

    T'has tornat més fort.{:clear }No necessites ni la meva

    arma ni el poder de la foscor.
- id: 18463
  text: >-
    Ostres! Estava a punt i amb ganes d'ajudar,

    però no vaig tenir l'ocasió de lluitar!{:clear }Mai se sap què pot passar!

    S'ha d'estar alerta!
- id: 18464
  text: >-
    Em pregunto on haurà anat el rei.{:clear }Sé que és fort i pot cuidar-se'n,

    però em preocupa.
- id: 18517
  text: >-
    Ser-hi els tres junts em

    recordaa la vida a l'illa.{:clear }Acabem amb tot això,

    i tornem a casa junts!
- id: 18519
  text: >-
    Mai hagués imaginat que tornaria

    a ser jo. Bé, un problema menys.{:clear }Ara no em confondran amb un

    membre de l'Organització {XIII}.
- id: 18688
  text: Obtén una ordre ◯!
- id: 18689
  text: Obtén quatre ordres ◯!
- id: 18715
  text: >-
    Venç el Xigbar!

    Has de contraatacar!

    Si utilitzes ordres de reacció

    amb {:icon dynamic-triangle}, et resultarà més fàcil!
- id: 18716
  text: 'Organització {XIII}: Luxord (Tafur)'
- id: 18717
  text: >-
    Has de derrotar el Saïx!

    Aprofita't de la seva arma!
- id: 18769
  text: Làser
- id: 18770
  text: Drenatge
- id: 18853
  text: Et diré per què.
- id: 18854
  text: Perquè no soc tan babau com tu.
- id: 18864
  text: >-
    El Xemnas és l'únic membre

    que queda de l'Organització {XIII}.{:clear }I n'és el més poderós. No serà

    una batalla fàcil. Bona sort.
- id: 18935
  text: Un cor...{:delay 52 00}{:clear }és molt més que un sistema.
- id: 18936
  text: >-
    Ho vaig veure quan el Roxas

    i la Kairi es van creuar. {:delay E2 00}{:clear }{:delay 37 00}Ho vaig saber. {:delay 2C 00}{:clear }{:delay 1E 00}Però era massa tossut

    per acceptar-ho.
- id: 18937
  text: >-
    Sempre passa el mateix. {:delay 84 00}{:clear }Intento amagar de la meva ment coses

    que el meu cor ja sap... i hi fracaso.
- id: 18938
  text: >-
    Mentre intentava portar el Sora de tornada,

    tenia molts plans per a ell. {:delay 2C 01}{:clear }{:delay 12 00}{:clear }Però quan va reprendre la consciència,

    tot es va ensorrar.
- id: 18939
  text: Tots el meus estudis van quedar en res...{:delay 98 00}{:clear }{:delay 29 00}{:clear }comparats amb el cor d'un nen.
- id: 18940
  text: >-
    Admeto...{:delay 3C 00}{:clear }{:delay 35 00}que la meva negligència va

    dur el caos a més d'un món.
- id: 18941
  text: Però, què és el que buscaves?
- id: 18942
  text: >-
    Em vas borrar del món{:delay A2 00}{:clear }per usurpar el meu nom{:delay 6C 00}{:clear }i continuar uns estudis

    que era millor oblidar-los...
- id: 18943
  text: És aquesta la resposta que buscaves?
- id: 18944
  text: >-
    Tot això i més. {:delay 74 00}{:clear }{:delay 1A 00}Estic continuant el que tu vas

    començar i creant un món nou...{:delay 64 01}{:clear }de cor en cor.{:delay 70 00}{:clear }{:delay 4A 00}Vaig creure que m'admiraries,{:delay 7C 00}{:clear }i l'únic que fas és

    posar-me pedres en el camí.
- id: 18945
  text: >-
    Tot i que entenc que...{:delay 50 00}{:clear }{:delay 1F 00}al contrari que jo, tu tens un

    cor i que no pots controlar-lo. {:delay 45 01}{:clear }{:delay 40 00}Consumit, per la gelosia que sents

    de l'alumne que t'ha sobrepassat.
- id: 18946
  text: >-
    Xehanort. {:delay 3C 00}{:clear }{:delay 43 00}Neci aprenent d'un home neci.{:delay A9 00}{:clear }{:delay 4F 00}No has sobrepassat res, només has

    demostrat quant poc en sabem tots dos.
- id: 18947
  text: >-
    Assegurem que coneixem el cor,{:delay A3 00}{:clear }però la seva essència escapa

    de la nostra comprensió.
- id: 18948
  text: >-
    Som dos ignorants,

    tan despistats com al principi. {:delay 0E 01}{:clear }{:delay 81 00}Em temo que qualsevol món

    que intentes crear...
- id: 18949
  text: >-
    Un món teu...

    seria un imperi de la ignorància.{:delay 1A 01}{:clear }{:delay 1D 00}Per això la teva creació i tu

    esteu destinats al fracàs!
- id: 19117
  text: Potser no feia falta lluitar contra ell. {:delay 96 00}{:clear }{:delay 1E 00}Crec que va deixar l'Organització perquè
- id: 19118
  text: el que desitjava era conèixer-te.
- id: 19121
  text: >-
    L'amulet ens ha dut sort!

    Per fi ens trobem!{:clear }Tenia moltes ganes de veure't, Sora.

    Et trobava tant a faltar!
- id: 19122
  text: >-
    En el passat, la foscor em va vèncer,

    i et vaig trair. En què m'he convertit!{:clear }No estava segur de voler veure't,

    però la Kairi va insistir-hi.
- id: 19123
  text: >-
    És admirable que la Kairi i

    tu hagueu reconegut el Riku.{:clear }És idèntic a l'Ànsem. La primera vegada

    que el vaig veure, no podia creure-ho.
- id: 19124
  text: >-
    Llavors el que ens ajudava

    tota l'estona era el Riku.{:clear }Deveu ser millors amics per a què 

    canviés el seu aspecte per ajudar-vos!
- id: 19149
  text: >-
    Ens reunim amb el rei i la Kairi!

    I ara amb el Riku! Som invencibles!{:clear }Després de tot, el Riku també

    va ser escollit per la clau espasa.
- id: 19150
  text: >-
    L'any passat ens vam separar de

    tu i vam estar amb el Riku.{:clear }Llavors, ell es mostrava fred, però

    ara es nota que és el teu amic.
- id: 19151
  text: >-
    S'han desbloquejat totes les

    anotacions del Diari del Grill.{:clear }Continua la teva aventura fins aconseguir

    aillar-ne totes las incògnites.
- id: 19152
  text: >-
    Escolta'm, Kingdom Hearts! {:delay A2 00}{:clear }Sembla que haurem

    de començar de nou.
- id: 19153
  text: >-
    Ah, però tingues això present: {:delay 96 00}{:clear }{:delay 3C 00}et donaré tants cors

    com faci falta.
- id: 19154
  text: >-
    No te n'oblidis! {:delay 78 00}{:clear }{:delay 30 00}Mai estaràs complet sense mi,

    a l'igual que jo no ho estaré sense tu.
- id: 19349
  text: Busca la carta d'en Luxord!
- id: 19379
  text: >-
    Això et fa pensar en per

    què tenim por a la foscor.
- id: 19380
  text: Mira, allà.
- id: 19543
  text: Què!?
- id: 19546
  text: Utilitza Làser per destruir enemics distants!
- id: 19547
  text: Utilitza Drenatge per absorbir el foc enemic!
- id: 19571
  text: De pressa! Sense la teva ajuda, en Sora està perdut!
- id: 19572
  text: Utilitza Reflexe, per desviar el atacs làser!
- id: 19586
  text: Estan a punt d'atacar! Utilitza Acrobàcia per evitar-los!
- id: 19587
  text: Aquest lloc explotarà! La teva única esperança és utilitzar Acrobàcia!
- id: 19588
  text: Detén el nucli d'energia!
- id: 19589
  text: Compte amb els enemics que venen des de dalt!
- id: 19590
  text: Apropa't als edificis per utilitzar ordres de reacció!
- id: 19591
  text: Llença els enemics contra el nucli per danyar-lo!
- id: 19592
  text: Venç els enemics propers per obrir la barrera!
- id: 19593
  text: La barrera s'ha obert!
- id: 19601
  text: Energia carregada! Amb Megalàser, esclataràs un poderós atac!
- id: 19602
  text: Absorbeix els trets enemics amb {:icon dynamic-circle}, i acumularàs energia!
- id: 19603
  text: El nucli d'energia s'ha detingut!
- id: 19604
  text: Utilitza {:icon dynamic-circle} per saltar a l'aire i {:icon dynamic-square} per planar!
- id: 19605
  text: El Xemnas és a dalt de l'edifici!
- id: 19606
  text: >-
    Derrota el Xemnas!

    No li treguis la vista de

    sobre durant la batalla!
- id: 19607
  text: >-
    Ves a pel Xemnas!

    Utilitza ordres de reacció per obrir-t'hi pas!
- id: 19608
  text: >-
    Ves a pel Xemnas!

    Utilitza ordres de reacció per obrir-t'hi pas!
- id: 19609
  text: >-
    Llença els enemics contra el nucli per danyar-lo!

    Si és necessari, utilitza ordres

    de reacció per protegir-te!
- id: 19610
  text: >-
    Detén el nucli d'energia!

    No deixis d'atacar-lo!
- id: 19611
  text: >-
    Derrota el Xemnas!

    Utilitza les tàctiques que has après!
- id: 19612
  text: >-
    Derrota el Xemnas!

    Utilitza Làser per destruir

    enemics distants i Drenatge

    per absorbir el foc enemic!
- id: 19613
  text: >-
    Derrota el Xemnas!

    Utilitza {:icon dynamic-circle} per saltar repetidament i plana a l'aire amb {:icon dynamic-square}!

    Si utilitzes les ordres de reacció, la batalla serà més fàcil!
- id: 19618
  text: >-
    Derrota el Xemnas!

    Utilitza les tàctiques que has après!
- id: 19761
  text: El Món Inexistent
- id: 19933
  text: >-
    Són ordres. Per què les qüestiones?{:delay DC 00}{:clear }Sobretot tu, que mai has tingut pietat

    amb les ovelles desviades de l'Organització.
- id: 19934
  text: >-
    No és el cas!{:delay 50 00}{:clear }Ell no ens ha traït.

    És que no pot tornar encara!
- id: 19935
  text: >-
    Si no en torna,

    saps bé què has de fer.{:delay E6 00}{:clear } {:delay 3C 00}{:clear }Si no, atèn-ne les conseqüències.
- id: 19936
  text: Em convertireu en un foscant...
- id: 19937
  text: Entensos. Ho faré si és això el que voleu!
- id: 19938
  text: >-
    És que m'enganyen els ulls?

    De debò pot brandar la clau espasa?{:delay 4A 01}{:clear }Però si no és més que una criatura.
- id: 19939
  text: >-
    Dona-li una oportunitat.

    Ell no té miraments.{:delay FA 00}{:clear }Té un cor pur,

    no com tots nosaltres.
- id: 19940
  text: Més li val o no ens servirà de res.
- id: 19941
  text: Espero que estigui gaudint del viatget.{:delay FA 00}{:clear } {:delay 3C 00}{:clear }Potser li va bé una ajudeta amb el seu destí.
- id: 19942
  text: >-
    Mentre hi sortim guanyant nosaltres... {:delay 91 00}{:clear }Ja sabeu, que faci el que vulgui de 

    moment i ja entrarem en escena si cal.
- id: 19943
  text: >-
    Ningú diria que ets tu qui parla.{:delay AA 00}{:clear }Podem prendre les teves paraules com un 

    oferiment en cas que la cosa es torci? Eh?
- id: 19944
  text: >-
    Què!? Jo?... {:delay 62 00}{:clear }I ara, no soc el més adient per a això. 

    No hi estic còmode.
- id: 19945
  text: >-
    Actueu com si tinguéssiu consciència.{:delay AF 00}{:clear }Quan va ser l'última vegada que

    vam sentir la més mínima cosa?
- id: 19946
  text: Mai es digueren paraules més certes.{:delay AF 00}{:clear }Suposo que la diversió haurà d'esperar.
- id: 19947
  text: >-
    Sabeu què passa als qui perden

    de vista la seva meta?{:delay D7 00}{:clear }Que són consumits per ells mateixos.
- id: 19948
  text: Cavallers...
- id: 19949
  text: >-
    L'escollit de la clau espasa

    s'ha embarcat en una nova odisea.{:delay 77 01}{:clear }Assegurem-nos que en sigui una que mai oblidi.{:delay 2C 01}{:clear } {:delay 50 00}{:clear }I ara, marxeu.
- id: 19950
  text: >-
    Ja li he transmés el missatge.
    
    Tal i com volies.{:delay A5 00}{:clear }He dit a en Sora que segueixi

    combatent els sensecor.
- id: 19951
  text: >-
    Bé.{:delay 4D 00}{:clear } {:delay 37 00}{:clear }No només poseeixes el poder d'infligir

    mal als cors, sinó que també saps...{:delay D2 00}{:clear }sembrar les llavors del dubte en un cor receptiu.
- id: 19952
  text: >-
    D'aquí poc, en Sora començarà a dubtar de sí mateix.{:delay DC 00}{:clear } {:delay 0F 00}{:clear }El dubte el durà a la incertesa

    i aquesta desembocarà en ira. {:delay 9F 01}{:clear }Aquesta l'incitarà a desfer-se de les

    seves aprensions i seguir endavant.{:delay CC 01}{:clear } {:delay 28 00}{:clear }Aquest jovenet anirà aplanant el

    camí per al futur que tant anhelem.
- id: 19953
  text: M'agradaria fer-te una pregunta.
- id: 19954
  text: Sobre l'Axel.
- id: 19955
  text: >-
    Pobre neci... {:delay 82 00}{:clear }Quant més seguirà perseguint la il・lusió de

    l'amistat quan ni tan sols és capaç de sentir?{:delay C2 01}{:clear }Es capfica amb recuperar el que va perdre... {:delay FA 00}{:clear }quan ni tan sols deu haver

    arribat a existir en primer lloc.
- id: 19956
  text: >-
    No mereix res més que

    la nostra compassió.
- id: 19957
  text: >-
    En Sora ja sap la veritat. {:delay 93 00}{:clear } {:delay 62 00}{:clear }Amb cada sensecor que abat, {:delay 78 00}{:clear }s'apropa més a convertir-se en

    la nostra perfecta marioneta.
- id: 19958
  text: >-
    No ve d'aquí, no?{:delay 92 00}{:clear }Sigui com sigui,{:delay 8B 00}{:clear }en Sora no pot evitar salvar 

    la gent dels sensecor.{:delay 18 01}{:clear } {:delay 2D 00}{:clear }Sempre ha estat així. 

    Això és el que el seu pur i petit cor desitja.
- id: 19959
  text: >-
    Ja s'han llençat els daus.{:delay C8 00}{:clear } {:delay 14 00}{:clear }Tot està en marxa. 

    I ell no pot aturar-nos.
- id: 19960
  text: >-
    No vagis tan sobrat.{:delay 96 00}{:clear }Si la sort no et somriu amb els daus,

    podries acabar com el Demyx.
- id: 19961
  text: La gràcia recau en no saber, oi?{:delay A0 00}{:clear } {:delay 28 00}{:clear }Quin sentit té apostar si ja en saps el resultat?
- id: 19962
  text: >-
    Estàs totalment segur que derrotar-lo

    no es carregarà el pla de l'Organització?
- id: 19963
  text: Si es deixa morir tan fàcilment, {:delay E6 00}{:clear } {:delay 2D 00}{:clear }no ens serà gens útil.
- id: 19964
  text: >-
    Això és just el que volia sentir. {:delay 8E 00}{:clear }A més, jo no soc dels

    que s'empassa la saliva.
- id: 19965
  text: >-
    Això cada dia és més buit, eh?{:delay 96 00}{:clear }Pensava que seria divertit veure l'últim 

    espectàcle de l'Axel abans de la fi... {:delay 40 01}{:clear }però la cosa ha estat més

    tranquil・la del que m'esperava.
- id: 19966
  text: >-
    Potser hi estava preparat.{:delay 82 00}{:clear } {:delay 32 00}{:clear }Potser va arriscar la seva pròpia existència,

    aconseguint així quelcom que desitjava.
- id: 19967
  text: >-
    Para, para. Com ha de ser possible

    una cosa així? No existim, te'n recordes?{:delay 86 01}{:clear }El que acabes de dir va contra tota lògica.
- id: 19969
  text: Això és absurd.{:delay 46 00}{:clear } {:delay 0A 00}{:clear }Ni va guanyar res, ni ÉS res.
- id: 19971
  text: >-
    Però recorda que la debilitat té

    el poder de despertar allò que dorm.
- id: 19972
  text: >-
    Està clar que amb les seves accions,

    per molt absurdes que hagin arribat a ser, {:delay EA 01}{:clear }l'Axel ha arribat fins el cor d'en Sora. {:delay F0 00}{:clear }És possible que ell desperti a l'interior d'en Sora.
- id: 19973
  text: Per què no et rendeixes?
- id: 19974
  text: Au va, Sora. {:delay 6A 00}{:clear }Pensava que erets més fort.
- id: 19975
  text: >-
    Obre els ulls.

    Mira qui dels dos va guanyant.
- id: 19976
  text: O sigui que és cert. Ets el seu incorpori.{:delay EE 00}{:clear }Suposo que en DiZ tenia raó, després de tot.
- id: 19977
  text: De què parles?
- id: 19978
  text: Jo soc jo!{:delay 6E 00}{:clear }No ningú més!
- id: 19979
  text: Quantes vegades t'he de derrotar?
- id: 19980
  text: Molt bé. {:delay A4 00}{:clear }No em deixes cap altra alternativa.
- id: 19981
  text: Què?
- id: 19983
  text: Ho he acceptat.
- id: 19984
  text: DiZ... Ell podia sentir el Sora.
- id: 19985
  text: Vaja, o sigui que et va dir que «sentia»... {:delay B3 00}{:clear } {:delay 40 00}{:clear }Ridícul.
- id: 20360
  text: Potser apostava per la seva no existència...{:delay E6 00}{:clear }En qualsevol cas, va sortir-ne guanyant.
- id: 20361
  text: Oh, Axel, enredant fins al final.
- id: 20362
  text: >-
    No va poder aguantar la

    buidor d'ésser sense un cor. {:delay E6 00}{:clear }I això va acabar amb ell.
- id: 20363
  text: Era dèbil i neci.
- id: 20542
  text: >-
    Un nou rival ha aparegut i

    espera el Sora en un dels mons.
- id: 20549
  text: >-
    Derrota l'encaputxat!

    Fixa't en les ordres

    quan ataqui.
- id: 20616
  text: Prem {:icon dynamic-triangle} per començar el duel! Aprofita per atacar quan baixi la guàrdia!
- id: 21432
  text: Riku?
- id: 21433
  text: Volia agrair a la Naminé, però...
- id: 21436
  text: Ni de broma!
- id: 21437
  text: >-
    És massa d'hora! 

    No podeu dir de debò que us en defareu.
- id: 21438
  text: Els incorporis són incapaços de sentir.
- id: 21439
  text: Si hagués conegut el Sora, {:delay 74 00}{:clear }potser les coses haurien sigut diferents.
- id: 21440
  text: Zexión! Zexión!
- id: 21441
  text: Soc aquí. Què passa?
- id: 21442
  text: On és el Xemnas?
- id: 21443
  text: On sempre.
- id: 21444
  text: A la Cambra del Repòs?
- id: 21445
  text: Sí. Ves-hi i comprova-ho tu mateix.
- id: 21446
  text: No fa gràcia.
- id: 21447
  text: >-
    Suposo que no tinc altre opció que esperar.{:delay 82 00}{:clear }Però el temps apressa cada cop més.

    Què puc fer?
- id: 21448
  text: >-
    Per què mai és per aquí quan el necessito?

    És com si es tragués d'enmig a propòsit.
- id: 21451
  text: >-
    Si home! Faig el que haig de fer. {:delay 96 00}{:clear }Per a que ho sàpigues, ahir vaig

    trobar-ne un. Un tal 'Mar' no sé què.{:delay 4A 01}{:clear }Amb ell ja som onze a l'Organització.{:delay C3 00}{:clear }I com m'he deixat la pell en això, li he dit al

    Lexaeus que em substitueixi la resta del dia. {:delay 4A 01}{:clear }Vull descansar. Per a allò de demà,

    ja saps. Vull estar fresc com una rosa.
- id: 21452
  text: >-
    De debò? 

    Sent així, et deixo tranquil. {:delay D0 00}{:clear }Tinc asumptes a atendre. 

    Adeu.
- id: 21453
  text: Au va, home, no siguis així. {:delay 7C 00}{:clear }Queda't a xerrar. Què me'n dius?
- id: 21454
  text: >-
    Ja va sent hora que m'expliquis 

    el secret del Xemnas.
- id: 21456
  text: Ves al gra.
- id: 21457
  text: La Cambra del Repòs.
- id: 21458
  text: >-
    Allà és on passem tant de temps 

    investigant la foscor inherent en els cors.{:delay A0 00}{:clear }És un cementiri que va ser

    segellat per l'Ànsem el Savi.{:delay 18 01}{:clear }El primer que va fer el Xemnas

    només en desfer-se d'ell {:delay C8 00}{:clear }va ser tornar a obrir-lo i construir-hi 

    una sala a la part més profunda.{:delay E6 00}{:clear } {:delay 50 00}{:clear }D'ençà que hi passa llargs períodes tancat... 

    parlant amb algú.{:delay 4F 01}{:clear } {:delay 14 00}{:clear }I dubto que jo sigui l'únic que ho veu estrany... 

    sobretot perquè el Xemnas és sol a l'habitació!
- id: 21459
  text: >-
    Quina part del que he dit 

    dels tafaners no has entès?
- id: 21460
  text: >-
    Jo no ho diria tafanejar, 

    perquè no he sentit res del que deien. {:delay AF 00}{:clear }Tot i que em moro per saber-ho, això sí. {:delay 87 00}{:clear } {:delay 28 00}{:clear }No en sabràs res, per casualitat?
- id: 21461
  text: >-
    L'únic que sé és que prefereixo

    centrar-me en les meves obligacions. {:delay E6 00}{:clear }I tu hauries de fer el mateix.{:delay 64 00}{:clear }Hem de preparar les noves

    instal・lacions immediatament, {:delay BE 00}{:clear }i només en som onze a l'Organització.{:delay C8 00}{:clear }Està clar que necessitarem més efectius.
- id: 21462
  text: >-
    Quines instal・lacions? {:delay 8C 00}{:clear } {:delay 28 00}{:clear }Ah, parles del Castell de l'Oblit?{:delay AA 00}{:clear } {:delay 23 00}{:clear }Què és el que pensa fer

    el Xemnas amb aquell lloc?
- id: 21463
  text: Ell ja ens ha compartit les seves intencions.
- id: 21464
  text: >-
    Però oi que no saps que hi ha

    una cosa que no us ha compartit?
- id: 21465
  text: >-
    La Cambra del Repòs té una altra sala bessona,

    la Cambra del Despertar. {:delay 5E 01}{:clear } {:delay 14 00}{:clear }És un altre cementiri, per si t'ho preguntaves. {:delay C8 00}{:clear }I sé que no va ser construida pel Xemnas. {:delay 04 01}{:clear }I allà és on s'ho trobarà...
- id: 21466
  text: Allà és on trobarà el seu altre «amic».
- id: 21467
  text: Haig d'alliberar el poder del meu cor.{:delay DE 00}{:clear }El poder fosc que he estat contenint.
- id: 21468
  text: Tot i que... això em canviï per a sempre.
- id: 21470
  text: >-
    No podia fer-ho encara. {:delay 8C 00}{:clear }Almenys no fins que tot

    torni a ser com era.
- id: 21471
  text: >-
    Tranquil, ho aconseguirem. {:delay A0 00}{:clear }I quan ho fem, podràs

    agrair-li-ho tant com vulguis.
- id: 21472
  text: Sí!
- id: 21624
  text: >-
    Hem de tenir molt present que sent conscients 

    d'una cosa així ens serà més difícil de controlar.
- id: 21632
  text: Bé, a mi tampoc m'agrada aquell lloc.
- id: 21633
  text: I tu, Zexión? Què n'opines?
- id: 21634
  text: >-
    Que escoltar d'amagat és de tafaners i criatures.{:delay 78 00}{:clear }Què fas aquí? El Xaldin i tu teniu 

    la missió de reclutar nous membres.
- id: 21635
  text: >-
    Te n'has oblidat o simplement

    busques escapolir-te?
- id: 21636
  text: >-
    Quant ha passat ja?

    Parlo de quan uns quants guerrers {:delay 3B 01}{:clear }portant espases amb forma de clau

    es van presentar aquí i es van barallar? {:delay B4 00}{:clear } {:delay 1E 00}{:clear }I quan es va acabar tot, {:delay 96 00}{:clear }l'únic que van deixar-s'hi va ser un

    home sense memòria jaient a terra.
- id: 21637
  text: >-
    El Xemnas... {:delay A0 00}{:clear }vull dir, el Xehanort va ser trobat per l'Ànsem

    més o menys per aquelles dates, oi que sí?
- id: 21695
  text: Sí?
