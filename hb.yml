- id: 2935
  text: '{:unk06 02}{:unk13 A4 01 78 00}{:unk08 03 00 05}Ho hem aconseguit!'
- id: 2936
  text: >-
    {:unk13 96 00 3C 00}{:unk08 01 01 06}On heu

    estat?
- id: 2937
  text: '{:unk13 A4 00 3C 00}{:unk08 01 01 05}A veure, eh...'
- id: 2938
  text: >-
    {:unk13 B9 00 3C 00}{:unk08 01 01 05}Dins d'aquest ordinador

    hi ha un... món...{:clear }... on hi viuen uns... eh...

    programes i...
- id: 2939
  text: >-
    {:unk13 91 00 50 00}{:unk08 01 01 07}En altres paraules...{:clear }Sense la contrasenya

    no es pot accedir

    a les dades de...{:clear }les investigacions

    de l'Ansem.
- id: 2940
  text: '{:unk13 87 00 73 00}{:unk08 01 01 06}Crec que sí.'
- id: 2941
  text: >-
    {:unk13 A6 00 43 00}{:unk08 01 01 06}Però ja vau acabar

    amb l'Ansem...
- id: 2942
  text: >-
    {:unk13 90 01 9B 00}{:unk08 01 00 05}Òndia, pot ser

    que mai trobem

    la contrasenya.
- id: 2943
  text: '{:unk13 C8 00 32 00}{:unk08 01 01 06}O sigui...'
- id: 2944
  text: >-
    {:unk13 82 00 46 00}{:unk08 01 01 07}És com buscar una

    agulla en un paller.
- id: 2947
  text: '{:unk13 54 01 B4 00}{:unk08 01 00 05}Ella mai es rendirà...'
- id: 2948
  text: '{:unk06 02}{:unk13 72 01 C8 00}{:unk08 03 00 05}I nosaltres tampoc!'
- id: 2949
  text: >-
    {:unk13 C9 00 89 00}{:unk08 01 01 05}Som-hi, hem de trobar

    aquella contrasenya!
- id: 2950
  text: >-
    {:unk13 4A 01 50 00}{:unk08 01 00 05}Sí. Li ho vam

    prometre al Tron.
- id: 2952
  text: Què són aquests gargots?
- id: 2953
  text: Baluard... {:delay 5F 00}{:clear }{:delay 3C 00}Central... {:delay 4B 00}{:clear }{:delay 3C 00}{:clear }Seguretat, Tron... {:delay C8 00}{:clear }{:delay 37 00}{:clear }"Door to...
- id: 2954
  text: Sembla un diagrama o una cosa així.
- id: 2955
  text: '"Door To... Darkness"?'
- id: 2956
  text: Oh!
- id: 2957
  text: D!{:delay 2D 00}{:clear }{:delay 23 00}{:clear }T!{:delay 2D 00}{:clear }{:delay 23 00}{:clear }D!
- id: 2958
  text: DTD!
- id: 2959
  text: Què passa?
- id: 2960
  text: >-
    Mira això! Deu ser

    l'entorn de dades!{:delay B4 00}{:clear }{:delay 25 00}{:clear }DTD! No ho veus?

    Les sigles de "Door To Darkness"!
- id: 2961
  text: >-
    És clar! Però...

    ens segueix faltant la contrasenya.
- id: 2962
  text: >-
    Ei, nanos. Digueu-me.

    Algú ha dit "Door to Darkness"?
- id: 2963
  text: Majestat!
- id: 2964
  text: Us estàvem buscant!
- id: 2965
  text: >-
    Shhh! {:delay 23 00}{:clear }{:delay 50 00}{:clear }L'Organització podria

    estar escoltant-nos!
- id: 2966
  text: Parlàveu de la Porta a la Foscor?
- id: 2967
  text: Oh, és clar, senyor.{:delay 50 00}{:clear }{:delay 33 00}{:clear }Busquem la contrasenya secreta.
- id: 2968
  text: Contrasenya?
- id: 2969
  text: Ah, suposo que vols dir una clau.
- id: 2970
  text: >-
    Aviam, la Porta a la Foscor

    només pot obrir-se{:delay A3 00}{:clear }quan es reuneixen les Set Princeses.{:delay 6E 00}{:clear }Que són Blancaneus, Jasmín, Bella...
- id: 2971
  text: És clar...
- id: 2972
  text: Què és el que voleu fer?
- id: 2973
  text: >-
    Amb aquella contrasenya podriem

    accedir a les investigacions de l'Ansem.
- id: 2974
  text: >-
    Això vol dir...

    que potser descubriu el seu parador!
- id: 2975
  text: >-
    Deixi's de bromes, Majestat. {:delay 64 00}{:clear }{:delay 0F 00}{:clear }Ja vam derrotar l'Ansem,

    i vos ho sabeu.
- id: 2976
  text: >-
    Em sembla que tinc

    molt per explicar-vos.
- id: 2977
  text: Som tot orelles, Majestat!
- id: 2978
  text: >-
    Està bé, però abans

    tinc una pregunta...
- id: 2979
  text: Nois... no està el Tron esperant-vos?
- id: 2980
  text: >-
    No us preocupeu,

    no aniré enlloc.{:delay 8B 00}{:clear }Si aquells sensecor ataquen, seré aquí

    i m'ocuparé de fer-los-hi front.
- id: 2981
  text: És clar! Nosaltres també.
- id: 2982
  text: Llavors ja parlarem després.
- id: 2983
  text: Us ho prometo!
- id: 2984
  text: Ens veurem més tard!
- id: 2985
  text: ''
- id: 2986
  text: Cel・la
- id: 2987
  text: Torre I/O
- id: 2988
  text: "{:width 90}Nucli de l'ordinador central"
- id: 2989
  text: 'Guia de la cel・la #0'
- id: 2990
  text: 'Guia de la cel・la #1'
- id: 2991
  text: 'Guia de la cel・la #2'
- id: 2992
  text: 'Guia de la torre #0'
- id: 2993
  text: 'Guia de la torre #1'
- id: 2994
  text: 'Guia de la torre #2'
- id: 2995
  text: "Guia del nucli de l'ordinador central #0"
- id: 2996
  text: "Guia del nucli de l'ordinador central #1"
- id: 2997
  text: "Guia del nucli de l'ordinador central #2"
- id: 2998
  text: Sí
- id: 2999
  text: No
- id: 3000
  text: Selecciona un destí.
- id: 3001
  text: Vols transportar-te aquí?
- id: 7525
  text: No es pot anar per aquí.
- id: 8067
  text: Derrota tots els incorporis!
- id: 8068
  text: >-
    Derrota tots els incorporis!

    Si utilitzes els comandaments de reacció

    amb {:icon dynamic-triangle}, la batalla serà més fàcil!
- id: 8069
  text: Derrota tots els incorporis i protegeix les portes!
- id: 8070
  text: >-
    Lluita junt amb el Léon i venç tots els

    incorporis mentre protegeixes les portes!

    La batalla acaba si es buida l'indicador!
- id: 8071
  text: Derrota tots els enemics!
- id: 8072
  text: >-
    Derrota tots els enemics!

    Si utilitzes els comandaments de reacció

    amb {:icon dynamic-triangle}, la batalla serà més fàcil!
- id: 8073
  text: Derrota tots els enemics!
- id: 8074
  text: Derrota tots els enemics!
- id: 8075
  text: Derrota tots els sensecor!
- id: 8076
  text: >-
    Lluita junt amb els teus

    amics i derrota els sensecor!
- id: 8077
  text: Estàs atrapat! Derrota tots els sensecor per escapar!
- id: 8079
  text: Estàs atrapat! Derrota tots els sensecor per escapar!
- id: 8081
  text: Estàs atrapat! Derrota tots els sensecor per escapar!
- id: 8083
  text: Derrota tots els enemics!
- id: 8084
  text: >-
    Derrota tots els enemics!

    Si utilitzes els comandaments de reacció

    amb {:icon dynamic-triangle}, la batalla serà més fàcil!
- id: 8085
  text: Derrota els sensecor!
- id: 8086
  text: Utilitza les defenses de la ciutat per derrotar els sensecor!
- id: 8087
  text: Derrota els sensecor!
- id: 8088
  text: >-
    Lluita junt amb els teus

    amics i derrota els sensecor!
- id: 8148
  text: >-
    Un moment... Creia que tot

    estava sota control per aquí!
- id: 8149
  text: Eh, mireu!
- id: 8150
  text: >-
    Una altra cop l'Organització {XIII}.

    Hem d'anar a veure el Léon.
- id: 8151
  text: '{:unk13 90 01 18 01}{:unk08 01 00 01}Endavant!'
- id: 8152
  text: >-
    {:unk13 A0 00 6E 00}{:unk08 01 01 05}Un moment...{:clear }Què li ha passat

    a aquest lloc?
- id: 8153
  text: >-
    {:unk13 79 01 E1 00}{:unk08 01 00 04}Aquells sensecor no

    s'assemblaven als

    del món del Tron?
- id: 8154
  text: >-
    {:unk13 91 00 3C 00}{:unk08 01 01 06}Som-hi,

    entreu-hi!
- id: 8155
  text: "{:unk13 54 01 5A 00}{:unk08 01 01 06}Afanya't, Cid!"
- id: 8156
  text: "{:unk06 02}{:unk13 C8 00 50 00}{:unk08 03 01 06}Dona'm un segon!"
- id: 8157
  text: '{:unk13 96 00 41 00}{:unk08 01 00 05}Cagondena! Ràpid!'
- id: 8158
  text: '{:unk06 02}{:unk13 36 01 50 00}{:unk08 03 00 05}Perquè no...!'
- id: 8159
  text: '{:unk13 A5 00 9B 00}{:unk08 01 01 06}Què passa?'
- id: 8160
  text: >-
    {:unk13 A0 00 37 00}{:unk08 01 01 06}Sempre apareixeu en

    el moment exacte!
- id: 8161
  text: >-
    {:unk13 2C 01 37 00}{:unk08 01 01 06}El PCM está sembrant el

    caos dins l'ordinador.
- id: 8162
  text: '{:unk13 87 00 09 01}{:unk08 01 00 06}Un altre cop no!'
- id: 8163
  text: >-
    {:unk13 D2 00 37 00}{:unk08 01 01 06}Almenys això és

    el que creu el Léon...
- id: 8164
  text: >-
    Ha anat a l'estudi de l'Ansem a

    esbrinar què carai anava tot això.
- id: 8165
  text: >-
    Sembla que el PCM està

    utilitzant dades del sistema{:delay B4 00}{:clear }per crear més sensecor.
- id: 8166
  text: >-
    I, a més, s'està carregant tot el

    sistema de control de la ciutat.
- id: 8167
  text: >-
    [Necis usuaris

    Obeïu el PCM]
- id: 8168
  text: >-
    Aquest PCM no sap quan rendir-se,

    oi que no?
- id: 8169
  text: '{:unk13 85 00 35 00}{:unk08 01 01 06}Un programa mai es rendeix.'
- id: 8170
  text: '{:unk13 FA 00 91 00}{:unk08 01 00 05}Com li va al Tron?'
- id: 8171
  text: >-
    {:unk13 2C 01 55 00}{:unk08 01 01 06}No podem comunicar-nos amb ell.{:clear }Creiem que l'han forçat

    a anar a la xarxa de joc.
- id: 8172
  text: >-
    {:unk13 1E 01 3C 00}{:unk08 01 00 05}I no sembla que sigui un

    joc especialment divertit.
- id: 8175
  text: >-
    {:unk13 AF 00 37 00}{:unk08 01 01 06}Gràcies, xaval.{:clear }Estem preparant un programa

    d'Erradicació del PCM.{:clear }Em fa l'efecte que

    ja quasi està acabat.
- id: 8176
  text: >-
    {:unk13 F0 00 50 00}{:unk08 01 00 05}Tant de bo. Espero que

    tinguis raó aquesta vegada.
- id: 8177
  text: >-
    {:unk13 04 01 41 00}{:unk08 01 01 06}Escolteu, necessitarem l'ajuda

    del Tron quan aquell Erradicador

    estigui complet.
- id: 8178
  text: >-
    {:unk13 FA 00 8C 00}{:unk08 01 00 05}No us preocupeu.{:clear }Ens encarregarem

    d'avisar el Tron!
- id: 8179
  text: >-
    {:unk13 50 01 3A 00}{:unk08 01 00 04}Recordeu, nanos,

    comptem amb vosaltres.
- id: 8180
  text: '{:unk13 F5 00 AF 00}{:unk08 01 00 05}Entesos!'
- id: 8181
  text: '{:unk13 C6 00 39 00}{:unk08 01 00 05}Òndia, som nosaltres!'
- id: 8182
  text: >-
    {:unk13 AA 00 50 00}{:unk08 01 00 06}No podreu parlar amb el Tron si

    perdem el control d'aquesta sala.
- id: 8183
  text: >-
    {:unk13 FA 00 3C 00}{:unk08 01 01 06}Heu parlat

    amb el Cid?
- id: 8184
  text: '{:unk13 C8 00 6E 00}{:unk08 01 00 05}Sí.'
- id: 8185
  text: "{:unk13 40 01 2D 00}{:unk08 01 01 06}I l'Erradicador?"
- id: 8186
  text: '{:unk13 96 00 82 00}{:unk08 01 00 05}Està quasi llest.'
- id: 8187
  text: '{:unk13 C8 00 64 00}{:unk08 01 00 05}Genial!'
- id: 8188
  text: >-
    {:unk13 D2 00 50 00}{:unk08 01 00 05}Eh, Léon, per què no

    vas a ajudar el Cid?{:clear }Jo m'encarrego d'això.

    D'acord?
- id: 8189
  text: >-
    {:unk13 CF 00 43 00}{:unk08 01 01 07}N'estàs segura?

    Tu sola?...
- id: 8190
  text: >-
    {:unk13 F0 00 3C 00}{:unk08 01 01 07}... Ja, ho sento.

    Tot teu.
- id: 8191
  text: '{:unk13 FA 00 3C 00}{:unk08 01 00 05}Com està el Tron?'
- id: 8192
  text: >-
    {:unk13 F0 00 46 00}{:unk08 01 01 07}Seguim sense poder

    contactar amb ell.{:clear }Per què no ho

    intenteu vosaltres?
- id: 8193
  text: >-
    {:unk13 0E 01 3C 00}{:unk08 01 00 05}No, anirem a

    veure'l en persona.
- id: 8194
  text: >-
    {:unk13 A0 00 40 01}{:unk08 01 01 02}Llavors feu-me

    un favor.{:clear }Quan trobeu el Tron,

    digueu-li que vagi a la

    Torre I/O.{:clear }Allà hi carregarem el programa

    d'Erradicació del PCM.
- id: 8195
  text: >-
    {:unk13 8C 00 5A 00}{:unk08 01 00 05}La Torre I/O.

    Entesos!
- id: 8196
  text: >-
    {:unk13 E4 00 3F 00}{:unk08 01 01 07}Gràcies.

    I aneu amb compte.
- id: 8197
  text: >-
    [Necis usuaris

    Obeïu el PCM]
- id: 8198
  text: Aguanta, Tron, ja venim.
- id: 8199
  text: Has acabat?
- id: 8200
  text: >-
    Ho hauria fet, si no fos

    per aquest vell xaruc.
- id: 8201
  text: Vell xaruc, dius?
- id: 8202
  text: Estic intentant treballar!
- id: 8203
  text: >-
    Jo, jo, jo... Ja t'ensenyaré

    jo qui és un vell xaruc!
- id: 8204
  text: Ja està!
- id: 8205
  text: >-
    Té, Léon.{:delay 64 00}{:clear }{:delay 14 00}{:clear }Un programa casolà.

    Delicatessen màgica del vell xaruc.
- id: 8206
  text: Serà millor que funcioni.
- id: 8207
  text: Me'n vaig.
- id: 8208
  text: Estigues alerta!
- id: 8209
  text: >-
    Alerta.{:delay 4B 00}{:clear }{:delay 0F 00}Control d'usuari

    anul・lat indefinidament.
- id: 8210
  text: És inútil!
- id: 8211
  text: Léon, deixa-m'ho intentar.
- id: 8212
  text: Aquest és l'último avís.{:delay 5A 00}{:clear }{:delay 28 00}{:clear }Desistin.
- id: 8213
  text: Bon appetit!
- id: 8214
  text: I no parlis amb la boca plena!
- id: 8215
  text: Què... què hi estàs carregant?
- id: 8216
  text: >-
    Les coses s'estan

    calmant a la ciutat!{:delay 62 00}{:clear }{:delay 27 00}{:clear }Els únics sensecor que queden

    són els habituals de per aquí.{:delay 8A 00}{:clear }{:delay 30 00}{:clear }Fins i tot hi ha menys que abans.
- id: 8217
  text: >-
    Ara només cal tornar els

    nostres amics d'una peça.
- id: 8218
  text: Sou aquí!
- id: 8219
  text: Benvinguts!
- id: 8220
  text: Com va la ciutat?
- id: 8221
  text: De primera!
- id: 8222
  text: >-
    Tampoc hi ha rastre del PCM. Tot torna

    a la normalitat. Ho hem aconseguit.
- id: 8223
  text: Eh, i aquestes cares llargues?{:delay 78 00}{:clear }{:delay 19 00}{:clear }Què ha passat?
- id: 8224
  text: El Tron ha desaparegut.
- id: 8225
  text: I ens ha promès que el tornaríem a veure...
- id: 8226
  text: Què està passant?
- id: 8227
  text: >-
    Salut, amics.{:delay 3C 00}{:clear }El sistema és actiu i

    llest per a l'usuari.
- id: 8228
  text: Tron!
- id: 8229
  text: No m'oblideu.
- id: 8230
  text: Sí!
- id: 8231
  text: Oh, bufa! Oh, bufa!
- id: 8232
  text: Prou! Em fas pesigolles!
- id: 8233
  text: El Tron té pesigolles?
- id: 8234
  text: Què et sembla això?
- id: 8235
  text: Si us plau, para!
- id: 8236
  text: >-
    El Tron ha passat massa

    temps amb aquests nanos.
- id: 8237
  text: >-
    Espereu. Un moment.{:delay B1 00}{:clear }Vull ensenyar-vos una cosa que

    he trobat entre els arxius vells. {:delay B4 00}{:clear }És la ciutat tal i com es va construir.
- id: 8238
  text: És clar!{:delay 5A 00}{:clear }{:delay 19 00}{:clear }Ara me'n recordo.
- id: 8239
  text: Com en els vells temps!
- id: 8240
  text: >-
    Mmmm...{:delay 3C 00}{:clear }{:delay 19 00}{:clear }M'agradaria esbrinar quan{:delay 81 00}{:clear }aquesta ciutat va començar a ser coneguda

    per l'horrible nom de Baluard Balmat.
- id: 8241
  text: >-
    Abans, aquesta ciutat es

    deia d'una altra manera.
- id: 8242
  text: ''
- id: 8243
  text: Vergel Radiant.{:delay 6E 00}{:clear }{:delay 2D 00}{:clear }
- id: 8244
  text: On és la resta?
- id: 8245
  text: >-
    Ni idea. Tindran altres

    afers a atendre.
- id: 8246
  text: Quins afers?
- id: 8247
  text: >-
    Insinues que tenen qüestions

    més importants a preocupar-se{:delay 9C 00}{:clear }que el meu retorn?
- id: 8248
  text: >-
    A veure, vejam, hi ha una tal Organització {XIII}

    que no deixa d'entremetre-s'hi...
- id: 8249
  text: >-
    Deixa que aquells il・lusos

    segueixin amb el seu petit joc!
- id: 8250
  text: >-
    I què fem amb l'escanyolit de la clau

    espasa? També és un autèntic mal de cap.
- id: 8251
  text: Oh, de debò?
- id: 8252
  text: >-
    Molt bé doncs. Llavors més et val que m'expliquis

    què ha passat durant la meva abscència.
- id: 8253
  text: Que hi ha algú a casa?
- id: 8254
  text: Merlí!
- id: 8255
  text: El castell està en perill!
- id: 8256
  text: A què ve tant d'alderull?
- id: 8257
  text: Jo, jo! Sou vosaltres!
- id: 8258
  text: >-
    Veig que heu après molt des de

    l'última vegada que ens vam veure.
- id: 8259
  text: De debò?
- id: 8260
  text: En tenim una de grossa!{:delay 78 00}{:clear }És la Maléfica! Ha tornat! És aquí!
- id: 8261
  text: On? Al castell?
- id: 8262
  text: Sí! I s'hi ha dut els sensecor.
- id: 8263
  text: Vaja, vaja...
- id: 8264
  text: Haurà passat alguna cosa?
- id: 8265
  text: ''
- id: 8266
  text: Som-hi!
- id: 8267
  text: Carai! Heu trigat una mica, no?
- id: 8268
  text: >-
    Has estat tu qui ens

    ha invocat, Merlí?
- id: 8269
  text: >-
    Así es...{:delay 64 00}{:clear }{:delay 1E 00}{:clear }Pero me temo que he usado

    demasiado poder al hacerlo{:delay A5 00}{:clear }y esos infernales sincorazón...
- id: 8270
  text: ¿Qué ha pasado?
- id: 8271
  text: >-
    Mmm... pues que me he encontrado

    algo que os puede interesar.
- id: 8272
  text: ¡El libro de Pooh!
- id: 8273
  text: >-
    Eso es. {:delay 44 00}{:clear }Sé que eres un buen amigo

    de Winnie the Pooh, Sora,{:delay BD 00}{:clear }por eso os he invocado.
- id: 8274
  text: >-
    Cuando lo hice,

    me atacaron los sincorazón.{:delay B4 00}{:clear }Me defendí con hechizos

    bastante poderosos,{:delay D8 00}{:clear }pero temí que el libro hubiera

    sufrido daños, así que...{:delay E8 00}{:clear }{:delay 45 00}Esperad. Será mejor que avise

    a León y a los demás antes.{:delay C2 00}{:clear }Voy a buscarlos.

    Vuelvo al instante.
- id: 8275
  text: ¿Qué tal estará Pooh?
- id: 8276
  text: ¿Lo averiguamos?
- id: 8277
  text: ¡Sí!
- id: 8278
  text: ¡Sora!
- id: 8279
  text: Tú cúbreme, ¿vale?
- id: 8280
  text: ¡Sora! ¡Ven rápido!
- id: 8281
  text: ¿Donald?
- id: 8282
  text: ¿Has traído el libro, Sora?
- id: 8283
  text: ¡Eh!
- id: 8284
  text: ¡Devolvednos eso!
- id: 8285
  text: ¿Creéis que está bien?
- id: 8286
  text: >-
    ¡Ahí va! Quizá deberías volver y

    asegurarte de que Pooh está bien.
- id: 8287
  text: ¿Y qué hacemos con Merlín?
- id: 8288
  text: ¡Bah, ya le diremos algo!
- id: 8289
  text: ¡Vale!
- id: 8290
  text: >-
    {:unk13 AA 00 46 00}{:unk08 01 01 05}Era demasiada molestia

    esperar a un viejo mago, ¿no?
- id: 8291
  text: '{:unk13 96 00 50 00}{:unk08 01 01 06}Lo siento mucho...'
- id: 8292
  text: '{:unk13 2C 01 64 00}{:unk08 01 00 05}¿Cómo andan las cosas por allí?'
- id: 8293
  text: >-
    {:unk13 18 01 78 00}{:unk08 01 01 06}Bueno...{:clear }Pooh parece haberse

    olvidado de mí por completo.{:clear }Y no solo de mí, también

    de sus otros amigos.
- id: 8294
  text: >-
    {:unk13 FA 00 50 00}{:unk08 01 00 05}Era lo que

    me temía...
- id: 8295
  text: >-
    {:unk13 C8 00 64 00}{:unk08 01 00 04}Sospecho que está relacionado

    con las páginas que los

    sincorazón han robado.{:clear }Tendréis que recuperar las

    páginas arrancadas y reparar

    el libro para arreglar este lío.
- id: 8296
  text: >-
    {:unk13 B4 00 3C 00}{:unk08 01 01 05}Este libro es uno de los elementos

    más preciados del mundo.{:clear }Pensé decirle a León

    que lo había encontrado...{:clear }pero quizá debamos mantenerlo

    en secreto por ahora.
- id: 8297
  text: '{:unk06 02}{:unk13 A0 00 2C 01}{:unk08 03 01 02}¡Entendido!'
- id: 8298
  text: '{:unk06 02}{:unk13 72 01 64 00}{:unk08 03 00 05}¡Entendido!'
- id: 8299
  text: '{:unk06 02}{:unk13 6E 00 3C 00}{:unk08 03 01 06}¡Entendido!'
- id: 8300
  text: '{:unk13 94 00 5F 00}{:unk08 01 01 06}Perfecto.'
- id: 8998
  text: >-
    La sala del ordenador es por aquí.{:clear }Los ordenadores son delicados. Podéis

    tocarlos, pero no hagáis tonterías.
- id: 8999
  text: >-
    Si sigue así, destruirá el estudio antes

    de que encontremos la contraseña.{:clear }Lo siento, Sora, pero debes

    vigilar a esa chica.
- id: 9000
  text: >-
    Déjanos esto a nosotros. Tú

    concéntrate en los datos.{:clear }Usa la contraseña y trabaja con

    Tron para liberar los datos del DTD.
- id: 9001
  text: >-
    Echad una mano a {:theme 0A}Tron{:reset} hasta que

    el programa esté listo.{:clear }No os preocupéis,

    yo me encargaré de todo aquí.
- id: 9002
  text: >-
    Primero habrá que encontrar los

    datos de la investigación de Ansem.{:clear }Luego os explicaré todo.

    Por favor, tened cuidado.
- id: 9003
  text: >-
    {:theme 0A}El ordenador está ahí delante.{:reset}{:clear }Dentro, el camino se vuelve engañoso.

    Si os perdéis, caminad junto a la pared.
- id: 9004
  text: >-
    Busco a un tío con una gran espada.

    No, no tiene una cicatriz en la cara.{:clear }Tiene los ojos de un color extraño

    y trata de ocuparse él solo de todo.
- id: 9005
  text: >-
    León y los otros están en la zona

    residencial. Han ido a casa de Merlín.
- id: 9006
  text: >-
    Está bueno el helado de sal marina, ¿eh?

    ¡Pero no es momento de comer helados!{:clear }Ayudad a León y a los otros. Y no

    esperéis una recompensa a cambio.
- id: 9007
  text: >-
    Si os cruzáis con un hombre de pelo

    plateado y una larga espada, avisadme.{:clear }Su nombre es Sephiroth.

    Es mi enemigo más siniestro.
- id: 9008
  text: >-
    Parece que tus prendas se diseñaron

    para acumular energía cuando usas la magia.{:clear }No te contengas, pues

    tu magia se recupera enseguida.
- id: 9009
  text: >-
    El PCM ha vuelto los dispositivos

    de defensa contra nosotros.{:clear }Si te acercas a ellos, tendrás

    que esquivar sus ataques.
- id: 9010
  text: >-
    Será duro, pero si seguimos trabajando

    este mundo volverá a la normalidad.{:clear }Ahora eres libre de seguir tu camino.

    Ten cuidado, Sora.
- id: 9011
  text: >-
    ¿Has visto los dispositivos de defensa

    de la ciudad? Los llaman Claymore.{:clear }No tienen tanto poder como vosotros,

    pero si los usáis bien pueden...{:clear }ser de gran ayuda.
- id: 9012
  text: >-
    La sala del ordenador está más allá

    del {:theme 0A}postigo{:reset}. Ve con cuidado.
- id: 9013
  text: >-
    Lo siento. Acabar el programa de

    Erradicación del PCM tardará algo.{:clear }Mientras tanto, id y ayudad a Tron

    {:theme 0A}desde la sala del ordenador{:reset}.
- id: 9014
  text: >-
    León está en el patio interior.

    No os entretengáis, ¿vale?
- id: 9015
  text: >-
    Si vais hacia la derecha y subís las

    escaleras, llegaréis al patio interior.{:clear }Allí hay muchos sincorazón, así

    que preparaos bien en el mercado.
- id: 9016
  text: >-
    Como dije antes, esta ciudad posee

    dispositivos de defensa.{:clear }Pueden ser muy útiles. Luchar junto

    a ellos debería simplificaros las cosas.
- id: 9017
  text: >-
    ¡Nosotros vigilamos a los sincorazón!{:clear }¡Vuestro cometido es enfrentaros

    a ellos! ¡Buena suerte! ♪
- id: 9018
  text: >-
    El PCM está usando la máquina de

    fabricar sincorazón del estudio.{:clear }También tiene el control del sistema

    de defensa. Esto se pone feo.
- id: 9019
  text: >-
    Sé que Pooh y vosotros sois buenos amigos.{:clear }Deberíamos esperar a Merlín, pero me

    gustaría saber si Pooh está bien.
- id: 12075
  text: >-
    Todos arrimáis el hombro para salvar

    lo que consideráis importante.{:clear }Y seguís adelante porque estáis

    juntos. Sería difícil hacerlo solos.
- id: 12317
  text: ¡Maléfica! {:delay 64 00}{:clear }{:delay 28 00}{:clear }¡Maléfica!
- id: 12318
  text: Puede que sí hayan acabado con ella.
- id: 12319
  text: >-
    Oh, y este castillo no es lo que me

    esperaba. No tiene brillo ni nada.
- id: 12320
  text: ¿Qué pasará ahora con nuestro plan?
- id: 12321
  text: ¡Es Bastión Hueco!
- id: 12322
  text: ¡Ahí va! Ahora parece distinto.
- id: 12323
  text: Espero que León y su panda estén bien.
- id: 12324
  text: >-
    Oh, oh. Me parece que

    vamos a tener que pelear.
- id: 12325
  text: '{:unk06 02}{:unk13 0E 01 54 01}{:unk08 03 00 02}¿¡Tío Gilito!?'
- id: 12326
  text: '{:unk13 A5 00 55 00}{:unk08 01 00 06}¿Eh? ¿Quién...?'
- id: 12327
  text: >-
    {:unk13 3B 01 47 00}{:unk08 01 00 07}Es el tío de Donald... ¡un

    magnate de los negocios!{:clear }Antes de aparecer los sincorazón,

    viajaba por los mundos en

    una nave gumi con el rey.{:clear }Estaba ayudando a establecer

    un sistema de tráfico entre mundos.
- id: 12328
  text: '{:unk06 02}{:unk13 D7 00 54 01}{:unk08 03 01 01}¡Un sistema de tránsito!'
- id: 12329
  text: >-
    {:unk13 18 01 4B 00}{:unk08 01 00 06}¿Qué es

    ese jaleo?
- id: 12330
  text: >-
    {:unk13 18 01 4B 00}{:unk08 01 00 06}¡Vaya, pero si es Donald!{:clear }¡Y Goofy!

    ¡Hola, muchachos!{:clear }¡Eh, tenéis muy

    buen aspecto!
- id: 12331
  text: >-
    {:unk13 D5 00 55 01}{:unk08 01 01 01}Tú también,

    Tío Gilito.
- id: 12332
  text: >-
    {:unk13 F0 00 F5 00}{:unk08 01 01 01}Ay, no creáis...{:clear }No consigo reproducir

    el sabor de mi viejo helado

    favorito.{:clear }Ganaría una fortuna

    si pudiera...
- id: 12333
  text: '{:unk13 54 01 50 00}{:unk08 01 00 05}¡Malísimo!'
- id: 12334
  text: ¡Eh! ¿Qué pasa aquí?
- id: 12335
  text: >-
    Es el mecanismo de defensa

    de la ciudad.
- id: 12336
  text: ¡Yuffie!
- id: 12337
  text: ¡Cuidado!
- id: 12338
  text: ¡Hola, chicos!
- id: 12339
  text: Veo que seguís en plena forma.
- id: 12340
  text: ¿Qué esperabas? {:delay 55 00}{:clear }{:delay 0A 00}{:clear }Veo que a ti te va muy bien.
- id: 12341
  text: ¿Qué te esperabas tú?
- id: 12342
  text: ¿Qué tal los demás?
- id: 12343
  text: ¡Genial!
- id: 12344
  text: >-
    Oye, Yuffie,

    ¿has visto al rey y a Riku?
- id: 12345
  text: No.
- id: 12346
  text: >-
    Pero tenía la sensación

    de que os volvería a ver.
- id: 12347
  text: >-
    "Quizá no volvamos a vernos,

    pero jamás nos olvidaremos."
- id: 12348
  text: ¿Se supone que ese era León?
- id: 12349
  text: >-
    Todos están trabajando

    en casa de Merlín. {:delay AF 00}{:clear }{:delay 0A 00}{:clear }¡Vamos!
- id: 12350
  text: >-
    ¡El Comité de Reconstrucción

    de Bastión Hueco!
- id: 12351
  text: ¡Cuanto tiempo!
- id: 12352
  text: ¡Vaya! ¡Qué bien os veo!
- id: 12353
  text: Lo sabía.
- id: 12354
  text: ¿Qué sabías?
- id: 12355
  text: >-
    Hace poco, de repente, todos nos

    acordamos de vosotros. Todos a la vez.
- id: 12356
  text: >-
    ¿Os... acordasteis? {:delay 50 00}{:clear }{:delay 0A 00}{:clear }¡Espera! ¿Quieres decir que

    nos habíais olvidado?
- id: 12357
  text: ¡Gracias!
- id: 12358
  text: ¿Dónde habéis estado todo este tiempo?
- id: 12359
  text: Estábamos durmiendo.
- id: 12360
  text: ¿Dónde? ¿En una nevera?
- id: 12361
  text: >-
    ¡Qué más da! Es estupendo.

    ¡Todos juntos otra vez!
- id: 12362
  text: >-
    Oíd... mm... Estamos buscando a Riku

    y al rey. ¿Los habéis visto?
- id: 12363
  text: Ya veo.
- id: 12364
  text: >-
    Lo siento. Pero decidnos si podemos

    ayudar en algo, ¿vale?
- id: 12365
  text: Vale. Gracias.
- id: 12366
  text: No nos deis las gracias aún.
- id: 12368
  text: >-
    ¿Te refieres a los incorpóreos

    y a los sincorazón?
- id: 12369
  text: ¡Exacto!
- id: 12370
  text: >-
    Creo que os vendría

    bien nuestra ayuda.
- id: 12371
  text: Entonces, vamos al grano.
- id: 12372
  text: >-
    Sora, Donald, Goofy...{:delay 78 00}{:clear }Esperábamos que los tres pudierais

    echarnos una mano por aquí.
- id: 12373
  text: Como que íbamos a negarnos.
- id: 12374
  text: '{:delay 83 00}{:clear }Olvidaba con quién estoy hablando.'
- id: 12375
  text: ¡Eh! ¿Qué quieres decir con eso?
- id: 12376
  text: >-
    Tómatelo como uno de los

    cumplidos de León.
- id: 12377
  text: >-
    Seguidme hasta el patio interior.

    Hay algo que tenéis que ver.
- id: 12378
  text: >-
    ¡Oh! Imaginaba que erais vosotros.

    ¡Justo a tiempo!
- id: 12379
  text: ¡Es Merlín!
- id: 12380
  text: >-
    ¡Sora y sus compañeros

    nos van a ayudar!
- id: 12381
  text: ¡Estupendo! ¡Contamos con vosotros!
- id: 12382
  text: ¡Hecho!
- id: 12383
  text: >-
    Ah, sí. ¿Les has dado

    los carnés, querida?
- id: 12384
  text: ¡Oh!
- id: 12385
  text: >-
    Tomad...

    Son para vosotros.{:delay B4 00}{:clear }León pensó que os gustaría tenerlas.
- id: 12386
  text: >-
    ¡Miembro Honorífico del Comité de

    Reconstrucción de Bastión Hueco!
- id: 12387
  text: ¡Carnés de miembro!
- id: 12388
  text: Es genial, ¿eh?
- id: 12389
  text: Eh, gracias, León... ¿Eh?
- id: 12390
  text: >-
    ¡Oh, no! ¡Tenemos que irnos

    al patio interior!
- id: 12391
  text: Mirad eso.
- id: 12392
  text: ''
- id: 12393
  text: >-
    Queremos reconstruir Bastión Hueco

    para que sea como antes. {:delay C3 00}{:clear }{:delay 1E 00}{:clear }Puede que incluso mejor.
- id: 12394
  text: >-
    Queda mucho por hacer,

    pero podremos con todo...
- id: 12395
  text: Excepto... con eso.
- id: 12396
  text: Y eso.
- id: 12397
  text: Es cosa nuestra.
- id: 12398
  text: Me alegro de oír eso.
- id: 12399
  text: >-
    Dime, Sora...

    ¿tienes idea de lo que está pasando?
- id: 12400
  text: >-
    Hay un tal Pete que va por ahí

    tramando algo con los sincorazón.
- id: 12401
  text: >-
    Ese no sabe ni hacer

    la "o" con un canuto. {:delay B8 00}{:clear }Los que deben preocuparnos

    son los incorpóreos...
- id: 12402
  text: >-
    ¡Y los de esa

    Organización {XIII} también!
- id: 12403
  text: ¿Nos llamabais?
- id: 12404
  text: Lo estáis haciendo bien.
- id: 12405
  text: ¿Quiénes sois?
- id: 12406
  text: Esto es digno de celebración.
- id: 12407
  text: >-
    La llave espada...

    Un arma realmente maravillosa.{:delay FA 00}{:clear }{:delay 37 00}{:clear }Si estuviera en...

    manos más capaces...
- id: 12408
  text: ¡Dad la cara!
- id: 12409
  text: ¡La Organización {XIII}!
- id: 12410
  text: Bien. Así acabaremos con esto.
- id: 12411
  text: ¡Qué lástima! {:delay 78 00}{:clear }{:delay 19 00}{:clear }Creía que podríamos ser amigos...
- id: 12412
  text: ¡Alto!
- id: 12413
  text: ¿¡Qué pretendéis!?
- id: 12414
  text: Vaya. Vaya.
- id: 12415
  text: ¡Aparta!
- id: 12416
  text: ¿Te parece de buena educación{:delay 7D 00}{:clear }{:delay 19 00}{:clear }cerrarme el paso así?
- id: 12417
  text: ¡He dicho que te apartes!
- id: 12420
  text: >-
    Verás, eso funcionaría si...

    yo fuera un simple mequetrefe.
- id: 12429
  text: ¡Vaya!... {:delay 37 00}{:clear }{:delay 19 00}{:clear }Pues no lo sé.
- id: 12431
  text: ¡Espera!
- id: 12435
  text: Sí, tienes razón. ¡Solo hay un Sora!
- id: 12436
  text: >-
    ¡El Miembro Honorífico del Comité

    de Reconstrucción de Bastión Hueco!
- id: 12440
  text: Ahhh... Ya entiendo.
- id: 12445
  text: ¿Creéis que...?
- id: 12446
  text: Ahora parece que hay más sincorazón.
- id: 12447
  text: ''
- id: 12448
  text: Vamos a ver a los demás.
- id: 12449
  text: Estarán en casa de Merlín.
- id: 12450
  text: >-
    {:unk13 09 01 46 00}{:unk08 01 00 06}¡Ay! Estaba tan cerca

    de lograr ese sabor...
- id: 12451
  text: >-
    {:unk13 0E 01 46 00}{:unk08 01 00 06}¿Qué hay, muchachos?{:clear }León y sus amigos están

    en la zona residencial.{:clear }Sí, en casa de Merlín.
- id: 12452
  text: ¡Ah! ¡Cloud!
- id: 12453
  text: ¿Qué haces?
- id: 12454
  text: >-
    Iré a por él.{:delay 3C 00}{:clear }{:delay 3C 00}{:clear }Le pondré punto y final. {:delay 69 00}{:clear }{:delay 50 00}{:clear }Me enfrentaré a quien personifica

    todo lo oscuro que hay en mí.
- id: 12456
  text: Si es así, es por su culpa.
- id: 12457
  text: ¿De quién?
- id: 12458
  text: Sephiroth.{:delay 41 00}{:clear }{:delay 28 00}{:clear }Avisadme si le veis.
- id: 12459
  text: Vale. ¿Qué aspecto tiene?
- id: 12460
  text: >-
    Pelo plateado.

    Lleva una espada larga.
- id: 12461
  text: Claro.{:delay 3C 00}{:clear }Bueno, nos vemos, Cloud.
- id: 12462
  text: Tened cuidado.
- id: 12463
  text: >-
    Juega con la mente; pensaréis que

    la oscuridad es la única salida.
- id: 12464
  text: >-
    {:unk13 9B 00 46 00}{:unk08 01 01 07}Eh, chicos,

    llegáis justo

    a tiempo.{:clear }Tenemos buenas

    noticias para vosotros.{:clear }Debéis ir a

    ver a León.
- id: 12465
  text: '{:unk13 4A 01 91 00}{:unk08 01 00 05}¿Qué noticias?'
- id: 12466
  text: >-
    {:unk13 59 01 46 00}{:unk08 01 00 04}¡Encontramos el

    ordenador que estaba

    usando Ansem!
- id: 12467
  text: '{:unk13 A5 00 E6 00}{:unk08 01 00 05}¡Porras!'
- id: 12468
  text: >-
    {:unk13 C4 00 E6 00}{:unk08 01 01 02}Sí. Quizá consigamos acceso a

    información sobre los sincorazón

    y la Organización.
- id: 12470
  text: '{:unk13 90 01 AF 00}{:unk08 01 00 05}Y el rey.'
- id: 12471
  text: >-
    {:unk13 18 01 37 00}{:unk08 01 01 06}¡Por qué no vais a verlo

    vosotros mismos!
- id: 12472
  text: '{:unk13 FA 00 28 00}{:unk08 01 00 05}¡No muerde!'
- id: 12473
  text: '{:unk13 40 01 8C 00}{:unk08 01 00 05}¿Qué quieres decir?'
- id: 12474
  text: >-
    {:unk13 D2 00 32 00}{:unk08 01 01 06}Nada. Id a la sala de ordenadores,

    por el postigo del castillo.{:clear }¡Tened cuidado!
- id: 12476
  text: >-
    Tienen cosas que hacer

    en el postigo del castillo.
- id: 12477
  text: ¡Notición!
- id: 12478
  text: ¿Eh?
- id: 12479
  text: Vamos a informar.
- id: 12480
  text: ¿A quién?
- id: 12481
  text: ¡A nuestro líder, claro!
- id: 12482
  text: Sí, ya sabes, Maléfi...
- id: 12483
  text: No le hagáis caso.{:delay 3C 00}{:clear }{:delay 14 00}{:clear }Os aseguro... que venimos en paz.
- id: 12484
  text: Mentirosa...
- id: 12485
  text: ¿Algún problema?{:delay 3C 00}{:clear }{:delay 39 00}{:clear }Bueno, vale, habla tú.
- id: 12486
  text: ¡Siento mucho todo esto!
- id: 12487
  text: '{:unk06 02}{:unk13 4A 01 50 00}{:unk08 03 00 05}¡León!'
- id: 12488
  text: '{:unk13 64 00 64 00}{:unk08 01 00 05}¡Por aquí!'
- id: 12489
  text: >-
    {:unk13 A0 00 5A 00}{:unk08 01 01 05}¿Habéis encontrado

    el ordenador de Ansem?
- id: 12490
  text: >-
    {:unk13 B4 00 3C 00}{:unk08 01 01 07}Sí. El rey está muy

    interesado en él.
- id: 12491
  text: '{:unk13 DC 00 96 00}{:unk08 01 00 05}¿El rey?'
- id: 12492
  text: '{:unk13 95 00 2D 00}{:unk08 01 01 06}Está con León.'
- id: 12493
  text: >-
    {:unk06 02}{:unk13 8C 00 91 00}{:unk08 03 01 05}¡Por fin veremos

    al rey!
- id: 12494
  text: '{:unk06 02}{:unk13 A4 01 41 00}{:unk08 03 00 05}¡Hurra!'
- id: 12495
  text: >-
    {:unk13 86 01 B8 00}{:unk08 01 00 00}Eh...{:clear }¿Riku está

    con ellos?
- id: 12496
  text: >-
    {:unk13 BE 00 50 00}{:unk08 01 00 06}Bueno, al menos puedo

    preguntarle al rey

    sobre él.{:clear }Y ese ordenador

    tal vez podría

    decirnos algo.
- id: 12497
  text: '{:unk13 0E 01 2D 00}{:unk08 01 01 06}¡Buena idea!'
- id: 12498
  text: Ansem...
- id: 12499
  text: >-
    ¡Ahí va! Supongo que este

    debe de ser su cuarto.
- id: 12500
  text: ¿Dónde está el rey?
- id: 12501
  text: ¡Hola!
- id: 12502
  text: ¡Vosotros!
- id: 12503
  text: >-
    Estoy buscando a alguien. ¿Habéis

    visto a un tío con el pelo de punta?
- id: 12504
  text: '{:delay 32 00}Más de punta.'
- id: 12505
  text: Dejadme que eche un vistazo.
- id: 12506
  text: Siento las molestias.
- id: 12507
  text: No es molestia, señorita.
- id: 12508
  text: Ya era hora.
- id: 12509
  text: ¡León!
- id: 12510
  text: >-
    {:unk13 4A 01 73 00}{:unk08 01 01 06}¿El rey no

    está contigo?
- id: 12512
  text: '{:unk06 02}{:unk13 18 01 C3 00}{:unk08 03 01 06}¡Eh!'
- id: 12513
  text: >-
    {:unk13 37 01 34 00}{:unk08 01 00 05}Bueno, quizá esto calme

    vuestra impaciencia.
- id: 12514
  text: >-
    {:unk13 AA 00 50 00}{:unk08 01 01 06}La sala de ordenadores

    de Ansem.
- id: 12515
  text: ¡Aquí está!
- id: 12516
  text: ¿Dónde están Kairi... y Riku?
- id: 12517
  text: Tranquilo. {:delay 3C 00}{:clear }{:delay 23 00}{:clear }¿Es que quieres romperlo?
- id: 12518
  text: Oh... lo siento. {:delay 5A 00}{:clear }{:delay 12 00}{:clear }Creo que me he emocionado.
- id: 12519
  text: ¡Baja de ahí!
- id: 12520
  text: >-
    Atención, usuario.

    Esto es una advertencia.{:delay DF 00}{:clear }Si prosigue el mal uso de

    este terminal se accionarán{:delay 78 00}{:clear }medidas defensivas de inmediato.
- id: 12521
  text: ¿Quién anda ahí?
- id: 12522
  text: Soy el Programa de Control Maestro.{:delay 73 00}{:clear }{:delay 14 00} {:clear }Yo superviso este sistema.
- id: 12523
  text: ¿Dónde estás?
- id: 12524
  text: ¡Donald!
- id: 12525
  text: Perdón...
- id: 12526
  text: >-
    Punto de decisión alcanzado.

    Estáis arrestados.
- id: 12527
  text: ¿¡Arrestados!?
- id: 12528
  text: ¡Corred!
- id: 12529
  text: >-
    {:unk13 6E 00 78 00}{:unk08 01 00 05}¿Que estáis

    buscando qué?
- id: 12530
  text: >-
    {:unk13 89 00 BB 00}{:unk08 01 01 02}¡Anda!

    ¡Un cuarto secreto!{:clear }Será mejor

    que eche otro

    vistazo.
- id: 12531
  text: Con permiso.
- id: 12532
  text: Bueno, se acabó.
- id: 12533
  text: Mirad.
- id: 12534
  text: Tron... no te rindas.
- id: 12535
  text: Bueno, ¿por dónde empezamos?
- id: 12536
  text: ¡Ya sé! ¡Vamos a acceder al DTD!
- id: 12537
  text: >-
    El rey está comprobando la

    situación en la ciudad.{:delay 78 00}{:clear }Volverá pronto.

    No os preocupéis. {:delay 75 00}{:clear }{:delay 39 00}{:clear }Eh, mirad, nos pide una contraseña.
- id: 12538
  text: ¡Eso es fácil! Es...
- id: 12539
  text: ¡Sora!
- id: 12540
  text: ¡Donald!
- id: 12541
  text: ¡Goofy!
- id: 12542
  text: Pues... así es.
- id: 12543
  text: ¿Y bien?
- id: 12544
  text: Magnífico. Entramos.
- id: 12545
  text: >-
    Tengo que ir a la ciudad. {:delay 5F 00}{:clear }{:delay 19 00}{:clear }Quiero ver qué ha hecho

    esa última sacudida.
- id: 12546
  text: >-
    ¿No vas a consultar los datos?

    No han sido nada fáciles de conseguir.
- id: 12547
  text: >-
    Ahora mismo vuelvo. {:delay 46 00}{:clear }{:delay 46 00}{:clear }Eh, Sora... ¿por qué no empiezas

    a cargarlos y a copiarlos?
- id: 12548
  text: >-
    Solo hay que teclear un

    poco. Es fácil, ¿no?
- id: 12549
  text: ¿Ha funcionado?
- id: 12550
  text: Oye, estas cosas llevan su tiempo.
- id: 12551
  text: ¡Oh! {:delay 3C 00}{:clear }¡Está haciendo algo!
- id: 12552
  text: ''
- id: 12553
  text: >-
    Creo que quiere saber

    qué estamos buscando.
- id: 12554
  text: ¡Riku y Kairi!
- id: 12555
  text: '[Error de datos]'
- id: 12556
  text: Nada...
- id: 12557
  text: >-
    Ni siquiera el ordenador

    de Ansem lo sabe.
- id: 12558
  text: ¿Qué estás haciendo?
- id: 12559
  text: >-
    Le pregunto al ordenador si puede

    hablarnos de esos incorpóreos.
- id: 12560
  text: '[Estudios sobre incorpóreos. Informes Ansem.]'
- id: 12561
  text: ¿Qué es esto?
- id: 12562
  text: Los datos están dañados.
- id: 12564
  text: ¿Qué tal la Organización?
- id: 12565
  text: ¡Mirad!
- id: 12566
  text: ¡Estúpido ordenador!
- id: 12567
  text: ¡Sora!
- id: 12568
  text: ''
- id: 12569
  text: ¿Quién es este tío?
- id: 12570
  text: >-
    Bueno, veo que habéis

    hecho que funcione.
- id: 12571
  text: ¡Oh! ¡Majestad!
- id: 12572
  text: >-
    Bien hecho. {:delay 3A 00}{:clear }El ordenador nos dirá todo

    lo que necesitamos saber.
- id: 12573
  text: >-
    Pero siempre dice que los datos

    están todos pachuchos.
- id: 12574
  text: >-
    Solo tenemos la foto de

    un tío que no conocemos.
- id: 12575
  text: ¡Ansem el Sabio!
- id: 12576
  text: ¿Nos estáis tomando el pelo?
- id: 12577
  text: >-
    ¿Habéis olvidado qué aspecto

    tenía Ansem, Majestad?
- id: 12578
  text: ¡Claro que no! Ese es él. {:delay 68 00}{:clear }¡Estoy seguro!
- id: 12580
  text: >-
    Disculpad, ¿podéis venir

    por aquí, por favor?
- id: 12581
  text: >-
    Mirad, este es Ansem. {:delay 78 00}{:clear }{:delay 25 00}{:clear }Ya sabéis, ese al que tanto

    nos costó derrotar.
- id: 12582
  text: >-
    Oh, es verdad.

    No terminé de explicarme.
- id: 12583
  text: ''
- id: 12584
  text: >-
    El hombre de la foto es, sin duda, {:delay 7C 00}{:clear }el que intentó hacerse con el reino;{:delay 7C 00}{:clear }a quien vosotros derrotasteis. {:delay 7F 00}{:clear }Pero no luchabais contra él,

    sino contra su sincorazón.{:delay 44 01}{:clear }En realidad no era Ansem; {:delay 8F 00}{:clear }iba por ahí diciéndole a todo

    el mundo que lo era.
- id: 12585
  text: Entonces...
- id: 12586
  text: ¿Quéeee?
- id: 12587
  text: >-
    ¿Luchamos tanto solo para

    derrotar a un impostor?
- id: 12589
  text: ¡No me lo puedo creer!
- id: 12590
  text: >-
    Eh... Me estoy haciendo un lío. {:delay 8C 00}{:clear }Si es un farsante,

    ¿qué le pasó al verdadero Ansem?
- id: 12591
  text: >-
    Bueno, eso es lo que

    intento averiguar.
- id: 12592
  text: >-
    Ansem el Sabio debe de saber todo sobre

    los planes de la Organización {XIII}{:delay FC 00}{:clear }y lo que le está pasando a los mundos.
- id: 12593
  text: Estoy seguro de que nos ayudará.
- id: 12594
  text: >-
    ¿Sabéis? Estuve a punto de

    encontrarle una vez...
- id: 12595
  text: ''
- id: 12596
  text: ¡No me digáis que hay más!{:delay 5A 00}{:clear }{:delay 2E 00}{:clear }¡Ya estoy bastante perdido!
- id: 12597
  text: >-
    Vamos a ver...{:delay 5E 00}{:clear }Un tipo llamado Ansem,

    que no era realmente Ansem,{:delay DE 00}{:clear }se convirtió en un sincorazón.{:delay 74 00}{:clear }Entonces, ¿también se creó

    un incorpóreo cuando pasó eso?
- id: 12598
  text: ¡Sí!
- id: 12599
  text: >-
    Y ese incorpóreo es el

    líder de la Organización.
- id: 12600
  text: ¿Quéeee?
- id: 12601
  text: >-
    Sé que he visto antes

    a ese Ansem "falso"{:delay 90 00}{:clear }y también he visto al líder

    de la Organización {XIII}.
- id: 12602
  text: Era como estar con el mismo tipo.
- id: 12603
  text: Pero... ¿dónde visteis a ese tipo?
- id: 12604
  text: ¡Vaya! {:delay 32 00}{:clear }{:delay 34 00}{:clear }No me acuerdo.
- id: 12605
  text: >-
    Ansem el Sabio...{:delay 64 00}{:clear }El verdadero Ansem... Él debe de saber

    la verdadera identidad del impostor.{:delay 07 01}{:clear }Por eso tengo que encontrarle

    y preguntárselo.
- id: 12606
  text: ¡Tú! {:delay 3C 00}{:clear }{:delay 2D 00}{:clear }¡Tú empezaste todo esto! {:delay 54 00}{:clear }{:delay 4E 00}{:clear }Por tu culpa, Riku y Kairi...
- id: 12607
  text: >-
    {:delay 30 00}{:clear }Majestad...

    ¿sabéis dónde está Riku?
- id: 12608
  text: Él... {:delay 3C 00}{:clear }{:delay 54 00}{:clear }Lo siento. {:delay 48 00}{:clear }No sé nada.
- id: 12609
  text: ¿De verdad, Majestad? {:delay 42 00}{:clear }{:delay 30 00}{:clear }¿Estáis seguro?
- id: 12610
  text: Lo siento, Sora.
- id: 12611
  text: >-
    ¿Y qué pasa con Kairi? {:delay 3C 00}{:clear }{:delay 2A 00}{:clear }¡Quizá la Organización

    la haya secuestrado!
- id: 12612
  text: ¡Oh, no!
- id: 12613
  text: Sora, Donald, Goofy...
- id: 12614
  text: >-
    Pensaba ir a pedir ayuda

    a Ansem el Sabio, {:delay A8 00}{:clear }{:delay 1C 00}{:clear }pero me he dado cuenta de que

    he olvidado algo muy importante.
- id: 12615
  text: >-
    Ayudar a los demás es más necesario

    que pedir ayuda a los demás.
- id: 12616
  text: >-
    Estamos sanos y salvos...

    ¡y somos libres!
- id: 12617
  text: >-
    Lo principal es prestar ayuda

    a un amigo en apuros.
- id: 12618
  text: >-
    Iremos juntos a buscar

    a Riku y a Kairi.
- id: 12620
  text: ¡Algo pasa!
- id: 12621
  text: >-
    Hablando de ayudar... ¡parece que se

    nos necesita aquí!
- id: 12622
  text: >-
    ¡Escuchad, mis sincorazón!{:delay 8A 00}{:clear }¡Atacad a esos pellejos blancos!

    ¡Aniquiladlos!
- id: 12623
  text: >-
    ¿Qué? ¿Estás loca?

    ¡No ganaremos jamás! {:delay B4 00}{:clear }¡No se tú, pero yo me largo!
- id: 12624
  text: ¡Eres un cobarde patético!
- id: 12625
  text: ''
- id: 12626
  text: >-
    ¡Sincorazón! {:delay 42 00}{:clear }¡Dejad a los blancos!

    ¡Concentraos en Sora y sus amigos!
- id: 12627
  text: ¡Oh, oh!
- id: 12628
  text: ¿Dónde está Maléfica?
- id: 12629
  text: Me parece que ha huido.
- id: 12630
  text: >-
    Pues eso es bastante

    cutre por su parte.
- id: 12631
  text: >-
    Creo que nos hemos

    equivocado de bando.
- id: 12632
  text: >-
    Mmm... Si queréis elegir bando,{:delay 90 00}{:clear }¿por qué no os aliáis con León?

    Siempre necesita ayuda.
- id: 12633
  text: ¿Ese tal León tiene algún tesoro?
- id: 12634
  text: ¡Sí, montones de cosas!
- id: 12635
  text: ¡Perfecto!
- id: 12636
  text: Vamos.
- id: 12637
  text: ¿Quiénes sois?
- id: 12638
  text: Nadie que merezca la pena.
- id: 12639
  text: Solo tres fanáticas de los tesoros.
- id: 12640
  text: ¡Nos vemos, chicos!
- id: 12641
  text: ¿De verdad tiene León un tesoro?
- id: 12643
  text: ¡No tenemos tiempo para esto!
- id: 12644
  text: ''
- id: 12645
  text: ¡Sora, es Sephiroth!
- id: 12646
  text: ¿No se supone que Sephiroth es {:delay 74 00}{:clear }la parte oscura del corazón de Cloud?
- id: 12647
  text: ¿Cloud os ha contado eso?{:delay D2 00}{:clear }{:delay 2D 00}{:clear }Ya debe de ser consciente de todo.
- id: 12648
  text: ¿Qué piensas hacerle?
- id: 12649
  text: >-
    Nada.{:delay 7C 00}{:clear }Cloud es quien

    ansía la oscuridad.
- id: 12650
  text: Dijo que tenéis asuntos pendientes.
- id: 12651
  text: Ya veo...{:delay 3C 00}{:clear }{:delay 6E 00}{:clear }Quiere volver a verme.
- id: 12652
  text: Pues le daré lo que quiere.
- id: 12653
  text: >-
    El último rayo de luz

    es el más difícil... de apagar.
- id: 12654
  text: ¡Os ayudaremos!
- id: 12655
  text: ¡Sora! ¡Por detrás!
- id: 12657
  text: >-
    El rey está en el patio interior.

    ¡Dirigíos hacia allí!
- id: 12658
  text: ¡Entendido!
- id: 12659
  text: ''
- id: 12660
  text: ¿Crees que podrás con tantos?
- id: 12661
  text: Bueno...{:delay 6E 00}{:clear }Será duro si aparece uno más.
- id: 12662
  text: '{:delay 87 00}{:clear }Entonces yo me encargaré de él.'
- id: 12663
  text: ¿Qué? ¿También pretendes luchar?
- id: 12664
  text: ¡Sephiroth!
- id: 12665
  text: >-
    Tengo entendido que

    me estabas buscando.
- id: 12666
  text: >-
    Sí.{:delay 2D 00}{:clear }{:delay 23 00}{:clear }Cuando me libre de ti,

    la oscuridad desaparecerá.
- id: 12667
  text: >-
    ¿Y querrás hacerlo? {:delay 5A 00}{:clear }{:delay 28 00}{:clear }Esa oscuridad surge de

    tus propios recuerdos. {:delay B4 00}{:clear }{:delay 32 00}{:clear }¿Crees que puedes borrar tu pasado?
- id: 12668
  text: ¡Calla!
- id: 12669
  text: >-
    Reconócelo. Has dado la espalda al

    presente y vives en el pasado, {:delay 33 01}{:clear }{:delay 28 00}{:clear }porque la luz del presente

    es muy fuerte.
- id: 12670
  text: ¡Tú no me conoces!
- id: 12671
  text: ¡Cloud!
- id: 12672
  text: Lo sé, porque...{:delay A8 00}{:clear }{:delay 25 00}{:clear }yo soy tú.
- id: 12673
  text: ¡Cloud! ¡Espera!
- id: 12674
  text: ¡León! ¡Chicos! ¡Aguantad!
- id: 12675
  text: >-
    Bien, chicos, tenéis que ir

    a buscar a Riku y a Kairi.
- id: 12676
  text: >-
    ¡León y los otros también

    son nuestros amigos!
- id: 12677
  text: >-
    No te preocupes,

    aquí ya hay mucha ayuda.{:delay 78 00}{:clear }Nosotros nos encargamos

    de esta batalla.
- id: 12678
  text: Pero... ¡se lo prometí a León!
- id: 12679
  text: ¡Donald! ¡Goofy! {:delay 5A 00}{:clear }¡Coged a Sora y marchaos!
- id: 12680
  text: >-
    Riku, Kairi... dadme

    un poco de tiempo, ¿vale?
- id: 12681
  text: ¡Majestad!
- id: 12682
  text: >-
    Entendido. Partiremos en

    busca de Riku y de Kairi.
- id: 12683
  text: Bien. ¡Id con ciudado!
- id: 12684
  text: ¡Lo mismo digo, Majestad!
- id: 12685
  text: ¡Esperad, chicos!
- id: 12686
  text: ¡Sora, obedece!
- id: 12687
  text: ¡Vendrás con nosotros, te guste o no!
- id: 12688
  text: ¡Vamos, Sora! Tienes que ser bueno.
- id: 12689
  text: De acuerdo.
- id: 12690
  text: ¡Vámonos pitando!
- id: 12691
  text: ¡Adelante!
- id: 12692
  text: ¡Lo siento, Majestad!
- id: 12693
  text: ''
- id: 12694
  text: ¡Espero que nos perdonéis!
- id: 12695
  text: ¡Eh, chicos, se os ve muy animados!
- id: 12696
  text: ¡Date el piro!
- id: 12697
  text: >-
    ¿No estabas tú trapicheando

    en el Inframundo? {:delay CC 00}{:clear }¿Cómo ha entrado un pardillo

    semejante en la Organización {XIII}?
- id: 12698
  text: Seguro que ni sabes luchar.
- id: 12699
  text: ¡Pero nosotros sí!
- id: 12700
  text: >-
    No hay que juzgar a nadie

    por las apariencias.
- id: 12701
  text: >-
    Uughh... Mira que les dije que

    no me liaran en este marrón...
- id: 12702
  text: ¿Quién es este pirado?
- id: 12703
  text: >-
    Recuerda que la Organización está

    compuesta por incorpóreos.
- id: 12704
  text: Ya... ¡sin corazón!
- id: 12705
  text: >-
    ¡Sí que tenemos corazón!

    No seáis así...
- id: 12706
  text: ¡No nos engañas!
- id: 12707
  text: ¡Silencio, traidor!
- id: 12708
  text: >-
    ¿Alguien de la Organización

    quiere ser el próximo?
- id: 12709
  text: ¡Eh! ¡Sora!
- id: 12710
  text: ¡No les provoques!
- id: 12711
  text: >-
    Sí, tenemos que ayudar

    a nuestros amigos.
- id: 12712
  text: Oh. Perdón.
- id: 12713
  text: ¡Vámonos!
- id: 12714
  text: ¡Ajá! ¡Estáis aquí!
- id: 12715
  text: Tenéis muchos amigos a los que ayudar.
- id: 12716
  text: >-
    ¡Así que será mejor unir fuerzas y

    acabar con esta batalla de una vez!
- id: 12717
  text: ¡Sí, Majestad!
- id: 12718
  text: ¡Cuidado!
- id: 12719
  text: ¡Goofy!
- id: 12720
  text: No...
- id: 12721
  text: >-
    ¡Ey! ¡Eres el Capitán del rey!

    ¡Tienes que levantarte!
- id: 12722
  text: ¡Vamos, despierta!
- id: 12723
  text: ¡Goofy, es hora de comer!
- id: 12724
  text: ¡Goofy!...
- id: 12725
  text: Goofy...
- id: 12726
  text: Esto no está sucediendo...{:delay 3C 00}{:clear }{:delay 3C 00}{:clear }No puede ser verdad...{:delay 4B 00}{:clear }{:delay 28 00}{:clear }No puede...
- id: 12727
  text: Pagarán por esto.
- id: 12728
  text: ¿Estás bien?
- id: 12729
  text: Sí, estoy bien, pero...
- id: 12730
  text: Oohh... ¡Goofy!
- id: 12731
  text: ¡Hola, chicos!
- id: 12732
  text: ¡Goofy!
- id: 12733
  text: Oye, eso ha dolido un montón.
- id: 12734
  text: ¡Ahhh, Goofy!
- id: 12735
  text: >-
    Ay, Majestad, siempre me

    acaban dando en el coco.
- id: 12736
  text: ''
- id: 12737
  text: ''
- id: 12738
  text: Eso duele también.
- id: 12739
  text: ¡No vuelvas a hacer eso nunca más!
- id: 12740
  text: ¿Eh?
- id: 12741
  text: ¿Qué les pasa?
- id: 12742
  text: ¡Eh!
- id: 12743
  text: ¡Es el tipo ese que no es Ansem!
- id: 12744
  text: ¡Quieres decir su incorpóreo!
- id: 12745
  text: El líder de la Organización {XIII}...
- id: 12746
  text: ¡Un momento! ¡Ahora lo entiendo!
- id: 12747
  text: Sabio Ansem,{:delay 54 00}{:clear }vengo a pedir su consejo.
- id: 12748
  text: >-
    Me alegra tener la oportunidad

    de hablar así, amigo mío.{:delay D2 00}{:clear }{:delay 20 00}{:clear }Estoy intrigado con tu hipótesis...{:delay 9C 00}{:clear }y me resulta difícil contener las ansias

    de ponerla a prueba.{:delay 0C 01}{:clear }Aun así...{:delay 48 00}{:clear }me preocupa la

    estabilidad de los mundos.
- id: 12749
  text: Sí, a mí también me preocupa.
- id: 12750
  text: >-
    Las puertas que han aparecido...{:delay 78 00}{:clear }{:delay 28 00}{:clear }El lugar que buscan los sincorazón...{:delay 78 00}{:clear }{:delay 46 00}{:clear }Temo que mi investigación

    haya provocado todo esto...
- id: 12751
  text: >-
    Maestro Ansem.{:delay 48 00}{:clear }Con respecto al experimento que

    le presenté el otro día...{:delay 99 00}{:clear }{:delay 18 00}{:clear }con su permiso, quisiera continuar...
- id: 12752
  text: >-
    ¡Lo prohíbo!{:delay 38 00}{:clear }{:delay 29 00}{:clear }Olvida lo dicho de las puertas y

    el corazón de todos los mundos.{:delay C6 00}{:clear }¡Ese lugar no debe ser profanado!
- id: 12753
  text: >-
    Pero, maestro Ansem...

    he estado pensando...
- id: 12754
  text: Xehanort...{:delay 50 00}{:clear }{:delay 2D 00}{:clear }Será mejor olvidarse de todo eso.
- id: 12755
  text: ¡Ya me acuerdo!{:delay 4E 00}{:clear }¡Es Xehanort!{:delay 3C 00}{:clear }¡El aprendiz de Ansem!
- id: 12756
  text: >-
    ¡El líder de la Organización {XIII}

    es el incorpóreo de Xehanort!
- id: 12757
  text: ¡Vamos!
- id: 12758
  text: ¡Largaos!
- id: 12759
  text: ¡Hay que ir a por Xehanort!
- id: 12760
  text: ¡Eso!
- id: 12761
  text: ¿Y el rey?
- id: 12762
  text: ¡Allí está!
- id: 12763
  text: ¡Vamos!
- id: 12764
  text: ¡Majestad!
- id: 12765
  text: ¡Xehanort!
- id: 12766
  text: >-
    Hace mucho ya que me

    desprendí de ese nombre...
- id: 12767
  text: >-
    ¡Suéltalo, incorpóreo!

    ¿Dónde está Kairi? ¿Y Riku?
- id: 12768
  text: No sé nada de ninguna Kairi.{:delay 83 00}{:clear }{:delay 30 00}{:clear }En cuanto a Riku...{:delay 71 00}{:clear }tal vez deberías preguntarle a tu rey.
- id: 12769
  text: ¡Alto!
- id: 12770
  text: ¡Se ha ido!
- id: 12771
  text: Sora... Goofy...
- id: 12772
  text: ¿Qué está pasando?
- id: 12773
  text: Habéis caído directo en su trampa.
- id: 12775
  text: ¿Xemnas?
- id: 12776
  text: El individuo que acabáis de ver.{:delay 5A 00}{:clear }{:delay 14 00}{:clear }Su líder.{:delay 5A 00}{:clear }{:delay 28 00}{:clear }¿Lo captas?{:delay 50 00}{:clear }{:delay 2D 00}{:clear }X-E-M, N-A-S.
- id: 12777
  text: >-
    ¿La Organización {XIII} quiere

    librarse de los sincorazón?
- id: 12778
  text: ¡Eres muy cortito!
- id: 12779
  text: >-
    Cada sincorazón que abate esa llave

    espada libera un corazón cautivo.
- id: 12780
  text: Y eso es lo que la Organización busca.
- id: 12781
  text: >-
    ¿Y qué piensan hacer esos

    tipos con los corazones?
- id: 12782
  text: No me chivaré.
- id: 12783
  text: ¡Habla!
- id: 12784
  text: >-
    ¡Tú! ¡Tú eres el que ha

    secuestrado a Kairi!
- id: 12785
  text: Bingo. Me llamo Axel. ¿Lo captas?
- id: 12786
  text: ¿¡Dónde está Kairi!?
- id: 12787
  text: Por favor. ¡Dímelo!
- id: 12788
  text: Mira, respecto a Kairi...{:delay 64 00}{:clear }{:delay 23 00}{:clear }lo siento.
- id: 12789
  text: ¡Axel!
- id: 12790
  text: ¡Oh, oh!
- id: 12791
  text: >-
    Nos aseguraremos de que

    reciba el máximo castigo.
- id: 12793
  text: >-
    Si es Kairi lo que te preocupa,

    tranquilo,{:delay A0 00}{:clear }estamos cuidando muy bien de ella.
- id: 12794
  text: Llévame con ella.
- id: 12795
  text: ¿Tan importante es para ti?
- id: 12796
  text: Sí. Más que nada.
- id: 12797
  text: Demuéstrame cuánto te importa.
- id: 12798
  text: Te lo ruego...
- id: 12800
  text: ¡Maldito...!
- id: 12801
  text: >-
    ¿Estás enfadado? ¿Me odias?{:delay B6 00}{:clear }{:delay 43 00}{:clear }Toma esa rabia y dirígela

    hacia los sincorazón.
- id: 12802
  text: >-
    Pobres sincorazón,

    acumulando corazones sin sentido.
- id: 12803
  text: >-
    Sin embargo, ni se imaginan

    el verdadero poder que albergan.
- id: 12804
  text: >-
    La furia de la llave espada

    libera esos corazones,
- id: 12805
  text: >-
    que se concentran en la oscuridad,

    sin dueño, libres...
- id: 12806
  text: >-
    hasta acabar formando el Reino

    de los Corazones, Kingdom Hearts.
- id: 12807
  text: >-
    Y cuando llegue ese momento,

    por fin podremos existir realmente.
- id: 12808
  text: ¿Pero qué diablos estás farfullando?
- id: 12809
  text: ¡Kingdom Hearts me pertenece a mí!
- id: 12810
  text: >-
    El corazón de todos los reinos,

    el corazón de todo lo que vive.
- id: 12811
  text: >-
    ¡Un dominio llamado

    Kingdom Hearts ha de ser solo mío!
- id: 12812
  text: ¡Maléfica, no! ¡No más sincorazón!
- id: 12813
  text: ¡No acepto órdenes de ti!
- id: 12814
  text: Necia...
- id: 12815
  text: ¡Oh, no!
- id: 12816
  text: >-
    Yo mantendré a estas criaturas a raya.{:delay A0 00}{:clear }¡Tú idea la forma de

    aniquilarlas para siempre!
- id: 12817
  text: ¡Maléfica!
- id: 12818
  text: >-
    No te equivoques.{:delay 64 00}{:clear }{:delay 19 00}{:clear }Ten por seguro que algún

    día me vengaré de ti.
- id: 12819
  text: ¡Maléfica!
- id: 12820
  text: ¡Márchate!
- id: 12821
  text: ¡No acepto órdenes de ti!
- id: 12822
  text: ¡Sora! ¡Vamos!
- id: 12823
  text: Pero... ¿qué pasa con...?
- id: 12824
  text: Veamos... ¿dónde lo dejamos?
- id: 12825
  text: ''
- id: 12826
  text: ¿De parte de quién estáis vosotros?
- id: 12827
  text: >-
    Los sincorazón siempre se

    alían con el más fuerte.
- id: 12828
  text: Bien, Sora.{:delay 3C 00}{:clear }{:delay 18 00}{:clear }Libera más corazones.
- id: 12829
  text: ¡No! ¡Los corazones!
- id: 12830
  text: >-
    Puede que todo cuanto hemos hecho...

    no haya servido de nada.{:delay FF 00}{:clear }{:delay 32 00}{:clear }¿¡Qué voy a hacer si no

    puedo usar la llave espada!?
- id: 12831
  text: >-
    ¡Imbéciles!{:delay 54 00}{:clear }¡No se puede confiar

    en vosotros para nada!
- id: 12832
  text: ¿Eh?
- id: 12833
  text: ¡Sora! ¡Donald! ¡Goofy!
- id: 12834
  text: Tranquilo.{:delay 3C 00}{:clear }{:delay 1E 00}{:clear }No sucumbirán tan fácilmente.
- id: 12835
  text: Ese elegido de la llave espada...{:delay 71 00}{:clear }{:delay 41 00}{:clear }es un chico con suerte.
- id: 12836
  text: Hasta pronto.
- id: 12837
  text: ¡Mentirosos!
- id: 12838
  text: ¿Qué?
- id: 12839
  text: León no tiene ningún tesoro.
- id: 12840
  text: Y eso que luchamos por vosotros.
- id: 12841
  text: ¿Donald...?
- id: 12842
  text: ¡Bueno, tenía que decirles algo!
- id: 12843
  text: >-
    No veo cómo vamos

    a arreglar esto.
- id: 12844
  text: Entonces, ¿qué hacemos?
- id: 12845
  text: Nos vamos a llevar vuestro tesoro.
- id: 12846
  text: ¡Pero si no tenemos nada!
- id: 12847
  text: ¿Seguro?
- id: 12848
  text: '{:delay 6A 00}¡Vamos a ver!'
- id: 12849
  text: ''
- id: 12850
  text: ¡Ajá!
- id: 12851
  text: ¡Bueno! ¡Está decidido!{:delay 6A 00}{:clear }¡Nos llevamos todos vuestros objetos!
- id: 12852
  text: Me estáis tomando el pelo.
- id: 12853
  text: ¡Venga ya!
- id: 12854
  text: ¡Esto apesta!
- id: 12855
  text: ¿No éramos amigos?
- id: 12856
  text: Mirad, sentimos el engaño, pero...
- id: 12858
  text: >-
    Así que no estaría bien

    que os quitásemos todo.
- id: 12860
  text: ¡Adiós! ¡Buena suerte!
- id: 12861
  text: ¿Qué hace Cloud?
- id: 12862
  text: Ni idea.
- id: 12863
  text: '{:delay 85 00}Por cierto, vosotros tres...{:delay BE 00}{:clear }{:delay 1F 00}{:clear }¿quiénes sois?'
- id: 12864
  text: No sé si deberíamos decírtelo.
- id: 12865
  text: ¡Vaya!{:delay 30 00}{:clear }{:delay 23 00}{:clear }¡Qué espada más rara llevas ahí!
- id: 12866
  text: ¡Es la llave espada!
- id: 12867
  text: >-
    Ya veo...{:delay 38 00}{:clear }{:delay 67 00}{:clear }Así que eso es una llave espada.{:delay 7F 00}{:clear }{:delay 48 00}{:clear }Y supongo que tú debes

    de ser el elegido.
- id: 12868
  text: ¿Y qué si lo soy?
- id: 12869
  text: >-
    Me pregunto si cambiará de opinión...

    cuando te derrote.
- id: 12870
  text: ¡Qué te parece!
- id: 12871
  text: Admito que eres muy hábil...{:delay 90 00}{:clear }{:delay 2B 00}{:clear }pero Cloud es el único...{:delay 7F 00}{:clear }{:delay 34 00}{:clear }que puede eliminarme.
- id: 12872
  text: >-
    {:delay AF 00}{:clear }Dile a Cloud que venga aquí.{:delay 85 00}{:clear }{:delay 37 00}{:clear }Dile que Sephiroth quiere

    ajustar cuentas.
- id: 12937
  text: '{:unk13 DF 00 EA 00}{:unk08 01 01 00}Está en las Oscuras Profundidades.'
- id: 12938
  text: >-
    {:unk13 92 00 34 00}{:unk08 01 01 06}Ya veo...{:clear }Pues es hora de que

    terminemos con esto.
- id: 12939
  text: '{:unk13 91 00 4B 00}{:unk08 01 01 06}Cloud...'
- id: 12940
  text: '{:unk13 A9 00 32 00}{:unk08 01 01 04}No estoy muy seguro...'
- id: 12941
  text: >-
    {:unk13 A5 00 4B 00}{:unk08 01 01 06}Si le ves,

    avísame.
- id: 12942
  text: ¿Le has dado mi mensaje?
- id: 12943
  text: Tal vez.
- id: 12944
  text: >-
    Siento haberte hecho esperar,

    Sephiroth.
- id: 12945
  text: Cloud...{:delay 2D 00}{:clear }{:delay 5E 00}{:clear }Nunca dejarás atrás la oscuridad...
- id: 12946
  text: Calla.
- id: 12947
  text: Nunca dejarás atrás tu pasado...
- id: 12948
  text: ¡Calla!
- id: 12949
  text: ¡Cloud! ¡A por él!
- id: 12950
  text: ''
- id: 12952
  text: ¡Por muchas veces que caiga...{:delay 7E 00}{:clear }{:delay 2D 00}{:clear }tu oscuridad me sigue llamando!
- id: 12953
  text: ''
- id: 12954
  text: ¡Mentira!
- id: 12955
  text: ¡Tifa! ¡No te acerques!
- id: 12956
  text: ¿¡Qué dices!?{:delay 32 00}{:clear }{:delay 19 00}{:clear }Quiero ayudarte.
- id: 12957
  text: No puedes.{:delay 3C 00}{:clear }{:delay 28 00}{:clear }Jamás abandonará la oscuridad.
- id: 12958
  text: >-
    No tiene por qué. Solo necesita

    a alguien que le rodee de luz.
- id: 12959
  text: >-
    La oscuridad seguirá ahí, Sephiroth...{:delay AE 00}{:clear }pero en un lugar al que

    tú no podrás llegar.
- id: 12960
  text: ¿No me digas?
- id: 12961
  text: A ver qué puede hacer esa luz tuya.
- id: 12962
  text: ¡No!
- id: 12965
  text: ¡Cuidado!
- id: 12967
  text: Cloud, puedes contar con mi luz.
- id: 12968
  text: La luz no va contigo.
- id: 12969
  text: Ni yo...{:delay 3C 00}{:clear }{:delay 73 00}{:clear }lo sé ya...
- id: 12970
  text: ¡Basta!
- id: 12971
  text: ¿Eh?
- id: 12972
  text: ''
- id: 12973
  text: ¿Dónde se han metido?
- id: 12974
  text: >-
    ¿Creéis que han vuelto

    a su propio mundo?
- id: 12975
  text: >-
    Han ido a otra parte...{:delay 69 00}{:clear }{:delay 5A 00}{:clear }Cloud ha ido a librar

    una gran batalla...{:delay 78 00}{:clear }{:delay 2D 00}{:clear }contra la oscuridad de su interior.
- id: 12976
  text: Se ha vuelto a ir.
- id: 12977
  text: ¿Qué vas a hacer ahora?
- id: 12978
  text: '{:delay 93 00}Supongo que seguir buscando.'
- id: 12980
  text: No te preocupes.{:delay 37 00}{:clear }{:delay 2D 00}{:clear }La luz es fácil de encontrar.
- id: 12981
  text: Me voy.{:delay 30 00}{:clear }{:delay 0F 00}{:clear }Tomad, esto es por ayudarme.
- id: 12982
  text: >-
    Pero... espera...

    ¿cuándo te hemos ayudado?
- id: 12983
  text: ''
- id: 12988
  text: ¿Habéis visto a Sephiroth?
- id: 12989
  text: >-
    {:unk13 00 01 40 01}{:unk08 02 00 06}¿Hablar sobre Sephiroth?

    {:chardelay 0A 00}No, no debería.

    {:chardelay 09 00}¡Por supuesto!
- id: 12990
  text: >-
    Olvidamos tantas cosas.

    A vosotros, la ciudad...{:clear }Ahora ya las recordamos. Las cosas

    queridas siempre quedan en el corazón.
- id: 12995
  text: >-
    Puedo sentirlo en mi corazón.{:clear }Sephiroth...

    sé que estás cerca.
- id: 12996
  text: >-
    Dile a Cloud que venga aquí, que

    Sephiroth quiere arreglar unos asuntos.
- id: 12997
  text: >-
    Aquí tampoco está. Sin embargo,

    siento que estoy cerca.{:clear }Seguro que le voy pisando los

    talones. Pronto le alcanzaré.
- id: 13019
  text: >-
    ¡Riquezas! ¡Riquezas!
              ¡Soy tan feliz! ♪{:clear }... ¡Ah! ¿¡Tú!?
- id: 13020
  text: >-
    ¡Eh, Rikku! Deja de cantar

    y escucha...{:clear }... ¿Eh? ¿¡Tú!?
- id: 13872
  text: '{:unk13 FA 00 2D 00}{:unk08 01 00 05}Pronto le veréis.'
- id: 13963
  text: >-
    No me interesa lo que le pase a

    este mundo.{:clear }Además, no creo que necesites más

    ayuda de la que ya tienes.
- id: 14151
  text: >-
    Pensé que sería más sabroso...

    No logro dar con el sabor justo.{:clear }Si pudiera hacer ese helado,

    sé que a todos les encantaría.{:clear }¡Y yo ganaría una fortuna!
- id: 14247
  text: >-
    {:unk13 D2 00 37 00}{:unk08 01 00 06}¡Santas gaitas!

    ¡Lo he logrado!{:clear }¡He vuelto a conseguir el

    ‛Helado de sal marina’!
- id: 14248
  text: >-
    {:unk13 72 01 8C 00}{:unk08 01 00 06}¡Mmm!

    ¿Podemos probarlo?
- id: 14249
  text: '{:unk13 FF 00 41 00}{:unk08 01 00 05}¡Por supuesto!'
- id: 14250
  text: '{:unk06 02}{:unk13 45 01 32 00}{:unk08 03 00 05}¡Porras! ¡Está bueno!'
- id: 14251
  text: '{:unk06 02}{:unk13 13 01 3F 00}{:unk08 03 00 05}¡Qué salado!'
- id: 14252
  text: '{:unk13 A4 01 6E 00}{:unk08 01 00 06}¡Y dulce!'
- id: 14253
  text: >-
    {:unk13 C8 00 78 00}{:unk08 01 00 05}Sí. ¡Es único!{:clear }Cuando era un muchacho, a

    todos los críos nos encantaba.
- id: 14294
  text: >-
    Puede que todo cuanto hemos hecho...

    no haya servido de nada.{:delay FF 00}{:clear }{:delay 32 00}{:clear }¿¡Qué voy a hacer si no

    puedo usar la llave espada!?
- id: 14295
  text: ¡Imbéciles!{:delay 54 00}{:clear }¡No se puede confiar en vosotros para nada!
- id: 14296
  text: ¿Eh?
- id: 14297
  text: ''
- id: 14672
  text: >-
    Sí, un farsante. Pero había que

    detenerle de todas formas.
- id: 14755
  text: >-
    Bastión Hueco tiene un problema...

    y muy gordo.
- id: 15149
  text: >-
    ¡Más quisieras! Puedes decir lo que

    quieras, pero eso no cambiará nada.
- id: 15150
  text: ¡Pues te apartaremos por las malas!
- id: 15151
  text: >-
    Pero no lo soy. Estoy con la

    Organización y no me dais ningún miedo.
- id: 15152
  text: >-
    ¡Ja! {:delay 22 00}{:clear }¡Gran discurso para alguien

    que se queda al margen mientras {:delay 7E 00}{:clear }los incorpóreos luchan por él!
- id: 15153
  text: >-
    Vaya, vaya. {:delay 46 00}{:clear }{:delay 19 00}{:clear }Os habéis llevado una

    impresión equivocada.
- id: 15154
  text: ¿Y vas a llorar?
- id: 15155
  text: >-
    ¡Más quisieras!{:delay 3C 00}{:clear }¿Y si te recuerdo lo duros que son

    aquellos a los que os enfrentáis?
- id: 15156
  text: ¿Recordarme?
- id: 15157
  text: '{:delay B0 00}{:clear }Así es. Él solía poner esa misma cara.'
- id: 15158
  text: >-
    Supongo que crees que puedes ponerme

    nervioso diciendo cosas a lo loco.
- id: 15159
  text: ¡Portaos bien!
- id: 15160
  text: ¡Porras! ¡Se ha escapado!
- id: 15161
  text: ¡Qué extraño! {:delay 4B 00}{:clear }{:delay 23 00}{:clear }¿Qué es eso de "la misma cara"?
- id: 15162
  text: >-
    Eh, yo creo que solo

    intentaba confundirte.
- id: 15163
  text: ¿Eh?
- id: 15164
  text: ¿Qué es esto?
- id: 15165
  text: ¿No será...?
- id: 15166
  text: >-
    Puede que haya abierto la puerta

    como dijo Yen Sid.
- id: 15167
  text: ¡Vaya!
- id: 15168
  text: Lo siento, León, {:delay 69 00}{:clear }{:delay 1E 00}{:clear }pero los demás mundos nos llaman.
- id: 15169
  text: >-
    La Organización {XIII}...{:delay 64 00}{:clear }{:delay 50 00}{:clear }Parecen muy duros.

    Tened cuidado por ahí fuera.
- id: 15170
  text: Hasta pronto.
- id: 15173
  text: >-
    {:unk13 A0 00 E3 00}{:unk08 01 01 02}¿Y también algo sobre el

    Reino de la Oscuridad?{:clear }Parece que allí es

    donde están Riku y Kairi.
- id: 15174
  text: '{:unk13 9A 01 BE 00}{:unk08 01 00 05}Porras...'
- id: 15175
  text: >-
    {:unk13 91 00 37 00}{:unk08 01 01 06}Iremos a ver a

    Tron.
- id: 15255
  text: Sí que se te ve algo cambiado, Cloud...
- id: 15256
  text: ¿Ocurre algo?
- id: 15257
  text: Ehh...
- id: 15258
  text: No es nada.
- id: 15259
  text: ''
- id: 15260
  text: No te metas en esto.
- id: 15261
  text: >-
    Querrás decir que no me quieres

    a tu lado cuando te marches.
- id: 15263
  text: ¿En serio?
- id: 15264
  text: Sí.
- id: 15265
  text: >-
    ¿Ves? No pareces muy seguro. {:delay 91 00}{:clear }{:delay 64 00}{:clear }Bueno, vale, lo comprendo.

    Vete. Haz lo que debas.
- id: 15266
  text: ¿Eh?
- id: 15267
  text: Por muy lejos que estés de aquí,{:delay 70 00}{:clear }{:delay 4D 00}cuando halles tu luz... {:delay 51 00}{:clear }{:delay 37 00}{:clear }seguro que te guiará de vuelta...{:delay 7A 00}{:clear }{:delay 4F 00}¿Verdad?
- id: 15268
  text: Supongo.
- id: 15269
  text: Pues yo me quedaré aquí...{:delay 51 00}{:clear }{:delay 37 00}{:clear }y pensaré en ti.{:delay 70 00}{:clear }{:delay 46 00}¿Vale, Cloud?
- id: 15270
  text: Vale.
- id: 15271
  text: ¿Crees que le irá bien?
- id: 15272
  text: Le irá bien.{:delay 33 00}{:clear }{:delay 5C 00}{:clear }Seguro que aún conserva algo de luz.
- id: 15273
  text: Tienes razón.
- id: 15278
  text: >-
    Es que... {:delay 32 00}{:clear }{:delay 78 00}{:clear }Escucha, aunque me

    vaya lejos, volveré.
- id: 15610
  text: >-
    Me alegra que todos estén bien,

    pero aún no podemos detenernos.{:clear }¡Por lo que más queráis,

    debemos mantenernos unidos!
- id: 15774
  text: >-
    Vamos, es todo un montaje

    de la Organización {XIII}.
- id: 15775
  text: >-
    Xemnas os está utilizando

    para destruir a los sincorazón.{:delay D2 00}{:clear }Ese es su plan maestro.
- id: 15963
  text: Olvídalo.
- id: 15964
  text: >-
    León nos lo ha contado todo.{:delay 62 00}{:clear }{:delay 24 00}{:clear }Dice que vuestro viaje

    ha sido bastante duro.
- id: 15965
  text: ¡Os vamos a animar!
- id: 15966
  text: ¡Tomad, esto es un regalo!
- id: 15967
  text: >-
    Perdonad, ¿sois del

    Comité de Reconstrucción?
- id: 15968
  text: ¿Qué trama la pandilla de León?
- id: 16056
  text: >-
    {:unk13 B2 00 39 00}{:unk08 01 01 07}Están justo

    por allí.
- id: 16057
  text: ¿Qué sitio es este?
- id: 16058
  text: ¡El Reino de la Oscuridad!
- id: 16059
  text: ¡Kairi! ¡Riku!
- id: 16060
  text: ¿¡Quién anda ahí!?
- id: 16061
  text: ¿Qué es esto?
- id: 16062
  text: ¿Seguro que quieres abrir...
- id: 16063
  text: '... eso?'
- id: 16064
  text: >-
    ¡Ahí va!

    Es la panda de Villa Crepúsculo.{:delay B8 00}{:clear }Están Hayner, Pence, Olette...{:delay 91 00}{:clear }Y, ehm...
- id: 16065
  text: Roxas.
- id: 16066
  text: ¿Le conoces?
- id: 16067
  text: >-
    No...{:delay 2D 00}{:clear }{:delay 2F 00}{:clear }Me ha venido ese nombre de repente.

    Él es... Roxas.
- id: 16068
  text: ¿Seguro que quieres comerte...
- id: 16069
  text: '... eso?'
- id: 16070
  text: ¿Salado?...{:delay 50 00}{:clear }{:delay 14 00}{:clear }¡No!... ¡Dulce!
- id: 16071
  text: >-
    ¡Aún no!

    ¡Tengo que buscar a Kairi!
- id: 16072
  text: ¿Sabes adónde ir?
- id: 16750
  text: ¡León ha caído! ¡Usa Sanar para despertarlo!
- id: 17002
  text: Un retrato de Ansem.
- id: 17003
  text: >-
    Un retrato del hombre al que

    confundiste con Ansem.
- id: 17004
  text: Un retrato de Xehanort.
- id: 17005
  text: >-
    El garabato dice

    ‛Door to Darkness’.
- id: 17006
  text: No sabes para qué sirve este aparato.
- id: 17007
  text: Este aparato te permite ver a Tron.
- id: 17008
  text: Está cerrada con un sistema especial.
- id: 17624
  text: >-
    {:unk0f 03 1E 00 59 01}{:color #00F0F080}Se ha agregado el comando Magia.{:reset}

    Al usar magia, consumes PM en el

    indicador de la parte inferior derecha.{:clear }{:unk0f 00 00 00 00 00}Para usar accesos directos, pulsa {:icon dynamic-l1}.

    Al acabarse, los PM se recuperan en los

    círculos de luz o después de un tiempo.
- id: 17625
  text: >-
    {:unk0f 03 1E 00 59 01}{:color #00F0F080}Se ha agregado el comando Invocar.{:reset}

    Al usarlo, el indicador de Fusión se convierte en el de Invocar.{:clear }{:unk0f 00 00 00 00 00}El personaje invocado reemplaza al resto del grupo.

    Prueba las diferentes acciones que aparecen

    con cada invocación.
- id: 17626
  text: >-
    {:unk0f 01 02 01 96 00}En las ciudades, habla con los Moguris.

    Pueden fabricar objetos con varios materiales.{:clear }{:unk0f 00 00 00 00 00}Recoge los materiales necesarios

    para la fabricación de objetos.
- id: 17845
  text: ¡Derrota a todos los enemigos!
- id: 17846
  text: >-
    ¡Derrota a todos los enemigos!

    Si usas los comandos de reacción

    con {:icon dynamic-triangle}, ¡la batalla será más fácil!
- id: 17863
  text: >-
    Si nos separamos, como ya pasó, no

    podremos ayudarnos mutuamente.{:clear }En momentos así, ¡no debemos

    dar tregua a nuestros enemigos!
- id: 17864
  text: >-
    ¡Vaya! No sé qué ha ocurrido,

    ¡pero siento haberos preocupado!{:clear }¿Qué sucederá ahora? ¡Debemos

    estar preparados para lo que sea!
- id: 17865
  text: >-
    ¡Qué carácter tiene esa chiquilla!

    Creí que iba a destrozarlo todo.{:clear }Aunque quizá haya roto algo.

    ¿Podrías ir a revisar el estudio?
- id: 17866
  text: >-
    ¡El rey se ha adelantado solo!

    ¡Tenemos que ir tras él! ¡Deprisa!
- id: 17867
  text: >-
    Esa explosión vino de afuera, ¿no?

    ¡Debe de estar pasando algo terrible!{:clear }Me temo que será una larga batalla.

    ¿Estás preparado, Sora?
- id: 17868
  text: >-
    Hay quien, si tiene la oportunidad,

    puede convertirse en héroe.{:clear }Nunca pierdas tu coraje ni tu

    compasión por los otros, Sora.
- id: 17869
  text: >-
    Una vez que el programa de Cid esté

    listo, lo enviaré desde el {:theme 0A}estudio{:reset}.{:clear }Pero, si perdemos a Tron, será inútil.

    Ve y ayúdale, Sora.
- id: 17870
  text: >-
    Parece que has crecido un montón

    este último año.{:clear }No me refiero solo a tu cuerpo.

    Te has vuelto aún más fuerte.{:clear }Ese es el Sora que conozco.
- id: 17871
  text: >-
    El sistema de defensa ha sido restaurado

    y nos hemos ocupado del PCM.{:clear }Ahora debéis continuar vuestro viaje.

    Si nos necesitáis, contad con nosotros.
- id: 17872
  text: >-
    ¡Va a ser genial ser del Comité de

    Reconstrucción del Vergel Radiante!{:clear }¡No veo la hora! Atentos, ciudadanos.

    ¡Aquí viene la gran ninja Yuffie!
- id: 17919
  text: Todo eso me da igual.
- id: 17920
  text: >-
    Déjame entrar en el

    Reino de la Oscuridad, ¿vale?
- id: 17927
  text: >-
    ¿Ya le has encontrado?

    Me alegro de que esté bien.{:clear }Creo que si uno busca lo suficiente,

    siempre da con lo que quiere.{:clear }¿Por dónde debería seguir ahora?
- id: 17928
  text: >-
    Últimamente tenemos muchos

    problemas.{:clear }Mira esa extraña máquina de mi

    cuarto. ¡Arruina el ambiente!
- id: 17929
  text: >-
    La magia es muy útil y puede

    combinarse con otras acciones.{:clear }Muchos son capaces de usar

    magia, así que no olvides practicar.
- id: 17930
  text: >-
    Dicen que la ciudad puede ser

    reconstruida sin ordenadores.{:clear }Merlín estaba en contra de ellos.

    Decía que interferían en todo.
- id: 17931
  text: >-
    León estaba preocupado por vosotros.

    No dijo nada, pero era evidente.{:clear }¡Ja! ¡No entiendo por qué los hombres

    siempre ocultan sus sentimientos!
- id: 17932
  text: >-
    Veo que estáis todos más

    animados que nunca.{:clear }Mantened la calma, amigos.

    Recordad que esto no es un juego.
- id: 17933
  text: >-
    Existen muchas armas extrañas.

    Algunas destinadas a los elegidos.{:clear }Esas armas están fuertemente

    ligadas a sus amos.{:clear }Tú y tu llave espada

    sois una muestra.
- id: 17934
  text: >-
    Tron ya está bien y la reconstrucción

    de la ciudad sigue en marcha.{:clear }Cuando la ciudad esté restaurada,

    haremos una fiesta en vuestro honor.
- id: 17935
  text: >-
    Protegeremos la ciudad.

    Tú ve tras el jefe enemigo.{:clear }No te preocupes.

    ¡Confía en mí, muchacho!
- id: 17936
  text: >-
    Hay demasiados enemigos hasta para

    León. Tenéis que echarle una mano.{:clear }Podéis llegar hasta él a través de la

    pared rota del patio interior. ¡Deprisa!
- id: 17937
  text: >-
    ¡Vosotros sí que sabéis pelear!

    ¡También mi ninjutsu es poderoso!{:clear }¡Mirad! Hiiiioh... Un momento. Si

    hiciera eso, podría derribar la casa.
- id: 17938
  text: >-
    ¿¡Qué está pasando!? ¿Tendrá

    algo que ver con esos programas?{:clear }Si es así, id por ese terminal y

    arregladlo con Tron.
- id: 17939
  text: >-
    ¡La ciudad entera está temblando!

    Sora, ¿qué ocurre ahí dentro?
- id: 18015
  text: >-
    Así que te importa de verdad.

    En tal caso...
- id: 18016
  text: La respuesta es no.
- id: 18017
  text: Absurdo.
- id: 18018
  text: >-
    Nada ganarás derrotándome.

    Tú lo sabes mejor que nadie, Cloud.
- id: 18074
  text: >-
    Mmm.

    Aquí tampoco está.{:clear }Bueno, no voy a dejar que

    se oculte de mí siempre.
- id: 18075
  text: >-
    He puesto el libro en el estante.{:clear }¿Por qué tardará tanto Merlín?

    Espero que Pooh esté bien.
- id: 18076
  text: >-
    Hablaré con Merlín. Tú ve a ver

    qué ha pasado dentro del libro.{:clear }Ha recibido una buena sacudida.

    Ojalá que Pooh y los otros estén bien.
- id: 18225
  text: Esto son notas sobre la oscuridad.
- id: 18226
  text: >-
    Esto son notas sobre

    los corazones del mundo.
- id: 18227
  text: >-
    Esto son notas sobre

    las conexiones entre mundos.
- id: 18228
  text: >-
    Esta tubería suministra energía

    a la ciudad.
- id: 18229
  text: >-
    Puedes ver el Valle del Villano,

    donde vivía Maléfica.
- id: 18230
  text: >-
    Ante ti se extiende una

    profunda garganta.
- id: 18231
  text: >-
    Esta máquina controla el sistema

    de seguridad de la pared.
- id: 18232
  text: Esta grúa se usa para reconstruir la ciudad.
- id: 18233
  text: >-
    Con este hielo se podrían

    hacer buenos helados.
- id: 18234
  text: >-
    Aquí se guardan materiales de

    construcción.
- id: 18235
  text: Esta tienda es un refrigerador gigante.
- id: 18236
  text: Un plano de la red eléctrica de la ciudad.
- id: 18237
  text: Planos del sistema de defensa.
- id: 18238
  text: >-
    Este ordenador ha sido modificado

    para uso personal de Cid.
- id: 18239
  text: Una pizarra para reuniones de estrategia.
- id: 18240
  text: Hay cabellos de la barba de Merlín.
- id: 18241
  text: >-
    Esta máquina se usa para

    estudios de magia.
- id: 18242
  text: >-
    La maleta preferida de Merlín.

    Muy espaciosa.
- id: 18243
  text: >-
    Un diario sobre los mundos que

    Merlín ha visitado y sobre el futuro.
- id: 18244
  text: >-
    En este libro, se describen con detalle

    los hechizos creados por Merlín.
- id: 18245
  text: >-
    Este es el armario que Merlín

    siempre reduce de tamaño.
- id: 18708
  text: >-
    ¡Demyx te ha desafiado a una serie de

    pruebas! ¡Supéralas y enfréntate a él!
- id: 18709
  text: >-
    ¡Válete de todas tus estrategias y habilidades

    para vencer a Sephiroth!
- id: 18836
  text: >-
    {:unk13 FA 00 3C 00}{:unk08 01 01 06}Un momento, Sora.{:clear }¿Qué hay de

    tu magia?
- id: 18837
  text: '{:unk13 18 01 64 00}{:unk08 01 00 05}¿Eh?{:clear }Ah, pues la verdad...'
- id: 18838
  text: >-
    {:unk13 C8 00 46 00}{:unk08 01 01 07}¡Tal vez te hayas

    olvidado mientras

    dormías!
- id: 18839
  text: >-
    {:unk13 AA 00 46 00}{:unk08 01 01 07}Ay, ¿qué haré contigo?{:clear }Bueno, tendré que

    prestarte algunos

    hechizos.{:clear }¡Pero debes tener

    cuidado!
- id: 18840
  text: >-
    {:unk13 AC 00 53 00}{:unk08 01 01 05}¡Gracias,

    Merlín!
- id: 18841
  text: >-
    {:unk13 68 01 D2 00}{:unk08 01 00 05}¡Al patio interior,

    y rápido!
- id: 18842
  text: >-
    {:unk13 BB 00 48 00}{:unk08 01 00 06}¡Ah! Una cosa más.{:clear }Sora, deja que otorgue nuevos

    poderes a tus prendas.
- id: 18843
  text: '{:unk13 F0 00 64 00}{:unk08 01 01 06}¿¡En serio!?'
- id: 18844
  text: >-
    {:unk13 A9 00 4C 00}{:unk08 01 00 06}¡Pues claro!{:clear }Has hecho tantas cosas...

    Considéralo una muestra

    de agradecimiento.
- id: 18845
  text: >-
    {:unk13 A0 00 4B 00}{:unk08 01 01 07}¡Gracias, Majestad!{:clear }Ahora tenemos que

    reunirnos con Tron.{:clear }¿Podríais esperarnos

    aquí?
- id: 18846
  text: >-
    {:unk13 DE 00 4E 00}{:unk08 01 00 05}Lo haré, Sora.

    Y recuerda: ¡ten cuidado!
- id: 18847
  text: >-
    {:unk13 18 01 46 00}{:unk08 01 01 06}Ahora bien, el libro no es

    lo único valioso...{:clear }Esto es para ti, Sora.
- id: 18848
  text: '{:unk13 FA 00 5A 00}{:unk08 01 00 05}¿Qué es?'
- id: 18849
  text: >-
    {:unk13 A0 00 46 00}{:unk08 01 01 06}Basta con que te concentres

    en esto con todo tu

    corazón...{:clear }y con solo nombrarlo

    podrás invocar

    a un aliado...{:clear }para que te ayude en

    los momentos difíciles.
- id: 18850
  text: >-
    {:unk13 DC 00 46 00}{:unk08 01 00 05}¿Como lo hacían Simba y Mushu

    la última vez que estuvimos aquí?
- id: 18851
  text: >-
    {:unk13 C8 00 3C 00}{:unk08 01 01 06}Exactamente.{:clear }¡Ahora, tú y tus amigos

    debéis seguir adelante!
- id: 18852
  text: >-
    {:unk13 DC 00 46 00}{:unk08 01 00 06}Gracias, Merlín.{:clear }Estamos preocupados por Pooh,

    así que volveremos en cuanto

    encontremos las páginas arrancadas.
- id: 18908
  text: >-
    He inventado un nuevo producto:

    un monopatín. ¿Quieres ver cómo anda?
- id: 18909
  text: >-
    {:unk13 00 01 40 01}{:unk08 02 00 06}Qué oportuno. ¿Lo pruebas?

    {:chardelay 33 00}No, estoy muy ocupado.

    {:chardelay 52 00}Claro, ¿por qué no?
- id: 18910
  text: >-
    No consigo el sabor del helado, pero

    al menos mis monopatines van bien.
- id: 18911
  text: >-
    {:unk13 00 01 40 01}{:unk08 02 00 06}Qué oportuno. ¿Otra vez?

    {:chardelay 33 00}No, estoy muy ocupado.

    {:chardelay 52 00}Claro, ¿por qué no?
- id: 18912
  text: >-
    Necesito mejorar mi monopatín.

    ¿Podrías ayudarme?
- id: 18913
  text: >-
    {:unk13 00 01 40 01}{:unk08 02 00 06}¿Quieres probar el monopatín?

    {:chardelay 33 00}No, estoy muy ocupado.

    {:chardelay 52 00}Seguro, ¿por qué no?
- id: 19322
  text: >-
    ¿Tienes alguna página del libro de

    Pooh? Están esparcidas por los mundos.{:clear }¡Encuéntralas todas! Sé que Pooh

    y sus amigos te importan mucho.
- id: 19323
  text: >-
    ¿¡Qué está pasando!? ¡La ciudad está

    infestada de incorpóreos y sincorazón!{:clear }León y los otros han ido al patio

    interior. ¡Vayamos a buscarlos!
- id: 19324
  text: >-
    Así que ese era Sephiroth.

    Se parece un poco a Cloud.{:clear }Me gustaría avisarle, pero

    antes hay que ayudar a los demás.
- id: 19566
  text: >-
    Esto son notas sobre el

    corazón humano.
- id: 19748
  text: Bastión Hueco
- id: 19860
  text: Maléfica quiere apoderarse del castillo...
- id: 19864
  text: ¡No puede seeeeer!
- id: 19871
  text: '[Gracias.]'
- id: 19889
  text: '[¡Gracias!]'
- id: 20173
  text: >-
    {:unk08 02 00 06}¿Quieres enfrentarte a una versión más

    fuerte de Xemnas a partir de sus datos?

    {:chardelay 33 00}Ahora no.

    {:chardelay A1 00}¡A batirse tocan!
- id: 20174
  text: >-
    {:unk08 02 00 06}¿Quieres enfrentarte a una versión más

    fuerte de Xigbar a partir de sus datos?

    {:chardelay 33 00}Ahora no.

    {:chardelay A2 00}¡A batirse tocan!
- id: 20175
  text: >-
    {:unk08 02 00 06}¿Quieres enfrentarte a una versión más

    fuerte de Xaldin a partir de sus datos?

    {:chardelay 33 00}Ahora no.

    {:chardelay A3 00}¡A batirse tocan!
- id: 20176
  text: >-
    {:unk08 02 00 06}¿Quieres enfrentarte a una versión más

    fuerte de Vexen a partir de sus datos?

    {:chardelay 33 00}Ahora no.

    {:chardelay A4 00}¡A batirse tocan!
- id: 20177
  text: >-
    {:unk08 02 00 06}¿Quieres enfrentarte a una versión más

    fuerte de Lexaeus a partir de sus datos?

    {:chardelay 33 00}Ahora no.

    {:chardelay A5 00}¡A batirse tocan!
- id: 20178
  text: >-
    {:unk08 02 00 06}¿Quieres enfrentarte a una versión más

    fuerte de Zexión a partir de sus datos?

    {:chardelay 33 00}Ahora no.

    {:chardelay A6 00}¡A batirse tocan!
- id: 20179
  text: >-
    {:unk08 02 00 06}¿Quieres enfrentarte a una versión más

    fuerte de Saïx a partir de sus datos?

    {:chardelay 33 00}Ahora no.

    {:chardelay A7 00}¡A batirse tocan!
- id: 20180
  text: >-
    {:unk08 02 00 06}¿Quieres enfrentarte a una versión más

    fuerte de Axel a partir de sus datos?

    {:chardelay 33 00}Ahora no.

    {:chardelay A8 00}¡A batirse tocan!
- id: 20181
  text: >-
    {:unk08 02 00 06}¿Quieres enfrentarte a una versión más

    fuerte de Demyx a partir de sus datos?

    {:chardelay 33 00}Ahora no.

    {:chardelay A9 00}¡A batirse tocan!
- id: 20182
  text: >-
    {:unk08 02 00 06}¿Quieres enfrentarte a una versión más

    fuerte de Luxord a partir de sus datos?

    {:chardelay 33 00}Ahora no.

    {:chardelay AA 00}¡A batirse tocan!
- id: 20183
  text: >-
    {:unk08 02 00 06}¿Quieres enfrentarte a una versión más

    fuerte de Marluxia a partir de sus datos?

    {:chardelay 33 00}Ahora no.

    {:chardelay AB 00}¡A batirse tocan!
- id: 20184
  text: >-
    {:unk08 02 00 06}¿Quieres enfrentarte a una versión más

    fuerte de Larxene a partir de sus datos?

    {:chardelay 33 00}Ahora no.

    {:chardelay AC 00}¡A batirse tocan!
- id: 20185
  text: >-
    {:unk08 02 00 06}¿Quieres enfrentarte a una versión más

    fuerte de Roxas a partir de sus datos?

    {:chardelay 33 00}Ahora no.

    {:chardelay AD 00}¡A batirse tocan!
- id: 20239
  text: >-
    Un dispositivo de control y almacenamiento

    de datos. El corredor se ha abierto.
- id: 20337
  text: >-
    No es posible seguir por aquí.

    Habrá que buscar otro camino.
- id: 20358
  text: Ha pasado mucho tiempo, "viejo amigo".
- id: 20541
  text: Usa ataques potentes para abrir las válvulas. ¡Tienes que abrir las tres a la vez!
- id: 20543
  text: >-
    ¡Vence a Vexen de la Organización {XIII}!

    Rompe su escudo para poder dañarle.

    ¡Evita los círculos o robará tus datos!
- id: 20544
  text: >-
    ¡Vence a Zexión de la Organización {XIII}!

    ¡No pierdas de vista su libro mágico!
- id: 20545
  text: >-
    ¡Vence a Marluxia de la Organización {XIII}!

    Pierdes si el contador sobre la cabeza

    llega a cero con los golpes de guadaña.

    ¡Aprovecha los comandos de reacción!
- id: 20546
  text: >-
    ¡Vence a Larxene de la Organización {XIII}!

    Cuando se multiplique, ataca a dos de sus

    dobles a la vez e infligirás el doble de daño.
- id: 20547
  text: >-
    ¡Vence a Lexaeus de la Organización {XIII}!

    Su fuerza va aumentando durante la

    batalla. ¡Contraatacar es tu mejor opción!
- id: 20600
  text: ¡Pulsa {:icon dynamic-triangle} para comenzar el duelo! ¡Golpéalo y haz que no deje de girar!
- id: 20693
  text: ¡Pierdes si el contador llega a cero!
- id: 20697
  text: ¡Rescata a tus amigos atrapados en el libro!
- id: 21388
  text: '{:unk13 31 01 5A 00}{:unk08 01 00 05}¿Eh?'
- id: 21389
  text: '{:unk13 82 00 37 00}{:unk08 01 01 06}Creo que han salido de ahí.'
- id: 21390
  text: >-
    {:unk13 54 01 8C 00}{:unk08 01 00 05}¿Desde cuándo hay ahí

    un agujero? ¿Habrá algo dentro?
- id: 21391
  text: >-
    {:unk06 02}{:unk13 A0 00 A0 00}{:unk08 03 01 05}¡Ya habrá tiempo para eso!

    ¡Debemos ir tras el rey!
- id: 21483
  text: "{:delayandfade 08 78} \nSegún Merlín, Pooh no recuerda\nnada porque los sincorazón han\nrobado algunas páginas de su libro.\n \nSora tiene que apresurarse en\nrecuperar una a una las páginas y\nregresar al mundo del simpático osito\nantes de que la cosa empeore.\n \n \n"
- id: 21484
  text: "{:delayandfade 0A 78} \nSora vuelve a la casa de Merlín y\nrecibe de Cid la noticia de que el\nordenador de Ansem ha aparecido\ny que podría contener datos sobre\nRiku, Kairi, el rey y la Organización {XIII}.\n \nEntusiasmados por el hallazgo,\nSora, Donald y Goofy se apresuran\nhacia la sala del ordenador.\n \n"
- id: 21485
  text: "{:delayandfade 07 B4} \nGracias a la inestimable ayuda de Tron,\nSora y los suyos logran regresar al mundo\nreal, pero aún queda mucho por hacer.\n \n \n \n \n \n \n"
- id: 21486
  text: "{:delayandfade 08 78} \nEs necesaria una contraseña\npara acceder a los datos de\nlas investigaciones de Ansem,\ny qué mejor lugar para buscarla\nque su propio estudio.\n \nSora y sus amigos saben que\ndar con ella no será una tarea\nfácil, pero tras un registro\nminucioso...\n"
- id: 21487
  text: "{:delayandfade 0A 78} \nUn año atrás, Sora y sus amigos\nse enfrentaron a un vil sincorazón\nque pretendía hacerse con\nKingdom Hearts: Ansem, el buscador\nde oscuridad.\n \nSin embargo, ahora descubren que\nno es ese su verdadero nombre.\nAquel sincorazón era un impostor\nque simplemente suplantó tal nombre."
- id: 21488
  text: "{:delayandfade 0A 78} \nEl infame líder de la Organización {XIII}.\nEl incorpóreo de Xehanort, el aprendiz\nde Ansem.\n \n \n \n \n \n \n \n"
- id: 21489
  text: "{:delayandfade 0A 78} \nHa llegado el momento de\nponer fin a la contienda.\n \n¡Xehanort no puede escaparse!\n \n \n \n \n \n \n"
- id: 21490
  text: "{:delayandfade 0A 78} \n¿Cómo pueden estar los sincorazón\ndel entorno de datos de Tron en\nel mundo real?\n \nSegún Yuffie, el PCM está moviendo\nlos hilos de su malvado plan desde\nel mundo de los ordenadores.\n \n \n \n"
- id: 21491
  text: "{:delayandfade 0A 78} \nNo hay forma de contactar con Tron\nasí que las esperanzas recaen en Cid,\nque está desarrollando el programa\nde Erradicación del PCM.\n \n \n \n \n \n"
- id: 21492
  text: "{:delayandfade 08 78} \nAsí las cosas, no queda sino ir\nal mundo de Tron y hablar con él\ndirectamente.\n \nMientras Aerith y los demás se\nencargan de las cosas en el mundo\nde los usuarios, Sora debe entrar\nde nuevo en el entorno de datos.\n \n \n"
- id: 21493
  text: "{:delayandfade 0A 78} \nNada más compartir con Cloud\nlas palabras de Sephiroth, el joven\nagacha la cabeza y reflexiona...\n \n\"Pues es hora de que terminemos\ncon esto\", sentencia.\n \n \n \n"
- id: 21565
  text: ¡Tus comandos están en el libro! ¡Libéralos!
- id: 21566
  text: ¡Ya puedes usar los comandos!
- id: 21623
  text: ¡Encuentra al verdadero antes de que sea tarde!
